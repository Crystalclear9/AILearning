<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
<title>重复索引需要散射累加</title><desc>两个记录虽然读取同一个参数位置，却分别产生梯度贡献。反向传播必须把两份贡献加到同一行，得到五；这与是否复制读取结果是两个问题。 普通高级索引的增量赋值可能采用缓冲语义，不能直接当作按索引逐项执行。应使用明确的散射累加或先按编号归约，再按既定的损失分母更新参数。</desc>
<rect width="1200" height="680" fill="white" />
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker><marker id="tip-2563eb" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2563eb" /></marker><marker id="tip-e07828" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#e07828" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">重复索引需要散射累加</text>
<text x="60" y="115" font-size="24" fill="#18324d" text-anchor="start">读取索引：两条记录都指向第 1 行</text>
<rect x="60" y="155" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="122.5" y="236.25" font-size="23" fill="#18324d" text-anchor="middle">记录 A</text>
<rect x="185" y="155" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="247.5" y="236.25" font-size="23" fill="#18324d" text-anchor="middle">索引 1</text>
<rect x="310" y="155" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="372.5" y="236.25" font-size="23" fill="#18324d" text-anchor="middle">贡献 2</text>
<rect x="60" y="280" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="122.5" y="361.25" font-size="23" fill="#18324d" text-anchor="middle">记录 B</text>
<rect x="185" y="280" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="247.5" y="361.25" font-size="23" fill="#18324d" text-anchor="middle">索引 1</text>
<rect x="310" y="280" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="372.5" y="361.25" font-size="23" fill="#18324d" text-anchor="middle">贡献 3</text>
<text x="650" y="115" font-size="24" fill="#18324d" text-anchor="start">参数梯度缓冲区</text>
<rect x="650" y="155" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="702.5" y="223.25" font-size="23" fill="#18324d" text-anchor="middle">行 0</text>
<rect x="755" y="155" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="807.5" y="223.25" font-size="23" fill="#18324d" text-anchor="middle">0</text>
<rect x="650" y="260" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="702.5" y="328.25" font-size="23" fill="#18324d" text-anchor="middle">行 1</text>
<rect x="755" y="260" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="807.5" y="328.25" font-size="23" fill="#18324d" text-anchor="middle">5</text>
<rect x="650" y="365" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="702.5" y="433.25" font-size="23" fill="#18324d" text-anchor="middle">行 2</text>
<rect x="755" y="365" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="807.5" y="433.25" font-size="23" fill="#18324d" text-anchor="middle">0</text>
<line x1="440" y1="215" x2="640" y2="307" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="" marker-end="url(#tip-2563eb)" />
<line x1="440" y1="340" x2="640" y2="307" stroke="#e07828" stroke-width="2.5" stroke-dasharray="" marker-end="url(#tip-e07828)" />
<text x="485" y="445" font-size="30" fill="#059669" text-anchor="start">2 + 3 = 5</text>
<text x="70" y="505" font-size="26" fill="#18324d" text-anchor="start">相同索引 → 同一存储位置 → 梯度贡献必须相加</text>
<text x="70" y="560" font-size="22" fill="#18324d" text-anchor="start">明确使用散射累加；普通高级索引 += 不保证逐项累加语义。</text>
<text x="40" y="650" font-size="18" fill="#64748b" text-anchor="start">原创教学图 · 本地矢量图；数值与适用条件见正文图解</text>
</g></svg>
