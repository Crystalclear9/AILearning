<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">重复索引需要散射累加</title><desc id="plateDesc">B 把对第 1 行的两份贡献分成两次更新，状态从 0 变为 2 再变为 5。C 展示高级索引先读出两个位置、在临时数组上计算再写回的结构；重复写回不应被解释为可靠的求和归约，具体覆盖结果也不应被当作接口保证。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">重复索引需要散射累加</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">NumPy</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">重复索引汇合到同一行</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">散射累加的状态变化</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">初始行 1</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">0</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">加贡献 2</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">2</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">再加贡献 3</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">5</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">每次贡献都进入同一个累计位置</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">覆盖写回不等于归约</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">高级索引读出</text><rect x="991" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1091.25" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">0</text><rect x="1198.5" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1298.75" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">0</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">临时数组加法</text><rect x="991" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1091.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">2</text><rect x="1198.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1298.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">3</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">写回同一行</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">不保证和为 5</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">需要按重复索引累加时应使用散射归约</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 590.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet">
<title>重复索引需要散射累加</title><desc>两个记录虽然读取同一个参数位置，却分别产生梯度贡献。反向传播必须把两份贡献加到同一行，得到五；这与是否复制读取结果是两个问题。 普通高级索引的增量赋值可能采用缓冲语义，不能直接当作按索引逐项执行。应使用明确的散射累加或先按编号归约，再按既定的损失分母更新参数。</desc>
<defs><marker id="panelA-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker><marker id="panelA-tip-2563eb" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2563eb" /></marker><marker id="panelA-tip-e07828" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#e07828" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">重复索引需要散射累加</text>
<text x="60" y="115" font-size="24" fill="#18324d" text-anchor="start">读取索引：两条记录都指向第 1 行</text>
<rect x="60" y="155" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="122.5" y="236.25" font-size="23" fill="#18324d" text-anchor="middle">记录 A</text>
<rect x="185" y="155" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="247.5" y="236.25" font-size="23" fill="#18324d" text-anchor="middle">索引 1</text>
<rect x="310" y="155" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="372.5" y="236.25" font-size="23" fill="#18324d" text-anchor="middle">贡献 2</text>
<rect x="60" y="280" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="122.5" y="361.25" font-size="23" fill="#18324d" text-anchor="middle">记录 B</text>
<rect x="185" y="280" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="247.5" y="361.25" font-size="23" fill="#18324d" text-anchor="middle">索引 1</text>
<rect x="310" y="280" width="125" height="125" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="372.5" y="361.25" font-size="23" fill="#18324d" text-anchor="middle">贡献 3</text>
<text x="650" y="115" font-size="24" fill="#18324d" text-anchor="start">参数梯度缓冲区</text>
<rect x="650" y="155" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="702.5" y="223.25" font-size="23" fill="#18324d" text-anchor="middle">行 0</text>
<rect x="755" y="155" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="807.5" y="223.25" font-size="23" fill="#18324d" text-anchor="middle">0</text>
<rect x="650" y="260" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="702.5" y="328.25" font-size="23" fill="#18324d" text-anchor="middle">行 1</text>
<rect x="755" y="260" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="807.5" y="328.25" font-size="23" fill="#18324d" text-anchor="middle">5</text>
<rect x="650" y="365" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="702.5" y="433.25" font-size="23" fill="#18324d" text-anchor="middle">行 2</text>
<rect x="755" y="365" width="105" height="105" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="807.5" y="433.25" font-size="23" fill="#18324d" text-anchor="middle">0</text>
<line x1="440" y1="215" x2="640" y2="307" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="" marker-end="url(#panelA-tip-2563eb)" />
<line x1="440" y1="340" x2="640" y2="307" stroke="#e07828" stroke-width="2.5" stroke-dasharray="" marker-end="url(#panelA-tip-e07828)" />
<text x="485" y="445" font-size="30" fill="#059669" text-anchor="start">2 + 3 = 5</text>
<text x="70" y="505" font-size="26" fill="#18324d" text-anchor="start">相同索引 → 同一存储位置 → 梯度贡献必须相加</text>
<text x="70" y="560" font-size="22" fill="#18324d" text-anchor="start">明确使用散射累加；普通高级索引 += 不保证逐项累加语义。</text>
</g></svg></svg>
