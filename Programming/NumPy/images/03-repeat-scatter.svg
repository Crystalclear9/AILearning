<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="565" viewBox="0 0 1300 565" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">同一个索引的两次更新</title><desc id="figure-desc">缓冲回写两次都读到零，按图示顺序最后得到三；逐次累加读到上次结果，最后得到五。</desc><defs><marker id="tip-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><marker id="tip-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#176c78"/></marker><marker id="tip-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#b04d3b"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#635580"/></marker><linearGradient id="water" x1="0%" x2="90%" y1="0%" y2="100%"><stop offset="0%" stop-color="#85cbd2" stop-opacity=".13"/><stop offset="100%" stop-color="#85cbd2" stop-opacity=".52"/></linearGradient><linearGradient id="peach" x1="0%" x2="90%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eea899" stop-opacity=".13"/><stop offset="100%" stop-color="#eea899" stop-opacity=".52"/></linearGradient><linearGradient id="lavender" x1="0%" x2="90%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b6a9d4" stop-opacity=".13"/><stop offset="100%" stop-color="#b6a9d4" stop-opacity=".52"/></linearGradient></defs><rect x="0" y="0" width="1300" height="565" fill="white"/><text x="70" y="63" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="37" text-anchor="start" fill="#202a37">缓冲回写</text><text x="70" y="328" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="37" text-anchor="start" fill="#202a37">逐次累加</text><rect x="166" y="108" width="100" height="78" fill="url(#water)" stroke="#176c78" stroke-width="1.75"/><text x="216" y="159" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="41" text-anchor="middle" fill="#176c78">0</text><line x1="288" y1="147" x2="509" y2="147" stroke="#635580" stroke-width="2.4" stroke-linecap="round" marker-end="url(#tip-violet)"/><text x="399" y="123" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" text-anchor="middle" fill="#202a37">写入 2</text><rect x="547" y="108" width="100" height="78" fill="url(#water)" stroke="#176c78" stroke-width="1.75"/><text x="597" y="159" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="41" text-anchor="middle" fill="#176c78">2</text><line x1="669" y1="147" x2="890" y2="147" stroke="#635580" stroke-width="2.4" stroke-linecap="round" marker-end="url(#tip-violet)"/><text x="780" y="123" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" text-anchor="middle" fill="#202a37">写入 3</text><rect x="928" y="108" width="100" height="78" fill="url(#peach)" stroke="#b04d3b" stroke-width="1.75"/><text x="978" y="159" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="41" text-anchor="middle" fill="#b04d3b">3</text><text x="1150" y="156" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="30" text-anchor="start" fill="#202a37">索引 1</text><rect x="166" y="365" width="100" height="78" fill="url(#water)" stroke="#176c78" stroke-width="1.75"/><text x="216" y="416" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="41" text-anchor="middle" fill="#176c78">0</text><line x1="288" y1="404" x2="509" y2="404" stroke="#635580" stroke-width="2.4" stroke-linecap="round" marker-end="url(#tip-violet)"/><text x="399" y="380" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" text-anchor="middle" fill="#202a37">加 2</text><rect x="547" y="365" width="100" height="78" fill="url(#water)" stroke="#176c78" stroke-width="1.75"/><text x="597" y="416" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="41" text-anchor="middle" fill="#176c78">2</text><line x1="669" y1="404" x2="890" y2="404" stroke="#635580" stroke-width="2.4" stroke-linecap="round" marker-end="url(#tip-violet)"/><text x="780" y="380" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" text-anchor="middle" fill="#202a37">加 3</text><rect x="928" y="365" width="100" height="78" fill="url(#lavender)" stroke="#635580" stroke-width="1.75"/><text x="978" y="416" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="41" text-anchor="middle" fill="#635580">5</text><text x="1150" y="413" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="30" text-anchor="start" fill="#202a37">索引 1</text><text x="631" y="238" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" text-anchor="middle" fill="#b04d3b">两次更新都从旧值 0 计算</text><text x="631" y="499" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" text-anchor="middle" fill="#635580">第二次更新读取第一次的结果</text></svg>