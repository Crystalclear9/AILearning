2"/><text x="910" y="634" font-size="35.7px" fill="#287aaa">4</text><rect x="990" y="585" width="100" height="78" fill="#f3f8fb" stroke="#dde5eb" stroke-width="2"/><text x="1010" y="634" font-size="35.7px" fill="#287aaa">0</text><rect x="1090" y="585" width="100" height="78" fill="#f3f8fb" stroke="#dde5eb" stroke-width="2"/><text x="1110" y="634" font-size="35.7px" fill="#287aaa">2</text><text x="65" y="752" font-size="36.467116px" fill="#1b737e">第二特征：NaN → 填 15 → 减 15 → 0</text><text x="65" y="817" font-size="36.467116px" fill="#1d4158">第三特征：训练计数为 0；验证出现 2，输出仍为 2。</text></g><desc> 缺失中心化：计数决定均值，训练统计决定变换 输出为 0 不能区分“原本等于均值”与“缺失后填充”；需要另存掩码。</desc></g></g></g></svg></svg>