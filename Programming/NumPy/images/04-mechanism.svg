="414" font-size="25" fill="#1b737e">t=3</text><text x="310" y="577" font-size="26" fill="#4c738b">目标最优点 (0,0)</text><polyline points="735.00,650.00 1215.00,650.00" fill="none" stroke="#dde5eb" stroke-width="1.5"/><text x="675" y="660" font-size="24" fill="#4c738b">0</text><polyline points="735.00,550.00 1215.00,550.00" fill="none" stroke="#dde5eb" stroke-width="1.5"/><text x="675" y="560.0" font-size="24" fill="#4c738b">0.25</text><polyline points="735.00,450.00 1215.00,450.00" fill="none" stroke="#dde5eb" stroke-width="1.5"/><text x="675" y="460.0" font-size="24" fill="#4c738b">0.5</text><polyline points="735.00,350.00 1215.00,350.00" fill="none" stroke="#dde5eb" stroke-width="1.5"/><text x="675" y="360.0" font-size="24" fill="#4c738b">0.75</text><polyline points="735.00,250.00 1215.00,250.00" fill="none" stroke="#dde5eb" stroke-width="1.5"/><text x="675" y="260" font-size="24" fill="#4c738b">1</text><text x="728" y="692" font-size="24" fill="#4c738b">0</text><text x="808" y="692" font-size="24" fill="#4c738b">1</text><text x="888" y="692" font-size="24" fill="#4c738b">2</text><text x="968" y="692" font-size="24" fill="#4c738b">3</text><text x="1048" y="692" font-size="24" fill="#4c738b">4</text><text x="1128" y="692" font-size="24" fill="#4c738b">5</text><text x="1208" y="692" font-size="24" fill="#4c738b">6</text><polyline points="735.00,235.00 735.00,650.00 1220.00,650.00" fill="none" stroke="#728f9e" stroke-width="2"/><polyline points="735.00,250.00 815.00,290.00 895.00,326.00 975.00,358.40 1055.00,387.56 1135.00,413.80 1215.00,437.42" fill="none" stroke="#1f7eac" stroke-width="3"/><circle cx="735" cy="250.0" r="6" fill="#1f7eac"/><circle cx="815" cy="290.0" r="6" fill="#1f7eac"/><circle cx="895" cy="326.0" r="6" fill="#1f7eac"/><circle cx="975" cy="358.4" r="6" fill="#1f7eac"/><circle cx="1055" cy="387.56" r="6" fill="#1f7eac"/><circle cx="1135" cy="413.804" r="6" fill="#1f7eac"/><circle cx="1215" cy="437.42359999999996" r="6" fill="#1f7eac"/><polyline points="735.00,250.00 815.00,410.00 895.00,506.00 975.00,563.60 1055.00,598.16 1135.00,618.90 1215.00,631.34" fill="none" stroke="#b7612e" stroke-width="3"/><circle cx="735" cy="250.0" r="6" fill="#b7612e"/><circle cx="815" cy="410.0" r="6" fill="#b7612e"/><circle cx="895" cy="506.0" r="6" fill="#b7612e"/><circle cx="975" cy="563.6" r="6" fill="#b7612e"/><circle cx="1055" cy="598.16" r="6" fill="#b7612e"/><circle cx="1135" cy="618.896" r="6" fill="#b7612e"/><circle cx="1215" cy="631.3376" r="6" fill="#b7612e"/><text x="970" y="360" font-size="27" fill="#287aaa">e1(t) = 0.9^t</text><text x="950" y="560" font-size="27" fill="#9e5a30">e2(t) = 0.6^t</text><text x="1110" y="733" font-size="27" fill="#1d4158">更新次数 t</text><path d="M40 758 H1240" stroke="#dde5eb" stroke-width="2"/></g><desc> 同一条训练轨迹：高曲率先收敛，低曲率继续缓慢移动 平面轨迹与右侧曲线来自同一递推；误差坐标不是损失值。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 823.275) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">每个谱方向单独计账：为什么总损失不能替代参数误差</text><text x="80" y="120" font-size="38.7px" fill="#277290" text-anchor="start">慢方向 e1</text><rect x="80" y="160" width="122" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="141.0" y="199" font-size="33.32px" fill="#277290" text-anchor="middle">1.0000</text><rect x="210" y="160" width="122" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="271.0" y="199" font-size="33.32px" fill="#277290" text-anchor="middle">0.9000</text><rect x="340" y="160" width="122" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="401.0" y="199" font-size="33.32px" fill="#277290" text-anchor="middle">0.7290</text><rect x="470" y="160" width="122" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="531.0" y="199" font-size="33.32px" fill="#277290" text-anchor="middle">0.5314</text><text x="80" y="275" font-size="36.12px" fill="#277290" text-anchor="start">步数 0 → 1 → 3 → 6</text><text x="780" y="120" font-size="38.7px" fill="#a55f3a" text-anchor="start">快方向 e2</text><rect x="780" y="160" width="122" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="841.0" y="199" font-size="33.32px" fill="#a55f3a" text-anchor="middle">1.0000</text><rect x="910" y="160" width="122" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="971.0" y="199" font-size="33.32px" fill="#a55f3a" text-anchor="middle">0.6000</text><rect x="1040" y="160" width="122" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="1101.0" y="199" font-size="33.32px" fill="#a55f3a" text-anchor="middle">0.2160</text><rect x="1170" y="160" width="122" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="1231.0" y="199" font-size="33.32px" fill="#a55f3a" text-anchor="middle">0.0467</text><text x="780" y="275" font-size="36.12px" fill="#a55f3a" text-anchor="start">步数 0 → 1 → 3 → 6</text><text x="65" y="350" font-size="38.7px" fill="#213747" text-anchor="start">t=6：e1² ≈ 0.28243；4e2² ≈ 0.00871；J ≈ 0.14557。</text><text x="65" y="412" font-size="36.12px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">快方向的目标贡献已很小，慢方向仍保留超过一半的初始参数误差。</text></g></g></g></g></g></svg></svg>