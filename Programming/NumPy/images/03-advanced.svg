<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="799" viewBox="0 47 960 799" role="img" aria-labelledby="artwork-title"><title id="artwork-title">滑动窗口共享底层存储</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="748.569792"/></clipPath></defs><rect width="960" height="846" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>重叠窗口：不同坐标可指向同一个源元素</title><svg aria-labelledby="figure-title figure-desc" width="1440" height="734.552" viewBox="16.000 64.000 1039.000 530.000" role="img"><title id="figure-title">重叠窗口：不同坐标可指向同一个源元素</title><desc id="figure-desc">两个长度为三的滑动窗口共享源数组。修改源位置一后，两个窗口相应位置都变成九十九；默认窗口只读不冻结源。 重叠窗口：不同坐标可指向同一个源元素 窗口默认只读，源数组的变化仍会被视图观察到。</desc><rect width="1039.0" height="530.0" fill="white" x="16.0" y="64.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">源数组 x=[0,1,2,3]；窗口长度为 3</text><rect x="350" y="160" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="405.0" y="202.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">0</text><rect x="495" y="160" width="110" height="65" rx="6" fill="url(#book-wash-fff0e3)" stroke="#b9642b" stroke-width="1.5"/><text x="550.0" y="202.3" font-size="28" fill="#a86331" text-anchor="middle" font-weight="400">1</text><rect x="640" y="160" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="695.0" y="202.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">2</text><rect x="785" y="160" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="840.0" y="202.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">3</text><text x="40" y="200" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">唯一源缓冲</text><text x="60" y="325" font-size="28" fill="#1f3449" text-anchor="start" font-weight="600">窗口 0</text><rect x="60" y="360" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="115.0" y="402.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">0</text><line fill="none" stroke="#176fa3" stroke-width="2.8" marker-end="url(#arrow-blue)" x1="115" y1="355" x2="405" y2="240"/><rect x="200" y="360" width="110" height="65" rx="6" fill="url(#book-wash-fff0e3)" stroke="#b9642b" stroke-width="1.5"/><text x="255.0" y="402.3" font-size="28" fill="#a86331" text-anchor="middle" font-weight="400">1</text><line fill="none" stroke="#b9642b" stroke-width="2.8" marker-end="url(#arrow-orange)" x1="255" y1="355" x2="550" y2="240"/><rect x="340" y="360" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="395.0" 