<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="545.48" viewBox="-18.24 28.76 996.48 545.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">数学等价的距离公式，浮点结果可能不同</title><desc id="artwork-desc">图中坐标均能在 float64 中精确表示，先求差得到 (−1,1)，平方距离是 2。改用范数展开时，真实的第二个平方范数为 20000000000000002，在本例浮点计算中舍入为 2e16；于是三个大项按图示顺序运算得到 0。e16 表示乘以十的十六次方。这个例子展示的是大数相减丢掉小差异，既不是输出只需裁成非负数就能修好的问题，也不说明直接差法在所有极端尺度下都不会失效。 数学等价的距离公式，浮点结果可能不同 2</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="458.669355"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="545.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="509" viewBox="0 47 960 509" overflow="hidden"><rect width="960" height="556" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(11.239919 17.290323) scale(0.917339)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">数学等价的距离公式，浮点结果可能不同</title><desc id="figure-desc">图中坐标均能在 float64 中精确表示，先求差得到 (−1,1)，平方距离是 2。改用范数展开时，真实的第二个平方范数为 20000000000000002，在本例浮点计算中舍入为 2e16；于是三个大项按图示顺序运算得到 0。e16 表示乘以十的十六次方。这个例子展示的是大数相减丢掉小差异，既不是输出只需裁成非负数就能修好的问题，也不说明直接差法在所有极端尺度下都不会失效。 数学等价的距离公式，浮点结果可能不同 2</desc><rect width="992.0" height="500.0" fill="#ffffff" x="15.0" y="64.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2e77a6"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b96f41"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="110" font-size="28" fill="#233a4b" text-anchor="start" font-weight="400">x=(100000000,100000000)</text><text x="40" y="155" font-size="28" fill="#233a4b" text-anchor="start" font-weight="400">y=(100000001, 99999999)</text><text x="40" y="235" font-size="29" fill="#2e77a6" text-anchor="start" font-weight="600" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">先求差，再平方求和</text><rect x="55" y="285" width="130" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#227199" stroke-width="1.5"/><text x="120.0" y="332.3" font-size="28" fill="#2e77a6" text-anchor="middle" font-weight="400">−1</text><rect x="193" y="285" width="130" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#227199" stroke-width="1.5"/><text x="258.0" y="332.3" font-size="28" fill="#2e77a6" text-anchor="middle" font-weight="400">1</text><line fill="none" stroke="#227199" stroke-width="2.8" marker-end="url(#arrow-blue)" x1="345" y1="325" x2="430" y2="325"/><text x="70" y="430" font-size="32" fill="#2e77a6" text-anchor="start" font-weight="600">(−1)² + 1² = 2</text><text x="650" y="235" font-size="28" fill="#9f6038" text-anchor="start" font-weight="600">float64 展开式的三个大项</text><text x="680" y="315" font-size="31" fill="#9f6038" text-anchor="start" font-weight="400">2e16 + 2e16 − 4e16</text><text x="680" y="405" font-size="32" fill="#9f6038" text-anchor="start" font-weight="600">本例计算结果：0</text><text x="40" y="535" font-size="29" fill="#233a4b" text-anchor="start" font-weight="400">把 0 裁为非负数，无法恢复丢失的距离 2。</text><rect x="455" y="285" width="100" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#227199" stroke-width="1.5"/><text x="505.0" y="332.3" font-size="28" fill="#2e77a6" text-anchor="middle" font-weight="400">2</text></g></g></g></g></svg></svg>