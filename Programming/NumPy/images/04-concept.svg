<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">训练器的一次完整更新</title><desc id="plateDesc">B 采用单样本损失为误差平方的一半，完整列出前向值、梯度和更新后的状态。C 从同一初始状态比较正确更新与意外漏更新偏置：预测分别为 1.8 与 1.5。若有意冻结偏置，那是不同的参数优化约定，应明确声明。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">训练器的一次完整更新</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">一次参数更新对应一次预测</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">逐项追踪损失与梯度</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">漏更新偏置会改变轨迹</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet">
<title>训练器的一次完整更新</title><desc>零参数预测为零，残差负三；半平方误差的权重梯度为负三、负六，偏置梯度为负三。因此一次同时更新得到图中的参数，新预测为一点八。 图中梯度都在同一个旧参数位置计算。若先更新权重，再用新权重重算偏置梯度，就变成另一种顺序更新，不能继续与这里的手算结果比较。</desc>
<defs><marker id="panelA-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker><marker id="panelA-tip-e07828" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#e07828" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">训练器的一次完整更新</text>
<text x="55" y="110" font-size="24" fill="#18324d" text-anchor="start">参数平面（偏置也同步更新）</text>
<line x1="140" y1="485" x2="570" y2="485" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<line x1="140" y1="485" x2="140" y2="185" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<text x="570" y="520" font-size="18" fill="#18324d" text-anchor="end">权重 w1</text>
<text x="140" y="167" font-size="18" fill="#18324d" text-anchor="start">权重 w2</text>
<text x="125" y="515" font-size="18" fill="#18324d" text-anchor="start">0</text>
<line x1="140" y1="485" x2="450" y2="220" stroke="#e07828" stroke-width="2.5" stroke-dasharray="" marker-end="url(#panelA-tip-e07828)" />
<circle cx="140" cy="485" r="7" fill="#2563eb" />
<circle cx="450" cy="220" r="7" fill="#e07828" />
<text x="165" y="465" font-size="22" fill="#2563eb" text-anchor="start">旧参数 (0, 0)</text>
<text x="310" y="190" font-size="22" fill="#e07828" text-anchor="start">新权重 (0.3, 0.6)</text>
<text x="180" y="365" font-size="20" fill="#18324d" text-anchor="start">沿负梯度方向，η=0.1</text>
<text x="680" y="110" font-size="24" fill="#18324d" text-anchor="start">同一条样本 x=(1,2), y=3</text>
<line x1="730" y1="495" x2="1070" y2="495" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<line x1="730" y1="495" x2="730" y2="155" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<text x="1100" y="578" font-size="18" fill="#18324d" text-anchor="end">更新前 / 后</text>
<text x="730" y="137" font-size="18" fill="#18324d" text-anchor="start">预测与真实目标</text>
<text x="715" y="502" font-size="18" fill="#18324d" text-anchor="end">0</text>
<text x="715" y="407" font-size="18" fill="#18324d" text-anchor="end">1</text>
<text x="715" y="312" font-size="18" fill="#18324d" text-anchor="end">2</text>
<text x="715" y="217" font-size="18" fill="#18324d" text-anchor="end">3</text>
<line x1="730" y1="210" x2="1070" y2="210" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" />
<text x="1075" y="215" font-size="19" fill="#059669" text-anchor="start">y=3</text>
<rect x="790" y="493" width="65" height="2" rx="6" fill="#2563eb" stroke="#64748b" />
<rect x="940" y="324" width="65" height="171" rx="6" fill="#ffedd5" stroke="#e07828" />
<text x="823" y="545" font-size="20" fill="#18324d" text-anchor="middle">旧预测 0</text>
<text x="973" y="545" font-size="20" fill="#18324d" text-anchor="middle">新预测 1.8</text>
<text x="750" y="285" font-size="19" fill="#e07828" text-anchor="start">仍低于真实值</text>
<text x="60" y="590" font-size="23" fill="#18324d" text-anchor="start">梯度：(-3, -6; -3)    新偏置 b=0.3    新预测=0.3+2×0.6+0.3=1.8</text>
</g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 928) scale(0.7272727273 1) translate(-96 -928)">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 928) scale(0.7272727273 1) translate(-138 -928)">x=(1,2)，y=3；初始预测 0，损失 4.5</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1010) scale(0.7272727273 1) translate(-96 -1010)">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1010) scale(0.7272727273 1) translate(-138 -1010)">梯度：(−3,−6)，偏置梯度 −3</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1092) scale(0.7272727273 1) translate(-96 -1092)">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1092) scale(0.7272727273 1) translate(-138 -1092)">学习率 0.1 → w=(0.3,0.6)，b=0.3</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1043.25 L1381,1043.25" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1049.25" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1049.25) scale(0.7272727273 1) translate(-856 -1049.25)">1</text><path d="M866,1001.5 L1381,1001.5" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="10