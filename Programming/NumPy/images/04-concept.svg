nt-weight="400" transform="translate(1212.33 1113) scale(0.7272727273 1) translate(-1212.33 -1113)">真实目标</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1153) scale(0.7272727273 1) translate(-806 -1153)">使用同一平方损失与初始状态</text></g></svg>
