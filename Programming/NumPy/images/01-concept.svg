<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">广播轴的逐元素对应</title><desc id="plateDesc">B 追踪第二行第三列，明确重复的是偏置的第一行，而不是把数组形状凭直觉拉伸。C 对比形状 (2,) 与 (2,1)：前者末轴不匹配，后者可以沿特征轴复用。可广播只是索引映射合法，偏置究竟代表样本还是特征仍需业务约定。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">广播轴的逐元素对应</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">广播按列复用偏置</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">一个元素的完整计算</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">维度相等不等于语义相同</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet">
<title>广播轴的逐元素对应</title><desc>图中每一列共享一个偏置，偏置在样本轴上的长度为一，因而每行读取相同的三个值。广播是索引对应规则，不要求先复制成完整的两行偏置。 若把偏置改成二乘一，每条样本共享一个偏置，表达的是另一种语义。即使某些尺寸巧合使运算可以执行，也必须检查共享的究竟是样本、通道还是空间轴。</desc>
<defs><marker id="panelA-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">广播轴的逐元素对应</text>
<text x="70" y="125" font-size="25" fill="#18324d" text-anchor="start">X：2 × 3</text>
<rect x="70" y="155" width="90" height="90" rx="6" fill="#dbeafe" stroke="#64748b" />
<text x="115.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">1</text>
<rect x="160" y="155" width="90" height="90" rx="6" fill="#ffedd5" stroke="#64748b" />
<text x="205.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">2</text>
<rect x="250" y="155" width="90" height="90" rx="6" fill="#d1fae5" stroke="#64748b" />
<text x="295.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">3</text>
<rect x="70" y="245" width="90" height="90" rx="6" fill="#dbeafe" stroke="#64748b" />
<text x="115.0" y="303.5" font-size="23" fill="#18324d" text-anchor="middle">4</text>
<rect x="160" y="245" width="90" height="90" rx="6" fill="#ffedd5" stroke="#64748b" />
<text x="205.0" y="303.5" font-size="23" fill="#18324d" text-anchor="middle">5</text>
<rect x="250" y="245" width="90" height="90" rx="6" fill="#d1fae5" stroke="#64748b" />
<text x="295.0" y="303.5" font-size="23" fill="#18324d" text-anchor="middle">6</text>
<text x="485" y="125" font-size="25" fill="#18324d" text-anchor="start">b：1 × 3</text>
<rect x="485" y="155" width="90" height="90" rx="6" fill="#dbeafe" stroke="#64748b" />
<text x="530.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">10</text>
<rect x="575" y="155" width="90" height="90" rx="6" fill="#ffedd5" stroke="#64748b" />
<text x="620.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">20</text>
<rect x="665" y="155" width="90" height="90" rx="6" fill="#d1fae5" stroke="#64748b" />
<text x="710.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">30</text>
<text x="485" y="300" font-size="21" fill="#18324d" text-anchor="start">同列偏置在样本轴复用</text>
<text x="390" y="225" font-size="34" fill="#18324d" text-anchor="start">+</text>
<text x="810" y="225" font-size="34" fill="#18324d" text-anchor="start">=</text>
<text x="875" y="125" font-size="25" fill="#18324d" text-anchor="start">Y：2 × 3</text>
<rect x="875" y="155" width="90" height="90" rx="6" fill="#dbeafe" stroke="#64748b" />
<text x="920.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">11</text>
<rect x="965" y="155" width="90" height="90" rx="6" fill="#ffedd5" stroke="#64748b" />
<text x="1010.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">22</text>
<rect x="1055" y="155" width="90" height="90" rx="6" fill="#d1fae5" stroke="#64748b" />
<text x="1100.0" y="213.5" font-size="23" fill="#18324d" text-anchor="middle">33</text>
<rect x="875" y="245" width="90" height="90" rx="6" fill="#dbeafe" stroke="#64748b" />
<text x="920.0" y="303.5" font-size="23" fill="#18324d" text-anchor="middle">14</text>
<rect x="965" y="245" width="90" height="90" rx="6" fill="#ffedd5" stroke="#64748b" />
<text x="1010.0" y="303.5" font-size="23" fill="#18324d" text-anchor="middle">25</text>
<rect x="1055" y="245" width="90" height="90" rx="6" fill="#d1fae5" stroke="#64748b" />
<text x="1100.0" y="303.5" font-size="23" fill="#18324d" text-anchor="middle">36</text>
<line x1="530" y1="245" x2="530" y2="390" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 5" />
<text x="530" y="430" font-size="19" fill="#18324d" text-anchor="middle">列 0</text>
<line x1="620" y1="245" x2="620" y2="390" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 5" />
<text x="620" y="430" font-size="19" fill="#18324d" text-anchor="middle">列 1</text>
<line x1="710" y1="245" x2="710" y2="390" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 5" />
<text x="710" y="430" font-size="19" fill="#18324d" text-anchor="middle">列 2</text>
<rect x="485" y="465" width="90" height="90" rx="6" fill="#dbeafe" stroke="#64748b" />
<text x="530.0" y="523.5" font-size="23" fill="#18324d" text-anchor="middle">10</text>
<rect x="575" y="465" width="90" height="90" rx="6" fill="#ffedd5" stroke="#64748b" />
<text x="620.0" y="523.5" font-size="23" fill="#18324d" text-anchor="middle">20</text>
<rect x="665" y="465" width="90" height="90" rx="6" fill="#d1fae5" stroke="#64748b" />
<text x="710.0" y="523.5" font-size="23" fill="#18324d" text-anchor="middle">30</text>
<text x="70" y="420" font-size="23" fill="#18324d" text-anchor="start">颜色表示特征列对应关系</text>
<text x="70" y="480" font-size="24" fill="#18324d" text-anchor="start">Y[i,j] = X[i,j] + b[0,j]</text>
<text x="70" y="535" font-size="20" fill="#18324d" text-anchor="start">不要求物化一份 2 × 3 的偏置副本</text>
</g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 928) scale(0.7272727273 1) translate(-96 -928)">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 928) scale(0.7272727273 1) translate(-138 -928)">X 的形状为 2×3；b 的形状为 1×3</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1010) scale(0.7272727273 1) translate(-96 -1010)">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1010) scale(0.7272727273 1) translate(-138 -1010)">Y[1,2] = X[1,2] + b[0,2]</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1092) scale(0.7272727273 1) translate(-96 -1092)">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1092) scale(0.7272727273 1) translate(-138 -1092)">Y[1,2] = 6 + 30 = 36</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="806" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="815" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 923) scale(0.7272727273 1) translate(-815 -923)">偏置形状</text><rect x="1006" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1015" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 923) scale(0.7272727273 1) translate(-1015 -923)">与 2×3 对齐</text><rect x="1206" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1215" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 923) scale(0.7272727273 1) translate(-1215 -923)">含义</text><rect x="806" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="815" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 978) scale(0.7272727273 1) translate(-815 -978)">(2,)</text><rect x="1006" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1015" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 978) scale(0.7272727273 1) translate(-1015 -978)">末轴 2≠3：失败</text><rect x="1206" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1215" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 978) scale(0.7272727273 1) translate(-1215 -978)">不能逐行相加</text><rect x="806" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="815" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 1036) scale(0.7272727273 1) translate(-815 -1036)">(2,1)</text><rect x="1006" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1015" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 1036) scale(0.7272727273 1) translate(-1015 -1036)">可广播</text><rect x="1206" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1215" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 1036) scale(0.7272727273 1) translate(-1215 -1036)">每行一个偏置</text><text x="806" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1150) scale(0.7272727273 1) translate(-806 -1150)">批轴与特征轴必须先定义</text></g></svg>
