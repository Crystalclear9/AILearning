<rect x="850" y="145" width="100" height="100" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="900.0" y="210.0" font-size="23" fill="#18324d" text-anchor="middle">1</text>
<rect x="650" y="245" width="100" height="100" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="700.0" y="310.0" font-size="23" fill="#18324d" text-anchor="middle">4</text>
<rect x="750" y="245" width="100" height="100" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="800.0" y="310.0" font-size="23" fill="#18324d" text-anchor="middle">2</text>
<rect x="850" y="245" width="100" height="100" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="900.0" y="310.0" font-size="23" fill="#18324d" text-anchor="middle">8</text>
<text x="650" y="425" font-size="24" fill="#18324d" text-anchor="start">D[i,j] = ‖x_i‖² + ‖y_j‖²</text>
<text x="760" y="465" font-size="24" fill="#18324d" text-anchor="start">− 2〈x_i, y_j〉</text>
<text x="650" y="530" font-size="21" fill="#18324d" text-anchor="start">例：D[1,2] = 4 + 4 − 2×0 = 8</text>
<line x1="480" y1="290" x2="640" y2="250" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" marker-end="url(#panelA-tip-64748b)" />
