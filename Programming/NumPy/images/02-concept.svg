<text x="429.0" y="253.9" font-size="23" fill="#18324d" text-anchor="middle">1</text>
<rect x="330" y="277" width="66" height="66" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="363.0" y="319.9" font-size="23" fill="#18324d" text-anchor="middle">2</text>
<rect x="396" y="277" width="66" height="66" rx="6" fill="#eff6ff" stroke="#64748b" />
<text x="429.0" y="319.9" font-size="23" fill="#18324d" text-anchor="middle">0</text>
<text x="55" y="400" font-size="23" fill="#18324d" text-anchor="start">内积表 X × Y^T</text>
