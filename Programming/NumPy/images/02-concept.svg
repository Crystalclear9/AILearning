<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plate-caption" aria-describedby="plate-alt" viewBox="0 0 1360 721" width="1200" height="636.17647059"><title id="plate-caption">矩阵乘法避免三维距离临时量</title><desc id="plate-alt"> 两两距离表的每一格，都对应平面上的一对点 用范数与内积构造距离表，避免存储所有逐特征差值；浮点消去另行核对。</desc><defs><clipPath id="plate-view-0"><rect x="-6.805" y="80.544446" width="1129.34" height="53.369648"/></clipPath><clipPath id="plate-view-1"><rect x="-6.805" y="133.91409" width="1129.34" height="480.06446"/></clipPath><g id="plate-scene"><rect id="edition-paper" x="-6.805" y="36.938" width="1129.34" height="620.647" fill="#ffffff"/><svg id="edition-view" x="13.867" y="57.61" width="1088" height="579.303" viewBox="13.867 57.61 1088 579.303" overflow="hidden"><rect width="1088.0" height="579.303" fill="#ffffff" x="13.867" y="57.61"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="104" font-size="25" fill="#668593" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400">查询 X 有 2 行，中心 Y 有 3 行；右表行对应 X，列对应 Y。</text><line x1="130" y1="570" x2="130" y2="240" stroke="#657682" stroke-width="1.55" stroke-linecap="round"/><line x1="130" y1="570" x2="130" y2="575" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="295" y1="570" x2="295" y2="575" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="460" y1="570" x2="460" y2="575" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="125" y1="570" x2="130" y2="570" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="125" y1="405" x2="130" y2="405" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="125" y1="240" x2="130" y2="240" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="130" y1="570" x2="526.0" y2="570" stroke="#e7ecef" stroke-width="1.3" stroke-dasharray=""/><text x="130" y="610" font-size="24" fill="#668593" text-anchor="middle" font-famil