0" cy="570" r="8" fill="#a55e36"/><text x="480" y="555" font-size="29" fill="#a55e36" text-anchor="start" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400">Y[2]</text><line x1="130" y1="240" x2="460" y2="570" stroke="#2c6f8d" stroke-width="4" stroke-dasharray=""/><line x1="130" y1="240" x2="460" y2="240" stroke="#668593" stroke-width="2" stroke-dasharray="6 6"/><line x1="460" y1="240" x2="460" y2="570" stroke="#668593" stroke-width="2" stroke-dasharray="6 6"/><text x="265" y="204" font-size="25" fill="#668593" text-anchor="start" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-weight="400">Δx = −2</text><text x="477" y="400" font-size="25" fill="#668593" text-anchor="start" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-weight="400">Δy = 2</text><text x="730" y="185" font-size="30" fill="#233949" text-anchor="start" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-weight="400">D[i,j] = ‖X[i] − Y[j]‖²</text><text x="838" y="247" font-size="27" fill="#a55e36" text-anchor="middle" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400">Y0</text><text x="933" y="247" font-size="27" fill="#a55e36" text-anchor="middle" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400">Y1</text><text x="1028" y="247" font-size="27" fill="#a55e36" text-anchor="middle" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400">Y2</text><text x="727" y="315" font-size="27" fill="#2c6f8d" text-anchor="start" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400">X0</text><text x="727" y="410" font-size="27" fill="#2c6f8d" text-anchor="start" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400">X1</text><rect x="790" y="260" width="95" height="95" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/><text x="837.5" y="321.75" font-size="28" fill="#2c6f8d" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400">1</text><rect x="885" y="260" width="95" height="95" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/><text x="932.5" y="321.75" font-size="28" fill="#2c6f8d" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400">1</text><rect x="980" y="260" width="95" height="95" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/><text x="1027.5" y="321.75" font-size="28" fill="#2c6f8d" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400">1</text><rect x="790" y="355" width="95" height="95" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/><text x="837.5" y="416.75" font-size="28" fill="#2c6f8d" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400">4</text><rect x="885" y="355" width="95" height="95" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/><text x="932.5" y="416.75" font-size="28" fill="#2c6f8d" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400">2</text><rect x="980" y="355" width="95" height="95" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/><rect x="980" y="355" width="95" height="95" fill="#f9f0e9" stroke="#a55e36" stroke-width="2"/><text x="1027.5" y="416.75" font-size="32" fill="#a55e36" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400">8</text><text x="700" y="512" font-size="28" fill="#a55e36" text-anchor="start" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-weight="400">D[1,2] = (−2)² + 2² = 8</text><text x="700" y="565" font-size="26" fill="#233949" text-anchor="start" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400">‖X[1]‖² + ‖Y[2]‖² − 2 X[1]·Y[2]</text><text x="700" y="610" font-size="28" fill="#233949" text-anchor="start" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-weight="400">= 4 + 4 − 0 = 8</text></g></svg></g></defs><rect x="0" y="0" width="1360" height="721" fill="#fff" id="textbook-white-paper"/><g id="paper-and-content"><rect x="0" y="0" width="1360" height="721" fill="white"/><g transform="translate(21.905184 -43.734276) scale(1.1796668)"><use xmlns:ns0="http://www.w3.org/1999/xlink" href="#plate-scene" clip-path="url(#plate-view-0)" ns0:href="#plate-scene"/></g><g transform="translate(21.905184 -54.966224) scale(1.1796668)"><use xmlns:ns1="http://www.w3.org/1999/xlink" href="#plate-scene" clip-path="url(#plate-view-1)" ns1:href="#plate-scene"/></g></g></svg>
