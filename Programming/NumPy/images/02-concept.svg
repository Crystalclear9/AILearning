<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">矩阵乘法避免三维距离临时量</title><desc id="plateDesc">B 独立复算矩阵右下角的距离平方 8。C 对比一次广播差张量与目标距离矩阵的元素数：分别为十二项和六项；这只统计所标明的单个数组，不表示内积方案的全部内存只有输出，还需计算范数、内积结果及实现临时量。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">矩阵乘法避免三维距离临时量</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">距离矩阵由内积与范数组合</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">复算一个距离平方</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">输出大小与临时内存分开计</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet">
<title>矩阵乘法避免三维距离临时量</title><desc>左右矩阵通过特征轴收缩形成查询与库记录的内积表，再加上两侧范数平方。这个分解避免直接物化每对向量的完整差值，节省的是临时工作集。 当两个大范数向量很接近时，大项相减可能损失精度；此时直接差值或分块高精度参照有助于核对。图中的数学等价不代表任意精度和布局下都同样稳定或更快。</desc>
<defs><marker id="panelA-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker><marker id="panelA-tip-64748b" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#64748b" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">矩阵乘法避免三维距离临时量</text>
