<text x="220.0" y="538.9" font-size="23" fill="#18324d" text-anchor="middle">0</text>
<text x="650" y="115" font-size="25" fill="#18324d" text-anchor="start">距离平方表 D（2 × 3）</text>
<rect x="650" y="145" width="100" height="100" rx="6" fill="#eff6ff" stroke="#64748b" />
