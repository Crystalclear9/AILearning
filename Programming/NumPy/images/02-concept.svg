<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
<title>矩阵乘法避免三维距离临时量</title><desc>左右矩阵通过特征轴收缩形成查询与库记录的内积表，再加上两侧范数平方。这个分解避免直接物化每对向量的完整差值，节省的是临时工作集。 当两个大范数向量很接近时，大项相减可能损失精度；此时直接差值或分块高精度参照有助于核对。图中的数学等价不代表任意精度和布局下都同样稳定或更快。</desc>
<rect width="1200" height="680" fill="white" />
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker><marker id="tip-64748b" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#64748b" /></marker></defs>
