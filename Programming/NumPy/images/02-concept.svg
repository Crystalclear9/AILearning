<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">矩阵乘法避免三维距离临时量</title><desc id="plateDesc">B 独立复算矩阵右下角的距离平方 8。C 对比一次广播差张量与目标距离矩阵的元素数：分别为十二项和六项；这只统计所标明的单个数组，不表示内积方案的全部内存只有输出，还需计算范数、内积结果及实现临时量。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">矩阵乘法避免三维距离临时量</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">NumPy</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">距离矩阵由内积与范数组合</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">复算一个距离平方</text><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">查询 x=(0,2)，库向量 y=(2,0)</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">差向量为 (−2,2)</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">距离平方 = 4 + 4 = 8</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">输出大小与临时内存分开计</text><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0</text><path d="M866,1029.33 L1381,1029.33" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1035.33" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">5</text><path d="M866,973.667 L1381,973.667" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="979.667" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">10</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">15</text><rect x="951.75" y="951.4" width="86" height="133.6" rx="3" fill="#168a83" stroke="#168a83"/><text x="994.75" y="941.4" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">12</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">差张量 2×3×2</text><rect x="1209.25" y="1018.2" width="86" height="66.8" rx="3" fill="#d17c3e" stroke="#d17c3e"/><text x="1252.25" y="1008.2" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">6</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">距离输出 2×3</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">float64 元素数；每项 8 字节</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 590.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet">
<title>矩阵乘法避免三维距离临时量</title><desc>左右矩阵通过特征轴收缩形成查询与库记录的内积表，再加上两侧范数平方。这个分解避免直接物化每对向量的完整差值，节省的是临时工作集。 当两个大范数向量很接近时，大项相减可能损失精度；此时直接差值或分块高精度参照有助于核对。图中的数学等价不代表任意精度和布局下都同样稳定或更快。</desc>
<defs><marker id="panelA-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker><marker id="panelA-tip-64748b" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#64748b" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">矩阵乘法避免三维距离临时量</text>
