<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="652" viewBox="0 0 960 652" role="img" aria-labelledby="artwork-title"><title id="artwork-title">图解：独立数组缓冲不等于递归复制对象</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="554.53125"/></clipPath></defs><rect width="960" height="652" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">图解：独立数组缓冲不等于递归复制对象</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.710938)"><g><defs><linearGradient id="book-wash-edf5fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>object 数组：缓冲区不共享，里面的 Python 对象仍可共享</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif">
<text x="52" y="64" font-size="36" fill="#1a2a3b" text-anchor="start">object 数组：缓冲区不共享，里面的 Python 对象仍可共享</text>
<text x="80" y="135" font-size="37.274725px" fill="#1c77a2" text-anchor="start">a：object 数组</text>
<text x="490" y="135" font-size="37.274725px" fill="#a95d2f" text-anchor="start">b = a.copy()</text>
<text x="900" y="135" font-size="37.274725px" fill="#1c77a2" text-anchor="start">c = deepcopy(a)</text>
<rect x="110" y="185" width="180" height="74" rx="3" fill="url(#book-wash-edf5fa)" stroke="#116a93"/>
<text x="200" y="232" font-size="34.83px" fill="#1c77a2" text-anchor="middle">引用槽 [0]</text>
<rect x="520" y="185" width="180" height="74" rx="3" fill="#fff2e8" stroke="#c5662c"/>
<text x="610" y="232" font-size="34.83px" fill="#a95d2f" text-anchor="middle">引用槽 [0]</text>
<rect x="950" y="185" width="180" height="74" rx="3" fill="url(#book-wash-edf5fa)" stroke="#116a93"/>
<text x="1040" y="232" font-size="34.83px" fill="#1c77a2" text-anchor="middle">引用槽 [0]</text>
<rect x="350" y="345" width="255" height="85" rx="3" fill="url(#book-wash-edf5fa)" stroke="#116a93"/>
<text x="477" y="400" font-size="37.274725px" fill="#1c77a2" text-anchor="middle">列表 L：[1, 9]</text>
<rect x="910" y="345" width="255" height="85" rx="3" fill="url(#book-wash-edf5fa)" stroke="#116a93"/>
<text x="1037" y="400" font-size="37.274725px" fill="#1c77a2" text-anchor="middle">列表 L′：[1]</text>
<line x1="200" y1="259" x2="420" y2="345" stroke="#116a93" stroke-width="2.46" stroke-dasharray=""/>
<polyline fill="none" stroke="#116a93" stroke-width="2.46" points="408.04,345.93 420,345 411.84,336.2"/>
<line x1="610" y1="259" x2="540" y2="345" stroke="#c5662c" stroke-width="2.46" stroke-dasharray=""/>
<polyline fill="none" stroke="#c5662c" stroke-width="2.46" points="542.77,333.32 540,345 550.87,339.91"/>
<line x1="1040" y1="259" x2="1040" y2="345" stroke="#116a93" stroke-width="2.46" stroke-dasharray=""/>
<polyline fill="none" stroke="#116a93" stroke-width="2.46" points="1034.78,334.19 1040,345 1045.22,334.19"/>
<text x="80" y="505" font-size="37.274725px" fill="#a95d2f" text-anchor="start">b[0].append(9)</text>
<text x="560" y="505" font-size="37.274725px" fill="#a95d2f" text-anchor="start">a[0] 也成为 [1, 9]</text>
<text x="80" y="565" font-size="37.274725px" fill="#1c77a2" text-anchor="start">b[0] = [7]</text>
<text x="560" y="565" font-size="37.274725px" fill="#1c77a2" text-anchor="start">只改 b 的引用槽；a[0] 不变</text>
<line x1="60" y1="610" x2="1220" y2="610" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/>
<text x="60" y="675" font-size="36.12px" fill="#1a2a3b" text-anchor="start">shares_memory(a, b) 为 False：只证明数组缓冲没有重叠。</text>
<text x="60" y="730" font-size="36.12px" fill="#1a2a3b" text-anchor="start">对象是否相同，另查 a[0] is b[0]；数值数组没有这一层引用。</text>
</g></g></g></g></svg>