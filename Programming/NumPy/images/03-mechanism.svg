<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="629" viewBox="0 0 960 629" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">批量矩阵乘法：先广播批轴，再收缩内轴</title><desc id="artwork-desc">两个2乘2批矩阵乘同一个2乘2矩阵。输出为4,6,10,12及16,18,22,24。高亮第一批第一行第二列，矩阵乘得到6而逐元素乘得到0。 批量矩阵乘：广播批轴，不省略内轴求和 批轴复用 B；矩阵内轴必须逐项相乘并求和</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="531.766257"/></clipPath></defs><rect width="960" height="629" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">批量矩阵乘法：先广播批轴，再收缩内轴</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(0.210896 -10.362039) scale(0.799649)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">批量矩阵乘：广播批轴，不省略内轴求和</title><desc id="figure-desc">两个2乘2批矩阵乘同一个2乘2矩阵。输出为4,6,10,12及16,18,22,24。高亮第一批第一行第二列，矩阵乘得到6而逐元素乘得到0。 批量矩阵乘：广播批轴，不省略内轴求和 批轴复用 B；矩阵内轴必须逐项相乘并求和</desc><rect width="1138.0" height="665.0" fill="white" x="31.0" y="108.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="65" y="155" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">A：2 批 × 2 行 × 2 列</text><text x="4