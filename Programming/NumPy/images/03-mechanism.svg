<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">批量矩阵乘法：先广播批轴，再收缩内轴</title><desc id="desc">A 的首轴表示两个批次；B 的单例批轴可广播到这两个批次。每一批都执行 3×4 与 4×5 的矩阵乘法，长度为 4 的内轴被求和，留下 3×5。 箭头表示形状推导，不表示必须物理复制 B。批轴能够广播不能弥补矩阵内轴不相等；这些条件需要分别检查。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#fbfdff" stroke="#fbfdff" rx="0"/><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3"/><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">批量矩阵乘法：先广播批轴，再收缩内轴</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">用具体对象、数值或条件对照，核对这一节的推理。</text><path d="M365,312.5 L460,337.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M365,437.5 L460,412.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M745,335.417 L820,314.583" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M962.5,330 L962.5,420" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="80" y="220" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="222.5" y="283" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">A：2×3×4</text><rect x="80" y="420" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="222.5" y="483" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">B：1×4×5</text><rect x="460" y="320" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="602.5" y="383" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">广播批轴到 2</text><rect x="820" y="220" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="962.5" y="283" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">逐批 3×4 乘 4×5</text><rect x="820" y="420" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10"/><text x="962.5" y="483" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">输出：2×3×5</text><text x="60" y="700" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">原创教学图 · 条件、变量含义及适用边界见相邻正文</text></g></svg>
