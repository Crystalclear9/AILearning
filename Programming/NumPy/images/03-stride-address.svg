<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="622.48" viewBox="-18.24 66.76 996.48 622.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">原矩阵和转置矩阵以不同坐标访问同一字节偏移四十八处的元素六</title><desc id="artwork-desc">同一段缓冲，转置只改变从坐标到字节的路径 间隔切片改变步幅；翻转还会改变起点，并可能使用负步幅。</desc><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="535.613388"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="66.76" width="996.48" height="622.48" fill="#ffffff"/><svg id="edition-view" x="0" y="85" width="960" height="586" viewBox="0 85 960 586" overflow="hidden"><rect width="960" height="671" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 69.042359) scale(0.726682)"><g><defs><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf2ed"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><rect width="1252.267" height="737.067" fill="#ffffff" x="13.867" y="61.867"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#1c4c64"><text x="40" y="110" font-size="34.83px" fill="#4c738b">A = arange(12, dtype=int64).reshape(3,4)；一个元素占 8 字节</text><text x="40" y="176" font-size="36.467116px" fill="#1d4158">唯一数值缓冲：相对 A[0,0] 的字节偏移</text><rect x="50" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="85" y="260" font-size="34.51px" fill="#287aaa">0</text><text x="73" y="321" font-size="29.75px" fill="#4c738b">0</text><rect x="149" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="184" y="260" font-size="34.51px" fill="#287aaa">1</text><text x="172" y="321" font-size="29.75px" fill="#4c738b">8</text><rect x="248" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="283" y="260" font-size="34.51px" fill="#287aaa">2</text><text x="271" y="321" font-size="29.75px" fill="#4c738b">16</text><rect x="347" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="382" y="260" font-size="34.51px" fill="#287aaa">3</text><text x="370" y="321" font-size="29.75px" fill="#4c738b">24</text><rect x="446" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="481" y="260" font-size="34.51px" fill="#287aaa">4</text><text x="469" y="321" font-size="29.75px" fill="#4c738b">32</text><rect x="545" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="580" y="260" font-size="34.51px" fill="#287aaa">5</text><text x="568" y="321" font-size="29.75px" fill="#4c738b">40</text><rect x="644" y="215" width="99" height="68" fill="url(#book-wash-fff1e5)" stroke="#dde5eb" stroke-width="2"/><text x="679" y="260" font-size="34.51px" fill="#9e5a30">6</text><text x="667" y="321" font-size="29.75px" fill="#4c738b">48</text><rect x="743" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="778" y="260" font-size="34.51px" fill="#287aaa">7</text><text x="766" y="321" font-size="29.75px" fill="#4c738b">56</text><rect x="842" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="877" y="260" font-size="34.51px" fill="#287aaa">8</text><text x="865" y="321" font-size="29.75px" fill="#4c738b">64</text><rect x="941" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="976" y="260" font-size="34.51px" fill="#287aaa">9</text><text x="964" y="321" font-size="29.75px" fill="#4c738b">72</text><rect x="1040" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="1075" y="260" font-size="34.51px" fill="#287aaa">10</text><text x="1063" y="321" font-size="29.75px" fill="#4c738b">80</text><rect x="1139" y="215" width="99" height="68" fill="#f6f9fb" stroke="#dde5eb" stroke-width="2"/><text x="1174" y="260" font-size="34.51px" fill="#287aaa">11</text><text x="1162" y="321" font-size="29.75px" fill="#4c738b">88</text><path d="M40 355 H1240" stroke="#dde5eb" stroke-width="2"/><text x="50" y="417" font-size="36.467116px" fill="#287aaa">原矩阵 A：shape (3,4)</text><text x="50" y="476" font-size="36.467116px" fill="#1d4158">strides = (32, 8)</text><text x="50" y="541" font-size="36.467116px" fill="#1d4158">A[1,2]  →  1×32 + 2×8 = 48</text><text x="50" y="606" font-size="34.83px" fill="#4c738b">向下走一行：跳过 4 个元素</text><text x="690" y="417" font-size="36.467116px" fill="#9e5a30">转置 T：shape (4,3)</text><text x="690" y="476" font-size="36.467116px" fill="#1d4158">strides = (8, 32)</text><text x="690" y="541" font-size="36.467116px" fill="#1d4158">T[2,1]  →  2×8 + 1×32 = 48</text><text x="690" y="606" font-size="34.83px" fill="#4c738b">向右走一列：跳过 4 个元素</text><path d="M645 390 V635" stroke="#dde5eb" stroke-width="2"/><text x="50" y="709" font-size="36.467116px" fill="#1b737e">两种坐标都读取值 6；它们不是两份存储。</text><text x="50" y="768" font-size="36.467116px" fill="#1d4158">若只令 T[2,1] = 99，A[1,2] 也会成为 99。</text></g><desc> 同一段缓冲，转置只改变从坐标到字节的路径 间隔切片改变步幅；翻转还会改变起点，并可能使用负步幅。</desc></g></g></g></svg></svg>