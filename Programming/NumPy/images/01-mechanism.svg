<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="990" viewBox="0 47 960 990" role="img" aria-labelledby="artwork-title"><title id="artwork-title">转置改变索引映射，重塑遵循遍历顺序</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="939.296944"/></clipPath></defs><rect width="960" height="1037" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e5"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>转置和重塑通过不同索引访问同一连续缓冲区</title><svg width="1440" height="1036.36" viewBox="0 0 1320 950" role="img"><title>转置和重塑通过不同索引访问同一连续缓冲区</title><rect width="1320" height="950" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#0b6690" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ce6521" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#137286" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="34" fill="#1672a0" text-anchor="start" font-weight="400">X = arange(6).reshape(2, 3)</text><text x="60" y="120" font-size="28" fill="#20354a" text-anchor="start" font-weight="400">连续缓冲区：元素偏移</text><text x="340" y="158" font-size="26" fill="#47586b" text-anchor="middle" font-weight="400">0</text><rect x="280" y="180" width="120" height="78" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="340" y="230" font-size="36" fill="#1672a0" text-anchor="middle" font-weight="400">0</text><text x="485" y="158" font-size="26" fill="#47586b" text-anchor="middle" font-weight="400">1</text><rect x="425" y="180" width="120" height="78" rx="4" fill="url(#book-wash-fff1e5)" stroke="#ce6521" stroke-width="2"/><text x="485" y="230" font-size="36" fill="#b15e27" text-anchor="middle" font-weight="400">1</text><text x="630" y="158" font-size="26" fill="#47586b" text-anchor="middle" font-weight="400">2</text><rect x="570" y="180" width="120" height="78" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="630" y="230" font-size="36" fill="#1672a0" text-anchor="middle" font-weight="400">2</text><text x="775" y="158" font-size="26" fill="#47586b" text-anchor="middle" font-weight="400">3</text><rect x="715" y="180" width="120" height="78" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="775" y="230" font-size="36" fill="#1672a0" text-anchor="middle" font-weight="400">3</text><text x="920" y="158" font-size="26" fill="#47586b" text-anchor="middle" font-weight="400">4</text><rect x="860" y="180" width="120" height="78" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="920" y="230" font-size="36" fill="#1672a0" text-anchor="middle" font-weight="400">4</text><text x="1065" y="158" font-size="26" fill="#47586b" text-anchor="middle" font-weight="400">5</text><rect x="1005" y="180" width="120" height="78" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="1065" y="230" font-size="36" fill="#1672a0" text-anchor="middle" font-weight="400">5</text><text x="60" y="315" font-size="30" fill="#b15e27" text-anchor="start" font-weight="400">同一个元素 1</text><text x="120" y="390" font-size="34" fill="#1672a0" text-anchor="start" font-weight="400">T = X.T</text><text x="120" y="438" font-size="27" fill="#47586b" text-anchor="start" font-weight="400">元素步长 (1, 3)</text><rect x="120" y="475" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="176" y="525" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">0</text><rect x="240" y="475" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="296" y="525" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">3</text><rect x="120" y="560" width="112" height="76" rx="4" fill="url(#book-wash-fff1e5)" stroke="#ce6521" stroke-width="2"/><text x="176" y="610" font-size="34" fill="#b15e27" text-anchor="middle" font-weight="400">1</text><rect x="240" y="560" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="296" y="610" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">4</text><rect x="120" y="645" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="176" y="695" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">2</text><rect x="240" y="645" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="296" y="695" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">5</text><text x="820" y="390" font-size="34" fill="#1672a0" text-anchor="start" font-weight="400">R = X.reshape(3, 2)</text><text x="820" y="438" font-size="27" fill="#47586b" text-anchor="start" font-weight="400">元素步长 (2, 1)</text><rect x="820" y="475" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="876" y="525" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">0</text><rect x="940" y="475" width="112" height="76" rx="4" fill="url(#book-wash-fff1e5)" stroke="#ce6521" stroke-width="2"/><text x="996" y="525" font-size="34" fill="#b15e27" text-anchor="middle" font-weight="400">1</text><rect x="820" y="560" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="876" y="610" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">2</text><rect x="940" y="560" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="996" y="610" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">3</text><rect x="820" y="645" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="876" y="695" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">4</text><rect x="940" y="645" width="112" height="76" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#d9e1e8" stroke-width="2"/><text x="996" y="695" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">5</text><polyline fill="none" stroke="#ce6521" stroke-width="3" marker-end="url(#o)" points="115,598 80,598 80,345 485,345 485,265"/><polyline fill="none" stroke="#ce6521" stroke-width="3" marker-end="url(#o)" points="1058,513 1240,513 1240,345 485,345"/><text x="120" y="815" font-size="30" fill="#b15e27" text-anchor="start" font-weight="400">T[1, 0] → 偏移 1</text><text x="820" y="815" font-size="30" fill="#b15e27" text-anchor="start" font-weight="400">R[0, 1] → 偏移 1</text><text x="660" y="895" font-size="32" fill="#20354a" text-anchor="middle" font-weight="400">X[0, 1] = 9  →  T[1, 0] = R[0, 1] = 9</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1036.36) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#1d3145" text-anchor="start">相同形状并不能给出相同坐标：直接读取两个反例</text><text x="65" y="125" font-size="38.7px" fill="#1d3145" text-anchor="start">T = X.T；R = X.reshape(3,2)</text><rect x="80" y="180" width="192" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="176.0" y="219" font-size="36.12px" fill="#1e7499" text-anchor="middle">T[1,0]</text><rect x="280" y="180" width="192" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="376.0" y="219" font-size="33.32px" fill="#1e7499" text-anchor="middle">1</text><rect x="790" y="180" width="192" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="886.0" y="219" font-size="36.12px" fill="#af6033" text-anchor="middle">R[1,0]</text><rect x="990" y="180" width="192" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="1086.0" y="219" font-size="33.32px" fill="#af6033" text-anchor="middle">2</text><text x="70" y="305" font-size="38.7px" fill="#1e7499" text-anchor="start">T：偏移 = 1×1 + 0×3 = 1</text><text x="760" y="305" font-size="38.7px" fill="#af6033" text-anchor="start">R：偏移 = 1×2 + 0×1 = 2</text><text x="65" y="395" font-size="36.12px" fill="#1d3145" text-anchor="start">两者同为 (3,2)，同一坐标却读取不同元素；不能用形状相同证明结果等价。</text></g></g></g></g></g></svg>