<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="625" viewBox="0 0 1340 625" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">一次训练更新的状态依赖</title><desc id="plate-desc">输入 x=2、目标 y=5，旧参数 w=1、b=0。残差为 -3，梯度为 (-6,-3)，更新后的预测为 3.5。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1340" height="625" fill="white" stroke="none" stroke-width="1.6"/><text x="183" y="136" fill="#196f77" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">前向</text><polygon points="347,182 1150,182 1226,66 423,66" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="574" y="135" fill="#196f77" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">ŷ = 1 × 2 + 0 = 2</text><text x="995" y="135" fill="#196f77" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle"><tspan font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">残差  </tspan><tspan font-family="Segoe UI, Noto Sans, sans-serif">e = 2 − 5 = −3</tspan></text><text x="183" y="308" fill="#a84b3b" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">反向</text><polygon points="347,354 1150,354 1226,238 423,238" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="533" y="286" fill="#a84b3b" font-size="33" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">权重梯度</text><text x="533" y="329" fill="#a84b3b" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">e × 2 = −6</text><text x="1007" y="286" fill="#a84b3b" font-size="33" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">偏置梯度</text><text x="1007" y="329" fill="#a84b3b" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">e × 1 = −3</text><text x="183" y="480" fill="#655184" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">同步更新</text><polygon points="347,526 1150,526 1226,410 423,410" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.8" stroke-linejoin="round"/><text x="574" y="479" fill="#655184" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">w = 1.6,  b = 0.3</text><text x="995" y="479" fill="#655184" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle"><tspan font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">新预测  </tspan><tspan font-family="Segoe UI, Noto Sans, sans-serif">1.6 × 2 + 0.3 = 3.5</tspan></text><text x="662" y="593" fill="#202a37" font-size="30" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">学习率 0.1，两个梯度都在旧参数处求出</text></svg>