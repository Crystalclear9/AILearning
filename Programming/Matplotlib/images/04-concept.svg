<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">诊断图从预测表到证据</title><desc id="plateDesc">B 使用 y=(1,0,1,0)、p=(0.8,0.6,0.4,0.2)，以 p≥阈值判正，在阈值 0.5 时四个混淆计数均为一。C 在同一批记录上指定误报代价四、漏报代价一，三个阈值的总成本分别为 4、5、1；它们不是额外测试集结果，而是可逐项核算的决策例子。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">诊断图从预测表到证据</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">固定记录支持统一诊断</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">阈值 0.5 的四项计数</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">成本改变最佳阈值</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet">
<title>诊断图从预测表到证据</title><desc>图中共享预测表把样本身份、真实标签、概率与分组连接起来。不同面板可以展示不同指标，但应读取同一冻结对象集合；否则两个漂亮面板可能实际上比较了不同人群。 箭头表示可追溯的数据依赖。概率校准、排序和决策成本分别回答不同问题，不能把某一面板改善视为所有维度改善，也不能在最终测试图上反复挑阈值。</desc>
