<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">同一英寸尺寸下的像素预算</title><desc id="desc">同一张 6×4 英寸的栅格图，DPI 翻倍使宽高像素数都翻倍，总像素数变成四倍。图中的数值可以分别用英寸乘 DPI 核对；它解释了为什么只改变 DPI 不能等同于扩大印刷尺寸。 这里计算未裁切画布；bbox_inches 的紧边裁切会改变实际像素边界。SVG 的几何描述也不能直接套用栅格像素总量。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#fbfdff" stroke="#fbfdff" rx="0"/><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3"/><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">同一英寸尺寸下的像素预算</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">用具体对象、数值或条件对照，核对这一节的推理。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">导出条件</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">宽度</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">高度</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">总像素</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">6×4 英寸，100 DPI</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="345" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">600 px</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="615" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">400 px</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="885" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">240000</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0"/><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">6×4 英寸，200 DPI</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0"/><text x="345" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">1200 px</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0"/><text x="615" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">800 px</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0"/><text x="885" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">960000</text><text x="60" y="700" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">原创教学图 · 条件、变量含义及适用边界见相邻正文</text></g></svg>
