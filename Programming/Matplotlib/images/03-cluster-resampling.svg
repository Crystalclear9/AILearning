<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title id="figure-title">重采样要保留对象内部的相关结构</title><desc id="figure-desc">字母是图像身份，不是测量值。图示把机构固定，以患者作为外层抽样单位：本次抽中 P2、P2、P1，患者的三张图像随整组保留，P2 因而出现两份。它仅演示对象层的簇自助抽样；是否还要在患者内部重采样图像，或把机构也作为随机层，应由推广目标和采样设计决定。比较两个模型时，同一组抽样身份还应同时应用于两模型，才能保留配对关系。</desc><rect width="1200" height="675" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">重采样要保留对象内部的相关结构</text><text x="40" y="112" font-size="28" fill="#2865a0" text-anchor="start" font-weight="600">原始对象：3 位患者，每人 3 张图像</text><text x="750" y="112" font-size="28" fill="#c87536" text-anchor="start" font-weight="600">一次按患者整组抽样</text><text x="40" y="207" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">P1</text><rect x="120" y="165" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="157.5" y="207.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">a</text><rect x="203" y="165" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="240.5" y="207.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">b</text><rect x="286" y="165" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="323.5" y="207.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">c</text><text x="40" y="337" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">P2</text><rect x="120" y="295" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="157.5" y="337.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">d</text><rect x="203" y="295" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="240.5" y="337.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">e</text><rect x="286" y="295" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="323.5" y="337.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">f</text><text x="40" y="467" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">P3</text><rect x="120" y="425" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="157.5" y="467.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">g</text><rect x="203" y="425" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="240.5" y="467.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">h</text><rect x="286" y="425" width="75" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="323.5" y="467.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">i</text><text x="755" y="207" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">P2</text><rect x="840" y="165" width="75" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="877.5" y="207.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">d</text><rect x="923" y="165" width="75" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="960.5" y="207.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">e</text><rect x="1006" y="165" width="75" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1043.5" y="207.3" font-size="28" fill="#c87536" text-anchor="middle" font