<svg xmlns="http://www.w3.org/2000/svg" width="1328.64" height="828.64" viewBox="-24.32 -24.32 1328.64 828.64" role="img" aria-labelledby="plate-title"><defs><linearGradient id="book-wash-edf5fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="plate-title">分组优势与总体优势可以方向相反</title><rect id="edition-paper" x="-24.32" y="-24.32" width="1328.64" height="828.64" fill="#ffffff"/><svg id="edition-view" x="0" y="0" width="1280" height="780" viewBox="0 0 1280 780" overflow="hidden"><rect width="1280" height="780" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif">
