<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="484" viewBox="0 47 960 484" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">组别占比改变总体指标</title><desc id="artwork-desc">组内正确率固定在零点九和零点五，组权重交换后总体正确率从零点八二降至零点五八；条段显示加权贡献。 总体指标变化：把权重和组内表现拆开 下降来自评价人群组成；不能只看总体分数就判定模型退化。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="433.902012"/></clipPath></defs><rect width="960" height="531" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(13.057743 25.84252) scale(0.79615)"><g><title id="figure-title">总体指标变化：把权重和组内表现拆开</title><desc id="figure-desc">组内正确率固定在零点九和零点五，组权重交换后总体正确率从零点八二降至零点五八；条段显示加权贡献。 总体指标变化：把权重和组内表现拆开 下降来自评价人群组成；不能只看总体分数就判定模型退化。</desc><rect width="1143.0" height="545.0" fill="white" x="15.0" y="63.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="33.285165px" fill="#1f3449" text-anchor="start" font-weight="400">组内正确率固定：甲 0.9，乙 0.5</text><line x1="350" y1="180" x2="350" y2="510" stroke="#d9e1e8" stroke-width="1"/><text x="350" y="165" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">0</text><line x1="540.0" y1="180" x2="540.0" y2="510" stroke="#d9e1e8" stroke-width="1"/><text x="540.0" y="165" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">0.25</text><line x1="730.0" y1="180" x2="730.0" y2="510" stroke="#d9e1e8" stroke-width="1"/><text x="730.0" y="165" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">0.5</text><line x1="920.0" y1="180" x2="920.0" y2="510" stroke="#d9e1e8" stroke-width="1"/><text x="920.0" y=