ight="400">0.25</text><text x="132" y="223.0" fill="#253d4f" font-size="25" text-anchor="end" font-weight="400">0.5</text><text x="40" y="165" fill="#253d4f" font-size="27" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">概率密度</text><text x="295.0" y="300" fill="#2a76a2" font-size="30" text-anchor="middle" font-weight="400">面积 0.5</text><text x="715" y="400" fill="#a15e36" font-size="30" text-anchor="middle" font-weight="400">面积 0.5</text><text x="295.0" y="195" fill="#2a76a2" font-size="27" text-anchor="middle" font-weight="400">高 0.5</text><text x="715" y="320" fill="#a15e36" font-size="27" text-anchor="middle" font-weight="400">高 0.25</text><text x="200" y="565" fill="#2a76a2" font-size="29" text-anchor="start" font-weight="400">2 ÷ (4 × 1) = 0.5</text><text x="650" y="565" fill="#a15e36" font-size="29" text-anchor="start" font-weight="400">2 ÷ (4 × 2) = 0.25</text><text x="1040" y="505" fill="#253d4f" font-size="27" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">观测值</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 757.626) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start">把同一柱形积分一次：直方图密度 → 区间概率</text><text x="60" y="120" font-size="36.12px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同一横轴：箱内均匀密度对应分段线性累计量</text><line x1="120" y1="325" x2="1250" y2="325" stroke="#7c8fa2" stroke-width="2" stroke-dasharray=""/><line x1="120" y1="325" x2="120" y2="145" stroke="#7c8fa2" stroke-width="2" stroke-dasharray=""/><line stroke="#1c6583" stroke-width="3" fill="none" x1="120" y1="325" x2="450" y2="245"/><line stroke="#ae5f34" stroke-width="3" fill="none" x1="450" y1="245" x2="1110" y2="165"/><circle cx="120" cy="325" r="6" fill="#1c6583" stroke="#1c6583" stroke-width="2"/><text x="120" y="370" font-size="32.13px" fill="#277290" text-anchor="middle">0</text><circle cx="450" cy="245" r="6" fill="#1c6583" stroke="#1c6583" stroke-width="2"/><text x="450" y="290" font-size="34.83px" fill="#277290" text-anchor="middle">1：F=0.5</text><circle cx="1110" cy="165" r="6" fill="#ae5f34" stroke="#ae5f34" stroke-width="2"/><text x="1110" y="210" font-size="34.83px" fill="#a55f3a" text-anchor="middle">3：F=1</text><text x="220" y="190" font-size="37.41px" fill="#277290" text-anchor="start">斜率 0.5</text><text x="690" y="150" font-size="29" fill="#a55f3a" text-anchor="start">斜率 0.25</text><text x="60" y="412" font-size="36.12px" fill="#213747" text-anchor="start">在右箱只走一半宽度：P(1≤X&lt;2) = 0.25 × (2−1) = 0.25。</text></g></g></g></g></g></svg></svg>