<g id="round-20261105c-teaching" transform="translate(0 757.626) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#1d3145" text-anchor="start">把同一柱形积分一次：直方图密度 → 区间概率</text><text x="60" y="120" font-size="36.12px" fill="#1d3145" text-anchor="start">同一横轴：箱内均匀密度对应分段线性累计量</text><line x1="120" y1="325" x2="1250" y2="325" stroke="#818fa4" stroke-width="2" stroke-dasharray=""/><line x1="120" y1="325" x2="120" y2="145" stroke="#818fa4" stroke-width="2" stroke-dasharray=""/><line stroke="#13668a" stroke-width="3" fill="none" x1="120" y1="325" x2="450" y2="245"/><line stroke="#ba602b" stroke-width="3" fill="none" x1="450" y1="245" x2="1110" y2="165"/><circle cx="120" cy="325" r="6" fill="#13668a" stroke="#13668a" stroke-width="2"/><text x="120" y="370" font-size="32.13px" fill="#1e7499" text-anchor="middle">0</text><circle cx="450" cy="245" r="6" fill="#13668a" stroke="#13668a" stroke-width="2"/><text x="450" y="290" font-size="34.83px" fill="#1e7499" text-anchor="middle">1：F=0.5</text><circle cx="1110" cy="165" r="6" fill="#ba602b" stroke="#ba602b" stroke-width="2"/><text x="1110" y="210" font-size="34.83px" fill="#af6033" text-anchor="middle">3：F=1</text><text x="220" y="190" font-size="37.41px" fill="#1e7499" text-anchor="start">斜率 0.5</text><text x="690" y="150" font-size="29" fill="#af6033" text-anchor="start">斜率 0.25</text><text x="60" y="412" font-size="36.12px" fill="#1d3145" text-anchor="start">在右箱只走一半宽度：P(1≤X&lt;2) = 0.25 × (2−1) = 0.25。</text></g></g></g></g></g></svg>