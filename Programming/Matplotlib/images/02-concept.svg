<text x="110" y="427" font-size="18" fill="#18324d" text-anchor="end">1</text>
<line x1="130" y1="340" x2="1080" y2="340" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="" />
<text x="110" y="347" font-size="18" fill="#18324d" text-anchor="end">2</text>
<line x1="130" y1="260" x2="1080" y2="260" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="" />
