<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">原始损失与滑动平均</title><desc id="plateDesc">B 将原始日志 4、2、3、1 的长度二后向平均逐项展开。C 固定在 t=3 比较后向两点窗口与居中三点窗口：前者结果为 2.5，后者为 2，却读入了 t=4 的未来记录。居中平滑可用于明确标注的离线展示，不能当成当时已经可见的信息。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">原始损失与滑动平均</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">原始日志与因果平滑</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">逐个复算后向窗口</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">居中窗口使用未来记录</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet">
<title>原始损失与滑动平均</title><desc>每个平滑点读取一个历史窗口，放在窗口右端对应的训练时刻。三个输出分别为三、二点五、二；曲线看起来平滑，并没有增加独立训练次数。 首个时刻没有完整的两点窗口，可选择缺失或缩短窗口，但必须说明政策。若用中心窗口，图上某一点会读取未来日志；不能把这种离线平滑解释成实时可用信号。</desc>
<defs><marker id="panelA-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">原始损失与滑动平均</text>
<line x1="130" y1="500" x2="1080" y2="500" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<line x1="130" y1="500" x2="130" y2="140" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<text x="1080" y="555" font-size="18" fill="#18324d" text-anchor="end">训练时刻 t</text>
<text x="130" y="122" font-size="18" fill="#18324d" text-anchor="start">损失</text>
<line x1="130" y1="420" x2="1080" y2="420" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="" />
<text x="110" y="427" font-size="18" fill="#18324d" text-anchor="end">1</text>
<line x1="130" y1="340" x2="1080" y2="340" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="" />
<text x="110" y="347" font-size="18" fill="#18324d" text-anchor="end">2</text>
<line x1="130" y1="260" x2="1080" y2="260" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="" />
<text x="110" y="267" font-size="18" fill="#18324d" text-anchor="end">3</text>
<line x1="130" y1="180" x2="1080" y2="180" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="" />
<text x="110" y="187" font-size="18" fill="#18324d" text-anchor="end">4</text>
<text x="180" y="530" font-size="19" fill="#18324d" text-anchor="middle">1</text>
<circle cx="180" cy="180" r="7" fill="#2563eb" />
<text x="180" y="165" font-size="19" fill="#2563eb" text-anchor="middle">4</text>
<text x="450" y="530" font-size="19" fill="#18324d" text-anchor="middle">2</text>
<circle cx="450" cy="340" r="7" fill="#2563eb" />
<text x="450" y="325" font-size="19" fill="#2563eb" text-anchor="middle">2</text>
<text x="720" y="530" font-size="19" fill="#18324d" text-anchor="middle">3</text>
<circle cx="720" cy="260" r="7" fill="#2563eb" />
<text x="720" y="245" font-size="19" fill="#2563eb" text-anchor="middle">3</text>
<text x="990" y="530" font-size="19" fill="#18324d" text-anchor="middle">4</text>
<circle cx="990" cy="420" r="7" fill="#2563eb" />
<text x="990" y="405" font-size="19" fill="#2563eb" text-anchor="middle">1</text>
<line x1="180" y1="180" x2="450" y2="340" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="" />
<line x1="450" y1="340" x2="720" y2="260" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="" />
<line x1="720" y1="260" x2="990" y2="420" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="" />
<circle cx="450" cy="260" r="7" fill="#e07828" />
<text x="465" y="270" font-size="21" fill="#e07828" text-anchor="start">3</text>
<circle cx="720" cy="300.0" r="7" fill="#e07828" />
<text x="735" y="310.0" font-size="21" fill="#e07828" text-anchor="start">2.5</text>
<circle cx="990" cy="340" r="7" fill="#e07828" />
<text x="1005" y="350" font-size="21" fill="#e07828" text-anchor="start">2</text>
<line x1="450" y1="260" x2="720" y2="300.0" stroke="#e07828" stroke-width="2.5" stroke-dasharray="" />
<line x1="720" y1="300.0" x2="990" y2="340" stroke="#e07828" stroke-width="2.5" stroke-dasharray="" />
<text x="150" y="95" font-size="22" fill="#2563eb" text-anchor="start">蓝：原始日志 4, 2, 3, 1</text>
<text x="620" y="95" font-size="22" fill="#e07828" text-anchor="start">橙：后向两点均值（对齐右端）</text>
<text x="80" y="600" font-size="23" fill="#18324d" text-anchor="start">后向窗口：</text>
<text x="230" y="600" font-size="21" fill="#18324d">t=2</text><text x="300" y="582" font-size="21" fill="#18324d">4+2</text><text x="310" y="620" font-size="21" fill="#18324d">2</text><text x="390" y="600" font-size="21" fill="#18324d">= 3</text><line x1="293" y1="590" x2="360" y2="590" stroke="#18324d" stroke-width="2" /><text x="520" y="600" font-size="21" fill="#18324d">t=3</text><text x="590" y="582" font-size="21" fill="#18324d">2+3</text><text x="600" y="620" font-size="21" fill="#18324d">2</text><text x="680" y="600" font-size="21" fill="#18324d">= 2.5</text><line x1="583" y1="590" x2="650" y2="590" stroke="#18324d" stroke-width="2" /><text x="810" y="600" font-size="21" fill="#18324d">t=4</text><text x="880" y="582" font-size="21" fill="#18324d">3+1</text><text x="890" y="620" font-size="21" fill="#18324d">2</text><text x="970" y="600" font-size="21" fill="#18324d">= 2</text><line x1="873" y1="590" x2="940" y2="590" stroke="#18324d" stroke-width="2" /></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 928) scale(0.7272727273 1) translate(-96 -928)">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 928) scale(0.7272727273 1) translate(-138 -928)">t=2：均值 (4+2) ÷ 2 = 3</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1010) scale(0.7272727273 1) translate(-96 -1010)">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1010) scale(0.7272727273 1) translate(-138 -1010)">t=3：均值 (2+3) ÷ 2 = 2.5</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1092) scale(0.7272727273 1) translate(-96 -1092)">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1092) scale(0.7272727273 1) translate(-138 -1092)">t=4：均值 (3+1) ÷ 2 = 2</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">t=3 后向窗口</text><rect x="991" y="900" width="200.5" height="65" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1091.25" y="939.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1091.25 939.5) scale(0.7272727273 1) translate(-1091.25 -939.5)">t2:2</text><rect x="1198.5" y="900" width="200.5" height="65" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1298.75" y="939.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1298.75 939.5) scale(0.7272727273 1) translate(-1298.75 -939.5)">t3:3</text><text x="806" y="996" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 996) scale(0.7272727273 1) translate(-806 -996)">t=3 居中窗口</text><rect x="991" y="972" width="131.333" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1056.67" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1056.67 1011.5) scale(0.7272727273 1) translate(-1056.67 -1011.5)">t2:2</text><rect x="1129.33" y="972" width="131.333" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1011.5) scale(0.7272727273 1) translate(-1195 -1011.5)">t3:3</text><rect x="1267.67" y="972" width="131.333" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1333.33" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1333.33 1011.5) scale(0.7272727273 1) translate(-1333.33 -1011.5)">t4:1</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">居中三点均值为 2，使用了 t4 的记录</text></g></svg>
