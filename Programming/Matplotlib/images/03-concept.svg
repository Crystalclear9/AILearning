<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">配对差值与独立重复</title><desc id="plateDesc">B 对三个相同对象逐项作差，得到 1、1、1。C 使用本例样本方差：A 与 B 各为 9；忽略配对会按两个独立均值计算出约 2.449 的差值标准误差，而实际配对差的样本标准差为零。这里的零只来自这组构造数据，不能解释为所有未来对象都没有不确定性。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">配对差值与独立重复</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">同一对象的配对差值</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">差值稳定而原分数波动</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">忽略配对会丢失协方差</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet">
<title>配对差值与独立重复</title><desc>同一行连接的是同一个实验对象，两模型分数各自有波动，但差值在示例里恒为一。比较差值时，配对协方差是重要信息，不能只根据两组误差条是否重叠判断差异。 该例只是展示配对机制，不意味着三次重复足够给出可靠推断。对象必须真正对应；相同数组下标或相同种子编号本身不能建立合法配对。</desc>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">配对差值与独立重复</text>
<text x="180" y="110" font-size="23" fill="#18324d" text-anchor="start">蓝点：模型 A=[4,7,10]    橙点：模型 B=[3,6,9]    差值 A−B=1</text>
<line x1="180" y1="510" x2="1110" y2="510" stroke="#64748b" stroke-width="3" />
<line x1="180" y1="510" x2="180" y2="160" stroke="#64748b" stroke-width="3" />
<text x="210" y="545" font-size="18" fill="#18324d" text-anchor="middle">0</text>
<text x="292" y="545" font-size="18" fill="#18324d" text-anchor="middle">1</text>
<text x="374" y="545" font-size="18" fill="#18324d" text-anchor="middle">2</text>
<text x="456" y="545" font-size="18" fill="#18324d" text-anchor="middle">3</text>
<text x="538" y="545" font-size="18" fill="#18324d" text-anchor="middle">4</text>
<text x="620" y="545" font-size="18" fill="#18324d" text-anchor="middle">5</text>
<text x="702" y="545" font-size="18" fill="#18324d" text-anchor="middle">6</text>
<text x="784" y="545" font-size="18" fill="#18324d" text-anchor="middle">7</text>
<text x="866" y="545" font-size="18" fill="#18324d" text-anchor="middle">8</text>
<text x="948" y="545" font-size="18" fill="#18324d" text-anchor="middle">9</text>
<text x="1030" y="545" font-size="18" fill="#18324d" text-anchor="middle">10</text>
<text x="155" y="212" font-size="21" fill="#18324d" text-anchor="end">对象 1</text>
<line x1="456" y1="205" x2="538" y2="205" stroke="#64748b" stroke-width="3" />
<circle cx="538" cy="205" r="10" fill="#2563eb" />
<circle cx="456" cy="205" r="10" fill="#e07828" />
<text x="497" y="178" font-size="20" fill="#059669" text-anchor="middle">A−B = 1</text>
<text x="155" y="332" font-size="21" fill="#18324d" text-anchor="end">对象 2</text>
<line x1="702" y1="325" x2="784" y2="325" stroke="#64748b" stroke-width="3" />
<circle cx="784" cy="325" r="10" fill="#2563eb" />
<circle cx="702" cy="325" r="10" fill="#e07828" />
<text x="743" y="298" font-size="20" fill="#059669" text-anchor="middle">A−B = 1</text>
<text x="155" y="452" font-size="21" fill="#18324d" text-anchor="end">对象 3</text>
<line x1="948" y1="445" x2="1030" y2="445" stroke="#64748b" stroke-width="3" />
<circle cx="1030" cy="445" r="10" fill="#2563eb" />
<circle cx="948" cy="445" r="10" fill="#e07828" />
<text x="989" y="418" font-size="20" fill="#059669" text-anchor="middle">A−B = 1</text>
<text x="1110" y="580" font-size="20" fill="#18324d" text-anchor="end">模型分数</text>
<text x="190" y="607" font-size="23" fill="#18324d" text-anchor="start">三行连线对应同一对象；两组分数波动大，但配对差值恒为 1。</text>
</g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">模型 A</text><rect x="281" y="900" width="131.333" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="346.667" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(346.667 938.5) scale(0.7272727273 1) translate(-346.667 -938.5)">4</text><rect x="419.333" y="900" width="131.333" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 938.5) scale(0.7272727273 1) translate(-485 -938.5)">7</text><rect x="557.667" y="900" width="131.333" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="623.333" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(623.333 938.5) scale(0.7272727273 1) translate(-623.333 -938.5)">10</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">模型 B</text><rect x="281" y="970" width="131.333" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="346.667" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(346.667 1008.5) scale(0.7272727273 1) translate(-346.667 -1008.5)">3</text><rect x="419.333" y="970" width="131.333" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1008.5) scale(0.7272727273 1) translate(-485 -1008.5)">6</text><rect x="557.667" y="970" width="131.333" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="623.333" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(623.333 1008.5) scale(0.7272727273 1) translate(-623.333 -1008.5)">9</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">逐项 A−B</text><rect x="281" y="1040" width="131.333" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="346.667" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(346.667 1078.5) scale(0.7272727273 1) translate(-346.667 -1078.5)">1</text><rect x="419.333" y="1040" width="131.333" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1078.5) scale(0.7272727273 1) translate(-485 -1078.5)">1</text><rect x="557.667" y="1040" width="131.333" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="623.333" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(623.333 1078.5) scale(0.7272727273 1) translate(-623.333 -1078.5)">1</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">差值均值为 1，样本标准差为 0</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1029.33 L1381,1029.33" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1035.33" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1035.33) scale(0.7272727273 1) translate(-856 -1035.33)">1</text><path d="M866,973.667 L1381,973.667" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="979.667" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 979.667) scale(0.7272727273 1) translate(-856 -979.667)">2</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 924) scale(0.7272727273 1) translate(-856 -924)">3</text><text x="994.75" y="1075" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(994.75 1075) scale(0.7272727273 1) translate(-994.75 -1075)">0</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(869 1113) scale(0.7272727273 1) translate(-869 -1113)">配对差均值 SE</text><rect x="1209.25" y="948.645" width="86" height="136.355" rx="3" fill="#d17c3e" stroke="#d17c3e" /><text x="1252.25" y="938.645" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1252.25 938.645) scale(0.7272727273 1) translate(-1252.25 -938.645)">2.449</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1126.5 1113) scale(0.7272727273 1) translate(-1126.5 -1113)">错误忽略配对 SE</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1153) scale(0.7272727273 1) translate(-806 -1153)">标准误差（这个构造例子）</text></g></svg>
