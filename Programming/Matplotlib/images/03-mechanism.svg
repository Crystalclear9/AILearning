text xml:space="preserve" x="950" y="885" font-size="29" fill="#23394a" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">横轴：预测值</text><text xml:space="preserve" x="1360" y="350" font-size="29" fill="#2878a3" text-anchor="start" font-weight="400">MAE = 4</text></g><desc> 均值都为零，个体误差却越来越大 左图橙方为两个残差的平均；右图按同一对观测计算 |r| 的平均，不是均值置信区间。</desc></svg>
