<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">异方差：零均值不代表误差尺度恒定</title><desc id="desc">每个横坐标都有一对正负对称残差，局部均值均为零，但残差绝对值随横坐标扩大。只看均值线会漏掉这种扇形结构；应同时检查离散程度、分箱残差或适合的方差模型。 这是一组人为构造的诊断反例，不是显著性检验；横轴代表预测值，纵轴为真实值减预测值。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">异方差：零均值不代表误差尺度恒定</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">明确对象、计算关系与适用条件，避免只凭外观判断。</text><path d="M130,545 L1090,545" stroke="#ccd9e3" stroke-width="2" fill="none" /><text x="113" y="552" font-size="18" fill="#5c7185" text-anchor="end" font-weight="400">-4</text><path d="M130,455 L1090,455" stroke="#ccd9e3" stroke-width="2" fill="none" /><text x="113" y="462" font-size="18" fill="#5c7185" text-anchor="end" font-weight="400">-2</text><path d="M130,365 L1090,365" stroke="#8ba6b9" stroke-width="2" fill="none" /><text x="113" y="372" font-size="18" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M130,275 L1090,275" stroke="#ccd9e3" stroke-width="2" fill="none" /><text x="113" y="282" font-size="18" fill="#5c7185" text-anchor="end" font-weight="400">2</text><path d="M130,185 L1090,185" stroke="#ccd9e3" stroke-width="2" fill="none" /><text x="113" y="192" font-size="18" fill="#5c7185" text-anchor="end" font-weight="400">4</text><text x="157.17" y="577" font-size="19" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="459.057" y="577" font-size="19" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><text x="760.943" y="577" font-size="19" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><text x="1062.83" y="577" font-size="19" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><path d="M130,545 L1090,545" stroke="#20384f" stroke-width="2" fill="none" /><path d="M130,185 L130,545" stroke="#20384f" stroke-width="2" fill="none" /><text x="70" y="160" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">残差 y−预测值</text><text x="1090" y="615" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">预测值</text><circle cx="157.17" cy="410.00" r="6" fill="#268d8c" stroke="white" /><circle cx="157.17" cy="320.00" r="6" fill="#268d8c" stroke="white" /><circle cx="459.06" cy="455.00" r="6" fill="#268d8c" stroke="white" /><circle cx="459.06" cy="275.00" r="6" fill="#268d8c" stroke="white" /><circle cx="760.94" cy="500.00" r="6" fill="#268d8c" stroke="white" /><circle cx="760.94" cy="230.00" r="6" fill="#268d8c" stroke="white" /><circle cx="1062.83" cy="545.00" r="6" fill="#268d8c" stroke="white" /><circle cx="1062.83" cy="185.00" r="6" fill="#268d8c" stroke="white" /><path d="M160,653 L195,653" stroke="#268d8c" stroke-width="4" fill="none" /><text x="208" y="660" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">残差观测</text><text x="60" y="695" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">条件与计算见相邻正文。</text></g></svg>
