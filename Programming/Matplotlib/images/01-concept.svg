<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">数据坐标与画布坐标</title><desc id="plateDesc">B 固定 800×400 像素画布，Axes 左下角为 (100,80)、宽高为 600 与 240，数据两轴范围均为 [0,1]；点 (0.5,0.5) 因此映射到像素 (400,200)。C 改用 x∈[0,2]、y∈[0,10]，同一个数据点的轴内比例变成 (0.25,0.05)，而 Axes 坐标 (0.5,0.5) 始终在轴框中央。画布与坐标范围仅用于本图算例。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">数据坐标与画布坐标</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">坐标映射与显示位置</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">明确画布与坐标范围</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">坐标系混用会改变位置</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet">
<title>数据坐标与画布坐标</title><desc>图中把数据位置和显示位置分成两层。数据点先依照轴范围与缩放规则映入 Axes，再依照画布尺寸确定像素位置。比较模型曲线时，应先固定数据单位和轴范围，再决定图像尺寸。 箭头表示坐标映射，不是数据处理。对数轴改变映射函数；改字号、边距或导出分辨率也可能改变像素位置，但不会让原数据点的数值变成另一条观测。</desc>
<defs><marker id="panelA-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker><marker id="panelA-tip-64748b" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#64748b" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">数据坐标与画布坐标</text>
<rect x="60" y="105" width="470" height="440" rx="6" fill="#f8fafc" stroke="#64748b" />
<text x="75" y="135" font-size="23" fill="#18324d" text-anchor="start">Figure：显示像素画布</text>
<line x1="130" y1="470" x2="460" y2="470" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<line x1="130" y1="470" x2="130" y2="215" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<text x="460" y="525" font-size="18" fill="#18324d" text-anchor="end">数据 x</text>
<text x="130" y="197" font-size="18" fill="#18324d" text-anchor="start">数据 y</text>
<text x="130" y="498" font-size="16" fill="#18324d" text-anchor="middle">0</text>
<text x="115" y="470" font-size="16" fill="#18324d" text-anchor="end">0</text>
<text x="295.0" y="498" font-size="16" fill="#18324d" text-anchor="middle">0.5</text>
<text x="115" y="342.5" font-size="16" fill="#18324d" text-anchor="end">0.5</text>
<text x="460" y="498" font-size="16" fill="#18324d" text-anchor="middle">1</text>
<text x="115" y="215" font-size="16" fill="#18324d" text-anchor="end">1</text>
<circle cx="295" cy="342.5" r="7" fill="#2563eb" />
<text x="315" y="330" font-size="19" fill="#2563eb" text-anchor="start">数据点 (0.5, 0.5)</text>
<text x="140" y="580" font-size="20" fill="#18324d" text-anchor="start">Axes 内的位置由数据范围确定</text>
<line x1="540" y1="320" x2="650" y2="320" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" marker-end="url(#panelA-tip-64748b)" />
<text x="580" y="295" font-size="18" fill="#18324d" text-anchor="middle">映射</text>
<rect x="690" y="105" width="450" height="440" rx="6" fill="#f8fafc" stroke="#64748b" />
<text x="715" y="145" font-size="22" fill="#18324d" text-anchor="start">同一数据点，不同显示像素位置</text>
<rect x="735" y="195" width="340" height="230" rx="6" fill="white" stroke="#64748b" />
<line x1="760" y1="395" x2="1045" y2="395" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<line x1="760" y1="395" x2="760" y2="220" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<circle cx="902.5" cy="307.5" r="7" fill="#e07828" />
<line x1="902.5" y1="307.5" x2="902.5" y2="395" stroke="#e07828" stroke-width="2.5" stroke-dasharray="5 4" />
<line x1="760" y1="307.5" x2="902.5" y2="307.5" stroke="#e07828" stroke-width="2.5" stroke-dasharray="5 4" />
<text x="800" y="465" font-size="19" fill="#18324d" text-anchor="start">像素位置还受边距、尺寸影响</text>
<text x="720" y="510" font-size="18" fill="#18324d" text-anchor="start">对数轴：改变数据到显示的映射函数</text>
</g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 928) scale(0.7272727273 1) translate(-96 -928)">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 928) scale(0.7272727273 1) translate(-138 -928)">画布 800×400；Axes 左下 (100,80)</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1010) scale(0.7272727273 1) translate(-96 -1010)">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1010) scale(0.7272727273 1) translate(-138 -1010)">Axes 宽 600、高 240</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1092) scale(0.7272727273 1) translate(-96 -1092)">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1092) scale(0.7272727273 1) translate(-138 -1092)">数据范围 [0,1]×[0,1] → 点 (400,200)</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="806" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="815" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 923) scale(0.7272727273 1) translate(-815 -923)">对象</text><rect x="1006" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1015" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 923) scale(0.7272727273 1) translate(-1015 -923)">横向比例</text><rect x="1206" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1215" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 923) scale(0.7272727273 1) translate(-1215 -923)">纵向比例</text><rect x="806" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="815" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 978) scale(0.7272727273 1) translate(-815 -978)">数据点 (0.5,0.5)</text><rect x="1006" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1015" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 978) scale(0.7272727273 1) translate(-1015 -978)">0.25</text><rect x="1206" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1215" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 978) scale(0.7272727273 1) translate(-1215 -978)">0.05</text><rect x="806" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="815" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 1036) scale(0.7272727273 1) translate(-815 -1036)">Axes 点 (0.5,0.5)</text><rect x="1006" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1015" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 1036) scale(0.7272727273 1) translate(-1015 -1036)">0.5</text><rect x="1206" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1215" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 1036) scale(0.7272727273 1) translate(-1215 -1036)">0.5</text><text x="806" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1150) scale(0.7272727273 1) translate(-806 -1150)">对照范围：x∈[0,2]，y∈[0,10]</text></g></svg>
