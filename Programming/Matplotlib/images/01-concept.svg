<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">数据坐标与画布坐标</title><desc id="plateDesc">B 固定 800×400 像素画布，Axes 左下角为 (100,80)、宽高为 600 与 240，数据两轴范围均为 [0,1]；点 (0.5,0.5) 因此映射到像素 (400,200)。C 改用 x∈[0,2]、y∈[0,10]，同一个数据点的轴内比例变成 (0.25,0.05)，而 Axes 坐标 (0.5,0.5) 始终在轴框中央。画布与坐标范围仅用于本图算例。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">数据坐标与画布坐标</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Matplotlib</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">坐标映射与显示位置</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">明确画布与坐标范围</text><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">画布 800×400；Axes 左下 (100,80)</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">Axes 宽 600、高 240</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">数据范围 [0,1]×[0,1] → 点 (400,200)</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">坐标系混用会改变位置</text><rect x="806" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="815" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">对象</text><rect x="1006" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="1015" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">横向比例</text><rect x="1206" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="1215" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">纵向比例</text><rect x="806" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="815" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">数据点 (0.5,0.5)</text><rect x="1006" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="1015" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">0.25</text><rect x="1206" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="1215" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">0.05</text><rect x="806" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="815" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">Axes 点 (0.5,0.5)</text><rect x="1006" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="1015" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">0.5</text><rect x="1206" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="1215" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">0.5</text><text x="806" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">对照范围：x∈[0,2]，y∈[0,10]</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 590.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet">
<title>数据坐标与画布坐标</title><desc>图中把数据位置和显示位置分成两层。数据点先依照轴范围与缩放规则映入 Axes，再依照画布尺寸确定像素位置。比较模型曲线时，应先固定数据单位和轴范围，再决定图像尺寸。 箭头表示坐标映射，不是数据处理。对数轴改变映射函数；改字号、边距或导出分辨率也可能改变像素位置，但不会让原数据点的数值变成另一条观测。</desc>
<defs><marker id="panelA-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b" /></marker><marker id="panelA-tip-64748b" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#64748b" /></marker></defs>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#18324d">
<text x="40" y="48" font-size="30" fill="#18324d" text-anchor="start">数据坐标与画布坐标</text>
<rect x="60" y="105" width="470" height="440" rx="6" fill="#f8fafc" stroke="#64748b" />
<text x="75" y="135" font-size="23" fill="#18324d" text-anchor="start">Figure：显示像素画布</text>
<line x1="130" y1="470" x2="460" y2="470" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<line x1="130" y1="470" x2="130" y2="215" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<text x="460" y="525" font-size="18" fill="#18324d" text-anchor="end">数据 x</text>
<text x="130" y="197" font-size="18" fill="#18324d" text-anchor="start">数据 y</text>
<text x="130" y="498" font-size="16" fill="#18324d" text-anchor="middle">0</text>
<text x="115" y="470" font-size="16" fill="#18324d" text-anchor="end">0</text>
<text x="295.0" y="498" font-size="16" fill="#18324d" text-anchor="middle">0.5</text>
<text x="115" y="342.5" font-size="16" fill="#18324d" text-anchor="end">0.5</text>
<text x="460" y="498" font-size="16" fill="#18324d" text-anchor="middle">1</text>
<text x="115" y="215" font-size="16" fill="#18324d" text-anchor="end">1</text>
<circle cx="295" cy="342.5" r="7" fill="#2563eb" />
<text x="315" y="330" font-size="19" fill="#2563eb" text-anchor="start">数据点 (0.5, 0.5)</text>
<text x="140" y="580" font-size="20" fill="#18324d" text-anchor="start">Axes 内的位置由数据范围确定</text>
<line x1="540" y1="320" x2="650" y2="320" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" marker-end="url(#panelA-tip-64748b)" />
<text x="580" y="295" font-size="18" fill="#18324d" text-anchor="middle">映射</text>
<rect x="690" y="105" width="450" height="440" rx="6" fill="#f8fafc" stroke="#64748b" />
<text x="715" y="145" font-size="22" fill="#18324d" text-anchor="start">同一数据点，不同显示像素位置</text>
<rect x="735" y="195" width="340" height="230" rx="6" fill="white" stroke="#64748b" />
<line x1="760" y1="395" x2="1045" y2="395" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<line x1="760" y1="395" x2="760" y2="220" stroke="#64748b" stroke-width="2.5" stroke-dasharray="" />
<circle cx="902.5" cy="307.5" r="7" fill="#e07828" />
<line x1="902.5" y1="307.5" x2="902.5" y2="395" stroke="#e07828" stroke-width="2.5" stroke-dasharray="5 4" />
<line x1="760" y1="307.5" x2="902.5" y2="307.5" stroke="#e07828" stroke-width="2.5" stroke-dasharray="5 4" />
<text x="800" y="465" font-size="19" fill="#18324d" text-anchor="start">像素位置还受边距、尺寸影响</text>
<text x="720" y="510" font-size="18" fill="#18324d" text-anchor="start">对数轴：改变数据到显示的映射函数</text>
</g></svg></svg>
