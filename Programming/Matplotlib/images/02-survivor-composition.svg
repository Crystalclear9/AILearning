<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="632" viewBox="0 85 960 632" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">三条单次运行均不改善，差运行依次停止后可用均值由零点六降到零点四再降到零点二</title><desc id="artwork-desc">没有一条运行改善，“可用运行均值”却在下降 均值变化来自成员退出；停止原因、失败比例与条件性能需要一起解释。</desc><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="581.262103"/></clipPath></defs><rect width="960" height="717" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 69.048899) scale(0.726682)"><g><rect width="1252.267" height="799.885" fill="white" x="13.867" y="61.858"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#154866"><text x="40" y="110" font-size="34.83px" fill="#4a718f">三个恒定损失为 0.2、0.6、1.0；只改变哪些运行还有后续记录</text><polyline points="150,518.0 1040,518.0" stroke="#d9e1e8" stroke-width="1.5" fill="none"/><text x="85" y="528.0" font-size="29.75px" fill="#4a718f">0.2</text><polyline points="150,446.0 1040,446.0" stroke="#d9e1e8" stroke-width="1.5" fill="none"/><text x="85" y="456.0" font-size="29.75px" fill="#4a718f">0.4</text><polyline points="150,374.0 1040,374.0" stroke="#d9e1e8" stroke-width="1.5" fill="none"/><text x="85" y="384.0" font-size="29.75px" fill="#4a718f">0.6</text><polyline points="150,302.0 1040,302.0" stroke="#d9e1e8" stroke-width="1.5" fill="none"/><text x="85" y="312.0" font-size="29.75px" fill="#4a718f">0.8</text><polyline points="150,230.0 1040,230.0" stroke="#d9e1e8" stroke-width="1.5" fill="none"/><text x="85" y="240.0" font-size="29.75px" fill="#4a718f">1.0</text><polyline points="150,190 150,590 1050,590" stroke="#7690a0" stroke-width="2" fill="none"/><polyline points="150,518.0 1020,518.0" stroke="#0a6f84" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="150" cy="518.0" r="6" fill="#0a6f84"/><circle cx="295" cy="518.0" r="6" fill="#0a6f84"/><circle cx="440" cy="518.0" r="6" fill="#0a6f84"/><circle cx="585" cy="518.0" r="6" fill="#0a6f84"/><circle cx="730" cy="518.0" r="6" fill="#0a6f84"/><circle cx="875" cy="518.0" r="6" fill="#0a6f84"/><circle cx="1020" cy="518.0" r="6" fill="#0a6f84"/><text x="1040" y="528.0" font-size="33.54px" fill="#127f84">持续运行</text><polyline points="150,374.0 730,374.0" stroke="#c66422" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="150" cy="374.0" r="6" fill="#c66422"/><circle cx="295" cy="374.0" r="6" fill="#c66422"/><circle cx="440" cy="374.0" r="6" fill="#c66422"/><circle cx="585" cy="374.0" r="6" fill="#c66422"/><circle cx="730" cy="374.0" r="6" fill="#c66422"/><text x="750" y="384.0" font-size="33.54px" fill="#a85d27">此后停止</text><polyline points="150,230.0 440,230.0" stroke="#7e8898" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="150" cy="230.0" r="6" fill="#7e8898"/><circle cx="295" cy="230.0" r="6" fill="#7e8898"/><circle cx="440" cy="230.0" r="6" fill="#7e8898"/><text x="460" y="240.0" font-size="33.54px" fill="#47586b">此后停止</text><polyline points="150,374.0 585,374.0 585,446.0 875,446.0 875,518.0 1020,518.0" stroke="#127eba" stroke-width="6" fill="none"/><text x="710" y="480" font-size="36.467116px" fill="#1d77b7">可用运行均值</text><text x="142" y="635" font-size="29.75px" fill="#173c58">0</text><text x="287" y="635" font-size="29.75px" fill="#173c58">1</text><text x="432" y="635" font-size="29.75px" fill="#173c58">2</text><text x="577" y="635" font-size="29.75px" fill="#173c58">3</text><text x="722" y="635" font-size="29.75px" fill="#173c58">4</text><text x="867" y="635" font-size="29.75px" fill="#173c58">5</text><text x="1012" y="635" font-size="29.75px" fill="#173c58">6</text><text x="1070" y="635" font-size="36.12px" fill="#173c58">预算</text><text x="70" y="719" font-size="36.467116px" fill="#173c58">可用运行数</text><text x="143" y="790" font-size="35.7px" fill="#1d77b7">3</text><text x="288" y="790" font-size="35.7px" fill="#1d77b7">3</text><text x="433" y="790" font-size="35.7px" fill="#1d77b7">3</text><text x="578"