<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="535" viewBox="0 0 1320 535" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">同一个生成器被分两次消费</title><desc id="figure-desc">next 取得零，后续 list 从暂停位置继续收集一和二。</desc><defs><marker id="tip-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><marker id="tip-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#176c78"/></marker><marker id="tip-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#b04d3b"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#635580"/></marker><linearGradient id="water" x1="0%" x2="90%" y1="0%" y2="100%"><stop offset="0%" stop-color="#85cbd2" stop-opacity=".13"/><stop offset="100%" stop-color="#85cbd2" stop-opacity=".52"/></linearGradient><linearGradient id="peach" x1="0%" x2="90%" y1="0%" y2="100%"><stop offset="0%" stop-color="#eea899" stop-opacity=".13"/><stop offset="100%" stop-color="#eea899" stop-opacity=".52"/></linearGradient><linearGradient id="lavender" x1="0%" x2="90%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b6a9d4" stop-opacity=".13"/><stop offset="100%" stop-color="#b6a9d4" stop-opacity=".52"/></linearGradient></defs><rect x="0" y="0" width="1320" height="535" fill="white"/><text x="137" y="75" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="35" text-anchor="middle" fill="#202a37">调用创建</text><text x="467" y="75" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="35" text-anchor="middle" fill="#202a37">首次推进</text><text x="923" y="75" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="35" text-anchor="middle" fill="#202a37">继续消费</text><line x1="128" y1="253" x2="1153" y2="253" stroke="#202a37" stroke-width="2" stroke-linecap="round" marker-end="url(#tip-ink)"/><circle cx="160" cy="253" r="6" stroke="#202a37" stroke-width="1.9" fill="white"/><text x="160" y="210" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" fill="#202a37">values()</text><circle cx="437" cy="253" r="6" stroke="#202a37" stroke-width="1.9" fill="white"/><text x="437" y="210" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" fill="#202a37">next(g)</text><rect x="403" y="304" width="68" height="63" fill="url(#water)" stroke="#176c78" stroke-width="1.75"/><text x="437" y="346" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="33" text-anchor="middle" fill="#176c78">0</text><circle cx="706" cy="253" r="6" stroke="#202a37" stroke-width="1.9" fill="white"/><text x="706" y="210" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" fill="#202a37">yield</text><rect x="672" y="304" width="68" height="63" fill="url(#peach)" stroke="#b04d3b" stroke-width="1.75"/><text x="706" y="346" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="33" text-anchor="middle" fill="#b04d3b">1</text><circle cx="919" cy="253" r="6" stroke="#202a37" stroke-width="1.9" fill="white"/><text x="919" y="210" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" fill="#202a37">yield</text><rect x="885" y="304" width="68" height="63" fill="url(#peach)" stroke="#b04d3b" stroke-width="1.75"/><text x="919" y="346" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="33" text-anchor="middle" fill="#b04d3b">2</text><circle cx="1107" cy="253" r="6" stroke="#202a37" stroke-width="1.9" fill="white"/><text x="1107" y="210" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle" fill="#202a37">停止</text><line x1="640" y1="155" x2="1145" y2="155" stroke="#b04d3b" stroke-width="2" stroke-linecap="round"/><line x1="640" y1="155" x2="640" y2="170" stroke="#b04d3b" stroke-width="2" stroke-linecap="round"/><line x1="1145" y1="155" x2="1145" y2="170" stroke="#b04d3b" stroke-width="2" stroke-linecap="round"/><text x="892" y="135" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="30" text-anchor="middle" fill="#b04d3b">list(g)</text><text x="167" y="450" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle" fill="#202a37">尚未执行函数体</text><text x="436" y="450" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle" fill="#176c78">返回后暂停</text><text x="880" y="450" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle" fill="#b04d3b">收集</text><text x="975" y="450" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="31" text-anchor="middle" fill="#b04d3b">[1, 2]</text></svg>