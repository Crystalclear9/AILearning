<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="537.48" viewBox="-18.24 28.76 996.48 537.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">可变容器的不变型来自写入风险</title><desc id="artwork-desc">同一个列表，两份承诺：写入会破坏哪一份？ 静态 Sequence 接口不暴露 append；运行时对象仍可能是列表。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="450.571963"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="537.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="501" viewBox="0 47 960 501" overflow="hidden"><rect width="960" height="548" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 32.571298) scale(0.726682)"><g><rect width="1252.267" height="620.04" fill="#ffffff" x="13.867" y="59.763"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#466779" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#1c4c64"><text x="40" y="108" font-size="34.83px" fill="#4c738b">反证假设：允许把 list[Cat] 传给接收 list[Animal] 的可写接口</text><text x="40" y="188" font-size="36.467116px" fill="#1d4158" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">调用前</text><text x="65" y="262" font-size="36.467116px" fill="#287aaa">cats: list[Cat]</text><text x="65" y="350" font-size="36.467116px" fill="#9e5a30">animals: list[Animal]</text><line stroke="#466779" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="360" y1="254" x2="640" y2="280"/><line stroke="#466779" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="425" y1="340" x2="640" y2="300"/><path d="M655 216 H1170 V355 H655 Z" fill="#ffffff" stroke="#879aad" stroke-width="2"/><path d="M770 264 L775 233 L793 250 Q800 246 807 250 L825 233 L830 264 Q835 305 800 308 Q765 305 770 264 Z" fill="#ffffff" stroke="#1f7eac" stroke-width="3"/><circle cx="789" cy="275" r="3" fill="#1f7eac"/><circle cx="811" cy="275" r="3" fill="#1f7eac"/><text x="774" y="349" font-size="34.83px" fill="#287aaa">Cat</text><path d="M1000 264 L1005 233 L1023 250 Q1030 246 1037 250 L1055 233 L1060 264 Q1065 305 1030 308 Q995 305 1000 264 Z" fill="#ffffff" stroke="#1f7eac" stroke-width="3"/><circle cx="1019" cy="275" r="3" fill="#1f7eac"/><circle cx="1041" cy="275" r="3" fill="#1f7eac"/><text x="1004" y="349" font-size="34.83px" fill="#287aaa">Cat</text><text x="660" y="395" font-size="36.12px" fill="#1d4158" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">两个名字指向同一个实际列表</text><path d="M40 433 H1240" stroke="#dde5eb" stroke-width="2"/><text x="40" y="488" font-size="36.467116px" fill="#1d4158" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">调用后</text><text x="65" y="563" font-size="36.467116px" fill="#9e5a30">animals.append(Dog())</text><line stroke="#466779" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="452" y1="555" x2="640" y2="590"/><path d="M655 510 H1170 V652 H655 Z" fill="#ffffff" stroke="#879aad" stroke-width="2"/><path d="M730 559 L735 528 L753 545 Q760 541 767 545 L785 528 L790 559 Q795 600 760 603 Q725 600 730 559 Z" fill="#ffffff" stroke="#1f7eac" stroke-width="3"/><circle cx="749" cy="570" r="3" fill="#1f7eac"/><circle cx="771" cy="570" r="3" fill="#1f7eac"/><text x="734" y="644" font-size="34.83px" fill="#287aaa">Cat</text><path d="M900 559 L905 528 L923 545 Q930 541 937 545 L955 528 L960 559 Q965 600 930 603 Q895 600 900 559 Z" fill="#ffffff" stroke="#1f7eac" stroke-width="3"/><circle cx="919" cy="570" r="3" fill="#1f7eac"/><circle cx="941" cy="570" r="3" fill="#1f7eac"/><text x="904" y="644" font-size="34.83px" fill="#287aaa">Cat</text><path d="M1070 542 Q1045 528 1040 555 L1055 589 Q1057 611 1083 613 Q1110 611 1112 589 L1127 555 Q1122 528 1097 542 Z" fill="#ffffff" stroke="#b7612e" stroke-width="3"/><text x="1055" y="644" font-size="34.83px" fill="#9e5a30">Dog</text><text x="65" y="624" font-size="36.467116px" fill="#9e5a30">cats[2] 实际也是 Dog</text></g><desc> 同一个列表，两份承诺：写入会破坏哪一份？ 静态 Sequence 接口不暴露 append；运行时对象仍可能是列表。</desc></g></g></g></svg></svg>