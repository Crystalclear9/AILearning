<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">浅复制保留内部对象共享</title><desc id="plateDesc">B 沿浅复制产生的两条内部引用追踪一次 append。C 单独从 a=[[1]] 的初始状态作深复制，再修改副本，原来的内部列表保持 [1]；两个面板是对照实验，不是先后接在同一对象状态上的操作。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">浅复制保留内部对象共享</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">浅复制只新建外层容器</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">一次内层修改影响两个入口</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">深复制的内部对象相互独立</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">浅复制保留内部对象共享</title><desc id="panelA-desc">图中两份外层列表有不同身份，但它们的第零项仍指向同一个内部列表。复制外层索引不会自动复制内部可变对象，因此追加内部元素会通过两个入口被观察到。 若替换 b 的整个第零项，改变的是 B 中保存的引用，A 不必变化。需要保护到哪一层应由接口契约决定，而不是把所有复制都称为完全独立。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">浅复制保留内部对象共享</text><rect x="100" y="140" width="320" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="130" y="180" font-size="24" fill="#18324d" font-weight="400">a：外层列表 A</text><rect x="140" y="200" width="100" height="45" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="160" y="230" font-size="20" fill="#18324d" font-weight="400">a[0]</text><rect x="780" y="140" width="320" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="810" y="180" font-size="24" fill="#18324d" font-weight="400">b：新外层列表 B</text><rect x="820" y="200" width="100" height="45" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="840" y="230" font-size="20" fill="#18324d" font-weight="400">b[0]</text><rect x="410" y="370" width="380" height="125" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2" /><text x="445" y="415" font-size="24" fill="#18324d" font-weight="400">同一个内部列表 L</text><text x="480" y="465" font-size="24" fill="#18324d" font-weight="400">[1]  →  [1, 2]</text><path d="M240 225 L470 360" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M820 225 L730 360" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="105" y="325" font-size="25" fill="#18324d" font-weight="400">a.copy() 只新建外层列表</text><text x="200" y="550" font-size="26" fill="#18324d" font-weight="400">执行 b[0].append(2) 后，a[0] 与 b[0] 都看到 [1, 2]</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">初始 a[0]</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 938.5) scale(0.7272727273 1) translate(-485 -938.5)">[1]</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">b[0].append(2)</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1008.5) scale(0.7272727273 1) translate(-485 -1008.5)">共同列表变化</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">之后 a[0]、b[0]</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1078.5) scale(0.7272727273 1) translate(-485 -1078.5)">都为 [1,2]</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">a 与 b 的外层不是同一列表</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">重新从 a=[[1]] 出发</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 938.5) scale(0.7272727273 1) translate(-1195 -938.5)">deepcopy</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 994) scale(0.7272727273 1) translate(-806 -994)">修改副本 c[0]</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1008.5) scale(0.7272727273 1) translate(-1195 -1008.5)">[1,2]</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1064) scale(0.7272727273 1) translate(-806 -1064)">原 a[0]</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1078.5) scale(0.7272727273 1) translate(-1195 -1078.5)">[1]</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">深复制示例不与B 中修改后的状态串联</text></g></svg>
