<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">浅复制保留内部对象共享</title><desc id="desc">图中两份外层列表有不同身份，但它们的第零项仍指向同一个内部列表。复制外层索引不会自动复制内部可变对象，因此追加内部元素会通过两个入口被观察到。 若替换 b 的整个第零项，改变的是 B 中保存的引用，A 不必变化。需要保护到哪一层应由接口契约决定，而不是把所有复制都称为完全独立。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">浅复制保留内部对象共享</text><rect x="100" y="140" width="320" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="130" y="180" font-size="24" fill="#18324d" font-weight="400">a：外层列表 A</text><rect x="140" y="200" width="100" height="45" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="160" y="230" font-size="20" fill="#18324d" font-weight="400">a[0]</text><rect x="780" y="140" width="320" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="810" y="180" font-size="24" fill="#18324d" font-weight="400">b：新外层列表 B</text><rect x="820" y="200" width="100" height="45" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="840" y="230" font-size="20" fill="#18324d" font-weight="400">b[0]</text><rect x="410" y="370" width="380" height="125" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2"/><text x="445" y="415" font-size="24" fill="#18324d" font-weight="400">同一个内部列表 L</text><text x="480" y="465" font-size="24" fill="#18324d" font-weight="400">[1]  →  [1, 2]</text><path d="M240 225 L470 360" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 225 L730 360" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><text x="105" y="325" font-size="25" fill="#18324d" font-weight="400">a.copy() 只新建外层列表</text><text x="200" y="550" font-size="26" fill="#18324d" font-weight="400">执行 b[0].append(2) 后，a[0] 与 b[0] 都看到 [1, 2]</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
