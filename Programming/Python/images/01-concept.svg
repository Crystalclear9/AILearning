<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">浅复制保留内部对象共享</title><desc id="plateDesc">B 沿浅复制产生的两条内部引用追踪一次 append。C 单独从 a=[[1]] 的初始状态作深复制，再修改副本，原来的内部列表保持 [1]；两个面板是对照实验，不是先后接在同一对象状态上的操作。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">浅复制保留内部对象共享</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Python</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">浅复制只新建外层容器</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">一次内层修改影响两个入口</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">初始 a[0]</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">[1]</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">b[0].append(2)</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">共同列表变化</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">之后 a[0]、b[0]</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">都为 [1,2]</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">a 与 b 的外层不是同一列表</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">深复制的内部对象相互独立</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">重新从 a=[[1]] 出</text><text x="806" y="952" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">发</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">deepcopy</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">修改副本 c[0]</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">[1,2]</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">原 a[0]</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">[1]</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">深复制示例不与左侧修改后的状态串联</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">浅复制保留内部对象共享</title><desc id="panelA-desc">图中两份外层列表有不同身份，但它们的第零项仍指向同一个内部列表。复制外层索引不会自动复制内部可变对象，因此追加内部元素会通过两个入口被观察到。 若替换 b 的整个第零项，改变的是 B 中保存的引用，A 不必变化。需要保护到哪一层应由接口契约决定，而不是把所有复制都称为完全独立。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">浅复制保留内部对象共享</text><rect x="100" y="140" width="320" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="130" y="180" font-size="24" fill="#18324d" font-weight="400">a：外层列表 A</text><rect x="140" y="200" width="100" height="45" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="160" y="230" font-size="20" fill="#18324d" font-weight="400">a[0]</text><rect x="780" y="140" width="320" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="810" y="180" font-size="24" fill="#18324d" font-weight="400">b：新外层列表 B</text><rect x="820" y="200" width="100" height="45" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="840" y="230" font-size="20" fill="#18324d" font-weight="400">b[0]</text><rect x="410" y="370" width="380" height="125" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2" /><text x="445" y="415" font-size="24" fill="#18324d" font-weight="400">同一个内部列表 L</text><text x="480" y="465" font-size="24" fill="#18324d" font-weight="400">[1]  →  [1, 2]</text><path d="M240 225 L470 360" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M820 225 L730 360" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="105" y="325" font-size="25" fill="#18324d" font-weight="400">a.copy() 只新建外层列表</text><text x="200" y="550" font-size="26" fill="#18324d" font-weight="400">执行 b[0].append(2) 后，a[0] 与 b[0] 都看到 [1, 2]</text></g></svg></svg>
