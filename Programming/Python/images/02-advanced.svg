<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Welford 更新同时维护均值与离差平方和</title><desc id="desc">前两个样本是 2、4，因此均值为 3，离差平方和 M2 为 2。再加入 8，新均值约为 4.667，Welford 更新给 M2 增加 5 乘约 3.333，得到约 18.667。 M2 不是方差本身。总体方差除以样本数，样本方差通常除以样本数减一；这里展示四舍五入数，精确推导与实现不应提前舍入。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">Welford 更新同时维护均值与离差平方和</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">明确对象、计算关系与适用条件，避免只凭外观判断。</text><path d="M330,235 L435,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M720,235 L830,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M972.5,290 L972.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M830,505 L720,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M266.944,290 L498.056,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><rect x="45" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="187.5" y="227.5" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">旧状态：n=2，均值 3，</text><text x="187.5" y="258.5" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">M2=2</text><rect x="435" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="577.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">新值 x=8；偏差 δ=5</text><rect x="830" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="972.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">新均值：约 4.667</text><rect x="830" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="972.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">剩余偏差：约 3.333</text><rect x="435" y="450" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" /><text x="577.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">新 M2：约 18.667</text><text x="60" y="695" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">条件与计算见相邻正文。</text></g></svg>
