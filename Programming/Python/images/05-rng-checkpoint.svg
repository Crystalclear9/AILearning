<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="546.48" viewBox="-18.24 66.76 996.48 546.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">随机流前三次已消费，保存状态后恢复从第四次继续，仅重新设种子则返回第一次</title><desc id="artwork-desc">种子决定起点，检查点状态决定从哪里续写 状态恢复验证“后续序列相同”；它不证明采样分布正确。</desc><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="459.417864"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="66.76" width="996.48" height="546.48" fill="#ffffff"/><svg id="edition-view" x="0" y="85" width="960" height="510" viewBox="0 85 960 510" overflow="hidden"><rect width="960" height="595" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 70.614899) scale(0.726682)"><g><rect width="1252.267" height="632.213" fill="#ffffff" x="13.867" y="59.703"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#466779" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#1c4c64"><text x="40" y="108" font-size="34.83px" fill="#4c738b">同一个 random.Random(2026)，每个圆点代表一次 random() 调用</text><line fill="none" stroke="#466779" stroke-width="3" marker-end="url(#arrow)" x1="75" y1="222" x2="1200" y2="222"/><circle cx="110" cy="222" r="10" fill="#1f7eac"/><text x="70" y="193" font-size="32.25px" fill="#1d4158">1 次</text><text x="61" y="268" font-size="32.13px" fill="#1d4158">0.119</text><circle cx="260" cy="222" r="10" fill="#1f7eac"/><text x="220" y="193" font-size="32.25px" fill="#1d4158">2 次</text><text x="211" y="268" font-size="32.13px" fill="#1d4158">0.503</text><circle cx="410" cy="222" r="10" fill="#1f7eac"/><text x="370" y="193" font-size="32.25px" fill="#1d4158">3 次</text><text x="361" y="268" font-size="32.13px" fill="#1d4158">0.512</text><circle cx="560" cy="222" r="10" fill="#17677b"/><text x="520" y="193" font-size="32.25px" fill="#1d4158">4 次</text><text x="511" y="268" font-size="32.13px" fill="#1d4158">0.860</text><circle cx="710" cy="222" r="10" fill="#17677b"/><text x="670" y="193" font-size="32.25px" fill="#1d4158">5 次</text><text x="661" y="268" font-size="32.13px" fill="#1d4158">0.103</text><circle cx="860" cy="222" r="10" fill="#17677b"/><text x="820" y="193" font-size="32.25px" fill="#1d4158">6 次</text><text x="811" y="268" font-size="32.13px" fill="#1d4158">0.223</text><circle cx="1010" cy="222" r="10" fill="#17677b"/><text x="970" y="193" font-size="32.25px" fill="#1d4158">7 次</text><text x="961" y="268" font-size="32.13px" fill="#1d4158">0.601</text><circle cx="1160" cy="222" r="10" fill="#17677b"/><text x="1120" y="193" font-size="32.25px" fill="#1d4158">8 次</text><text x="1111" y="268" font-size="32.13px" fill="#1d4158">0.557</text><path d="M485 150 V300" stroke="#b7612e" stroke-width="3" stroke-dasharray="8 6"/><text x="350" y="335" font-size="36.12px" fill="#9e5a30">保存 state：已消费前 3 次</text><text x="40" y="405" font-size="36.467116px" fill="#1b737e" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">恢复检查点</text><line fill="none" stroke="#17677b" stroke-width="3" marker-end="url(#arrow)" x1="280" y1="396" x2="570" y2="396"/><text x="600" y="405" font-size="36.467116px" fill="#1b737e">0.860 → 0.103 → 0.223 → …</text><text x="40" y="460" font-size="34.83px" fill="#1d4158">setstate(state)</text><text x="600" y="459" font-size="34.83px" fill="#1d4158">从第 4 次接着走，匹配 continuation</text><text x="40" y="560" font-size="36.467116px" fill="#9e5a30" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">仅重新设种子</text><line fill="none" stroke="#b7612e" stroke-width="3" marker-end="url(#arrow)" x1="280" y1="551" x2="570" y2="551"/><text x="600" y="560" font-size="36.467116px" fill="#9e5a30">0.119 → 0.503 → 0.512 → …</text><text x="40" y="615" font-size="34.83px" fill="#1d4158">Random(2026)</text><text x="600" y="614" font-size="34.83px" fill="#1d4158">回到第 1 次，重复已经消费的前缀</text><path d="M40 665 H1240" stroke="#dde5eb" stroke-width="2"/></g><desc> 种子决定起点，检查点状态决定从哪里续写 状态恢复验证“后续序列相同”；它不证明采样分布正确。</desc></g></g></g></svg></svg>