<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="885" viewBox="0 85 960 885" role="img" aria-labelledby="artwork-title"><title id="artwork-title">实际deepcopy算例中浅复制共享原标签列表，而深复制的两个字段汇入同一份新列表</title><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="834.906042"/></clipPath></defs><rect width="960" height="970" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 114) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>深复制隔离原图，同时保留复制图内的共享</title><svg width="1440" height="871.17" viewBox="17.500 54.804 1362.667 824.385" role="img"><title>深复制隔离原图，同时保留复制图内的共享</title><rect width="1362.667" height="824.385" fill="white" x="17.5" y="54.804"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="105" font-size="26" fill="#47586b" text-anchor="start" font-weight="normal">执行 c["left"].append("new") 之后；a、b 是两个字典，c 是第三个字典</text><line x1="48" y1="130" x2="1352" y2="130" stroke="#d9e1e8" stroke-width="2"/><line x1="725" y1="185" x2="725" y2="815" stroke="#d9e1e8" stroke-width="2" stroke-dasharray="7 8"/><text x="250" y="222" font-size="29" fill="#2478b6" text-anchor="middle" font-weight="normal">字典 A</text><rect x="140" y="245" width="220" height="160" rx="4" stroke="#1774a8" stroke-width="2" fill="white"/><line x1="140" y1="325" x2="360" y2="325" stroke="#d9e1e8" stroke-width="2"/><text x="160" y="295" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">left</text><line x1="270" y1="245" x2="270" y2="325" stroke="#d9e1e8" stroke-width="2"/><circle cx="315" cy="285" r="7" stroke="#1774a8" stroke-width="2" fill="#1774a8"/><text x="160" y="375" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">right</text><line x1="270" y1="325" x2="270" y2="405" stroke="#d9e1e8" stroke-width="2"/><circle cx="315" cy="365" r="7" stroke="#1774a8" stroke-width="2" fill="#1774a8"/><text x="55" y="336" font-size="33" fill="#2478b6" text-anchor="middle" font-weight="normal">a</text><line x1="80" y1="325" x2="137" y2="325" stroke="#1774a8" stroke-width="3"/><polyline stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round" points="126.469009,330.753106 137,325 126.469009,319.246894"/><text x="250" y="542" font-size="29" fill="#2478b6" text-anchor="middle" font-weight="normal">字典 B</text><rect x="140" y="565" width="220" height="160" rx="4" stroke="#1774a8" stroke-width="2" fill="white"/><line x1="140" y1="645" x2="360" y2="645" stroke="#d9e1e8" stroke-width="2"/><text x="160" y="615" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">left</text><line x1="270" y1="565" x2="270" y2="645" stroke="#d9e1e8" stroke-width="2"/><circle cx="315" cy="605" r="7" stroke="#1774a8" stroke-width="2" fill="#1774a8"/><text x="160" y="695" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">right</text><line x1="270" y1="645" x2="270" y2="725" stroke="#d9e1e8" stroke-width="2"/><circle cx="315" cy="685" r="7" stroke="#1774a8" stroke-width="2" fill="#1774a8"/><text x="55" y="656" font-size="33" fill="#2478b6" text-anchor="middle" font-weight="normal">b</text><line x1="80" y1="645" x2="137" y2="645" stroke="#1774a8" stroke-width="3"/><polyline stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round" points="126.469009,650.753106 137,645 126.469009,639.246894"/><text x="605" y="388" font-size="28" fill="#2478b6" text-anchor="middle" font-weight="normal">列表 L</text><rect x="535" y="425" width="140" height="82" rx="4" stroke="#1774a8" stroke-width="2" fill="white"/><text x="605" y="477" font-size="31" fill="#20354b" text-anchor="middle" font-weight="normal">seed</text><path d="M315,285 C440,285 440,440 530,440" stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round"/><polyline stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round" points="519.469009,445.753106 530,440 519.469009,434.246894"/><path d="M315,365 C440,365 440,452 530,452" stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round"/><polyline stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round" points="519.469009,457.753106 530,452 519.469009,446.246894"/><path d="M315,605 C440,605 440,480 530,480" stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round"/><polyline stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round" points="519.469009,485.753106 530,480 519.469009,474.246894"/><path d="M315,685 C440,685 440,493 530,493" stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round"/><polyline stroke="#1774a8" stroke-width="3" fill="none" stroke-linecap="round" points="519.469009,498.753106 530,493 519.469009,487.246894"/><text x="75" y="800" font-size="30" fill="#2478b6" text-anchor="start" font-weight="normal">b = a.copy()</text><text x="75" y="848" font-size="27" fill="#47586b" text-anchor="start" font-weight="normal">两个外层字典，共享原来的 L</text><text x="980" y="267" font-size="29" fill="#1a7c7f" text-anchor="middle" font-weight="normal">字典 C</text><rect x="870" y="290" width="220" height="160" rx="4" stroke="#126c7e" stroke-width="2" fill="white"/><line x1="870" y1="370" x2="1090" y2="370" stroke="#d9e1e8" stroke-width="2"/><text x="890" y="340" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">left</text><line x1="1000" y1="290" x2="1000" y2="370" stroke="#d9e1e8" stroke-width="2"/><circle cx="1045" cy="330" r="7" stroke="#126c7e" stroke-width="2" fill="#126c7e"/><text x="890" y="420" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">right</text><line x1="1000" y1="370" x2="1000" y2="450" stroke="#d9e1e8" stroke-width="2"/><circle cx="1045" cy="410" r="7" stroke="#126c7e" stroke-width="2" fill="#126c7e"/><text x="785" y="381" font-size="33" fill="#1a7c7f" text-anchor="middle" font-weight="normal">c</text><line x1="810" y1="370" x2="867" y2="370" stroke="#126c7e" stroke-width="3"/><polyline stroke="#126c7e" stroke-width="3" fill="none" stroke-linecap="round" points="856.469009,375.753106 867,370 856.469009,364.246894"/><text x="1210" y="720" font-size="29" fill="#1a7c7f" text-anchor="middle" font-weight="normal">列表 L′</text><rect x="1100" y="590" width="240" height="82" rx="4" stroke="#126c7e" stroke-width="2" fill="white"/><line x1="1220" y1="590" x2="1220" y2="672" stroke="#d9e1e8" stroke-width="2"/><text x="1160" y="644" font-size="30" fill="#20354b" text-anchor="middle" font-weight="normal">seed</text><text x="1280" y="644" font-size="30" fill="#ae602b" text-anchor="middle" font-weight="normal">new</text><text x="800" y="800" font-size="30" fill="#1a7c7f" text-anchor="start" font-weight="normal">c = deepcopy(a)</text><text x="800" y="848" font-size="27" fill="#47586b" text-anchor="start" font-weight="normal">两条路径，汇入同一个新 L′</text><circle cx="1210" cy="550" r="4" fill="#126c7e"/><path d="M1210,558 L1210,586 M1204,575 L1210,586 L1216,575" stroke="#126c7e" stroke-width="3" fill="none"/><path d="M1045,330 C1150,330 1210,420 1210,550" stroke="#126c7e" stroke-width="3" fill="none"/><polyline stroke="#126c7e" stroke-width="3" fill="none" points="1204.726319,540.346592 1210,550 1215.273681,540.346592"/><path d="M1045,410 C1120,410 1150,520 1210,550" stroke="#126c7e" stroke-width="3" fill="none"/><polyline stroke="#126c7e" stroke-width="3" fill="none" points="1199.007267,550.399788 1210,550 1203.724191,540.965941"/></g><desc> 深复制隔离原图，同时保留复制图内的共享 复制记忆 memo 对同一个源列表只建立一份对应副本；它不是“每条路径都复制一遍”。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 871.17) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#1d3145" text-anchor="start">复制保留什么：相同值、独立身份、内部共享是三个不同问题</text><rect x="70" y="145" width="232" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="186.0" y="184" font-size="36.12px" fill="#1e7499" text-anchor="middle">原 A.left</text><rect x="310" y="145" width="232" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="426.0" y="184" font-size="36.12px" fill="#1e7499" text-anchor="middle">原 A.right</text><rect x="790" y="145" width="232" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="906.0" y="184" font-size="36.12px" fill="#af6033" text-anchor="middle">新 C.left</text><rect x="1030" y="145" width="232" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="1146.0" y="184" font-size="36.12px" fill="#af6033" text-anchor="middle">新 C.right</text><text x="65" y="275" font-size="37.41px" fill="#1e7499" text-anchor="start">A.left is A.right：True</text><text x="760" y="275" font-size="37.41px" fill="#af6033" text-anchor="start">C.left is C.right：True</text><text x="65" y="340" font-size="39.99px" fill="#1d3145" text-anchor="start">A.left is C.left：False</text><text x="760" y="340" font-size="36.12px" fill="#1d3145" text-anchor="start">深复制不会把内部共享拆成两份</text><text x="65" y="410" font-size="36.12px" fill="#1d3145" text-anchor="start">memo 按已复制对象记账：复制原对象一次，多条引用复用同一份新对象。</text></g></g></g></g></g></svg>