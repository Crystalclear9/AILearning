<title id="fig-title">一个失败，两层异常对象</title>
<desc id="fig-desc">ValueError 保存转换失败现场，ScoreParseError 提供记录和字段信息。外层异常的 cause 指回原对象。</desc>
<rect x="0" y="0" width="1200" height="427" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1edf6"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7f8"/></linearGradient>
</defs>
<text x="75" y="58" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="31" text-anchor="start" font-weight="400">读取分数失败后保留两层信息</text>
<text x="76" y="101" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="24" text-anchor="start" font-weight="400">第 5 条记录 · score 原值为 bad</text>
