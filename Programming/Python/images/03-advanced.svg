<path d="M688 233 L530 233" fill="none" stroke="#a84b3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M530 233 L541 228 L541 238 Z" fill="#a84b3b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="607" y="268" fill="#a84b3b" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="20" text-anchor="middle" font-weight="400">outer.__cause__</text>
<text x="90" y="310" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="24" text-anchor="start" font-weight="400">float("bad") 失败</text>
