<svg xmlns="http://www.w3.org/2000/svg" width="1257.78" height="677.285" viewBox="11.1101 40.9541 1257.78 677.285" role="img" aria-labelledby="plate-title"><title id="plate-title">异常链保留底层原因与上层语义</title><desc> 保留底层原因，再附上“哪条记录、哪个字段” 只拼接一段错误文本，不等于保留结构化异常链。</desc><rect id="edition-paper" x="11.1101" y="40.9541" width="1257.78" height="677.285" fill="#ffffff"/><svg id="edition-view" x="34.133" y="63.977" width="1211.73" height="631.239" viewBox="34.133 63.977 1211.733 631.239" overflow="hidden"><rect width="1211.733" height="631.239" fill="#ffffff" x="34.133" y="63.977"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="27" fill="#5b747d">同一次失败：第 5 条记录，score 字段原值为 bad</text><text x="60" y="195" font-size="29" fill="#2a708b">执行 float("bad")</text><text x="700" y="195" font-size="29" fill="#a2603f" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">转换成领域错误</text><line x1="60" y1="225" x2="590" y2="225" stroke="#e3e8ee" stroke-width="2"/><line x1="700" y1="225" x2="1220" y2="225" stroke="#e3e8ee" stroke-width="2"/><text x="60" y="280" font-size="31" fill="#2a708b">ValueError 对象 e</text><text x="60" y="335" font-size="27" fill="#273240" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">原因：字符串不能转换成浮点数</text><text x="60" y="390" font-size="27" fill="#273240">保留转换失败位置的 traceback</text><text x="700" y="280" font-size="30" fill="#a2603f">ScoreParseError 对象 outer</text><text x="700" y="335" font-size="27" fill="#273240">消息：record 5: score invalid</text><text x="700" y="390" font-size="27" fill="#273240" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">保留上层记录与字段上下文</text><line x1="765" y1="455" x2="250" y2="455" stroke="#b26945" stroke-width="3"/><polyline points="265,448 250,455 265,462" stroke="#b26945" stroke-width="3" fill="none"/><text x="380" y="495" font-size="29" fill="#a2603f">outer.__cause__ is e</text><text x="60" y="575" font-size="27" fill="#273240">抛出方式：raise ScoreParseError("record 5: score invalid") from e</text><line x1="60" y1="615" x2="1220" y2="615" stroke="#e3e8ee" stroke-width="2"/><text x="60" y="665" font-size="28" fill="#273240" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">两个异常仍是两个对象；上层错误没有抹掉原来的原因和调用位置。</text></g></svg></svg>
