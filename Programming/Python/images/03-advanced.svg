<path d="M691 250 L731 153 L1136 153 L1096 250 Z" fill="url(#r)" stroke="#a84b3b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="913.5" y="210.95" fill="#a84b3b" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="27" text-anchor="middle" font-weight="400">ScoreParseError 对象 outer</text>
<path d="M517 185 L676 185" fill="none" stroke="#202a37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
