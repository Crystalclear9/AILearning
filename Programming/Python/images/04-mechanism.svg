<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><title>配置摘要以前，先决定哪些差别应当被保留</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#778994"/></marker></defs><rect width="1500" height="980" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#203747"><text x="55" y="66" font-size="40" fill="#203747" text-anchor="start">配置摘要以前，先决定哪些差别应当被保留</text><text x="55" y="117" font-size="28" fill="#778994" text-anchor="start">本例只含有限 JSON 数值与固定字段；规范形式：排序键、紧凑分隔、UTF-8</text><text x="60" y="220" font-size="30" fill="#203747" text-anchor="start">原表示 1</text><rect x="300" y="175" width="690" height="80" fill="#edf4f9" stroke="none" stroke-width="2"/><text x="330" y="227" font-size="32" fill="#203747" text-anchor="start">{&quot;lr&quot;:0.1,&quot;seed&quot;:7}</text><text x="1120" y="227" font-size="28" fill="#c56b31" text-anchor="start">f8c66b1e2b20</text><text x="60" y="390" font-size="30" fill="#203747" text-anchor="start">原表示 2</text><rect x="300" y="345" width="690" height="80" fill="#edf4f9" stroke="none" stroke-width="2"/><text x="330" y="397" font-size="32" fill="#203747" text-anchor="start">{&quot;seed&quot;:7,&quot;lr&quot;:0.1}</text><text x="1120" y="397" font-size="28" fill="#c56b31" text-anchor="start">2ed249705849</text><text x="60" y="545" font-size="30" fill="#203747" text-anchor="start">解析后同一映射</text><path d="M990 425L1020 550L800 615" fill="none" stroke="#778994" stroke-width="2" marker-end="url(#a)"/><path d="M990 255L1060 550L800 615" fill="none" stroke="#778994" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="620" width="690" height="90" fill="#eaf3f0" stroke="#43867c" stroke-width="2"/><text x="330" y="675" font-size="36" fill="#43867c" text-anchor="start">{&quot;lr&quot;:0.1,&quot;seed&quot;:7}</text><text x="1050" y="675" font-size="30" fill="#43867c" text-anchor="start">f8c66b1e2b20</text><text x="60" y="810" font-size="30" fill="#203747" text-anchor="start">这里只消除了字段顺序差别；0.1 与 0.10 在解析后也同为同一个浮点值。</text><text x="60" y="875" font-size="28" fill="#203747" text-anchor="start">路径指向的新数据、依赖库与代码版本，若未编码进来，摘要就不会替你固定它们。</text></g></svg>
