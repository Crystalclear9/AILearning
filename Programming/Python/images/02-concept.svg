<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">生成器的创建与消费分离</title><desc id="plateDesc">B 以依次产生 1、4 的生成器说明暂停位置与返回值；第三次推进会耗尽。C 对比复用同一耗尽对象和重新创建新对象，强调生成器函数或表达式可以创建新迭代器，而一个旧迭代器本身不会因此回到起点。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">生成器的创建与消费分离</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Python</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">创建、执行、暂停与耗尽是不同状态</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">两次 next 与一次耗尽</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">生成器</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">依次产生 1、4</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">第一次 next</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">1</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">第二次 next</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">4</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">第三次 next 抛出 StopIteration</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">同一迭代器不会自动重置</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">消费剩余 g</text><rect x="991" y="900" width="408" height="65" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="939.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">空序列</text><text x="806" y="996" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">重新创建同一表达</text><text x="806" y="1024" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">式</text><rect x="991" y="972" width="200.5" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1091.25" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">1</text><rect x="1198.5" y="972" width="200.5" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1298.75" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">4</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">耗尽后的 g 与新生成器不是同一对象</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">生成器的创建与消费分离</title><desc id="panelA-desc">箭头表示同一个生成器对象的生命周期，而不是每次都新调用函数。首次消费才进入函数体，遇到 yield 保存进度；后续消费沿着相同状态继续执行。 需要重复评估时，可以提供生成器工厂或显式物化数据。若生成器拥有文件资源，还应设计提前停止的关闭方式，不能把没有继续消费误当成资源已自动释放。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker><marker id="panelA-tip-47769a" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#47769a" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">生成器的创建与消费分离</text><rect x="50" y="170" width="290" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="75" y="210" font-size="24" fill="#18324d" font-weight="400">创建：g = gen()</text><text x="75" y="245" font-size="22" fill="#18324d" font-weight="400">函数体尚未开始</text><rect x="450" y="170" width="290" height="100" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2" /><text x="475" y="210" font-size="24" fill="#18324d" font-weight="400">首次 next(g)</text><text x="475" y="245" font-size="22" fill="#18324d" font-weight="400">执行到 yield 后暂停</text><rect x="850" y="170" width="300" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="875" y="210" font-size="24" fill="#18324d" font-weight="400">再次 next(g)</text><text x="875" y="245" font-size="22" fill="#18324d" font-weight="400">从暂停点继续</text><path d="M345 220 L435 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M745 220 L835 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M130 380 L1080 380" fill="none" stroke="#47769a" stroke-width="3" marker-end="url(#panelA-tip-47769a)" /><rect x="210" y="360" width="100" height="40" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="215" y="430" font-size="22" fill="#18324d" font-weight="400">执行</text><rect x="410" y="360" width="210" height="40" rx="8" fill="#e3eef8" stroke="#47769a" stroke-width="2" /><text x="440" y="430" font-size="22" fill="#18324d" font-weight="400">暂停 / 消费值</text><rect x="720" y="360" width="100" height="40" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="725" y="430" font-size="22" fill="#18324d" font-weight="400">继续</text><text x="120" y="515" font-size="26" fill="#18324d" font-weight="400">局部变量随生成器保留；暂停不是重新从函数开头运行</text><text x="120" y="555" font-size="24" fill="#18324d" font-weight="400">耗尽后再次 next 会抛出 StopIteration</text></g></svg></svg>
