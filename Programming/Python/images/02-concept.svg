<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">生成器的创建与消费分离</title><desc id="desc">箭头表示同一个生成器对象的生命周期，而不是每次都新调用函数。首次消费才进入函数体，遇到 yield 保存进度；后续消费沿着相同状态继续执行。 需要重复评估时，可以提供生成器工厂或显式物化数据。若生成器拥有文件资源，还应设计提前停止的关闭方式，不能把没有继续消费误当成资源已自动释放。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">生成器的创建与消费分离</text><rect x="50" y="170" width="290" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="75" y="210" font-size="24" fill="#18324d" font-weight="400">创建：g = gen()</text><text x="75" y="245" font-size="22" fill="#18324d" font-weight="400">函数体尚未开始</text><rect x="450" y="170" width="290" height="100" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2"/><text x="475" y="210" font-size="24" fill="#18324d" font-weight="400">首次 next(g)</text><text x="475" y="245" font-size="22" fill="#18324d" font-weight="400">执行到 yield 后暂停</text><rect x="850" y="170" width="300" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="875" y="210" font-size="24" fill="#18324d" font-weight="400">再次 next(g)</text><text x="875" y="245" font-size="22" fill="#18324d" font-weight="400">从暂停点继续</text><path d="M345 220 L435 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 220 L835 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M130 380 L1080 380" fill="none" stroke="#47769a" stroke-width="3" marker-end="url(#arrow)"/><rect x="210" y="360" width="100" height="40" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2"/><text x="215" y="430" font-size="22" fill="#18324d" font-weight="400">执行</text><rect x="410" y="360" width="210" height="40" rx="8" fill="#e3eef8" stroke="#47769a" stroke-width="2"/><text x="440" y="430" font-size="22" fill="#18324d" font-weight="400">暂停 / 消费值</text><rect x="720" y="360" width="100" height="40" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2"/><text x="725" y="430" font-size="22" fill="#18324d" font-weight="400">继续</text><text x="120" y="515" font-size="26" fill="#18324d" font-weight="400">局部变量随生成器保留；暂停不是重新从函数开头运行</text><text x="120" y="555" font-size="24" fill="#18324d" font-weight="400">耗尽后再次 next 会抛出 StopIteration</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
