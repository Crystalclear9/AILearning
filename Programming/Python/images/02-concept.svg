<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="940.48" viewBox="-18.24 28.76 996.48 940.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">生成器的创建与消费分离</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="853.125"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="940.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="904" viewBox="0 47 960 904" overflow="hidden"><rect width="960" height="951" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.56875)"><g><defs><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf6fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>同一个生成器帧在创建、两次暂停和结束时的状态</title><svg width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>同一个生成器帧在创建、两次暂停和结束时的状态</title><rect width="1600" height="1000" fill="#ffffff"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#186585" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#be622d" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#7c8fa2" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1c6c7f" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="110" y="60" font-size="32" fill="#243b4c" text-anchor="start" font-weight="700" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">函数体</text><text x="96" y="140" font-size="29" fill="#243b4c" text-anchor="start" font-weight="400">def squares():</text><text x="96" y="206" font-size="29" fill="#243b4c" text-anchor="start" font-weight="400">    i = 1</text><rect x="75" y="229" width="465" height="59" rx="4" fill="url(#book-wash-eaf4fa)" stroke="none" stroke-width="2"/><text x="96" y="272" font-size="29" fill="#217296" text-anchor="start" font-weight="400">    yield i * i</text><text x="96" y="338" font-size="29" fill="#243b4c" text-anchor="start" font-weight="400">    i = 2</text><rect x="75" y="361" width="465" height="59" rx="4" fill="url(#book-wash-eaf4fa)" stroke="none" stroke-width="2"/><text x="96" y="404" font-size="29" fill="#217296" text-anchor="start" font-weight="400">    yield i * i</text><text x="690" y="60" font-size="32" fill="#243b4c" text-anchor="middle" font-weight="700">生成器 g · 同一个执行帧</text><text x="1375" y="60" font-size="32" fill="#243b4c" text-anchor="middle" font-weight="700" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">调用方</text><line x1="810" y1="104" x2="810" y2="920" stroke="#7c8fa2" stroke-width="2" stroke-dasharray="8 8"/><line x1="1375" y1="104" x2="1375" y2="920" stroke="#7c8fa2" stroke-width="2" stroke-dasharray="8 8"/><text x="1110" y="132" font-size="31" fill="#217296" text-anchor="middle" font-weight="400">squares()</text><line x1="1375" y1="150" x2="820" y2="150" stroke="#186585" stroke-width="3" marker-end="url(#b)"/><rect x="580" y="165" width="460" height="73" rx="4" fill="#ffffff" stroke="#dde5eb" stroke-width="2"/><text x="810" y="212" font-size="27" fill="#243b4c" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未执行函数体</text><line x1="1040" y1="245" x2="1375" y2="245" stroke="#be622d" stroke-width="3" marker-end="url(#o)"/><text x="1200" y="287" font-size="31" fill="#a65b30" text-anchor="middle" font-weight="400">g</text><text x="1110" y="342" font-size="31" fill="#217296" text-anchor="middle" font-weight="400">next(g)</text><line x1="1375" y1="360" x2="820" y2="360" stroke="#186585" stroke-width="3" marker-end="url(#b)"/><rect x="580" y="375" width="460" height="73" rx="4" fill="#ffffff" stroke="#dde5eb" stroke-width="2"/><text x="810" y="422" font-size="27" fill="#243b4c" text-anchor="middle" font-weight="400">i = 1；暂停在第一个 yield</text><line x1="1040" y1="455" x2="1375" y2="455" stroke="#be622d" stroke-width="3" marker-end="url(#o)"/><text x="1200" y="497" font-size="31" fill="#a65b30" text-anchor="middle" font-weight="400">1</text><text x="1110" y="552" font-size="31" fill="#217296" text-anchor="middle" font-weight="400">next(g)</text><line x1="1375" y1="570" x2="820" y2="570" stroke="#186585" stroke-width="3" marker-end="url(#b)"/><rect x="580" y="585" width="460" height="73" rx="4" fill="#ffffff" stroke="#dde5eb" stroke-width="2"/><text x="810" y="632" font-size="27" fill="#243b4c" text-anchor="middle" font-weight="400">i = 2；暂停在第二个 yield</text><line x1="1040" y1="665" x2="1375" y2="665" stroke="#be622d" stroke-width="3" marker-end="url(#o)"/><text x="1200" y="707" font-size="31" fill="#a65b30" text-anchor="middle" font-weight="400">4</text><text x="1110" y="762" font-size="31" fill="#217296" text-anchor="middle" font-weight="400">next(g)</text><line x1="1375" y1="780" x2="820" y2="780" stroke="#186585" stroke-width="3" marker-end="url(#b)"/><rect x="580" y="795" width="460" height="73" rx="4" fill="#ffffff" stroke="#dde5eb" stroke-width="2"/><text x="810" y="842" font-size="27" fill="#243b4c" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">函数已结束</text><line x1="1040" y1="875" x2="1375" y2="875" stroke="#be622d" stroke-width="3" marker-end="url(#o)"/><text x="1200" y="917" font-size="31" fill="#a65b30" text-anchor="middle" font-weight="400">StopIteration</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1000) scale(1.11111)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">两个名字引用一个生成器：消费位置属于执行帧，不属于变量名</text><rect x="80" y="135" width="242" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="201.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">g</text><rect x="330" y="135" width="242" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="451.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">alias=g</text><line x1="300" y1="205" x2="700" y2="205" stroke="#1c6583" stroke-width="2.46" stroke-dasharray=""/><polyline stroke="#1c6583" stroke-width="2.46" fill="none" points="688.947,209.673 700,205 688.947,200.327"/><rect x="720" y="135" width="540" height="120" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="990" y="182" font-size="39.99px" fill="#277290" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同一个暂停帧</text><text x="990" y="225" font-size="36.12px" fill="#277290" text-anchor="middle">局部 i 与当前位置只存一份</text><rect x="75" y="305" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="286.0" y="344" font-size="36.12px" fill="#a55f3a" text-anchor="middle">next(g) → 1</text><rect x="505" y="305" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="716.0" y="344" font-size="36.12px" fill="#a55f3a" text-anchor="middle">next(alias) → 4</text><rect x="935" y="305" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="1146.0" y="344" font-size="36.12px" fill="#a55f3a" text-anchor="middle">next(g) → 结束</text><text x="65" y="410" font-size="36.12px" fill="#213747" text-anchor="start">重新调用 squares() 才新建另一帧；iter(g) 返回自身，不会复制剩余序列。</text></g></g></g></g></g></svg></svg>