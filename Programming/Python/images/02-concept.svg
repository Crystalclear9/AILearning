<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img"><title>生成器保留同一执行帧；next 只推进到下一处暂停</title><rect width="1280" height="700" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">生成器保留同一执行帧；next 只推进到下一处暂停</text><text x="40" y="104" font-size="25" fill="#697d87" text-anchor="start">g = squares() 之后，函数体还没有执行；第三次 next 才观察到结束。</text><text x="52" y="190" font-size="24" fill="#697d87" text-anchor="start">1</text><text x="90" y="190" font-size="27" fill="#233943" text-anchor="start">def squares():</text><text x="52" y="238" font-size="24" fill="#697d87" text-anchor="start">2</text><text x="117" y="238" font-size="27" fill="#233943" text-anchor="start">i = 1</text><text x="52" y="286" font-size="24" fill="#697d87" text-anchor="start">3</text><text x="117" y="286" font-size="27" fill="#233943" text-anchor="start">yield i * i</text><text x="52" y="334" font-size="24" fill="#697d87" text-anchor="start">4</text><text x="117" y="334" font-size="27" fill="#233943" text-anchor="start">i = 2</text><text x="52" y="382" font-size="24" fill="#697d87" text-anchor="start">5</text><text x="117" y="382" font-size="27" fill="#233943" text-anchor="start">yield i * i</text><line x1="490" y1="145" x2="490" y2="600" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="540" y="160" font-size="25" fill="#697d87" text-anchor="start">调用</text><text x="770" y="160" font-size="25" fill="#697d87" text-anchor="start">调用完成后的帧</text><text x="1095" y="160" font-size="25" fill="#697d87" text-anchor="start">调用者得到</text><line x1="530" y1="256" x2="1230" y2="256" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="540" y="224" font-size="27" fill="#233943" text-anchor="start">创建 g</text><text x="770" y="224" font-size="25" fill="#276884" text-anchor="start">尚未进入</text><text x="1100" y="224" font-size="25" fill="#b25d2b" text-anchor="start">生成器对象</text><line x1="530" y1="352" x2="1230" y2="352" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="540" y="320" font-size="27" fill="#233943" text-anchor="start">next(g)</text><text x="770" y="320" font-size="25" fill="#276884" text-anchor="start">停在第 3 行；i=1</text><text x="1100" y="320" font-size="25" fill="#b25d2b" text-anchor="start">1</text><line x1="460" y1="286" x2="530" y2="320" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="530,320 518.0163164531743,319.3744373336421 522.0996384591845,310.96759790950364" fill="#276884"/><line x1="530" y1="448" x2="1230" y2="448" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="540" y="416" font-size="27" fill="#233943" text-anchor="start">next(g)</text><text x="770" y="416" font-size="25" fill="#276884" text-anchor="start">停在第 5 行；i=2</text><text x="1100" y="416" font-size="25" fill="#b25d2b" text-anchor="start">4</text><line x1="460" y1="382" x2="530" y2="416" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="530,416 518.0163164531743,415.3744373336421 522.0996384591845,406.96759790950364" fill="#276884"/><line x1="530" y1="544" x2="1230" y2="544" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="540" y="512" font-size="27" fill="#233943" text-anchor="start">next(g)</text><text x="770" y="512" font-size="25" fill="#697d87" text-anchor="start">函数结束，已耗尽</text><text x="1100" y="512" font-size="25" fill="#b25d2b" text-anchor="start">StopIteration</text><text x="40" y="647" font-size="27" fill="#233943" text-anchor="start">恢复后接着执行；不会回到 i = 1，也不会每次创建新帧。</text></g></svg>
