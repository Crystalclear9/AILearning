<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" role="img" aria-labelledby="title description" viewBox="0 0 1200 1186"><title id="title">生成器的消费与暂停位置</title><desc id="description">(a) 同一个生成器依次交给 next 和 list 消费。(b) 生成器的创建与消费分离。</desc><rect width="1200" fill="#fff" height="1186"/><text x="60" y="35" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="600" fill="#196f77">(a)</text><view id="a" viewBox="0 51 1200 400"/><view id="a-textbook-detail-1-1" viewBox="0 51 684 228"/><view id="a-textbook-detail-1-2" viewBox="516 51 684 228"/><view id="a-textbook-detail-2-1" viewBox="0 223 684 228"/><view id="a-textbook-detail-2-2" viewBox="516 223 684 228"/><svg width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="a-fig-title a-fig-desc" id="panel-a" x="0" y="51">
<title id="a-fig-title">生成器的同一个消费位置</title>
<desc id="a-fig-desc">函数调用创建生成器，next 返回第一个元素后暂停，list 从该暂停点继续收集。</desc>
<rect x="0" y="0" width="1200" height="400" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="a-t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf6f6"/></linearGradient>
<linearGradient id="a-r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="a-v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1edf6"/></linearGradient>
<linearGradient id="a-n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7f8"/></linearGradient>
</defs>
<text x="75" y="58" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="31" text-anchor="start" font-weight="400">同一个生成器向前推进</text>
