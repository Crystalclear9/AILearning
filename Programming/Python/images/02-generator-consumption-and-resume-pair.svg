<title id="b-fig-title">生成器推进同一个执行帧</title>
<desc id="b-fig-desc">函数体在调用时尚未执行。三个 next 请求分别得到 1、4 和 StopIteration。别名不会复制消费位置。</desc>
<rect x="0" y="0" width="1200" height="660" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="b-t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf6f6"/></linearGradient>
