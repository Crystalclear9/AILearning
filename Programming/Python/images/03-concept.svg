<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>临时文件与正式文件的发布边界</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="605" fill="white" stroke="#dce6ee" rx="18" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">临时文件与正式文件的发布边界</text><rect x="95" y="240" width="185" height="230" fill="#fafcfe" stroke="#507db3" rx="9" /><path d="M240,240 V280 H280" fill="none" stroke="#507db3" stroke-width="2" /><rect x="120" y="310" width="130" height="12" fill="#507db3" stroke="#507db3" rx="3" /><rect x="120" y="345" width="105" height="12" fill="#507db3" stroke="#507db3" rx="3" /><rect x="120" y="380" width="130" height="12" fill="#507db3" stroke="#507db3" rx="3" /><text x="187" y="518" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">正式路径：旧版</text><rect x="485" y="240" width="185" height="230" fill="#fafcfe" stroke="#d67c47" rx="9" /><path d="M630,240 V280 H670" fill="none" stroke="#d67c47" stroke-width="2" /><rect x="510" y="310" width="130" height="12" fill="#d67c47" stroke="#d67c47" rx="3" /><rect x="510" y="345" width="105" height="12" fill="#d67c47" stroke="#d67c47" rx="3" /><text x="577" y="518" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">临时路径：写入中</text><rect x="900" y="240" width="185" height="230" fill="#fafcfe" stroke="#268d8c" rx="9" /><path d="M1045,240 V280 H1085" fill="none" stroke="#268d8c" stroke-width="2" /><rect x="925" y="310" width="130" height="12" fill="#268d8c" stroke="#268d8c" rx="3" /><rect x="925" y="345" width="105" height="12" fill="#268d8c" stroke="#268d8c" rx="3" /><rect x="925" y="380" width="130" height="12" fill="#268d8c" stroke="#268d8c" rx="3" /><rect x="925" y="415" width="105" height="12" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="992" y="518" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">正式路径：新版</text><path d="M690,355 L870,355" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" /><text x="690" y="250" font-size="23" fill="#268d8c" text-anchor="start" font-weight="400">完成写入</text><text x="690" y="281" font-size="23" fill="#268d8c" text-anchor="start" font-weight="400">校验通过后切换</text><text x="125" y="645" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">切换前：读者仍打开旧版；临时文件不会作为正式结果读取。</text><text x="125" y="695" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">切换后：新打开正式路径的读者看到新版。</text></g></svg>
