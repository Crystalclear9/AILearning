<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">临时文件与正式文件的发布边界</title><desc id="desc">临时文件先承载未完成内容，正式入口只在校验通过后切换。这样，适用文件系统上的读者可以看到旧版本或新版本，而不必读到正在写入的半文件。 图中展示单文件可见性协议，不是跨文件事务或断电持久性证明。文件内容刷新、目录项同步、远程存储语义和并发写入仍需按实际故障模型处理。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#cb7845"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="55" font-size="32" fill="#18324d" font-weight="700">临时文件与正式文件的发布边界</text><rect x="45" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="67" y="230" font-size="25" fill="#18324d" font-weight="700">写独立临时文件</text><text x="67" y="366" font-size="21" fill="#315d59">发布前失败：旧结果保留</text><rect x="440" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="462" y="230" font-size="25" fill="#18324d" font-weight="700">校验并关闭</text><text x="462" y="366" font-size="21" fill="#315d59">校验失败：不切换入口</text><rect x="835" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="857" y="230" font-size="25" fill="#18324d" font-weight="700">同文件系统替换正式路径</text><text x="857" y="366" font-size="21" fill="#315d59">成功切换：读者读取新版本</text><path d="M372 315 L430 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M767 315 L825 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="60" y="525" font-size="23" fill="#18324d">读图顺序：先辨认对象与数值，再追踪箭头表示的变换或依赖。</text><text x="50" y="612" font-size="19" fill="#637789">原创教学示意图 · 具体假设与省略内容见正文图解</text></g></svg>