<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">临时文件与正式文件的发布边界</title><desc id="plateDesc">B 用记录数与模式检查展示一个最小发布前验收。C 把暂存结果改为两条，验收失败就不应切换正式路径。这张图只描述单文件的可见性协议，断电持久性、目录同步和多个文件间的一致性仍需另行处理。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">临时文件与正式文件的发布边界</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Python</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">临时结果与正式路径的发布边界</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">满足验收条件后再切换入口</text><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">验收项</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">预期</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">暂存结果</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">记录数</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">3</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">3</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">模式检查</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">通过</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">通过</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">校验通过后执行约定的单文件替换</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">失败时保留旧的正式结果</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">预期记录数</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">3</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">暂存只有</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">2</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">正式路径</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">继续指向旧版</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">不把失败的暂存文件发布为正式结果</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 135 1200.0 640.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>临时文件与正式文件的发布边界</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="panelA-tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">临时文件与正式文件的发布边界</text><rect x="95" y="240" width="185" height="230" fill="#fafcfe" stroke="#507db3" rx="9" /><path d="M240,240 V280 H280" fill="none" stroke="#507db3" stroke-width="2" /><rect x="120" y="310" width="130" height="12" fill="#507db3" stroke="#507db3" rx="3" /><rect x="120" y="345" width="105" height="12" fill="#507db3" stroke="#507db3" rx="3" /><rect x="120" y="380" width="130" height="12" fill="#507db3" stroke="#507db3" rx="3" /><text x="187" y="518" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">正式路径：旧版</text><rect x="485" y="240" width="185" height="230" fill="#fafcfe" stroke="#d67c47" rx="9" /><path d="M630,240 V280 H670" fill="none" stroke="#d67c47" stroke-width="2" /><rect x="510" y="310" width="130" height="12" fill="#d67c47" stroke="#d67c47" rx="3" /><rect x="510" y="345" width="105" height="12" fill="#d67c47" stroke="#d67c47" rx="3" /><text x="577" y="518" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">临时路径：写入中</text><rect x="900" y="240" width="185" height="230" fill="#fafcfe" stroke="#268d8c" rx="9" /><path d="M1045,240 V280 H1085" fill="none" stroke="#268d8c" stroke-width="2" /><rect x="925" y="310" width="130" height="12" fill="#268d8c" stroke="#268d8c" rx="3" /><rect x="925" y="345" width="105" height="12" fill="#268d8c" stroke="#268d8c" rx="3" /><rect x="925" y="380" width="130" height="12" fill="#268d8c" stroke="#268d8c" rx="3" /><rect x="925" y="415" width="105" height="12" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="992" y="518" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">正式路径：新版</text><path d="M690,355 L870,355" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#panelA-tip-268d8c)" /><text x="690" y="250" font-size="23" fill="#268d8c" text-anchor="start" font-weight="400">完成写入</text><text x="690" y="281" font-size="23" fill="#268d8c" text-anchor="start" font-weight="400">校验通过后切换</text><text x="125" y="645" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">切换前：读者仍打开旧版；临时文件不会作为正式结果读取。</text><text x="125" y="695" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">切换后：新打开正式路径的读者看到新版。</text></g></svg></svg>
