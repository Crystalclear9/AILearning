<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">描述符、实例字典与查找优先级</title><desc id="plateDesc">B 令类中的 property a 读取返回四十二，同时在实例字典放入同名九十九；默认读取仍优先调用数据描述符。C 普通方法对应非数据描述符，同名实例字段则能遮蔽它。自定义 __getattribute__ 与属性缺失回退可能改变流程，应回到各自协议理解。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">描述符、实例字典与查找优先级</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Python</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">默认属性查找遵循明确的优先关系</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">可读取的数据描述符优先</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">类的 property a</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">读取返回 42</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">实例字典 a</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">99</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">读取 obj.a</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">42</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">只读 property 仍属于数据描述符</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">非数据描述符可被实例值遮蔽</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">类中的普通方法 m</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">函数描述符</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">实例字典 m</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">99</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">读取 obj.m</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">99，不再是绑定方法</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">比较的是默认属性访问入口</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 135 1200.0 640.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>描述符、实例字典与查找优先级</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="panelA-tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker><marker id="panelA-tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">描述符、实例字典与查找优先级</text><polygon points="600,175.0 830.0,250 600,325.0 370.0,250" fill="#e3edf7" stroke="#8eacc4" stroke-width="2" /><text x="415" y="242" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">类中有可读取的数据描述符？</text><path d="M420,287 L240,400" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#panelA-tip-268d8c)" /><path d="M780,287 L940,395" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#panelA-tip-507db3)" /><rect x="80" y="410" width="330" height="100" fill="#dcefe9" stroke="#cbd9e5" rx="10" /><text x="100" y="450" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">调用数据描述符的 __get__</text><text x="285" y="347" font-size="22" fill="#268d8c" text-anchor="start" font-weight="400">是：优先</text><polygon points="930,400.0 1130.0,470 930,540.0 730.0,470" fill="#e3edf7" stroke="#8eacc4" stroke-width="2" /><text x="775" y="462" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">实例字典有同名值？</text><text x="845" y="350" font-size="22" fill="#507db3" text-anchor="start" font-weight="400">否</text><path d="M930,545 L930,600" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#panelA-tip-268d8c)" /><text x="955" y="580" font-size="22" fill="#268d8c" text-anchor="start" font-weight="400">是</text><rect x="780" y="610" width="320" height="95" fill="#dcefe9" stroke="#cbd9e5" rx="10" /><text x="800" y="655" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">返回实例字典中的值</text><path d="M755,500 L540,610" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#panelA-tip-507db3)" /><text x="625" y="557" font-size="22" fill="#507db3" text-anchor="start" font-weight="400">否</text><rect x="250" y="610" width="450" height="95" fill="#e8eef8" stroke="#cbd9e5" rx="10" /><text x="270" y="652" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">再处理类值 / 非数据描述符</text></g></svg></svg>
