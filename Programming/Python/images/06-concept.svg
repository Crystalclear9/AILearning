<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>描述符、实例字典与查找优先级</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="605" fill="white" stroke="#dce6ee" rx="18" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">描述符、实例字典与查找优先级</text><polygon points="600,175.0 830.0,250 600,325.0 370.0,250" fill="#e3edf7" stroke="#8eacc4" stroke-width="2" /><text x="415" y="242" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">类中有可读取的数据描述符？</text><path d="M420,287 L240,400" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" /><path d="M780,287 L940,395" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><rect x="80" y="410" width="330" height="100" fill="#dcefe9" stroke="#cbd9e5" rx="10" /><text x="100" y="450" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">调用数据描述符的 __get__</text><text x="285" y="347" font-size="22" fill="#268d8c" text-anchor="start" font-weight="400">是：优先</text><polygon points="930,400.0 1130.0,470 930,540.0 730.0,470" fill="#e3edf7" stroke="#8eacc4" stroke-width="2" /><text x="775" y="462" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">实