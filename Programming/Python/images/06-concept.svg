<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">描述符、实例字典与查找优先级</title><desc id="desc">图中展示默认属性查找的关键优先关系：具备读取行为的数据描述符优先于实例同名值，非数据描述符则可能被实例字段遮蔽。只读 property 因此并不是普通实例字段。 这条图解针对默认查找机制；自定义属性访问入口可以改变或破坏协作。类属性中的函数经实例访问会形成绑定方法，但静态方法和类方法有不同绑定约定。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#cb7845"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="55" font-size="32" fill="#18324d" font-weight="700">描述符、实例字典与查找优先级</text><rect x="45" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="67" y="230" font-size="25" fill="#18324d" font-weight="700">数据描述符读取</text><text x="67" y="366" font-size="21" fill="#315d59">存在读取入口的数据描述符优</text><text x="67" y="396" font-size="21" fill="#315d59">先</text><rect x="440" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="462" y="230" font-size="25" fill="#18324d" font-weight="700">实例字典同名值</text><text x="462" y="366" font-size="21" fill="#315d59">否则实例值可覆盖非数据描述</text><text x="462" y="396" font-size="21" fill="#315d59">符</text><rect x="835" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="857" y="230" font-size="25" fill="#18324d" font-weight="700">非数据描述符读取</text><text x="857" y="366" font-size="21" fill="#315d59">普通方法由函数描述符绑定实</text><text x="857" y="396" font-size="21" fill="#315d59">例</text><path d="M372 315 L430 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M767 315 L825 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="60" y="525" font-size="23" fill="#18324d">读图顺序：先辨认对象与数值，再追踪箭头表示的变换或依赖。</text><text x="50" y="612" font-size="19" fill="#637789">原创教学示意图 · 具体假设与省略内容见正文图解</text></g></svg>