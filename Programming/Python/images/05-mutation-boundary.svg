<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="557.48" viewBox="-18.24 66.76 996.48 557.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">两条数轴用实心和空心端点表示非负与严格正数规则，零用例区分变异而普通正数不能</title><desc id="artwork-desc">边界用例发现哪一种错误：只有零能区分 ≥ 与 &gt; 实心端点包含边界；空心端点不包含。用例必须检查结果，不只执行代码。</desc><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="470.746812"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="66.76" width="996.48" height="557.48" fill="#ffffff"/><svg id="edition-view" x="0" y="85" width="960" height="521" viewBox="0 85 960 521" overflow="hidden"><rect width="960" height="606" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(11.739526 67.588342) scale(0.663024)"><g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#325666" stroke-width="1.5"/></marker></defs><rect width="1372.5" height="710.0" fill="#ffffff" x="20.0" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#23394a"><text xml:space="preserve" x="50" y="125" font-size="38.7px" fill="#23394a" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">规格：接受所有非负数。普通正数通过，仍不足以验证边界。</text><text xml:space="preserve" x="50" y="240" font-size="39.968407px" fill="#2878a3" text-anchor="start" font-weight="700">正确：x ≥ 0</text><line x1="230.0" y1="310" x2="1264.0" y2="310" stroke="#d8e1e8" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="560" y1="310" x2="1220" y2="310" stroke="#207aa4" stroke-width="9" stroke-dasharray=""/><line x1="340" y1="298" x2="340" y2="322" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="340" y="365" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">-1</text><line x1="560" y1="298" x2="560" y2="322" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="560" y="365" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">0</text><line x1="780" y1="298" x2="780" y2="322" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="780" y="365" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">1</text><line x1="1000" y1="298" x2="1000" y2="322" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1000" y="365" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">2</text><line x1="1220" y1="298" x2="1220" y2="322" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1220" y="365" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">3</text><circle cx="560" cy="310" r="16" fill="#207aa4" stroke="#207aa4" stroke-width="4"/><circle cx="1000" cy="310" r="12" fill="#207aa4" stroke="none" stroke-width="2"/><text xml:space="preserve" x="50" y="520" font-size="39.968407px" fill="#a4572a" text-anchor="start" font-weight="700">变异：x &gt; 0</text><line x1="230.0" y1="590" x2="1264.0" y2="590" stroke="#d8e1e8" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="560" y1="590" x2="1220" y2="590" stroke="#b75b26" stroke-width="9" stroke-dasharray=""/><line x1="340" y1="578" x2="340" y2="602" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="340" y="645" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">-1</text><line x1="560" y1="578" x2="560" y2="602" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="560" y="645" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">0</text><line x1="780" y1="578" x2="780" y2="602" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="780" y="645" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">1</text><line x1="1000" y1="578" x2="1000" y2="602" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1000" y="645" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">2</text><line x1="1220" y1="578" x2="1220" y2="602" stroke="#8599ae" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1220" y="645" font-size="33.32px" fill="#23394a" text-anchor="middle" font-weight="400">3</text><circle cx="560" cy="590" r="16" fill="#ffffff" stroke="#b75b26" stroke-width="4"/><circle cx="1000" cy="590" r="12" fill="#b75b26" stroke="none" stroke-width="2"/><path d="M 1000,245 V 190 H 1360 V 515 H 1000" stroke="#5a7d8f" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1150" y="375" font-size="39.968407px" fill="#23394a" text-anchor="middle" font-weight="400">x = 2</text><text xml:space="preserve" x="1150" y="425" font-size="38.7px" fill="#23394a" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">两版都接受</text><line x1="560" y1="360" x2="560" y2="535" stroke="#bacad5" stroke-width="2" stroke-dasharray="6 6"/><text xml:space="preserve" x="50" y="745" font-size="39.968407px" fill="#23394a" text-anchor="start" font-weight="400">x = 0：规格期望接受，严格大于的变异却拒绝。</text></g><desc> 边界用例发现哪一种错误：只有零能区分 ≥ 与 &gt; 实心端点包含边界；空心端点不包含。用例必须检查结果，不只执行代码。</desc></g></g></g></svg></svg>