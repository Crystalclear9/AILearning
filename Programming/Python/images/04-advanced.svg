<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>循环导入失败发生在读取尚未绑定的属性时</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c">模块已经存在，不等于它的所有名字已经准备好</text><text x="60" y="112" font-size="27" fill="#71858b">两个普通模块；从一个新进程执行 import a</text><text x="80" y="195" font-size="30" fill="#256b82">a.py</text><text x="80" y="245" font-size="28" fill="#19333c">1   import b</text><text x="80" y="295" font-size="28" fill="#71858b">2   x = 1</text><text x="80" y="405" font-size="30" fill="#c0643c">b.py</text><text x="80" y="455" font-size="28" fill="#19333c">1   import a</text><text x="80" y="505" font-size="28" fill="#c0643c">2   y = a.x</text><line x1="550" y1="170" x2="550" y2="630" stroke="#dbe5e8" stroke-width="2"/><text x="620" y="210" font-size="29" fill="#256b82">① a 先进入 sys.modules</text><text x="620" y="253" font-size="26" fill="#19333c">开始执行 a.py</text><text x="620" y="320" font-size="29" fill="#256b82">② a 暂停，开始加载 b</text><text x="620" y="363" font-size="26" fill="#19333c">a.py 的 x = 1 尚未执行</text><text x="620" y="430" font-size="29" fill="#c0643c">③ b 的 import a 复用缓存</text><text x="620" y="473" font-size="26" fill="#19333c">拿到同一个部分初始化的 a</text><text x="620" y="540" font-size="29" fill="#c0643c">④ b 读取 a.x 时失败</text><text x="620" y="583" font-size="26" fill="#19333c">a 中尚未绑定 x，抛出 AttributeError</text><line x1="60" y1="675" x2="1220" y2="675" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="725" font-size="27" fill="#19333c">错误由“这次读取发生得太早”触发；单有环形依赖，不足以断言每次都会失败。</text><text x="60" y="775" font-size="26" fill="#71858b">把共同定义移入独立模块，或让调用者显式传值，才能减少隐藏的初始化前提。</text></g></svg>
