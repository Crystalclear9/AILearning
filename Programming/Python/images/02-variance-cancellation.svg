ize="45.22px" fill="#1672a0" text-anchor="middle" font-weight="400">-1</text><line x1="640" y1="965" x2="640" y2="1020" stroke="#0b6690" stroke-width="3" marker-end="url(#b)"/><text x="640" y="1080" font-size="45.22px" fill="#197b7e" text-anchor="middle" font-weight="400">1</text><rect x="870" y="840" width="220" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="980" y="905" font-size="45.22px" fill="#1672a0" text-anchor="middle" font-weight="400">0</text><line x1="980" y1="965" x2="980" y2="1020" stroke="#0b6690" stroke-width="3" marker-end="url(#b)"/><text x="980" y="1080" font-size="45.22px" fill="#197b7e" text-anchor="middle" font-weight="400">0</text><rect x="1210" y="840" width="220" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="1320" y="905" font-size="45.22px" fill="#1672a0" text-anchor="middle" font-weight="400">1</text><line x1="1320" y1="965" x2="1320" y2="1020" stroke="#0b6690" stroke-width="3" marker-end="url(#b)"/><text x="1320" y="1080" font-size="45.22px" fill="#197b7e" text-anchor="middle" font-weight="400">1</text><text x="160" y="1080" font-size="41.28px" fill="#197b7e" text-anchor="start" font-weight="400">偏差平方</text><text x="900" y="1180" font-size="40.46px" fill="#197b7e" text-anchor="middle" font-weight="400">1 + 0 + 1</text><line x1="720" y1="1193" x2="1080" y2="1193" stroke="#137286" stroke-width="2.46"/><text x="900" y="1234" font-size="40.46px" fill="#197b7e" text-anchor="middle" font-weight="400">3</text><text x="1220" y="1210" font-size="43.86px" fill="#197b7e" text-anchor="start" font-weight="400">= 三分之二</text></g></g></g></g></svg>