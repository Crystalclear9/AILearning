<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>缺失、未通过与通过是三个互斥出口</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">一条输入只走一个出口：先判断缺失，再比较分数</text><text x="60" y="112" font-size="27" fill="#71858b" text-anchor="start">输入 [0, 60, None, 80]；规则固定为“已知且至少六十”</text><text x="65" y="185" font-size="27" fill="#19333c" text-anchor="start">输入位置 / 值</text><text x="390" y="185" font-size="27" fill="#19333c" text-anchor="start">是否为 None</text><text x="720" y="185" font-size="27" fill="#19333c" text-anchor="start">是否 ≥ 60</text><text x="1050" y="185" font-size="27" fill="#19333c" text-anchor="start">唯一结果</text><text x="65" y="279" font-size="30" fill="#19333c" text-anchor="start">0  /  0</text><text x="420" y="279" font-size="29" fill="#256b82" text-anchor="start">否</text><line x1="235" y1="270" x2="375" y2="270" stroke="#256b82" stroke-width="3"/><polyline points="363,264 375,270 363,276" fill="none" stroke="#256b82" stroke-width="3"/><line x1="485" y1="270" x2="695" y2="270" stroke="#256b82" stroke-width="3"/><polyline points="683,264 695,270 683,276" fill="none" stroke="#256b82" stroke-width="3"/><text x="740" y="279" font-size="29" fill="#256b82" text-anchor="start">否</text><line x1="805" y1="270" x2="1030" y2="270" stroke="#256b82" stroke-width="3"/><polyline points="1018,264 1030,270 1018,276" fill="none" stroke="#256b82" stroke-width="3"/><text x="1045" y="279" font-size="30" fill="#256b82" text-anchor="start">未通过</text><text x="65" y="384" font-size="30" fill="#19333c" text-anchor="start">1  /  60</text><text x="420" y="384" font-size="29" fill="#256b82" text-anchor="start">否</text><line x1="235" y1="375" x2="375" y2="375" stroke="#256b82" stroke-width="3"/><polyline points="363,369 375,375 363,381" fill="none" stroke="#256b82" stroke-width="3"/><line x1="485" y1="375" x2="695" y2="375" stroke="#256b82" stroke-width="3"/><polyline points="683,369 695,375 683,381" fill="none" stroke="#256b82" stroke-width="3"/><text x="740" y="384" font-size="29" fill="#256b82" text-anchor="start">是</text><line x1="805" y1="375" x2="1030" y2="375" stroke="#256b82" stroke-width="3"/><polyline points="1018,369 1030,375 1018,381" fill="none" stroke="#256b82" stroke-width="3"/><text x="1045" y="384" font-size="30" fill="#256b82" text-anchor="start">通过</text><text x="65" y="489" font-size="30" fill="#19333c" text-anchor="start">2  /  None</text><text x="420" y="489" font-size="29" fill="#c0643c" text-anchor="start">是</text><line x1="235" y1="480" x2="375" y2="480" stroke="#256b82" stroke-width="3"/><polyline points="363,474 375,480 363,486" fill="none" stroke="#256b82" stroke-width="3"/><line x1="485" y1="480" x2="1030" y2="480" stroke="#c0643c" stroke-width="3"/><polyline points="1018,474 1030,480 1018,486" fill="none" stroke="#c0643c" stroke-width="3"/><text x="1045" y="489" font-size="30" fill="#c0643c" text-anchor="start">缺失</text><text x="65" y="594" font-size="30" fill="#19333c" text-anchor="start">3  /  80</text><text x="420" y="594" font-size="29" fill="#256b82" text-anchor="start">否</text><line x1="235" y1="585" x2="375" y2="585" stroke="#256b82" stroke-width="3"/><polyline points="363,579 375,585 363,591" fill="none" stroke="#256b82" stroke-width="3"/><line x1="485" y1="585" x2="695" y2="585" stroke="#256b82" stroke-width="3"/><polyline points="683,579 695,585 683,591" fill="none" stroke="#256b82" stroke-width="3"/><text x="740" y="594" font-size="29" fill="#256b82" text-anchor="start">是</text><line x1="805" y1="585" x2="1030" y2="585" stroke="#256b82" stroke-width="3"/><polyline points="1018,579 1030,585 1018,591" fill="none" stroke="#256b82" stroke-width="3"/><text x="1045" y="594" font-size="30" fill="#256b82" text-anchor="start">通过</text><line x1="60" y1="660" x2="1220" y2="660" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="711" font-size="30" fill="#19333c" text-anchor="start">缺失 1 条 ＋ 未通过 1 条 ＋ 通过 2 条 ＝ 4 条输入</text><text x="60" y="760" font-size="27" fill="#71858b" text-anchor="start">None 的数值比较没有发生；零分执行比较后，进入“未通过”。</text></g></svg>
