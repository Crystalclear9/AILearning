ight="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 978) scale(0.7272727273 1) translate(-305 -978)">1</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 978) scale(0.7272727273 1) translate(-505 -978)">2</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 1036) scale(0.7272727273 1) translate(-105 -1036)">错误 g=w²+1</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 1036) scale(0.7272727273 1) translate(-305 -1036)">2</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 1036) scale(0.7272727273 1) translate(-505 -1036)">2</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1150) scale(0.7272727273 1) translate(-96 -1150)">梯度吻合不能发现这个常数偏移</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">独立前向规格</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 938.5) scale(0.7272727273 1) translate(-1195 -938.5)">g 不符合目标</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 994) scale(0.7272727273 1) translate(-806 -994)">解析与数值导数</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1008.5) scale(0.7272727273 1) translate(-1195 -1008.5)">g 可以互相吻合</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1064) scale(0.7272727273 1) translate(-806 -1064)">需要的结论</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1078.5) scale(0.7272727273 1) translate(-1195 -1078.5)">两种证据同时成立</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">算对导数与选对目标应分别核验</text></g></svg>
