<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">梯度检查需要独立的前向规格</title><desc id="desc">前向规格检查函数算的是不是所需问题，梯度检查验证它对参数变化的导数。二者依次衔接，才能避免对同一个错误目标得到两份一致的梯度。 若标签误广播成两两样本差，解析梯度和数值梯度仍可能吻合。通过导数检查不等于数据协议、标签定义或独立测试结果也正确，验证应有不同依据。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#cb7845"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="55" font-size="32" fill="#18324d" font-weight="700">梯度检查需要独立的前向规格</text><rect x="45" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="67" y="230" font-size="25" fill="#18324d" font-weight="700">业务目标定义</text><text x="67" y="366" font-size="21" fill="#315d59">先确认预测和损失对象</text><rect x="440" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="462" y="230" font-size="25" fill="#18324d" font-weight="700">小样本前向手算</text><text x="462" y="366" font-size="21" fill="#315d59">再检查轴、分母和单位</text><rect x="835" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="857" y="230" font-size="25" fill="#18324d" font-weight="700">解析与数值梯度比较</text><text x="857" y="366" font-size="21" fill="#315d59">最后验证变化率是否一致</text><path d="M372 315 L430 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M767 315 L825 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="60" y="525" font-size="23" fill="#18324d">读图顺序：先辨认对象与数值，再追踪箭头表示的变换或依赖。</text><text x="50" y="612" font-size="19" fill="#637789">原创教学示意图 · 具体假设与省略内容见正文图解</text></g></svg>