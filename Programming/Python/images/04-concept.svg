<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">配置从输入到有效状态</title><desc id="desc">配置来源按确定的优先级合并，最终只产生一份经过类型、范围和相互约束检查的有效配置。日志与执行都应引用这份结果，而不是分别重新读取原始参数。 旧字段迁移需要版本与单位说明。仅保存路径或一个摘要不能覆盖文件内容、代码及外部数据依赖；配置身份应与实际运行使用的对象一致。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#cb7845"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="55" font-size="32" fill="#18324d" font-weight="700">配置从输入到有效状态</text><rect x="45" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="67" y="230" font-size="25" fill="#18324d" font-weight="700">默认配置</text><text x="67" y="366" font-size="21" fill="#315d59">优先级应事先定义</text><rect x="440" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="462" y="230" font-size="25" fill="#18324d" font-weight="700">文件与命令行覆盖</text><text x="462" y="366" font-size="21" fill="#315d59">冲突字段不能静默任选</text><rect x="835" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="857" y="230" font-size="25" fill="#18324d" font-weight="700">验证后的有效配置</text><text x="857" y="366" font-size="21" fill="#315d59">日志和训练读取同一结果</text><path d="M372 315 L430 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M767 315 L825 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="60" y="525" font-size="23" fill="#18324d">读图顺序：先辨认对象与数值，再追踪箭头表示的变换或依赖。</text><text x="50" y="612" font-size="19" fill="#637789">原创教学示意图 · 具体假设与省略内容见正文图解</text></g></svg>