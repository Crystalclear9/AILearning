<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">配置从输入到有效状态</title><desc id="plateDesc">B 追踪最终字段的具体来源，而不是只保存原始配置文本。C 展示一个整数类型却不满足正数范围的批量大小；类型检查通过不意味着配置已经有效，拒绝后是否允许用户显式修正应由接口协议决定。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">配置从输入到有效状态</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Python</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">配置合并后必须形成唯一有效状态</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">数值与来源一起固定</text><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">字段</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">有效值</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">来源</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">学习率</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">0.01</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">配置文件</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">batch_size</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">64</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">命令行</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">默认值分别为 0.1 与 32</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">字段类型正确仍可能违反范围</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">输入 batch_size</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">0</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">类型</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">整数</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">范围约束</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">必须 &gt;0：拒绝</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">不要静默回退到其他来源的值</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 135 1200.0 640.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>配置从输入到有效状态</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">配置从输入到有效状态</text><text x="300" y="215" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">默认配置</text><text x="540" y="215" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">文件覆盖</text><text x="780" y="215" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">命令行覆盖</text><text x="1020" y="215" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">有效配置</text><text x="90" y="352" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">学习率 lr</text><rect x="200" y="290" width="200" height="105" fill="#edf1f6" stroke="#cbd9e5" rx="10" /><text x="300" y="355" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">0.1</text><rect x="440" y="290" width="200" height="105" fill="#d3eae3" stroke="#cbd9e5" rx="10" /><text x="540" y="355" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">0.01</text><rect x="680" y="290" width="200" height="105" fill="#edf1f6" stroke="#cbd9e5" rx="10" /><text x="780" y="355" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">—</text><rect x="920" y="290" width="200" height="105" fill="#d3eae3" stroke="#cbd9e5" rx="10" /><text x="1020" y="355" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">0.01</text><text x="90" y="527" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">批量大小</text><rect x="200" y="465" width="200" height="105" fill="#edf1f6" stroke="#cbd9e5" rx="10" /><text x="300" y="530" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">32</text><rect x="440" y="465" width="200" height="105" fill="#edf1f6" stroke="#cbd9e5" rx="10" /><text x="540" y="530" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">—</text><rect x="680" y="465" width="200" height="105" fill="#d3eae3" stroke="#cbd9e5" rx="10" /><text x="780" y="530" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">64</text><rect x="920" y="465" width="200" height="105" fill="#d3eae3" stroke="#cbd9e5" rx="10" /><text x="1020" y="530" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">64</text><text x="135" y="680" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">按声明的优先级合并后，再验证范围、类型与字段之间的约束。</text></g></svg></svg>
