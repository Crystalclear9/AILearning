<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">配置从输入到有效状态</title><desc id="plateDesc">B 追踪最终字段的具体来源，而不是只保存原始配置文本。C 展示一个整数类型却不满足正数范围的批量大小；类型检查通过不意味着配置已经有效，拒绝后是否允许用户显式修正应由接口协议决定。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">配置从输入到有效状态</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">配置合并后必须形成唯一有效状态</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">数值与来源一起固定</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">字段类型正确仍可能违反范围</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 135 1200.0 640.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>配置从输入到有效状态</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">配置从输入到有效状态</text><text x="300" y="215" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">默认配置</text><text x="540" y="215" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">文件覆盖</text><text x="780" y="215" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">命令行覆盖</text><text x="1020" y="215" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">有效配置</text><text x="90" y="352" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">学习率 lr</text><rect x="200" y="290" width="200" height="105" fill="#edf1f6" stroke="#cbd9e5" rx="10" /><text x="300" y="355" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">0.1</text><rect x="440" y="290" width="200" height="105" fill="#d3eae3" stroke="#cbd9e5" rx="10" /><text x="540" y="355" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">0.01</text><rect x="680" y="290" width="200" height="105" fill="#edf1f6" stroke="#cbd9e5" rx="10" /><text x="780" y="355" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">—</text><rect x="920" y="290" width="200" height="105" fill="#d3eae3" stroke="#cbd9e5" rx="10" /><text x="1020" y="355" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">0.01</text><text x="90" y="527" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">批量大小</text><rect x="200" y="465" width="200" height="105" fill="#edf1f6" stroke="#cbd9e5" rx="10" /><text x="300" y="530" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">32</text><rect x="440" y="465" width="200" height="105" fill="#edf1f6" stroke="#cbd9e5" rx="10" /><text x="540" y="530" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">—</text><rect x="680" y="465" width="200" height="105" fill="#d3eae3" stroke="#cbd9e5" rx="10" /><text x="780" y="530" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">64</text><rect x="920" y="465" width="200" height="105" fill="#d3eae3" stroke="#cbd9e5" rx="10" /><text x="1020" y="530" font-size="30" fill="#20384f" text-anchor="middle" font-weight="400">64</text><text x="135" y="680" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">按声明的优先级合并后，再验证范围、类型与字段之间的约束。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 923) scale(0.7272727273 1) translate(-105 -923)">字段</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 923) scale(0.7272727273 1) translate(-305 -923)">有效值</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 923) scale(0.7272727273 1) translate(-505 -923)">来源</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 978) scale(0.7272727273 1) translate(-105 -978)">学习率</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 978) scale(0.7272727273 1) translate(-305 -978)">0.01</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 978) scale(0.7272727273 1) translate(-505 -978)">配置文件</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 1036) scale(0.7272727273 1) translate(-105 -1036)">batch_size</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 1036) scale(0.7272727273 1) translate(-305 -1036)">64</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 1036) scale(0.7272727273 1) translate(-505 -1036)">命令行</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1150) scale(0.7272727273 1) translate(-96 -1150)">默认值分别为 0.1 与 32</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">输入 batch_size</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 938.5) scale(0.7272727273 1) translate(-1195 -938.5)">0</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 994) scale(0.7272727273 1) translate(-806 -994)">类型</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1008.5) scale(0.7272727273 1) translate(-1195 -1008.5)">整数</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1064) scale(0.7272727273 1) translate(-806 -1064)">范围约束</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1078.5) scale(0.7272727273 1) translate(-1195 -1078.5)">必须 &gt;0：拒绝</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">不要静默回退到其他来源的值</text></g></svg>
