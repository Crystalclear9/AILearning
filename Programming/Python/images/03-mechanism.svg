<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="581" viewBox="0 0 960 581" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">幂等恢复：重放已提交批次不再重复计数</title><desc id="artwork-desc">重放同一批次：复用已提交结果，不再多加一次 示例是单进程已提交结果表；并发去重、事务提交和外部副作用仍需对应协议。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="483.787346"/></clipPath></defs><rect width="960" height="581" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">幂等恢复：重放已提交批次不再重复计数</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(13.005272 31.219684) scale(0.639719)"><g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2f5467" stroke-width="1.5"/></marker></defs><rect width="1422.5" height="756.25" fill="white" x="18.75" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="37.41px" fill="#1f3348" text-anchor="start" font-weight="400">同一输入版本 v1；每批 2 条记录。批次身份 =（输入版本，批次号）。</text><text xml:space="preserve" x="840" y="205" font-size="39.99px" fill="#1f3348" text-anchor="start" font-weight="700">已提交的批结果</text><rect x="830" y="245" width="580" height="360" rx="0" fill="#fafcfd" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="875" y="290" font-size="36.12px" fill="#1f3348" text-anchor="start" font-weight="400">身份</text><text xml:space="preserve" x="1110" y="290" font-size="36.12px" fill="#1f3348" text-anchor="start" font-weight="400">计数</text><text xml:space="preserve" x="1260" y="290" font-size="36.12px" fill="#1f3348" text-anchor="start" font-weight="400">总和</text><line x1="830" y1="310" x2="1410" y2="310" stroke="#b2c1d0" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="875" y="365" font-size="41.28px" fill="#1f3348" text-anchor="start" font-weight="400">v1, 1</text><text xml:space="preserve" x="1140" y="365" font-size="38.08px" fill="#1f3348" text-anchor="start" font-weight="400">2</text><text xml:space="preserve" x="1290" y="365" font-size="38.08px" fill="#1f3348" text-anchor="start" font-weight="400">3</text><rect x="835" y="415" width="570" height="75" rx="0" fill="#ecf4f9" stroke="none" stroke-width="2"/><text xml:space="preserve" x="875" y="455" font-size="41.28px" fill="#1f3348" text-anchor="start" font-weight="400">v1, 2</text><text xml:space="preserve" x="1140" y="455" font-size="38.08px" fill="#1f3348" text-anchor="start" font-weight="400">2</text><text xml:space="preserve" x="1290" y="455" font-size="38.08px" fill="#1f3348" text-anchor="start" font-weight="400">7</text><text xml:space="preserve" x="875" y="545" font-size="41.28px" fill="#1f3348" text-anchor="start" font-weight="400">v1, 3</text><text xml:space="preserve" x="1140" y="545" font-size="38.08px" fill="#1f3348" text-anchor="start" font-weight="400">2</text><text xml:space="preserve" x="1290" y="545" font-size="38.08px" fill="#1f3348" text-anchor="start" font-weight="400">11</text><text xml:space="preserve" x="50" y="245" font-size="39.99px" fill="#1f3348" text-anchor="start" font-weight="700">恢复时又收到批次 2</text><circle cx="95" cy="345" r="35" fill="#fff0df" stroke="#c65d19" stroke-width="2"/><text xml:space="preserve" x="95" y="356" font-size="40.46px" fill="#af5a20" text-anchor="middle" font-weight="400">3</text><circle cx="205" cy="345" r="35" fill="#fff0df" stroke="#c65d19" stroke-width="2"/><text xml:space="preserve" x="205" y="356" font-size="40.46px" fill="#af5a20" text-anchor="middle" font-weight="400">4</text><text xml:space="preserve" x="50" y="440" font-size="38.7px" fill="#1f3348" text-anchor="start" font-weight="400">同一键：(v1, 2)</text><path d="M 310,345 H 610 V 455 H 815" stroke="#147bb1" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="510" y="320" font-size="38.7px" fill="#1e76af" text-anchor="middle" font-weight="400">查到相同结果</text><text xml:space="preserve" x="50" y="555" font-size="39.99px" fill="#1e76af" text-anchor="start" font-weight="400">正确：已有键保持一份结果</text><text xml:space="preserve" x="50" y="610" font-size="38.7px" fill="#1e76af" text-anchor="start" font-weight="400">重放前后均为 6 条，总和 21</text><text xml:space="preserve" x="50" y="730" font-size="39.99px" fill="#af5a20" text-anchor="start" font-weight="400">错误：直接把重放结果再累加</text><text xml:space="preserve" x="50" y="785" font-size="38.7px" fill="#af5a20" text-anchor="start" font-weight="400">变成 8 条，总和 28</text><path d="M 1120,610 V 680" stroke="#147bb1" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1110" y="740" font-size="41.28px" fill="#1e76af" text-anchor="middle" font-weight="400">2 + 2 + 2 = 6</text><text xml:space="preserve" x="1110" y="795" font-size="41.28px" fill="#1e76af" text-anchor="middle" font-weight="400">3 + 7 + 11 = 21</text></g><desc> 重放同一批次：复用已提交结果，不再多加一次 示例是单进程已提交结果表；并发去重、事务提交和外部副作用仍需对应协议。</desc></g></g></g></svg>