<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">变异测试：测试通过不等于能发现错误</title><desc id="desc">假设规格要求非负数被接受，把大于等于替换成严格大于就是一个有意义的变异。普通正数用例无法区分两版，零这个边界用例才能暴露差异。 图中的通过是相对于规格中的期望结果。变异得分依赖所选择的错误模型；等价变异不一定能被任何合法用例区分，也不能据此宣称测试完备。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="530" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="355.0" fill="#ffffff" stroke="#dce6ee" rx="18" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">变异测试：测试通过不等于能发现错误</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">明确对象、计算关系与适用条件，避免只凭外观判断。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">实现版本</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" /><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">边界用例</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" /><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">常规用例</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" /><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">结论</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" /><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">正确：x≥0</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" /><text x="345" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">x=0 通过</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" /><text x="615" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">x=2 通过</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" /><text x="885" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">满足规格</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" /><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">变异：x&gt;0</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" /><text x="345" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">x=0 失败</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" /><text x="615" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">x=2 通过</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" /><text x="885" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">边界用例杀死变异</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" /><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">仅测试 x=2</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" /><text x="345" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">未覆盖</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" /><text x="615" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">两版均通过</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" /><text x="885" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">无法区分错误</text><text x="60" y="505" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">条件与计算见相邻正文。</text></g></svg>
