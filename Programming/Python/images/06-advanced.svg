<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">协程取消通常在可中断的等待处交付</title><desc id="desc">取消请求并不等于在任意机器指令处立刻终止协程。图中协程先完成同步片段，到达可交付取消的等待位置后，再按异常传播与清理协议收尾。 这是协作式调度的示意，时间长度为假设。吞掉取消异常、阻塞事件循环或清理再次失败，都可能改变观察结果；超时也不能自动证明外部副作用没有发生。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">协程取消通常在可中断的等待处交付</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">明确对象、计算关系与适用条件，避免只凭外观判断。</text><path d="M250,195 L1090,195" stroke="#20384f" stroke-width="2" fill="none" /><path d="M250,188 L250,202" stroke="#20384f" stroke-width="2" fill="none" /><text x="250" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><path d="M418,188 L418,202" stroke="#20384f" stroke-width="2" fill="none" /><text x="418" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><path d="M586,188 L586,202" stroke="#20384f" stroke-width="2" fill="none" /><text x="586" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><path d="M754,188 L754,202" stroke="#20384f" stroke-width="2" fill="none" /><text x="754" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><path d="M922,188 L922,202" stroke="#20384f" stroke-width="2" fill="none" /><text x="922" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><path d="M1090,188 L1090,202" stroke="#20384f" stroke-width="2" fill="none" /><text x="1090" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">5</text><text x="60" y="260" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">协程继续执行同步</text><text x="60" y="288" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">片段</text><rect x="250.0" y="255" width="504.0" height="48" fill="#d4ebe6" stroke="#83b4ae" rx="5" /><text x="502" y="337" font-size="20" fill="#20384f" text-anchor="middle" font-weight="400">t=1 请求取消</text><text x="60" y="375" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">到达等待点</text><circle cx="754" cy="395" r="11" fill="#d67c47" /><text x="754" y="452" font-size="20" fill="#20384f" text-anchor="middle" font-weight="400">允许交付取消异常</text><text x="60" y="490" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">清理资源</text><rect x="754.0" y="485" width="336.0" height="48" fill="#f5dfcb" stroke="#83b4ae" rx="5" /><text x="922" y="567" font-size="20" fill="#20384f" text-anchor="middle" font-weight="400">finally / 约定的收尾</text><text x="1090" y="650" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">时间 / 逻辑步（见正文约定）</text><text x="60" y="695" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">条件与计算见相邻正文。</text></g></svg>
