<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1250" height="568" viewBox="0 0 1250 568" role="img" aria-labelledby="title description"><title id="title">一个字典项怎样匹配三个相等的键</title><desc id="description">先用 True 写入 A，再用 1 更新同一项为 B。随后用 True、1、1.0 读取均得到 B，字典长度为一。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#202939"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#166d76"/></marker><marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#a54538"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#625281"/></marker><linearGradient id="water" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7acbd1" stop-opacity=".14"/><stop offset="100%" stop-color="#7acbd1" stop-opacity=".49"/></linearGradient><linearGradient id="peach" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ef9b8e" stop-opacity=".14"/><stop offset="100%" stop-color="#ef9b8e" stop-opacity=".49"/></linearGradient><linearGradient id="lilac" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b3a1da" stop-opacity=".14"/><stop offset="100%" stop-color="#b3a1da" stop-opacity=".49"/></linearGradient></defs><rect x="0" y="0" width="1250" height="568" fill="white"/><text x="338" y="71" fill="#202939" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="33" text-anchor="middle">d[True] = 'A'</text><rect x="157" y="121" width="208" height="91" rx="3" fill="url(#water)" stroke="#166d76" stroke-width="1.8"/><rect x="365" y="121" width="154" height="91" rx="3" fill="url(#peach)" stroke="#a54538" stroke-width="1.8"/><text x="261" y="177" fill="#166d76" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="36" text-anchor="middle">True</text><text x="442" y="177" fill="#a54538" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="38" text-anchor="middle">A</text><text x="261" y="256" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">原键</text><text x="442" y="256" fill="#a54538" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">当前值</text><text x="940" y="71" fill="#202939" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="33" text-anchor="middle">d[1] = 'B'</text><rect x="759" y="121" width="208" height="91" rx="3" fill="url(#water)" stroke="#166d76" stroke-width="1.8"/><rect x="967" y="121" width="154" height="91" rx="3" fill="url(#peach)" stroke="#a54538" stroke-width="1.8"/><text x="863" y="177" fill="#166d76" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="36" text-anchor="middle">True</text><text x="1044" y="177" fill="#a54538" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="38" text-anchor="middle">B</text><text x="863" y="256" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">原键</text><text x="1044" y="256" fill="#a54538" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">当前值</text><line x1="548" y1="167" x2="724" y2="167" stroke="#625281" stroke-width="2.8" stroke-linecap="round" marker-end="url(#violet)"/><text x="636" y="143" fill="#625281" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="27" text-anchor="middle">更新同一项</text><rect x="562" y="416" width="124" height="62" rx="3" fill="url(#peach)" stroke="#a54538" stroke-width="1.8"/><text x="280" y="349" fill="#202939" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="31" text-anchor="middle">d[True]</text><path d="M 280 368 Q 280 443 552 443" stroke="#202939" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#ink)"/><text x="624" y="349" fill="#202939" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="31" text-anchor="middle">d[1]</text><line x1="624" y1="367" x2="624" y2="408" stroke="#202939" stroke-width="2" stroke-linecap="round" marker-end="url(#ink)"/><text x="965" y="349" fill="#202939" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="31" text-anchor="middle">d[1.0]</text><path d="M 965 368 Q 965 443 694 443" stroke="#202939" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#ink)"/><text x="624" y="455" fill="#a54538" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="36" text-anchor="middle">B</text><text x="624" y="528" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="30" text-anchor="middle">三次读取都命中同一项</text></svg>