<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" role="img" aria-labelledby="title description" viewBox="0 0 1200 1301"><title id="title">协程取消交付与后台线程</title><desc id="description">(a) 取消交付：先确认 await 是否真的挂起。(b) 异步任务已经取消而底层线程仍在执行工作的时间线。</desc><rect width="1200" fill="#fff" height="1301"/><text x="60" y="35" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="600" fill="#196f77">(a)</text><view id="a" viewBox="0 51 1200 602"/><view id="a-textbook-detail-1-1" viewBox="0 51 684 343.14"/><view id="a-textbook-detail-1-2" viewBox="516 51 684 343.14"/><view id="a-textbook-detail-2-1" viewBox="0 309.86 684 343.14"/><view id="a-textbook-detail-2-2" viewBox="516 309.86 684 343.14"/><svg width="1200" height="602" viewBox="0 0 1200 602" role="img" aria-labelledby="a-fig-title a-fig-desc" id="panel-a" x="0" y="51">
<title id="a-fig-title">await 何时把执行交还给事件循环</title>
<desc id="a-fig-desc">已完成的 Future 不挂起；等待未完成的 Future 才让取消回调在任务挂起时执行。</desc>
<rect x="0" y="0" width="1200" height="602" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="a-t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf6f6"/></linearGradient>
<linearGradient id="a-r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="a-v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1edf6"/></linearGradient>
<linearGradient id="a-n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7f8"/></linearGradient>
</defs>
<text x="76" y="58" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="31" text-anchor="start" font-weight="400">任务先排入取消回调，再执行 await</text>
<text x="77" y="128" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="25" text-anchor="start" font-weight="400">已完成的 Future</text>
<path d="M144 200 L405 200" fill="none" stroke="#196f77" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M405 200 L705 200" fill="none" stroke="#196f77" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M705 200 L1025 200" fill="none" stroke="#657682" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<circle cx="144" cy="200" r="8" fill="#196f77" stroke="#ffffff" stroke-width="1.5"/>
<text x="144" y="240" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">排入回调</text>
<circle cx="405" cy="200" r="8" fill="#196f77" stroke="#ffffff" stroke-width="1.5"/>
<text x="405" y="240" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">await 直接返回</text>
<circle cx="705" cy="200" r="8" fill="#196f77" stroke="#ffffff" stroke-width="1.5"/>
<text x="705" y="240" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">任务正常结束</text>
<circle cx="1025" cy="200" r="8" fill="#a84b3b" stroke="#ffffff" stroke-width="1.5"/>
<text x="1025" y="240" fill="#a84b3b" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">回调才运行</text>
<text x="1025" y="277" fill="#a84b3b" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="21" text-anchor="middle" font-weight="400">cancel() → False</text>
<text x="77" y="333" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="25" text-anchor="start" font-weight="400">尚未完成的 Future</text>
<path d="M144 405 L405 405" fill="none" stroke="#196f77" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M405 405 L705 405" fill="none" stroke="#657682" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<path d="M705 405 L1025 405" fill="none" stroke="#657682" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<circle cx="144" cy="405" r="8" fill="#196f77" stroke="#ffffff" stroke-width="1.5"/>
<text x="144" y="445" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">排入回调</text>
<circle cx="405" cy="405" r="8" fill="#196f77" stroke="#ffffff" stroke-width="1.5"/>
<text x="405" y="445" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">await 挂起</text>
<circle cx="705" cy="405" r="8" fill="#a84b3b" stroke="#ffffff" stroke-width="1.5"/>
<text x="705" y="445" fill="#a84b3b" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">回调请求取消</text>
<circle cx="1025" cy="405" r="8" fill="#196f77" stroke="#ffffff" stroke-width="1.5"/>
<text x="1025" y="445" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">交付取消异常</text>
<text x="705" y="482" fill="#a84b3b" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="21" text-anchor="middle" font-weight="400">cancel() → True</text>
<text x="1025" y="482" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="21" text-anchor="middle" font-weight="400">finally 后继续传播</text>
<path d="M75 523 L1125 523" fill="none" stroke="#e7ecef" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="567" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="23" text-anchor="start" font-weight="400">横向只表示执行顺序；虚线表示任务没有正在执行。</text>
</svg><line x1="58" x2="1142" y1="665" y2="665" stroke="#dce6e8" stroke-width="1"/><text x="60" y="712" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="600" fill="#196f77">(b)</text><view id="b" viewBox="0 728 1200 573"/><view id="b-textbook-detail-1-1" viewBox="0 728 684 326.61"/><view id="b-textbook-detail-1-2" viewBox="516 728 684 326.61"/><view id="b-textbook-detail-2-1" viewBox="0 974.39 684 326.61"/><view id="b-textbook-detail-2-2" viewBox="516 968.02666667 684 326.61"/><svg width="1200" height="573" viewBox="0 0 1200 573" role="img" aria-labelledby="b-fig-title b-fig-desc" id="panel-b" x="0" y="728">
<title id="b-fig-title">取消异步等待与线程完成是两个状态</title>
<desc id="b-fig-desc">底层线程已经启动并等待事件。取消 asyncio 包装任务后，线程仍可在事件放行后产生副作用。</desc>
<rect x="0" y="0" width="1200" height="573" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="b-t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf6f6"/></linearGradient>
<linearGradient id="b-r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="b-v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1edf6"/></linearGradient>
<linearGradient id="b-n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7f8"/></linearGradient>
</defs>
<text x="76" y="58" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="31" text-anchor="start" font-weight="400">包装任务已取消，线程仍能提交</text>
<text x="229" y="109" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">线程已开始</text>
<path d="M229 123 L229 407" fill="none" stroke="#e7ecef" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="500" y="109" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">取消包装任务</text>
<path d="M500 123 L500 407" fill="none" stroke="#e7ecef" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="768" y="109" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">放行线程</text>
<path d="M768 123 L768 407" fill="none" stroke="#e7ecef" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="1036" y="109" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">工作提交</text>
<path d="M1036 123 L1036 407" fill="none" stroke="#e7ecef" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="78" y="181" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="24" text-anchor="start" font-weight="400">任务</text>
<text x="78" y="370" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="24" text-anchor="start" font-weight="400">线程</text>
<path d="M229 174 L500 174" fill="none" stroke="#196f77" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="500" cy="174" r="8" fill="#a84b3b" stroke="#ffffff" stroke-width="1.5"/>
<text x="516" y="218" fill="#a84b3b" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="23" text-anchor="start" font-weight="400">CancelledError</text>
<text x="516" y="254" fill="#a84b3b" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="21" text-anchor="start" font-weight="400">done=True · cancelled=True</text>
<path d="M229 363 L768 363" fill="none" stroke="#657682" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M768 363 L1036 363" fill="none" stroke="#196f77" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1036 363 L1025 368 L1025 358 Z" fill="#196f77" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="229" cy="363" r="8" fill="#196f77" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="768" cy="363" r="8" fill="#655184" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="1036" cy="363" r="8" fill="#196f77" stroke="#ffffff" stroke-width="1.5"/>
<text x="374" y="338" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="start" font-weight="400">仍在等待释放事件</text>
<text x="862" y="338" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="start" font-weight="400">继续工作</text>
<text x="1017" y="411" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="middle" font-weight="400">产生副作用</text>
<path d="M75 448 L1125 448" fill="none" stroke="#e7ecef" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="503" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="24" text-anchor="start" font-weight="400">取消等待不会强制终止已经运行的工作线程。</text>
</svg></svg>
