<svg xmlns="http://www.w3.org/2000/svg" width="1139.72" height="672.724" viewBox="-4.862 31.138 1139.72 672.724" role="img" aria-labelledby="title desc"><title id="title">异步任务已经取消而底层线程仍在执行工作的时间线</title><desc id="desc">已经运行的to_thread函数不会因其asyncio包装任务取消而自动终止。释放事件后工作依然产生副作用。 异步包装任务结束，底层工作仍可继续 图表示事件先后，不按真实耗时比例绘制；完整示例通过事件同步验证。</desc><rect id="edition-paper" x="-4.862" y="31.138" width="1139.72" height="672.724" fill="#ffffff"/><svg id="edition-view" x="16" y="52" width="1098" height="631" viewBox="16 52 1098 631" overflow="hidden"><rect width="1098.0" height="631.0" fill="#ffffff" x="16.0" y="52.0"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="98" font-size="26" fill="#577487" text-anchor="start">先确认工作线程已经开始，再取消等待它的 asyncio 任务</text><line x1="240" y1="155" x2="240" y2="585" stroke="#e0e9ef" stroke-width="2"/><text x="240" y="145" font-size="24" fill="#577487" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">已开始</text><line x1="470" y1="155" x2="470" y2="585" stroke="#e0e9ef" stroke-width="2"/><text x="470" y="145" font-size="24" fill="#577487" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">取消包装任务</text><line x1="750" y1="155" x2="750" y2="585" stroke="#e0e9ef" stroke-width="2"/><text x="750" y="145" font-size="24" fill="#577487" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">放行工作</text><line x1="1040" y1="155" x2="1040" y2="585" stroke="#e0e9ef" stroke-width="2"/><text x="1040" y="145" font-size="24" fill="#577487" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">工作提交</text><text x="40" y="250" font-size="27" fill="#2e77a6" text-anchor="start">asyncio</text><text x="40" y="285" font-size="27" fill="#2e77a6" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">任务</text><rect x="240" y="220" width="230" height="55" fill="#2e77a6" opacity="0.16" rx="3"/><circle cx="470" cy="247" r="8" fill="#2e77a6"/><text x="510" y="240" font-size="27" fill="#2e77a6" text-anchor="start">CancelledError</text><text x="510" y="283" font-size="25" fill="#2e77a6" text-anchor="start">done=True · cancelled=True</text><text x="40" y="440" font-size="27" fill="#a16139" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">底层线程</text><rect x="240" y="410" width="510" height="55" fill="#b96f41" opacity="0.14" rx="3"/><rect x="750" y="410" width="290" height="55" fill="#b96f41" opacity="0.8" rx="3"/><text x="490" y="447" font-size="27" fill="#233a4b" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">等待释放事件</text><text x="895" y="447" font-size="27" fill="#ffffff" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">执行副作用</text><text x="580" y="550" font-size="26" fill="#a16139" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">此时包装任务已取消，线程仍未完成</text><text x="1040" y="515" font-size="25" fill="#a16139" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">完成通知</text><text x="40" y="655" font-size="29" fill="#233a4b" text-anchor="start">取消等待者 ≠ 终止已运行的线程 ≠ 撤回外部副作用</text></g></svg></svg>
