<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="553" viewBox="0 85 960 553" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">三个闭包共享最终为二的单元，三个默认参数函数则各自保存零一二</title><desc id="artwork-desc">三个函数对象，不一定拥有三份被引用的状态 模块顶层的 index 是全局绑定；不要把它误称为捕获的局部单元。</desc><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="502.119157"/></clipPath></defs><rect width="960" height="638" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 70.606906) scale(0.726682)"><g><rect width="1252.267" height="690.975" fill="white" x="13.867" y="59.714"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#45667a" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#154866"><text x="40" y="108" font-size="34.83px" fill="#4a718f">左：外层局部变量由单元共享；右：默认参数在每轮定义时分别求值</text><text x="55" y="185" font-size="36.467116px" fill="#1d77b7">闭包：调用时读取同一绑定</text><text x="690" y="185" font-size="36.467116px" fill="#127f84">默认参数：本次调用未传值</text><text x="55" y="285" font-size="36.467116px" fill="#1d77b7">delayed[0]</text><line stroke="#45667a" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="235" y1="275" x2="435" y2="425"/><text x="690" y="285" font-size="36.467116px" fill="#127f84">captured[0]</text><line stroke="#45667a" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="895" y1="275" x2="1060" y2="275"/><circle cx="1110" cy="275" r="40" fill="#eef8f5" stroke="#0a6f84" stroke-width="3"/><text x="1100" y="285" font-size="36.467116px" fill="#127f84">0</text><text x="55" y="435" font-size="36.467116px" fill="#1d77b7">delayed[1]</text><line stroke="#45667a" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="235" y1="425" x2="435" y2="425"/><text x="690" y="435" font-size="36.467116px" fill="#127f84">captured[1]</text><line stroke="#45667a" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="895" y1="425" x2="1060" y2="425"/><circle cx="1110" cy="425" r="40" fill="#eef8f5" stroke="#0a6f84" stroke-width="3"/><text x="1100" y="435" font-size="36.467116px" fill="#127f84">1</text><text x="55" y="585" font-size="36.467116px" fill="#1d77b7">delayed[2]</text><line stroke="#45667a" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="235" y1="575" x2="435" y2="425"/><text x="690" y="585" font-size="36.467116px" fill="#127f84">captured[2]</text><line stroke="#45667a" stroke-width="3" marker-end="url(#arrow)" fill="none" x1="895" y1="575" x2="1060" y2="575"/><circle cx="1110" cy="575" r="40" fill="#eef8f5" stroke="#0a6f84" stroke-width="3"/><text x="1100" y="585" font-size="36.467116px" fill="#127f84">2</text><rect x="450" y="380" width="175" height="100" rx="6" fill="#f2f7fb" stroke="#127eba" stroke-width="3"/><text x="470" y="418" font-size="36.12px" fill="#1d77b7">共享 cell</text><text x="518" y="458" font-size="36.467116px" fill="#1d77b7">2</text><text x="55" y="685" font-size="36.12px" fill="#173c58">返回后仍保留外层单元</text><text x="690" y="685" font-size="36.12px" fill="#173c58">各自的 __defaults__ 元组</text><path d="M40 724 H1240" stroke="#d9e1e8" stroke-width="2"/></g><desc> 三个函数对象，不一定拥有三份被引用的状态 模块顶层的 index 是全局绑定；不要把它误称为捕获的局部单元。</desc></g></g></g></svg>