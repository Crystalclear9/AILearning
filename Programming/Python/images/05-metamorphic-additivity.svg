<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="1028.48" viewBox="-18.24 28.76 996.48 1028.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">规格性质必须能够区分实现错误</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="941.597222"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="1028.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="992" viewBox="0 47 960 992" overflow="hidden"><rect width="960" height="1039" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.505556)"><g><defs><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf6fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>分块求值会重复引入错误函数的额外常数</title><svg width="1800" height="1300" viewBox="0 0 1800 1300" role="img"><title>分块求值会重复引入错误函数的额外常数</title><rect width="1800" height="1300" fill="#ffffff"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#186585" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#be622d" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#7c8fa2" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1c6c7f" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="900" y="75" font-size="37" fill="#243b4c" text-anchor="middle" font-weight="400">错误函数 F(xs) = sum(xs) + 1</text><text x="80" y="270" font-size="34" fill="#243b4c" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">一次调用</text><rect x="450" y="210" width="100" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#186585" stroke-width="2"/><text x="500" y="275" font-size="38" fill="#217296" text-anchor="middle" font-weight="400">1</text><rect x="565" y="210" width="100" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#186585" stroke-width="2"/><text x="615" y="275" font-size="38" fill="#217296" text-anchor="middle" font-weight="400">2</text><rect x="680" y="210" width="100" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#186585" stroke-width="2"/><text x="730" y="275" font-size="38" fill="#217296" text-anchor="middle" font-weight="400">3</text><text x="580" y="400" font-size="34" fill="#217296" text-anchor="middle" font-weight="400">求和 6</text><text x="580" y="480" font-size="34" fill="#a65b30" text-anchor="middle" font-weight="400">再加 1</text><line x1="580" y1="510" x2="580" y2="560" stroke="#7c8fa2" stroke-width="3" marker-end="url(#g)"/><text x="580" y="630" font-size="43" fill="#a65b30" text-anchor="middle" font-weight="400">7</text><text x="1560" y="395" font-size="42" fill="#a65b30" text-anchor="middle" font-weight="400">7</text><text x="80" y="770" font-size="34" fill="#243b4c" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">分成两次调用</text><rect x="450" y="710" width="100" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#186585" stroke-width="2"/><text x="500" y="775" font-size="38" fill="#217296" text-anchor="middle" font-weight="400">1</text><rect x="565" y="710" width="100" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#186585" stroke-width="2"/><text x="615" y="775" font-size="38" fill="#217296" text-anchor="middle" font-weight="400">2</text><text x="580" y="900" font-size="34" fill="#217296" text-anchor="middle" font-weight="400">求和 3</text><text x="580" y="980" font-size="34" fill="#a65b30" text-anchor="middle" font-weight="400">再加 1</text><line x1="580" y1="1010" x2="580" y2="1060" stroke="#7c8fa2" stroke-width="3" marker-end="url(#g)"/><text x="580" y="1130" font-size="43" fill="#a65b30" text-anchor="middle" font-weight="400">4</text><rect x="1100" y="710" width="100" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#186585" stroke-width="2"/><text x="1150" y="775" font-size="38" fill="#217296" text-anchor="middle" font-weight="400">3</text><text x="1230" y="900" font-size="34" fill="#217296" text-anchor="middle" font-weight="400">求和 3</text><text x="1230" y="980" font-size="34" fill="#a65b30" text-anchor="middle" font-weight="400">再加 1</text><line x1="1230" y1="1010" x2="1230" y2="1060" stroke="#7c8fa2" stroke-width="3" marker-end="url(#g)"/><text x="1230" y="1130" font-size="43" fill="#a65b30" text-anchor="middle" font-weight="400">4</text><text x="1560" y="895" font-size="42" fill="#a65b30" text-anchor="middle" font-weight="400">4 + 4 = 8</text><text x="900" y="1250" font-size="35" fill="#243b4c" text-anchor="middle" font-weight="400">分块可加性失败：额外常数从 1 份变成 2 份</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1300) scale(1.25)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">加法性仍不能唯一识别求和：独立规格锚点不可省</text><text x="65" y="130" font-size="39.99px" fill="#a55f3a" text-anchor="start">错误函数 G(xs)=2×sum(xs)</text><rect x="70" y="190" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="281.0" y="229" font-size="36.12px" fill="#a55f3a" text-anchor="middle">G([1,2])=6</text><rect x="500" y="190" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="711.0" y="229" font-size="36.12px" fill="#a55f3a" text-anchor="middle">G([3])=6</text><rect x="930" y="190" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="1141.0" y="229" font-size="36.12px" fill="#a55f3a" text-anchor="middle">G([1,2,3])=12</text><text x="65" y="310" font-size="38.7px" fill="#213747" text-anchor="start">6 + 6 = 12：分块加法性通过；G([])=0：空输入也通过。</text><text x="65" y="405" font-size="38.7px" fill="#277290" text-anchor="start">独立锚点：规格要求 sum([1])=1，而 G([1])=2，立即区分。</text></g></g></g></g></g></svg></svg>