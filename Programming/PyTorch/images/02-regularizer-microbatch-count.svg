<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="531" viewBox="0 47 960 531" role="img" aria-labelledby="artwork-title"><title id="artwork-title">微批等价不仅涉及数据损失的分母，还涉及独立目标项被加几次</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="480.277778"/></clipPath></defs><rect width="960" height="578" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><rect width="1440" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#154866"><text x="40" y="48" font-size="41.934066px" fill="#173c58" text-anchor="start">四个微批只做一次更新：数据梯度与正则梯度分开累计</text><text x="40" y="99" font-size="36.12px" fill="#173c58" text-anchor="start">固定 w = 2；每批数据梯度 0.25；正则项 0.05w² 的梯度为 0.2</text><text x="40" y="155" font-size="38.7px" fill="#ad5c22" text-anchor="start">每批都加完整正则：重复四次</text><rect x="45" y="185" width="215" height="108" rx="7" fill="white" stroke="#b7581a" stroke-width="2"/><text x="152" y="222" font-size="32.25px" fill="#ad5c22" text-anchor="middle">微批 1</text><text x="152" y="267" font-size="34.51px" fill="#ad5c22" text-anchor="middle">0.25 + 0.2</text><text x="277" y="249" font-size="33.32px" fill="#173c58" text-anchor="middle">+</text><rect x="295" y="185" width="215" height="108" rx="7" fill="white" stroke="#b7581a" stroke-width="2"/><text x="402" y="222" font-size="32.25px" fill="#ad5c22" text-anchor="middle">微批 2</text><text x="402" y="267" font-size="34.51px" fill="#ad5c22" text-anchor="middle">0.25 + 0.2</text><text x="527" y="249" font-size="33.32px" fill="#173c58" text-anchor="middle">+</text><rect x="545" y="185" width="215" height="108" rx="7" fill="white" stroke="#b7581a" stroke-width="2"/><text x="652" y="222" font-size="32.25px" fill="#ad5c22" text-anchor="middle">微批 3</text><text x="652" y="267" font-size="34.51px" fill="#ad5c22" text-anchor="middle">0.25 + 0.2</text><text x="777" y="249" font-size="33.32px" fill="#173c58" text-anchor="middle">+</text><rect x="795" y="185" width="215" height="108" rx="7" fill="white" stroke="#b7581a" stroke-width="2"/><text x="902" y="222" font-size="32.25px" fill="#ad5c22" text-anchor="middle">微批 4</text><text x="902" y="267" font-size="34.51px" fill="#ad5c22" text-anchor="middle">0.25 + 0.2</text><text x="45" y="350" font-size="41.28px" fill="#ad5c22" text-anchor="start">数据 1 + 正则 0.8 = 1.8</text><text x="850" y="350" font-size="41.28px" fill="#ad5c22" text-anchor="start">一步 SGD：w → 1.82</text><text x="40" y="430" font-size="38.7px" fill="#2073ac" text-anchor="start">数据逐批累加，正则只加一次</text><rect x="45" y="460" width="215" height="108" rx="7" fill="white" stroke="#146d9e" stroke-width="2"/><text x="152" y="497" font-size="32.25px" fill="#2073ac" text-anchor="middle">微批 1</text><text x="152" y="542" font-size="34.51px" fill="#2073ac" text-anchor="middle">0.25</text><text x="277" y="524" font-size="33.32px" fill="#173c58" text-anchor="middle">+</text><rect x="295" y="460" width="215" height="108" rx="7" fill="white" stroke="#146d9e" stroke-width="2"/><text x="402" y="497" font-size="32.25px" fill="#2073ac" text-anchor="middle">微批 2</text><text x="402" y="542" font-size="34.51px" fill="#2073ac" text-anchor="middle">0.25</text><text x="527" y="524" font-size="33.32px" fill="#173c58" text-anchor="middle">+</text><rect x="545" y="460" width="215" height="108" rx="7" fill="white" stroke="#146d9e" stroke-width="2"/><text x="652" y="497" font-size="32.25px" fill="#2073ac" text-anchor="middle">微批 3</text><text x="652" y="542" font-size="34.51px" fill="#2073ac" text-anchor="middle">0.25</text><text x="777" y="524" font-size="33.32px" fill="#173c58" text-anchor="middle">+</text><rect x="795" y="460" width="215" height="108" rx="7" fill="white" stroke="#146d9e" stroke-width="2"/><text x="902" y="497" font-size="32.25px" fill="#2073ac" text-anchor="middle">微批 4</text><text x="902" y="542" font-size="34.51px" fill="#2073ac" text-anchor="middle">0.25</text><text x="1060" y="541" font-size="36.89px" fill="#2073ac" text-anchor="start">+ 0.2</text><text x="45" y="625" font-size="41.28px" fill="#2073ac" text-anchor="start">数据 1 + 正则 0.2 = 1.2</text><text x="850" y="625" font-size="41.28px" fill="#2073ac" text-anchor="start">一步 SGD：w → 1.88</text><path d="M40 385 H1390" stroke="#d9e1e8"/><text x="40" y="725" font-size="34.83px" fill="#173c58" text-anchor="start">学习率 0.1；组内 w 不变；普通 SGD，无动量、无额外 weight decay</text></g></g></g></g></svg>