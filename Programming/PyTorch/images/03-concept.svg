<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>数据准备、传输与设备计算</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">数据准备、传输与设备计算</text><text x="45" y="110" font-size="23" fill="#16324f">理想可重叠调度：每个块表示一个批次在该资源上的工作</text><text x="30" y="198" font-size="22" fill="#16324f">读取／解码</text><rect x="205" y="155" width="150" height="70" rx="5" fill="#cfe3f6" stroke="#7393ac"/><text x="227" y="198" font-size="23" fill="#16324f">批次 1</text><line x1="355" y1="225" x2="370" y2="265" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="155" width="150" height="70" rx="5" fill="#cfe3f6" stroke="#7393ac"/><text x="392" y="198" font-size="23" fill="#16324f">批次 2</text><line x1="520" y1="225" x2="535" y2="265" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="155" width="150" height="70" rx="5" fill="#cfe3f6" stroke="#7393ac"/><text x="557" y="198" font-size="23" fill="#16324f">批次 3</text><line x1="685" y1="225" x2="700" y2="265" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="308" font-size="22" fill="#16324f">主机到设备</text><rect x="370" y="265" width="150" height="70" rx="5" fill="#d8eddc" stroke="#7393ac"/><text x="392" y="308" font-size="23" fill="#16324f">批次 1</text><line x1="520" y1="335" x2="535" y2="375" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="265" width="150" height="70" rx="5" fill="#d8eddc" stroke="#7393ac"/><text x="557" y="308" font-size="23" fill="#16324f">批次 2</text><line x1="685" y1="335" x2="700" y2="375" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="265" width="150" height="70" rx="5" fill="#d8eddc" stroke="#7393ac"/><text x="722" y="308" font-size="23" fill="#16324f">批次 3</text><line x1="850" y1="335" x2="865" y2="375" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="418" font-size="22" fill="#16324f">设备计算</text><rect x="535" y="375" width="150" height="70" rx="5" fill="#eadcf2" stroke="#7393ac"/><text x="557" y="418" font-size="23" fill="#16324f">批次 1</text><rect x="700" y="375" width="150" height="70" rx="5" fill="#eadcf2" stroke="#7393ac"/><text x="722" y="418" font-size="23" fill="#16324f">批次 2</text><rect x="865" y="375" width="150" height="70" rx="5" fill="#eadcf2" stroke="#7393ac"/><text x="887" y="418" font-size="23" fill="#16324f">批次 3</text><line x1="200" y1="520" x2="1100" y2="520" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><text x="1000" y="560" font-size="23" fill="#16324f">时间</text><text x="45" y="600" font-size="21" fill="#16324f">对角箭头：同一批次的依赖；不同行的工作仅在资源与同步条件允许时重叠。</text><text x="45" y="640" font-size="21" fill="#16324f">这是调度示意，不按耗时比例绘制；非阻塞请求不等于已经获得真实并行。</text></g></svg>