<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">数据准备、传输与设备计算</title><desc id="plateDesc">B 用每批 CPU 二、传输一、设备三的假设排出三批合法资源时间线，末批在十二结束。C 完全串行需要十八。这是资源独占、允许缓冲和重叠的理想模型，不能代替真实设备上的同步测量。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">数据准备、传输与设备计算</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">PyTorch</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">三个资源阶段允许跨批次重叠</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">理想三批流水线耗时 12</text><text x="204" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400">0</text><text x="441" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400">6</text><text x="678" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400">12</text><text x="96" y="965" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">CPU</text><text x="96" y="1030" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">传输</text><text x="96" y="1095" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">设备</text><rect x="204" y="935" width="76" height="44" rx="3" fill="#d5ebe4" stroke="#d5e1e8"/><text x="242" y="964" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">A</text><rect x="283" y="935" width="76" height="44" rx="3" fill="#d5ebe4" stroke="#d5e1e8"/><text x="321" y="964" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">B</text><rect x="362" y="935" width="76" height="44" rx="3" fill="#d5ebe4" stroke="#d5e1e8"/><text x="400" y="964" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">C</text><rect x="283" y="1000" width="36.5" height="44" rx="3" fill="#e0eaf6" stroke="#d5e1e8"/><text x="301.25" y="1029" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">A</text><rect x="362" y="1000" width="36.5" height="44" rx="3" fill="#e0eaf6" stroke="#d5e1e8"/><text x="380.25" y="1029" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">B</text><rect x="441" y="1000" width="36.5" height="44" rx="3" fill="#e0eaf6" stroke="#d5e1e8"/><text x="459.25" y="1029" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">C</text><rect x="322.5" y="1065" width="115.5" height="44" rx="3" fill="#f8e5d2" stroke="#d5e1e8"/><text x="380.25" y="1094" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">A</text><rect x="441" y="1065" width="115.5" height="44" rx="3" fill="#f8e5d2" stroke="#d5e1e8"/><text x="498.75" y="1094" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">B</text><rect x="559.5" y="1065" width="115.5" height="44" rx="3" fill="#f8e5d2" stroke="#d5e1e8"/><text x="617.25" y="1094" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">C</text><text x="696" y="1159" font-size="20" fill="#5c7281" text-anchor="end" font-weight="400">逻辑时间（见正文假设）</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">串行执行需要 18</text><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0</text><path d="M866,1043.25 L1381,1043.25" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1049.25" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">5</text><path d="M866,1001.5 L1381,1001.5" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1007.5" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">10</text><path d="M866,959.75 L1381,959.75" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="965.75" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">15</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">20</text><rect x="951.75" y="984.8" width="86" height="100.2" rx="3" fill="#168a83" stroke="#168a83"/><text x="994.75" y="974.8" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">12</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">理想流水重叠</text><rect x="1209.25" y="934.7" width="86" height="150.3" rx="3" fill="#d17c3e" stroke="#d17c3e"/><text x="1252.25" y="924.7" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">18</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">三批完全串行</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">时间：假设每批三阶段耗时 2、1、3</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 590.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>数据准备、传输与设备计算</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">数据准备、传输与设备计算</text><text x="45" y="110" font-size="23" fill="#16324f">理想可重叠调度：每个块表示一个批次在该资源上的工作</text><text x="30" y="198" font-size="22" fill="#16324f">读取／解码</text><rect x="205" y="155" width="150" height="70" rx="5" fill="#cfe3f6" stroke="#7393ac" /><text x="227" y="198" font-size="23" fill="#16324f">批次 1</text><line x1="355" y1="225" x2="370" y2="265" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="370" y="155" width="150" height="70" rx="5" fill="#cfe3f6" stroke="#7393ac" /><text x="392" y="198" font-size="23" fill="#16324f">批次 2</text><line x1="520" y1="225" x2="535" y2="265" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="535" y="155" width="150" height="70" rx="5" fill="#cfe3f6" stroke="#7393ac" /><text x="557" y="198" font-size="23" fill="#16324f">批次 3</text><line x1="685" y1="225" x2="700" y2="265" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><text x="30" y="308" font-size="22" fill="#16324f">主机到设备</text><rect x="370" y="265" width="150" height="70" rx="5" fill="#d8eddc" stroke="#7393ac" /><text x="392" y="308" font-size="23" fill="#16324f">批次 1</text><line x1="520" y1="335" x2="535" y2="375" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="535" y="265" width="150" height="70" rx="5" fill="#d8eddc" stroke="#7393ac" /><text x="557" y="308" font-size="23" fill="#16324f">批次 2</text><line x1="685" y1="335" x2="700" y2="375" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="700" y="265" width="150" height="70" rx="5" fill="#d8eddc" stroke="#7393ac" /><text x="722" y="308" font-size="23" fill="#16324f">批次 3</text><line x1="850" y1="335" x2="865" y2="375" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><text x="30" y="418" font-size="22" fill="#16324f">设备计算</text><rect x="535" y="375" width="150" height="70" rx="5" fill="#eadcf2" stroke="#7393ac" /><text x="557" y="418" font-size="23" fill="#16324f">批次 1</text><rect x="700" y="375" width="150" height="70" rx="5" fill="#eadcf2" stroke="#7393ac" /><text x="722" y="418" font-size="23" fill="#16324f">批次 2</text><rect x="865" y="375" width="150" height="70" rx="5" fill="#eadcf2" stroke="#7393ac" /><text x="887" y="418" font-size="23" fill="#16324f">批次 3</text><line x1="200" y1="520" x2="1100" y2="520" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><text x="1000" y="560" font-size="23" fill="#16324f">时间</text><text x="45" y="600" font-size="21" fill="#16324f">对角箭头：同一批次的依赖；不同行的工作仅在资源与同步条件允许时重叠。</text><text x="45" y="640" font-size="21" fill="#16324f">这是调度示意，不按耗时比例绘制；非阻塞请求不等于已经获得真实并行。</text></g></svg></svg>
