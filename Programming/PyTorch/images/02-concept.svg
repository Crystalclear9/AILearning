<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>微批累积使用共同总分母</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">微批累积使用共同总分母</text><rect x="50" y="135" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac"/><text x="62" y="167" font-size="22" fill="#16324f">微批</text><rect x="200" y="135" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac"/><text x="212" y="167" font-size="22" fill="#16324f">有效元素</text><rect x="350" y="135" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac"/><text x="362" y="167" font-size="22" fill="#16324f">损失和</text><rect x="50" y="183" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="62" y="215" font-size="22" fill="#16324f">甲</text><rect x="200" y="183" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="212" y="215" font-size="22" fill="#16324f">2</text><rect x="350" y="183" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="362" y="215" font-size="22" fill="#16324f">2</text><rect x="50" y="231" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="62" y="263" font-size="22" fill="#16324f">乙</text><rect x="200" y="231" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="212" y="263" font-size="22" fill="#16324f">1</text><rect x="350" y="231" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="362" y="263" font-size="22" fill="#16324f">10</text><rect x="600" y="115" width="520" height="185" rx="5" fill="#e5f3e9" stroke="#7393ac"/><text x="620" y="150" font-size="23" fill="#16324f">共同分母：有效元素总数</text><text x="635" y="205" font-size="27" fill="#16324f">2＋10</text><line x1="627" y1="216" x2="785" y2="216" stroke="#6887a0" stroke-width="3"/><text x="685" y="252" font-size="27" fill="#16324f">3</text><text x="850" y="230" font-size="32" fill="#16324f">＝4</text><rect x="600" y="355" width="520" height="185" rx="5" fill="#fff0e7" stroke="#7393ac"/><text x="620" y="395" font-size="23" fill="#16324f">错误目标：两个批均值再平均</text><text x="635" y="450" font-size="27" fill="#16324f">1＋10</text><line x1="627" y1="461" x2="785" y2="461" stroke="#6887a0" stroke-width="3"/><text x="685" y="497" font-size="27" fill="#16324f">2</text><text x="850" y="475" font-size="32" fill="#16324f">＝5.5</text><line x1="505" y1="235" x2="585" y2="215" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="590" font-size="21" fill="#16324f">同一参数位置、可逐元素相加的目标下，按共同总分母累积才对应所声明目标。</text><text x="50" y="630" font-size="21" fill="#16324f">BatchNorm 与跨样本损失可能改变前向；延后更新并不自动复制大批训练。</text></g></svg>