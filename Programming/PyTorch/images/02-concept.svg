5f8)" stroke="#13668a"/><text x="306.0" y="179" font-size="36.12px" fill="#1e7499" text-anchor="middle">微批 A：1、1</text><rect x="555" y="140" width="482" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="796.0" y="179" font-size="36.12px" fill="#1e7499" text-anchor="middle">微批 B：10</text><g><text x="65.000" y="260" font-size="31.65px" fill="#af6033">先均批：A 内每项权重 </text><text x="390.070" y="243" font-size="28" fill="#af6033" text-anchor="middle">1</text><line x1="377.859" x2="402.281" y1="251" y2="251" stroke="#ba602b" stroke-width="1.845"/><text x="390.070" y="279" font-size="28" fill="#af6033" text-anchor="middle">4</text><text x="406.281" y="260" font-size="31.65px" fill="#af6033">；B 唯一项权重 </text><text x="639.070" y="243" font-size="33.32px" fill="#af6033" text-anchor="middle">1</text><line x1="626.859" x2="651.281" y1="251" y2="251" stroke="#ba602b" stroke-width="1.845"/><text x="639.070" y="279" font-size="33.32px" fill="#af6033" text-anchor="middle">2</text></g><text x="65" y="330" font-size="38.7px" fill="#1e7499" text-anchor="start">统一样本目标：三条记录的权重全部相同，均为三分之一</text><text x="65" y="410" font-size="36.12px" fill="#1d3145" text-anchor="start">拆分批次只改变执行方式；若权重改变，优化的经验风险也随之改变。</text></g></g></g></g></g></svg>