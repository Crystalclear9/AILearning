<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">微批累积使用共同总分母</title><desc id="plateDesc">B 与 C 使用同样三个有效元素 1、1、10。先把损失和与计数合并得到十二除以三等于四；把微批均值一与十再平均却得到五点五，使单元素微批被过度加权。随机层和批内耦合仍可能使微批计算与大批计算存在其他差别。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">微批累积使用共同总分母</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">微批贡献先求和，再按有效元素归一</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">完整目标使用共同分母</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">平均批均值会给错权重</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>微批累积使用共同总分母</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">微批累积使用共同总分母</text><rect x="50" y="135" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="62" y="167" font-size="22" fill="#16324f">微批</text><rect x="200" y="135" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="212" y="167" font-size="22" fill="#16324f">有效元素</text><rect x="350" y="135" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="362" y="167" font-size="22" fill="#16324f">损失和</text><rect x="50" y="183" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="62" y="215" font-size="22" fill="#16324f">甲</text><rect x="200" y="183" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="212" y="215" font-size="22" fill="#16324f">2</text><rect x="350" y="183" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="362" y="215" font-size="22" fill="#16324f">2</text><rect x="50" y="231" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="62" y="263" font-size="22" fill="#16324f">乙</text><rect x="200" y="231" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="212" y="263" font-size="22" fill="#16324f">1</text><rect x="350" y="231" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="362" y="263" font-size="22" fill="#16324f">10</text><rect x="600" y="115" width="520" height="185" rx="5" fill="#e5f3e9" stroke="#7393ac" /><text x="620" y="150" font-size="23" fill="#16324f">共同分母：有效元素总数</text><text x="635" y="205" font-size="27" fill="#16324f">2＋10</text><line x1="627" y1="216" x2="785" y2="216" stroke="#6887a0" stroke-width="3" /><text x="685" y="252" font-size="27" fill="#16324f">3</text><text x="850" y="230" font-size="32" fill="#16324f">＝4</text><rect x="600" y="355" width="520" height="185" rx="5" fill="#fff0e7" stroke="#7393ac" /><text x="620" y="395" font-size="23" fill="#16324f">错误目标：两个批均值再平均</text><text x="635" y="450" font-size="27" fill="#16324f">1＋10</text><line x1="627" y1="461" x2="785" y2="461" stroke="#6887a0" stroke-width="3" /><text x="685" y="497" font-size="27" fill="#16324f">2</text><text x="850" y="475" font-size="32" fill="#16324f">＝5.5</text><line x1="505" y1="235" x2="585" y2="215" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><text x="50" y="590" font-size="21" fill="#16324f">同一参数位置、可逐元素相加的目标下，按共同总分母累积才对应所声明目标。</text><text x="50" y="630" font-size="21" fill="#16324f">BatchNorm 与跨样本损失可能改变前向；延后更新并不自动复制大批训练。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="312" y="965" font-size="29" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(312 965) scale(0.7272727273 1) translate(-312 -965)">2 + 10</text><path d="M255.164,981 L368.836,981" fill="none" stroke="#19354a" stroke-width="2" /><text x="312" y="1020" font-size="29" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(312 1020) scale(0.7272727273 1) translate(-312 -1020)">3</text><text x="393.836" y="998" font-size="29" fill="#168a83" text-anchor="start" font-weight="400" transform="translate(393.836 998) scale(0.7272727273 1) translate(-393.836 -998)">= 4</text><text x="96" y="1125" font-size="22" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1125) scale(0.7272727273 1) translate(-96 -1125)">两个微批的有效元素数分别为 2 与 1</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1043.25 L1381,1043.25" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1049.25" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1049.25) scale(0.7272727273 1) translate(-856 -1049.25)">2</text><path d="M866,1001.5 L1381,1001.5" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1007.5" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1007.5) scale(0.7272727273 1) translate(-856 -1007.5)">4</text><path d="M866,959.75 L1381,959.75" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="965.75" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 965.75) scale(0.7272727273 1) translate(-856 -965.75)">6</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 924) scale(0.7272727273 1) translate(-856 -924)">8</text><rect x="951.75" y="1001.5" width="86" height="83.5" rx="3" fill="#168a83" stroke="#168a83" /><text x="994.75" y="991.5" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(994.75 991.5) scale(0.7272727273 1) translate(-994.75 -991.5)">4</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(869 1113) scale(0.7272727273 1) translate(-869 -1113)">正确全局均值</text><rect x="1209.25" y="970.188" width="86" height="114.812" rx="3" fill="#d17c3e" stroke="#d17c3e" /><text x="1252.25" y="960.188" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1252.25 960.188) scale(0.7272727273 1) translate(-1252.25 -960.188)">5.5</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1126.5 1113) scale(0.7272727273 1) translate(-1126.5 -1113)">错误批均值平均</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1153) scale(0.7272727273 1) translate(-806 -1153)">微批损失分别为 [1,1] 与 [10]</text></g></svg>
