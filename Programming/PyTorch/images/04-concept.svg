<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>恢复训练需要一致状态集合</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">恢复训练需要一致状态集合</text><rect x="400" y="210" width="390" height="155" rx="5" fill="#e4eef7" stroke="#7393ac"/><text x="430" y="255" font-size="26" fill="#16324f">同一更新边界的检查点</text><text x="435" y="310" font-size="23" fill="#16324f">下一次更新的共同起点</text><rect x="40" y="100" width="330" height="115" rx="5" fill="#eef5fa" stroke="#7393ac"/><text x="55" y="135" font-size="24" fill="#16324f">模型参数</text><text x="55" y="182" font-size="21" fill="#16324f">当前预测映射</text><line x1="205" y1="215" x2="595" y2="210" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="815" y="100" width="330" height="115" rx="5" fill="#eef5fa" stroke="#7393ac"/><text x="830" y="135" font-size="24" fill="#16324f">优化器</text><text x="830" y="182" font-size="21" fill="#16324f">动量、二阶统计</text><line x1="980" y1="215" x2="595" y2="210" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="420" width="330" height="115" rx="5" fill="#eef5fa" stroke="#7393ac"/><text x="55" y="455" font-size="24" fill="#16324f">调度器与步数</text><text x="55" y="502" font-size="21" fill="#16324f">学习率与更新时钟</text><line x1="205" y1="420" x2="595" y2="365" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="815" y="420" width="330" height="115" rx="5" fill="#eef5fa" stroke="#7393ac"/><text x="830" y="455" font-size="24" fill="#16324f">随机源与数据游标</text><text x="830" y="502" font-size="21" fill="#16324f">下一批及随机操作</text><line x1="980" y1="420" x2="595" y2="365" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="590" font-size="21" fill="#16324f">只恢复权重可支持固定推理；恢复后续训练还要恢复一致的更新与数据状态。</text><text x="45" y="635" font-size="21" fill="#16324f">梯度累积、混合精度缩放及预取可能增加状态；须用连续训练对照验证。</text></g></svg>