<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">恢复训练需要一致状态集合</title><desc id="plateDesc">B 明确采用 v_new=0.9v+g 的动量约定，完整状态给出下一步参数 0.855。C 保留同一个 w 却把速度清零，会得到 0.9；此例独立说明优化器状态为何不能由权重文件替代，随机源和数据游标等状态也应按协议核对。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">恢复训练需要一致状态集合</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">检查点应属于同一约定状态边界</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">一维动量更新依赖旧速度</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">只恢复参数会改变下一步</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>恢复训练需要一致状态集合</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">恢复训练需要一致状态集合</text><rect x="400" y="210" width="390" height="155" rx="5" fill="#e4eef7" stroke="#7393ac" /><text x="430" y="255" font-size="26" fill="#16324f">同一更新边界的检查点</text><text x="435" y="310" font-size="23" fill="#16324f">下一次更新的共同起点</text><rect x="40" y="100" width="330" height="115" rx="5" fill="#eef5fa" stroke="#7393ac" /><text x="55" y="135" font-size="24" fill="#16324f">模型参数</text><text x="55" y="182" font-size="21" fill="#16324f">当前预测映射</text><line x1="205" y1="215" x2="595" y2="210" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="815" y="100" width="330" height="115" rx="5" fill="#eef5fa" stroke="#7393ac" /><text x="830" y="135" font-size="24" fill="#16324f">优化器</text><text x="830" y="182" font-size="21" fill="#16324f">动量、二阶统计</text><line x1="980" y1="215" x2="595" y2="210" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="40" y="420" width="330" height="115" rx="5" fill="#eef5fa" stroke="#7393ac" /><text x="55" y="455" font-size="24" fill="#16324f">调度器与步数</text><text x="55" y="502" font-size="21" fill="#16324f">学习率与更新时钟</text><line x1="205" y1="420" x2="595" y2="365" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="815" y="420" width="330" height="115" rx="5" fill="#eef5fa" stroke="#7393ac" /><text x="830" y="455" font-size="24" fill="#16324f">随机源与数据游标</text><text x="830" y="502" font-size="21" fill="#16324f">下一批及随机操作</text><line x1="980" y1="420" x2="595" y2="365" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><text x="45" y="590" font-size="21" fill="#16324f">只恢复权重可支持固定推理；恢复后续训练还要恢复一致的更新与数据状态。</text><text x="45" y="635" font-size="21" fill="#16324f">梯度累积、混合精度缩放及预取可能增加状态；须用连续训练对照验证。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 928) scale(0.7272727273 1) translate(-96 -928)">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 928) scale(0.7272727273 1) translate(-138 -928)">约定：v_new = 0.9v + g；w_new=w−0.1v_new</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1010) scale(0.7272727273 1) translate(-96 -1010)">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1010) scale(0.7272727273 1) translate(-138 -1010)">保存 w=1、v=0.5；下一梯度 g=1</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1092) scale(0.7272727273 1) translate(-96 -1092)">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1092) scale(0.7272727273 1) translate(-138 -1092)">v_new=1.45；w_new=0.855</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1057.6) scale(0.7272727273 1) translate(-856 -1057.6)">0.2</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1024.2) scale(0.7272727273 1) translate(-856 -1024.2)">0.4</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 990.8) scale(0.7272727273 1) translate(-856 -990.8)">0.6</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 957.4) scale(0.7272727273 1) translate(-856 -957.4)">0.8</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 924) scale(0.7272727273 1) translate(-856 -924)">1</text><rect x="951.75" y="942.215" width="86" height="142.785" rx="3" fill="#168a83" stroke="#168a83" /><text x="994.75" y="932.215" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(994.75 932.215) scale(0.7272727273 1) translate(-994.75 -932.215)">0.855</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(869 1113) scale(0.7272727273 1) translate(-869 -1113)">恢复 w 与 v</text><rect x="1209.25" y="934.7" width="86" height="150.3" rx="3" fill="#d17c3e" stroke="#d17c3e" /><text x="1252.25" y="924.7" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1252.25 924.7) scale(0.7272727273 1) translate(-1252.25 -924.7)">0.9</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1126.5 1113) scale(0.7272727273 1) translate(-1126.5 -1113)">只恢复 w，v 清零</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1153) scale(0.7272727273 1) translate(-806 -1153)">下一步参数 w；同一梯度 g=1</text></g></svg>
