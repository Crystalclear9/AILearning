<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">向量输出的反向传播需要一个种子向量</title><desc id="desc">向量输出没有唯一的“总梯度”，必须指定如何组合各输出的变化率。图中用种子 (2,1) 对两个输出加权；其对参数 w 的向量—雅可比积在 w=3 时为 8。 这里展示一次 VJP，而不是完整雅可比矩阵。若不提供种子，通常的隐式 backward 只适用于满足接口要求的标量输出；求完整雅可比需额外计算。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">向量输出的反向传播需要一个种子向量</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">明确对象、计算关系与适用条件，避免只凭外观判断。</text><path d="M335,316.25 L430,283.75" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M715,281.312 L830,318.688" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M715,455.125 L830,414.875" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><rect x="50" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="192.5" y="373" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">标量参数 w=3</text><rect x="430" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="572.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">输出 y=(w, w²)=(3,9)</text><rect x="430" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="572.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">种子 v=(2,1)</text><rect x="830" y="310" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" /><text x="972.5" y="373" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">VJP：2×1 + 1×6 = 8</text><text x="60" y="695" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">条件与计算见相邻正文。</text></g></svg>
