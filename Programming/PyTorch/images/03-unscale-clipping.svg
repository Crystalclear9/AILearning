<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="636" viewBox="0 0 960 636" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">解除梯度缩放与范数裁剪的次序及二维几何</title><desc id="artwork-desc">缩放梯度24,32范数40。先除8再裁剪得到0.6,0.8；先裁剪再除8得到0.075,0.1。二维圆显示两种最终梯度长度之差。 解除缩放与裁剪：两个操作不能交换 错误次序把有效裁剪半径从 1 缩成了八分之一</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="538.963093"/></clipPath></defs><rect width="960" height="636" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">解除梯度缩放与范数裁剪的次序及二维几何</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(0.210896 -0.766257) scale(0.799649)"><g><title id="figure-title">解除缩放与裁剪：两个操作不能交换</title><desc id="figure-desc">缩放梯度24,32范数40。先除8再裁剪得到0.6,0.8；先裁剪再除8得到0.075,0.1。二维圆显示两种最终梯度长度之差。 解除缩放与裁剪：两个操作不能交换 错误次序把有效裁剪半径从 1 缩成了八分之一</desc><rect width="1138.0" height="674.0" fill="white" x="31.0" y="96.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="145" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">g = (3,4)，缩放 8，裁剪阈值 1</text><circle cx="285" cy="430" r="155" fill="none" stroke="#d9e1e8" stroke-width="2"/><line fill="none" stroke="#617f97" stroke-width="2.8" x1="95" y1="430" x2="490" y2="430"/><line fill="none" stroke="#617f97" stroke-width="2.8" x1="285" y1="620" x2="285" y2="225"/><text x="495" y="463" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">g1</text><text x="305" y="225" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">g2</text><line fill="none" stroke="#176fa3" stroke-width="2.8" marker-end="url(#arrow-blue)" x1="285" y1="430" x2="378" y2="306"/><circle cx="378.0" cy="306.0" r="7" fill="#176fa3"/><line fill="none" stroke="#b9642b" stroke-width="2.8" marker-end="url(#arrow-orange)" x1="285" y1="430" x2="296.625" y2="414.5"/><circle cx="296.625" cy="414.5" r="7" fill="#b9642b"/><text x="380" y="280" font-size="33.13956px" fill="#2472b1" text-anchor="start" font-weight="400">(0.6, 0.8)</text><line x1="303" y1="412" x2="460" y2="535" stroke="#b9642b" stroke-width="2.376044"/><text x="410" y="570" font-size="33.13956px" fill="#a86331" text-anchor="start" font-weight="400">(0.075, 0.1)</text><text x="70" y="680" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">圆：最终梯度范数 1</text><text x="650" y="235" font-size="33.13956px" fill="#2472b1" text-anchor="start" font-weight="600">先解除缩放</text><text x="650" y="297" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">(24,32) → (3,4)</text><text x="650" y="345" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">再裁剪到范数 1</text><text x="650" y="398" font-size="33.13956px" fill="#2472b1" text-anchor="start" font-weight="400">最终 (0.6, 0.8)</text><text x="650" y="480" font-size="33.13956px" fill="#a86331" text-anchor="start" font-weight="600">先裁剪缩放梯度</text><text x="650" y="542" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">(24,32) → (0.6,0.8)</text><text x="650" y="590" font-size="33.13956px" fill="#1f3449" text-anchor="start" font-weight="400">再除以缩放值 8</text><text x="650" y="643" font-size="33.13956px" fill="#a86331" text-anchor="start" font-weight="400">最终 (0.075, 0.1)</text><line x1="55" y1="745" x2="1145" y2="745" stroke="#d9e1e8" stroke-width="2"/></g></g></g></g></svg>