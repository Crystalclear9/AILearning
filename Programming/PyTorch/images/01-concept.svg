<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">前向依赖与梯度回传</title><desc id="plateDesc">B 完整写出单样本链式求导。C 将同一样本复制两次：损失求均值保持梯度十八，求和则得到三十六；两种归约都可以有定义，但学习目标与缩放必须一致，不能在不同实验间混用后仍声称步长相同。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">前向依赖与梯度回传</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">计算图追踪前向值与反向贡献</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">把局部导数连乘得到参数梯度</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">归约方式会改变梯度尺度</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>前向依赖与梯度回传</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker><marker id="panelA-tip-bc7e65" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#bc7e65" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">前向依赖与梯度回传</text><rect x="60" y="140" width="160" height="100" rx="5" fill="#e5f0fa" stroke="#7393ac" /><text x="80" y="175" font-size="23" fill="#16324f">参数 w</text><text x="125" y="220" font-size="30" fill="#16324f">2</text><rect x="60" y="335" width="160" height="100" rx="5" fill="#e5f0fa" stroke="#7393ac" /><text x="80" y="370" font-size="23" fill="#16324f">输入 x</text><text x="125" y="415" font-size="30" fill="#16324f">3</text><line x1="225" y1="190" x2="420" y2="285" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><line x1="225" y1="380" x2="420" y2="285" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="430" y="235" width="240" height="105" rx="5" fill="#e4f1e7" stroke="#7393ac" /><text x="455" y="275" font-size="23" fill="#16324f">乘法 z = wx</text><text x="510" y="320" font-size="28" fill="#16324f">z = 6</text><line x1="680" y1="285" x2="860" y2="285" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="875" y="235" width="250" height="105" rx="5" fill="#f0e6f6" stroke="#7393ac" /><text x="905" y="275" font-size="23" fill="#16324f">L = z² ÷ 2</text><text x="935" y="320" font-size="28" fill="#16324f">L = 18</text><line x1="875" y1="380" x2="690" y2="380" stroke="#bc7e65" stroke-width="3" marker-end="url(#panelA-tip-bc7e65)" /><text x="690" y="425" font-size="22" fill="#16324f">局部梯度：z = 6</text><line x1="430" y1="470" x2="220" y2="470" stroke="#bc7e65" stroke-width="3" marker-end="url(#panelA-tip-bc7e65)" /><text x="225" y="515" font-size="24" fill="#16324f">再乘 x = 3 → 参数梯度 18</text><text x="60" y="590" font-size="22" fill="#16324f">前向计算依赖与反向梯度路径方向相反；共享变量的多路贡献还需要求和。</text><text x="60" y="635" font-size="21" fill="#16324f">此例 x 固定、w 求导；模型更新由优化器负责，而不是 backward 自动完成。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 928) scale(0.7272727273 1) translate(-96 -928)">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 928) scale(0.7272727273 1) translate(-138 -928)">w=2，x=3 → z=6 → L=18</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1010) scale(0.7272727273 1) translate(-96 -1010)">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1010) scale(0.7272727273 1) translate(-138 -1010)">dL/dz=6；dz/dw=3</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1092) scale(0.7272727273 1) translate(-96 -1092)">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1092) scale(0.7272727273 1) translate(-138 -1092)">dL/dw = 6×3 = 18</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1043.25 L1381,1043.25" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1049.25" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1049.25) scale(0.7272727273 1) translate(-856 -1049.25)">10</text><path d="M866,1001.5 L1381,1001.5" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1007.5" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1007.5) scale(0.7272727273 1) translate(-856 -1007.5)">20</text><path d="M866,959.75 L1381,959.75" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="965.75" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 965.75) scale(0.7272727273 1) translate(-856 -965.75)">30</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 924) scale(0.7272727273 1) translate(-856 -924)">40</text><rect x="951.75" y="1009.85" width="86" height="75.15" rx="3" fill="#168a83" stroke="#168a83" /><text x="994.75" y="999.85" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(994.75 999.85) scale(0.7272727273 1) translate(-994.75 -999.85)">18</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(869 1113) scale(0.7272727273 1) translate(-869 -1113)">复制两样本后求均值</text><rect x="1209.25" y="934.7" width="86" height="150.3" rx="3" fill="#d17c3e" stroke="#d17c3e" /><text x="1252.25" y="924.7" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1252.25 924.7) scale(0.7272727273 1) translate(-1252.25 -924.7)">36</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1126.5 1113) scale(0.7272727273 1) translate(-1126.5 -1113)">复制两样本后求和</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1153) scale(0.7272727273 1) translate(-806 -1153)">每个样本均为同一 x=3、L=z²的一半</text></g></svg>
