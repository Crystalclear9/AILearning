<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>前向依赖与梯度回传</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">前向依赖与梯度回传</text><rect x="60" y="140" width="160" height="100" rx="5" fill="#e5f0fa" stroke="#7393ac"/><text x="80" y="175" font-size="23" fill="#16324f">参数 w</text><text x="125" y="220" font-size="30" fill="#16324f">2</text><rect x="60" y="335" width="160" height="100" rx="5" fill="#e5f0fa" stroke="#7393ac"/><text x="80" y="370" font-size="23" fill="#16324f">输入 x</text><text x="125" y="415" font-size="30" fill="#16324f">3</text><line x1="225" y1="190" x2="420" y2="285" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><line x1="225" y1="380" x2="420" y2="285" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="235" width="240" height="105" rx="5" fill="#e4f1e7" stroke="#7393ac"/><text x="455" y="275" font-size="23" fill="#16324f">乘法 z = wx</text><text x="510" y="320" font-size="28" fill="#16324f">z = 6</text><line x1="680" y1="285" x2="860" y2="285" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="875" y="235" width="250" height="105" rx="5" fill="#f0e6f6" stroke="#7393ac"/><text x="905" y="275" font-size="23" fill="#16324f">L = z² ÷ 2</text><text x="935" y="320" font-size="28" fill="#16324f">L = 18</text><line x1="875" y1="380" x2="690" y2="380" stroke="#bc7e65" stroke-width="3" marker-end="url(#arrow)"/><text x="690" y="425" font-size="22" fill="#16324f">局部梯度：z = 6</text><line x1="430" y1="470" x2="220" y2="470" stroke="#bc7e65" stroke-width="3" marker-end="url(#arrow)"/><text x="225" y="515" font-size="24" fill="#16324f">再乘 x = 3 → 参数梯度 18</text><text x="60" y="590" font-size="22" fill="#16324f">前向计算依赖与反向梯度路径方向相反；共享变量的多路贡献还需要求和。</text><text x="60" y="635" font-size="21" fill="#16324f">此例 x 固定、w 求导；模型更新由优化器负责，而不是 backward 自动完成。</text></g></svg>