<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="539" viewBox="0 0 960 539" role="img" aria-labelledby="artwork-title"><title id="artwork-title">预聚合时只保存均值，会丢掉重新合并总体所需的权重</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="442"/></clipPath></defs><rect width="960" height="539" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">预聚合时只保存均值，会丢掉重新合并总体所需的权重</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.65)"><g><rect width="1400" height="680" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#63849a" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#154866"><text x="45" y="49" font-size="40.769231px" fill="#173c58" text-anchor="start">同一批四条记录：保留计数，才能合并总体均值</text><text x="45" y="105" font-size="34.83px" fill="#173c58" text-anchor="start">原始记录</text><text x="485" y="105" font-size="34.83px" fill="#173c58" text-anchor="start">可合并状态 (计数, 总和)</text><text x="1010" y="105" font-size="34.83px" fill="#173c58" text-anchor="start">合并后的总体</text><text x="45" y="193" font-size="40.769231px" fill="#2073ac" text-anchor="start">A</text><rect x="95" y="145" width="80" height="75" rx="8" fill="white" stroke="#146d9e" stroke-width="2"/><text x="135" y="193" font-size="36.89px" fill="#2073ac" text-anchor="middle">10</text><line stroke="#63849a" stroke-width="2.5" fill="none" marker-end="url(#a)" x1="400" y1="182" x2="475" y2="182"/><rect x="495" y="145" width="340" height="75" rx="8" fill="white" stroke="#146d9e" stroke-width="2"/><text x="665" y="193" font-size="40.769231px" fill="#2073ac" text-anchor="middle">(1, 10)</text><text x="45" y="328" font-size="40.769231px" fill="#ad5c22" text-anchor="start">B</text><rect x="95" y="280" width="80" height="75" rx="8" fill="white" stroke="#b7581a" stroke-width="2"/><text x="135" y="328" font-size="36.89px" fill="#ad5c22" text-anchor="middle">20</text><rect x="195" y="280" width="80" height="75" rx="8" fill="white" stroke="#b7581a" stroke-width="2"/><text x="235" y="328" font-size="36.89px" fill="#ad5c22" text-anchor="middle">20</text><rect x="295" y="280" width="80" height="75" rx="8" fill="white" stroke="#b7581a" stroke-width="2"/><text x="335" y="328" font-size="36.89px" fill="#ad5c22" text-anchor="middle">20</text><line stroke="#63849a" stroke-width="2.5" fill="none" marker-end="url(#a)" x1="400" y1="317" x2="475" y2="317"/><rect x="495" y="280" width="340" height="75" rx="8" fill="white" stroke="#b7581a" stroke-width="2"/><text x="665" y="328" font-size="40.769231px" fill="#ad5c22" text-anchor="middle">(3, 60)</text><line stroke="#63849a" stroke-width="2.5" fill="none" marker-end="url(#a)" x1="855" y1="183" x2="950" y2="245"/><line stroke="#63849a" stroke-width="2.5" fill="none" marker-end="url(#a)" x1="855" y1="318" x2="950" y2="265"/><rect x="975" y="205" width="365" height="115" rx="8" fill="white" stroke="#146d9e" stroke-width="2"/><text x="1158" y="250" font-size="37.41px" fill="#2073ac" text-anchor="middle">(1 + 3, 10 + 60)</text><text x="1158" y="295" font-size="39.99px" fill="#2073ac" text-anchor="middle">= (4, 70)</text><path d="M45 400 H1350" stroke="#d9e1e8"/><text x="65" y="455" font-size="37.41px" fill="#ad5c22" text-anchor="start">只保留两个组均值</text><text x="250" y="518" font-size="35.7px" fill="#ad5c22" text-anchor="middle">10 + 20</text><path d="M170 530 H330" stroke="#b7581a" stroke-width="2.46"/><text x="250" y="569" font-size="35.7px" fill="#ad5c22" text-anchor="middle">2</text><text x="355" y="540" font-size="40.769231px" fill="#ad5c22" text-anchor="start">= 15</text><text x="765" y="455" font-size="37.41px" fill="#2073ac" text-anchor="start">先合并总和与有效计数</text><text x="965" y="518" font-size="35.7px" fill="#2073ac" text-anchor="middle">10 + 60</text><path d="M885 530 H1045" stroke="#146d9e" stroke-width="2.46"/><text x="965" y="569" font-size="35.7px" fill="#2073ac" text-anchor="middle">1 + 3</text><text x="1075" y="540" font-size="40.769231px" fill="#2073ac" text-anchor="start">= 17.5</text><text x="65" y="635" font-size="33.54px" fill="#ad5c22" text-anchor="start">每组等权：回答组平均的问题</text><text x="765" y="635" font-size="33.54px" fill="#2073ac" text-anchor="start">每条原记录等权：回答总体均值的问题</text></g></g></g></g></svg>