<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>缺失值改变统计分母</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">缺失值改变统计分母</text><rect x="45" y="115" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac"/><text x="57" y="147" font-size="22" fill="#16324f">记录</text><rect x="195" y="115" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac"/><text x="207" y="147" font-size="22" fill="#16324f">金额</text><rect x="45" y="163" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="57" y="195" font-size="22" fill="#16324f">a</text><rect x="195" y="163" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="207" y="195" font-size="22" fill="#16324f">10</text><rect x="45" y="211" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="57" y="243" font-size="22" fill="#16324f">b</text><rect x="195" y="211" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="207" y="243" font-size="22" fill="#16324f">缺失</text><rect x="45" y="259" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="57" y="291" font-size="22" fill="#16324f">c</text><rect x="195" y="259" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="207" y="291" font-size="22" fill="#16324f">20</text><line x1="355" y1="210" x2="520" y2="155" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><line x1="355" y1="245" x2="520" y2="365" stroke="#6887a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="540" y="95" width="600" height="180" rx="5" fill="#e7f4eb" stroke="#7393ac"/><text x="560" y="130" font-size="23" fill="#16324f">跳过缺失：分母仅计已观测金额</text><text x="565" y="185" font-size="27" fill="#16324f">10＋20</text><line x1="557" y1="196" x2="715" y2="196" stroke="#6887a0" stroke-width="3"/><text x="615" y="232" font-size="27" fill="#16324f">2</text><text x="780" y="210" font-size="32" fill="#16324f">＝15</text><rect x="540" y="330" width="600" height="180" rx="5" fill="#fff2df" stroke="#7393ac"/><text x="560" y="365" font-size="23" fill="#16324f">先填零：分母包含全部记录</text><text x="565" y="420" font-size="27" fill="#16324f">10＋0＋20</text><line x1="557" y1="431" x2="715" y2="431" stroke="#6887a0" stroke-width="3"/><text x="615" y="467" font-size="27" fill="#16324f">3</text><text x="780" y="445" font-size="32" fill="#16324f">＝10</text><text x="45" y="570" font-size="25" fill="#16324f">同一份原始记录，两种分母对应两种统计语义。</text><text x="45" y="615" font-size="21" fill="#16324f">缺失不是零；只有业务契约支持时才能把填零均值解释为目标事实。</text></g></svg>