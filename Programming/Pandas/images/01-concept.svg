<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">缺失值改变统计分母</title><desc id="plateDesc">B 明确有效分母为二。C 在同一原表上填零后得到十，与跳过缺失的十五不同；两者回答的统计问题不同，不能把技术上得到一个数就视为业务规则已确定。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">缺失值改变统计分母</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">缺失位置决定统计分母</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">有效项均值的完整算式</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">填零改变了统计对象</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>缺失值改变统计分母</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">缺失值改变统计分母</text><rect x="45" y="115" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="57" y="147" font-size="22" fill="#16324f">记录</text><rect x="195" y="115" width="148" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="207" y="147" font-size="22" fill="#16324f">金额</text><rect x="45" y="163" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="57" y="195" font-size="22" fill="#16324f">a</text><rect x="195" y="163" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="207" y="195" font-size="22" fill="#16324f">10</text><rect x="45" y="211" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="57" y="243" font-size="22" fill="#16324f">b</text><rect x="195" y="211" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="207" y="243" font-size="22" fill="#16324f">缺失</text><rect x="45" y="259" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="57" y="291" font-size="22" fill="#16324f">c</text><rect x="195" y="259" width="148" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="207" y="291" font-size="22" fill="#16324f">20</text><line x1="355" y1="210" x2="520" y2="155" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><line x1="355" y1="245" x2="520" y2="365" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="540" y="95" width="600" height="180" rx="5" fill="#e7f4eb" stroke="#7393ac" /><text x="560" y="130" font-size="23" fill="#16324f">跳过缺失：分母仅计已观测金额</text><text x="565" y="185" font-size="27" fill="#16324f">10＋20</text><line x1="557" y1="196" x2="715" y2="196" stroke="#6887a0" stroke-width="3" /><text x="615" y="232" font-size="27" fill="#16324f">2</text><text x="780" y="210" font-size="32" fill="#16324f">＝15</text><rect x="540" y="330" width="600" height="180" rx="5" fill="#fff2df" stroke="#7393ac" /><text x="560" y="365" font-size="23" fill="#16324f">先填零：分母包含全部记录</text><text x="565" y="420" font-size="27" fill="#16324f">10＋0＋20</text><line x1="557" y1="431" x2="715" y2="431" stroke="#6887a0" stroke-width="3" /><text x="615" y="467" font-size="27" fill="#16324f">3</text><text x="780" y="445" font-size="32" fill="#16324f">＝10</text><text x="45" y="570" font-size="25" fill="#16324f">同一份原始记录，两种分母对应两种统计语义。</text><text x="45" y="615" font-size="21" fill="#16324f">缺失不是零；只有业务契约支持时才能把填零均值解释为目标事实。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="312" y="965" font-size="29" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(312 965) scale(0.7272727273 1) translate(-312 -965)">10 + 20</text><path d="M246.664,981 L377.336,981" fill="none" stroke="#19354a" stroke-width="2" /><text x="312" y="1020" font-size="29" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(312 1020) scale(0.7272727273 1) translate(-312 -1020)">2</text><text x="402.336" y="998" font-size="29" fill="#168a83" text-anchor="start" font-weight="400" transform="translate(402.336 998) scale(0.7272727273 1) translate(-402.336 -998)">= 15</text><text x="96" y="1125" font-size="22" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1125) scale(0.7272727273 1) translate(-96 -1125)">仅使用两个已观测金额</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1043.25 L1381,1043.25" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1049.25" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1049.25) scale(0.7272727273 1) translate(-856 -1049.25)">5</text><path d="M866,1001.5 L1381,1001.5" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1007.5" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1007.5) scale(0.7272727273 1) translate(-856 -1007.5)">10</text><path d="M866,959.75 L1381,959.75" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="965.75" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 965.75) scale(0.7272727273 1) translate(-856 -965.75)">15</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 924) scale(0.7272727273 1) translate(-856 -924)">20</text><rect x="951.75" y="959.75" width="86" height="125.25" rx="3" fill="#168a83" stroke="#168a83" /><text x="994.75" y="949.75" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(994.75 949.75) scale(0.7272727273 1) translate(-994.75 -949.75)">15</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(869 1113) scale(0.7272727273 1) translate(-869 -1113)">跳过缺失</text><rect x="1209.25" y="1001.5" width="86" height="83.5" rx="3" fill="#d17c3e" stroke="#d17c3e" /><text x="1252.25" y="991.5" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1252.25 991.5) scale(0.7272727273 1) translate(-1252.25 -991.5)">10</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1126.5 1113) scale(0.7272727273 1) translate(-1126.5 -1113)">缺失填零</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1153) scale(0.7272727273 1) translate(-806 -1153)">均值：原始三条记录为 10、缺失、20</text></g></svg>
