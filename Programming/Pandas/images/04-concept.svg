<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">特征窗口与标签窗口分离</title><desc id="plateDesc">B 新增一组明确假设的计数算例：锚点十，历史窗口 [3,10)，结果窗口 (10,17]。C 在十四抽取时只看到结果窗口内的事件十二，成熟窗口还会包含十六；这说明未成熟标签不能当作最终结果，真实业务若还存在回流延迟，需要再加等待条件。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">特征窗口与标签窗口分离</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Pandas</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">特征窗口与结果窗口分离</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">固定锚点复原一个样本</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">预测时刻</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">10</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">历史 [3,10)</text><rect x="281" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="381.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">事件 4</text><rect x="488.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="588.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">事件 8</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">结果 (10,17]</text><rect x="281" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="381.25" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">事件 12</text><rect x="488.5" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="588.75" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">事件 16</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">此例特征计数 2，成熟结果计数 2</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">过早抽取会得到不完整标签</text><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0.5</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1.5</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">2</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">2.5</text><rect x="951.75" y="1018.2" width="86" height="66.8" rx="3" fill="#168a83" stroke="#168a83"/><text x="994.75" y="1008.2" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">1</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">在 14 抽取的已见结果</text><rect x="1209.25" y="951.4" width="86" height="133.6" rx="3" fill="#d17c3e" stroke="#d17c3e"/><text x="1252.25" y="941.4" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">2</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">到 17 的完整结果</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">假设事件即时回流，结果标签定义为计数</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 590.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>特征窗口与标签窗口分离</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">特征窗口与标签窗口分离</text><rect x="100" y="190" width="465" height="145" rx="5" fill="#dceee4" stroke="#7393ac" /><rect x="585" y="190" width="465" height="145" rx="5" fill="#ece3f4" stroke="#7393ac" /><line x1="70" y1="365" x2="1120" y2="365" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><line x1="575" y1="115" x2="575" y2="470" stroke="#bf7956" stroke-width="3" /><text x="115" y="240" font-size="23" fill="#16324f">特征窗口</text><text x="115" y="285" font-size="23" fill="#16324f">仅含 t 之前已经可见的信息</text><text x="610" y="240" font-size="23" fill="#16324f">标签窗口</text><text x="610" y="285" font-size="23" fill="#16324f">t 之后的目标结果</text><text x="490" y="105" font-size="28" fill="#16324f">预测锚点 t</text><text x="810" y="425" font-size="21" fill="#16324f">标签窗结束后仍可能等待上报</text><text x="95" y="520" font-size="27" fill="#16324f">训练样本 = 当时可得特征 ＋ 事后成熟标签</text><text x="95" y="580" font-size="22" fill="#16324f">未来可以用于定义监督目标，不能回流为预测时已知的输入。</text><text x="95" y="625" font-size="21" fill="#16324f">具体窗口端点是否含 t，由业务定义；训练与线上使用相同口径。</text></g></svg></svg>
