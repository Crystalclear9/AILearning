<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>特征窗口与标签窗口分离</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><rect width="1200" height="680" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">特征窗口与标签窗口分离</text><rect x="100" y="190" width="465" height="145" rx="5" fill="#dceee4" stroke="#7393ac" /><rect x="585" y="190" width="465" height="145" rx="5" fill="#ece3f4" stroke="#7393ac" /><line x1="70" y1="365" x2="1120" y2="365" stroke="#6887a0" stroke-width="3" marker-end="url(#tip-6887a0)" /><line x1="575" y1="115" x2="575" y2="470" stroke="#bf7956" stroke-width="3" /><text x="115" y="240" font-size="23" fill="#16324f">特征窗口</text><text x="115" y="285" font-size="23" fill="#16324f">仅含 t 之前已经可见的信息</text><text x="610" y="240" font-size="23" fill="#16324f">标签窗口</text><text x="610" y="285" font-size="23" fill="#16324f">t 之后的目标结果</text><text x="490" y="105" font-size="28" fill="#16324f">预测锚点 t</text><text x="810" y="425" font-size="21" fill="#16324f">标签窗结束后仍可能等待上报</text><text x="95" y="520" font-size="27" fill="#16324f">训练样本 = 当时可得特征 ＋ 事后成熟标签</text><text x="95" y="580" font-size="22" fill="#16324f">未来可以用于定义监督目标，不能回流为预测时已知的输入。</text><text x="95" y="625" font-size="21" fill="#16324f">具体窗口端点是否含 t，由业务定义；训练与线上使用相同口径。</text></g></svg>
