<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="505.273976" viewBox="-18.24 154.199247 996.48 505.273976" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">两条互补缺失记录的按列first输出并不对应任一原始整行</title><desc id="artwork-desc">每列的首个已知值，未必来自同一条观测 按列补齐可以是合法需求；它与按时间选一条真实观测具有不同契约。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="543.312236"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="630.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="594" viewBox="0 47 960 594" overflow="hidden"><rect width="960" height="641" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(4.841772 27.044304) scale(0.767932)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>每列的首个已知值，未必来自同一条观测</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#74909d"/></marker></defs><rect width="1185.0" height="707.5" fill="#ffffff" x="26.25" y="63.75"/><g font-family="Microsoft YaHei, sans-serif" fill="#23394a"><text x="80" y="220" font-size="34.508242px" fill="#23394a" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">原始整行</text><text x="750" y="220" font-size="34.508242px" fill="#23394a" text-anchor="start">按列 first</text><rect x="80" y="270" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="160" y="327" font-size="34.508242px" fill="#23394a" text-anchor="middle">t=1</text><rect x="260" y="270" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="340" y="327" font-size="34.508242px" fill="#23394a" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未知</text><rect x="440" y="270" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="520" y="327" font-size="34.508242px" fill="#23394a" text-anchor="middle">3</text><rect x="80" y="410" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="160" y="467" font-size="34.508242px" fill="#23394a" text-anchor="middle">t=2</text><rect x="260" y="410" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="340" y="467" font-size="34.508242px" fill="#23394a" text-anchor="middle">1</text><rect x="440" y="410" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="520" y="467" font-size="34.508242px" fill="#23394a" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未知</text><text x="260" y="250" font-size="34.508242px" fill="#23394a" text-anchor="start">a</text><text x="440" y="250" font-size="34.508242px" fill="#23394a" text-anchor="start">b</text><rect x="800" y="330" width="180" height="100" fill="#f2f6f5" stroke="#3a7583" stroke-width="2"/><rect x="1000" y="330" width="180" height="100" fill="url(#book-wash-fff1e7)" stroke="#a85c31" stroke-width="2"/><text x="890" y="393" font-size="34" fill="#3b7379" text-anchor="middle">a=1</text><text x="1090" y="393" font-size="34" fill="#a05e37" text-anchor="middle">b=3</text><polyline fill="none" stroke="#3a7583" stroke-width="3" marker-end="url(#a)" points="340,500 340,560 890,560 890,430"/><polyline fill="none" stroke="#a85c31" stroke-width="3" marker-end="url(#a)" points="600,315 650,250 1090,250 1090,330"/><text x="70" y="650" font-size="34.508242px" fill="#23394a" text-anchor="start">输出 (1,3) 的两个字段来自不同时间；原输入里没有这条完整记录。</text><text x="70" y="735" font-size="34.508242px" fill="#23394a" text-anchor="start">若要“最早观测整行”，应选择 t=1 的 (未知,3)，并保留它的身份。</text></g><desc> 每列的首个已知值，未必来自同一条观测 按列补齐可以是合法需求；它与按时间选一条真实观测具有不同契约。</desc></g></g></g></svg></svg>
