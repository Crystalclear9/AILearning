nt-weight="400">u：10 + 20 = 30</text><rect x="610" y="345" width="100" height="70" rx="0" fill="#e9f1f6" stroke="#207aa4" stroke-width="2"/><rect x="710" y="345" width="200" height="70" rx="0" fill="url(#edition-wash-2)" stroke="#207aa4" stroke-width="2"/><text xml:space="preserve" x="660" y="391" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">10</text><text xml:space="preserve" x="810" y="391" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">20</text><text xml:space="preserve" x="610" y="630" font-size="30" fill="#a35c2f" text-anchor="start" font-weight="400">v：5</text><rect x="610" y="665" width="50" height="70" rx="0" fill="url(#book-wash-fff0e4)" stroke="#b4622f" stroke-width="2"/><path d="M 930,380 C 1020,380 1060,275 1130,275" stroke="#207aa4" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1150" y="220" font-size="27" fill="#23394a" text-anchor="start" font-weight="400">O1 · u</text><rect x="1150" y="245" width="300" height="60" rx="0" fill="url(#edition-wash-1)" stroke="#207aa4" stroke-width="2"/><text xml:space="preserve" x="1470" y="285" font-size="30" fill="#2878a3" text-anchor="start" font-weight="400">30</text><path d="M 930,380 C 1020,380 1060,430 1130,430" stroke="#207aa4" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1150" y="375" font-size="27" fill="#23394a" text-anchor="start" font-weight="400">O2 · u</text><rect x="1150" y="400" width="300" height="60" rx="0" fill="url(#edition-wash-1)" stroke="#207aa4" stroke-width="2"/><text xml:space="preserve" x="1470" y="440" font-size="30" fill="#2878a3" text-anchor="start" font-weight="400">30</text><path d="M 685,700 C 1020,700 1060,695 1130,695" stroke="#b4622f" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1150" y="640" font-size="27" fill="#23394a" text-anchor="start" font-weight="400">O3 · v</text><rect x="1150" y="665" width="50" height="60" rx="0" fill="url(#book-wash-fff0e4)" stroke="#b4622f" stroke-width="2"/><text xml:space="preserve" x="1220" y="705" font-size="30" fill="#9c5d31" text-anchor="start" font-weight="400">5</text><text xml:space="preserve" x="70" y="920" font-size="31" fill="#23394a" text-anchor="start" font-weight="400">订单金额合计 35</text><text xml:space="preserve" x="610" y="920" font-size="31" fill="#23394a" text-anchor="start" font-weight="400">用户总额合计 35</text><text xml:space="preserve" x="1150" y="920" font-size="31" fill="#a35c2f" text-anchor="start" font-weight="400">回填列合计 65</text></g><desc> agg 汇成一条，transform 将同一总额送回原行 所有金额条使用相同比例；两条 30 是同一用户总额的广播，不能再次作为新收入相加。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 868.586) scale(1.04557)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">聚合后回填，不是再聚合一次：同一组总量被每条原记录引用</text><rect x="75" y="135" width="172" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="161.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">u:10</text><rect x="255" y="135" width="172" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="341.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">u:20</text><rect x="435" y="135" width="172" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="521.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">v:5</text><line x1="630" y1="165" x2="820" y2="165" stroke="#1c6583" stroke-width="2.46" stroke-dasharray=""/><polyline stroke="#1c6583" stroke-width="2.46" fill="none" points="808.947,169.673 820,165 808.947,160.327"/><rect x="880" y="135" width="202" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="981.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">u:30</text><rect x="1090" y="135" width="202" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1191.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">v:5</text><rect x="75" y="295" width="172" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="161.0" y="334" font-size="36.12px" fill="#a55f3a" text-anchor="middle">u:30</text><rect x="255" y="295" width="172" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="341.0" y="334" font-size="36.12px" fill="#a55f3a" text-anchor="middle">u:30</text><rect x="435" y="295" width="172" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="521.0" y="334" font-size="36.12px" fill="#a55f3a" text-anchor="middle">v:5</text><text x="740" y="333" font-size="39.99px" fill="#a55f3a" text-anchor="start">原金额和 35 → 回填值之和 65</text><text x="65" y="405" font-size="34.83px" fill="#213747" text-anchor="start">u 组有两条记录，所以它的总量 30 被引用两次；输出行数保持，不代表列和保持。</text></g></g></g></g></g></svg></svg>