<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="902.48" viewBox="-18.24 28.76 996.48 902.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">构造未来标签时，样本是否成熟取决于观察窗是否完整</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="815.208333"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="902.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="866" viewBox="0 47 960 866" overflow="hidden"><rect width="960" height="913" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><title>标签窗口的成熟与右端未知区间</title><svg width="1440" height="840" viewBox="0 0 1320 770" role="img"><title>标签窗口的成熟与右端未知区间</title><rect width="1320" height="770" fill="#ffffff"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#186585" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#be622d" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#7c8fa2" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1c6c7f" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="180" y1="650" x2="1155" y2="650" stroke="#7c8fa2" stroke-width="2" marker-end="url(#g)"/><line x1="180" y1="642" x2="180" y2="659" stroke="#7c8fa2" stroke-width="2"/><text x="180" y="700" font-size="28" fill="#475b6c" text-anchor="middle" font-weight="400">0</text><line x1="330" y1="642" x2="330" y