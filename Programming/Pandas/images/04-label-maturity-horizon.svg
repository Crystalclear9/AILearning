ei, serif">已成熟</text><text x="40" y="360" font-size="30" fill="#243b4c" text-anchor="start" font-weight="400">预测 5</text><line x1="555" y1="340" x2="855" y2="340" stroke="#186585" stroke-width="38"/><circle cx="555" cy="340" r="8" fill="#243b4c" stroke="#243b4c" stroke-width="2"/><line x1="855" y1="305" x2="855" y2="375" stroke="#186585" stroke-width="3"/><text x="555" y="420" font-size="30" fill="#217296" text-anchor="start" font-weight="400">5 + 4 = 9</text><text x="1120" y="355" font-size="30" fill="#217296" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">已成熟</text><text x="40" y="540" font-size="30" fill="#243b4c" text-anchor="start" font-weight="400">预测 8</text><line x1="780" y1="520" x2="1080" y2="520" stroke="#be622d" stroke-width="38"/><circle cx="780" cy="520" r="8" fill="#243b4c" stroke="#243b4c" stroke-width="2"/><line x1="1080" y1="485" x2="1080" y2="555" stroke="#be622d" stroke-width="3"/><line x1="930" y1="520" x2="1080" y2="520" stroke="#f2ded1" stroke-width="38"/><line x1="930" y1="520" x2="1080" y2="520" stroke="#be622d" stroke-width="2.46" stroke-dasharray="6 7"/><text x="780" y="600" font-size="30" fill="#a65b30" text-anchor="start" font-weight="400">8 + 4 = 12</text><text x="1120" y="535" font-size="30" fill="#a65b30" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">后段未知</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 840) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">观察窗未结束：已见正例和未见事件具有不同的信息状态</text><text x="65" y="120" font-size="38.7px" fill="#213747" text-anchor="start">预测 t=8；标签窗 (8,12]；当前抽取 t=10</text><line x1="160" y1="220" x2="1210" y2="220" stroke="#7c8fa2" stroke-width="2" stroke-dasharray=""/><line x1="685" y1="155" x2="685" y2="320" stroke="#ae5f34" stroke-width="3" stroke-dasharray="8 6"/><circle cx="160" cy="220" r="7" fill="#1c6583" stroke="#1c6583" stroke-width="2"/><text x="160" y="265" font-size="33.32px" fill="#213747" text-anchor="middle">8</text><circle cx="685" cy="220" r="7" fill="#1c6583" stroke="#1c6583" stroke-width="2"/><text x="685" y="265" font-size="36.12px" fill="#213747" text-anchor="middle">10：抽取</text><circle cx="1210" cy="220" r="7" fill="#1c6583" stroke="#1c6583" stroke-width="2"/><text x="1210" y="265" font-size="36.12px" fill="#213747" text-anchor="middle">12：窗末</text><circle cx="422" cy="220" r="10" fill="#ae5f34" stroke="#ae5f34" stroke-width="2"/><text x="422" y="175" font-size="37.41px" fill="#a55f3a" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">已见一次购买</text><text x="65" y="350" font-size="34.83px" fill="#213747" text-anchor="start">若目标是“窗内至少一次购买”，该正例已确定为 1；未见购买仍不能定为 0。</text><text x="65" y="408" font-size="34.83px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">统一等待完整窗可保持一致入样政策；不能只提前收正例而把其余对象当负例。</text></g></g></g></g></g></svg></svg>