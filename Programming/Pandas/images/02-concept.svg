<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">一对多连接使金额重复</title><desc id="plateDesc">B 沿四条配对分别计算金额，合计从三十变成六十。C 只改变属性表中该用户的匹配数，就使结果行数从二变成四；若目标是每订单一行，需要先证明或检查属性键唯一，而不是事后把重复金额平均回来。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">一对多连接使金额重复</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">两条订单与两条属性形成四个配对</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">行数与金额同时对账</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">唯一性约束决定是否复制</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>一对多连接使金额重复</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">一对多连接使金额重复</text><rect x="35" y="125" width="98" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="47" y="157" font-size="22" fill="#16324f">订单</text><rect x="135" y="125" width="98" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="147" y="157" font-size="22" fill="#16324f">用户</text><rect x="235" y="125" width="98" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="247" y="157" font-size="22" fill="#16324f">金额</text><rect x="35" y="173" width="98" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="47" y="205" font-size="22" fill="#16324f">甲</text><rect x="135" y="173" width="98" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="147" y="205" font-size="22" fill="#16324f">u</text><rect x="235" y="173" width="98" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="247" y="205" font-size="22" fill="#16324f">10</text><rect x="35" y="221" width="98" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="47" y="253" font-size="22" fill="#16324f">乙</text><rect x="135" y="221" width="98" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="147" y="253" font-size="22" fill="#16324f">u</text><rect x="235" y="221" width="98" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="247" y="253" font-size="22" fill="#16324f">20</text><rect x="400" y="125" width="118" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="412" y="157" font-size="22" fill="#16324f">用户</text><rect x="520" y="125" width="118" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="532" y="157" font-size="22" fill="#16324f">属性</text><rect x="400" y="173" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="412" y="205" font-size="22" fill="#16324f">u</text><rect x="520" y="173" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="532" y="205" font-size="22" fill="#16324f">版本 A</text><rect x="400" y="221" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="412" y="253" font-size="22" fill="#16324f">u</text><rect x="520" y="221" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="532" y="253" font-size="22" fill="#16324f">版本 B</text><line x1="330" y1="245" x2="730" y2="320" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><line x1="640" y1="245" x2="730" y2="320" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><rect x="765" y="125" width="118" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="777" y="157" font-size="22" fill="#16324f">订单</text><rect x="885" y="125" width="118" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="897" y="157" font-size="22" fill="#16324f">属性</text><rect x="1005" y="125" width="118" height="46" rx="5" fill="#d0e5f6" stroke="#7393ac" /><text x="1017" y="157" font-size="22" fill="#16324f">金额</text><rect x="765" y="173" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="777" y="205" font-size="22" fill="#16324f">甲</text><rect x="885" y="173" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="897" y="205" font-size="22" fill="#16324f">A</text><rect x="1005" y="173" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="1017" y="205" font-size="22" fill="#16324f">10</text><rect x="765" y="221" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="777" y="253" font-size="22" fill="#16324f">甲</text><rect x="885" y="221" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="897" y="253" font-size="22" fill="#16324f">B</text><rect x="1005" y="221" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="1017" y="253" font-size="22" fill="#16324f">10</text><rect x="765" y="269" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="777" y="301" font-size="22" fill="#16324f">乙</text><rect x="885" y="269" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="897" y="301" font-size="22" fill="#16324f">A</text><rect x="1005" y="269" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="1017" y="301" font-size="22" fill="#16324f">20</text><rect x="765" y="317" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="777" y="349" font-size="22" fill="#16324f">乙</text><rect x="885" y="317" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="897" y="349" font-size="22" fill="#16324f">B</text><rect x="1005" y="317" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac" /><text x="1017" y="349" font-size="22" fill="#16324f">20</text><text x="45" y="440" font-size="23" fill="#16324f">原表：2 个订单，总额 30</text><text x="675" y="440" font-size="23" fill="#16324f">连接：4 行，总额 60</text><text x="45" y="510" font-size="26" fill="#16324f">同键匹配关系：2 条左记录 × 2 条右记录 = 4 个配对</text><text x="45" y="575" font-size="22" fill="#16324f">复制的是记录的携带金额；连接后每行不再等于一个独立订单。</text><text x="45" y="620" font-size="21" fill="#16324f">须先确定键的唯一性与版本规则，或重新定义展开后的汇总权重。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">订单金额</text><rect x="281" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="381.25" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 938.5) scale(0.7272727273 1) translate(-381.25 -938.5)">10</text><rect x="488.5" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="588.75" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 938.5) scale(0.7272727273 1) translate(-588.75 -938.5)">20</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">连接后金额</text><rect x="281" y="970" width="96.75" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="329.375" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(329.375 1008.5) scale(0.7272727273 1) translate(-329.375 -1008.5)">10</text><rect x="384.75" y="970" width="96.75" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="433.125" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(433.125 1008.5) scale(0.7272727273 1) translate(-433.125 -1008.5)">10</text><rect x="488.5" y="970" width="96.75" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="536.875" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(536.875 1008.5) scale(0.7272727273 1) translate(-536.875 -1008.5)">20</text><rect x="592.25" y="970" width="96.75" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="640.625" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(640.625 1008.5) scale(0.7272727273 1) translate(-640.625 -1008.5)">20</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">合计</text><rect x="281" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="381.25" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 1078.5) scale(0.7272727273 1) translate(-381.25 -1078.5)">原表 30</text><rect x="488.5" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="588.75" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 1078.5) scale(0.7272727273 1) translate(-588.75 -1078.5)">连接后 60</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">原表 2 行，连接结果 4 行</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1057.6) scale(0.7272727273 1) translate(-856 -1057.6)">1</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1024.2) scale(0.7272727273 1) translate(-856 -1024.2)">2</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 990.8) scale(0.7272727273 1) translate(-856 -990.8)">3</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 957.4) scale(0.7272727273 1) translate(-856 -957.4)">4</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" 