<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="655.48" viewBox="-18.24 28.76 996.48 655.48" role="img" aria-labelledby="artwork-title"><defs><linearGradient id="mechanism-wash-c" x1="0" x2=".94" y1="0" y2="1"><stop offset="0" stop-color="#fff6f3"/><stop offset="1" stop-color="#f1d4ca"/></linearGradient><linearGradient id="mechanism-wash-t" x1="0" x2=".94" y1="0" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cbe7e7"/></linearGradient></defs><title id="artwork-title">一对多连接使金额重复</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="568.75"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="655.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="619" viewBox="0 47 960 619" overflow="hidden"><rect width="960" height="666" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>重复键连接：每个格子是一对来源，不是一笔新订单</title><rect width="1440" height="900" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif">
<text x="55" y="65" font-size="41.934066px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">重复键连接：每个格子是一对来源，不是一笔新订单</text>
<text x="65" y="135" font-size="38.7px" fill="#277290" text-anchor="start">订单表：O1=(u,10)，O2=(u,20)</text>
<text x="65" y="185" font-size="38.7px" fill="#a55f3a" text-anchor="start">属性表：同一 u 对应 A、B 两行</text>
<text x="520" y="260" font-size="37.41px" fill="#a55f3a" text-anchor="middle">属性 A</text>
<text x="850" y="260" font-size="37.41px" fill="#a55f3a" text-anchor="middle">属性 B</text>
<text x="95" y="360" font-size="39.99px" fill="#277290" text-anchor="start">O1</text>
<text x="95" y="410" font-size="34.83px" fill="#277290" text-anchor="start">金额 10</text>
<rect x="370" y="300" width="300" height="135" rx="3" fill="url(#book-wash-edf5f8)" stroke="#1c6583" stroke-dasharray=""/>
<text x="520" y="344" font-size="38.7px" fill="#277290" text-anchor="middle">O1 × A</text>
<text x="520" y="394" font-size="37.41px" fill="#277290" text-anchor="middle">u，金额 10</text>
<rect x="700" y="300" width="300" height="135" rx="3" fill="url(#book-wash-edf5f8)" stroke="#1c6583" stroke-dasharray=""/>
<text x="850" y="344" font-size="38.7px" fill="#277290" text-anchor="middle">O1 × B</text>
<text x="850" y="394" font-size="37.41px" fill="#277290" text-anchor="middle">u，金额 10</text>
<text x="1110" y="375" font-size="39.99px" fill="#a55f3a" text-anchor="middle">10 × 2 = 20</text>
<text x="95" y="530" font-size="39.99px" fill="#277290" text-anchor="start">O2</text>
<text x="95" y="580" font-size="34.83px" fill="#277290" text-anchor="start">金额 20</text>
<rect x="370" y="470" width="300" height="135" rx="3" fill="url(#book-wash-edf5f8)" stroke="#1c6583" stroke-dasharray=""/>
<text x="520" y="514" font-size="38.7px" fill="#277290" text-anchor="middle">O2 × A</text>
<text x="520" y="564" font-size="37.41px" fill="#277290" text-anchor="middle">u，金额 20</text>
<rect x="700" y="470" width="300" height="135" rx="3" fill="url(#book-wash-edf5f8)" stroke="#1c6583" stroke-dasharray=""/>
<text x="850" y="514" font-size="38.7px" fill="#277290" text-anchor="middle">O2 × B</text>
<text x="850" y="564" font-size="37.41px" fill="#277290" text-anchor="middle">u，金额 20</text>
<text x="1110" y="545" font-size="39.99px" fill="#a55f3a" text-anchor="middle">20 × 2 = 40</text>
<text x="370" y="660" font-size="37.41px" fill="#277290" text-anchor="start">连接前：10 + 20 = 30</text>
<text x="865" y="660" font-size="37.41px" fill="#a55f3a" text-anchor="start">连接后：20 + 40 = 60</text>
<line x1="60" y1="700" x2="1380" y2="700" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/>
<text x="60" y="760" font-size="37.41px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">先按用户聚合，仍未解决右表重复：</text>
<path d="M77.2000 790 H307.2000 L292.8000 850 H62.8000 Z" fill="url(#mechanism-wash-t)" stroke="#196d75" stroke-width="1.85" stroke-linejoin="round"/>
<text x="185" y="830" font-size="37.41px" fill="#277290" text-anchor="middle">u：30</text>
<line x1="310" y1="820" x2="470" y2="820" stroke="#76889b" stroke-width="2" stroke-dasharray=""/>
<polyline fill="none" stroke="#76889b" stroke-width="2" points="458.95,824.67 470,820 458.95,815.33"/>
<path d="M497.2000 790 H742.2000 L729.0000 845 H484.0000 Z" fill="url(#mechanism-wash-c)" stroke="#a74838" stroke-width="1.85" stroke-linejoin="round"/>
<text x="612.5" y="826" font-size="34.83px" fill="#a55f3a" text-anchor="middle">u,A:30</text>
<path d="M751.6000 790 H996.6000 L983.4000 845 H738.4000 Z" fill="url(#mechanism-wash-c)" stroke="#a74838" stroke-width="1.85" stroke-linejoin="round"/>
<text x="867.5" y="826" font-size="34.83px" fill="#a55f3a" text-anchor="middle">u,B:30</text>
<text x="1050" y="830" font-size="37.41px" fill="#a55f3a" text-anchor="start">30 + 30 = 60</text>
</g></g></g></g></svg></svg>
