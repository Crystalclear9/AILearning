e="22" fill="#16324f">B</text><rect x="1005" y="221" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="1017" y="253" font-size="22" fill="#16324f">10</text><rect x="765" y="269" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="777" y="301" font-size="22" fill="#16324f">乙</text><rect x="885" y="269" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="897" y="301" font-size="22" fill="#16324f">A</text><rect x="1005" y="269" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="1017" y="301" font-size="22" fill="#16324f">20</text><rect x="765" y="317" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="777" y="349" font-size="22" fill="#16324f">乙</text><rect x="885" y="317" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="897" y="349" font-size="22" fill="#16324f">B</text><rect x="1005" y="317" width="118" height="46" rx="5" fill="#f2f7fb" stroke="#7393ac"/><text x="1017" y="349" font-size="22" fill="#16324f">20</text><text x="45" y="440" font-size="23" fill="#16324f">原表：2 个订单，总额 30</text><text x="675" y="440" font-size="23" fill="#16324f">连接：4 行，总额 60</text><text x="45" y="510" font-size="26" fill="#16324f">同键匹配关系：2 条左记录 × 2 条右记录 = 4 个配对</text><text x="45" y="575" font-size="22" fill="#16324f">复制的是记录的携带金额；连接后每行不再等于一个独立订单。</text><text x="45" y="620" font-size="21" fill="#16324f">须先确定键的唯一性与版本规则，或重新定义展开后的汇总权重。</text></g></svg>