<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="480.655059" viewBox="-18.24 129.580329 996.48 480.655059" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">同时间戳不能自动建立因果顺序</title><desc id="artwork-desc">两条记录同刻评分，文件先后不能赋予额外历史 若服务确实逐条提交，必须另有可靠序号或更细时钟证明可见顺序。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="494.370546"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="581.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="545" viewBox="0 47 960 545" overflow="hidden"><rect width="960" height="592" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 29.507607) scale(0.726682)"><g><rect width="1252.267" height="680.312" fill="#ffffff" x="13.867" y="63.979"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#1c4c64"><path d="M80 225 H610" stroke="#728f9e" stroke-width="2"/><path d="M140 216 V234" stroke="#728f9e" stroke-width="2"/><text x="130" y="200" font-size="32.13px" fill="#1d4158">9</text><path d="M350 216 V234" stroke="#728f9e" stroke-width="2"/><text x="340" y="200" font-size="32.13px" fill="#1d4158">10</text><path d="M560 216 V234" stroke="#728f9e" stroke-width="2"/><text x="550" y="200" font-size="32.13px" fill="#1d4158">11</text><path d="M350 240 V545" stroke="#b7612e" stroke-width="3" stroke-dasharray="8 7"/><circle cx="140" cy="295" r="12" fill="#1f7eac"/><text x="162" y="304" font-size="36.12px" fill="#287aaa">A：金额 5</text><circle cx="350" cy="380" r="12" fill="#b7612e"/><text x="372" y="389" font-size="36.12px" fill="#9e5a30">B：金额 10</text><circle cx="350" cy="465" r="12" fill="#b7612e"/><text x="372" y="474" font-size="36.12px" fill="#9e5a30">C：金额 20</text><text x="90" y="582" font-size="36.12px" fill="#9e5a30">B 与 C 位于同一时间边界</text><text x="710" y="195" font-size="36.467116px" fill="#1d4158" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">历史金额和</text><text x="730" y="273" font-size="36.467116px" fill="#1d4158" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">评分记录</text><text x="920" y="273" font-size="36.467116px" fill="#1d4158">B</text><text x="1110" y="273" font-size="36.467116px" fill="#1d4158">C</text><path d="M700 300 H1235" stroke="#dde5eb" stroke-width="2"/><text x="710" y="363" font-size="32.48px" fill="#1b737e" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">整批严格过去</text><text x="925" y="363" font-size="36.467116px" fill="#1b737e">5</text><text x="1110" y="363" font-size="36.467116px" fill="#1b737e">5</text><text x="710" y="448" font-size="32.48px" fill="#9e5a30" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">按行累计后移</text><text x="925" y="448" font-size="36.467116px" fill="#9e5a30">5</text><text x="1110" y="448" font-size="36.467116px" fill="#9e5a30">15</text><text x="710" y="532" font-size="36.467116px" fill="#9e5a30">15 = A 的 5 + B 的 10</text><text x="710" y="582" font-size="36.12px" fill="#9e5a30">C 错误看到同刻 B</text><path d="M40 650 H1240" stroke="#dde5eb" stroke-width="2"/><text x="40" y="715" font-size="36.12px" fill="#1d4158">交换 B、C 的物理行序，严格历史仍都是 5；按行结果会随顺序改变。</text></g><desc> 两条记录同刻评分，文件先后不能赋予额外历史 若服务确实逐条提交，必须另有可靠序号或更细时钟证明可见顺序。</desc></g></g></g></svg></svg>
