<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="592" viewBox="0 0 960 592" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">同时间戳不能自动建立因果顺序</title><desc id="artwork-desc">两条记录同刻评分，文件先后不能赋予额外历史 若服务确实逐条提交，必须另有可靠序号或更细时钟证明可见顺序。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="494.370546"/></clipPath></defs><rect width="960" height="592" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">同时间戳不能自动建立因果顺序</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 29.507607) scale(0.726682)"><g><rect width="1252.267" height="680.312" fill="white" x="13.867" y="63.979"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#154866"><text x="40" y="112" font-size="34.83px" fill="#4a718f">同一实体、整批在 t=10 评分；严格历史只允许事件时间小于 10</text><path d="M80 225 H610" stroke="#7690a0" stroke-width="2"/><path d="M140 216 V234" stroke="#7690a0" stroke-width="2"/><text x="130" y="200" font-size="32.13px" fill="#173c58">9</text><path d="M350 216 V234" stroke="#7690a0" stroke-width="2"/><text x="340" y="200" font-size="32.13px" fill="#173c58">10</text><path d="M560 216 V234" stroke="#7690a0" stroke-width="2"/><text x="550" y="200" font-size="32.13px" fill="#173c58">11</text><path d="M350 240 V545" stroke="#c66422" stroke-width="3" stroke-dasharray="8 7"/><circle cx="140" cy="295" r="12" fill="#127eba"/><text x="162" y="304" font-size="36.12px" fill="#1d77b7">A：金额 5</text><circle cx="350" cy="380" r="12" fill="#c66422"/><text x="372" y="389" font-size="36.12px" fill="#a85d27">B：金额 10</text><circle cx="350" cy="465" r="12" fill="#c66422"/><text x="372" y="474" font-size="36.12px" fill="#a85d27">C：金额 20</text><text x="90" y="582" font-size="36.12px" fill="#a85d27">B 与 C 位于同一时间边界</text><text x="710" y="195" font-size="36.467116px" fill="#173c58">历史金额和</text><text x="730" y="273" font-size="36.467116px" fill="#173c58">评分记录</text><text x="920" y="273" font-size="36.467116px" fill="#173c58">B</text><text x="1110" y="273" font-size="36.467116px" fill="#173c58">C</text><path d="M700 300 H1235" stroke="#d9e1e8" stroke-width="2"/><text x="710" y="363" font-size="32.48px" fill="#127f84">整批严格过去</text><text x="925" y="363" font-size="36.467116px" fill="#127f84">5</text><text x="1110" y="363" font-size="36.467116px" fill="#127f84">5</text><text x="710" y="448" font-size="32.48px" fill="#a85d27">按行累计后移</text><text x="925" y="448" font-size="36.467116px" fill="#a85d27">5</text><text x="1110" y="448" font-size="36.467116px" fill="#a85d27">15</text><text x="710" y="532" font-size="36.467116px" fill="#a85d27">15 = A 的 5 + B 的 10</text><text x="710" y="582" font-size="36.12px" fill="#a85d27">C 错误看到同刻 B</text><path d="M40 650 H1240" stroke="#d9e1e8" stroke-width="2"/><text x="40" y="715" font-size="36.12px" fill="#173c58">交换 B、C 的物理行序，严格历史仍都是 5；按行结果会随顺序改变。</text></g><desc> 两条记录同刻评分，文件先后不能赋予额外历史 若服务确实逐条提交，必须另有可靠序号或更细时钟证明可见顺序。</desc></g></g></g></svg>