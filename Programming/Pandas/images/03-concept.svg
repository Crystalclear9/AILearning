<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">事件时间与可用时间的双重边界</title><desc id="plateDesc">B 将同一条记录的两个时间条件分开判断。C 假设只有这一条候选事件，仅按发生时间会把它计为一，按当时可用性应为零。图例只用于说明迟到事件，不替代完整窗口的端点、撤销与版本处理规则。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">事件时间与可用时间的双重边界</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">事件发生与系统可见是两条时间边界</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">逐条件判定预测时可用性</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">忽略到达时间会泄漏</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 590.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>事件时间与可用时间的双重边界</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">事件时间与可用时间的双重边界</text><line x1="90" y1="250" x2="1110" y2="250" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><line x1="180" y1="200" x2="180" y2="285" stroke="#8bb8dc" stroke-width="3" /><text x="120" y="175" font-size="30" fill="#16324f">08:00</text><text x="105" y="330" font-size="24" fill="#16324f">事件发生</text><line x1="580" y1="200" x2="580" y2="285" stroke="#d39874" stroke-width="3" /><text x="520" y="175" font-size="30" fill="#16324f">09:00</text><text x="505" y="330" font-size="24" fill="#16324f">预测决策</text><line x1="980" y1="200" x2="980" y2="285" stroke="#88b39c" stroke-width="3" /><text x="920" y="175" font-size="30" fill="#16324f">10:00</text><text x="905" y="330" font-size="24" fill="#16324f">记录到达</text><rect x="95" y="385" width="450" height="120" rx="5" fill="#e7f4eb" stroke="#7393ac" /><text x="115" y="425" font-size="23" fill="#16324f">事件时间条件：满足</text><text x="115" y="470" font-size="23" fill="#16324f">08:00 早于 09:00</text><rect x="635" y="385" width="480" height="120" rx="5" fill="#fff0e9" stroke="#7393ac" /><text x="655" y="425" font-size="23" fill="#16324f">可用时间条件：不满足</text><text x="655" y="470" font-size="23" fill="#16324f">10:00 晚于 09:00</text><text x="95" y="565" font-size="23" fill="#16324f">只有两个边界同时满足，记录才可进入该次预测的历史特征。</text><text x="95" y="615" font-size="21" fill="#16324f">有修订时，先恢复当时可见版本，再按业务时间选择窗口。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 923) scale(0.7272727273 1) translate(-105 -923)">条件</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 923) scale(0.7272727273 1) translate(-305 -923)">实际值</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 923) scale(0.7272727273 1) translate(-505 -923)">结果</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 978) scale(0.7272727273 1) translate(-105 -978)">事件时间 &lt; 09:00</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 978) scale(0.7272727273 1) translate(-305 -978)">08:00</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 978) scale(0.7272727273 1) translate(-505 -978)">满足</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 1036) scale(0.7272727273 1) translate(-105 -1036)">到达时间 ≤09:00</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 1036) scale(0.7272727273 1) translate(-305 -1036)">10:00</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 1036) scale(0.7272727273 1) translate(-505 -1036)">不满足</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1150) scale(0.7272727273 1) translate(-96 -1150)">两项条件须同时成立</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1057.6) scale(0.7272727273 1) translate(-856 -1057.6)">0.25</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1024.2) scale(0.7272727273 1) translate(-856 -1024.2)">0.5</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 990.8) scale(0.7272727273 1) translate(-856 -990.8)">0.75</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 957.4) scale(0.7272727273 1) translate(-856 -957.4)">1</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 924) scale(0.7272727273 1) translate(-856 -924)">1.25</text><text x="994.75" y="1075" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(994.75 1075) scale(0.7272727273 1) translate(-994.75 -1075)">0</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(869 1113) scale(0.7272727273 1) translate(-869 -1113)">正确可用事件数</text><rect x="1209.25" y="951.4" width="86" height="133.6" rx="3" fill="#d17c3e" stroke="#d17c3e" /><text x="1252.25" y="941.4" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1252.25 941.4) scale(0.7272727273 1) translate(-1252.25 -941.4)">1</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1126.5 1113) scale(0.7272727273 1) translate(-1126.5 -1113)">只看发生时间</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1153) scale(0.7272727273 1) translate(-806 -1153)">仅考虑图中这一条迟到事件</text></g></svg>
