<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>事件时间与可用时间的双重边界</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><rect width="1200" height="680" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">事件时间与可用时间的双重边界</text><line x1="90" y1="250" x2="1110" y2="250" stroke="#6887a0" stroke-width="3" marker-end="url(#tip-6887a0)" /><line x1="180" y1="200" x2="180" y2="285" stroke="#8bb8dc" stroke-width="3" /><text x="120" y="175" font-size="30" fill="#16324f">08:00</text><text x="105" y="330" font-size="24" fill="#16324f">事件发生</text><line x1="580" y1="200" x2="580" y2="285" stroke="#d39874" stroke-width="3" /><text x="520" y="175" font-size="30" fill="#16324f">09:00</text><text x="505" y="330" font-size="24" fill="#16324f">预测决策</text><line x1="980" y1="200" x2="980" y2="285" stroke="#88b39c" stroke-width="3" /><text x="920" y="175" font-size="30" fill="#16324f">10:00</text><text x="905" y="330" font-size="24" fill="#16324f">记录到达</text><rect x="95" y="385" width="450" height="120" rx="5" fill="#e7f4eb" stroke="#7393ac" /><text x="115" y="425" font-size="23" fill="#16324f">事件时间条件：满足</text><text x="115" y="470" font-size="23" fill="#16324f">08:00 早于 09:00</text><rect x="635" y="385" width="480" height="120" rx="5" fill="#fff0e9" stroke="#7393ac" /><text x="655" y="425" font-size="23" fill="#16324f">可用时间条件：不满足</text><text x="655" y="470" font-size="23" fill="#16324f">10:00 晚于 09:00</text><text x="95" y="565" font-size="23" fill="#16324f">只有两个边界同时满足，记录才可进入该次预测的历史特征。</text><text x="95" y="615" font-size="21" fill="#16324f">有修订时，先恢复当时可见版本，再按业务时间选择窗口。</text></g></svg>
