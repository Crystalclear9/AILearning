<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">事件时间与可用时间的双重边界</title><desc id="plateDesc">B 将同一条记录的两个时间条件分开判断。C 假设只有这一条候选事件，仅按发生时间会把它计为一，按当时可用性应为零。图例只用于说明迟到事件，不替代完整窗口的端点、撤销与版本处理规则。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">事件时间与可用时间的双重边界</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Pandas</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">事件发生与系统可见是两条时间边界</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">逐条件判定预测时可用性</text><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">条件</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">实际值</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">结果</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">事件时间 &lt; 09:00</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">08:00</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">满足</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">到达时间 ≤09:00</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">10:00</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">不满足</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">两项条件须同时成立</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">忽略到达时间会泄漏</text><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0.25</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0.5</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0.75</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1.25</text><text x="994.75" y="1075" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">0</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">正确可用事件数</text><rect x="1209.25" y="951.4" width="86" height="133.6" rx="3" fill="#d17c3e" stroke="#d17c3e"/><text x="1252.25" y="941.4" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">1</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">只看发生时间</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">仅考虑图中这一条迟到事件</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 590.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>事件时间与可用时间的双重边界</title><defs><marker id="panelA-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6887a0" /></marker><marker id="panelA-tip-6887a0" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#6887a0" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="48" font-size="31" fill="#16324f">事件时间与可用时间的双重边界</text><line x1="90" y1="250" x2="1110" y2="250" stroke="#6887a0" stroke-width="3" marker-end="url(#panelA-tip-6887a0)" /><line x1="180" y1="200" x2="180" y2="285" stroke="#8bb8dc" stroke-width="3" /><text x="120" y="175" font-size="30" fill="#16324f">08:00</text><text x="105" y="330" font-size="24" fill="#16324f">事件发生</text><line x1="580" y1="200" x2="580" y2="285" stroke="#d39874" stroke-width="3" /><text x="520" y="175" font-size="30" fill="#16324f">09:00</text><text x="505" y="330" font-size="24" fill="#16324f">预测决策</text><line x1="980" y1="200" x2="980" y2="285" stroke="#88b39c" stroke-width="3" /><text x="920" y="175" font-size="30" fill="#16324f">10:00</text><text x="905" y="330" font-size="24" fill="#16324f">记录到达</text><rect x="95" y="385" width="450" height="120" rx="5" fill="#e7f4eb" stroke="#7393ac" /><text x="115" y="425" font-size="23" fill="#16324f">事件时间条件：满足</text><text x="115" y="470" font-size="23" fill="#16324f">08:00 早于 09:00</text><rect x="635" y="385" width="480" height="120" rx="5" fill="#fff0e9" stroke="#7393ac" /><text x="655" y="425" font-size="23" fill="#16324f">可用时间条件：不满足</text><text x="655" y="470" font-size="23" fill="#16324f">10:00 晚于 09:00</text><text x="95" y="565" font-size="23" fill="#16324f">只有两个边界同时满足，记录才可进入该次预测的历史特征。</text><text x="95" y="615" font-size="21" fill="#16324f">有修订时，先恢复当时可见版本，再按业务时间选择窗口。</text></g></svg></svg>
