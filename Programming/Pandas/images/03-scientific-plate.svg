    <circle cx="221.33333" cy="252.66667" r="8" fill="#b95140" stroke="white" stroke-width="2.4" />
    <text x="237.33333" y="240.66667" font-size="28" fill="#b95140" text-anchor="start" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">A</text>
    <circle cx="314.66667" cy="392.66667" r="8" fill="#18798a" stroke="white" stroke-width="2.4" />
    <text x="330.66667" y="380.66667" font-size="28" fill="#18798a" text-anchor="start" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">B</text>
    <circle cx="594.66667" cy="159.33333" r="8" fill="#65608e" stroke="white" stroke-width="2.4" />
    <text x="610.66667" y="147.33333" font-size="28" fill="#65608e" text-anchor="start" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">C</text>
    <text x="824" y="163" font-size="35" fill="#172235" text-anchor="start" font-weight="400">在时刻 6 决策</text>
    <circle cx="839" cy="243" r="7" fill="#b95140" stroke="white" stroke-width="2.4" />
    <text x="862" y="252" font-size="29" fill="#b95140" text-anchor="start" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">A</text>
    <text x="906" y="252" font-size="28" fill="#172235" text-anchor="start" font-weight="400">已经发生，尚不可用</text>
    <circle cx="839" cy="336" r="7" fill="#18798a" stroke="white" stroke-width="2.4" />
    <text x="862" y="345" font-size="29" fill="#18798a" text-anchor="start" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">B</text>
    <text x="906" y="345" font-size="28" fill="#172235" text-anchor="start" font-weight="400">已经发生，也已可用</text>
    <circle cx="839" cy="429" r="7" fill="#65608e" stroke="white" stroke-width="2.4" />
    <text x="862" y="438" font-size="29" fill="#65608e" text-anchor="start" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">C</text>
    <text x="906" y="438" font-size="28" fill="#172235" text-anchor="start" font-weight="400">事件还没有发生</text>
