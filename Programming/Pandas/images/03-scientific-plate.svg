    <line x1="163" y1="252.66667" x2="170" y2="252.66667" stroke="#172235" stroke-width="1.5" stroke-linecap="round" />
    <text x="157" y="259.66667" font-size="25" fill="#4c5b6a" text-anchor="end" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">7</text>
