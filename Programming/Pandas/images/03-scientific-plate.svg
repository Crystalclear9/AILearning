<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="665" viewBox="0 0 1320 665" role="img" aria-labelledby="title description">
  <title id="title">事件发生与数据可用是两道门</title>
  <desc id="description">横轴为事件时间，纵轴为可用时间。只有 B 的两个时间都严格早于 6。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L11 6 L0 12 L2.5 6 Z" fill="#172235" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L11 6 L0 12 L2.5 6 Z" fill="#18798a" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L11 6 L0 12 L2.5 6 Z" fill="#b95140" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L11 6 L0 12 L2.5 6 Z" fill="#65608e" />
    </marker>
    <linearGradient id="wash-cyan" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#83cdd2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#83cdd2" stop-opacity="0.48" />
    </linearGradient>
    <linearGradient id="wash-red" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f2a49b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f2a49b" stop-opacity="0.48" />
    </linearGradient>
    <linearGradient id="wash-violet" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#b4aacd" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#b4aacd" stop-opacity="0.48" />
    </linearGradient>
    <clipPath id="plot-1">
      <rect x="169" y="107" width="478" height="478" />
    </clipPath>
  </defs>
  <rect width="1320" height="665" fill="#ffffff" />
  <g font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">
