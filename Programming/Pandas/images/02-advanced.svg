<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="657" viewBox="0 47 960 657" role="img" aria-labelledby="artwork-title"><title id="artwork-title">先聚合再连接需要唯一性条件</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="606.666667"/></clipPath></defs><rect width="960" height="704" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.606667)"><g><defs><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e5"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>先聚合再连接不能消除维度多值造成的事实复制</title><rect width="1500" height="1000" fill="white"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#0b6690" stroke-width="2"/></marker><marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#137286" stroke-width="2"/></marker><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ce6521" stroke-width="2"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="39.99px" fill="#20354a" text-anchor="start">同一订单事实：O1=(u,10)，O2=(u,20)，O3=(v,5)</text><text x="55" y="155" font-size="39.99px" fill="#1672a0" text-anchor="start">按用户求和</text><text x="65" y="259" font-size="41.28px" fill="#20354a" text-anchor="start">u</text><rect x="130" y="215" width="95" height="70" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2" rx="4"/><text x="177" y="261" font-size="35.7px" fill="#1672a0" text-anchor="middle">10</text><rect x="240" y="215" width="95" height="70" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2" rx="4"/><text x="287" y="261" font-size="35.7px" fill="#1672a0" text-anchor="middle">20</text><line x1="390" y1="250" x2="500" y2="250" stroke="#0b6690" stroke-width="2" marker-end="url(#b)"/><rect x="530" y="215" width="205" height="70" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2" rx="4"/><text x="632" y="261" font-size="38.7px" fill="#1672a0" text-anchor="middle">u：30</text><text x="65" y="399" font-size="41.28px" fill="#20354a" text-anchor="start">v</text><rect x="130" y="355" width="95" height="70" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2" rx="4"/><text x="177" y="401" font-size="35.7px" fill="#1672a0" text-anchor="middle">5</text><line x1="390" y1="390" x2="500" y2="390" stroke="#0b6690" stroke-width="2" marker-end="url(#b)"/><rect x="530" y="355" width="205" height="70" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2" rx="4"/><text x="632" y="401" font-size="38.7px" fill="#1672a0" text-anchor="middle">v：5</text><text x="870" y="155" font-size="38.7px" fill="#197b7e" text-anchor="start">唯一属性 u→A，v→B</text><rect x="900" y="215" width="420" height="70" fill="#edf7f3" stroke="#137286" stroke-width="2" rx="4"/><text x="1110" y="261" font-size="39.99px" fill="#197b7e" text-anchor="middle">u, A, 30</text><rect x="900" y="355" width="420" height="70" fill="#edf7f3" stroke="#137286" stroke-width="2" rx="4"/><text x="1110" y="401" font-size="39.99px" fill="#197b7e" text-anchor="middle">v, B, 5</text><line x1="755" y1="250" x2="880" y2="250" stroke="#137286" stroke-width="2" marker-end="url(#t)"/><line x1="755" y1="390" x2="880" y2="390" stroke="#137286" stroke-width="2" marker-end="url(#t)"/><text x="1090" y="485" font-size="39.99px" fill="#197b7e" text-anchor="middle">结果：2 行，总额 35</text><line x1="55" y1="535" x2="1440" y2="535" stroke="#d9e1e8" stroke-width="2"/><text x="55" y="610" font-size="39.99px" fill="#b15e27" text-anchor="start">若属性表把 u 同时配到 A 与 C</text><rect x="80" y="665" width="250" height="80" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2" rx="4"/><text x="205" y="716" font-size="38.7px" fill="#1672a0" text-anchor="middle">u 的汇总 30</text><rect x="650" y="640" width="350" height="75" fill="url(#book-wash-fff1e5)" stroke="#ce6521" stroke-width="2" rx="4"/><text x="825" y="689" font-size="38.7px" fill="#b15e27" text-anchor="middle">u, A, 30</text><line x1="350" y1="705" x2="630" y2="677" stroke="#ce6521" stroke-width="2" marker-end="url(#a)"/><rect x="650" y="760" width="350" height="75" fill="url(#book-wash-fff1e5)" stroke="#ce6521" stroke-width="2" rx="4"/><text x="825" y="809" font-size="38.7px" fill="#b15e27" text-anchor="middle">u, C, 30</text><line x1="350" y1="705" x2="630" y2="797" stroke="#ce6521" stroke-width="2" marker-end="url(#a)"/><rect x="650" y="880" width="350" height="75" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2" rx="4"/><text x="825" y="929" font-size="38.7px" fill="#1672a0" text-anchor="middle">v, B, 5</text><text x="1080" y="720" font-size="39.99px" fill="#b15e27" text-anchor="start">30 + 30 + 5 = 65</text><text x="1080" y="785" font-size="38.7px" fill="#b15e27" text-anchor="start">先聚合也会复制</text><text x="55" y="930" font-size="37.41px" fill="#20354a" text-anchor="start">关系约束先成立，</text><text x="55" y="970" font-size="37.41px" fill="#20354a" text-anchor="start">总额守恒才有依据。</text></g></g></g></g></svg>