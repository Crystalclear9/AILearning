<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">两方案组内甲均占优，但甲以困难组为主导致总体通过率较低；统一权重后甲重新占优</title><desc id="artwork-desc">每组都更高，总体却更低：变化的是群体权重 ≈ 84.55%</desc><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="604.420735"/></clipPath></defs><rect width="960" height="740" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">两方案组内甲均占优，但甲以困难组为主导致总体通过率较低；</text><text x="25" y="79" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">统一权重后甲重新占优</text><line x1="25" x2="935" y1="97" y2="97" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 68.280796) scale(0.726682)"><g><rect width="1252.267" height="831.754" fill="white" x="13.867" y="62.915"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#154866"><text x="40" y="110" font-size="33.54px" fill="#4a718f">矩形总面积都代表 110 人；分区宽度表示人数，绿色高度表示组内通过率</text><text x="80" y="185" font-size="36.467116px" fill="#173c58">甲：容易 10 人，困难 100 人</text><rect x="80" y="245" width="40.0" height="275" fill="#f2f5f7"/><rect x="80" y="245" width="40.0" height="275" fill="#148f94" opacity=".65"/><rect x="80" y="245" width="40.0" height="275" fill="none" stroke="#127eba" stroke-width="4"/><rect x="120.0" y="245" width="400.0" height="275" fill="#f2f5f7"/><rect x="120.0" y="434.75" width="400.0" height="85.25" fill="#148f94" opacity=".65"/><rect x="120.0" y="245" width="400.0" height="275" fill="none" stroke="#c66422" stroke-width="4"/><text x="80" y="575" font-size="36.12px" fill="#173c58">容易组：100%  ·  困难组：31%</text><text x="80" y="635" font-size="36.467116px" fill="#127f84">总体：</text><text x="730" y="185" font-size="36.467116px" fill="#173c58">乙：容易 100 人，困难 10 人</text><rect x="730" y="245" width="400.0" height="275" fill="#f2f5f7"/><rect x="730" y="272.5" width="400.0" height="247.5" fill="#148f94" opacity=".65"/><rect x="730" y="245" width="400.0" height="275" fill="none" stroke="#127eba" stroke-width="4"/><rect x="1130.0" y="245" width="40.0" height="275" fill="#f2f5f7"/><rect x="1130.0" y="437.5" width="40.0" height="82.5" fill="#148f94" opacity=".65"/><rect x="1130.0" y="245" width="40.0" height="275" fill="none" stroke="#c66422" stroke-width="4"/><text x="730" y="575" font-size="36.12px" fill="#173c58">容易组：90%  ·  困难组：30%</text><text x="730" y="635" font-size="36.467116px" fill="#127f84">总体：</text><path d="M40 690 H1240" stroke="#d9e1e8" stroke-width="2"/><text x="40" y="748" font-size="36.467116px" fill="#173c58">共同改为容易、困难各占一半：</text><text x="60" y="809" font-size="36.467116px" fill="#1d77b7">甲：65.5%      乙：60.0%</text><text x="60" y="865" font-size="36.12px" fill="#173c58">相同非负权重下，组内全面占优不会反转；分组仍不自动证明因果。</text><text x="205" y="612" font-size="33.32px">41</text><path d="M191 624 H260" stroke="#154866" stroke-width="2.46"/><text x="195" y="657" font-size="33.32px">110</text><text x="282" y="640" font-size="36.467116px" fill="#127f84">≈ 37.27%</text><text x="855" y="612" font-size="33.32px">93</text><path d="M841 624 H910" stroke="#154866" stroke-width="2.46"/><text x="845" y="657" font-size="33.32px">110</text><text x="932" y="640" font-size="36.467116px" fill="#127f84">≈ 84.55%</text></g><desc> 每组都更高，总体却更低：变化的是群体权重 ≈ 84.55%</desc></g></g></g></svg>