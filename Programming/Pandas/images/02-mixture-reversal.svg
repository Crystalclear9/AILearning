<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="691.48" viewBox="-18.24 66.76 996.48 691.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">两方案组内甲均占优，但甲以困难组为主导致总体通过率较低；统一权重后甲重新占优</title><desc id="artwork-desc">每组都更高，总体却更低：变化的是群体权重 ≈ 84.55%</desc><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="604.420735"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="66.76" width="996.48" height="691.48" fill="#ffffff"/><svg id="edition-view" x="0" y="85" width="960" height="655" viewBox="0 85 960 655" overflow="hidden"><rect width="960" height="740" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 68.280796) scale(0.726682)"><g><rect width="1252.267" height="831.754" fill="#ffffff" x="13.867" y="62.915"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#1c4c64"><text x="40" y="110" font-size="33.54px" fill="#4c738b">矩形总面积都代表 110 人；分区宽度表示人数，绿色高度表示组内通过率</text><text x="80" y="185" font-size="36.467116px" fill="#1d4158">甲：容易 10 人，困难 100 人</text><rect x="80" y="245" width="40.0" height="275" fill="#f3f6f8"/><rect x="80" y="245" width="40.0" height="275" fill="#1e818b" opacity=".65"/><rect x="80" y="245" width="40.0" height="275" fill="none" stroke="#1f7eac" stroke-width="4"/><rect x="120.0" y="245" width="400.0" height="275" fill="#f3f6f8"/><rect x="120.0" y="434.75" width="400.0" height="85.25" fill="#1e818b" opacity=".65"/><rect x="120.0" y="245" width="400.0" height="275" fill="none" stroke="#b7612e" stroke-width="4"/><text x="80" y="575" font-size="36.12px" fill="#1d4158">容易组：100%  ·  困难组：31%</text><text x="80" y="635" font-size="36.467116px" fill="#1b737e" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">总体：</text><text x="730" y="185" font-size="36.467116px" fill="#1d4158">乙：容易 100 人，困难 10 人</text><rect x="730" y="245" width="400.0" height="275" fill="#f3f6f8"/><rect x="730" y="272.5" width="400.0" height="247.5" fill="#1e818b" opacity=".65"/><rect x="730" y="245" width="400.0" height="275" fill="none" stroke="#1f7eac" stroke-width="4"/><rect x="1130.0" y="245" width="40.0" height="275" fill="#f3f6f8"/><rect x="1130.0" y="437.5" width="40.0" height="82.5" fill="#1e818b" opacity=".65"/><rect x="1130.0" y="245" width="40.0" height="275" fill="none" stroke="#b7612e" stroke-width="4"/><text x="730" y="575" font-size="36.12px" fill="#1d4158">容易组：90%  ·  困难组：30%</text><text x="730" y="635" font-size="36.467116px" fill="#1b737e" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">总体：</text><path d="M40 690 H1240" stroke="#dde5eb" stroke-width="2"/><text x="40" y="748" font-size="36.467116px" fill="#1d4158" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">共同改为容易、困难各占一半：</text><text x="60" y="809" font-size="36.467116px" fill="#287aaa">甲：65.5%      乙：60.0%</text><text x="60" y="865" font-size="36.12px" fill="#1d4158" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">相同非负权重下，组内全面占优不会反转；分组仍不自动证明因果。</text><text x="205" y="612" font-size="33.32px">41</text><path d="M191 624 H260" stroke="#1c4c64" stroke-width="2.46"/><text x="195" y="657" font-size="33.32px">110</text><text x="282" y="640" font-size="36.467116px" fill="#1b737e">≈ 37.27%</text><text x="855" y="612" font-size="33.32px">93</text><path d="M841 624 H910" stroke="#1c4c64" stroke-width="2.46"/><text x="845" y="657" font-size="33.32px">110</text><text x="932" y="640" font-size="36.467116px" fill="#1b737e">≈ 84.55%</text></g><desc> 每组都更高，总体却更低：变化的是群体权重 ≈ 84.55%</desc></g></g></g></svg></svg>