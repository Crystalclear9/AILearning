<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>填充位置与有效损失分母</title>
<desc>原创教学示意：样本 A|长度 4：实 实 实 实;样本 B|长度 2：实 实 填 填;有效位置|总共 6 个;token 平均|有效损失之和除以 6</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">填充位置与有效损失分母</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">样本 A</text>
<text x="53" y="160" font-size="21" fill="#16324f">长度 4：实 实 实 实</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">样本 B</text>
<text x="603" y="160" font-size="21" fill="#16324f">长度 2：实 实 填 填</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">有效位置</text>
<text x="53" y="330" font-size="21" fill="#16324f">总共 6 个</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">token 平均</text>
<text x="603" y="330" font-size="21" fill="#16324f">有效损失之和除以 6</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">变长批次：存储有 8 格，但仅 6 格是真实 token</text><text x="70" y="588" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">样本 A</text><rect x="235" y="550" width="110" height="55" rx="5" fill="#b5d9c2" stroke="#718fa9"/><text x="270" y="588" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">实</text><rect x="355" y="550" width="110" height="55" rx="5" fill="#b5d9c2" stroke="#718fa9"/><text x="390" y="588" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">实</text><rect x="475" y="550" width="110" height="55" rx="5" fill="#b5d9c2" stroke="#718fa9"/><text x="510" y="588" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">实</text><rect x="595" y="550" width="110" height="55" rx="5" fill="#b5d9c2" stroke="#718fa9"/><text x="630" y="588" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">实</text><text x="70" y="658" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">样本 B</text><rect x="235" y="620" width="110" height="55" rx="5" fill="#b5d9c2" stroke="#718fa9"/><text x="270" y="658" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">实</text><rect x="355" y="620" width="110" height="55" rx="5" fill="#b5d9c2" stroke="#718fa9"/><text x="390" y="658" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">实</text><rect x="475" y="620" width="110" height="55" rx="5" fill="#e8e8e8" stroke="#718fa9"/><text x="510" y="658" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">填</text><rect x="595" y="620" width="110" height="55" rx="5" fill="#e8e8e8" stroke="#718fa9"/><text x="630" y="658" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">填</text><text x="800" y="595" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#16324f">有效元素数 = 6</text><text x="800" y="655" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">总损失除以 6</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">填充损失被屏蔽，不代表其状态更新与最终状态读取也自动正确。</text></svg>