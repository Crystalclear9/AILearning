<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img"><title>变长打包：按时间紧凑排列，只执行仍然有效的序列</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">变长打包：按时间紧凑排列，只执行仍然有效的序列</text><text x="60" y="116" font-size="27" fill="#74888d" text-anchor="start">与实验一同一长度 (2, 5, 3)：原始样本顺序 A、B、C</text><text x="60" y="222" font-size="30" fill="#276a80" text-anchor="start">A</text><rect x="145" y="180" width="86" height="62" fill="#276a80"/><text x="188" y="222" font-size="27" fill="white" text-anchor="middle">A0</text><rect x="245" y="180" width="86" height="62" fill="#276a80"/><text x="288" y="222" font-size="27" fill="white" text-anchor="middle">A1</text><rect x="345" y="180" width="86" height="62" fill="#eeeeee"/><text x="388" y="222" font-size="27" fill="#74888d" text-anchor="middle">—</text><rect x="445" y="180" width="86" height="62" fill="#eeeeee"/><text x="488" y="222" font-size="27" fill="#74888d" text-anchor="middle">—</text><rect x="545" y="180" width="86" height="62" fill="#eeeeee"/><text x="588" y="222" font-size="27" fill="#74888d" text-anchor="middle">—</text><text x="60" y="302" font-size="30" fill="#c2673f" text-anchor="start">B</text><rect x="145" y="260" width="86" height="62" fill="#c2673f"/><text x="188" y="302" font-size="27" fill="white" text-anchor="middle">B0</text><rect x="245" y="260" width="86" height="62" fill="#c2673f"/><text x="288" y="302" font-size="27" fill="white" text-anchor="middle">B1</text><rect x="345" y="260" width="86" height="62" fill="#c2673f"/><text x="388" y="302" font-size="27" fill="white" text-anchor="middle">B2</text><rect x="445" y="260" width="86" height="62" fill="#c2673f"/><text x="488" y="302" font-size="27" fill="white" text-anchor="middle">B3</text><rect x="545" y="260" width="86" height="62" fill="#c2673f"/><text x="588" y="302" font-size="27" fill="white" text-anchor="middle">B4</text><text x="60" y="382" font-size="30" fill="#5d8c79" text-anchor="start">C</text><rect x="145" y="340" width="86" height="62" fill="#5d8c79"/><text x="188" y="382" font-size="27" fill="white" text-anchor="middle">C0</text><rect x="245" y="340" width="86" height="62" fill="#5d8c79"/><text x="288" y="382" font-size="27" fill="white" text-anchor="middle">C1</text><rect x="345" y="340" width="86" height="62" fill="#5d8c79"/><text x="388" y="382" font-size="27" fill="white" text-anchor="middle">C2</text><rect x="445" y="340" width="86" height="62" fill="#eeeeee"/><text x="488" y="382" font-size="27" fill="#74888d" text-anchor="middle">—</text><rect x="545" y="340" width="86" height="62" fill="#eeeeee"/><text x="588" y="382" font-size="27" fill="#74888d" text-anchor="middle">—</text><text x="750" y="220" font-size="29" fill="#19343e" text-anchor="start">长度降序：B、C、A</text><text x="750" y="275" font-size="27" fill="#19343e" text-anchor="start">第 0、1 步：3 条有效</text><text x="750" y="330" font-size="27" fill="#19343e" text-anchor="start">第 2 步：2 条有效</text><text x="750" y="385" font-size="27" fill="#19343e" text-anchor="start">第 3、4 步：各 1 条</text><line x1="60" y1="440" x2="1220" y2="440" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="495" font-size="30" fill="#19343e" text-anchor="start">打包后的有效时间切片</text><text x="210" y="550" font-size="27" fill="#74888d" text-anchor="middle">t = 0</text><rect x="165" y="580" width="90" height="52" fill="#c2673f"/><text x="210" y="615" font-size="26" fill="white" text-anchor="middle">B0</text><rect x="165" y="638" width="90" height="52" fill="#5d8c79"/><text x="210" y="673" font-size="26" fill="white" text-anchor="middle">C0</text><rect x="165" y="696" width="90" height="52" fill="#276a80"/><text x="210" y="731" font-size="26" fill="white" text-anchor="middle">A0</text><text x="210" y="798" font-size="28" fill="#74888d" text-anchor="middle">3</text><text x="415" y="550" font-size="27" fill="#74888d" text-anchor="middle">t = 1</text><re