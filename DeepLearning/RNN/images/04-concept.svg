<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>填充位置与有效损失分母：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">填充位置与有效损失分母</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:text x="70" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">样本 A</ns0:text><ns0:rect x="235" y="228.8" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><ns0:text x="270" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</ns0:text><ns0:rect x="355" y="228.8" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><ns0:text x="390" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</ns0:text><ns0:rect x="475" y="228.8" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><ns0:text x="510" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</ns0:text><ns0:rect x="595" y="228.8" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><ns0:text x="630" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</ns0:text><ns0:text x="70" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">样本 B</ns0:text><ns0:rect x="235" y="331.7" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><ns0:text x="270" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</ns0:text><ns0:rect x="355" y="331.7" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><ns0:text x="390" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</ns0:text><ns0:rect x="475" y="331.7" width="110" height="80.85" rx="5" fill="#e8e8e8" stroke="#718fa9" /><ns0:text x="510" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">填</ns0:text><ns0:rect x="595" y="331.7" width="110" height="80.85" rx="5" fill="#e8e8e8" stroke="#718fa9" /><ns0:text x="630" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">填</ns0:text><ns0:text x="800" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="25.0" fill="#16324f">有效元素数 = 6</ns0:text><ns0:text x="800" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">总损失除以 6</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">填充损失被屏蔽，不代表其状态更新与最终状态读取也自动正确。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  有效位置决定 token 平均分母</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  把填充计入分母会缩小损失</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">样本 A：4 个有效位置</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">样本 B：2 个有效位置＋2 个填充</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">有效损失和示例：12</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">按有效位置：12÷6＝2</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">正确有效均值</ns0:text><ns0:rect x="1220" y="905.5" width="120" height="142.5" fill="#e3a461" /><ns0:text x="1215" y="890.5" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">1.5</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误除以 8</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">本例无额外权重；带类别权重时还需重新定义分母，不能一概</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">按有效 token 个数。</ns0:text></ns0:svg>
