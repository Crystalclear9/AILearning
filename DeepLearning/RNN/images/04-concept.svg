<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1893" viewBox="0 0 1200 1893" role="img"><title>填充位置与有效损失分母：机制、算例与边界</title><rect width="1200" height="1893" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">填充位置与有效损失分母</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="462.95000000000005" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="582.95" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1132.95" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="382.95000000000005" viewBox="0 203 1200 414" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">样本 A</text><rect x="235" y="228.8" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><text x="270" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</text><rect x="355" y="228.8" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><text x="390" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</text><rect x="475" y="228.8" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><text x="510" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</text><rect x="595" y="228.8" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><text x="630" y="284.65999999999997" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</text><text x="70" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">样本 B</text><rect x="235" y="331.7" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><text x="270" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</text><rect x="355" y="331.7" width="110" height="80.85" rx="5" fill="#b5d9c2" stroke="#718fa9" /><text x="390" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">实</text><rect x="475" y="331.7" width="110" height="80.85" rx="5" fill="#e8e8e8" stroke="#718fa9" /><text x="510" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">填</text><rect x="595" y="331.7" width="110" height="80.85" rx="5" fill="#e8e8e8" stroke="#718fa9" /><text x="630" y="387.56" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">填</text><text x="800" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="25.0" fill="#16324f">有效元素数 = 6</text><text x="800" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">总损失除以 6</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">填充损失被屏蔽，不代表其状态更新与最终状态读取也自动正确。</text></g></svg><text x="48" y="625.95" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  有效位置决定 token 平均分母</text><text x="48" y="1175.95" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  把填充计入分母会缩小损失</text><g transform="translate(30,642.95) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">样本 A：4 个有效位置</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">样本 B：2 个有效位置＋2 个填充</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">有效损失和示例：12</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">按有效位置：12÷6＝2</text></g><g transform="translate(45,1192.95) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">正确有效均值</text><rect x="1220" y="905.5" width="120" height="142.5" fill="#e3a461" /><text x="1215" y="890.5" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">1.5</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误除以 8</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">本例无额外权重；带类别权重时还需重新定义分母，不能一概</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">按有效 token 个数。</tspan></text></g></svg>
