<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>循环单元展开后仍共享参数</title>
<desc>原创教学示意：时刻 1|h₁=f(x₁,h₀);时刻 2|h₂=f(x₂,h₁);时刻 3|h₃=f(x₃,h₂);共享权重|接收各时刻梯度之和</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">循环单元展开后仍共享参数</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">时刻 1</text>
<text x="53" y="160" font-size="21" fill="#16324f">h₁=f(x₁,h₀)</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">时刻 2</text>
<text x="603" y="160" font-size="21" fill="#16324f">h₂=f(x₂,h₁)</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">时刻 3</text>
<text x="53" y="330" font-size="21" fill="#16324f">h₃=f(x₃,h₂)</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">共享权重</text>
<text x="603" y="330" font-size="21" fill="#16324f">接收各时刻梯度之和</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">时间展开：每个状态块调用同一组循环参数</text><rect x="40" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="55" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">时刻 1</text><text x="55" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">h₁=f(x₁,h₀)</text><path d="M260,608 L305,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="276" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="315" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="330" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">时刻 2</text><text x="330" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">h₂=f(x₂,h₁)</text><path d="M535,608 L580,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="551" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="590" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="605" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">时刻 3</text><text x="605" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">h₃=f(x₃,h₂)</text><path d="M810,608 L855,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="826" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="865" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="880" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">参数梯度</text><text x="880" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">各时刻贡献求和</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">状态沿时间传递；每次调用共享参数，时间长度不等于参数套数。</text></svg>