<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1873" viewBox="0 0 1200 1873" role="img"><title>循环单元展开后仍共享参数：机制、算例与边界</title><rect width="1200" height="1873" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">循环单元展开后仍共享参数</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="442.6" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="562.6" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1112.6" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="362.6" viewBox="0 225 1200 392" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">时刻 1</text><text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">h1=f(x1,h0)</text><path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">时刻 2</text><text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">h2=f(x2,h1)</text><path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">时刻 3</text><text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">h3=f(x3,h2)</text><path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">参数梯度</text><text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">各时刻贡献求和</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">状态沿时间传递；每次调用共享参数，时间长度不等于参数套数。</text></g></svg><text x="48" y="605.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  共享参数接收各时刻梯度之和</text><text x="48" y="1155.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  忘记累加会丢失时间贡献</text><g transform="translate(30,622.6) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">同一循环权重被调用 3 次</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">某参数三处贡献：1、−2、4</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">总梯度：1−2＋4＝3</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">不会生成三套独立循环权重</text></g><g transform="translate(45,1172.6) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="905.5" width="120" height="142.5" fill="#169b8d" /><text x="895" y="890.5" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">完整共享梯度</text><rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">4</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">只留最后贡献</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">三处导数贡献是教学算例；真实贡献由完整计算图决定，可能</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">同向也可能相互抵消。</tspan></text></g></svg>
