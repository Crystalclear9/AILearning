<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>状态里，还剩多少过去的输入？</title><desc>线性递归系数0.5，输入1、2、0。堆叠面积表示各次输入对状态的实际贡献；第三步贡献0.25和1，相加为1.25。</desc><rect width="1200" height="730" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="40" y="57" font-size="36" fill="#203740" text-anchor="start">状态里，还剩多少过去的输入？</text><text x="40" y="105" font-size="27" fill="#829197" text-anchor="start">h(t) = 0.5 h(t−1) + x(t)     ·     h(0) = 0</text><line x1="100" y1="535" x2="1050" y2="535" stroke="#dde6e8" stroke-width="1" stroke-dasharray=""/><text x="80" y="543" font-size="24" fill="#829197" text-anchor="end">0</text><line x1="100" y1="415" x2="1050" y2="415" stroke="#dde6e8" stroke-width="1" stroke-dasharray=""/><text x="80" y="423" font-size="24" fill="#829197" text-anchor="end">1</text><line x1="100" y1="295" x2="1050" y2="295" stroke="#dde6e8" stroke-width="1" stroke-dasharray=""/><text x="80" y="303" font-size="24" fill="#829197" text-anchor="end">2</text><line x1="100" y1="175" x2="1050" y2="175" stroke="#dde6e8" stroke-width="1" stroke-dasharray=""/><text x="80" y="183" font-size="24" fill="#829197" text-anchor="end">3</text><text x="75" y="150" font-size="26" fill="#829197" text-anchor="start">状态值</text><path d="M260.000,535.000 L260.000,415.000 L595.000,475.000 L930.000,505.000 L930.000,535.000 Z" fill="#cde2e8" stroke="none" stroke-width="0" stroke-linejoin="round"/><path d="M595.000,475.000 L595.000,235.000 L930.000,385.000 L930.000,505.000 Z" fill="#efd6c5" stroke="none" stroke-width="0" stroke-linejoin="round"/><path d="M260.000,415.000 L595.000,475.000 L930.000,505.000" fill="none" stroke="#266b82" stroke-width="3" stroke-linejoin="round"/><circle cx="260" cy="415" r="7" fill="#203740"/><text x="278" y="400" font-size="30" fill="#203740" text-anchor="start">1</text><circle cx="595" cy="235.0" r="7" fill="#203740"/><text x="613" y="220.0" font-size="30" fill="#203740" text-anchor="start">2.5</text><circle cx="930" cy="385.0" r="7" fill="#203740"/><text x="948" y="370.0" font-size="30" fill="#203740" text-anchor="start">1.25</text><line x1="260" y1="535" x2="260" y2="544" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="260" y="578" font-size="27" fill="#203740" text-anchor="middle">t = 1</text><line x1="595" y1="535" x2="595" y2="544" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="595" y="578" font-size="27" fill="#203740" text-anchor="middle">t = 2</text><line x1="930" y1="535" x2="930" y2="544" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="930" y="578" font-size="27" fill="#203740" text-anchor="middle">t = 3</text><text x="260" y="615" font-size="27" fill="#266b82" text-anchor="middle">写入 1</text><text x="595" y="615" font-size="27" fill="#c0643c" text-anchor="middle">写入 2</text><text x="930" y="615" font-size="27" fill="#829197" text-anchor="middle">写入 0</text><text x="970" y="495" font-size="25" fill="#266b82" text-anchor="start">0.25</text><text x="970" y="420" font-size="25" fill="#c0643c" text-anchor="start">1.00</text><text x="120" y="688" font-size="27" fill="#266b82" text-anchor="start">蓝：第 1 次输入留下的贡献</text><text x="650" y="688" font-size="27" fill="#c0643c" text-anchor="start">橙：第 2 次输入留下的贡献</text></g></svg>
