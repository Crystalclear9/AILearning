<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="617.48" viewBox="-18.24 28.76 996.48 617.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">截断反向传播切断梯度而不必清空状态</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="530.326087"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="617.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="581" viewBox="0 47 960 581" overflow="hidden"><rect width="960" height="628" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(-6.956522 18.934783) scale(0.76087)"><g><rect x="42" y="75" width="1196" height="697" fill="#ffffff"/><title>前向值完全相同：截断改变的是哪一项导数？</title><rect width="1280" height="800" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="34.828571px" fill="#475b6c" text-anchor="start">h(t) = w × h(t−1) + x(t)，w = 0.5，输入 (1, 2, 3)，h(0) = 0</text><circle cx="110" cy="245" r="28" fill="#22627b"/><text x="110" y="255" font-size="30.94px" fill="#ffffff" text-anchor="middle">0</text><text x="110" y="185" font-size="34.828571px" fill="#2c6f89" text-anchor="middle">h0</text><line x1="148" y1="245" x2="352" y2="245" stroke="#22627b" stroke-width="4"/><polyline fill="none" stroke="#22627b" stroke-width="4" points="341.47,250.75 352,245 341.47,239.25"/><text x="250.0" y="300" font-size="33.54px" fill="#475b6c" text-anchor="middle">×0.5，+1</text><circle cx="390" cy="245" r="28" fill="#22627b"/><text x="390" y="255" font-size="30.94px" fill="#ffffff" text-anchor="middle">1</text><text x="390" y="185" font-size="34.828571px" fill="#2c6f89" text-anchor="middle">h1</text><line x1="428" y1="245" x2="632" y2="245" stroke="#22627b" stroke-width="4"/><polyline fill="none" stroke="#22627b" stroke-width="4" points="621.47,250.75 632,245 621.47,239.25"/><text x="530.0" y="300" font-size="33.54px" fill="#475b6c" text-anchor="middle">×0.5，+2</text><circle cx="670" cy="245" r="28" fill="#22627b"/><text x="670" y="255" font-size="30.94px" fill="#ffffff" text-anchor="middle">2.5</text><text x="670" y="185" font-size="34.828571px" fill="#2c6f89" text-anchor="middle">h2</text><line x1="708" y1="245" x2="912" y2="245" stroke="#22627b" stroke-width="4"/><polyline fill="none" stroke="#22627b" stroke-width="4" points="901.47,250.75 912,245 901.47,239.25"/><text x="810.0" y="300" font-size="33.54px" fill="#475b6c" text-anchor="middle">×0.5，+3</text><circle cx="950" cy="245" r="28" fill="#22627b"/><text x="950" y="255" font-size="30.94px" fill="#ffffff" text-anchor="middle">4.25</text><text x="950" y="185" font-size="34.828571px" fill="#2c6f89" text-anchor="middle">h3</text><text x="60" y="365" font-size="34.828571px" fill="#283341" text-anchor="start">损失 L = 0.5 × h3²；反向伴随从末步 4.25 开始</text><text x="390" y="440" font-size="34.828571px" fill="#2c6f89" text-anchor="middle">g(h1) = 1.0625</text><line x1="625" y1="468" x2="455" y2="468" stroke="#a9603b" stroke-width="4"/><polyline fill="none" stroke="#a9603b" stroke-width="4" points="465.53,462.25 455,468 465.53,473.75"/><text x="670" y="440" font-size="34.828571px" fill="#2c6f89" text-anchor="middle">g(h2) = 2.125</text><line x1="905" y1="468" x2="735" y2="468" stroke="#a9603b" stroke-width="4"/><polyline fill="none" stroke="#a9603b" stroke-width="4" points="745.53,462.25 735,468 745.53,473.75"/><text x="950" y="440" font-size="34.828571px" fill="#2c6f89" text-anchor="middle">g(h3) = 4.25</text><line x1="60" y1="490" x2="1220" y2="490" stroke="#dde5eb" stroke-width="2"/><text x="60" y="545" font-size="34.828571px" fill="#283341" text-anchor="start">共享 w 的贡献</text><text x="60" y="599" font-size="34.828571px" fill="#2c6f89" text-anchor="start">第 2 步：2.125 × 1 = 2.125</text><text x="60" y="648" font-size="34.828571px" fill="#a05f3f" text-anchor="start">第 3 步：4.25 × 2.5 = 10.625</text><rect x="670" y="570" width="74.375" height="38" fill="#2c6f89"/><rect x="744.375" y="570" width="371.875" height="38" fill="#b56b47"/><text x="670" y="658" font-size="34.828571px" fill="#283341" text-anchor="start">完整梯度 12.75</text><text x="60" y="750" font-size="34.828571px" fill="#a05f3f" text-anchor="start">若在 h2 后 detach：h3 仍是 4.25，但只留下第 3 步的 10.625。</text></g></g></g></g></svg></svg>