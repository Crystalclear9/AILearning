<svg xmlns="http://www.w3.org/2000/svg" width="1241.45" height="749.448" viewBox="19.276 52.276 1241.45 749.448" role="img" aria-labelledby="plate-title"><defs><linearGradient id="edition-wash-1" x1="0%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#ebf3f6"/><stop offset="100%" stop-color="#dceaef"/></linearGradient><linearGradient id="edition-wash-2" x1="0%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#f8eee9"/><stop offset="100%" stop-color="#f2e2d9"/></linearGradient></defs><title id="plate-title">重叠预测窗口共享未来标签</title><rect id="edition-paper" x="19.276" y="52.276" width="1241.45" height="749.448" fill="#ffffff"/><svg id="edition-view" x="42" y="75" width="1196" height="704" viewBox="42 75 1196 704" overflow="hidden"><rect x="42" y="75" width="1196" height="704" fill="#ffffff"/><rect width="1280" height="790" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="116" font-size="27" fill="#5d747d" text-anchor="start">本章约定：起点 t 的历史只到 t−1；三步目标为 [t, t+3)</text><text x="440" y="190" font-size="29" fill="#5d747d" text-anchor="middle">t</text><text x="625" y="190" font-size="29" fill="#5d747d" text-anchor="middle">t+1</text><text x="810" y="190" font-size="29" fill="#5d747d" text-anchor="middle">t+2</text><text x="995" y="190" font-size="29" fill="#5d747d" text-anchor="middle">t+3</text><text x="60" y="309" font-size="31" fill="#283341" text-anchor="start">起点 t</text><rect x="370" y="255" width="140" height="88" fill="url(#edition-wash-1)"/><text x="440" y="310" font-size="27" fill="#2c6f89" text-anchor="middle">第 1 步</text><rect x="555" y="255" width="140" height="88" fill="url(#edition-wash-2)"/><text x="625" y="310" font-size="27" fill="#8e5438" text-anchor="middle">第 2 步</text><rect x="740" y="255" width="140" height="88" fill="url(#edition-wash-2)"/><text x="810" y="310" font-size="27" fill="#8e5438" text-anchor="middle">第 3 步</text><text x="995" y="310" font-size="28" fill="#5d747d" text-anchor="middle">—</text><text x="60" y="484" font-size="31" fill="#283341" text-anchor="start">起点 t+1</text><text x="440" y="485" font-size="28" fill="#5d747d" text-anchor="middle">—</text><rect x="555" y="430" width="140" height="88" fill="url(#edition-wash-2)"/><text x="625" y="485" font-size="27" fill="#8e5438" text-anchor="middle">第 1 步</text><rect x="740" y="430" width="140" height="88" fill="url(#edition-wash-2)"/><text x="810" y="485" font-size="27" fill="#8e5438" text-anchor="middle">第 2 步</text><rect x="925" y="430" width="140" height="88" fill="url(#edition-wash-1)"/><text x="995" y="485" font-size="27" fill="#2c6f89" text-anchor="middle">第 3 步</text><line x1="625" y1="345" x2="625" y2="425" stroke="#b56b47" stroke-width="3"/><line x1="810" y1="345" x2="810" y2="425" stroke="#b56b47" stroke-width="3"/><line x1="60" y1="585" x2="1220" y2="585" stroke="#e3e8ee" stroke-width="2"/><text x="60" y="645" font-size="29" fill="#a26040" text-anchor="start">实际时间 t+1：起点 t 的第 2 步，也是起点 t+1 的第 1 步。</text><text x="60" y="702" font-size="27" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">这是两个不同信息条件的预测；可以都评价，但不能自动当作独立证据。</text><text x="60" y="757" font-size="26" fill="#5d747d" text-anchor="start">图中的目标从 t 开始，保持与正文滑窗索引和训练截止条件一致。</text></g></svg></svg>
