<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>编码状态如何按解码步读取</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">编码状态如何按解码步读取</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="228.8" width="230" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源值 1</ns0:text><ns0:text x="55" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">2，权重 0.25</ns0:text><ns0:rect x="40" y="397.85" width="230" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="441.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源值 2</ns0:text><ns0:text x="55" y="493.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">6，权重 0.75</ns0:text><ns0:path d="M270,287.6 L530,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M270,456.65 L530,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="540" y="287.6" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="555" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">上下文</ns0:text><ns0:text x="555" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.25×2＋0.75×6＝5</ns0:text><ns0:path d="M840,346.4 L900,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="910" y="287.6" width="180" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="925" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">当前解码步</ns0:text><ns0:text x="925" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">用于输出预测</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">下一解码步可重新计算权重；源长度与目标长度不必相同。</ns0:text></g></svg>
