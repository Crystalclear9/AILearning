<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>编码状态如何按解码步读取：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">编码状态如何按解码步读取</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="228.8" width="230" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源值 1</ns0:text><ns0:text x="55" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">2，权重 0.25</ns0:text><ns0:rect x="40" y="397.85" width="230" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="441.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源值 2</ns0:text><ns0:text x="55" y="493.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">6，权重 0.75</ns0:text><ns0:path d="M270,287.6 L530,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M270,456.65 L530,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="540" y="287.6" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="555" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">上下文</ns0:text><ns0:text x="555" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.25×2＋0.75×6＝5</ns0:text><ns0:path d="M840,346.4 L900,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="910" y="287.6" width="180" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="925" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">当前解码步</ns0:text><ns0:text x="925" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">用于输出预测</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">下一解码步可重新计算权重；源长度与目标长度不必相同。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  按当前查询重新计算源端汇总</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  下一步不是机械复用同一上下文</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">源值：2、6</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">当前权重：0.25、0.75</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">当前上下文：5</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">下一步权重可变为 0.75、0.25</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">5</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">当前读取</ns0:text><ns0:rect x="1220" y="934.0" width="120" height="114.0" fill="#e3a461" /><ns0:text x="1215" y="919.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">新权重读取</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">注意力上下文按解码步变化；固定摘要无法自动代表所有后续</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">查询需求。</ns0:text></ns0:svg>
