<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1893" viewBox="0 0 1200 1893" role="img"><title>编码状态如何按解码步读取：机制、算例与边界</title><rect width="1200" height="1893" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">编码状态如何按解码步读取</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="462.95000000000005" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="582.95" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1132.95" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="382.95000000000005" viewBox="0 203 1200 414" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="40" y="228.8" width="230" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源值 1</text><text x="55" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">2，权重 0.25</text><rect x="40" y="397.85" width="230" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="441.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源值 2</text><text x="55" y="493.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">6，权重 0.75</text><path d="M270,287.6 L530,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M270,456.65 L530,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="540" y="287.6" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="555" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">上下文</text><text x="555" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.25×2＋0.75×6＝5</text><path d="M840,346.4 L900,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="910" y="287.6" width="180" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="925" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">当前解码步</text><text x="925" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">用于输出预测</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">下一解码步可重新计算权重；源长度与目标长度不必相同。</text></g></svg><text x="48" y="625.95" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  按当前查询重新计算源端汇总</text><text x="48" y="1175.95" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  下一步不是机械复用同一上下文</text><g transform="translate(30,642.95) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">源值：2、6</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">当前权重：0.25、0.75</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">当前上下文：5</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">下一步权重可变为 0.75、0.25</text></g><g transform="translate(45,1192.95) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">5</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">当前读取</text><rect x="1220" y="934.0" width="120" height="114.0" fill="#e3a461" /><text x="1215" y="919.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">新权重读取</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">注意力上下文按解码步变化；固定摘要无法自动代表所有后续</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">查询需求。</tspan></text></g></svg>
