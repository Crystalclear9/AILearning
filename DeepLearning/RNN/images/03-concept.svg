<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>读取权重改变，落点沿源值之间移动</title><desc>两个固定二维源值vA=(2,0),vB=(6,4)。权重四分之一与四分之三得到c=(5,3)，交换权重后得到(3,1)。</desc><rect width="1200" height="740" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="40" y="57" font-size="36" fill="#203740" text-anchor="start">读取权重改变，落点沿源值之间移动</text><text x="40" y="106" font-size="27" fill="#829197" text-anchor="start">两个源值不动：vA = (2, 0)，vB = (6, 4)</text><line x1="130" y1="585" x2="860" y2="585" stroke="#829197" stroke-width="2" stroke-dasharray=""/><line x1="130" y1="585" x2="130" y2="160" stroke="#829197" stroke-width="2" stroke-dasharray=""/><line x1="130" y1="585" x2="130" y2="593" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="130" y="630" font-size="25" fill="#829197" text-anchor="middle">0</text><line x1="350" y1="585" x2="350" y2="593" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="350" y="630" font-size="25" fill="#829197" text-anchor="middle">2</text><line x1="570" y1="585" x2="570" y2="593" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="570" y="630" font-size="25" fill="#829197" text-anchor="middle">4</text><line x1="790" y1="585" x2="790" y2="593" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="790" y="630" font-size="25" fill="#829197" text-anchor="middle">6</text><line x1="123" y1="490" x2="130" y2="490" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="108" y="498" font-size="25" fill="#829197" text-anchor="end">1</text><line x1="123" y1="395" x2="130" y2="395" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="108" y="403" font-size="25" fill="#829197" text-anchor="end">2</text><line x1="123" y1="300" x2="130" y2="300" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="108" y="308" font-size="25" fill="#829197" text-anchor="end">3</text><line x1="123" y1="205" x2="130" y2="205" stroke="#829197" stroke-width="2" stroke-dasharray=""/><text x="108" y="213" font-size="25" fill="#829197" text-anchor="end">4</text><text x="880" y="630" font-size="26" fill="#829197" text-anchor="start">第 1 分量</text><text x="78" y="159" font-size="26" fill="#829197" text-anchor="start">第 2 分量</text><line x1="350" y1="585" x2="790" y2="205" stroke="#bacbd1" stroke-width="9" stroke-dasharray=""/><circle cx="350" cy="585" r="10" fill="#203740"/><circle cx="790" cy="205" r="10" fill="#203740"/><circle cx="680" cy="300" r="12" fill="#266b82"/><line x1="680" y1="300" x2="680" y2="585" stroke="#266b82" stroke-width="2" stroke-dasharray="5 6"/><circle cx="460" cy="490" r="12" fill="#c0643c"/><line x1="460" y1="490" x2="460" y2="585" stroke="#c0643c" stroke-width="2" stroke-dasharray="5 6"/><text x="325" y="560" font-size="29" fill="#203740" text-anchor="end">vA</text><text x="812" y="210" font-size="29" fill="#203740" text-anchor="start">vB</text><text x="660" y="270" font-size="29" fill="#266b82" text-anchor="end">当前 (5, 3)</text><text x="490" y="499" font-size="29" fill="#c0643c" text-anchor="start">下一步 (3, 1)</text><text x="835" y="267" font-size="27" fill="#266b82" text-anchor="start">当前权重</text><text x="835" y="310" font-size="27" fill="#266b82" text-anchor="start">(0.25, 0.75)</text><text x="835" y="406" font-size="27" fill="#c0643c" text-anchor="start">下一步权重</text><text x="835" y="449" font-size="27" fill="#c0643c" text-anchor="start">(0.75, 0.25)</text><text x="40" y="702" font-size="28" fill="#203740" text-anchor="start">只读第 1 分量，便回到标量例子：2、6 → 5 或 3。</text></g></svg>
