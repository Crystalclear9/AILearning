<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>LSTM 细胞状态的保留与写入：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">LSTM 细胞状态的保留与写入</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="60" y="214.1" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="75" y="258.2" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">保留旧状态</ns0:text><ns0:text x="75" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.9×2＝1.8</ns0:text><ns0:rect x="60" y="383.15" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="75" y="427.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">写入候选</ns0:text><ns0:text x="75" y="478.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.2×0.5＝0.1</ns0:text><ns0:path d="M360,272.9 L620,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M360,441.95 L620,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="605" y="317.0" width="50" height="73.5" rx="5" fill="#e4d9f2" stroke="#718fa9" /><ns0:text x="615" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">＋</ns0:text><ns0:path d="M655,353.75 L770,353.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="780" y="287.6" width="280" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="795" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">新细胞状态</ns0:text><ns0:text x="795" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">c=1.9</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">隐藏状态还经过输出门与 tanh；细胞状态并不是最后的隐藏输出。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  细胞状态保留项与写入项相加</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  把门值误作二元开关会改计算</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">旧状态：2；遗忘门：0.9</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">保留项：1.8</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入门 0.2；候选 0.5：写入 0.1</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">新细胞状态：1.8＋0.1＝1.9</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="867.5" width="120" height="180.5" fill="#169b8d" /><ns0:text x="895" y="852.5" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">1.9</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">连续门结果</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">强行二值化后</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">此处二值化按 0.5 阈值作对照；它不是 LSTM 定义，也不等价</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">于保持原模型。</ns0:text></ns0:svg>
