<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>LSTM 细胞状态的保留与写入</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">LSTM 细胞状态的保留与写入</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="60" y="214.1" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="75" y="258.2" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">保留旧状态</ns0:text><ns0:text x="75" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.9×2＝1.8</ns0:text><ns0:rect x="60" y="383.15" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="75" y="427.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">写入候选</ns0:text><ns0:text x="75" y="478.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.2×0.5＝0.1</ns0:text><ns0:path d="M360,272.9 L620,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M360,441.95 L620,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="605" y="317.0" width="50" height="73.5" rx="5" fill="#e4d9f2" stroke="#718fa9" /><ns0:text x="615" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">＋</ns0:text><ns0:path d="M655,353.75 L770,353.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="780" y="287.6" width="280" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="795" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">新细胞状态</ns0:text><ns0:text x="795" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">c=1.9</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">隐藏状态还经过输出门与 tanh；细胞状态并不是最后的隐藏输出。</ns0:text></g></svg>
