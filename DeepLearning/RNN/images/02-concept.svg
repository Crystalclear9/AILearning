<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1907" viewBox="0 0 1200 1907" role="img"><title>LSTM 细胞状态的保留与写入：机制、算例与边界</title><rect width="1200" height="1907" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">LSTM 细胞状态的保留与写入</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="476.82500000000005" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="596.825" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1146.825" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="396.82500000000005" viewBox="0 188 1200 429" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="60" y="214.1" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="75" y="258.2" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">保留旧状态</text><text x="75" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.9×2＝1.8</text><rect x="60" y="383.15" width="300" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="75" y="427.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">写入候选</text><text x="75" y="478.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">0.2×0.5＝0.1</text><path d="M360,272.9 L620,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M360,441.95 L620,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="605" y="317.0" width="50" height="73.5" rx="5" fill="#e4d9f2" stroke="#718fa9" /><text x="615" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">＋</text><path d="M655,353.75 L770,353.75" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="780" y="287.6" width="280" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="795" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">新细胞状态</text><text x="795" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">c=1.9</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">隐藏状态还经过输出门与 tanh；细胞状态并不是最后的隐藏输出。</text></g></svg><text x="48" y="639.825" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  细胞状态保留项与写入项相加</text><text x="48" y="1189.825" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  把门值误作二元开关会改计算</text><g transform="translate(30,656.825) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">旧状态：2；遗忘门：0.9</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">保留项：1.8</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入门 0.2；候选 0.5：写入 0.1</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">新细胞状态：1.8＋0.1＝1.9</text></g><g transform="translate(45,1206.825) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="867.5" width="120" height="180.5" fill="#169b8d" /><text x="895" y="852.5" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">1.9</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">连续门结果</text><rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">强行二值化后</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">此处二值化按 0.5 阈值作对照；它不是 LSTM 定义，也不等价</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">于保持原模型。</tspan></text></g></svg>
