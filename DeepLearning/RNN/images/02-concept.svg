<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>LSTM 细胞状态的保留与写入</title>
<desc>原创教学示意：旧状态|c=2;保留旧值|遗忘门 0.9 → 1.8;写入新值|输入门 0.2 × 候选 0.5;新状态|1.8＋0.1＝1.9</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">LSTM 细胞状态的保留与写入</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">旧状态</text>
<text x="53" y="160" font-size="21" fill="#16324f">c=2</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">保留旧值</text>
<text x="603" y="160" font-size="21" fill="#16324f">遗忘门 0.9 → 1.8</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">写入新值</text>
<text x="53" y="330" font-size="21" fill="#16324f">输入门 0.2 × 候选 0.5</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">新状态</text>
<text x="603" y="330" font-size="21" fill="#16324f">1.8＋0.1＝1.9</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">LSTM 两条数值路径：保留旧值与写入新值相加</text><rect x="60" y="540" width="300" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="75" y="570" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">保留旧状态</text><text x="75" y="605" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">0.9×2＝1.8</text><rect x="60" y="655" width="300" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="75" y="685" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">写入候选</text><text x="75" y="720" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">0.2×0.5＝0.1</text><path d="M360,580 L620,630" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M360,695 L620,630" fill="none" stroke="#718fa9" stroke-width="3"/><rect x="605" y="610" width="50" height="50" rx="5" fill="#e4d9f2" stroke="#718fa9"/><text x="615" y="645" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#16324f">＋</text><path d="M655,635 L770,635" fill="none" stroke="#718fa9" stroke-width="3"/><rect x="780" y="590" width="280" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="795" y="620" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">新细胞状态</text><text x="795" y="655" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">c=1.9</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">隐藏状态还经过输出门与 tanh；细胞状态并不是最后的隐藏输出。</text></svg>