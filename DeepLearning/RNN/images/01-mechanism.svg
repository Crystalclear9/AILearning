<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1170.86" height="688.864" viewBox="8.568 42.568 1170.86 688.864" role="img" aria-labelledby="plate-title"><title id="plate-title">跨批状态必须同时保持实体身份与时间顺序</title><desc>累计状态h加当前观测。第一批Alice和Bob分别得到1和10，第二批顺序换为Bob和Alice；按实体取状态得到30和3，按行号误传得到21和12。</desc><rect id="edition-paper" x="8.568" y="42.568" width="1170.86" height="688.864" fill="#ffffff"/><svg id="edition-view" x="30" y="64" width="1128" height="646" viewBox="30 64 1128 646" overflow="hidden"><rect x="30" y="64" width="1128" height="646" fill="#ffffff"/><rect width="1200" height="730" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#223849"><text x="48" y="105" font-size="27" fill="#658391" text-anchor="start">最小累计器：新状态 = 旧状态 + 当前观测；初始状态都为 0。</text><text x="60" y="170" font-size="28" fill="#223849" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">第一批结束</text><text x="660" y="170" font-size="28" fill="#223849" text-anchor="start">第二批输入顺序：Bob → Alice</text><circle cx="90" cy="252" r="13" fill="#2a7698" stroke="#ffffff" stroke-width="2"/><text x="120" y="260" font-size="30" fill="#2a7698" text-anchor="start">Alice：状态 1</text><circle cx="90" cy="382" r="13" fill="#ae613c" stroke="#ffffff" stroke-width="2"/><text x="120" y="390" font-size="30" fill="#ae613c" text-anchor="start">Bob：状态 10</text><polyline points="330.000,250.000 470.000,250.000 580.000,380.000 640.000,380.000" fill="none" stroke="#2a7698" stroke-width="4" stroke-linejoin="round"/><polyline points="330.000,380.000 470.000,380.000 580.000,250.000 640.000,250.000" fill="none" stroke="#ae613c" stroke-width="4" stroke-linejoin="round"/><text x="665" y="250" font-size="31" fill="#ae613c" text-anchor="start">Bob：10 + 20 = 30</text><text x="665" y="380" font-size="31" fill="#2a7698" text-anchor="start">Alice：1 + 2 = 3</text><line x1="60" y1="450" x2="1140" y2="450" stroke="#e4e9ee" stroke-width="2"/><text x="60" y="510" font-size="29" fill="#223849" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">若错误沿行号传递：</text><text x="90" y="570" font-size="29" fill="#ae613c" text-anchor="start">第 1 行：1 + 20 = 21</text><text x="650" y="570" font-size="29" fill="#2a7698" text-anchor="start">第 2 行：10 + 2 = 12</text><text x="60" y="630" font-size="27" fill="#658391" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">张量形状完全相同，数字也都有限，但两个人的历史已经混在一起。</text><text x="60" y="688" font-size="27" fill="#658391" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">正确索引来自实体身份；同一实体内还需按时间顺序消费观测。</text></g></svg></svg>