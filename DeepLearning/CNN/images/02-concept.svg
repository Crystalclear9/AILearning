<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>迁移学习中的骨干与分类头：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">迁移学习中的骨干与分类头</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="45" y="250.85" width="285" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="60" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">预训练骨干</ns0:text><ns0:text x="60" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">冻结：不更新参数</ns0:text><ns0:path d="M330,317.0 L440,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="450" y="250.85" width="290" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="465" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">新分类头</ns0:text><ns0:text x="465" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">512→3：1539 个参数</ns0:text><ns0:path d="M740,317.0 L840,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="850" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="865" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">验证</ns0:text><ns0:text x="865" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定微调范围</ns0:text><ns0:text x="100" y="464.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">阶段二：按验证证据解冻部分骨干，通常另设学习率</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">冻结参数与切换 train/eval 是不同操作；BatchNorm 统计需另外控制。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  新任务头的参数来自特征与类别</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  冻结权重与冻结运行状态不同</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">骨干输出：512 维</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">目标类别：3</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">线性权重：512×3＝1536</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">偏置：3；总参数：1539</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">train 模式下冻结参数不自动固定 BatchNorm 缓冲；是否更新</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">状态要另行控制。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">权重：冻结</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">运行均值：可更新</ns0:text><ns0:rect x="830" y="865" width="47" height="47" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="880" y="865" width="47" height="47" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="830" y="915" width="47" height="47" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="880" y="915" width="47" height="47" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:text x="830" y="1010" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">W新 = W旧</ns0:text><ns0:text x="1160" y="890" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">旧均值 0</ns0:text><ns0:line x1="1220" y1="915" x2="1220" y2="960" stroke="#44859a" stroke-width="2" /><ns0:text x="1150" y="1005" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">新均值 1</ns0:text><ns0:text x="805" y="1100" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">批均值 10、更新系数 0.1：0.9×0＋0.1×10＝1</ns0:text></ns0:svg>
