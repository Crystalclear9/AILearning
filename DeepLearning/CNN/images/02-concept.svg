<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img"><title>冻结权重之后，BatchNorm 的状态仍会改变输出</title><rect width="1280" height="825" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">冻结权重之后，BatchNorm 的状态仍会改变输出</text><text x="60" y="116" font-size="27" fill="#74888d" text-anchor="start">每批通道内全为 10；动量 0.1；运行均值初始 0，运行方差初始 1</text><text x="60" y="159" font-size="27" fill="#19343e" text-anchor="start">所有可学习参数不动。每轮训练模式前向后，切到 eval 比较同一个输入。</text><text x="60" y="253" font-size="27" fill="#276a80" text-anchor="start">运行均值</text><line x1="245" y1="315.0" x2="1120" y2="315.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="324.0" font-size="24" fill="#74888d" text-anchor="end">0</text><line x1="245" y1="260.0" x2="1120" y2="260.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="269.0" font-size="24" fill="#74888d" text-anchor="end">5</text><line x1="245" y1="205.0" x2="1120" y2="205.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="214.0" font-size="24" fill="#74888d" text-anchor="end">10</text><path d="M250.00,315.00 L336.00,304.00 L422.00,294.10 L508.00,285.19 L594.00,277.17 L680.00,269.95 L766.00,263.46 L852.00,257.61 L938.00,252.35 L1024.00,247.62 L1110.00,243.35" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="250" cy="315.0" r="6" fill="#276a80"/><circle cx="336" cy="304.0" r="6" fill="#276a80"/><circle cx="422" cy="294.1" r="6" fill="#276a80"/><circle cx="680" cy="269.9539" r="6" fill="#276a80"/><circle cx="1110" cy="243.35462841100002" r="6" fill="#276a80"/><text x="1145" y="252.35462841100002" font-size="26" fill="#276a80" text-anchor="start">6.513</text><text x="60" y="430" font-size="27" fill="#c2673f" text-anchor="start">运行方差</text><line x1="245" y1="492.0" x2="1120" y2="492.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="501.0" font-size="24" fill="#74888d" text-anchor="end">0</text><line x1="245" y1="437.0" x2="1120" y2="437.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="446.0" font-size="24" fill="#74888d" text-anchor="end">0.5</text><line x1="245" y1="382.0" x2="1120" y2="382.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="391.0" font-size="24" fill="#74888d" text-anchor="end">1</text><path d="M250.00,382.00 L336.00,393.00 L422.00,402.90 L508.00,411.81 L594.00,419.83 L680.00,427.05 L766.00,433.54 L852.00,439.39 L938.00,444.65 L1024.00,449.38 L1110.00,453.65" fill="none" stroke="#c2673f" stroke-width="4"/><circle cx="250" cy="382.0" r="6" fill="#c2673f"/><circle cx="336" cy="393.0" r="6" fill="#c2673f"/><circle cx="422" cy="402.9" r="6" fill="#c2673f"/><circle cx="680" cy="427.0461" r="6" fill="#c2673f"/><circle cx="1110" cy="453.645371589" r="6" fill="#c2673f"/><text x="1145" y="462.645371589" font-size="26" fill="#c2673f" text-anchor="start">0.349</text><text x="60" y="607" font-size="27" fill="#5d8c79" text-anchor="start">eval 输出</text><line x1="245" y1="669.0" x2="1120" y2="669.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="678.0" font-size="24" fill="#74888d" text-anchor="end">0</text><line x1="245" y1="614.0" x2="1120" y2="614.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="623.0" font-size="24" fill="#74888d" text-anchor="end">5</text><line x1="245" y1="559.0" x2="1120" y2="559.0" stroke="#dbe5e8" stroke-width="2"/><text x="230" y="568.0" font-size="24" fill="#74888d" text-anchor="end">10</text><path d="M250.00,559.00 L336.00,564.65 L422.00,570.00 L508.00,575.08 L594.00,579.90 L680.00,584.47 L766.00,588.81 L852.00,592.93 L938.00,596.83 L1024.00,600.53 L1110.00,604.05" fill="none" stroke="#5d8c79" stroke-width="4"/><circle cx="250" cy="559.0005499958751" r="6" fill="#5d8c79"/><circle cx="336" cy="564.6454169605166" r="6" fill="#5d8c79"/><circle cx="422" cy="570.0006111054527" r="6" fill="#5d8c79"/><circle cx="680" cy="584.4730338764657" r="6" fill="#5d8c79"/><circle cx="1110" cy="604.0470314097951" r="6" fill="#5d8c79"/><text x="1145" y="613.0470314097951" font-size="26" fill="#5d8c79" text-anchor="start">5.905</text><text x="250" y="706" font-size="25" fill="#74888d" text-anchor="middle">0</text><text x="336" y="706" font-size="25" fill="#74888d" text-anchor="middle">1</text><text x="422" y="706" font-size="25" fill="#74888d" text-anchor="middle">2</text><text x="680" y="706" font-size="25" fill="#74888d" text-anchor="middle">5</text><text x="1110" y="706" font-size="25" fill="#74888d" text-anchor="middle">10</text><text x="660" y="770" font-size="27" fill="#74888d" text-anchor="middle">训练模式前向次数 k</text><text x="60" y="810" font-size="25" fill="#74888d" text-anchor="start">epsilon = 0.00001，gamma = 1，beta = 0；图为隔离机制的常量批构造。</text></g></svg>
