<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1873" viewBox="0 0 1200 1873" role="img"><title>迁移学习中的骨干与分类头：机制、算例与边界</title><rect width="1200" height="1873" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">迁移学习中的骨干与分类头</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="442.6" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="562.6" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1112.6" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="362.6" viewBox="0 225 1200 392" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="45" y="250.85" width="285" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="60" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">预训练骨干</text><text x="60" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">冻结：不更新参数</text><path d="M330,317.0 L440,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="450" y="250.85" width="290" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="465" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">新分类头</text><text x="465" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">512→3：1539 个参数</text><path d="M740,317.0 L840,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="850" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="865" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">验证</text><text x="865" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定微调范围</text><text x="100" y="464.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">阶段二：按验证证据解冻部分骨干，通常另设学习率</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">冻结参数与切换 train/eval 是不同操作；BatchNorm 统计需另外控制。</text></g></svg><text x="48" y="605.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  新任务头的参数来自特征与类别</text><text x="48" y="1155.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  冻结权重与冻结运行状态不同</text><g transform="translate(30,622.6) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">骨干输出：512 维</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">目标类别：3</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">线性权重：512×3＝1536</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">偏置：3；总参数：1539</text></g><g transform="translate(45,1172.6) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">train 模式下冻结参数不自动固定 BatchNorm 缓冲；是否更新</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">状态要另行控制。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">权重：冻结</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">运行均值：可更新</text><rect x="830" y="865" width="47" height="47" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="880" y="865" width="47" height="47" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="830" y="915" width="47" height="47" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="880" y="915" width="47" height="47" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><text x="830" y="1010" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">W新 = W旧</text><text x="1160" y="890" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">旧均值 0</text><line x1="1220" y1="915" x2="1220" y2="960" stroke="#44859a" stroke-width="2" /><text x="1150" y="1005" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">新均值 1</text><text x="805" y="1100" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">批均值 10、更新系数 0.1：0.9×0＋0.1×10＝1</text></g></svg>
