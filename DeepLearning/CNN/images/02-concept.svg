<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>迁移学习中的骨干与分类头</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">迁移学习中的骨干与分类头</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="45" y="250.85" width="285" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="60" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">预训练骨干</ns0:text><ns0:text x="60" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">冻结：不更新参数</ns0:text><ns0:path d="M330,317.0 L440,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="450" y="250.85" width="290" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="465" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">新分类头</ns0:text><ns0:text x="465" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">512→3：1539 个参数</ns0:text><ns0:path d="M740,317.0 L840,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="850" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="865" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">验证</ns0:text><ns0:text x="865" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定微调范围</ns0:text><ns0:text x="100" y="464.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">阶段二：按验证证据解冻部分骨干，通常另设学习率</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">冻结参数与切换 train/eval 是不同操作；BatchNorm 统计需另外控制。</ns0:text></g></svg>
