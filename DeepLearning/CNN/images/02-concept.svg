<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>迁移学习中的骨干与分类头</title>
<desc>原创教学示意：预训练骨干|输出 512 维特征;新分类头|3 类：512×3 个权重;先训练头|另有 3 个偏置;再微调骨干|用验证集判断收益</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">迁移学习中的骨干与分类头</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">预训练骨干</text>
<text x="53" y="160" font-size="21" fill="#16324f">输出 512 维特征</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">新分类头</text>
<text x="603" y="160" font-size="21" fill="#16324f">3 类：512×3 个权重</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">先训练头</text>
<text x="53" y="330" font-size="21" fill="#16324f">另有 3 个偏置</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">再微调骨干</text>
<text x="603" y="330" font-size="21" fill="#16324f">用验证集判断收益</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">迁移学习：先冻结骨干训练新头，再考虑解冻</text><rect x="45" y="565" width="285" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="60" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">预训练骨干</text><text x="60" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">冻结：不更新参数</text><path d="M330,610 L440,610" fill="none" stroke="#718fa9" stroke-width="3"/><rect x="450" y="565" width="290" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="465" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">新分类头</text><text x="465" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">512→3：1539 个参数</text><path d="M740,610 L840,610" fill="none" stroke="#718fa9" stroke-width="3"/><rect x="850" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="865" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">验证</text><text x="865" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">决定微调范围</text><text x="100" y="710" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">阶段二：按验证证据解冻部分骨干，通常另设学习率</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">冻结参数与切换 train/eval 是不同操作；BatchNorm 统计需另外控制。</text></svg>