<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img"><title>特征金字塔的侧向投影与低分辨率上采样</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#738d9f"/></marker></defs><rect width="1160" height="620" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="45" font-size="28" fill="#16364e">特征金字塔：只上采样低分辨率路径，再逐元素相加</text><rect x="35" y="140" width="230" height="100" rx="7" fill="#e2eff8" stroke="#7895aa"/><text x="47" y="175" font-size="23" fill="#16364e">C3：高分辨率</text><text x="47" y="215" font-size="21" fill="#16364e">16×16×128</text><rect x="330" y="140" width="240" height="100" rx="7" fill="#e2f0e7" stroke="#7895aa"/><text x="342" y="175" font-size="23" fill="#16364e">1×1 侧向投影</text><text x="342" y="215" font-size="21" fill="#16364e">16×16×64</text><line x1="265" y1="190" x2="320" y2="190" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)"/><rect x="35" y="365" width="230" height="100" rx="7" fill="#e2eff8" stroke="#7895aa"/><text x="47" y="400" font-size="23" fill="#16364e">C4：低分辨率</text><text x="47" y="440" font-size="21" fill="#16364e">8×8×256</text><rect x="330" y="365" width="240" height="100" rx="7" fill="#e2f0e7" stroke="#7895aa"/><text x="342" y="400" font-size="23" fill="#16364e">1×1 投影得到 P4</text><text x="342" y="440" font-size="21" fill="#16364e">8×8×64</text><line x1="265" y1="415" x2="320" y2="415" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)"/><rect x="635" y="365" width="230" height="100" rx="7" fill="#f2e8d9" stroke="#7895aa"/><text x="647" y="400" font-size="23" fill="#16364e">仅 P4 上采样</text><text x="647" y="440" font-size="21" fill="#16364e">16×16×64</text><line x1="570" y1="415" x2="625" y2="415" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)"/><path d="M570,190 H930 V255" fill="none" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)"/><path d="M865,415 H930 V325" fill="none" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)"/><circle cx="930" cy="290" r="32" fill="#e8dcf2" stroke="#7895aa"/><text x="914" y="302" font-size="32" fill="#16364e">＋</text><line x1="963" y1="290" x2="1030" y2="290" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)"/><text x="1045" y="280" font-size="27" fill="#16364e">P3</text><text x="990" y="330" font-size="21" fill="#16364e">16×16×64</text><text x="35" y="535" font-size="22" fill="#16364e">空间尺寸对齐：16×16；通道对齐：64。高分辨率 C3 路径不做上采样。</text><text x="35" y="580" font-size="21" fill="#16364e">本图展示一次自顶向下融合；相加前还须核对采样中心、插值与边界约定。</text></g></svg>