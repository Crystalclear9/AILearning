"40.0" y="331.0" width="356.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="360.0" font-size="20" fill="#18364e">开启</text><rect x="400.0" y="331.0" width="356.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="412.0" y="360.0" font-size="20" fill="#18364e">eval</text><rect x="760.0" y="331.0" width="356.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="772.0" y="360.0" font-size="20" fill="#18364e">仍可计算参数或输入梯度</text><rect x="40.0" y="408.0" width="356.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="437.0" font-size="20" fill="#18364e">开启</text><rect x="400.0" y="408.0" width="356.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="412.0" y="437.0" font-size="20" fill="#18364e">train</text><rect x="760.0" y="408.0" width="356.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="772.0" y="437.0" font-size="20" fill="#18364e">常规训练但仍需优化器更新</text><text x="35" y="580" font-size="19" fill="#526b7c">原创教学算例；数值、定义与适用条件见图下说明。</text></g></svg>