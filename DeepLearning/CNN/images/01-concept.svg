<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>卷积窗口怎样决定输出网格：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">卷积窗口怎样决定输出网格</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="90" y="214.1" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="124" y="214.1" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="158" y="214.1" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="192" y="214.1" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="226" y="214.1" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="90" y="264.08" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="124" y="264.08" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="158" y="264.08" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="192" y="264.08" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="226" y="264.08" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="90" y="314.06" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="124" y="314.06" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="158" y="314.06" width="32" height="47.04" rx="5" fill="#83b4db" stroke="#718fa9" /><ns0:rect x="192" y="314.06" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="226" y="314.06" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="90" y="364.03999999999996" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="124" y="364.03999999999996" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="158" y="364.03999999999996" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="192" y="364.03999999999996" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="226" y="364.03999999999996" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="90" y="414.02" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="124" y="414.02" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="158" y="414.02" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="192" y="414.02" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:rect x="226" y="414.02" width="32" height="47.04" rx="5" fill="#eef5fb" stroke="#718fa9" /><ns0:path d="M300,324.35 L650,324.35" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="370" y="280.25" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">共享 3×3 核</ns0:text><ns0:rect x="700" y="243.5" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:rect x="745" y="243.5" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:rect x="790" y="243.5" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:rect x="700" y="309.65" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:rect x="745" y="309.65" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:rect x="790" y="309.65" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:rect x="700" y="375.79999999999995" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:rect x="745" y="375.79999999999995" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:rect x="790" y="375.79999999999995" width="42" height="61.74" rx="5" fill="#cfe8d8" stroke="#718fa9" /><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">无填充、步幅 1、膨胀率 1：每个方向 3 个合法起点，共 9 个窗口。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  无填充尺寸计算与窗口计数</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  填充改变边界与位置数</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入 5×5，核 3×3</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">步幅 1，膨胀率 1，填充 0</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">每方向：5−3＋1＝3</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输出位置：3×3＝9</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="979.6" width="120" height="68.4" fill="#169b8d" /><ns0:text x="895" y="964.6" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">9</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">无填充位置</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">25</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">填充 1 的位置</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">填充一时输出为五乘五；不能只更改填充选项而沿用原来的三</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">乘三尺寸。</ns0:text></ns0:svg>
