<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>卷积窗口怎样决定输出网格</title>
<desc>原创教学示意：输入 5×5|单通道，无填充;窗口 3×3|步幅 1，膨胀率 1;合法起点|每个方向有 3 个;输出 3×3|9 个位置共享同一卷积核</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">卷积窗口怎样决定输出网格</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">输入 5×5</text>
<text x="53" y="160" font-size="21" fill="#16324f">单通道，无填充</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">窗口 3×3</text>
<text x="603" y="160" font-size="21" fill="#16324f">步幅 1，膨胀率 1</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">合法起点</text>
<text x="53" y="330" font-size="21" fill="#16324f">每个方向有 3 个</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">输出 3×3</text>
<text x="603" y="330" font-size="21" fill="#16324f">9 个位置共享同一卷积核</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">5×5 输入的三乘三局部窗口与 3×3 输出</text><rect x="90" y="540" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="124" y="540" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="158" y="540" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="192" y="540" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="226" y="540" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="90" y="574" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="124" y="574" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="158" y="574" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="192" y="574" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="226" y="574" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="90" y="608" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="124" y="608" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="158" y="608" width="32" height="32" rx="5" fill="#83b4db" stroke="#718fa9"/><rect x="192" y="608" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="226" y="608" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="90" y="642" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="124" y="642" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="158" y="642" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="192" y="642" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="226" y="642" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="90" y="676" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="124" y="676" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="158" y="676" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="192" y="676" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><rect x="226" y="676" width="32" height="32" rx="5" fill="#eef5fb" stroke="#718fa9"/><path d="M300,615 L650,615" fill="none" stroke="#718fa9" stroke-width="3"/><text x="370" y="585" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">共享 3×3 核</text><rect x="700" y="560" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><rect x="745" y="560" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><rect x="790" y="560" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><rect x="700" y="605" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><rect x="745" y="605" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><rect x="790" y="605" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><rect x="700" y="650" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><rect x="745" y="650" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><rect x="790" y="650" width="42" height="42" rx="5" fill="#cfe8d8" stroke="#718fa9"/><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">无填充、步幅 1、膨胀率 1：每个方向 3 个合法起点，共 9 个窗口。</text></svg>