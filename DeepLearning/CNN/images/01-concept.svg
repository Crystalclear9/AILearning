<text x="46" y="550" font-size="27" fill="#233542" text-anchor="start">展开左上窗口</text>
<text x="365" y="550" font-size="29" fill="#276b91" text-anchor="middle">1 − 3</text>
<text x="365" y="600" font-size="30" fill="#c65f36" text-anchor="middle">−2</text>
<text x="485" y="599" font-size="30" fill="#6b7780" text-anchor="middle">+</text>
<text x="610" y="550" font-size="29" fill="#276b91" text-anchor="middle">6 − 8</text>
<text x="610" y="600" font-size="30" fill="#c65f36" text-anchor="middle">−2</text>
<text x="730" y="599" font-size="30" fill="#6b7780" text-anchor="middle">+</text>
<text x="855" y="550" font-size="29" fill="#276b91" text-anchor="middle">11 − 13</text>
<text x="855" y="600" font-size="30" fill="#c65f36" text-anchor="middle">−2</text>
<text x="1090" y="600" font-size="30" fill="#c65f36" text-anchor="middle">= −6</text>
<text x="46" y="675" font-size="26" fill="#233542" text-anchor="start">窗口向右移动一格：每行的左右差仍为 −2，所以九个输出相同。</text></g></svg>
