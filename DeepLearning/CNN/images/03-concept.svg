<rect x="955" y="180" width="68" height="68" fill="#ccdae0" stroke="white" stroke-width="2"/>
<text x="989.0" y="223.0" font-size="24" fill="#233542" text-anchor="middle">1.1</text>
<rect x="1023" y="180" width="68" height="68" fill="#b2c8d2" stroke="white" stroke-width="2"/>
