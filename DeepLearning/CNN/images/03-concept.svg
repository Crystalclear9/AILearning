<text x="46" y="671" font-size="25" fill="#233542" text-anchor="start">右下</text>
<circle cx="950" cy="663" r="8" fill="#276b91"/>
<path d="M950,663 L1025.0,663" fill="none" stroke="#c65f36" stroke-width="4" stroke-dasharray=""/>
<polyline points="1013.9472680719654,667.6730201077038 1025.0,663 1013.9472680719654,658.3269798922962" fill="none" stroke="#c65f36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1025.0" cy="663" r="5" fill="#237c75"/>
<text x="1110" y="671" font-size="25" fill="#c65f36" text-anchor="middle">+0.5</text>
<text x="940" y="648" font-size="24" fill="#276b91" text-anchor="end">4</text>
<text x="1035.0" y="648" font-size="24" fill="#237c75" text-anchor="start">4.5</text>
<text x="610" y="730" font-size="26" fill="#233542" text-anchor="middle">位置不变；修正可以为正、为负，也可以为零。</text></g></svg>
