<rect x="955" y="248" width="68" height="68" fill="#85aaba" stroke="white" stroke-width="2"/>
<text x="989.0" y="291.0" font-size="24" fill="white" text-anchor="middle">3</text>
<rect x="1023" y="248" width="68" height="68" fill="#4d859c" stroke="white" stroke-width="2"/>
<text x="1057.0" y="291.0" font-size="24" fill="white" text-anchor="middle">4.5</text>
<polyline points="210,245 360,245 360,158 820,158 820,245 920,245" fill="none" stroke="#276b91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="143" font-size="25" fill="#276b91" text-anchor="middle">恒等捷径：保留 x</text>
<path d="M210,290 L448,290" fill="none" stroke="#c65f36" stroke-width="3" stroke-dasharray=""/>
<polyline points="436.94726807196537,294.6730201077038 448,290 436.94726807196537,285.3269798922962" fill="none" stroke="#c65f36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M643,290 L920,290" fill="none" stroke="#c65f36" stroke-width="3" stroke-dasharray=""/>
<polyline points="908.9472680719654,294.6730201077038 920,290 908.9472680719654,285.3269798922962" fill="none" stroke="#c65f36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="332" y="330" font-size="24" fill="#c65f36" text-anchor="middle">计算 F(x)</text>
<text x="780" y="330" font-size="24" fill="#c65f36" text-anchor="middle">逐坐标相加</text>
