<text x="50" y="112" font-size="26" fill="#276b91" text-anchor="start">输入 x</text>
<text x="487" y="112" font-size="26" fill="#c65f36" text-anchor="start">残差 F(x)</text>
<text x="955" y="112" font-size="26" fill="#237c75" text-anchor="start">输出 x + F(x)</text>
<rect x="50" y="180" width="68" height="68" fill="#cbd9df" stroke="white" stroke-width="2"/>
<text x="84.0" y="223.0" font-size="24" fill="#233542" text-anchor="middle">1</text>
<rect x="118" y="180" width="68" height="68" fill="#a1bdc9" stroke="white" stroke-width="2"/>
