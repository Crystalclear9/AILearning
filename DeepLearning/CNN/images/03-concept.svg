<text x="152.0" y="291.0" font-size="24" fill="white" text-anchor="middle">4</text>
<rect x="485" y="180" width="68" height="68" fill="#276b91" stroke="white" stroke-width="2"/>
<text x="519.0" y="223.0" font-size="24" fill="white" text-anchor="middle">0.1</text>
<rect x="553" y="180" width="68" height="68" fill="#c65f36" stroke="white" stroke-width="2"/>
<text x="587.0" y="223.0" font-size="24" fill="white" text-anchor="middle">-0.2</text>
<rect x="485" y="248" width="68" height="68" fill="#edf0f1" stroke="white" stroke-width="2"/>
<text x="519.0" y="291.0" font-size="24" fill="#233542" text-anchor="middle">0</text>
<rect x="553" y="248" width="68" height="68" fill="#276b91" stroke="white" stroke-width="2"/>
