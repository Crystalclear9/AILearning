dth="1" /><ns0:rect x="1370" y="960" width="27" height="27" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="840" y="1040" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">16 个通道</ns0:text><ns0:text x="1160" y="1040" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">32 个通道</ns0:text></ns0:svg>
