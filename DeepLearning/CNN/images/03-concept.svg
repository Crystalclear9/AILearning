<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>残差分支与捷径如何汇合</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">残差分支与捷径如何汇合</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="294.95" width="150" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="339.04999999999995" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</ns0:text><ns0:text x="55" y="390.5" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">x</ns0:text><ns0:rect x="390" y="199.4" width="240" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="405" y="243.5" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">残差分支</ns0:text><ns0:text x="405" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">F(x)</ns0:text><ns0:path d="M190,346.4 L280,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M280,346.4 L280,258.2" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M280,258.2 L390,258.2" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M630,258.2 L800,258.2" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M800,258.2 L800,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M280,346.4 L280,449.3" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M280,449.3 L800,449.3" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M800,449.3 L800,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="460" y="434.6" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">捷径 x</ns0:text><ns0:rect x="780" y="317.0" width="45" height="66.15" rx="5" fill="#e7d7f0" stroke="#718fa9" /><ns0:text x="790" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f"><tspan x="790.0" dy="0">＋</tspan></ns0:text><ns0:path d="M825,349.34000000000003 L885,349.34000000000003" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="890" y="287.6" width="190" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="905" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输出</ns0:text><ns0:text x="905" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">x＋F(x)</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">相加处形状必须相容；若尺寸变化，捷径使用明确的投影变换。</ns0:text></g></svg>
