<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="1600.0" viewBox="0 0 1280 1600" role="img"><title>残差保留一条直路，但两路导数仍可能相消</title><rect width="1280" height="1030" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">残差保留一条直路，但两路导数仍可能相消</text><text x="60" y="112" font-size="27" fill="#19343e" text-anchor="start">先看前向：同位置相加；再看局部斜率：恒等项与残差项相加</text><text x="60" y="180" font-size="28" fill="#19343e" text-anchor="start">输入 x</text><rect x="65" y="225" width="58" height="58" fill="#e8eff2" /><text x="95.0" y="265.8" font-size="28.2" fill="#19343e" text-anchor="middle">1</text><rect x="125" y="225" width="58" height="58" fill="#e8eff2" /><text x="155.0" y="265.8" font-size="28.2" fill="#19343e" text-anchor="middle">2</text><rect x="65" y="285" width="58" height="58" fill="#e8eff2" /><text x="95.0" y="325.8" font-size="28.2" fill="#19343e" text-anchor="middle">3</text><rect x="125" y="285" width="58" height="58" fill="#e8eff2" /><text x="155.0" y="325.8" font-size="28.2" fill="#19343e" text-anchor="middle">4</text><text x="420" y="180" font-size="28" fill="#c2673f" text-anchor="start">修正 F(x)</text><rect x="430" y="225" width="63" height="63" fill="#e8eff2" /><text x="462.5" y="269.2" font-size="30.549999999999997" fill="#19343e" text-anchor="middle">0.1</text><rect x="495" y="225" width="63" height="63" fill="#e8eff2" /><text x="527.5" y="269.2" font-size="30.549999999999997" fill="#19343e" text-anchor="middle">-0.2</text><rect x="430" y="290" width="63" height="63" fill="#e8eff2" /><text x="462.5" y="334.2" font-size="30.549999999999997" fill="#19343e" text-anchor="middle">0.0</text><rect x="495" y="290" width="63" height="63" fill="#e8eff2" /><text x="527.5" y="334.2" font-size="30.549999999999997" fill="#19343e" text-anchor="middle">0.5</text><text x="960" y="180" font-size="28" fill="#5d8c79" text-anchor="start">x + F(x)</text><rect x="965" y="225" width="63" height="63" fill="#e8eff2" /><text x="997.5" y="269.2" font-size="30.549999999999997" fill="#19343e" text-anchor="middle">1.1</text><rect x="1030" y="225" width="63" height="63" fill="#e8eff2" /><text x="1062.5" y="269.2" font-size="30.549999999999997" fill="#19343e" text-anchor="middle">1.8</text><rect x="965" y="290" width="63" height="63" fill="#e8eff2" /><text x="997.5" y="334.2" font-size="30.549999999999997" fill="#19343e" text-anchor="middle">3.0</text><rect x="1030" y="290" width="63" height="63" fill="#e8eff2" /><text x="1062.5" y="334.2" font-size="30.549999999999997" fill="#19343e" text-anchor="middle">4.5</text><path d="M200.00,260.00 L300.00,260.00 L300.00,385.00 L890.00,385.00 L890.00,260.00 L945.00,260.00" fill="none" stroke="#276a80" stroke-width="4" /><text x="500" y="425" font-size="27" fill="#19343e" text-anchor="start">直连保留原坐标；下图另用一维函数检验梯度</text><line x1="210" y1="300" x2="410" y2="300" stroke="#c2673f" stroke-width="4" /><path d="M399.47,305.75 L410.00,300.00 L399.47,294.25" fill="none" stroke="#c2673f" stroke-width="4" /><line x1="580" y1="300" x2="945" y2="300" stroke="#c2673f" stroke-width="4" /><path d="M934.47,305.75 L945.00,300.00 L934.47,294.25" fill="none" stroke="#c2673f" stroke-width="4" /><line x1="60" y1="465" x2="1220" y2="465" stroke="#dbe5e8" stroke-width="2" /><text x="110" y="530" font-size="29" fill="#276a80" text-anchor="start">F(x) = 0：y = x</text><text x="730" y="530" font-size="29" fill="#c2673f" text-anchor="start">F(x) = −x：y = 0</text><line x1="150" y1="805" x2="500" y2="805" stroke="#74888d" stroke-width="2" /><line x1="150" y1="585" x2="150" y2="805" stroke="#74888d" stroke-width="2" /><line x1="150" y1="805.0" x2="500" y2="805.0" stroke="#dbe5e8" stroke-width="1" /><text x="135" y="813.0" font-size="24" fill="#19343e" text-anchor="end">-2</text><line x1="150" y1="695.0" x2="500" y2="695.0" stroke="#dbe5e8" stroke-width="1" /><text x="135" y="703.0" font-size="24" fill="#19343e" text-anchor="end">0</text><line x1="150" y1="585.0" x2="500" y2="585.0" stroke="#dbe5e8" stroke-width="1" /><text x="135" y="593.0" font-size="24" fill="#19343e" text-anchor="end">2</text><path d="M150.00,805.00 L193.75,777.50 L237.50,750.00 L281.25,722.50 L325.00,695.00 L368.75,667.50 L412.50,640.00 L456.25,612.50 L500.00,585.00" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="150.0" cy="805.0" r="4" fill="#276a80" /><circle cx="193.75" cy="777.5" r="4" fill="#276a80" /><circle cx="237.5" cy="750.0" r="4" fill="#276a80" /><circle cx="281.25" cy="722.5" r="4" fill="#276a80" /><circle cx="325.0" cy="695.0" r="4" fill="#276a80" /><circle cx="368.75" cy="667.5" r="4" fill="#276a80" /><circle cx="412.5" cy="640.0" r="4" fill="#276a80" /><circle cx="456.25" cy="612.5" r="4" fill="#276a80" /><circle cx="500.0" cy="585.0" r="4" fill="#276a80" /><text x="325" y="850" font-size="26" fill="#19343e" text-anchor="middle">输入 x：−2 → 2</text><line x1="760" y1="805" x2="1110" y2="805" stroke="#74888d" stroke-width="2" /><line x1="760" y1="585" x2="760" y2="805" stroke="#74888d" stroke-width="2" /><line x1="760" y1="805.0" x2="1110" y2="805.0" stroke="#dbe5e8" stroke-width="1" /><text x="745" y="813.0" font-size="24" fill="#19343e" text-anchor="end">-2</text><line x1="760" y1="695.0" x2="1110" y2="695.0" stroke="#dbe5e8" stroke-width="1" /><text x="745" y="703.0" font-size="24" fill="#19343e" text-anchor="end">0</text><line x1="760" y1="585.0" x2="1110" y2="585.0" stroke="#dbe5e8" stroke-width="1" /><text x="745" y="593.0" font-size="24" fill="#19343e" text-anchor="end">2</text><path d="M760.00,695.00 L803.75,695.00 L847.50,695.00 L891.25,695.00 L935.00,695.00 L978.75,695.00 L1022.50,695.00 L1066.25,695.00 L1110.00,695.00" fill="none" stroke="#c2673f" stroke-width="4" /><circle cx="760.0" cy="695.0" r="4" fill="#c2673f" /><circle cx="803.75" cy="695.0" r="4" fill="#c2673f" /><circle cx="847.5" cy="695.0" r="4" fill="#c2673f" /><circle cx="891.25" cy="695.0" r="4" fill="#c2673f" /><circle cx="935.0" cy="695.0" r="4" fill="#c2673f" /><circle cx="978.75" cy="695.0" r="4" fill="#c2673f" /><circle cx="1022.5" cy="695.0" r="4" fill="#c2673f" /><circle cx="1066.25" cy="695.0" r="4" fill="#c2673f" /><circle cx="1110.0" cy="695.0" r="4" fill="#c2673f" /><text x="935" y="850" font-size="26" fill="#19343e" text-anchor="middle">输入 x：−2 → 2</text><text x="150" y="920" font-size="29" fill="#276a80" text-anchor="start">整体斜率 1 + 0 = 1</text><text x="760" y="920" font-size="29" fill="#c2673f" text-anchor="start">整体斜率 1 − 1 = 0</text><text x="60" y="995" font-size="28" fill="#19343e" text-anchor="start">有一条恒等路径是结构事实；最终梯度是否非零还取决于另一条路径及激活。</text></g><g transform="translate(0,1030) scale(1.38889)"><metadata>
