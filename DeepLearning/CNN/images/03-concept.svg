<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>残差分支与捷径如何汇合：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">残差分支与捷径如何汇合</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="294.95" width="150" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="339.04999999999995" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</ns0:text><ns0:text x="55" y="390.5" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">x</ns0:text><ns0:rect x="390" y="199.4" width="240" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="405" y="243.5" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">残差分支</ns0:text><ns0:text x="405" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">F(x)</ns0:text><ns0:path d="M190,346.4 L280,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M280,346.4 L280,258.2" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M280,258.2 L390,258.2" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M630,258.2 L800,258.2" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M800,258.2 L800,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M280,346.4 L280,449.3" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M280,449.3 L800,449.3" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M800,449.3 L800,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="460" y="434.6" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">捷径 x</ns0:text><ns0:rect x="780" y="317.0" width="45" height="66.15" rx="5" fill="#e7d7f0" stroke="#718fa9" /><ns0:text x="790" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f"><ns0:tspan x="790.0" dy="0">＋</ns0:tspan></ns0:text><ns0:path d="M825,349.34000000000003 L885,349.34000000000003" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="890" y="287.6" width="190" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="905" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输出</ns0:text><ns0:text x="905" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">x＋F(x)</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">相加处形状必须相容；若尺寸变化，捷径使用明确的投影变换。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  残差相加要求坐标与形状相容</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  拼接不能冒充相加</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">捷径 x：B×16×H×W</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">主分支 F(x)：B×16×H×W</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">同位置逐元素相加</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输出仍为 B×16×H×W</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">通道拼接会改变输出宽度；当主分支改为三十二通道时，应显</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">式投影捷径而不是悄悄广播。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">逐元素相加</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">沿通道拼接</ns0:text><ns0:rect x="840" y="870" width="27" height="27" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="870" y="870" width="27" height="27" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="900" y="870" width="27" height="27" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="930" y="870" width="27" height="27" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="840" y="900" width="27" height="27" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="870" y="900" width="27" height="27" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="900" y="900" width="27" height="27" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="930" y="