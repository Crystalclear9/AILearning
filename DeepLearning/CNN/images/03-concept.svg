<circle cx="620.0" cy="541" r="5" fill="#237c75"/>
<text x="1110" y="549" font-size="25" fill="#c65f36" text-anchor="middle">-0.2</text>
<path d="M350,602 L1050,602" fill="none" stroke="#dce4e7" stroke-width="2" stroke-dasharray=""/>
