<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>残差分支与捷径如何汇合</title>
<desc>原创教学示意：输入 x|保留原始特征;残差分支 F(x)|学习需要补充的修正;捷径支路|直接传递或匹配尺寸;输出|逐元素相加 x＋F(x)</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">残差分支与捷径如何汇合</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">输入 x</text>
<text x="53" y="160" font-size="21" fill="#16324f">保留原始特征</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">残差分支 F(x)</text>
<text x="603" y="160" font-size="21" fill="#16324f">学习需要补充的修正</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">捷径支路</text>
<text x="53" y="330" font-size="21" fill="#16324f">直接传递或匹配尺寸</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">输出</text>
<text x="603" y="330" font-size="21" fill="#16324f">逐元素相加 x＋F(x)</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">残差汇合：主分支和捷径是并行计算路径</text><rect x="40" y="595" width="150" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="55" y="625" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">输入</text><text x="55" y="660" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">x</text><rect x="390" y="530" width="240" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="405" y="560" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">残差分支</text><text x="405" y="595" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">F(x)</text><path d="M190,630 L280,630" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M280,630 L280,570" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M280,570 L390,570" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M630,570 L800,570" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M800,570 L800,630" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M280,630 L280,700" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M280,700 L800,700" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M800,700 L800,630" fill="none" stroke="#718fa9" stroke-width="3"/><text x="460" y="690" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">捷径 x</text><rect x="780" y="610" width="45" height="45" rx="5" fill="#e7d7f0" stroke="#718fa9"/><text x="790" y="642" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">＋</text><path d="M825,632 L885,632" fill="none" stroke="#718fa9" stroke-width="3"/><rect x="890" y="590" width="190" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="905" y="620" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">输出</text><text x="905" y="655" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">x＋F(x)</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">相加处形状必须相容；若尺寸变化，捷径使用明确的投影变换。</text></svg>