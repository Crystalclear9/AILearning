<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>残差：沿原来的位置，加入一次修正</title><rect width="1200" height="750" fill="white"/><g font-family="Microsoft YaHei,sans-serif">
