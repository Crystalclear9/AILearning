2 L800,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M280,346.4 L280,449.3" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M280,449.3 L800,449.3" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M800,449.3 L800,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><text x="460" y="434.6" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">捷径 x</text><rect x="780" y="317.0" width="45" height="66.15" rx="5" fill="#e7d7f0" stroke="#718fa9" /><text x="790" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f"><tspan x="790.0" dy="0">＋</tspan></text><path d="M825,349.34000000000003 L885,349.34000000000003" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="890" y="287.6" width="190" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="905" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输出</text><text x="905" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">x＋F(x)</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">相加处形状必须相容；若尺寸变化，捷径使用明确的投影变换。</text></g></svg><text x="48" y="653.7" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  残差相加要求坐标与形状相容</text><text x="48" y="1203.7" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  拼接不能冒充相加</text><g transform="translate(30,670.7) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">捷径 x：B×16×H×W</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" 