="267.5" y="617.4" font-size="25.849999999999998" fill="#19343e" text-anchor="middle">4</text><rect x="240" y="635" width="53" height="53" fill="#e8eff2" /><text x="267.5" y="672.4" font-size="25.849999999999998" fill="#19343e" text-anchor="middle">2</text><text x="420" y="560" font-size="28" fill="#19343e" text-anchor="start">头部权重 W</text><rect x="430" y="605" width="58" height="58" fill="#e8eff2" /><text x="460.0" y="645.8" font-size="28.2" fill="#19343e" text-anchor="middle">1</text><rect x="490" y="605" width="58" height="58" fill="#e8eff2" /><text x="520.0" y="645.8" font-size="28.2" fill="#19343e" text-anchor="middle">-1</text><rect x="550" y="605" width="58" height="58" fill="#e8eff2" /><text x="580.0" y="645.8" font-size="28.2" fill="#19343e" text-anchor="middle">1</text><rect x="430" y="665" width="58" height="58" fill="#e8eff2" /><text x="460.0" y="705.8" font-size="28.2" fill="#19343e" text-anchor="middle">-1</text><rect x="490" y="665" width="58" height="58" fill="#e8eff2" /><text x="520.0" y="705.8" font-size="28.2" fill="#19343e" text-anchor="middle">1</text><rect x="550" y="665" width="58" height="58" fill="#e8eff2" /><text x="580.0" y="705.8" font-size="28.2" fill="#19343e" text-anchor="middle">0</text><text x="675" y="650" font-size="35" fill="#19343e" text-anchor="start">×</text><rect x="750" y="605" width="43" height="43" fill="#e8eff2" /><text x="772.5" y="635.6" font-size="24" fill="#19343e" text-anchor="middle">4</text><rect x="750" y="650" width="43" height="43" fill="#e8eff2" /><text x="772.5" y="680.6" font-size="24" fill="#19343e" text-anchor="middle">4</text><rect x="750" y="695" width="43" height="43" fill="#e8eff2" /><text x="772.5" y="725.6" font-size="24" fill="#19343e" text-anchor="middle">2</text><text x="830" y="650" font-size="35" fill="#19343e" text-anchor="start">=</text><rect x="900" y="605" width="58" height="58" fill="#e8eff2" /><text x="930.0" y="645.8" font-size="28.2" fill="#19343e" text-anchor="middle">2</text><rect x="900" y="665" width="58" height="58" fill="#e8eff2" /><text x="930.0" y="705.8" font-size="28.2" fill="#19343e" text-anchor="middle">0</text><text x="1005" y="650" font-size="28" fill="#19343e" text-anchor="start">logits</text><text x="60" y="790" font-size="28" fill="#19343e" text-anchor="start">只重排通道 1 内部位置：</text><rect x="500" y="750" width="43" height="43" fill="#e8eff2" /><text x="522.5" y="780.6" font-size="24" fill="#19343e" text-anchor="middle">7</text><rect x="545" y="750" width="43" height="43" fill="#e8eff2" /><text x="567.5" y="780.6" font-size="24" fill="#19343e" text-anchor="middle">5</text><rect x="500" y="795" width="43" height="43" fill="#e8eff2" /><text x="522.5" y="825.6" font-size="24" fill="#19343e" text-anchor="middle">3</text><rect x="545" y="795" width="43" height="43" fill="#e8eff2" /><text x="567.5" y="825.6" font-size="24" fill="#19343e" text-anchor="middle">1</text><line x1="620" y1="800" x2="730" y2="800" stroke="#c2673f" stroke-width="4" /><path d="M719.47,805.75 L730.00,800.00 L719.47,794.25" fill="none" stroke="#c2673f" stroke-width="4" /><text x="760" y="810" font-size="27" fill="#c2673f" text-anchor="start">均值仍为 4</text><text x="760" y="870" font-size="27" fill="#c2673f" text-anchor="start">分类头无法识别这次重排</text><text x="60" y="940" font-size="27" fill="#19343e" text-anchor="start">平均不混通道；头部才混通道。</text><text x="60" y="985" font-size="27" fill="#19343e" text-anchor="start">这里的两个分数是指定权重的手算，不是训练结果。</text></g><g transform="translate(0,1000) scale(1.38889)"><metadata>
