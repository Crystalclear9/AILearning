<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>尺寸推导贯穿整个卷积网络：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">尺寸推导贯穿整个卷积网络</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</ns0:text><ns0:text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">32×32×3</ns0:text><ns0:path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">3×3 卷积</ns0:text><ns0:text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f"><ns0:tspan x="330.0" dy="0">s=1，p=1 → 32×3</ns0:tspan><ns0:tspan x="330.0" dy="25">2</ns0:tspan></ns0:text><ns0:path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">2×2 池化</ns0:text><ns0:text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">s=2 → 16×16</ns0:text><ns0:path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">全局平均</ns0:text><ns0:text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">64 通道 → 64 维</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">图中输出通道数可由网络配置选择；空间尺寸与通道数要分别追踪。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  逐层空间尺寸与通道分开记账</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  展平与全局平均的头宽不同</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入：32×32×3</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3×3、s=1、p=1：32×32</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2×2、s=2 池化：16×16</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">64 通道经全局平均：64 维</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="1047.2578125" width="120" height="1" fill="#169b8d" /><ns0:text x="895" y="1032.2578125" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">64</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">全局平均维度</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">16384</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">直接展平维度</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">十六乘十六乘六十四的展平宽度为一万六千三百八十四，两种</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">读出需要不同分类头。</ns0:text></ns0:svg>
