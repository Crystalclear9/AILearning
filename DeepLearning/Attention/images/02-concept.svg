<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>因果掩码中的可见位置</title>
<desc>原创教学示意：查询位置 1|仅可读取键 1;查询位置 2|可读取键 1、2;查询位置 3|可读取键 1、2、3;查询位置 4|可读取键 1、2、3、4</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">因果掩码中的可见位置</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">查询位置 1</text>
<text x="53" y="160" font-size="21" fill="#16324f">仅可读取键 1</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">查询位置 2</text>
<text x="603" y="160" font-size="21" fill="#16324f">可读取键 1、2</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">查询位置 3</text>
<text x="53" y="330" font-size="21" fill="#16324f">可读取键 1、2、3</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">查询位置 4</text>
<text x="603" y="330" font-size="21" fill="#16324f">可读取键 1、2、3、4</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
