<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img"><title>参数梯度检查中的方向差分</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f"/></marker></defs><rect width="1160" height="610" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="45" font-size="28" fill="#18364e">参数梯度检查中的方向差分</text><rect x="40.0" y="100.0" width="536.0" height="74.0" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="52.0" y="129.0" font-size="20" fill="#18364e">检查对象</text><rect x="580.0" y="100.0" width="536.0" height="74.0" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="592.0" y="129.0" font-size="20" fill="#18364e">需要比较的量</text><rect x="40.0" y="177.0" width="536.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="206.0" font-size="20" fill="#18364e">解析或自动梯度</text><rect x="580.0" y="177.0" width="536.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="592.0" y="206.0" font-size="20" fill="#18364e">梯度与方向向量的内积</text><rect x="40.0" y="254.0" width="536.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="283.0" font-size="20" fill="#18364e">中心差分</text><rect x="580.0" y="254.0" width="536.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="592.0" y="283.0" font-size="20" fill="#18364e">正负扰动损失之差除以两倍步长</text><rect x="40.0" y="331.0" width="536.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="360.0" font-size="20" fill="#18364e">步长过大</text><rect x="580.0" y="331.0" width="536.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="592.0" y="360.0" font-size="20" fill="#18364e">截断误差可能主导</text><rect x="40.0" y="408.0" width="536.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="437.0" font-size="20" fill="#18364e">步长过小</text><rect x="580.0" y="408.0" width="536.0" height="74.0" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="592.0" y="437.0" font-size="20" fill="#18364e">浮点消减可能主导</text><text x="35" y="580" font-size="19" fill="#526b7c">原创教学算例；数值、定义与适用条件见图下说明。</text></g></svg>