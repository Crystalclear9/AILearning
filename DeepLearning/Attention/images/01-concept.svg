<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>查询、匹配权重与值读取：一个可手算的两候选例子</title><defs><marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#49849d"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei,sans-serif"><text x="38" y="53" font-size="30" fill="#143651">查询、匹配权重与值读取：一个可手算的两候选例子</text><rect x="60" y="260" width="170" height="110" rx="6" fill="#dfedf6" stroke="#82a5b8"/><text x="95" y="305" font-size="29" fill="#143651">查询 q</text><text x="80" y="345" font-size="24" fill="#143651">匹配两个键</text><rect x="390" y="365" width="125" height="90" rx="6" fill="#92cbb7" stroke="#82a5b8"/><text x="385" y="340" font-size="25" fill="#143651">权重 0.25</text><text x="395" y="500" font-size="28" fill="#143651">值 2</text><line x1="240" y1="300" x2="380" y2="335.0" stroke="#49849d" stroke-width="3" marker-end="url(#ar)"/><line x1="455" y1="510" x2="965" y2="580" stroke="#49849d" stroke-width="3" marker-end="url(#ar)"/><rect x="670" y="185" width="125" height="270" rx="6" fill="#92cbb7" stroke="#82a5b8"/><text x="665" y="160" font-size="25" fill="#143651">权重 0.75</text><text x="675" y="500" font-size="28" fill="#143651">值 6</text><line x1="240" y1="300" x2="660" y2="245.0" stroke="#49849d" stroke-width="3" marker-end="url(#ar)"/><line x1="735" y1="510" x2="965" y2="580" stroke="#49849d" stroke-width="3" marker-end="url(#ar)"/><rect x="950" y="520" width="200" height="115" rx="6" fill="#f5d8b6" stroke="#82a5b8"/><text x="980" y="560" font-size="26" fill="#143651">读取输出</text><text x="1020" y="610" font-size="36" fill="#143651">5</text><text x="75" y="625" font-size="26" fill="#143651">分数：0 与 ln 3</text><text x="75" y="675" font-size="25" fill="#143651">指数比例 1∶3 → 权重 0.25、0.75 → 0.25×2＋0.75×6＝5</text></g></svg>
