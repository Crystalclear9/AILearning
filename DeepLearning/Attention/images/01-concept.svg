<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2056" viewBox="0 0 1200 2056" role="img"><title>查询、匹配权重与值读取：一个可手算的两候选例子：机制、算例与边界</title><rect width="1200" height="2056" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">查询、匹配权重与值读取：一个可手算的两候选例子</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="625.75" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="745.75" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1295.75" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="545.75" viewBox="0 114 1200 590" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#49849d" /></marker></defs><g font-family="Microsoft YaHei,sans-serif"><rect x="60" y="260" width="170" height="110" rx="6" fill="#dfedf6" stroke="#82a5b8" /><text x="95" y="305" font-size="29" fill="#143651">查询 q</text><text x="80" y="345" font-size="24" fill="#143651">匹配两个键</text><rect x="390" y="365" width="125" height="90" rx="6" fill="#92cbb7" stroke="#82a5b8" /><text x="385" y="340" font-size="25" fill="#143651">权重 0.25</text><text x="395" y="500" font-size="28" fill="#143651">值 2</text><line x1="240" y1="300" x2="380" y2="335.0" stroke="#49849d" stroke-width="3" marker-end="url(#ar)" /><line x1="455" y1="510" x2="965" y2="580" stroke="#49849d" stroke-width="3" marker-end="url(#ar)" /><rect x="670" y="185" width="125" height="270" rx="6" fill="#92cbb7" stroke="#82a5b8" /><text x="665" y="160" font-size="25" fill="#143651">权重 0.75</text><text x="675" y="500" font-size="28" fill="#143651">值 6</text><line x1="240" y1="300" x2="660" y2="245.0" stroke="#49849d" stroke-width="3" marker-end="url(#ar)" /><line x1="735" y1="510" x2="965" y2="580" stroke="#49849d" stroke-width="3" marker-end="url(#ar)" /><rect x="950" y="520" width="200" height="115" rx="6" fill="#f5d8b6" stroke="#82a5b8" /><text x="980" y="560" font-size="26" fill="#143651">读取输出</text><text x="1020" y="610" font-size="36" fill="#143651">5</text><text x="75" y="625" font-size="26" fill="#143651">分数：0 与 ln 3</text><text x="75" y="675" font-size="25" fill="#143651">指数比例 1∶3 → 权重 0.25、0.75 → 0.25×2＋0.75×6＝5</text></g></svg><text x="48" y="788.75" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  指数比决定读取比例</text><text x="48" y="1338.75" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  只取最高权重项会改变输出</text><g transform="translate(30,805.75) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分数：0，ln 3</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">指数：1，3；总和 4</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">权重：0.25，0.75</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输出：0.25×2＋0.75×6＝5</text></g><g transform="translate(45,1355.75) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="889.6666666666666" width="120" height="158.33333333333334" fill="#169b8d" /><text x="895" y="874.6666666666666" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">5</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">软读取</text><rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">6</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">硬选择 v2</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">硬选择返回六，标准软读取返回五；注意力权重不等同于已选</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">中的离散索引。</tspan></text></g></svg>
