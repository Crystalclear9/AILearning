<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>同一组三个候选：先分配读取比例，再读取两个坐标</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">同一组三个候选：先分配读取比例，再读取两个坐标</text><text x="60" y="112" font-size="27" fill="#74888d" text-anchor="start">查询 q = (1, 0)，温度 1；与正文手算、代码使用同一组键和值</text><text x="60" y="185" font-size="28" fill="#19343e" text-anchor="start">候选 / 键</text><text x="405" y="185" font-size="28" fill="#19343e" text-anchor="start">指数质量</text><text x="655" y="185" font-size="28" fill="#19343e" text-anchor="start">读取比例</text><text x="945" y="185" font-size="28" fill="#19343e" text-anchor="start">两个坐标的贡献</text><text x="60" y="260" font-size="28" fill="#276a80" text-anchor="start">k1 = (0, 0)</text><text x="60" y="303" font-size="26" fill="#74888d" text-anchor="start">v1 = (1, 0)</text><rect x="405" y="234" width="55" height="28" fill="#276a80"/><text x="476" y="260" font-size="27" fill="#276a80" text-anchor="start">1</text><rect x="655" y="234" width="63.33333333333333" height="28" fill="#276a80"/><text x="733.3333333333334" y="260" font-size="26" fill="#276a80" text-anchor="start">0.1667</text><text x="945" y="260" font-size="28" fill="#276a80" text-anchor="start">(0.1667, 0)</text><text x="60" y="380" font-size="28" fill="#c2673f" text-anchor="start">k2 = (ln 2, 0)</text><text x="60" y="423" font-size="26" fill="#74888d" text-anchor="start">v2 = (0, 2)</text><rect x="405" y="354" width="110" height="28" fill="#c2673f"/><text x="531" y="380" font-size="27" fill="#c2673f" text-anchor="start">2</text><rect x="655" y="354" width="126.66666666666666" height="28" fill="#c2673f"/><text x="796.6666666666666" y="380" font-size="26" fill="#c2673f" text-anchor="start">0.3333</text><text x="945" y="380" font-size="28" fill="#c2673f" text-anchor="start">(0, 0.6667)</text><text x="60" y="500" font-size="28" fill="#5d8c79" text-anchor="start">k3 = (ln 3, 0)</text><text x="60" y="543" font-size="26" fill="#74888d" text-anchor="start">v3 = (2, 1)</text><rect x="405" y="474" width="165" height="28" fill="#5d8c79"/><text x="586" y="500" font-size="27" fill="#5d8c79" text-anchor="start">3</text><rect x="655" y="474" width="190.0" height="28" fill="#5d8c79"/><text x="860.0" y="500" font-size="26" fill="#5d8c79" text-anchor="start">0.5</text><text x="945" y="500" font-size="28" fill="#5d8c79" text-anchor="start">(1, 0.5)</text><line x1="60" y1="620" x2="1220" y2="620" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="675" font-size="27" fill="#19343e" text-anchor="start">指数质量 1 + 2 + 3 = 6；读取比例为六分之一、三分之一、二分之一。</text><text x="60" y="730" font-size="27" fill="#276a80" text-anchor="start">两个坐标分别相加：输出 o = (1.1667, 1.1667)，不是最大权重候选的值。</text></g></svg>
