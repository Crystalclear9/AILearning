<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1927" viewBox="0 0 1200 1927" role="img"><title>多头的形状拆分与拼接：机制、算例与边界</title><rect width="1200" height="1927" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">多头的形状拆分与拼接</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="497.175" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="617.175" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1167.175" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="417.175" viewBox="0 166 1200 451" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="40" y="265.55" width="180" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</text><text x="55" y="361.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×8</text><path d="M220,317.0 L320,243.5" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M220,317.0 L320,412.54999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="330" y="192.05" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="345" y="236.15" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">头 1</text><text x="345" y="287.6" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×4</text><rect x="330" y="383.15" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="345" y="427.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">头 2</text><text x="345" y="478.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×4</text><path d="M550,250.85 L690,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M550,441.95 L690,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="700" y="265.55" width="290" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="715" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">特征轴拼接</text><text x="715" y="361.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×(4＋4)</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">每个头各有 T×T 权重；拼接后再做输出投影，不能沿时间轴拼接。</text></g></svg><text x="48" y="660.175" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  两个头的特征维度守恒</text><text x="48" y="1210.175" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  拼接应沿特征轴而非时间轴</text><g transform="translate(30,677.175) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">模型宽度 8；头数 2</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">每头维度：8÷2＝4</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">每头输出：B×T×4</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">特征拼接：B×T×(4＋4)</text></g><g transform="translate(45,1227.175) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">沿时间拼接即使元素总数相同，也把位置与特征语义混淆。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">正确：T=3，宽度 8</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">误拼：T=6，宽度 4</text><rect x="820" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="847" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="874" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="901" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="928" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="955" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="982" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="1009" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="820" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="847" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="874" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="901" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="928" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1"