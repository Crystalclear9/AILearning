<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>多头的形状拆分与拼接：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">多头的形状拆分与拼接</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="265.55" width="180" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</ns0:text><ns0:text x="55" y="361.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×8</ns0:text><ns0:path d="M220,317.0 L320,243.5" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M220,317.0 L320,412.54999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="330" y="192.05" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="345" y="236.15" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">头 1</ns0:text><ns0:text x="345" y="287.6" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×4</ns0:text><ns0:rect x="330" y="383.15" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="345" y="427.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">头 2</ns0:text><ns0:text x="345" y="478.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×4</ns0:text><ns0:path d="M550,250.85 L690,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M550,441.95 L690,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="700" y="265.55" width="290" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="715" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">特征轴拼接</ns0:text><ns0:text x="715" y="361.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×(4＋4)</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">每个头各有 T×T 权重；拼接后再做输出投影，不能沿时间轴拼接。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  两个头的特征维度守恒</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  拼接应沿特征轴而非时间轴</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">模型宽度 8；头数 2</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">每头维度：8÷2＝4</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">每头输出：B×T×4</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">特征拼接：B×T×(4＋4)</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">沿时间拼接即使元素总数相同，也把位置与特征语义混淆。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">正确：T=3，宽度 8</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">误拼：T=6，宽度 4</ns0:text><ns0:rect x="820" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="847" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="874" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="901" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="928" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="955" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="982" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1009" y="875" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="820" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="847" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="874" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="901" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="928" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="955" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="982" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1009" y="902" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="820" y="929" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="847" y="929" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="874" y="929" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="901" y="929" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="928" y="929" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="955" y="929" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="982" y="929" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1009" y="929" width="24" height="24" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1170" y="875" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1197" y="875" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1224" y="875" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1251" y="875" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1170" y="902" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1197" y="902" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1224" y="902" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1251" y="902" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1170" y="929" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1197" y="929" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1224" y="929" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1251" y="929" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1170" y="956" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1197" y="956" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1224" y="956" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1251" y="956" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1170" y="983" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1197" y="983" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1224" y="983" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1251" y="983" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1170" y="1010" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1197" y="1010" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1224" y="1010" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1251" y="1010" width="24" height="24" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="820" y="1050" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">24 个元素</ns0:text><ns0:text x="1170" y="1080" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">仍是 24 个元素</ns0:text></ns0:svg>
