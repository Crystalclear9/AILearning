<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>多头的形状拆分与拼接</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">多头的形状拆分与拼接</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="265.55" width="180" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</ns0:text><ns0:text x="55" y="361.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×8</ns0:text><ns0:path d="M220,317.0 L320,243.5" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M220,317.0 L320,412.54999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="330" y="192.05" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="345" y="236.15" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">头 1</ns0:text><ns0:text x="345" y="287.6" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×4</ns0:text><ns0:rect x="330" y="383.15" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="345" y="427.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">头 2</ns0:text><ns0:text x="345" y="478.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×4</ns0:text><ns0:path d="M550,250.85 L690,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M550,441.95 L690,317.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="700" y="265.55" width="290" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="715" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">特征轴拼接</ns0:text><ns0:text x="715" y="361.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B×T×(4＋4)</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">每个头各有 T×T 权重；拼接后再做输出投影，不能沿时间轴拼接。</ns0:text></g></svg>
