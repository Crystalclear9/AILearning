idth="46" height="46" fill="#e2eef4"/><text x="884.0" y="269.0" font-size="27" fill="#233642" text-anchor="middle">0</text><rect x="908" y="235" width="46" height="46" fill="#e2eef4"/><text x="932.0" y="269.0" font-size="27" fill="#233642" text-anchor="middle">1</text><rect x="956" y="235" width="46" height="46" fill="#e2eef4"/><text x="980.0" y="269.0" font-size="27" fill="#233642" text-anchor="middle">2</text><rect x="860" y="283" width="46" height="46" fill="#fae6db"/><text x="884.0" y="317.0" font-size="27" fill="#233642" text-anchor="middle">3</text><rect x="908" y="283" width="46" height="46" fill="#fae6db"/><text x="932.0" y="317.0" font-size="27" fill="#233642" text-anchor="middle">4</text><rect x="956" y="283" width="46" height="46" fill="#fae6db"/><text x="980.0" y="317.0" font-size="27" fill="#233642" text-anchor="middle">5</text><rect x="860" y="331" width="46" height="46" fill="#e2eef4"/><text x="884.0" y="365.0" font-size="27" fill="#233642" text-anchor="middle">6</text><rect x="908" y="331" width="46" height="46" fill="#e2eef4"/><text x="932.0" y="365.0" font-size="27" fill="#233642" text-anchor="middle">7</text><rect x="956" y="331" width="46" height="46" fill="#e2eef4"/><text x="980.0" y="365.0" font-size="27" fill="#233642" text-anchor="middle">8</text><rect x="860" y="379" width="46" height="46" fill="#fae6db"/><text x="884.0" y="413.0" font-size="27" fill="#233642" text-anchor="middle">9</text><rect x="908" y="379" width="46" height="46" fill="#fae6db"/><text x="932.0" y="413.0" font-size="27" fill="#233642" text-anchor="middle">10</text><rect x="956" y="379" width="46" height="46" fill="#fae6db"/><text x="980.0" y="413.0" font-size="27" fill="#233642" text-anchor="middle">11</text><text x="835" y="475" font-size="26" fill="#bc5b31" text-anchor="start">第 2 行拿到 [3, 4, 5]</text><text x="835" y="520" font-size="26" fill="#246d91" text-anchor="start">应当是 [6, 7, 8]</text><text x="50" y="470" font-size="25" fill="#687b86" text-anchor="start">一行始终表示一个位置。</text><text x="50" y="515" font-size="25" fill="#687b86" text-anchor="start">蓝：前三维；橙：后三维。</text><line x1="60" y1="730" x2="1140" y2="730" stroke="#dce5e9" stroke-width="2"/><text x="60" y="785" font-size="27" fill="#233642" text-anchor="start">正确顺序：先拆末轴 → 交换位置轴与头轴；合头时做逆操作。</text><text x="60" y="840" font-size="25" fill="#687b86" text-anchor="start">图只跟踪已经投影的数值；每头如何读取键和值是后续的注意力计算。</text></g></svg>
