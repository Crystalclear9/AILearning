"340.0" width="90" height="110.0" fill="#b56b47"/><text x="905" y="322.0" font-size="25" fill="#b56b47" text-anchor="middle">0.3333</text><text x="905" y="490" font-size="26" fill="#718e98" text-anchor="middle">值 1</text><rect x="1000" y="395.0" width="90" height="55.0" fill="#b56b47"/><text x="1045" y="377.0" font-size="25" fill="#b56b47" text-anchor="middle">0.1667</text><text x="1045" y="490" font-size="26" fill="#718e98" text-anchor="middle">值 3</text><line x1="720" y1="450" x2="1130" y2="450" stroke="#718e98" stroke-width="2"/><text x="720" y="565" font-size="29" fill="#b56b47" text-anchor="start">读取 = 0.8333</text><line x1="60" y1="620" x2="1220" y2="620" stroke="#e3e8ee" stroke-width="2"/><text x="60" y="674" font-size="28" fill="#283341" text-anchor="start">拼接保留 (1.8333, 0.8333)；输出投影取两头之差，可得到 1。</text><text x="60" y="730" font-size="26" fill="#718e98" text-anchor="start">先平均只留下 1.3333，头之间的差异已被抹去；两种接口的表示约束不同。</text></g></svg></svg>