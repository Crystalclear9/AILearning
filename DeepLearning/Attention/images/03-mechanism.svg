<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="651" viewBox="0 0 1200 651" role="img"><title>查询键的共同基变换可以保持点积分数</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="651" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">查询键的共同基变换可以保持点积分数</text><text x="100" y="130" font-size="24" fill="#213447">坐标缩放算例：A = diag(2, 0.5)</text><line x1="120" y1="560" x2="520" y2="560" stroke="#2865a0" stroke-width="3" /><line x1="120" y1="560" x2="120" y2="210" stroke="#2865a0" stroke-width="3" /><line x1="120" y1="560" x2="158" y2="490" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="120" y1="560" x2="234" y2="420" stroke="#cf7432" stroke-width="3" marker-end="url(#arr)" /><text x="200" y="230" font-size="25" fill="#213447">原坐标</text><text x="180" y="615" font-size="24" fill="#213447">q·k = 11</text><line x1="670" y1="560" x2="1070" y2="560" stroke="#2865a0" stroke-width="3" /><line x1="670" y1="560" x2="670" y2="210" stroke="#2865a0" stroke-width="3" /><line x1="670" y1="560" x2="746" y2="525" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="670" y1="560" x2="727.0" y2="280" stroke="#cf7432" stroke-width="3" marker-end="url(#arr)" /><text x="750" y="230" font-size="25" fill="#213447">成对变换后</text><text x="730" y="615" font-size="24" fill="#213447">q新·k新 = 11</text></g></svg>
