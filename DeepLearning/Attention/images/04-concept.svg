<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>在线 softmax：更换行最大值时，旧统计必须一起缩放：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">在线 softmax：更换行最大值时，旧统计必须一起缩放</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#49849d" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei,sans-serif"><ns0:text x="90" y="140" font-size="25" fill="#143651">第一块：分数 0、ln 2；值 2、4</ns0:text><ns0:text x="720" y="140" font-size="25" fill="#143651">新块：分数 ln 4；值 8</ns0:text><ns0:rect x="150" y="395" width="110" height="75" rx="6" fill="#8ac9b4" stroke="#82a5b8" /><ns0:text x="185" y="375" font-size="30" fill="#143651">1</ns0:text><ns0:rect x="340" y="320" width="110" height="150" rx="6" fill="#8ac9b4" stroke="#82a5b8" /><ns0:text x="375" y="300" font-size="30" fill="#143651">2</ns0:text><ns0:rect x="850" y="170" width="110" height="300" rx="6" fill="#efb36f" stroke="#82a5b8" /><ns0:text x="1000" y="210" font-size="30" fill="#143651">4</ns0:text><ns0:text x="120" y="520" font-size="25" fill="#143651">原指数规模 1、2</ns0:text><ns0:text x="795" y="520" font-size="25" fill="#143651">原指数规模 4</ns0:text><ns0:text x="90" y="575" font-size="25" fill="#143651">旧基准 ln 2：l=1.5，u=5</ns0:text><ns0:text x="90" y="620" font-size="25" fill="#143651">新基准 ln 4：旧 l、u 均乘 0.5</ns0:text><ns0:line x1="540" y1="595" x2="690" y2="595" stroke="#49849d" stroke-width="3" marker-end="url(#ar)" /><ns0:text x="720" y="575" font-size="25" fill="#143651">l=0.75＋1=1.75</ns0:text><ns0:text x="720" y="620" font-size="25" fill="#143651">u=2.5＋8=10.5</ns0:text><ns0:text x="360" y="695" font-size="28" fill="#143651">最终输出 u÷l = 10.5÷1.75 = 6</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  三候选在线归一化算例</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  分块分别归一化后平均是另一目标</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分数：0、ln 2、ln 4；值：2、4、8</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第一块：m=ln 2，l=1.5，u=5</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">换基准乘 0.5；合并新项</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">l=1.75，u=10.5；输出 6</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">6</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">正确全局输出</ns0:text><ns0:rect x="1220" y="868.5555555555555" width="120" height="179.44444444444446" fill="#e3a461" /><ns0:text x="1215" y="853.5555555555555" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">5.6667</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两块输出平均</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">第一块输出为三分之十即约 3.333，新块为八；两者平均约</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">5.667，不等于全局输出六。</ns0:text></ns0:svg>
