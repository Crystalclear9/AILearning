<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><ns0:title>在线 softmax：更换行最大值时，旧统计必须一起缩放</ns0:title><ns0:defs><ns0:marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#49849d" /></ns0:marker></ns0:defs><ns0:rect width="1200" height="750" fill="#f5faff" /><ns0:rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0" /><ns0:g font-family="Microsoft YaHei,sans-serif"><ns0:text x="38" y="53" font-size="30" fill="#143651">在线 softmax：更换行最大值时，旧统计必须一起缩放</ns0:text><ns0:text x="90" y="140" font-size="25" fill="#143651">第一块：分数 0、ln 2；值 2、4</ns0:text><ns0:text x="720" y="140" font-size="25" fill="#143651">新块：分数 ln 4；值 8</ns0:text><ns0:rect x="150" y="395" width="110" height="75" rx="6" fill="#8ac9b4" stroke="#82a5b8" /><ns0:text x="185" y="375" font-size="30" fill="#143651">1</ns0:text><ns0:rect x="340" y="320" width="110" height="150" rx="6" fill="#8ac9b4" stroke="#82a5b8" /><ns0:text x="375" y="300" font-size="30" fill="#143651">2</ns0:text><ns0:rect x="850" y="170" width="110" height="300" rx="6" fill="#efb36f" stroke="#82a5b8" /><ns0:text x="1000" y="210" font-size="30" fill="#143651">4</ns0:text><ns0:text x="120" y="520" font-size="25" fill="#143651">原指数规模 1、2</ns0:text><ns0:text x="795" y="520" font-size="25" fill="#143651">原指数规模 4</ns0:text><ns0:text x="90" y="575" font-size="25" fill="#143651">旧基准 ln 2：l=1.5，u=5</ns0:text><ns0:text x="90" y="620" font-size="25" fill="#143651">新基准 ln 4：旧 l、u 均乘 0.5</ns0:text><ns0:line x1="540" y1="595" x2="690" y2="595" stroke="#49849d" stroke-width="3" marker-end="url(#ar)" /><ns0:text x="720" y="575" font-size="25" fill="#143651">l=0.75＋1=1.75</ns0:text><ns0:text x="720" y="620" font-size="25" fill="#143651">u=2.5＋8=10.5</ns0:text><ns0:text x="360" y="695" font-size="28" fill="#143651">最终输出 u÷l = 10.5÷1.75 = 6</ns0:text></ns0:g></ns0:svg>
