<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="1470.0" viewBox="0 0 1280 1470" role="img"><title>在线 softmax：新最大值到来，旧质量与旧值和一起换单位</title><rect width="1280" height="900" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">在线 softmax：新最大值到来，旧质量与旧值和一起换单位</text><text x="60" y="112" font-size="26" fill="#19343e" text-anchor="start">分数 (0, ln 2, ln 4)，值 (2, 4, 8)；先处理前两项，再接收第三项</text><text x="85" y="180" font-size="29" fill="#19343e" text-anchor="start">第一块：基准 ln 2</text><text x="690" y="180" font-size="29" fill="#19343e" text-anchor="start">合并：基准升至 ln 4</text><rect x="120" y="320.0" width="75" height="80.0" fill="#276a80" /><text x="157" y="425" font-size="26" fill="#19343e" text-anchor="middle">值 2</text><text x="157" y="310.0" font-size="26" fill="#19343e" text-anchor="middle">0.5</text><rect x="285" y="240.0" width="75" height="160.0" fill="#276a80" /><text x="322" y="425" font-size="26" fill="#19343e" text-anchor="middle">值 4</text><text x="322" y="230.0" font-size="26" fill="#19343e" text-anchor="middle">1.0</text><rect x="720" y="360.0" width="75" height="40.0" fill="#276a80" /><text x="757" y="425" font-size="26" fill="#19343e" text-anchor="middle">值 2</text><text x="757" y="350.0" font-size="26" fill="#19343e" text-anchor="middle">0.25</text><rect x="870" y="320.0" width="75" height="80.0" fill="#276a80" /><text x="907" y="425" font-size="26" fill="#19343e" text-anchor="middle">值 4</text><text x="907" y="310.0" font-size="26" fill="#19343e" text-anchor="middle">0.5</text><rect x="1020" y="240" width="75" height="160" fill="#c2673f" /><text x="1057" y="425" font-size="26" fill="#19343e" text-anchor="middle">值 8</text><text x="1057" y="230" font-size="26" fill="#19343e" text-anchor="middle">1</text><line x1="465" y1="300" x2="650" y2="300" stroke="#276a80" stroke-width="4" /><path d="M639.47,305.75 L650.00,300.00 L639.47,294.25" fill="none" stroke="#276a80" stroke-width="4" /><text x="555" y="245" font-size="26" fill="#276a80" text-anchor="middle">旧项 × 0.5</text><text x="85" y="500" font-size="28" fill="#19343e" text-anchor="start">分母 ℓ = 0.5 + 1 = 1.5</text><text x="85" y="555" font-size="27" fill="#19343e" text-anchor="start">值和 u = 0.5×2 + 1×4 = 5</text><text x="690" y="500" font-size="26" fill="#19343e" text-anchor="start">分母 ℓ = 0.25 + 0.5 + 1 = 1.75</text><text x="690" y="555" font-size="26" fill="#19343e" text-anchor="start">值和 u = 0.25×2 + 0.5×4 + 1×8</text><text x="900" y="600" font-size="28" fill="#19343e" text-anchor="start">= 10.5</text><line x1="60" y1="635" x2="1220" y2="635" stroke="#dbe5e8" stroke-width="2" /><text x="60" y="700" font-size="29" fill="#19343e" text-anchor="start">最终概率：</text><text x="310" y="690" font-size="26" fill="#276a80" text-anchor="middle">1</text><line x1="288" y1="700" x2="332" y2="700" stroke="#276a80" stroke-width="1.7" /><text x="310" y="729" font-size="26" fill="#276a80" text-anchor="middle">7</text><text x="352" y="710" font-size="28" fill="#19343e" text-anchor="start">× 2</text><text x="490" y="690" font-size="26" fill="#276a80" text-anchor="middle">2</text><line x1="468" y1="700" x2="512" y2="700" stroke="#276a80" stroke-width="1.7" /><text x="490" y="729" font-size="26" fill="#276a80" text-anchor="middle">7</text><text x="532" y="710" font-size="28" fill="#19343e" text-anchor="start">× 4</text><text x="670" y="690" font-size="26" fill="#276a80" text-anchor="middle">4</text><line x1="648" y1="700" x2="692" y2="700" stroke="#276a80" stroke-width="1.7" /><text x="670" y="729" font-size="26" fill="#276a80" text-anchor="middle">7</text><text x="712" y="710" font-size="28" fill="#19343e" text-anchor="start">× 8</text><text x="430" y="710" font-size="30" fill="#19343e" text-anchor="start">+</text><text x="610" y="710" font-size="30" fill="#19343e" text-anchor="start">+</text><text x="890" y="710" font-size="36" fill="#c2673f" text-anchor="start">= 6</text><text x="60" y="800" font-size="27" fill="#19343e" text-anchor="start">若将两个块的独立输出平均：</text><text x="720" y="800" font-size="30" fill="#c2673f" text-anchor="start">约 5.667 ≠ 6</text><text x="60" y="860" font-size="26" fill="#19343e" text-anchor="start">条高始终表示当前基准下的指数质量；同一正因子必须同时作用于分子和分母。</text></g><g transform="translate(0,900) scale(1.38889)"><metadata>
