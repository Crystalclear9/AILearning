<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2074" viewBox="0 0 1200 2074" role="img"><title>在线 softmax：更换行最大值时，旧统计必须一起缩放：机制、算例与边界</title><rect width="1200" height="2074" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">在线 softmax：更换行最大值时，旧统计必须一起缩放</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="644.25" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="764.25" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1314.25" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="564.25" viewBox="0 100 1200 610" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#49849d" /></marker></defs><g font-family="Microsoft YaHei,sans-serif"><text x="90" y="140" font-size="25" fill="#143651">第一块：分数 0、ln 2；值 2、4</text><text x="720" y="140" font-size="25" fill="#143651">新块：分数 ln 4；值 8</text><rect x="150" y="395" width="110" height="75" rx="6" fill="#8ac9b4" stroke="#82a5b8" /><text x="185" y="375" font-size="30" fill="#143651">1</text><rect x="340" y="320" width="110" height="150" rx="6" fill="#8ac9b4" stroke="#82a5b8" /><text x="375" y="300" font-size="30" fill="#143651">2</text><rect x="850" y="170" width="110" height="300" rx="6" fill="#efb36f" stroke="#82a5b8" /><text x="1000" y="210" font-size="30" fill="#143651">4</text><text x="120" y="520" font-size="25" fill="#143651">原指数规模 1、2</text><text x="795" y="520" font-size="25" fill="#143651">原指数规模 4</text><text x="90" y="575" font-size="25" fill="#143651">旧基准 ln 2：l=1.5，u=5</text><text x="90" y="620" font-size="25" fill="#143651">新基准 ln 4：旧 l、u 均乘 0.5</text><line x1="540" y1="595" x2="690" y2="595" stroke="#49849d" stroke-width="3" marker-end="url(#ar)" /><text x="720" y="575" font-size="25" fill="#143651">l=0.75＋1=1.75</text><text x="720" y="620" font-size="25" fill="#143651">u=2.5＋8=10.5</text><text x="360" y="695" font-size="28" fill="#143651">最终输出 u÷l = 10.5÷1.75 = 6</text></g></svg><text x="48" y="807.25" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  三候选在线归一化算例</text><text x="48" y="1357.25" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  分块分别归一化后平均是另一目标</text><g transform="translate(30,824.25) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分数：0、ln 2、ln 4；值：2、4、8</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第一块：m=ln 2，l=1.5，u=5</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">换基准乘 0.5；合并新项</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">l=1.75，u=10.5；输出 6</text></g><g transform="translate(45,1374.25) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">6</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">正确全局输出</text><rect x="1220" y="868.5555555555555" width="120" height="179.44444444444446" fill="#e3a461" /><text x="1215" y="853.5555555555555" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">5.6667</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两块输出平均</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">第一块输出为三分之十即约 3.333，新块为八；两者平均约</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">5.667，不等于全局输出六。</tspan></text></g></svg>
