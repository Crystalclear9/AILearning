<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img"><title>旋转位置编码保留相对角度</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f"/></marker></defs><rect width="1160" height="610" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="45" font-size="28" fill="#18364e">旋转位置编码保留相对角度</text><rect x="40.0" y="100" width="356.0" height="82" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="52.0" y="129" font-size="20" fill="#18364e">位置</text><rect x="400.0" y="100" width="356.0" height="82" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="412.0" y="129" font-size="20" fill="#18364e">旋转角度</text><rect x="760.0" y="100" width="356.0" height="82" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="772.0" y="129" font-size="20" fill="#18364e">相对位置</text><rect x="40.0" y="185" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="214" font-size="20" fill="#18364e">查询位置 m</text><rect x="400.0" y="185" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="412.0" y="214" font-size="20" fill="#18364e">mθ</text><rect x="760.0" y="185" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="772.0" y="214" font-size="20" fill="#18364e">与键位置作差</text><rect x="40.0" y="270" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="299" font-size="20" fill="#18364e">键位置 n</text><rect x="400.0" y="270" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="412.0" y="299" font-size="20" fill="#18364e">nθ</text><rect x="760.0" y="270" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="772.0" y="299" font-size="20" fill="#18364e">点积依赖 (n−m)θ</text><rect x="40.0" y="355" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="384" font-size="20" fill="#18364e">两者同移 c</text><rect x="400.0" y="355" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="412.0" y="384" font-size="20" fill="#18364e">各增加 cθ</text><rect x="760.0" y="355" width="356.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="772.0" y="384" font-size="20" fill="#18364e">角度差保持不变</text><text x="35" y="580" font-size="19" fill="#526b7c">原创教学算例；数值、定义与适用条件见图下说明。</text></g></svg>