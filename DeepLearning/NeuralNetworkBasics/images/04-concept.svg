<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1936" viewBox="0 0 1200 1936" role="img"><title>用单批数据定位训练故障：机制、算例与边界</title><rect width="1200" height="1936" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">用单批数据定位训练故障</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="506.425" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="626.425" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1176.425" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="426.425" viewBox="0 179 1200 461" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><text x="70" y="230" font-size="30" fill="#17374e" font-family="Microsoft YaHei,sans-serif">独立 logit</text><text x="70" y="300" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">z1=0</text><text x="70" y="343" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">y1=0</text><text x="70" y="420" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">z2=0</text><text x="70" y="463" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">y2=1</text><text x="465" y="230" font-size="30" fill="#17374e" font-family="Microsoft YaHei,sans-serif">平均 BCE</text><text x="465" y="300" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">概率都为 0.5</text><text x="465" y="343" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">损失 0.6931</text><text x="895" y="230" font-size="30" fill="#17374e" font-family="Microsoft YaHei,sans-serif">更新后</text><text x="895" y="300" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">z1=−0.1</text><text x="895" y="343" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">z2=＋0.1</text><text x="895" y="420" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">概率沿正确方向</text><text x="895" y="463" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">损失 0.6444</text><line x1="315" y1="350" x2="445" y2="350" stroke="#15988d" stroke-width="4" /><text x="425" y="340" font-size="40" fill="#17374e" font-family="Microsoft YaHei,sans-serif">›</text><line x1="740" y1="350" x2="875" y2="350" stroke="#15988d" stroke-width="4" /><text x="855" y="340" font-size="40" fill="#17374e" font-family="Microsoft YaHei,sans-serif">›</text><path d="M650 450 V555 H210 V470" fill="none" stroke="#d69553" stroke-width="4" /><text x="330" y="610" font-size="25" fill="#9b642e" font-family="Microsoft YaHei,sans-serif">反向梯度：[0.25，−0.25]；学习率 0.4</text></svg><text x="48" y="669.425" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  独立 logit 的诊断算例</text><text x="48" y="1219.425" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  拟合成功不能替代泛化检验</text><g transform="translate(30,686.425) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">两样本标签 [0,1]；logit 都为 0</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">平均损失 ln 2≈0.6931</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">对两 logit 的梯度：[0.25,−0.25]</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">步长 0.4 后损失约为 0.6444</text></g><g transform="translate(45,1236.425) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">这是一项诊断能力检验，不是对测试性能、标签真实性或数据</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">泄漏的证明。</tspan></text><text x="805" y="850" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">小批训练</text><circle cx="830" cy="890" r="13" fill="#15988d" /><circle cx="890" cy="890" r="13" fill="#15988d" /><circle cx="950" cy="890" r="13" fill="#15988d" /><circle cx="1010" cy="890" r="13" fill="#15988d" /><circle cx="1070" cy="890" r="13" fill="#15988d" /><circle cx="1130" cy="890" r="13" fill="#15988d" /><circle cx="1190" cy="890" r="13" fill="#15988d" /><circle cx="1250" cy="890" r="13" fill="#15988d" /><circle cx="1310" cy="890" r="13" fill="#15988d" /><circle cx="1370" cy="890" r="13" fill="#15988d" /><text x="805" y="980" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">未见测试</text><circle cx="830" cy="1020" r="13" fill="#15988d" /><circle cx="890" cy="1020" r="13" fill="#15988d" /><circle cx="950" cy="1020" r="13" fill="#15988d" /><circle cx="1010" cy="1020" r="13" fill="#15988d" /><circle cx="1070" cy="1020" r="13" fill="#15988d" /><circle cx="1130" cy="1020" r="13" fill="#15988d" /><circle cx="1190" cy="1020" r="13" fill="#15988d" /><circle cx="1250" cy="1020" r="13" fill="#15988d" /><circle cx="1310" cy="1020" r="13" fill="#e2a15f" /><circle cx="1370" cy="1020" r="13" fill="#e2a15f" /><text x="805" y="1100" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">示例：训练 0 错；测试 10 个中错 2 个</text></g></svg>
