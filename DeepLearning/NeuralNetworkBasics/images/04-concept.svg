<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>用单批数据定位训练故障</title>
<desc>原创教学示意：固定小批次|保持样本与标签不变;前向检查|损失和 logit 是否有限;反向检查|关键参数是否收到梯度;拟合检查|训练损失能否明显下降</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">用单批数据定位训练故障</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">固定小批次</text>
<text x="53" y="160" font-size="21" fill="#16324f">保持样本与标签不变</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">前向检查</text>
<text x="603" y="160" font-size="21" fill="#16324f">损失和 logit 是否有限</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">反向检查</text>
<text x="53" y="330" font-size="21" fill="#16324f">关键参数是否收到梯度</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">拟合检查</text>
<text x="603" y="330" font-size="21" fill="#16324f">训练损失能否明显下降</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">数值诊断的分支：先定位失败检查点，再扩大训练</text><rect x="40" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="55" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">固定小批次</text><text x="55" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">控制数据与随机性</text><path d="M260,608 L305,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="276" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="315" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="330" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">前向值有限？</text><text x="330" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">否 → 查输入与损失</text><path d="M535,608 L580,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="551" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="590" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="605" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">关键梯度存在？</text><text x="605" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">否 → 查计算图与更新</text><path d="M810,608 L855,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="826" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="865" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="880" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">小批损失下降？</text><text x="880" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">否 → 查标签与优化配置</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">通过小批拟合只是排错证据，不代表泛化、数据语义或评价协议已经正确。</text></svg>