<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>用单批数据定位训练故障：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">用单批数据定位训练故障</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:text x="70" y="230" font-size="30" fill="#17374e" font-family="Microsoft YaHei,sans-serif">独立 logit</ns0:text><ns0:text x="70" y="300" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">z1=0</ns0:text><ns0:text x="70" y="343" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">y1=0</ns0:text><ns0:text x="70" y="420" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">z2=0</ns0:text><ns0:text x="70" y="463" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">y2=1</ns0:text><ns0:text x="465" y="230" font-size="30" fill="#17374e" font-family="Microsoft YaHei,sans-serif">平均 BCE</ns0:text><ns0:text x="465" y="300" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">概率都为 0.5</ns0:text><ns0:text x="465" y="343" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">损失 0.6931</ns0:text><ns0:text x="895" y="230" font-size="30" fill="#17374e" font-family="Microsoft YaHei,sans-serif">更新后</ns0:text><ns0:text x="895" y="300" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">z1=−0.1</ns0:text><ns0:text x="895" y="343" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">z2=＋0.1</ns0:text><ns0:text x="895" y="420" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">概率沿正确方向</ns0:text><ns0:text x="895" y="463" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">损失 0.6444</ns0:text><ns0:line x1="315" y1="350" x2="445" y2="350" stroke="#15988d" stroke-width="4" /><ns0:text x="425" y="340" font-size="40" fill="#17374e" font-family="Microsoft YaHei,sans-serif">›</ns0:text><ns0:line x1="740" y1="350" x2="875" y2="350" stroke="#15988d" stroke-width="4" /><ns0:text x="855" y="340" font-size="40" fill="#17374e" font-family="Microsoft YaHei,sans-serif">›</ns0:text><ns0:path d="M650 450 V555 H210 V470" fill="none" stroke="#d69553" stroke-width="4" /><ns0:text x="330" y="610" font-size="25" fill="#9b642e" font-family="Microsoft YaHei,sans-serif">反向梯度：[0.25，−0.25]；学习率 0.4</ns0:text></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  独立 logit 的诊断算例</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  拟合成功不能替代泛化检验</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">两样本标签 [0,1]；logit 都为 0</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">平均损失 ln 2≈0.6931</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">对两 logit 的梯度：[0.25,−0.25]</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">步长 0.4 后损失约为 0.6444</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">这是一项诊断能力检验，不是对测试性能、标签真实性或数据</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">泄漏的证明。</ns0:text><ns0:text x="805" y="850" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">小批训练</ns0:text><ns0:circle cx="830" cy="890" r="13" fill="#15988d" /><ns0:circle cx="890" cy="890" r="13" fill="#15988d" /><ns0:circle cx="950" cy="890" r="13" fill="#15988d" /><ns0:circle cx="1010" cy="890" r="13" fill="#15988d" /><ns0:circle cx="1070" cy="890" r="13" fill="#15988d" /><ns0:circle cx="1130" cy="890" r="13" fill="#15988d" /><ns0:circle cx="1190" cy="890" r="13" fill="#15988d" /><ns0:circle cx="1250" cy="890" r="13" fill="#15988d" /><ns0:circle cx="1310" cy="890" r="13" fill="#15988d" /><ns0:circle cx="1370" cy="890" r="13" fill="#15988d" /><ns0:text x="805" y="980" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">未见测试</ns0:text><ns0:circle cx="830" cy="1020" r="13" fill="#15988d" /><ns0:circle cx="890" cy="1020" r="13" fill="#15988d" /><ns0:circle cx="950" cy="1020" r="13" fill="#15988d" /><ns0:circle cx="1010" cy="1020" r="13" fill="#15988d" /><ns0:circle cx="1070" cy="1020" r="13" fill="#15988d" /><ns0:circle cx="1130" cy="1020" r="13" fill="#15988d" /><ns0:circle cx="1190" cy="1020" r="13" fill="#15988d" /><ns0:circle cx="1250" cy="1020" r="13" fill="#15988d" /><ns0:circle cx="1310" cy="1020" r="13" fill="#e2a15f" /><ns0:circle cx="1370" cy="1020" r="13" fill="#e2a15f" /><ns0:text x="805" y="1100" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">示例：训练 0 错；测试 10 个中错 2 个</ns0:text></ns0:svg>
