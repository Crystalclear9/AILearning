<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img"><title>同一批有效位置，两个合理分母给出不同的梯度</title><rect width="1280" height="900" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">同一批有效位置，两个合理分母给出不同的梯度</text><text x="60" y="116" font-size="27" fill="#74888d" text-anchor="start">与本节实验一致：所有预测为 0，灰色位置无标签，在计算误差前排除</text><text x="60" y="185" font-size="29" fill="#19343e" text-anchor="start">标签与有效性</text><text x="65" y="268" font-size="29" fill="#19343e" text-anchor="start">A</text><rect x="150" y="225" width="98" height="68" fill="#edf3f5"/><text x="199" y="270" font-size="30" fill="#19343e" text-anchor="middle">1</text><rect x="265" y="225" width="98" height="68" fill="#edf3f5"/><text x="314" y="270" font-size="30" fill="#19343e" text-anchor="middle">1</text><rect x="380" y="225" width="98" height="68" fill="#eeeeee"/><text x="429" y="270" font-size="30" fill="#74888d" text-anchor="middle">—</text><rect x="495" y="225" width="98" height="68" fill="#eeeeee"/><text x="544" y="270" font-size="30" fill="#74888d" text-anchor="middle">—</text><text x="65" y="363" font-size="29" fill="#19343e" text-anchor="start">B</text><rect x="150" y="320" width="98" height="68" fill="#edf3f5"/><text x="199" y="365" font-size="30" fill="#19343e" text-anchor="middle">2</text><rect x="265" y="320" width="98" height="68" fill="#edf3f5"/><text x="314" y="365" font-size="30" fill="#19343e" text-anchor="middle">2</text><rect x="380" y="320" width="98" height="68" fill="#edf3f5"/><text x="429" y="365" font-size="30" fill="#19343e" text-anchor="middle">2</text><rect x="495" y="320" width="98" height="68" fill="#edf3f5"/><text x="544" y="365" font-size="30" fill="#19343e" text-anchor="middle">2</text><text x="750" y="260" font-size="29" fill="#276a80" text-anchor="start">A：2 项，误差平方和 2</text><text x="750" y="355" font-size="29" fill="#c2673f" text-anchor="start">B：4 项，误差平方和 16</text><line x1="60" y1="425" x2="1220" y2="425" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="480" font-size="30" fill="#276a80" text-anchor="start">按有效元素平均</text><text x="690" y="480" font-size="30" fill="#c2673f" text-anchor="start">按非空序列等权</text><text x="60" y="535" font-size="32" fill="#276a80" text-anchor="start">(2 + 16) ÷ 6 = 3</text><text x="690" y="535" font-size="30" fill="#c2673f" text-anchor="start">(2 ÷ 2 + 16 ÷ 4) ÷ 2 = 2.5</text><text x="60" y="603" font-size="28" fill="#19343e" text-anchor="start">对预测的梯度</text><text x="60" y="663" font-size="28" fill="#276a80" text-anchor="start">A：−0.3333，−0.3333</text><text x="60" y="718" font-size="28" fill="#276a80" text-anchor="start">B：四项均 −0.6667</text><text x="690" y="663" font-size="28" fill="#c2673f" text-anchor="start">A：两项均 −0.5</text><text x="690" y="718" font-size="28" fill="#c2673f" text-anchor="start">B：四项均 −0.5</text><line x1="60" y1="765" x2="1220" y2="765" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="815" font-size="28" fill="#19343e" text-anchor="start">两种目标的相对样本权重变了；单独调整一个学习率不能互相恢复。</text><text x="60" y="867" font-size="26" fill="#74888d" text-anchor="start">图中梯度小数作展示；被排除位置的梯度为零，正文给出精确分数。</text></g></svg>
