<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>归一化到底沿哪一个轴：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">归一化到底沿哪一个轴</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:text x="150" y="228.8" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">BatchNorm：跨样本</ns0:text><ns0:rect x="150" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="215" y="265.55" width="60" height="55.86" rx="5" fill="#9bc3e2" stroke="#718fa9" /><ns0:rect x="280" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="345" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="150" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="215" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#9bc3e2" stroke="#718fa9" /><ns0:rect x="280" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="345" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="150" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="215" y="389.03" width="60" height="55.86" rx="5" fill="#9bc3e2" stroke="#718fa9" /><ns0:rect x="280" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="345" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:text x="670" y="228.8" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">LayerNorm：跨特征</ns0:text><ns0:rect x="670" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="735" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="800" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="865" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="670" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#badfc7" stroke="#718fa9" /><ns0:rect x="735" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#badfc7" stroke="#718fa9" /><ns0:rect x="800" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#badfc7" stroke="#718fa9" /><ns0:rect x="865" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#badfc7" stroke="#718fa9" /><ns0:rect x="670" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="735" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="800" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:rect x="865" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">深色列：同一特征跨 3 个样本统计；深色行：同一样本跨 4 个特征统计。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  相同矩阵的两种统计轴</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  样本间耦合取决于统计轴</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入矩阵：B×D=3×4</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">BN：每列跨 3 个样本</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">LN：每行跨 4 个特征</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两者统计集合不同</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">图限定二维特征矩阵；卷积 BatchNorm 还常汇总空间轴，不</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">能仅凭名称忽略这些轴。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">原批次</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">改变另一样本</ns0:text><ns0:rect x="820" y="850" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="842" y="888" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0</ns0:text><ns0:rect x="895" y="850" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="917" y="888" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:rect x="820" y="910" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="842" y="948" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</ns0:text><ns0:rect x="895" y="910" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="917" y="948" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">3</ns0:text><ns0:rect x="820" y="970" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="842" y="1008" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:rect x="895" y="970" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="917" y="1008" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</ns0:text><ns0:rect x="1150" y="850" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1172" y="888" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0</ns0:text><ns0:rect x="1225" y="850" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1247" y="888" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:rect x="1150" y="910" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1172" y="948" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</ns0:text><ns0:rect x="1225" y="910" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1247" y="948" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">3</ns0:text><ns0:rect x="1150" y="970" width="70" height="55" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="1172" y="1008" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">5</ns0:text><ns0:rect x="1225" y="970" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1247" y="1008" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</ns0:text><ns0:text x="805" y="1070" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">BN 第1列均值：1 → 2</ns0:text><ns0:text x="805" y="1110" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">LN 第1行均值：1 → 1</ns0:text></ns0:svg>
