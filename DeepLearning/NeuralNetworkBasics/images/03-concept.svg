<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1911" viewBox="0 0 1200 1911" role="img"><title>归一化到底沿哪一个轴：机制、算例与边界</title><rect width="1200" height="1911" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">归一化到底沿哪一个轴</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="480.52500000000003" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="600.5250000000001" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1150.525" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="400.52500000000003" viewBox="0 184 1200 433" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="150" y="228.8" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">BatchNorm：跨样本</text><rect x="150" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="215" y="265.55" width="60" height="55.86" rx="5" fill="#9bc3e2" stroke="#718fa9" /><rect x="280" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="345" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="150" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="215" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#9bc3e2" stroke="#718fa9" /><rect x="280" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="345" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="150" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="215" y="389.03" width="60" height="55.86" rx="5" fill="#9bc3e2" stroke="#718fa9" /><rect x="280" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="345" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><text x="670" y="228.8" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">LayerNorm：跨特征</text><rect x="670" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="735" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="800" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="865" y="265.55" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="670" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#badfc7" stroke="#718fa9" /><rect x="735" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#badfc7" stroke="#718fa9" /><rect x="800" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#badfc7" stroke="#718fa9" /><rect x="865" y="327.28999999999996" width="60" height="55.86" rx="5" fill="#badfc7" stroke="#718fa9" /><rect x="670" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="735" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="800" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><rect x="865" y="389.03" width="60" height="55.86" rx="5" fill="#eef5fa" stroke="#718fa9" /><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">深色列：同一特征跨 3 个样本统计；深色行：同一样本跨 4 个特征统计。</text></g></svg><text x="48" y="643.5250000000001" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  相同矩阵的两种统计轴</text><text x="48" y="1193.525" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  样本间耦合取决于统计轴</text><g transform="translate(30,660.5250000000001) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入矩阵：B×D=3×4</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">BN：每列跨 3 个样本</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">LN：每行跨 4 个特征</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两者统计集合不同</text></g><g transform="translate(45,1210.525) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">图限定二维特征矩阵；卷积 BatchNorm 还常汇总空间轴，不</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">能仅凭名称忽略这些轴。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">原批次</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">改变另一样本</text><rect x="820" y="850" width="70" height="55" fill="#d8eee5" stroke="#8caab9" stroke-width="1