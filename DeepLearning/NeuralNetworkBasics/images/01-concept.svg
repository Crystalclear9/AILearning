<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>逐层形状与参数计数：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">逐层形状与参数计数</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:path d="M190,236.15 L535,206.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,236.15 L535,280.25" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,236.15 L535,353.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,236.15 L535,427.25" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,331.7 L535,206.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,331.7 L535,280.25" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,331.7 L535,353.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,331.7 L535,427.25" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,427.25 L535,206.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,427.25 L535,280.25" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,427.25 L535,353.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M190,427.25 L535,427.25" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M535,206.75 L885,272.9" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M535,206.75 L885,375.79999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M535,280.25 L885,272.9" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M535,280.25 L885,375.79999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M535,353.75 L885,272.9" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M535,353.75 L885,375.79999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M535,427.25 L885,272.9" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M535,427.25 L885,375.79999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:circle cx="190" cy="236.15" r="18" fill="#bedcf1" stroke="#274763" /><ns0:circle cx="190" cy="331.7" r="18" fill="#bedcf1" stroke="#274763" /><ns0:circle cx="190" cy="427.25" r="18" fill="#bedcf1" stroke="#274763" /><ns0:circle cx="535" cy="206.75" r="18" fill="#bedcf1" stroke="#274763" /><ns0:circle cx="535" cy="280.25" r="18" fill="#bedcf1" stroke="#274763" /><ns0:circle cx="535" cy="353.75" r="18" fill="#bedcf1" stroke="#274763" /><ns0:circle cx="535" cy="427.25" r="18" fill="#bedcf1" stroke="#274763" /><ns0:circle cx="885" cy="272.9" r="18" fill="#bedcf1" stroke="#274763" /><ns0:circle cx="885" cy="375.79999999999995" r="18" fill="#bedcf1" stroke="#274763" /><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">权重 3×4＋4×2＝20，偏置 4＋2＝6，参数总数 26。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  每层权重与偏置分别计数</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  漏掉偏置会低估参数量</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入 3 → 隐藏 4：12 个权重</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">隐藏偏置：4</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">隐藏 4 → 输出 2：8 个权重</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输出偏置：2；合计 26</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="901.8461538461538" width="120" height="146.15384615384616" fill="#169b8d" /><ns0:text x="895" y="886.8461538461538" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">20</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">只数连接</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">26</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">含全部偏置</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">批次中的多条样本共享这些参数，不应再按批量大小复制参数</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">数量。</ns0:text></ns0:svg>
