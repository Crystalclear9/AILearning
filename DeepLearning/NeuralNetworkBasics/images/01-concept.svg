<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>逐层形状与参数计数</title>
<desc>原创教学示意：输入|3 个特征;隐藏层|4 个单元，带非线性;输出层|2 个 logit;参数|12＋4＋8＋2＝26</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">逐层形状与参数计数</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">输入</text>
<text x="53" y="160" font-size="21" fill="#16324f">3 个特征</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">隐藏层</text>
<text x="603" y="160" font-size="21" fill="#16324f">4 个单元，带非线性</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">输出层</text>
<text x="53" y="330" font-size="21" fill="#16324f">2 个 logit</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">参数</text>
<text x="603" y="330" font-size="21" fill="#16324f">12＋4＋8＋2＝26</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">全连接结构：3 → 4 → 2，连线数与偏置分别统计</text><path d="M190,555 L535,535" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,555 L535,585" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,555 L535,635" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,555 L535,685" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,620 L535,535" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,620 L535,585" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,620 L535,635" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,620 L535,685" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,685 L535,535" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,685 L535,585" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,685 L535,635" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M190,685 L535,685" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M535,535 L885,580" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M535,535 L885,650" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M535,585 L885,580" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M535,585 L885,650" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M535,635 L885,580" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M535,635 L885,650" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M535,685 L885,580" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M535,685 L885,650" fill="none" stroke="#718fa9" stroke-width="3"/><circle cx="190" cy="555" r="18" fill="#bedcf1" stroke="#274763"/><circle cx="190" cy="620" r="18" fill="#bedcf1" stroke="#274763"/><circle cx="190" cy="685" r="18" fill="#bedcf1" stroke="#274763"/><circle cx="535" cy="535" r="18" fill="#bedcf1" stroke="#274763"/><circle cx="535" cy="585" r="18" fill="#bedcf1" stroke="#274763"/><circle cx="535" cy="635" r="18" fill="#bedcf1" stroke="#274763"/><circle cx="535" cy="685" r="18" fill="#bedcf1" stroke="#274763"/><circle cx="885" cy="580" r="18" fill="#bedcf1" stroke="#274763"/><circle cx="885" cy="650" r="18" fill="#bedcf1" stroke="#274763"/><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">权重 3×4＋4×2＝20，偏置 4＋2＝6，参数总数 26。</text></svg>