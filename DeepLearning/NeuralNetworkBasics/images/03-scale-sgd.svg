<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="667" viewBox="0 0 960 667" role="img" aria-labelledby="artwork-title"><title id="artwork-title">尺度不变损失中不同参数范数导致不同的方向更新</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="569.130435"/></clipPath></defs><rect width="960" height="667" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">尺度不变损失中不同参数范数导致不同的方向更新</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(-6.956522 37.956522) scale(0.76087)"><g><rect x="42" y="74" width="1196" height="724" fill="#ffffff"/><title>前向函数相同，参数尺度却改变方向学习的步长</title><rect width="1280" height="810" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="119" font-size="31.32px" fill="#47586b">L(w) = −</text><text x="220" y="97" font-size="34.828571px" fill="#47586b" text-anchor="middle">w1</text><line x1="183" y1="108" x2="257" y2="108" stroke="#769099" stroke-width="1.8"/><text x="220" y="138" font-size="31.32px" fill="#47586b" text-anchor="middle">‖w‖</text><text x="280" y="119" font-size="34.828571px" fill="#47586b">普通 SGD；两个初值方向相同，损失都为 0</text><text x="80" y="175" font-size="34.828571px" fill="#257190" text-anchor="start">w = (0, 1)</text><text x="80" y="220" font-size="34.828571px" fill="#1a2b3d" text-anchor="start">梯度 (−1, 0)，步长 0.1</text><line x1="160" y1="530" x2="380" y2="530" stroke="#769099" stroke-width="2"/><line x1="180" y1="550" x2="180" y2="205" stroke="#769099" stroke-width="2"/><line x1="180" y1="530" x2="180" y2="385" stroke="#769099" stroke-width="4"/><polyline fill="none" stroke="#769099" stroke-width="4" points="185.75,395.53 180,385 174.25,395.53"/><line x1="180" y1="530" x2="194.5" y2="385" stroke="#1a6281" stroke-width="4"/><polyline fill="none" stroke="#1a6281" stroke-width="4" points="199.18,396.05 194.5,385 187.73,394.91"/><text x="250" y="410" font-size="33.54px" fill="#257190" text-anchor="start">(0.1, 1)</text><text x="80" y="620" font-size="34.828571px" fill="#257190" text-anchor="start">转角约 5.7106°</text><text x="700" y="175" font-size="34.828571px" fill="#a85f39" text-anchor="start">w = (0, 2)</text><text x="700" y="220" font-size="34.828571px" fill="#1a2b3d" text-anchor="start">梯度 (−0.5, 0)，步长 0.1</text><line x1="780" y1="530" x2="1000" y2="530" stroke="#769099" stroke-width="2"/><line x1="800" y1="550" x2="800" y2="205" stroke="#769099" stroke-width="2"/><line x1="800" y1="530" x2="800" y2="240" stroke="#769099" stroke-width="4"/><polyline fill="none" stroke="#769099" stroke-width="4" points="805.75,250.53 800,240 794.25,250.53"/><line x1="800" y1="530" x2="807.25" y2="240" stroke="#b46133" stroke-width="4"/><polyline fill="none" stroke="#b46133" stroke-width="4" points="812.74,250.67 807.25,240 801.24,250.38"/><text x="870" y="265" font-size="33.54px" fill="#a85f39" text-anchor="start">(0.05, 2)</text><text x="700" y="620" font-size="34.828571px" fill="#a85f39" text-anchor="start">转角约 1.4321°</text><line x1="60" y1="675" x2="1220" y2="675" stroke="#d9e1e8" stroke-width="2"/><text x="60" y="725" font-size="34.828571px" fill="#1a2b3d" text-anchor="start">尺度放大 2 倍、步长不变：等效方向步长变为四分之一。</text><text x="60" y="775" font-size="34.828571px" fill="#47586b" text-anchor="start">把第二个学习率改为 0.4，得到 (0.2, 2)，才与第一个更新后的方向一致。</text></g></g></g></g></svg>