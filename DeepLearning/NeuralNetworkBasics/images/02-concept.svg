<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>链式法则中的前向值与反向导数：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">链式法则中的前向值与反向导数</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</ns0:text><ns0:text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">x=2</ns0:text><ns0:path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">平方</ns0:text><ns0:text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">z=x²=4</ns0:text><ns0:path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">乘三</ns0:text><ns0:text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">y=3z=12</ns0:text><ns0:path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">局部导数组合</ns0:text><ns0:text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">3×(2x)=12</ns0:text><ns0:text x="170" y="471.35" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">前向：2 → 4 → 12</ns0:text><ns0:text x="600" y="471.35" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">反向：1 → 3 → 12</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">前向输出与梯度在此处恰巧都为 12；这不是数值相等的一般规律。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  前向值与反向导数逐项核对</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相同数值只是此取值的巧合</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">x=2 → z=x²=4 → y=3z=12</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输出上游梯度：1</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">经过乘三节点：1×3＝3</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">经过平方节点：3×2x＝12</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="953.0" width="120" height="95.0" fill="#169b8d" /><ns0:text x="895" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">x=1 时输出</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">6</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">x=1 时导数</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">把输入改为一，输出三而导数六；不能把激活值当作梯度。</ns0:text></ns0:svg>
