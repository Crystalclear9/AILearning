<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>链式法则中的前向值与反向导数</title>
<desc>原创教学示意：输入 x=2|计算起点;平方 z=x²|z=4，局部导数 4;缩放 y=3z|y=12，局部导数 3;梯度|dy 对 dx 的导数为 12</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">链式法则中的前向值与反向导数</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">输入 x=2</text>
<text x="53" y="160" font-size="21" fill="#16324f">计算起点</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">平方 z=x²</text>
<text x="603" y="160" font-size="21" fill="#16324f">z=4，局部导数 4</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">缩放 y=3z</text>
<text x="53" y="330" font-size="21" fill="#16324f">y=12，局部导数 3</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">梯度</text>
<text x="603" y="330" font-size="21" fill="#16324f">dy 对 dx 的导数为 12</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">计算链：前向值从左到右；导数从右到左相乘</text><rect x="40" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="55" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">输入</text><text x="55" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">x=2</text><path d="M260,608 L305,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="276" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="315" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="330" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">平方</text><text x="330" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">z=x²=4</text><path d="M535,608 L580,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="551" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="590" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="605" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">乘三</text><text x="605" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">y=3z=12</text><path d="M810,608 L855,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="826" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="865" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="880" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">局部导数组合</text><text x="880" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">3×(2x)=12</text><text x="170" y="715" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">前向：2 → 4 → 12</text><text x="600" y="715" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">反向：1 → 3 → 12</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">前向输出与梯度在此处恰巧都为 12；这不是数值相等的一般规律。</text></svg>