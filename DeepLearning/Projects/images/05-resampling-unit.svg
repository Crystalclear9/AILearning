 fill="#b56b47" text-anchor="start">把 72 格展平</text><line x1="702.695168" y1="365" x2="857.92544" y2="365" stroke="#b56b47" stroke-width="7"/><line x1="702.695168" y1="349" x2="702.695168" y2="381" stroke="#b56b47" stroke-width="3"/><line x1="857.92544" y1="349" x2="857.92544" y2="381" stroke="#b56b47" stroke-width="3"/><circle cx="778.41326144" cy="365" r="10" fill="#b56b47"/><text x="702.695168" y="335" font-size="25" fill="#b56b47" text-anchor="start">0.0005</text><text x="857.92544" y="420" font-size="25" fill="#b56b47" text-anchor="end">0.0167</text><text x="410" y="525" font-size="27" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">损失差（同一方向与同一尺度）</text><text x="60" y="590" font-size="28" fill="#283341" text-anchor="start">均值都约 0.00838；展平破坏共享结构，窄区间不等于更强证据。</text></g></svg></svg>