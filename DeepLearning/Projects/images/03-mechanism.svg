b" text-anchor="end">74</text><line x1="220" y1="250.0" x2="1050" y2="250.0" stroke="#d9e1e8" stroke-width="2"/><text x="185" y="258.0" font-size="28.56px" fill="#47586b" text-anchor="end">75</text><line x1="220" y1="200.0" x2="1050" y2="200.0" stroke="#d9e1e8" stroke-width="2"/><text x="185" y="208.0" font-size="28.56px" fill="#47586b" text-anchor="end">76</text><line fill="none" stroke="#1a6281" stroke-width="4" x1="220" y1="500" x2="940" y2="400"/><circle cx="220" cy="500.0" r="9" fill="#1a6281"/><text x="195" y="480.0" font-size="31.683516px" fill="#257190" text-anchor="start">70</text><circle cx="940" cy="400.0" r="9" fill="#1a6281"/><text x="915" y="380.0" font-size="31.683516px" fill="#257190" text-anchor="start">72</text><text x="1035" y="390.0" font-size="30.16px" fill="#257190" text-anchor="start">A 关闭</text><line fill="none" stroke="#b46133" stroke-width="4" x1="220" y1="450" x2="940" y2="250"/><circle cx="220" cy="450.0" r="9" fill="#b46133"/><text x="195" y="430.0" font-size="31.683516px" fill="#a85f39" text-anchor="start">71</text><circle cx="940" cy="250.0" r="9" fill="#b46133"/><text x="915" y="230.0" font-size="31.683516px" fill="#a85f39" text-anchor="start">75</text><text x="1035" y="240.0" font-size="30.16px" fill="#a85f39" text-anchor="start">A 开启</text><text x="220" y="600" font-size="31.683516px" fill="#1a2b3d" text-anchor="middle">B 关闭</text><text x="940" y="600" font-size="31.683516px" fill="#1a2b3d" text-anchor="middle">B 开启</text><text x="100" y="660" font-size="31.683516px" fill="#1a2b3d" text-anchor="start">A 的条件增益：无 B 时 +1；有 B 时 +3；差中差 = 2。</text></g></g></g></g></svg>