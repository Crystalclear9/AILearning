<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title id="figure-title">配对比较：从列联计数到精确 McNemar 检验</title><desc id="figure-desc">配对比较：从列联计数到精确 McNemar 检验</desc><rect width="1200" height="590" fill="white" /><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="47" font-size="32" fill="#213447" text-anchor="start" font-weight="600">配对比较：从列联计数到精确 McNemar 检验</text><text x="270" y="115" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">同一组 100 个独立评价单位</text><text x="220" y="176" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">B 正确</text><text x="370" y="176" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">B 错误</text><text x="126" y="243" font-size="28" fill="#213447" text-anchor="end" font-weight="400">A 正确</text><text x="126" y="338" font-size="28" fill="#213447" text-anchor="end" font-weight="400">A 错误</text><rect x="151" y="200" width="140" height="86" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="221.0" y="253.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">70</text><rect x="301" y="200" width="140" height="86" rx="5" fill="#fff0e3" stroke="#c8d7e3" stroke-width="1" /><text x="371.0" y="253.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">15</text><rect x="151" y="295" width="140" height="86" rx="5" fill="#fff0e3" stroke="#c8d7e3" stroke-width="1" /><text x="221.0" y="348.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">5</text><rect x="301" y="295" width="140" height="86" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="371.0" y="348.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">10</text><text x="280" y="456" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">A：85%；B：75%；差 10 个百分点</text><line x1="495" y1="293" x2="620" y2="293" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><text x="900" y="135" font-size="29" fill="#cf7432" text-anchor="middle" font-weight="400">只取 20 个不一致样本</text><circle cx="720" cy="215" r="11" fill="#2865a0" /><circle cx="760" cy="215" r="11" fill="#2865a0" /><circle cx="800" cy="215" r="11" fill="#2865a0" /><circle cx="840" cy="215" r="11" fill="#2865a0" /><circle cx="880" cy="215" r="11" fill="#2865a0" /><circle cx="920" cy="215" r="11" fill="#2865a0" /><circle cx="960" cy="215" r="11" fill="#2865a0" /><circle cx="1000" cy="215" r="11" fill="#2865a0" /><circle cx="1040" cy="215" r="11" fill="#2865a0" /><circle cx="1080" cy="215" r="11" fill="#2865a0" /><circle cx="720" cy="265" r="11" fill="#2865a0" /><circle cx="760" cy="265" r="11" fill="#2865a0" /><circle cx="800" cy="265" r="11" fill="#2865a0" /><circle cx="840" cy="265" r="11" fill="#2865a0" /><circle cx="880" cy="265" r="11" fill="#2865a0" /><circle cx="920" cy="265" r="11" fill="#cf7432" /><circle cx="960" cy="265" r="11" fill="#cf7432" /><circle cx="1000" cy="265" r="11" fill="#cf7432" /><circle cx="1040" cy="265" r="11" fill="#cf7432" /><circle cx="1080" cy="265" r="11" fill="#cf7432" /><text x="900" y="330" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">仅 A 对：15；仅 B 对：5</text><text x="900" y="385" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">原假设：两个方向各半</text><text x="900" y="441" font-size="30" fill="#cf7432" text-anchor="middle" font-weight="400">双侧精确 p ≈ 0.04139</text><text x="600" y="552" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">检验条件边际差异；不是“原假设正确的概率”</text></g></svg>
