<svg xmlns="http://www.w3.org/2000/svg" width="1407.53" height="978.528" viewBox="-3.764 40.236 1407.53 978.528" role="img" aria-labelledby="plate-title"><defs><linearGradient id="book-wash-fff0e4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf2ec"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="plate-title">重复种子与重复数据划分衡量不同波动</title><desc>有限教学设计有两种数据划分和两个均匀独立训练种子。四个风险数0.10,0.14,0.26,0.30，条件内方差0.0004，条件均值方差0.0064，总方差0.0068。</desc><rect id="edition-paper" x="-3.764" y="40.236" width="1407.53" height="978.528" fill="#ffffff"/><svg id="edition-view" x="22" y="66" width="1356" height="927" viewBox="22 66 1356 927" overflow="hidden"><rect x="22" y="66" width="1356" height="927" fill="#ffffff"/><rect width="1400" height="980" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="105" font-size="25" fill="#577486" text-anchor="start" font-weight="400">有限教学设计：D、S 独立均匀取两值；四个数为给定风险，不是 digits 实测</text><text x="305" y="192" font-size="29" fill="#2a78a8" text-anchor="middle" font-weight="600">种子 S1</text><text x="590" y="192" font-size="29" fill="#2a78a8" text-anchor="middle" font-weight="600">种子 S2</text><text x="960" y="192" font-size="29" fill="#253d4f" text-anchor="middle" font-weight="600" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同一划分的条件均值</text><text x="55" y="297" font-size="29" fill="#253d4f" text-anchor="start" font-weight="400">划分 D1</text><rect x="185" y="235" width="240" height="100" rx="6" fill="#ebf3f8" stroke="none"/><text x="305" y="298" font-size="37" fill="#276e9b" text-anchor="middle" font-weight="600">0.10</text><rect x="470" y="235" width="240" height="100" rx="6" fill="#ebf3f8" stroke="none"/><text x="590" y="298" font-size="37" fill="#276e9b" text-anchor="middle" font-weight="600">0.14</text><line x1="735" y1="285" x2="810" y2="285" stroke="#2a78a8" stroke-width="3"/><line x1="810" y1="285" x2="798.2941876694152" y2="290.654551943446" stroke="#2a78a8" stroke-width="3"/><line x1="810" y1="285" x2="798.2941876694152" y2="279.345448056554" stroke="#2a78a8" stroke-width="3"/><rect x="845" y="235" width="470" height="100" rx="6" fill="url(#book-wash-fff0e4)" stroke="none"/><text x="1080" y="298" font-size="37" fill="#a35a31" text-anchor="middle" font-weight="600">0.12</text><text x="55" y="442" font-size="29" fill="#253d4f" text-anchor="start" font-weight="400">划分 D2</text><rect x="185" y="380" width="240" height="100" rx="6" fill="#ebf3f8" stroke="none"/><text x="305" y="443" font-size="37" fill="#276e9b" text-anchor="middle" font-weight="600">0.26</text><rect x="470" y="380" width="240" height="100" rx="6" fill="#ebf3f8" stroke="none"/><text x="590" y="443" font-size="37" fill="#276e9b" text-anchor="middle" font-weight="600">0.30</text><line x1="735" y1="430" x2="810" y2="430" stroke="#2a78a8" stroke-width="3"/><line x1="810" y1="430" x2="798.2941876694152" y2="435.654551943446" stroke="#2a78a8" stroke-width="3"/><line x1="810" y1="430" x2="798.2941876694152" y2="424.345448056554" stroke="#2a78a8" stroke-width="3"/><rect x="845" y="380" width="470" height="100" rx="6" fill="url(#book-wash-fff0e4)" stroke="none"/><text x="1080" y="443" font-size="37" fill="#a25a31" text-anchor="middle" font-weight="600">0.28</text><text x="185" y="545" font-size="28" fill="#2a78a8" text-anchor="start" font-weight="400">每行的两个种子距行均值均为 ±0.02</text><text x="845" y="545" font-size="27" fill="#a75d32" text-anchor="start" font-weight="400">行均值距总均值 0.20 为 ±0.08</text><line x1="40" y1="588" x2="1360" y2="588" stroke="#d7e4ea" stroke-width="2"/><text x="65" y="660" font-size="29" fill="#2a78a8" text-anchor="start" font-weight="400">条件内：固定 D，只换 S</text><text x="720" y="660" font-size="32" fill="#2a78a8" text-anchor="start" font-weight="600">0.0004</text><rect x="950" y="630" width="21.176470588235297" height="36" rx="6" fill="#2a78a8" stroke="none"/><text x="65" y="750" font-size="29" fill="#a75d32" text-anchor="start" font-weight="400">条件间：先平均 S，再换 D</text><text x="720" y="750" font-size="32" fill="#a75d32" text-anchor="start" font-weight="600">0.0064</text><rect x="950" y="720" width="338.82352941176475" height="36" rx="6" fill="#b46436" stroke="none"/><text x="65" y="840" font-size="29" fill="#26848d" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">总计：均匀观察四个格子</text><text x="720" y="840" font-size="32" fill="#26848d" text-anchor="start" font-weight="600">0.0068</text><rect x="950" y="810" width="360.0" height="36" rx="6" fill="#26848d" stroke="none"/><text x="40" y="932" font-size="25" fill="#577486" text-anchor="start" font-weight="400">方差按图中离散均匀分布计算；只在 D1 重复种子，不会自动观察 D1 与 D2 的差异。</text><text x="40" y="971" font-size="25" fill="#577486" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">尚未包含有限测试抽样或部署分布变化；这四格也不能自动当作四个独立真实数据集。</text></g></svg></svg>
