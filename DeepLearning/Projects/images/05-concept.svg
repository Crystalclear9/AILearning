<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>消融比较怎样对齐预算</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">消融比较怎样对齐预算</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:path d="M150,464.0 L1010,464.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M150,464.0 L150,214.1" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="880" y="515.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">训练小时</ns0:text><ns0:text x="40" y="214.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">准确率</ns0:text><ns0:rect x="320" y="353.75" width="15" height="22.05" rx="5" fill="#74a98b" stroke="#718fa9" /><ns0:text x="345" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">A：1 小时，0.90</ns0:text><ns0:rect x="830" y="250.85" width="15" height="22.05" rx="5" fill="#7ea9cc" stroke="#718fa9" /><ns0:text x="665" y="228.8" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">B：4 小时，0.91</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">坐标仅表示质量—成本取舍，纵轴未从零开始；精度差还需多种子与不确定性证据。</ns0:text></g></svg>
