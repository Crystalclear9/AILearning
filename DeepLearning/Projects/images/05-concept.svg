<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1923" viewBox="0 0 1200 1923" role="img"><title>消融比较怎样对齐预算：机制、算例与边界</title><rect width="1200" height="1923" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">消融比较怎样对齐预算</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="492.55" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="612.55" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1162.55" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="412.55" viewBox="0 171 1200 446" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M150,464.0 L1010,464.0" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M150,464.0 L150,214.1" fill="none" stroke="#718fa9" stroke-width="3" /><text x="880" y="515.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">训练小时</text><text x="40" y="214.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">准确率</text><rect x="320" y="353.75" width="15" height="22.05" rx="5" fill="#74a98b" stroke="#718fa9" /><text x="345" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">A：1 小时，0.90</text><rect x="830" y="250.85" width="15" height="22.05" rx="5" fill="#7ea9cc" stroke="#718fa9" /><text x="665" y="228.8" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">B：4 小时，0.91</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">坐标仅表示质量—成本取舍，纵轴未从零开始；精度差还需多种子与不确定性证据。</text></g></svg><text x="48" y="655.55" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  质量收益要与资源代价一起读</text><text x="48" y="1205.55" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相同轮数不保证相同资源</text><g transform="translate(30,672.55) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">方案 A：0.90；训练 1 小时</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">方案 B：0.91；训练 4 小时</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">质量增加：1 个百分点</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">训练时间：增加到 4 倍</text></g><g transform="translate(45,1222.55) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">数字是比较示例，不代表模型实测；推理成本、方差和样本公</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">平也要分别报告。</tspan></text><line x1="820" y1="1040" x2="1420" y2="1040" stroke="#44859a" stroke-width="2" /><rect x="900" y="996.25" width="100" height="43.75" fill="#15988d" stroke="#8caab9" stroke-width="1" /><text x="895" y="981.25" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</text><text x="850" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">A：都训10轮</text><rect x="1200" y="865.0" width="100" height="175.0" fill="#e2a15f" stroke="#8caab9" stroke-width="1" /><text x="1195" y="850.0" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</text><text x="1150" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B：都训10轮</text><text x="820" y="830" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">示例总乘加量，单位：百万次</text></g></svg>
