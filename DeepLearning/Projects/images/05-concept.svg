<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>消融比较怎样对齐预算：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">消融比较怎样对齐预算</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:path d="M150,464.0 L1010,464.0" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M150,464.0 L150,214.1" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="880" y="515.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">训练小时</ns0:text><ns0:text x="40" y="214.1" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">准确率</ns0:text><ns0:rect x="320" y="353.75" width="15" height="22.05" rx="5" fill="#74a98b" stroke="#718fa9" /><ns0:text x="345" y="383.15" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">A：1 小时，0.90</ns0:text><ns0:rect x="830" y="250.85" width="15" height="22.05" rx="5" fill="#7ea9cc" stroke="#718fa9" /><ns0:text x="665" y="228.8" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">B：4 小时，0.91</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">坐标仅表示质量—成本取舍，纵轴未从零开始；精度差还需多种子与不确定性证据。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  质量收益要与资源代价一起读</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相同轮数不保证相同资源</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">方案 A：0.90；训练 1 小时</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">方案 B：0.91；训练 4 小时</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">质量增加：1 个百分点</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">训练时间：增加到 4 倍</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">数字是比较示例，不代表模型实测；推理成本、方差和样本公</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">平也要分别报告。</ns0:text><ns0:line x1="820" y1="1040" x2="1420" y2="1040" stroke="#44859a" stroke-width="2" /><ns0:rect x="900" y="996.25" width="100" height="43.75" fill="#15988d" stroke="#8caab9" stroke-width="1" /><ns0:text x="895" y="981.25" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</ns0:text><ns0:text x="850" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">A：都训10轮</ns0:text><ns0:rect x="1200" y="865.0" width="100" height="175.0" fill="#e2a15f" stroke="#8caab9" stroke-width="1" /><ns0:text x="1195" y="850.0" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</ns0:text><ns0:text x="1150" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B：都训10轮</ns0:text><ns0:text x="820" y="830" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">示例总乘加量，单位：百万次</ns0:text></ns0:svg>
