<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>训练更贵、服务更省：总成本排序取决于请求数量</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19333c" text-anchor="start">训练更贵、服务更省：总成本排序取决于请求数量</text><text x="60" y="115" font-size="26" fill="#74858a" text-anchor="start">同一种成本单位；A：训练 100、每次服务 0.004；B：训练 160、每次服务 0.001</text><line x1="135" y1="550.0" x2="1115" y2="550.0" stroke="#dce4e5" stroke-width="2"/><text x="120" y="558.0" font-size="24" fill="#74858a" text-anchor="end">0</text><line x1="135" y1="480.0" x2="1115" y2="480.0" stroke="#dce4e5" stroke-width="2"/><text x="120" y="488.0" font-size="24" fill="#74858a" text-anchor="end">100</text><line x1="135" y1="410.0" x2="1115" y2="410.0" stroke="#dce4e5" stroke-width="2"/><text x="120" y="418.0" font-size="24" fill="#74858a" text-anchor="end">200</text><line x1="135" y1="340.0" x2="1115" y2="340.0" stroke="#dce4e5" stroke-width="2"/><text x="120" y="348.0" font-size="24" fill="#74858a" text-anchor="end">300</text><line x1="135" y1="270.0" x2="1115" y2="270.0" stroke="#dce4e5" stroke-width="2"/><text x="120" y="278.0" font-size="24" fill="#74858a" text-anchor="end">400</text><line x1="135" y1="200.0" x2="1115" y2="200.0" stroke="#dce4e5" stroke-width="2"/><text x="120" y="208.0" font-size="24" fill="#74858a" text-anchor="end">500</text><text x="135.0" y="595" font-size="24" fill="#74858a" text-anchor="middle">0</text><text x="331.0" y="595" font-size="24" fill="#74858a" text-anchor="middle">20000</text><text x="625.0" y="595" font-size="24" fill="#74858a" text-anchor="middle">50000</text><text x="1115.0" y="595" font-size="24" fill="#74858a" text-anchor="middle">100000</text><path d="M135.000,480.000 L1115.000,200.000" stroke="#256b82" stroke-width="4" fill="none"/><path d="M135.000,438.000 L1115.000,368.000" stroke="#c0643c" stroke-width="4" fill="none"/><circle cx="331.0" cy="424.0" r="7" fill="#19333c"/><text x="361.0" y="474.0" font-size="27" fill="#19333c" text-anchor="start">20 000 次，两者总成本均为 180</text><text x="150" y="190" font-size="27" fill="#256b82" text-anchor="start">A：100 + 0.004 N</text><text x="150" y="235" font-size="27" fill="#c0643c" text-anchor="start">B：160 + 0.001 N</text><text x="60" y="665" font-size="27" fill="#19333c" text-anchor="start">请求少时 A 更省；超过交点后 B 更省。只报训练成本会遗漏服务阶段。</text><text x="60" y="725" font-size="25" fill="#74858a" text-anchor="start">这是本章代码的确定性账本；质量、延迟与显存约束仍需同时满足。</text></g></svg>
