<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>消融比较怎样对齐预算</title>
<desc>原创教学示意：方案 A|准确率 0.90，训练 1 小时;方案 B|准确率 0.91，训练 4 小时;质量比较|相同评估集与多次种子;资源比较|另报训练和推理成本</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">消融比较怎样对齐预算</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">方案 A</text>
<text x="53" y="160" font-size="21" fill="#16324f">准确率 0.90，训练 1 小时</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">方案 B</text>
<text x="603" y="160" font-size="21" fill="#16324f">准确率 0.91，训练 4 小时</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">质量比较</text>
<text x="53" y="330" font-size="21" fill="#16324f">相同评估集与多次种子</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">资源比较</text>
<text x="603" y="330" font-size="21" fill="#16324f">另报训练和推理成本</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">质量与训练成本是两条比较轴</text><path d="M150,710 L1010,710" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M150,710 L150,540" fill="none" stroke="#718fa9" stroke-width="3"/><text x="880" y="745" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">训练小时</text><text x="40" y="540" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">准确率</text><rect x="320" y="635" width="15" height="15" rx="5" fill="#74a98b" stroke="#718fa9"/><text x="345" y="655" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">A：1 小时，0.90</text><rect x="830" y="565" width="15" height="15" rx="5" fill="#7ea9cc" stroke="#718fa9"/><text x="665" y="550" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">B：4 小时，0.91</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">坐标仅表示质量—成本取舍，纵轴未从零开始；精度差还需多种子与不确定性证据。</text></svg>