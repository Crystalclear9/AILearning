727272727273" y="600" font-size="24" fill="#19343e" text-anchor="middle">8</text><text x="1019.090909090909" y="600" font-size="24" fill="#19343e" text-anchor="middle">10</text><text x="1110.0" y="600" font-size="24" fill="#19343e" text-anchor="middle">11</text><line x1="610.0" y1="185" x2="610.0" y2="570" stroke="#74888d" stroke-width="2"/><text x="110" y="170" font-size="26" fill="#19343e" text-anchor="start">更新前损失</text><text x="600" y="165" font-size="26" fill="#276a80" text-anchor="start">蓝：完整恢复（与连续训练重合）</text><text x="650" y="210" font-size="26" fill="#c2673f" text-anchor="start">橙：恢复后额外 torch.rand(17)</text><text x="110" y="655" font-size="27" fill="#19343e" text-anchor="start">横轴为更新编号 0–11；分叉后两条路径仍抽到相同样本。</text><text x="110" y="710" font-size="26" fill="#19343e" text-anchor="start">最后参数的最大绝对差 ≈ 0.016999；当前权重相同不足以确定未来。</text></g></svg>
