<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>检查点恢复不只是重新加载权重：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">检查点恢复不只是重新加载权重</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">模型参数</ns0:text><ns0:text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定当前预测</ns0:text><ns0:path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">优化器状态</ns0:text><ns0:text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定下次更新方向</ns0:text><ns0:path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">调度与步数</ns0:text><ns0:text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定学习率进度</ns0:text><ns0:path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">随机状态与数据</ns0:text><ns0:text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定下一次输入</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">保存应在清楚的更新边界；只恢复模型权重不能保证恢复原训练轨迹。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  相同参数下的两次续训算例</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  同一权重不等于同一下一更新</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">w=1，g=0.2，步长 0.1</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">动量系数 0.9；旧动量若为 0</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">新动量 0.2；下一参数 0.98</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">旧动量若为 1，则下一参数 0.89</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">实际集合依赖算法与保存边界；累积梯度、预取及混合精度可</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">能增加状态。</ns0:text><ns0:line x1="820" y1="1040" x2="1420" y2="1040" stroke="#44859a" stroke-width="2" /><ns0:rect x="900" y="865.0" width="100" height="175.0" fill="#15988d" stroke="#8caab9" stroke-width="1" /><ns0:text x="895" y="850.0" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.98</ns0:text><ns0:text x="850" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">旧动量 0</ns0:text><ns0:rect x="1200" y="881.0714285714286" width="100" height="158.92857142857144" fill="#e2a15f" stroke="#8caab9" stroke-width="1" /><ns0:text x="1195" y="866.0714285714286" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.89</ns0:text><ns0:text x="1150" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">旧动量 1</ns0:text><ns0:text x="820" y="830" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">相同 w=1，下一参数不同</ns0:text></ns0:svg>
