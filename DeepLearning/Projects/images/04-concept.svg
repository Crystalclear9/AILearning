<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1873" viewBox="0 0 1200 1873" role="img"><title>检查点恢复不只是重新加载权重：机制、算例与边界</title><rect width="1200" height="1873" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">检查点恢复不只是重新加载权重</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="442.6" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="562.6" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1112.6" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="362.6" viewBox="0 225 1200 392" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">模型参数</text><text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定当前预测</text><path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">优化器状态</text><text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定下次更新方向</text><path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">调度与步数</text><text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定学习率进度</text><path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">随机状态与数据</text><text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">决定下一次输入</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">保存应在清楚的更新边界；只恢复模型权重不能保证恢复原训练轨迹。</text></g></svg><text x="48" y="605.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  相同参数下的两次续训算例</text><text x="48" y="1155.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  同一权重不等于同一下一更新</text><g transform="translate(30,622.6) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">w=1，g=0.2，步长 0.1</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">动量系数 0.9；旧动量若为 0</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">新动量 0.2；下一参数 0.98</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">旧动量若为 1，则下一参数 0.89</text></g><g transform="translate(45,1172.6) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">实际集合依赖算法与保存边界；累积梯度、预取及混合精度可</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">能增加状态。</tspan></text><line x1="820" y1="1040" x2="1420" y2="1040" stroke="#44859a" stroke-width="2" /><rect x="900" y="865.0" width="100" height="175.0" fill="#15988d" stroke="#8caab9" stroke-width="1" /><text x="895" y="850.0" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.98</text><text x="850" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">旧动量 0</text><rect x="1200" y="881.0714285714286" width="100" height="158.92857142857144" fill="#e2a15f" stroke="#8caab9" stroke-width="1" /><text x="1195" y="866.0714285714286" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.89</text><text x="1150" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">旧动量 1</text><text x="820" y="830" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">相同 w=1，下一参数不同</text></g></svg>
