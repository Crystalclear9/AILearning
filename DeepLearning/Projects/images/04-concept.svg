<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img"><title>只错开 Dropout 随机流，续训轨迹也会分叉</title><rect width="1280" height="750" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">只错开 Dropout 随机流，续训轨迹也会分叉</text><text x="60" y="115" font-size="26" fill="#19343e" text-anchor="start">相同检查点、采样索引、优化器与调度器；第 6 次更新后保存。</text><line x1="110" y1="555.0" x2="1120" y2="555.0" stroke="#dbe5e8" stroke-width="2"/><text x="90" y="563.0" font-size="24" fill="#74888d" text-anchor="end">0.00</text><line x1="110" y1="467.5" x2="1120" y2="467.5" stroke="#dbe5e8" stroke-width="2"/><text x="90" y="475.5" font-size="24" fill="#74888d" text-anchor="end">0.59</text><line x1="110" y1="380.0" x2="1120" y2="380.0" stroke="#dbe5e8" stroke-width="2"/><text x="90" y="388.0" font-size="24" fill="#74888d" text-anchor="end">1.17</text><line x1="110" y1="292.5" x2="1120" y2="292.5" stroke="#dbe5e8" stroke-width="2"/><text x="90" y="300.5" font-size="24" fill="#74888d" text-anchor="end">1.76</text><line x1="110" y1="205.0" x2="1120" y2="205.0" stroke="#dbe5e8" stroke-width="2"/><text x="90" y="213.0" font-size="24" fill="#74888d" text-anchor="end">2.34</text><path d="M110.00,334.24 L200.91,409.19 L291.82,300.61 L382.73,418.61 L473.64,378.38 L564.55,383.00 L655.45,246.64 L746.36,418.80 L837.27,391.90 L928.18,371.22 L1019.09,307.26 L1110.00,343.05" fill="none" stroke="#c2673f" stroke-width="4"/><circle cx="110.0" cy="334.2357249731781" r="5" fill="#c2673f"/><circle cx="200.9090909090909" cy="409.193147088602" r="5" fill="#c2673f"/><circle cx="291.8181818181818" cy="300.6085795947361" r="5" fill="#c2673f"/><circle cx="382.7272727272727" cy="418.6135530883888" r="5" fill="#c2673f"/><circle cx="473.6363636363636" cy="378.38034563099336" r="5" fill="#c2673f"/><circle cx="564.5454545454545" cy="383.0030225749707" r="5" fill="#c2673f"/><circle cx="655.4545454545454" cy="246.63976068708513" r="