nt-size="34.828571px" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">成功更新数</text><text x="470" y="339" font-size="33.32px" fill="#2c6f89" text-anchor="middle">17</text><text x="950" y="339" font-size="33.32px" fill="#2c6f89" text-anchor="middle">18</text><text x="80" y="396" font-size="34.828571px" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">采样游标</text><text x="470" y="396" font-size="33.32px" fill="#2c6f89" text-anchor="middle">201</text><text x="950" y="396" font-size="33.32px" fill="#2c6f89" text-anchor="middle">202</text><line x1="570" y1="280" x2="785" y2="280" stroke="#a9603b" stroke-width="4"/><polyline fill="none" stroke="#a9603b" stroke-width="4" points="774.47,285.75 785,280 774.47,274.25"/><text x="615" y="255" font-size="32.25px" fill="#a05f3f" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">完整更新</text><line x1="60" y1="435" x2="1220" y2="435" stroke="#dde5eb" stroke-width="2"/><text x="60" y="485" font-size="34.828571px" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">一次允许的故障：新检查点已替换，日志尚未来得及追加。</text><line x1="240" y1="600" x2="1140" y2="600" stroke="#718e98" stroke-width="3"/><circle cx="350" cy="600" r="11" fill="#22627b"/><text x="350" y="560" font-size="34.828571px" fill="#2c6f89" text-anchor="middle">保存 id 18</text><circle cx="640" cy="600" r="11" fill="#a9603b"/><text x="640" y="560" font-size="34.828571px" fill="#a05f3f" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">进程崩溃</text><circle cx="1000" cy="600" r="9" fill="#718e98"/><text x="1000" y="560" font-size="34.828571px" fill="#475b6c" text-anchor="middle">日志仍到 id 17</text><text x="85" y="655" font-size="34.828571px" fill="#2c6f89" text-anchor="start">检查点：id 18 / θ 0.962 / m 0.380 / 游标 202</text><line x1="420" y1="675" x2="420" y2="735" stroke="#22627b" stroke-width="4"/><polyline fill="none" stroke="#22627b" stroke-width="4" points="414.25,724.47 420,735 425.75,724.47"/><text x="465" y="725" font-size="34.828571px" fill="#2c6f89" text-anchor="start">按检查点恢复，再核对或补齐相同 id 的日志。</text><text x="60" y="795" font-size="34.828571px" fill="#a05f3f" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">单文件原子替换不能自动使检查点与外部日志成为同一个事务。</text></g></g></g></g></svg></svg>