<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img"><title>检查点与日志应对应同一提交边界</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f"/></marker></defs><rect width="1160" height="610" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="45" font-size="28" fill="#18364e">检查点与日志应对应同一提交边界</text><line x1="485" y1="185" x2="652" y2="185" stroke="#748e9f" stroke-width="3" marker-end="url(#arr)"/><line x1="1080" y1="220" x2="85" y2="347" stroke="#748e9f" stroke-width="3" marker-end="url(#arr)"/><line x1="485" y1="420" x2="652" y2="420" stroke="#748e9f" stroke-width="3" marker-end="url(#arr)"/><rect x="65" y="120" width="420" height="130" rx="6" fill="#e4f1f9" stroke="#7895aa"/><text x="81" y="149" font-size="18" fill="#597286">节点 1</text><text x="81" y="186" font-size="23" fill="#18364e">完成梯度与优化器更新</text><rect x="660" y="120" width="420" height="130" rx="6" fill="#e1f0e7" stroke="#7895aa"/><text x="676" y="149" font-size="18" fill="#597286">节点 2</text><text x="676" y="186" font-size="23" fill="#18364e">推进调度器和成功步数</text><rect x="65" y="355" width="420" height="130" rx="6" fill="#fff0db" stroke="#7895aa"/><text x="81" y="384" font-size="18" fill="#597286">节点 3</text><text x="81" y="421" font-size="23" fill="#18364e">原子保存一致检查点</text><rect x="660" y="355" width="420" height="130" rx="6" fill="#eee4f3" stroke="#7895aa"/><text x="676" y="384" font-size="18" fill="#597286">节点 4</text><text x="676" y="421" font-size="23" fill="#18364e">记录该检查点标识与指标</text><text x="35" y="580" font-size="19" fill="#526b7c">原创教学算例；数值、定义与适用条件见图下说明。</text></g></svg>