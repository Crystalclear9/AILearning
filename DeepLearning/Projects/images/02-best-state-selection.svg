<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="771" viewBox="0 0 960 771" role="img" aria-labelledby="artwork-title"><title id="artwork-title">最佳模型选择与最终评估</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="673.536585"/></clipPath></defs><rect width="960" height="771" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">最佳模型选择与最终评估</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(-10.853659 5.146341) scale(0.853659)"><g><rect x="42" y="83" width="1066" height="789" fill="#ffffff"/><title>选择的是一个真实参数状态，不只是曲线上的最低值</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="125" font-size="31.042857px" fill="#1a2b3d" text-anchor="start">固定 digits 实验：三十轮预算，按验证交叉熵选快照</text><text x="350" y="205" font-size="31" fill="#257190" text-anchor="middle">第 28 轮</text><line x1="190" y1="500" x2="510" y2="500" stroke="#769099" stroke-width="2"/><rect x="285" y="294.848" width="130" height="205.152" fill="#257190"/><text x="350" y="272.848" font-size="30" fill="#257190" text-anchor="middle">0.085480</text><text x="350" y="555" font-size="31.042857px" fill="#1a2b3d" text-anchor="middle">验证 CE</text><text x="930" y="205" font-size="31" fill="#a85f39" text-anchor="middle">第 30 轮</text><line x1="770" y1="500" x2="1090" y2="500" stroke="#769099" stroke-width="2"/><rect x="865" y="274.72159999999997" width="130" height="225.27840000000003" fill="#bf6d42"/><text x="930" y="252.72159999999997" font-size="30" fill="#a85f39" text-anchor="middle">0.093866</text><text x="930" y="555" font-size="31.042857px" fill="#1a2b3d" text-anchor="middle">验证 CE</text><text x="60" y="625" font-size="31.042857px" fill="#257190" text-anchor="start">0.085480 &lt; 0.093866：恢复第 28 轮，再核对验证损失</text><line x1="350" y1="660" x2="350" y2="700" stroke="#1a6281" stroke-width="4"/><polyline fill="none" stroke="#1a6281" stroke-width="4" points="344.25,689.47 350,700 355.75,689.47"/><line x1="350" y1="700" x2="855" y2="700" stroke="#1a6281" stroke-width="4"/><polyline fill="none" stroke="#1a6281" stroke-width="4" points="844.47,705.75 855,700 844.47,694.25"/><text x="880" y="710" font-size="30" fill="#257190" text-anchor="start">冻结预测</text><text x="60" y="790" font-size="31.042857px" fill="#1a2b3d" text-anchor="start">同一份测试预测 → 344 张正确，16 张错误；共 360 张</text><text x="60" y="850" font-size="31.042857px" fill="#47586b" text-anchor="start">验证用于选择；测试用于评价已选择的状态，不能反向挑轮次。</text></g></g></g></g></svg>