<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img"><title>同一digits实验的两次索引划分和三种数据角色</title><desc>1797张图像先分为1437开发与360测试，再将开发分为1077训练和360验证，类别计数直接取本章程序。</desc><rect width="1400" height="1020" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="54" font-size="34" fill="#23394b" text-anchor="start" font-weight="600">先固定索引，再沿三种信息角色检查实验</text><text x="40" y="103" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">load_digits：1797 张图像；图像级分层随机留出，不代表书写者隔离</text><rect x="40" y="155" width="310" height="115" rx="6" fill="#e8f1f8" stroke="none"/><text x="195" y="202" font-size="31" fill="#2368a2" text-anchor="middle" font-weight="600">全部索引 1797</text><text x="195" y="244" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">同一数据版本与行顺序</text><rect x="490" y="155" width="330" height="115" rx="6" fill="#e8f1f8" stroke="none"/><text x="655" y="202" font-size="31" fill="#2368a2" text-anchor="middle" font-weight="600">开发索引 1437</text><text x="655" y="244" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">第一步：seed 41</text><rect x="980" y="155" width="370" height="115" rx="6" fill="#eef2f5" stroke="none"/><text x="1165" y="202" font-size="31" fill="#23394b" text-anchor="middle" font-weight="600">测试索引 360</text><text x="1165" y="244" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">先留出，不参与选择</text><line x1="350" y1="210" x2="480" y2="210" stroke="#2368a2" stroke-width="3"/><line x1="480" y1="210" x2="468.2941876694152" y2="215.654551943446" stroke="#2368a2" stroke-width="3"/><line x1="480" y1="210" x2="468.2941876694152" y2="204.345448056554" stroke="#2368a2" stroke-width="3"/><rect x="350" y="350" width="360" height="112" rx="6" fill="#e8f1f8" stroke="none"/><text x="530" y="398" font-size="31" fill="#2368a2" text-anchor="middle" font-weight="600">训练 1077</text><text x="530" y="438" font-size="26" fill="#63788a" text-anchor="middle" font-weight="400">梯度与待拟合统计量</text><rect x="770" y="350" width="360" height="112" rx="6" fill="#fff0e4" stroke="none"/><text x="950" y="398" font-size="31" fill="#c56728" text-anchor="middle" font-weight="600">验证 360</text><text x="950" y="438" font-size="26" fill="#63788a" text-anchor="middle" font-weight="400">配置与最佳状态选择</text><line x1="620" y1="270" x2="530" y2="338" stroke="#2368a2" stroke-width="3"/><line x1="530" y1="338" x2="535.9309341425111" y2="326.43176676422905" stroke="#2368a2" stroke-width="3"/><line x1="530" y1="338" x2="542.7484361745682" y2="335.45493121842213" stroke="#2368a2" stroke-width="3"/><line x1="700" y1="270" x2="950" y2="338" stroke="#c56728" stroke-width="3"/><line x1="950" y1="338" x2="937.2204558511135" y2="340.3839570773528" stroke="#c56728" stroke-width="3"/><line x1="950" y1="338" x2="940.1886902370097" y2="329.4713306586167" stroke="#c56728" stroke-width="3"/><text x="40" y="307" font-size="25" fill="#63788a" font-weight="400">第二步：seed 42</text><text x="40" y="342" font-size="25" fill="#63788a" font-weight="400">仅拆开发索引</text><text x="40" y="525" font-size="28" fill="#23394b" text-anchor="start" font-weight="600">按类计数：每一列是同一个数字，三行合计覆盖该类全部图像</text><text x="310" y="585" font-size="28" fill="#23394b" text-anchor="middle" font-weight="600">0</text><text x="414" y="585" font-size="28" fill="#23394b" text-anchor="middle" font-weight="600">1</text><text x="518" y="585" font-size="28" fill="#23394b" text-anchor="middle" font-weight="600">2</text><text x="622" y="585" font-size="28" fill="#23394b" text-anchor="middle" font-weight="600">3</text><text x="726" y="585" font-size="28" fill="#23394b" text-anchor="middle" font-weight="600">4</text><text x="830" y="585" font-size="28" fill="#23394b" text-anchor="middle" font-weight="600">5</text><text x="934" y="585" font-size="28" fill="#23394b" text-anchor="middle" font-weight="600">6</text><text x="1038" y="585" font-size="28" fill="#23394b" text-anchor="middle" font-weight="600">7</text>