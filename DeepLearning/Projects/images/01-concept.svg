t-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="830" y="713" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="934" y="713" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="1038" y="713" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="1142" y="713" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">35</text><text x="1246" y="713" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><rect x="40" y="740" width="1310" height="56" rx="6" fill="#eef2f5" stroke="none"/><text x="65" y="778" font-size="28" fill="#23394b" text-anchor="start" font-weight="600">测试</text><text x="310" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="414" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="518" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">35</text><text x="622" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">37</text><text x="726" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="830" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">37</text><text x="934" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="1038" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><text x="1142" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">35</text><text x="1246" y="778" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">36</text><rect x="40" y="840" width="1310" height="128" rx="6" fill="#e8f1f8" stroke="none"/><text x="65" y="882" font-size="29" fill="#2368a2" text-anchor="start" font-weight="600">互斥 + 全集覆盖：验证的是索引协议；来源独立仍需可靠身份。</text><text x="65" y="930" font-size="27" fill="#23394b" text-anchor="start" font-weight="400">恢复验证选中的实际快照后，才用测试集评价；测试反馈开启下一轮研究。</text><path d="M420 210 V130 H1165 V150 M1159 138 L1165 150 L1171 138" fill="none" stroke="#63788a" stroke-width="3"/></g></svg>