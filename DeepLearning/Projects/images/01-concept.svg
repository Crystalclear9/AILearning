<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1873" viewBox="0 0 1200 1873" role="img"><title>数据划分与最终测试的隔离：机制、算例与边界</title><rect width="1200" height="1873" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">数据划分与最终测试的隔离</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="442.6" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="562.6" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1112.6" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="362.6" viewBox="0 225 1200 392" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">训练集</text><text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">拟合参数</text><path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">验证集</text><text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">选择超参数与阈值</text><path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">冻结方案</text><text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">固定处理与决策规则</text><path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">测试集</text><text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">独立估计泛化</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">箭头表示工作职责顺序，不表示将测试信息回传训练；主体与时间也须隔离。</text></g></svg><text x="48" y="605.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  100 条记录的划分算例</text><text x="48" y="1155.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  两种测试问题的单位不同</text><g transform="translate(30,622.6) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">100 条记录：训练 60、验证 20</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">测试 20；三集合样本身份不重合</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">若目标为新用户，进一步按用户隔离</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">先冻结方案，再评价 20 条测试记录</text></g><g transform="translate(45,1172.6) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">文件分开并不足够；相同主体、重复内容或未来事实跨集合仍</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">会导致泄漏。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">按用户隔离</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">按时间隔离</text><text x="805" y="870" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">甲：训练</text><circle cx="835" cy="900" r="11" fill="#15988d" /><circle cx="910" cy="900" r="11" fill="#15988d" /><circle cx="985" cy="900" r="11" fill="#15988d" /><text x="805" y="950" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">乙：测试</text><circle cx="835" cy="980" r="11" fill="#e2a15f" /><circle cx="910" cy="980" r="11" fill="#e2a15f" /><circle cx="985" cy="980" r="11" fill="#e2a15f" /><line x1="1160" y1="970" x2="1425" y2="970" stroke="#44859a" stroke-width="2" /><line x1="1290" y1="850" x2="1290" y2="1040" stroke="#e2a15f" stroke-width="3" /><circle cx="1170" cy="970" r="11" fill="#15988d" /><text x="1165" y="1015" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</text><circle cx="1245" cy="970" r="11" fill="#15988d" /><text x="1240" y="1015" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text><circle cx="1320" cy="970" r="11" fill="#e2a15f" /><text x="1315" y="1015" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">3</text><circle cx="1395" cy="970" r="11" fill="#e2a15f" /><text x="1390" y="1015" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</text><text x="1140" y="1080" font-size="20" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1、2日训练；3、4日测试</text></g></svg>
