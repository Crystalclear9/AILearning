<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>数据划分与最终测试的隔离</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">数据划分与最终测试的隔离</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">训练集</ns0:text><ns0:text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">拟合参数</ns0:text><ns0:path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">验证集</ns0:text><ns0:text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">选择超参数与阈值</ns0:text><ns0:path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">冻结方案</ns0:text><ns0:text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">固定处理与决策规则</ns0:text><ns0:path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">测试集</ns0:text><ns0:text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">独立估计泛化</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">箭头表示工作职责顺序，不表示将测试信息回传训练；主体与时间也须隔离。</ns0:text></g></svg>
