<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>错误切片与消融的不同问题</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">错误切片与消融的不同问题</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="50" y="236.15" width="460" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="65" y="280.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">错误切片</ns0:text><ns0:text x="65" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">同一模型按人群或场景分组</ns0:text><ns0:rect x="610" y="236.15" width="460" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="625" y="280.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">单因素消融</ns0:text><ns0:text x="625" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">更改组件后重新训练与评价</ns0:text><ns0:text x="80" y="456.65" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">问题：在哪里失败？</ns0:text><ns0:text x="650" y="456.65" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">问题：移除此组件后怎样？</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">比较需报告样本量、预算和随机种子；二者均不能凭一次分数差得出无条件因果结论。</ns0:text></g></svg>
