<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1886" viewBox="0 0 1200 1886" role="img"><title>错误切片与消融的不同问题：机制、算例与边界</title><rect width="1200" height="1886" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误切片与消融的不同问题</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="456.475" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="576.475" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1126.475" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="376.475" viewBox="0 210 1200 407" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="50" y="236.15" width="460" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="65" y="280.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">错误切片</text><text x="65" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">同一模型按人群或场景分组</text><rect x="610" y="236.15" width="460" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="625" y="280.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">单因素消融</text><text x="625" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">更改组件后重新训练与评价</text><text x="80" y="456.65" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">问题：在哪里失败？</text><text x="650" y="456.65" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">问题：移除此组件后怎样？</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">比较需报告样本量、预算和随机种子；二者均不能凭一次分数差得出无条件因果结论。</text></g></svg><text x="48" y="619.475" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  同一模型的切片与重训练分别记账</text><text x="48" y="1169.475" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  切片差异不是组件消融结果</text><g transform="translate(30,636.475) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">组甲 90 条：9 错，错误率 10%</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">组乙 10 条：2 错，错误率 20%</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">全体：11÷100＝11%</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">移除组件重训练后须另测全体 100 条</text></g><g transform="translate(45,1186.475) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">小组差异可能来自样本组成；组件比较又可能受参数量、预算</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">与随机性混杂。</tspan></text><line x1="820" y1="1040" x2="1420" y2="1040" stroke="#44859a" stroke-width="2" /><rect x="900" y="952.5" width="100" height="87.5" fill="#15988d" stroke="#8caab9" stroke-width="1" /><text x="895" y="937.5" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.1</text><text x="850" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">组甲错误率</text><rect x="1200" y="865.0" width="100" height="175.0" fill="#e2a15f" stroke="#8caab9" stroke-width="1" /><text x="1195" y="850.0" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.2</text><text x="1150" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">组乙错误率</text><text x="820" y="830" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同一模型：9÷90 vs 2÷10</text></g></svg>
