<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>错误切片与消融的不同问题：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误切片与消融的不同问题</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="50" y="236.15" width="460" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="65" y="280.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">错误切片</ns0:text><ns0:text x="65" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">同一模型按人群或场景分组</ns0:text><ns0:rect x="610" y="236.15" width="460" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="625" y="280.25" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">单因素消融</ns0:text><ns0:text x="625" y="331.7" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">更改组件后重新训练与评价</ns0:text><ns0:text x="80" y="456.65" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">问题：在哪里失败？</ns0:text><ns0:text x="650" y="456.65" font-family="Microsoft YaHei,sans-serif" font-size="24.0" fill="#16324f">问题：移除此组件后怎样？</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">比较需报告样本量、预算和随机种子；二者均不能凭一次分数差得出无条件因果结论。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  同一模型的切片与重训练分别记账</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  切片差异不是组件消融结果</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">组甲 90 条：9 错，错误率 10%</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">组乙 10 条：2 错，错误率 20%</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">全体：11÷100＝11%</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">移除组件重训练后须另测全体 100 条</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">小组差异可能来自样本组成；组件比较又可能受参数量、预算</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">与随机性混杂。</ns0:text><ns0:line x1="820" y1="1040" x2="1420" y2="1040" stroke="#44859a" stroke-width="2" /><ns0:rect x="900" y="952.5" width="100" height="87.5" fill="#15988d" stroke="#8caab9" stroke-width="1" /><ns0:text x="895" y="937.5" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.1</ns0:text><ns0:text x="850" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">组甲错误率</ns0:text><ns0:rect x="1200" y="865.0" width="100" height="175.0" fill="#e2a15f" stroke="#8caab9" stroke-width="1" /><ns0:text x="1195" y="850.0" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.2</ns0:text><ns0:text x="1150" y="1085" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">组乙错误率</ns0:text><ns0:text x="820" y="830" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同一模型：9÷90 vs 2÷10</ns0:text></ns0:svg>
