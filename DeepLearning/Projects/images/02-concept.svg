<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1916" viewBox="0 0 1200 1916" role="img"><title>最佳模型选择与最终评估：机制、算例与边界</title><rect width="1200" height="1916" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">最佳模型选择与最终评估</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="486.07500000000005" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="606.075" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1156.075" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="406.07500000000005" viewBox="0 178 1200 439" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M130,478.7 L1000,478.7" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M130,478.7 L130,206.75" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="200" y="243.5" width="20" height="29.4" rx="5" fill="#82b598" stroke="#718fa9" /><text x="145" y="221.45" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">第1轮 0.6</text><path d="M210,258.2 L500,434.6" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="490" y="419.9" width="20" height="29.4" rx="5" fill="#82b598" stroke="#718fa9" /><text x="435" y="397.85" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">第2轮 0.4</text><path d="M500,434.6 L790,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="780" y="331.7" width="20" height="29.4" rx="5" fill="#82b598" stroke="#718fa9" /><text x="725" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">第3轮 0.5</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">按最低验证损失选择第二轮并重新加载；测试集不能参与这一选择。</text></g></svg><text x="48" y="649.075" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  最低验证损失对应保存的模型</text><text x="48" y="1199.075" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  最后一轮不一定最佳</text><g transform="translate(30,666.075) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第 1 轮：0.6</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第 2 轮：0.4 → 保存</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第 3 轮：0.5 → 不覆盖最佳</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">测试前加载第 2 轮</text></g><g transform="translate(45,1216.075) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="896.0" width="120" height="152.0" fill="#169b8d" /><text x="895" y="881.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.4</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第二轮验证损失</text><rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.5</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第三轮验证损失</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">图中损失越低越好；如果采用准确率等指标，应明确选择方向</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">和相同验证协议。</tspan></text></g></svg>
