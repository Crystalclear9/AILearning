<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>最佳模型选择与最终评估</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">最佳模型选择与最终评估</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:path d="M130,478.7 L1000,478.7" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M130,478.7 L130,206.75" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="200" y="243.5" width="20" height="29.4" rx="5" fill="#82b598" stroke="#718fa9" /><ns0:text x="145" y="221.45" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">第1轮 0.6</ns0:text><ns0:path d="M210,258.2 L500,434.6" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="490" y="419.9" width="20" height="29.4" rx="5" fill="#82b598" stroke="#718fa9" /><ns0:text x="435" y="397.85" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">第2轮 0.4</ns0:text><ns0:path d="M500,434.6 L790,346.4" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="780" y="331.7" width="20" height="29.4" rx="5" fill="#82b598" stroke="#718fa9" /><ns0:text x="725" y="309.65" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">第3轮 0.5</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">按最低验证损失选择第二轮并重新加载；测试集不能参与这一选择。</ns0:text></g></svg>
