<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="1450.0" viewBox="0 0 1280 1450" role="img"><title>选择的是一个真实参数状态，不只是曲线上的最低值</title><rect width="1280" height="880" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">选择的是一个真实参数状态，不只是曲线上的最低值</text><text x="60" y="125" font-size="28" fill="#19343e" text-anchor="start">固定 digits 实验：三十轮预算，按验证交叉熵选快照</text><text x="350" y="205" font-size="31" fill="#276a80" text-anchor="middle">第 28 轮</text><line x1="190" y1="500" x2="510" y2="500" stroke="#74888d" stroke-width="2" /><rect x="285" y="294.848" width="130" height="205.152" fill="#276a80" /><text x="350" y="272.848" font-size="30" fill="#276a80" text-anchor="middle">0.085480</text><text x="350" y="555" font-size="27" fill="#19343e" text-anchor="middle">验证 CE</text><text x="930" y="205" font-size="31" fill="#c2673f" text-anchor="middle">第 30 轮</text><line x1="770" y1="500" x2="1090" y2="500" stroke="#74888d" stroke-width="2" /><rect x="865" y="274.72159999999997" width="130" height="225.27840000000003" fill="#c2673f" /><text x="930" y="252.72159999999997" font-size="30" fill="#c2673f" text-anchor="middle">0.093866</text><text x="930" y="555" font-size="27" fill="#19343e" text-anchor="middle">验证 CE</text><text x="60" y="625" font-size="29" fill="#276a80" text-anchor="start">0.085480 &lt; 0.093866：恢复第 28 轮，再核对验证损失</text><line x1="350" y1="660" x2="350" y2="700" stroke="#276a80" stroke-width="4" /><path d="M344.25,689.47 L350.00,700.00 L355.75,689.47" fill="none" stroke="#276a80" stroke-width="4" /><line x1="350" y1="700" x2="855" y2="700" stroke="#276a80" stroke-width="4" /><path d="M844.47,705.75 L855.00,700.00 L844.47,694.25" fill="none" stroke="#276a80" stroke-width="4" /><text x="880" y="710" font-size="30" fill="#276a80" text-anchor="start">冻结预测</text><text x="60" y="790" font-size="29" fill="#19343e" text-anchor="start">同一份测试预测 → 344 张正确，16 张错误；共 360 张</text><text x="60" y="850" font-size="27" fill="#74888d" text-anchor="start">验证用于选择；测试用于评价已选择的状态，不能反向挑轮次。</text></g><g transform="translate(0,880) scale(1.38889)"><metadata>
