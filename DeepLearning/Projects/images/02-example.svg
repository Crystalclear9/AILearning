<svg xmlns="http://www.w3.org/2000/svg" width="1189.55" height="730.548" viewBox="20.226 53.226 1189.55 730.548" role="img" aria-labelledby="plate-title"><defs><linearGradient id="edition-wash-1" x1="0%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#edf5f6"/><stop offset="100%" stop-color="#e0edf0"/></linearGradient><linearGradient id="edition-wash-2" x1="0%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#f8eee9"/><stop offset="100%" stop-color="#f2e1d8"/></linearGradient></defs><title id="plate-title">最佳快照必须独立于当前参数存储</title><rect id="edition-paper" x="20.226" y="53.226" width="1189.55" height="730.548" fill="#ffffff"/><svg id="edition-view" x="42" y="75" width="1146" height="687" viewBox="42 75 1146 687" overflow="hidden"><rect x="42" y="75" width="1146" height="687" fill="#ffffff"/><rect width="1280" height="760" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#5d747c" text-anchor="start">手算线性层 y = w·x；x = (1, 2)，初始权重 w = (1, 2)，偏置为 0</text><text x="100" y="195" font-size="30" fill="#273240" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">第二轮：记录最佳状态</text><text x="100" y="260" font-size="27" fill="#273240" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">当前模型</text><rect x="100" y="285" width="240" height="75" fill="url(#edition-wash-1)"/><text x="220" y="335" font-size="30" fill="#273240" text-anchor="middle">[1, 2]</text><text x="510" y="260" font-size="27" fill="#273240" text-anchor="start">共享 state_dict</text><rect x="510" y="285" width="240" height="75" fill="url(#edition-wash-1)"/><text x="630" y="335" font-size="30" fill="#273240" text-anchor="middle">[1, 2]</text><text x="930" y="260" font-size="27" fill="#273240" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">独立快照</text><rect x="930" y="285" width="240" height="75" fill="url(#edition-wash-1)"/><text x="1050" y="335" font-size="30" fill="#273240" text-anchor="middle">[1, 2]</text><text x="100" y="430" font-size="30" fill="#273240" text-anchor="start">第三轮：当前权重每项加 5</text><rect x="100" y="465" width="240" height="75" fill="url(#edition-wash-2)"/><text x="220" y="515" font-size="30" fill="#8e5437" text-anchor="middle">[6, 7]</text><rect x="510" y="465" width="240" height="75" fill="url(#edition-wash-2)"/><text x="630" y="515" font-size="30" fill="#8e5437" text-anchor="middle">[6, 7]</text><rect x="930" y="465" width="240" height="75" fill="url(#edition-wash-1)"/><text x="1050" y="515" font-size="30" fill="#2a708b" text-anchor="middle">[1, 2]</text><line x1="340" y1="500" x2="510" y2="500" stroke="#b26945" stroke-width="4"/><text x="60" y="630" font-size="27" fill="#273240" text-anchor="start">当前预测 = 20；共享引用也读到新权重；独立快照仍可恢复预测 5。</text><text x="60" y="690" font-size="27" fill="#273240" text-anchor="start">“最佳轮次 = 2”的元数据不会冻结张量；需要独立复制或立即序列化。</text><text x="60" y="740" font-size="25" fill="#5d747c" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">这是数值固定的别名示例；续训检查点还需优化器、调度器及随机状态。</text></g></svg></svg>
