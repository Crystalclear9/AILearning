<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><ns0:title>用未来干预检验目标因果掩码</ns0:title><ns0:defs><ns0:marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><ns0:path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></ns0:marker></ns0:defs><ns0:rect width="1200" height="750" fill="#f5faff" /><ns0:rect x="18" y="78" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:text x="35" y="50" font-size="28.0" fill="#18364e">用未来干预检验目标因果掩码</ns0:text><ns0:rect x="40.0" y="115.0" width="356.0" height="121.0" rx="6" fill="#cce2f2" stroke="#7895aa" /><ns0:rect x="400.0" y="115.0" width="356.0" height="121.0" rx="6" fill="#cce2f2" stroke="#7895aa" /><ns0:rect x="760.0" y="115.0" width="356.0" height="121.0" rx="6" fill="#cce2f2" stroke="#7895aa" /><ns0:rect x="40.0" y="240.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="400.0" y="240.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="760.0" y="240.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="40.0" y="365.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="400.0" y="365.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="760.0" y="365.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="40.0" y="490.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="400.0" y="490.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="760.0" y="490.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:text x="53.0" y="150.0" font-size="23" fill="#143651">实验</ns0:text><ns0:text x="413.0" y="150.0" font-size="23" fill="#143651">应保持不变</ns0:text><ns0:text x="773.0" y="150.0" font-size="23" fill="#143651">允许变化</ns0:text><ns0:text x="53.0" y="275.0" font-size="23" fill="#143651">改变未来目标 token</ns0:text><ns0:text x="413.0" y="275.0" font-size="23" fill="#143651">更早位置的输出</ns0:text><ns0:text x="773.0" y="275.0" font-size="23" fill="#143651">该位置及后续输出</ns0:text><ns0:text x="53.0" y="400.0" font-size="23" fill="#143651">改变源 token</ns0:text><ns0:text x="413.0" y="400.0" font-size="23" fill="#143651">不要求目标输出不变</ns0:text><ns0:text x="773.0" y="400.0" font-size="23" fill="#143651">所有依赖源的目标输出</ns0:text><ns0:text x="53.0" y="525.0" font-size="23" fill="#143651">改变源填充区</ns0:text><ns0:text x="413.0" y="525.0" font-size="23" fill="#143651">有效目标输出</ns0:text><ns0:text x="773.0" y="525.0" font-size="23" fill="#143651">仅无效或被屏蔽位置</ns0:text></ns0:g></ns0:svg>
