<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1064.99" height="720.988" viewBox="22.506 55.506 1064.99 720.988" role="img" aria-labelledby="plate-title"><title id="plate-title">KV 缓存的有效性依赖历史表示不变</title><rect id="edition-paper" x="22.506" y="55.506" width="1064.99" height="720.988" fill="#ffffff"/><svg id="edition-view" x="42" y="75" width="1026" height="682" viewBox="42 75 1026 682" overflow="hidden"><rect x="42" y="75" width="1026" height="682" fill="#ffffff"/><rect width="1280" height="760" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#708c96" text-anchor="start">单层注意力；所有可见分数均为 0，值依次为 1、3，再追加 8</text><text x="100" y="190" font-size="30" fill="#2a708b" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">因果读取</text><text x="100" y="245" font-size="27" fill="#273240" text-anchor="start">前缀 1、3</text><rect x="100" y="280" width="90" height="70" fill="#e0edf0"/><text x="145" y="326" font-size="30" fill="#273240" text-anchor="middle">1</text><rect x="220" y="280" width="90" height="70" fill="#e0edf0"/><text x="265" y="326" font-size="30" fill="#273240" text-anchor="middle">2</text><text x="100" y="405" font-size="27" fill="#273240" text-anchor="start">追加 8 后</text><rect x="100" y="440" width="90" height="70" fill="#e0edf0"/><text x="145" y="486" font-size="30" fill="#273240" text-anchor="middle">1</text><rect x="220" y="440" width="90" height="70" fill="#e0edf0"/><text x="265" y="486" font-size="30" fill="#273240" text-anchor="middle">2</text><rect x="340" y="440" width="90" height="70" fill="#e0edf0"/><text x="385" y="486" font-size="30" fill="#273240" text-anchor="middle">4</text><text x="100" y="595" font-size="27" fill="#2a708b" text-anchor="start">旧位置仍为 1、2</text><text x="720" y="190" font-size="30" fill="#b26945" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">双向读取</text><text x="720" y="245" font-size="27" fill="#273240" text-anchor="start">前缀 1、3</text><rect x="720" y="280" width="90" height="70" fill="#f2e1d8"/><text x="765" y="326" font-size="30" fill="#273240" text-anchor="middle">2</text><rect x="840" y="280" width="90" height="70" fill="#f2e1d8"/><text x="885" y="326" font-size="30" fill="#273240" text-anchor="middle">2</text><text x="720" y="405" font-size="27" fill="#273240" text-anchor="start">追加 8 后</text><rect x="720" y="440" width="90" height="70" fill="#f2e1d8"/><text x="765" y="486" font-size="30" fill="#273240" text-anchor="middle">4</text><rect x="840" y="440" width="90" height="70" fill="#f2e1d8"/><text x="885" y="486" font-size="30" fill="#273240" text-anchor="middle">4</text><rect x="960" y="440" width="90" height="70" fill="#f2e1d8"/><text x="1005" y="486" font-size="30" fill="#273240" text-anchor="middle">4</text><text x="720" y="595" font-size="27" fill="#b26945" text-anchor="start">旧位置由 2、2 变为 4、4</text><text x="60" y="680" font-size="26" fill="#273240" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">每个输出都是合法值的平均；因果结构保持旧表示，双向结构重新读取新增内容。</text><text x="60" y="735" font-size="25" fill="#708c96" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">真实多层网络逐层检查同一不变性；还要固定位置编码、模型状态与掩码。</text></g></svg></svg>