<svg xmlns="http://www.w3.org/2000/svg" width="1225.88" height="661.878" viewBox="19.561 57.561 1225.88 661.878" role="img" aria-labelledby="plate-title"><title id="plate-title">真实生成错例对比正确目标与模型输出的次序和计数差异</title><rect id="edition-paper" x="19.561" y="57.561" width="1225.88" height="661.878" fill="#ffffff"/><svg id="edition-view" x="42" y="80" width="1181" height="617" viewBox="42 80 1181 617" overflow="hidden"><rect x="42" y="80" width="1181" height="617" fill="#ffffff"/><rect width="1280" height="720" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="120" font-size="26" fill="#283341" text-anchor="start">本章固定划分与种子下的真实生成错例；EOS 表示模型自行结束。</text><text x="60" y="211" font-size="28" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">源</text><rect x="310" y="165" width="120" height="76" fill="#eff5f6"/><text x="370" y="214" font-size="30" fill="#2c6f89" text-anchor="middle">3</text><rect x="445" y="165" width="120" height="76" fill="#eff5f6"/><text x="505" y="214" font-size="30" fill="#2c6f89" text-anchor="middle">4</text><rect x="580" y="165" width="120" height="76" fill="#eff5f6"/><text x="640" y="214" font-size="30" fill="#2c6f89" text-anchor="middle">4</text><rect x="715" y="165" width="120" height="76" fill="#eff5f6"/><text x="775" y="214" font-size="30" fill="#2c6f89" text-anchor="middle">5</text><text x="60" y="306" font-size="28" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">正确目标</text><rect x="310" y="260" width="120" height="76" fill="#eff5f6"/><text x="370" y="309" font-size="30" fill="#2c6f89" text-anchor="middle">5</text><rect x="445" y="260" width="120" height="76" fill="#eff5f6"/><text x="505" y="309" font-size="30" fill="#2c6f89" text-anchor="middle">4</text><rect x="580" y="260" width="120" height="76" fill="#eff5f6"/><text x="640" y="309" font-size="30" fill="#2c6f89" text-anchor="middle">4</text><rect x="715" y="260" width="120" height="76" fill="#eff5f6"/><text x="775" y="309" font-size="30" fill="#2c6f89" text-anchor="middle">3</text><rect x="850" y="260" width="120" height="76" fill="#eff5f6"/><text x="910" y="309" font-size="30" fill="#2c6f89" text-anchor="middle">EOS</text><text x="60" y="401" font-size="28" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">实际生成</text><rect x="310" y="355" width="120" height="76" fill="#eff5f6"/><text x="370" y="404" font-size="30" fill="#b56b47" text-anchor="middle">5</text><rect x="445" y="355" width="120" height="76" fill="#eff5f6"/><text x="505" y="404" font-size="30" fill="#b56b47" text-anchor="middle">4</text><rect x="580" y="355" width="120" height="76" fill="#faf0eb"/><text x="640" y="404" font-size="30" fill="#b56b47" text-anchor="middle">3</text><rect x="715" y="355" width="120" height="76" fill="#faf0eb"/><text x="775" y="404" font-size="30" fill="#b56b47" text-anchor="middle">4</text><rect x="850" y="355" width="120" height="76" fill="#eff5f6"/><text x="910" y="404" font-size="30" fill="#b56b47" text-anchor="middle">EOS</text><text x="310" y="470" font-size="27" fill="#b56b47" text-anchor="start">长度正确，结束正确；第 3、4 个符号次序错误。</text><line x1="60" y1="505" x2="1205" y2="505" stroke="#e3e8ee" stroke-width="2"/><text x="60" y="555" font-size="27" fill="#283341" text-anchor="start">另一条源：(3, 3, 3)</text><text x="60" y="610" font-size="27" fill="#2c6f89" text-anchor="start">正确：(3, 3, 3, EOS)</text><text x="650" y="610" font-size="27" fill="#b56b47" text-anchor="start">生成：(3, 3, 3, 3, EOS)</text><text x="60" y="675" font-size="29" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">十九条全部在预算内结束，仍只有十一条整条精确匹配。</text></g></svg></svg>