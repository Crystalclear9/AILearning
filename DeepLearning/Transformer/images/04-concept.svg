<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1894" viewBox="0 0 1200 1894" role="img"><title>长度翻倍时不同资源怎样增长：机制、算例与边界</title><rect width="1200" height="1894" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">长度翻倍时不同资源怎样增长</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="463.875" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="583.875" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1133.875" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="383.875" viewBox="0 203 1200 415" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="100" y="258.2" width="75" height="110.25" rx="5" fill="#a9cee6" stroke="#718fa9" /><rect x="230" y="228.8" width="150" height="220.5" rx="5" fill="#a9cee6" stroke="#718fa9" /><text x="100" y="500.75" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">L²</text><text x="250" y="500.75" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">(2L)²＝4L²</text><rect x="590" y="265.55" width="145" height="73.5" rx="5" fill="#bdddc7" stroke="#718fa9" /><rect x="590" y="383.15" width="290" height="73.5" rx="5" fill="#bdddc7" stroke="#718fa9" /><text x="770" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV：L</text><text x="900" y="434.6" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV：2L</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">固定层数、层宽、头数与精度；此图比较元素规模，不能直接预测墙钟时间。</text></g></svg><text x="48" y="626.875" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  长度翻倍的两个资源账本</text><text x="48" y="1176.875" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  缓存增长与完整分数增长不同</text><g transform="translate(30,643.875) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">前缀：L → 2L</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">完整分数：L² → 4L²</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">KV 缓存：L → 2L</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">其余层数、宽度、精度固定</text></g><g transform="translate(45,1193.875) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="953.0" width="120" height="95.0" fill="#169b8d" /><text x="895" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">KV 相对规模</text><rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">4</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">完整分数相对规模</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">这是元素数量比，不是延迟倍率；计算重排、量化和分组查询</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">会改变存储常数与实际执行。</tspan></text></g></svg>
