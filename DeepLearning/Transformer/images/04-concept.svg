<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>长度翻倍时不同资源怎样增长：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">长度翻倍时不同资源怎样增长</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="100" y="258.2" width="75" height="110.25" rx="5" fill="#a9cee6" stroke="#718fa9" /><ns0:rect x="230" y="228.8" width="150" height="220.5" rx="5" fill="#a9cee6" stroke="#718fa9" /><ns0:text x="100" y="500.75" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">L²</ns0:text><ns0:text x="250" y="500.75" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">(2L)²＝4L²</ns0:text><ns0:rect x="590" y="265.55" width="145" height="73.5" rx="5" fill="#bdddc7" stroke="#718fa9" /><ns0:rect x="590" y="383.15" width="290" height="73.5" rx="5" fill="#bdddc7" stroke="#718fa9" /><ns0:text x="770" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV：L</ns0:text><ns0:text x="900" y="434.6" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV：2L</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">固定层数、层宽、头数与精度；此图比较元素规模，不能直接预测墙钟时间。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  长度翻倍的两个资源账本</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  缓存增长与完整分数增长不同</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">前缀：L → 2L</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">完整分数：L² → 4L²</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">KV 缓存：L → 2L</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">其余层数、宽度、精度固定</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="953.0" width="120" height="95.0" fill="#169b8d" /><ns0:text x="895" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">KV 相对规模</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">4</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">完整分数相对规模</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">这是元素数量比，不是延迟倍率；计算重排、量化和分组查询</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">会改变存储常数与实际执行。</ns0:text></ns0:svg>
