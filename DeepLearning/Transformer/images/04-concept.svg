<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>长度翻倍时不同资源怎样增长</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">长度翻倍时不同资源怎样增长</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="100" y="258.2" width="75" height="110.25" rx="5" fill="#a9cee6" stroke="#718fa9" /><ns0:rect x="230" y="228.8" width="150" height="220.5" rx="5" fill="#a9cee6" stroke="#718fa9" /><ns0:text x="100" y="500.75" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">L²</ns0:text><ns0:text x="250" y="500.75" font-family="Microsoft YaHei,sans-serif" font-size="22.0" fill="#16324f">(2L)²＝4L²</ns0:text><ns0:rect x="590" y="265.55" width="145" height="73.5" rx="5" fill="#bdddc7" stroke="#718fa9" /><ns0:rect x="590" y="383.15" width="290" height="73.5" rx="5" fill="#bdddc7" stroke="#718fa9" /><ns0:text x="770" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV：L</ns0:text><ns0:text x="900" y="434.6" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV：2L</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">固定层数、层宽、头数与精度；此图比较元素规模，不能直接预测墙钟时间。</ns0:text></g></svg>
