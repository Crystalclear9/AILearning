<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>长度翻倍时不同资源怎样增长</title>
<desc>原创教学示意：上下文长度|从 L 增加到 2L;完整注意力分数|元素约增加到 4 倍;KV 缓存|固定层宽时约 2 倍;实际预算|还依赖批量、层数与精度</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">长度翻倍时不同资源怎样增长</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">上下文长度</text>
<text x="53" y="160" font-size="21" fill="#16324f">从 L 增加到 2L</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">完整注意力分数</text>
<text x="603" y="160" font-size="21" fill="#16324f">元素约增加到 4 倍</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">KV 缓存</text>
<text x="53" y="330" font-size="21" fill="#16324f">固定层宽时约 2 倍</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">实际预算</text>
<text x="603" y="330" font-size="21" fill="#16324f">还依赖批量、层数与精度</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">L 翻倍时：完整分数矩阵面积与缓存长度不同</text><rect x="100" y="570" width="75" height="75" rx="5" fill="#a9cee6" stroke="#718fa9"/><rect x="230" y="550" width="150" height="150" rx="5" fill="#a9cee6" stroke="#718fa9"/><text x="100" y="735" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">L²</text><text x="250" y="735" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#16324f">(2L)²＝4L²</text><rect x="590" y="575" width="145" height="50" rx="5" fill="#bdddc7" stroke="#718fa9"/><rect x="590" y="655" width="290" height="50" rx="5" fill="#bdddc7" stroke="#718fa9"/><text x="770" y="610" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">KV：L</text><text x="900" y="690" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">KV：2L</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">固定层数、层宽、头数与精度；此图比较元素规模，不能直接预测墙钟时间。</text></svg>