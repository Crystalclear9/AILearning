<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>标签移位与增量 KV 缓存</title>
<desc>原创教学示意：输入|A、B、C;对应标签|B、C、结束符;预填充|保存前缀各层键和值;增量生成|新查询读取历史缓存</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">标签移位与增量 KV 缓存</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">输入</text>
<text x="53" y="160" font-size="21" fill="#16324f">A、B、C</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">对应标签</text>
<text x="603" y="160" font-size="21" fill="#16324f">B、C、结束符</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">预填充</text>
<text x="53" y="330" font-size="21" fill="#16324f">保存前缀各层键和值</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">增量生成</text>
<text x="603" y="330" font-size="21" fill="#16324f">新查询读取历史缓存</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">训练标签移位与生成缓存是同一因果目标的两种计算安排</text><text x="40" y="580" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">输入</text><rect x="160" y="545" width="125" height="48" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="195" y="577" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">A</text><rect x="300" y="545" width="125" height="48" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="335" y="577" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B</text><rect x="440" y="545" width="125" height="48" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="475" y="577" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">C</text><text x="40" y="645" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">目标</text><rect x="160" y="610" width="125" height="48" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="195" y="642" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B</text><rect x="300" y="610" width="125" height="48" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="335" y="642" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">C</text><rect x="440" y="610" width="125" height="48" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="475" y="642" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">结束符</text><rect x="680" y="550" width="350" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="695" y="580" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">KV 缓存</text><text x="695" y="615" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">保存前缀各层键和值</text><text x="700" y="710" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">新 token 只增量计算自己的 K、V</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">目标相对输入移一位；缓存避免重复计算历史，不提供未来标签。</text></svg>