<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>标签移位与增量 KV 缓存：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">标签移位与增量 KV 缓存</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:text x="40" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</ns0:text><ns0:rect x="160" y="221.45" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="195" y="268.49" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">A</ns0:text><ns0:rect x="300" y="221.45" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="335" y="268.49" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B</ns0:text><ns0:rect x="440" y="221.45" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="475" y="268.49" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">C</ns0:text><ns0:text x="40" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">目标</ns0:text><ns0:rect x="160" y="317.0" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="195" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B</ns0:text><ns0:rect x="300" y="317.0" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="335" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">C</ns0:text><ns0:rect x="440" y="317.0" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="475" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">结束符</ns0:text><ns0:rect x="680" y="228.8" width="350" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="695" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV 缓存</ns0:text><ns0:text x="695" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">保存前缀各层键和值</ns0:text><ns0:text x="700" y="464.0" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">新 token 只增量计算自己的 K、V</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">目标相对输入移一位；缓存避免重复计算历史，不提供未来标签。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  标签位置与缓存时间不能混淆</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  再移位一次会改变预测目标</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入：A、B、C</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">目标：B、C、EOS</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">预填充缓存已有 K、V</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">下一步增量计算新 token</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">接口若内部已移位，外部不应再额外移动；缓存复用也必须保</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">持相同位置索引。</ns0:text><ns0:text x="795" y="875" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">输入</ns0:text><ns0:rect x="940" y="840" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="985" y="883" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">A</ns0:text><ns0:rect x="1100" y="840" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1145" y="883" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B</ns0:text><ns0:rect x="1260" y="840" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1305" y="883" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">C</ns0:text><ns0:text x="795" y="965" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">正确标签</ns0:text><ns0:rect x="940" y="930" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="985" y="973" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B</ns0:text><ns0:rect x="1100" y="930" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1145" y="973" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">C</ns0:text><ns0:rect x="1260" y="930" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><ns0:text x="1305" y="973" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">EOS</ns0:text><ns0:text x="795" y="1055" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">多移一次</ns0:text><ns0:rect x="940" y="1020" width="140" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="985" y="1063" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">C</ns0:text><ns0:rect x="1100" y="1020" width="140" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="1145" y="1063" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">EOS</ns0:text><ns0:rect x="1260" y="1020" width="140" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="1305" y="1063" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">—</ns0:text></ns0:svg>
