<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900" role="img"><title>标签移位与增量 KV 缓存：机制、算例与边界</title><rect width="1200" height="1900" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">标签移位与增量 KV 缓存</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="470.35" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="590.35" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1140.35" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="390.35" viewBox="0 195 1200 422" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入</text><rect x="160" y="221.45" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="195" y="268.49" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">A</text><rect x="300" y="221.45" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="335" y="268.49" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B</text><rect x="440" y="221.45" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="475" y="268.49" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">C</text><text x="40" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">目标</text><rect x="160" y="317.0" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="195" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">B</text><rect x="300" y="317.0" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="335" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">C</text><rect x="440" y="317.0" width="125" height="70.56" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="475" y="364.03999999999996" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">结束符</text><rect x="680" y="228.8" width="350" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="695" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV 缓存</text><text x="695" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">保存前缀各层键和值</text><text x="700" y="464.0" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">新 token 只增量计算自己的 K、V</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">目标相对输入移一位；缓存避免重复计算历史，不提供未来标签。</text></g></svg><text x="48" y="633.35" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  标签位置与缓存时间不能混淆</text><text x="48" y="1183.35" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  再移位一次会改变预测目标</text><g transform="translate(30,650.35) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入：A、B、C</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">目标：B、C、EOS</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">预填充缓存已有 K、V</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">下一步增量计算新 token</text></g><g transform="translate(45,1200.35) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">接口若内部已移位，外部不应再额外移动；缓存复用也必须保</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">持相同位置索引。</tspan></text><text x="795" y="875" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">输入</text><rect x="940" y="840" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><text x="985" y="883" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">A</text><rect x="1100" y="840" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><text x="1145" y="883" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B</text><rect x="1260" y="840" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><text x="1305" y="883" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">C</text><text x="795" y="965" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">正确标签</text><rect x="940" y="930" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><text x="985" y="973" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B</text><rect x="1100" y="930" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><text x="1145" y="973" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">C</text><rect x="1260" y="930" width="140" height="65" fill="#d8eee5" stroke="#8caab9" stroke-width="1" /><text x="1305" y="973" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">EOS</text><text x="795" y="1055" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">多移一次</text><rect x="940" y="1020" width="140" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><text x="985" y="1063" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">C</text><rect x="1100" y="1020" width="140" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><text x="1145" y="1063" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">EOS</text><rect x="1260" y="1020" width="140" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><text x="1305" y="1063" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">—</text></g></svg>
