x="680" y="228.8" width="350" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="695" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">KV 缓存</ns0:text><ns0:text x="695" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">保存前缀各层键和值</ns0:text><ns0:text x="700" y="464.0" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">新 token 只增量计算自己的 K、V</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">目标相对输入移一位；缓存避免重复计算历史，不提供未来标签。</ns0:text></g></svg>
