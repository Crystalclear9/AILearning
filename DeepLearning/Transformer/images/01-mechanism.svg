<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><ns0:title>无位置编码的自注意力对重新编号等变</ns0:title><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></ns0:marker></ns0:defs><ns0:rect width="1200" height="750" fill="#f5faff" /><ns0:rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:text x="38" y="50" font-size="30" fill="#143651">无位置编码的自注意力对重新编号等变</ns0:text><ns0:rect x="150" y="170" width="160" height="80" rx="8" fill="#e7f2fa" stroke="#82a2b7" /><ns0:text x="218" y="220" font-size="30" fill="#143651">A</ns0:text><ns0:rect x="150" y="490" width="160" height="80" rx="8" fill="#d9eee8" stroke="#82a2b7" /><ns0:text x="218" y="540" font-size="30" fill="#143651">C</ns0:text><ns0:line x1="230" y1="255" x2="580" y2="480" stroke="#6c9bac" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="500" y="170" width="160" height="80" rx="8" fill="#e7f2fa" stroke="#82a2b7" /><ns0:text x="568" y="220" font-size="30" fill="#143651">B</ns0:text><ns0:rect x="500" y="490" width="160" height="80" rx="8" fill="#d9eee8" stroke="#82a2b7" /><ns0:text x="568" y="540" font-size="30" fill="#143651">A</ns0:text><ns0:line x1="580" y1="255" x2="930" y2="480" stroke="#6c9bac" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="850" y="170" width="160" height="80" rx="8" fill="#e7f2fa" stroke="#82a2b7" /><ns0:text x="918" y="220" font-size="30" fill="#143651">C</ns0:text><ns0:rect x="850" y="490" width="160" height="80" rx="8" fill="#d9eee8" stroke="#82a2b7" /><ns0:text x="918" y="540" font-size="30" fill="#143651">B</ns0:text><ns0:line x1="930" y1="255" x2="230" y2="480" stroke="#6c9bac" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="70" y="640" font-size="24" fill="#143651">全连接、无位置项且关闭随机性：输入与输出按同一置换重排。</ns0:text><ns0:text x="70" y="685" font-size="24" fill="#143651">有掩码时须同步置换掩码；只重排内容并固定因果掩码，通常不成立。</ns0:text></ns0:g></ns0:svg>
