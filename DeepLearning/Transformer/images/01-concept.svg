<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>一个 Transformer 块的两类交互：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">一个 Transformer 块的两类交互</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入 X</ns0:text><ns0:text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">内容＋位置</ns0:text><ns0:path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">注意力子层</ns0:text><ns0:text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">跨位置读取，配残差</ns0:text><ns0:path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">前馈子层</ns0:text><ns0:text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">同一位置特征变换</ns0:text><ns0:path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</ns0:text><ns0:rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输出 H</ns0:text><ns0:text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">保留长度，宽度相容</ns0:text><ns0:text x="310" y="471.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">残差 1：输入与注意力输出相加</ns0:text><ns0:text x="680" y="471.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">残差 2：加前馈输出</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">归一化放置决定 Pre-LN 或 Post-LN；图只表示子层职责，不固定归一化顺序。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  块内宽度守恒不限制前馈内部扩宽</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  前馈逐位置不负责跨位置读取</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入：B×T×8</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">注意力输出回到 8 维后作残差</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">前馈内部：8→32→8</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">块输出：B×T×8</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">标准逐位置前馈共享参数，但不会仅因共享权重就把不同位置</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">直接汇总。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">跨位置注意力</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">逐位置前馈</ns0:text><ns0:rect x="830" y="870" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="895" y="870" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="960" y="870" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="830" y="935" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="895" y="935" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="960" y="935" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="830" y="1000" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="895" y="1000" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="960" y="1000" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1160" y="870" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1225" y="870" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1290" y="870" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1160" y="935" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1225" y="935" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1290" y="935" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1160" y="1000" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1225" y="1000" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1290" y="1000" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><ns0:text x="805" y="1110" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">格表示位置依赖，非参数或概率数值</ns0:text></ns0:svg>
