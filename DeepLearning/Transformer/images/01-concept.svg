<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1873" viewBox="0 0 1200 1873" role="img"><title>一个 Transformer 块的两类交互：机制、算例与边界</title><rect width="1200" height="1873" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">一个 Transformer 块的两类交互</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="442.6" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="562.6" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1112.6" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="362.6" viewBox="0 225 1200 392" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="40" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输入 X</text><text x="55" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">内容＋位置</text><path d="M260,314.06 L305,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="276" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="315" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="330" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">注意力子层</text><text x="330" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">跨位置读取，配残差</text><path d="M535,314.06 L580,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="551" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="590" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="605" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">前馈子层</text><text x="605" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">同一位置特征变换</text><path d="M810,314.06 L855,314.06" fill="none" stroke="#718fa9" stroke-width="3" /><text x="826" y="303.77" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#16324f">›</text><rect x="865" y="250.85" width="220" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="880" y="294.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输出 H</text><text x="880" y="346.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">保留长度，宽度相容</text><text x="310" y="471.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">残差 1：输入与注意力输出相加</text><text x="680" y="471.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">残差 2：加前馈输出</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">归一化放置决定 Pre-LN 或 Post-LN；图只表示子层职责，不固定归一化顺序。</text></g></svg><text x="48" y="605.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  块内宽度守恒不限制前馈内部扩宽</text><text x="48" y="1155.6" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  前馈逐位置不负责跨位置读取</text><g transform="translate(30,622.6) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入：B×T×8</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">注意力输出回到 8 维后作残差</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">前馈内部：8→32→8</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">块输出：B×T×8</text></g><g transform="translate(45,1172.6) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">标准逐位置前馈共享参数，但不会仅因共享权重就把不同位置</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">直接汇总。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">跨位置注意力</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">逐位置前馈</text><rect x="830" y="870" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="895" y="870" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="960" y="870" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="830" y="935" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="895" y="935" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="960" y="935" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="830" y="1000" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="895" y="1000" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="960" y="1000" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="1160" y="870" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="1225" y="870" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><rect x="1290" y="870" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><rect x="1160" y="935" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><rect x="1225" y="935" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><rect x="1290" y="935" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><rect x="1160" y="1000" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><rect x="1225" y="1000" width="60" height="60" fill="#eef1f3" stroke="#8caab9" stroke-width="1" /><rect x="1290" y="1000" width="60" height="60" fill="#8ec7b5" stroke="#8caab9" stroke-width="1" /><text x="805" y="1110" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">格表示位置依赖，非参数或概率数值</text></g></svg>
