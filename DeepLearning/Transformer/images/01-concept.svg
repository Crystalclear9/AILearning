<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>一个 Transformer 块的两类交互</title>
<desc>原创教学示意：输入 X|内容与位置表示;注意力子层|跨位置读取，配残差;前馈子层|逐位置变换，配残差;输出 H|序列长度通常不变</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">一个 Transformer 块的两类交互</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">输入 X</text>
<text x="53" y="160" font-size="21" fill="#16324f">内容与位置表示</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">注意力子层</text>
<text x="603" y="160" font-size="21" fill="#16324f">跨位置读取，配残差</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">前馈子层</text>
<text x="53" y="330" font-size="21" fill="#16324f">逐位置变换，配残差</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">输出 H</text>
<text x="603" y="330" font-size="21" fill="#16324f">序列长度通常不变</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">一个块中的跨位置读取与逐位置变换</text><rect x="40" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="55" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">输入 X</text><text x="55" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">内容＋位置</text><path d="M260,608 L305,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="276" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="315" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="330" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">注意力子层</text><text x="330" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">跨位置读取，配残差</text><path d="M535,608 L580,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="551" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="590" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="605" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">前馈子层</text><text x="605" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">同一位置特征变换</text><path d="M810,608 L855,608" fill="none" stroke="#718fa9" stroke-width="3"/><text x="826" y="601" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#16324f">›</text><rect x="865" y="565" width="220" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="880" y="595" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">输出 H</text><text x="880" y="630" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">保留长度，宽度相容</text><text x="310" y="715" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">残差 1：输入与注意力输出相加</text><text x="680" y="715" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">残差 2：加前馈输出</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">归一化放置决定 Pre-LN 或 Post-LN；图只表示子层职责，不固定归一化顺序。</text></svg>