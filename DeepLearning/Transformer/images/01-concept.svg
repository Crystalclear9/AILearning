<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>跨位置读取，再逐位置变换</title><rect width="1200" height="720" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="60" font-size="34" fill="#213548" text-anchor="start">从三个位置，读出一个新向量</text><text x="48" y="104" font-size="26" fill="#697985" text-anchor="start">单头教学算例 · 只突出位置 A 的读取</text><text x="75" y="215" font-size="32" fill="#236c9a" text-anchor="start">A</text><rect x="130" y="183" width="57" height="49" fill="#236c9a" stroke="none" stroke-width="1"/><text x="158" y="217" font-size="26" fill="white" text-anchor="middle">1</text><rect x="193" y="183" width="57" height="49" fill="#edf1f3" stroke="none" stroke-width="1"/><text x="221" y="217" font-size="26" fill="#697985" text-anchor="middle">0</text><path d="M265,206 C390,206 425,355 552,355" stroke="#236c9a" stroke-width="15.203476737054654" fill="none" opacity="0.68"/><text x="330" y="177" font-size="26" fill="#236c9a" text-anchor="start">0.422</text><text x="75" y="360" font-size="32" fill="#d47c35" text-anchor="start">B</text><rect x="130" y="328" width="57" height="49" fill="#edf1f3" stroke="none" stroke-width="1"/><text x="158" y="362" font-size="26" fill="#697985" text-anchor="middle">0</text><rect x="193" y="328" width="57" height="49" fill="#d47c35" stroke="none" stroke-width="1"/><text x="221" y="362" font-size="26" fill="white" text-anchor="middle">1</text><path d="M265,351 C390,351 425,355 552,355" stroke="#d47c35" stroke-width="5.59304652589069" fill="none" opacity="0.68"/><text x="330" y="322" font-size="26" fill="#d47c35" text-anchor="start">0.155</text><text x="75" y="505" font-size="32" fill="#258778" text-anchor="start">C</text><rect x="130" y="473" width="57" height="49" fill="#258778" stroke="none" stroke-width="1"/><text x="158" y="507" font-size="26" fill="white" text-anchor="middle">1</text><rect x="193" y="473" width="57" height="49" fill="#258778" stroke="none" stroke-width="1"/><text x="221" y="507" font-size="26" fill="white" text-anchor="middle">1</text><path d="M265,496 C390,496 425,355 552,355" stroke="#258778" stroke-width="15.203476737054654" fill="none" opacity="0.68"/><text x="280" y="550" font-size="26" fill="#258778" text-anchor="start">0.422</text><text x="132" y="160" font-size="26" fill="#697985" text-anchor="start">值向量</text><circle cx="565" cy="355" r="13" fill="#213548"/><text x="575" y="298" font-size="26" fill="#213548" text-anchor="start">加权相加</text><rect x="610" y="330" width="83" height="55" fill="#e7eff5" stroke="none" stroke-width="1"/><text x="651" y="366" font-size="25" fill="#236c9a" text-anchor="middle">0.845</text><rect x="702" y="330" width="83" height="55" fill="#e7eff5" stroke="none" stroke-width="1"/><text x="743" y="366" font-size="25" fill="#236c9a" text-anchor="middle">0.578</text><path d="M800,357 L864,357" stroke="#697985" stroke-width="2" fill="none"/><path d="M864,357 L854.9955289764732,361.3496553411123" stroke="#697985" stroke-width="2" fill="none"/><path d="M864,357 L854.9955289764732,352.6503446588877" stroke="#697985" stroke-width="2" fill="none"/><text x="885" y="285" font-size="26" fill="#d47c35" text-anchor="start">同一个 FFN</text><text x="960" y="366" font-size="28" fill="#d47c35" text-anchor="middle">ReLU(uW)</text><text x="960" y="451" font-size="28" fill="#d47c35" text-anchor="middle">(0.845, 0.000)</text><text x="48" y="610" font-size="27" fill="#236c9a" text-anchor="start">读取：权重决定从哪里取信息</text><text x="640" y="610" font-size="27" fill="#d47c35" text-anchor="start">变换：每个位置使用相同参数</text><text x="48" y="663" font-size="25" fill="#697985" text-anchor="start">其他位置也各自读取；这里只展开 A，避免全部连线遮住计算。</text></g></svg>