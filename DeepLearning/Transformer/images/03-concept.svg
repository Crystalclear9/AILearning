<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img">
<title>交叉注意力的查询与键值来源</title>
<desc>原创教学示意：源编码状态|S 个位置;目标解码状态|T 个查询;交叉权重|T 行 × S 列;读取输出|每个目标位置一个上下文</desc>
<rect width="1120" height="830" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">交叉注意力的查询与键值来源</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">源编码状态</text>
<text x="53" y="160" font-size="21" fill="#16324f">S 个位置</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">目标解码状态</text>
<text x="603" y="160" font-size="21" fill="#16324f">T 个查询</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">交叉权重</text>
<text x="53" y="330" font-size="21" fill="#16324f">T 行 × S 列</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">读取输出</text>
<text x="603" y="330" font-size="21" fill="#16324f">每个目标位置一个上下文</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><text x="40" y="510" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#16324f">交叉注意力：目标侧 T 个查询读取源侧 S 个键和值</text><rect x="40" y="550" width="250" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="55" y="580" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">源编码</text><text x="55" y="615" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">S×D → K、V</text><rect x="40" y="665" width="250" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="55" y="695" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">目标解码</text><text x="55" y="730" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">T×D → Q</text><path d="M290,590 L450,625" fill="none" stroke="#718fa9" stroke-width="3"/><path d="M290,705 L450,625" fill="none" stroke="#718fa9" stroke-width="3"/><rect x="460" y="580" width="250" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="475" y="610" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">配对矩阵</text><text x="475" y="645" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">T 行 × S 列</text><path d="M710,625 L810,625" fill="none" stroke="#718fa9" stroke-width="3"/><rect x="820" y="580" width="240" height="85" rx="5" fill="#e2effa" stroke="#718fa9"/><text x="835" y="610" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#16324f">输出</text><text x="835" y="645" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#16324f">T×Dv</text><text x="40" y="795" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#16324f">输出位置数跟随查询侧；源填充掩码与目标自注意力因果掩码是不同约束。</text></svg>