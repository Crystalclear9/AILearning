x="1230" y="940" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1265" y="940" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1300" y="940" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1335" y="940" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1160" y="975" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1195" y="975" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1230" y="975" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1265" y="975" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1300" y="975" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1335" y="975" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1160" y="1010" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1195" y="1010" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1230" y="1010" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1265" y="1010" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1300" y="1010" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1335" y="1010" width="32" height="32" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="805" y="1100" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">T=3，S=5，Dv=6；输出位置数跟随 T</ns0:text></ns0:svg>
