<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>交叉注意力的查询与键值来源</title><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="95" width="1164" height="630" rx="14" fill="white" stroke="#d6e7f0"/><text x="38" y="53" font-size="30" font-family="Microsoft YaHei,sans-serif" fill="#143651">交叉注意力的查询与键值来源</text><g xmlns:ns0="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="228.8" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源编码</ns0:text><ns0:text x="55" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">S×D → K、V</ns0:text><ns0:rect x="40" y="397.85" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="441.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">目标解码</ns0:text><ns0:text x="55" y="493.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T×D → Q</ns0:text><ns0:path d="M290,287.6 L450,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M290,456.65 L450,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="460" y="272.9" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="475" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">配对矩阵</ns0:text><ns0:text x="475" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T 行 × S 列</ns0:text><ns0:path d="M710,339.04999999999995 L810,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="820" y="272.9" width="240" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="835" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输出</ns0:text><ns0:text x="835" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T×Dv</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">输出位置数跟随查询侧；源填充掩码与目标自注意力因果掩码是不同约束。</ns0:text></g></svg>
