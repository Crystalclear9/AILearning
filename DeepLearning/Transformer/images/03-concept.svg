<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1893" viewBox="0 0 1200 1893" role="img"><title>交叉注意力的查询与键值来源：机制、算例与边界</title><rect width="1200" height="1893" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">交叉注意力的查询与键值来源</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="462.95000000000005" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="582.95" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1132.95" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="382.95000000000005" viewBox="0 203 1200 414" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="40" y="228.8" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源编码</text><text x="55" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">S×D → K、V</text><rect x="40" y="397.85" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="55" y="441.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">目标解码</text><text x="55" y="493.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T×D → Q</text><path d="M290,287.6 L450,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><path d="M290,456.65 L450,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="460" y="272.9" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="475" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">配对矩阵</text><text x="475" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T 行 × S 列</text><path d="M710,339.04999999999995 L810,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><rect x="820" y="272.9" width="240" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><text x="835" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输出</text><text x="835" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T×Dv</text><text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">输出位置数跟随查询侧；源填充掩码与目标自注意力因果掩码是不同约束。</text></g></svg><text x="48" y="625.95" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  长方形注意力输出跟随查询数量</text><text x="48" y="1175.95" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  源长度不能冒充输出长度</text><g transform="translate(30,642.95) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">源端长度 S=5；目标长度 T=3</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">查询 Q：3×4；键 K：5×4</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分数：3×5；值 V：5×6</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">读取输出：3×6</text></g><g transform="translate(45,1192.95) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">本例省略批次和头轴；输出投影可再改特征宽度，但不会把查</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">询位置数自动变成源长度。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">正确：3×6</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">误写：5×6</text><rect x="830" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="865" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="900" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="935" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="970" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="1005" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="830" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="865" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="900" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="935" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="970" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><rect x="1005" y="905" width="32" height="32" fill="#91cbb7" s