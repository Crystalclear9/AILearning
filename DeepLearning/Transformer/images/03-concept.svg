<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>交叉注意力的查询与键值来源：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">交叉注意力的查询与键值来源</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="40" y="228.8" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="272.9" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">源编码</ns0:text><ns0:text x="55" y="324.35" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">S×D → K、V</ns0:text><ns0:rect x="40" y="397.85" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="55" y="441.95" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">目标解码</ns0:text><ns0:text x="55" y="493.4" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T×D → Q</ns0:text><ns0:path d="M290,287.6 L450,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:path d="M290,456.65 L450,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="460" y="272.9" width="250" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="475" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">配对矩阵</ns0:text><ns0:text x="475" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T 行 × S 列</ns0:text><ns0:path d="M710,339.04999999999995 L810,339.04999999999995" fill="none" stroke="#718fa9" stroke-width="3" /><ns0:rect x="820" y="272.9" width="240" height="124.95" rx="5" fill="#e2effa" stroke="#718fa9" /><ns0:text x="835" y="317.0" font-family="Microsoft YaHei,sans-serif" font-size="23.0" fill="#16324f">输出</ns0:text><ns0:text x="835" y="368.45" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">T×Dv</ns0:text><ns0:text x="40" y="588.95" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#16324f">输出位置数跟随查询侧；源填充掩码与目标自注意力因果掩码是不同约束。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  长方形注意力输出跟随查询数量</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  源长度不能冒充输出长度</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">源端长度 S=5；目标长度 T=3</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">查询 Q：3×4；键 K：5×4</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分数：3×5；值 V：5×6</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">读取输出：3×6</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">本例省略批次和头轴；输出投影可再改特征宽度，但不会把查</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">询位置数自动变成源长度。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">正确：3×6</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">误写：5×6</ns0:text><ns0:rect x="830" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="865" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="900" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="935" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="970" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1005" y="870" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="830" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="865" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="900" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="935" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="970" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1005" y="905" width="32" height="32" fill="#91cbb7" stroke="#8caab9" stroke-width="1" /><ns0:rect x="830" y="940"