<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1120 710" role="img">
<rect width="1120.0" height="710" fill="#f3f8fc" /><title>残差结构比单个均方误差提供更多诊断信息</title>
<rect width="1120" height="710" fill="#f3f8fc" />
<style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#1e293b;font-size:22px}.title{font-size:30px;font-weight:700}.small{font-size:19px}</style>
<text x="40" y="48" class="title" text-anchor="start">残差结构比单个均方误差提供更多诊断信息</text>
<text x="40" y="695" class="small" text-anchor="start" font-size="16">原创教学示意 · 数值与条件以图解正文为准</text>
<line x1="100" y1="420" x2="1040" y2="420" stroke="#94a3b8" stroke-width="3" stroke-dasharray="" />
<line x1="100" y1="420" x2="100" y2="125" stroke="#94a3b8" stroke-width="3" stroke-dasharray="" />
<polyline points="100.0,140.0 284.0,315.0 468.0,402.5 652.0,402.5 836.0,315.0 1020.0,140.0" fill="none" stroke="#079b91" stroke-width="4" />
<text x="130" y="100" class="small" text-anchor="start" style="fill:#079b91">构造残差随拟合值变化</text>
<circle cx="100.0" cy="140.0" r="5" fill="#079b91" />
<circle cx="284.0" cy="315.0" r="5" fill="#079b91" />
<circle cx="468.0" cy="402.5" r="5" fill="#079b91" />
<circle cx="652.0" cy="402.5" r="5" fill="#079b91" />
<circle cx="836.0" cy="315.0" r="5" fill="#079b91" />
<circle cx="1020.0" cy="140.0" r="5" fill="#079b91" />
<text x="70" y="145" class="small" text-anchor="end">0.8</text>
<text x="70" y="420" class="small" text-anchor="end">0</text>
<text x="100.0" y="454" font-size="19" text-anchor="middle">1</text><text x="284.0" y="454" font-size="19" text-anchor="middle">2</text><text x="468.0" y="454" font-size="19" text-anchor="middle">3</text><text x="652.0" y="454" font-size="19" text-anchor="middle">4</text><text x="836.0" y="454" font-size="19" text-anchor="middle">5</text><text x="1020.0" y="454" font-size="19" text-anchor="middle">6</text><text x="100" y="485" font-size="19">横轴：拟合值排序位置</text><rect x="42" y="560" width="1036.0" height="105" rx="12" fill="#e5f2f4" /><text x="64" y="593" font-size="20" fill="#244c5e">横轴是由低到高排列的拟合值，纵轴是一个构造的残差趋势，实际读数从上方的零点八降至中部零点</text><text x="64" y="621" font-size="20" fill="#244c5e">零五后再次上升。</text></svg>
