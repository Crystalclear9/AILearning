<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>按设备隔离之后，共享现场仍可能跨越训练与测试</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">按设备隔离之后，共享现场仍可能跨越训练与测试</text><text x="75" y="125" font-size="29" fill="#19333c" text-anchor="start">A  仅把不同设备分到两边</text><text x="710" y="125" font-size="29" fill="#19333c" text-anchor="start">B  按实体关联图的连通分量划分</text><text x="75" y="178" font-size="25" fill="#19333c" text-anchor="start">蓝：训练；橙：测试；一条边是一条记录</text><rect x="80" y="243" width="130" height="54" fill="#f0f5f6"/><text x="145" y="280" font-size="27" fill="#19333c" text-anchor="middle">设备 A</text><rect x="415" y="243" width="130" height="54" fill="#f0f5f6"/><text x="480" y="280" font-size="27" fill="#19333c" text-anchor="middle">现场 X</text><rect x="80" y="388" width="130" height="54" fill="#f0f5f6"/><text x="145" y="425" font-size="27" fill="#19333c" text-anchor="middle">设备 B</text><rect x="415" y="388" width="130" height="54" fill="#f0f5f6"/><text x="480" y="425" font-size="27" fill="#19333c" text-anchor="middle">现场 Y</text><rect x="80" y="533" width="130" height="54" fill="#f0f5f6"/><text x="145" y="570" font-size="27" fill="#19333c" text-anchor="middle">设备 C</text><rect x="415" y="533" width="130" height="54" fill="#f0f5f6"/><text x="480" y="570" font-size="27" fill="#19333c" text-anchor="middle">现场 Z</text><line x1="210" y1="270" x2="415" y2="270" stroke="#256b82" stroke-width="5"/><text x="312.5" y="256.0" font-size="25" fill="#256b82" text-anchor="middle">r1</text><line x1="210" y1="270" x2="415" y2="415" stroke="#256b82" stroke-width="5"/><text x="312.5" y="328.5" font-size="25" fill="#256b82" text-anchor="middle">r2</text><line x1="210" y1="415" x2="415" y2="415" stroke="#c0643c" stroke-width="5"/><text x="312.5" y="401.0" font-size="25" fill="#c0643c" text-anchor="middle">r3</text><line x1="210" y1="560" x2="415" y2="560" stroke="#c0643c" stroke-width="5"/><text x="312.5" y="546.0" font-size="25" fill="#c0643c" text-anchor="middle">r4</text><text x="75" y="650" font-size="27" fill="#19333c" text-anchor="start">训练 2 条、测试 2 条</text><rect x="715" y="243" width="130" height="54" fill="#f0f5f6"/><text x="780" y="280" font-size="27" fill="#19333c" text-anchor="middle">设备 A</text><rect x="1050" y="243" width="130" height="54" fill="#f0f5f6"/><text x="1115" y="280" font-size="27" fill="#19333c" text-anchor="middle">现场 X</text><rect x="715" y="388" width="130" height="54" fill="#f0f5f6"/><text x="780" y="425" font-size="27" fill="#19333c" text-anchor="middle">设备 B</text><rect x="1050" y="388" width="130" height="54" fill="#f0f5f6"/><text x="1115" y="425" font-size="27" fill="#19333c" text-anchor="middle">现场 Y</text><rect x="715" y="533" width="130" height="54" fill="#f0f5f6"/><text x="780" y="570" font-size="27" fill="#19333c" text-anchor="middle">设备 C</text><rect x="1050" y="533" width="130" height="54" fill="#f0f5f6"/><text x="1115" y="570" font-size="27" fill="#19333c" text-anchor="middle">现场 Z</text><line x1="845" y1="270" x2="1050" y2="270" stroke="#256b82" stroke-width="5"/><text x="947.5" y="256.0" font-size="25" fill="#256b82" text-anchor="middle">r1</text><line x1="845" y1="270" x2="1050" y2="415" stroke="#256b82" stroke-width="5"/><text x="947.5" y="328.5" font-size="25" fill="#256b82" text-anchor="middle">r2</text><line x1="845" y1="415" x2="1050" y2="415" stroke="#256b82" stroke-width="5"/><text x="947.5" y="401.0" font-size="25" fill="#256b82" text-anchor="middle">r3</text><line x1="845" y1="560" x2="1050" y2="560" stroke="#c0643c" stroke-width="5"/><text x="947.5" y="546.0" font-size="25" fill="#c0643c" text-anchor="middle">r4</text><text x="710" y="650" font-size="27" fill="#19333c" text-anchor="start">训练 3 条、测试 1 条</text><text x="75" y="700" font-size="26" fill="#c0643c" text-anchor="start">现场 Y 同时出现在训练和测试</text><text x="710" y="700" font-size="26" fill="#256b82" 