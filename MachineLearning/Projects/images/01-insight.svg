<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">历史可见时间与标签成熟共同决定数据边界</title><desc id="artwork-desc">历史可见时间与标签成熟，共同决定数据能否使用</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="602.910793"/></clipPath></defs><rect width="960" height="700" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">历史可见时间与标签成熟共同决定数据边界</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(25 22.081135) scale(0.758333)"><g><rect id="offline-white-background" x="0" y="71.101784" width="1200" height="795.047219" fill="#ffffff"/><title id="title">历史可见时间与标签成熟，共同决定数据能否使用</title><desc id="desc">历史可见时间与标签成熟，共同决定数据能否使用</desc><rect width="1200" height="880" fill="white"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cb7436"/></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5a758a"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="205.0" y1="170" x2="1125.0" y2="170" stroke="#d9e1e8" stroke-width="2"/><line x1="205.0" y1="270" x2="1125.0" y2="270" stroke="#d9e1e8" stroke-width="2"/><line x1="205.0" y1="370" x2="1125.0" y2="370" stroke="#d9e1e8" stroke-width="2"/><line x1="205.0" y1="575" x2="1125.0" y2="575" stroke="#d9e1e8" stroke-width="2"/><line x1="205.0" y1="700" x2="1125.0" y2="700" stroke="#d9e1e8" stroke-width="2"/><text x="262.5" y="110" font-size="28.56px" fill="#4e7796" fo