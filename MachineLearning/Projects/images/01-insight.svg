e="30.96px" fill="#2472b1" font-weight="400" text-anchor="start">可用</text><text x="25" y="378" font-size="33.54px" fill="#1f3449" font-weight="400" text-anchor="start">及时特征</text><line x1="550.0" y1="370" x2="550.0" y2="370" stroke="#176fa3" stroke-width="5"/><circle cx="550.0" cy="370" r="10" fill="white" stroke="#5a758a" stroke-width="2"/><circle cx="550.0" cy="370" r="11" fill="#176fa3"/><text x="566.0" y="352" font-size="30.96px" fill="#2472b1" font-weight="400" text-anchor="start">可用</text><text x="30" y="510" font-size="32.25px" fill="#1f3449" font-weight="400" text-anchor="start">空心：发生；实心：可见。发生在过去，并不等于当时已经可见。</text><text x="25" y="555" font-size="33.54px" fill="#1f3449" font-weight="600" text-anchor="start">标签窗口 [10,17]，另留 1 天到达余量</text><text x="25" y="628" font-size="33.54px" fill="#1f3449" font-weight="400" text-anchor="start">阳性事件</text><line x1="607.5" y1="620" x2="1010.0" y2="620" stroke="#eaf2fa" stroke-width="24"/><line x1="895.0" y1="585" x2="895.0" y2="645" stroke="#5a758a" stroke-width="2" stroke-dasharray="5 4"/><circle cx="780.0" cy="620" r="8" fill="#5a758a"/><line fill="none" stroke="#176fa3" stroke-width="2.5" marker-end="url(#arrow-blue)" x1="780" y1="620" x2="837.5" y2="620"/><text x="837.5" y="590" font-size="30.96px" fill="#2472b1" font-weight="400" text-anchor="start">14 日可确认阳性</text><text x="25" y="753" font-size="33.54px" fill="#1f3449" font-weight="400" text-anchor="start">尚无事件</text><line x1="607.5" y1="745" x2="1010.0" y2="745" stroke="#eaf2fa" stroke-width="24"/><line x1="895.0" y1="710" x2="895.0" y2="770" stroke="#5a758a" stroke-width="2" stroke-dasharray="5 4"/><line fill="none" stroke="#c06427" stroke-width="2.5" marker-end="url(#arrow-orange)" x1="1010" y1="745" x2="1067.5" y2="745"/><text x="1067.5" y="715" font-size="30.96px" fill="#ac612c" font-weight="400" text-anchor="end">18 日才可确认阴性</text><text x="30" y="842" font-size="32.25px" fill="#4e7796" font-weight="400" text-anchor="start">15 日只取“已收到的标签”，会偏向早到阳性；完整队列仍需成熟规则。</text></g></g></g></g></svg>