<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1120 710" role="img">
<rect width="1120.0" height="710" fill="#f3f8fc" /><title>朴素贝叶斯分解的是给定类别后的联合似然</title>
<rect width="1120" height="710" fill="#f3f8fc" />
<style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#1e293b;font-size:22px}.title{font-size:30px;font-weight:700}.small{font-size:19px}</style>
<text x="40" y="48" class="title" text-anchor="start">朴素贝叶斯分解的是给定类别后的联合似然</text>
<text x="40" y="695" class="small" text-anchor="start" font-size="16">原创教学示意 · 数值与条件以图解正文为准</text>
<line x1="90" y1="420.0" x2="1060" y2="420.0" stroke="#94a3b8" stroke-width="3" stroke-dasharray="" />
<rect x="140.0" y="140.0" width="105" height="280.0" fill="#079b91" opacity=".85" />
<text x="192.0" y="128.0" class="" text-anchor="middle">0.24</text>
<text x="192.0" y="460" class="small" text-anchor="middle">类别 A：先验 × 似然</text>
<rect x="575.0" y="385.0" width="105" height="35.0" fill="#ef8b3a" opacity=".85" />
<text x="627.0" y="373.0" class="" text-anchor="middle">0.03</text>
<text x="627.0" y="460" class="small" text-anchor="middle">类别 B：先验 × 似然</text>
<rect x="42" y="560" width="1036.0" height="105" rx="12" fill="#e5f2f4" /><text x="64" y="593" font-size="20" fill="#244c5e">以两个二值特征都取一为例，类别 A 的先验为零点五，两个条件概率分别为零点八与零点六，未归</text><text x="64" y="621" font-size="20" fill="#244c5e">一化后验分数为零点二四；类别 B 对应分数为零点零三。</text></svg>
