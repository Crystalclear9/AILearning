<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img"><title>同一篇新文档：积分参数会让后续词的预测发生更新</title><rect width="1280" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">同一篇新文档：积分参数会让后续词的预测发生更新</text><text x="60" y="113" font-size="25" fill="#71858b" text-anchor="start">训练后 Dirichlet 参数：广告 (9,3,1)，普通 (2,5,6)；新观察顺序为 词1 → 词1 → 词3</text><text x="330" y="200" font-size="27" fill="#183944" text-anchor="middle">第一个词1</text><text x="645" y="200" font-size="27" fill="#183944" text-anchor="middle">第二个词1</text><text x="960" y="200" font-size="27" fill="#183944" text-anchor="middle">第三个词3</text><text x="100" y="320" font-size="29" fill="#246b82" text-anchor="start">广告</text><text x="330" y="300" font-size="29" fill="#246b82" text-anchor="middle">9</text><line x1="300" y1="312" x2="360" y2="312" stroke="#246b82" stroke-width="2" stroke-dasharray=""/><text x="330" y="347" font-size="29" fill="#246b82" text-anchor="middle">13</text><text x="487" y="323" font-size="30" fill="#71858b" text-anchor="middle">×</text><text x="645" y="300" font-size="29" fill="#246b82" text-anchor="middle">10</text><line x1="615" y1="312" x2="675" y2="312" stroke="#246b82" stroke-width="2" stroke-dasharray=""/><text x="645" y="347" font-size="29" fill="#246b82" text-anchor="middle">14</text><text x="802" y="323" font-size="30" fill="#71858b" text-anchor="middle">×</text><text x="960" y="300" font-size="29" fill="#246b82" text-anchor="middle">1</text><line x1="930" y1="312" x2="990" y2="312" stroke="#246b82" stroke-width="2" stroke-dasharray=""/><text x="960" y="347" font-size="29" fill="#246b82" text-anchor="middle">15</text><text x="100" y="490" font-size="29" fill="#c0673e" text-anchor="start">普通</text><text x="330" y="470" font-size="29" fill="#c0673e" text-anchor="middle">2</text><line x1="300" y1="482" x2="360" y2="482" stroke="#c0673e" stroke-width="2" stroke-dasharray=""/><text x="330" y="517" font-size="29" fill="#c0673e" text-anchor="middle">13</text><text x="487" y="493" font-size="30" fill="#71858b" text-anchor="middle">×</text><text x="645" y="470" font-size="29" fill="#c0673e" text-anchor="middle">3</text><line x1="615" y1="482" x2="675" y2="482" stroke="#c0673e" stroke-width="2" stroke-dasharray=""/><text x="645" y="517" font-size="29" fill="#c0673e" text-anchor="middle">14</text><text x="802" y="493" font-size="30" fill="#71858b" text-anchor="middle">×</text><text x="960" y="470" font-size="29" fill="#c0673e" text-anchor="middle">6</text><line x1="930" y1="482" x2="990" y2="482" stroke="#c0673e" stroke-width="2" stroke-dasharray=""/><text x="960" y="517" font-size="29" fill="#c0673e" text-anchor="middle">15</text><text x="60" y="620" font-size="26" fill="#183944" text-anchor="start">相同词序列的积分预测比：90 : 36 = 5 : 2；等先验广告后验约为 0.7143。</text><text x="60" y="678" font-size="25" fill="#183944" text-anchor="start">均值代入固定每个词的概率，不更新后续词事件 → 广告后验约为 0.7714。</text><text x="60" y="742" font-size="26" fill="#183944" text-anchor="start">词袋计数 (2,0,1) 的多项式系数为 3，两类都乘 3，分类后验保持上述值。</text><text x="60" y="792" font-size="25" fill="#71858b" text-anchor="start">图中是同一文档的新词事件；不是将同一个观测字段复制三次。</text></g></svg>
