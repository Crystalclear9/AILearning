<svg xmlns="http://www.w3.org/2000/svg" width="1328.64" height="750.513" viewBox="-24.32 44.5876 1328.64 750.513" role="img" aria-labelledby="plate-title"><title id="plate-title">两条可能的中间状态路径及其端点条件权重，解释缺失观察时底层仍有两次转移</title><rect id="edition-paper" x="-24.32" y="44.5876" width="1328.64" height="750.513" fill="#ffffff"/><svg id="edition-view" x="0" y="68.9076" width="1280" height="701.873" viewBox="0 68.9076 1280 701.8727" overflow="hidden"><rect id="offline-white-background" x="0" y="68.907563" width="1280" height="701.872749" fill="#ffffff"/><rect width="1280" height="820" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="25" fill="#5b747d" text-anchor="start">A 的两行为 (0.9, 0.1)、(0.2, 0.8)；已知两端状态为 0 → 1</text><line x1="170" y1="340" x2="550" y2="270" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><line x1="550" y1="270" x2="940" y2="340" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><rect x="490" y="238" width="120" height="64" fill="#f4f7f9"/><text x="550" y="280" font-size="30" fill="#29708b" text-anchor="middle">0</text><text x="1080" y="280" font-size="25" fill="#29708b" text-anchor="middle">0.9 × 0.1 = 0.09</text><line x1="170" y1="340" x2="550" y2="410" stroke="#b26a47" stroke-width="4" stroke-dasharray=""/><line x1="550" y1="410" x2="940" y2="340" stroke="#b26a47" stroke-width="4" stroke-dasharray=""/><rect x="490" y="378" width="120" height="64" fill="#faf2ee"/><text x="550" y="420" font-size="30" fill="#975a3c" text-anchor="middle">1</text><text x="1080" y="420" font-size="25" fill="#a16040" text-anchor="middle">0.1 × 0.8 = 0.08</text><rect x="110" y="308" width="120" height="64" fill="#f4f7f9"/><text x="170" y="350" font-size="30" fill="#29708b" text-anchor="middle">0</text><rect x="880" y="308" width="120" height="64" fill="#f4f7f9"/><text x="940" y="350" font-size="30" fill="#29708b" text-anchor="middle">1</text><text x="170" y="200" font-size="27" fill="#2a3644" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">首端已知</text><text x="550" y="200" font-size="27" fill="#2a3644" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">中间状态未知</text><text x="940" y="200" font-size="27" fill="#2a3644" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">末端已知</text><text x="60" y="500" font-size="27" fill="#2a3644" text-anchor="start">两条桥接路径的概率和 = 0.17；条件于端点后，权重约为 0.529412 与 0.470588。</text><text x="60" y="560" font-size="29" fill="#2a3644" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">原一步转移的期望使用次数</text><text x="110" y="620" font-size="26" fill="#2a3644" text-anchor="start">0 → 0</text><text x="110" y="668" font-size="30" fill="#29708b" text-anchor="start">0.529412</text><text x="400" y="620" font-size="26" fill="#2a3644" text-anchor="start">0 → 1</text><text x="400" y="668" font-size="30" fill="#29708b" text-anchor="start">1.000000</text><text x="690" y="620" font-size="26" fill="#2a3644" text-anchor="start">1 → 0</text><text x="690" y="668" font-size="30" fill="#5b747d" text-anchor="start">0.000000</text><text x="980" y="620" font-size="26" fill="#2a3644" text-anchor="start">1 → 1</text><text x="980" y="668" font-size="30" fill="#29708b" text-anchor="start">0.470588</text><text x="60" y="745" font-size="27" fill="#2a3644" text-anchor="start">四项总和为 2：一次端点变化并不等于一次底层状态转移。</text></g></svg></svg>
