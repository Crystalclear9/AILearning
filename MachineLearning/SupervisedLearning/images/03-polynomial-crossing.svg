<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">交叉排列的两类，在二次交互坐标上可以分开</title><desc id="desc">交叉排列的两类，在二次交互坐标上可以分开</desc><rect width="1200" height="590" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">交叉排列的两类，在二次交互坐标上可以分开</text><text x="55" y="100" font-size="26" fill="#213447" font-weight="600" text-anchor="start">原输入：四个角点</text><line x1="85" y1="413.125" x2="445" y2="413.125" stroke="#cad7e2" stroke-width="1" /><text x="73" y="420.125" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">-1</text><line x1="85" y1="310.0" x2="445" y2="310.0" stroke="#cad7e2" stroke-width="1" /><text x="73" y="317.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0</text><line x1="85" y1="206.875" x2="445" y2="206.875" stroke="#cad7e2" stroke-width="1" /><text x="73" y="213.875" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">1</text><line x1="85" y1="475" x2="445" y2="475" stroke="#5a6c7d" stroke-width="1.4" /><line x1="85" y1="145" x2="85" y2="475" stroke="#5a6c7d" stroke-width="1.4" /><line x1="152.5" y1="475.0" x2="152.5" y2="480.0" stroke="#5a6c7d" stroke-width="2" /><text x="152.5" y="504.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">-1</text><line x1="265.0" y1="475.0" x2="265.0" y2="480.0" stroke="#5a6c7d" stroke-width="2" /><text x="265.0" y="504.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">0</text><line x1="377.5" y1="475.0" x2="377.5" y2="480.0" stroke="#5a6c7d" stroke-width="2" /><text x="377.5" y="504.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">1</text><circle cx="152.5" cy="413.125" r="12" fill="#2865a0" /><circle cx="152.5" cy="206.875" r="12" fill="#cf7432" /><circle cx="377.5" cy="413.125" r="12" fill="#cf7432" /><circle cx="377.5" cy="206.875" r="12" fill="#2865a0" /><text x="340" y="531" font-size="24" fill="#213447" font-weight="400" text-anchor="start">x1</text><text x="45" y="145" font-size="24" fill="#213447" font-weight="400" text-anchor="start">x2</text><path d="M480,300 L680,300" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" /><text x="510" y="230" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">二次特征映射</text><text x="510" y="265" font-size="24" fill="#213447" font-weight="400" text-anchor="start">读取交互坐标</text><text x="750" y="103" font-size="28" fill="#213447" font-weight="600" text-anchor="start">z = √2 x1 x2</text><line x1="935" y1="153" x2="935" y2="473" stroke="#5a6c7d" stroke-width="2" /><circle cx="900" cy="445.58252147247765" r="12" fill="#cf7432" /><circle cx="970" cy="445.58252147247765" r="12" fill="#cf7432" /><text x="1000" y="452.58252147247765" font-size="25" fill="#cf7432" font-weight="400" text-anchor="start">−√2</text><circle cx="900" cy="180.41747852752235" r="12" fill="#2865a0" /><circle cx="970" cy="180.41747852752235" r="12" fill="#2865a0" /><text x="1000" y="187.41747852752235" font-size="25" fill="#2865a0" font-weight="400" text-anchor="start">+√2</text><line x1="775" y1="313" x2="1115" y2="313" stroke="#cad7e2" stroke-width="2" stroke-dasharray="6 6" /><text x="780" y="352" font-size="25" fill="#213447" font-weight="400" text-anchor="start">线性分界 z = 0</text><text x="55" y="555" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="start">颜色表示同一批样本的类别</text></g></svg>
