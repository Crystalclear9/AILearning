<rect x="42" y="560" width="1036.0" height="105" rx="12" fill="#e5f2f4" /><text x="64" y="593" font-size="20" fill="#244c5e">中间竖线是分类边界，左右两条虚线代表规范化后的两侧间隔边界；靠近虚线的点决定间隔，远离边</text><text x="64" y="621" font-size="20" fill="#244c5e">界的点不一定改变硬间隔解。</text></svg>
