<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img"><title>斜分隔面的函数间隔与几何距离</title><desc>w=(1.2,1.6)，范数2。分类面f=0，间隔面f=±1，完整几何宽度1。查询正类P=(-0.17,0.44)分数0.5，距分类面0.25，hinge损失0.5。</desc><rect width="1200" height="920" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="50" y="58" font-size="35" fill="#233642" text-anchor="start">间隔沿法线测量，不沿屏幕横向测量</text><text x="50" y="112" font-size="27" fill="#233642" text-anchor="start">f(x) = 1.2x1 + 1.6x2；权重范数为 2。</text><defs><clipPath id="plot"><rect x="75" y="200" width="560" height="510"/></clipPath></defs><g clip-path="url(#plot)"><line x1="185" y1="200" x2="185" y2="710" stroke="#dce5e9" stroke-width="1"/><line x1="75" y1="645" x2="635" y2="645" stroke="#dce5e9" stroke-width="1"/><line x1="355" y1="200" x2="355" y2="710" stroke="#dce5e9" stroke-width="1"/><line x1="75" y1="475" x2="635" y2="475" stroke="#dce5e9" stroke-width="1"/><line x1="525" y1="200" x2="525" y2="710" stroke="#dce5e9" stroke-width="1"/><line x1="75" y1="305" x2="635" y2="305" stroke="#dce5e9" stroke-width="1"/><polyline points="-240.000,135.000 848.000,951.000" fill="none" stroke="#687b86" stroke-width="2" stroke-linejoin="round"/><polyline points="-189.000,67.000 899.000,883.000" fill="none" stroke="#233642" stroke-width="3" stroke-linejoin="round"/><polyline points="-138.000,-1.000 950.000,815.000" fill="none" stroke="#687b86" stroke-width="2" stroke-linejoin="round"/><circle cx="474.0" cy="458.0" r="9" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="389.0" cy="288.0" r="9" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="372.0" cy="594.0" r="9" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="185" cy="560.0" r="9" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="474.0" cy="458.0" r="16" fill="none" stroke="#687b86" stroke-width="2"/><circle cx="372.0" cy="594.0" r="16" fill="none" stroke="#687b86" stroke-width="2"/><line x1="372.0" y1="594.0" x2="474.0" y2="458.0" stroke="#687b86" stroke-width="2" stroke-dasharray="5 6"/><line x1="300.6" y1="434.2" x2="326.1" y2="400.2" stroke="#246d91" stroke-width="5"/><circle cx="326.1" cy="400.2" r="8" fill="#246d91" stroke="white" stroke-width="2"/></g><text x="306.1" y="380.2" font-size="28" fill="#246d91" text-anchor="end">P</text><text x="75" y="184" font-size="26" fill="#687b86" text-anchor="start">x2</text><text x="640" y="721" font-size="26" fill="#687b86" text-anchor="start">x1</text><text x="185" y="744" font-size="24" fill="#687b86" text-anchor="middle">-1</text><text x="58" y="653" font-size="24" fill="#687b86" text-anchor="end">-1</text><text x="355" y="744" font-size="24" fill="#687b86" text-anchor="middle">0</text><text x="58" y="483" font-size="24" fill="#687b86" text-anchor="end">0</text><text x="525" y="744" font-size="24" fill="#687b86" text-anchor="middle">1</text><text x="58" y="313" font-size="24" fill="#687b86" text-anchor="end">1</text><text x="720" y="235" font-size="28" fill="#233642" text-anchor="start">规范化边界：f(x) = ±1</text><text x="720" y="299" font-size="28" fill="#233642" text-anchor="start">完整几何宽度 = 1</text><text x="720" y="386" font-size="26" fill="#246d91" text-anchor="start">查询点 P = (−0.17, 0.44)</text><text x="720" y="446" font-size="26" fill="#233642" text-anchor="start">真实类为正：符号正确</text><text x="720" y="506" font-size="28" fill="#233642" text-anchor="start">函数间隔 = 0.5</text><text x="720" y="566" font-size="28" fill="#246d91" text-anchor="start">几何距离 = 0.25</text><text x="720" y="626" font-size="28" fill="#bc5b31" text-anchor="start">hinge 损失 = 0.5</text><text x="50" y="820" font-size="25" fill="#687b86" text-anchor="start">圈线为训练支持向量；P 是额外查询点，不参与图中的硬间隔拟合。</text><text x="50" y="873" font-size="25" fill="#233642" text-anchor="start">分类正确与位于间隔外不同；函数间隔除以权重范数，才得到几何距离。</text></g></svg>
