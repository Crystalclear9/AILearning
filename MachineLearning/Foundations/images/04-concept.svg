<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1120 710" role="img">
<rect width="1120.0" height="710" fill="#f3f8fc" /><title>上线前后比较的是同一指标的分布</title>
<rect width="1120" height="710" fill="#f3f8fc" />
<style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#1e293b;font-size:22px}.title{font-size:30px;font-weight:700}.small{font-size:19px}</style>
<text x="40" y="48" class="title" text-anchor="start">上线前后比较的是同一指标的分布</text>
<text x="40" y="695" class="small" text-anchor="start" font-size="16">原创教学示意 · 数值与条件以图解正文为准</text>
<line x1="90" y1="420.0" x2="1060" y2="420.0" stroke="#94a3b8" stroke-width="3" stroke-dasharray="" />
<rect x="140.0" y="308.0" width="105" height="112.0" fill="#079b91" opacity=".85" />
<text x="192.0" y="296.0" class="" text-anchor="middle">0.1</text>
<text x="192.0" y="460" class="small" text-anchor="middle">验证集：错误率</text>
<rect x="430.0" y="285.6" width="105" height="134.39999999999998" fill="#ef8b3a" opacity=".85" />
<text x="482.0" y="273.6" class="" text-anchor="middle">0.12</text>
<text x="482.0" y="460" class="small" text-anchor="middle">上线首周：错误率</text>
<rect x="720.0" y="140.0" width="105" height="280.0" fill="#315fba" opacity=".85" />
<text x="772.0" y="128.0" class="" text-anchor="middle">0.25</text>
<text x="772.0" y="460" class="small" text-anchor="middle">上线次周：错误率</text>
<rect x="42" y="560" width="1036.0" height="105" rx="12" fill="#e5f2f4" /><text x="64" y="593" font-size="20" fill="#244c5e">图中三个柱都采用相同标签定义、相同阈值和相同统计单位，因而可以对错误率进行有意义的比较。</text></svg>
