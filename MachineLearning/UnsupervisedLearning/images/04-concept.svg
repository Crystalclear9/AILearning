<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>同样稳定，却不是同一种分组</title><desc>固定四个对象。圆形A与C属于一种语义，方形B与D属于另一种。按采集批次竖分为AB/CD，与按语义横分AC/BD的划分不同。两者均可在重复中完全稳定，对语义的ARI分别为负二分之一与一。</desc><rect width="1200" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">同样稳定，却不是同一种分组</text><text x="40" y="104" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">圆形 / 方形：外部语义     阴影：算法得到的簇</text><text x="80" y="175" font-size="29" fill="#19333c" text-anchor="start" font-weight="700">按采集批次分组</text><rect x="60" y="222" width="150" height="285" fill="#edf3f4" stroke="none" stroke-width="2"/><rect x="330" y="222" width="150" height="285" fill="#f6f2ee" stroke="none" stroke-width="2"/><circle cx="135" cy="275" r="25" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="175" y="285" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">A</text><rect x="111" y="431" width="48" height="48" fill="#c0643c" stroke="none" stroke-width="2"/><text x="175" y="465" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">B</text><circle cx="405" cy="275" r="25" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="445" y="285" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">C</text><rect x="381" y="431" width="48" height="48" fill="#c0643c" stroke="none" stroke-width="2"/><text x="445" y="465" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">D</text><text x="260" y="558" font-size="29" fill="#19333c" text-anchor="middle" font-weight="400">A、B / C、D</text><text x="260" y="621" font-size="26" fill="#78878b" text-anchor="middle" font-weight="400">重复时保持同一划分</text><text x="260" y="687" font-size="30" fill="#19333c" text-anchor="middle" font-weight="400">对语义的 ARI = −0.5</text><text x="695" y="175" font-size="29" fill="#19333c" text-anchor="start" font-weight="700">按外部语义分组</text><rect x="675" y="222" width="420" height="105" fill="#edf3f4" stroke="none" stroke-width="2"/><rect x="675" y="402" width="420" height="105" fill="#f6f2ee" stroke="none" stroke-width="2"/><circle cx="750" cy="275" r="25" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="790" y="285" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">A</text><rect x="726" y="431" width="48" height="48" fill="#c0643c" stroke="none" stroke-width="2"/><text x="790" y="465" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">B</text><circle cx="1020" cy="275" r="25" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="1060" y="285" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">C</text><rect x="996" y="431" width="48" height="48" fill="#c0643c" stroke="none" stroke-width="2"/><text x="1060" y="465" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">D</text><text x="875" y="558" font-size="29" fill="#19333c" text-anchor="middle" font-weight="400">A、C / B、D</text><text x="875" y="621" font-size="26" fill="#78878b" text-anchor="middle" font-weight="400">重复时保持同一划分</text><text x="875" y="687" font-size="30" fill="#19333c" text-anchor="middle" font-weight="400">对语义的 ARI = 1</text></g></svg>
