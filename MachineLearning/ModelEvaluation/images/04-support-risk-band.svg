<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="541" viewBox="0 85 960 541" role="img" aria-labelledby="artwork-title"><title id="artwork-title">目标总体的已识别风险面积与支持外未知区域共同给出百分之八至二十八的整体风险范围</title><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="490.301744"/></clipPath></defs><rect width="960" height="626" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 66.370671) scale(0.710938)"><g><rect id="offline-white-background" x="0" y="66.995074" width="1280" height="689.655172" fill="#ffffff"/><title>支持外没有标签：误差再小，也留下不可消除的风险区间</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#446578" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="55" y="110" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#243b53" text-anchor="start" font-weight="400">目标总体：80% 有源域支持，已知风险 10%；20% 没有源标签。</text><rect x="70" y="180" width="800" height="180" rx="0" fill="#edf4f8" stroke="#cfd9e2"/><rect x="70" y="342" width="800" height="18" rx="0" fill="#2182c7" stroke="#cfd9e2"/><rect x="870" y="180" width="200" height="180" rx="0" fill="#fdf4e9" stroke="#c25a13"/><text x="470" y="235" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="37.274725px" fill="#243b53" text-anchor="middle" font-weight="400">覆盖区质量 0.8</text><text x="470" y="285" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#243b53" text-anchor="middle" font-weight="400">已识别贡献 0.8 × 0.1 = 0.08</text><text x="970" y="235" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="37.274725px" fill="#243b53" text-anchor="middle" font-weight="400">未知区</text><text x="970" y="285" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#243b53" text-anchor="middle" font-weight="400">质量 0.2</text><text x="70" y="405" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#243b53" text-anchor="start" font-weight="400">蓝色面积已知；橙色区域的损失可从 0 到 1，缺少标签无法区分。</text><line x1="140" y1="540" x2="1040.0" y2="540" stroke="#becbd7" stroke-width="3" stroke-dasharray=""/><line x1="140" y1="532" x2="140" y2="550" stroke="#bdcad7" stroke-width="2" stroke-dasharray=""/><text x="140" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28.56px" fill="#243b53" text-anchor="middle" font-weight="400">0.00</text><line x1="380.0" y1="532" x2="380.0" y2="550" stroke="#bdcad7" stroke-width="2" stroke-dasharray=""/><text x="380.0" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28.56px" fill="#243b53" text-anchor="middle" font-weight="400">0.08</text><line x1="440.0" y1="532" x2="440.0" y2="550" stroke="#bdcad7" stroke-width="2" stroke-dasharray=""/><text x="440.0" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28.56px" fill="#243b53" text-anchor="middle" font-weight="400">0.10</text><line x1="740.0" y1="532" x2="740.0" y2="550" stroke="#bdcad7" stroke-width="2" stroke-dasharray=""/><text x="740.0" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28.56px" fill="#243b53" text-anchor="middle" font-weight="400">0.20</text><line x1="980.0000000000001" y1="532" x2="980.0000000000001" y2="550" stroke="#bdcad7" stroke-width="2" stroke-dasharray=""/><text x="980.0000000000001" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28.56px" fill="#243b53" text-anchor="middle" font-weight="400">0.28</text><line x1="1040.0" y1="532" x2="1040.0" y2="550" stroke="#bdcad7" stroke-width="2" stroke-dasharray=""/><text x="1040.0" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28.56px" fill="#243b53" text-anchor="middle" font-weight="400">0.30</text><rect x="380.0" y="485" width="600.0000000000001" height="55" rx="0" fill="#fbe5c9" stroke="#c25a13"/><line x1="380.0" y1="485" x2="380.0" y2="540" stroke="#147fba" stroke-width="4" stroke-dasharray=""/><text x="680.0" y="520" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#243b53" text-anchor="middle" font-weight="400">整体风险可取的范围</text><text x="55" y="665" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="37.274725px" fill="#243b53" text-anchor="start" font-weight="400">下界 0.08：未知区全对；上界 0.28：未知区全错。</text><text x="55" y="730" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#4c7a94" text-anchor="start" font-weight="400">区间宽度 0.20 来自识别缺口；增加覆盖区样本不会缩小它。</text></g></g></g></svg>