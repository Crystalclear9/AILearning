<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img"><title>配对比较必须保留对象身份</title><desc>A损失4、7、10，B损失3、6、9。按对象配对差值恒为1，错误打乱B产生-5、4、4，均值仍为1但分母为3的方差由0变18。</desc><rect width="1200" height="870" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="50" y="58" font-size="35" fill="#233642" text-anchor="start">模型差值的单位，是同一个对象</text><text x="50" y="111" font-size="28" fill="#233642" text-anchor="start">A 的损失 (4, 7, 10)；B 的损失 (3, 6, 9)</text><text x="50" y="185" font-size="28" fill="#246d91" text-anchor="start">保留身份：逐对象相减</text><text x="150" y="246" font-size="27" fill="#233642" text-anchor="middle">A</text><text x="300" y="246" font-size="27" fill="#233642" text-anchor="middle">B</text><text x="450" y="246" font-size="27" fill="#233642" text-anchor="middle">A − B</text><text x="65" y="323" font-size="24" fill="#687b86" text-anchor="middle">对象 1</text><text x="150" y="323" font-size="30" fill="#233642" text-anchor="middle">4</text><text x="300" y="323" font-size="30" fill="#246d91" text-anchor="middle">3</text><text x="450" y="323" font-size="31" fill="#246d91" text-anchor="middle">1</text><line x1="184" y1="314" x2="264" y2="314" stroke="#246d91" stroke-width="2"/><text x="65" y="433" font-size="24" fill="#687b86" text-anchor="middle">对象 2</text><text x="150" y="433" font-size="30" fill="#233642" text-anchor="middle">7</text><text x="300" y="433" font-size="30" fill="#246d91" text-anchor="middle">6</text><text x="450" y="433" font-size="31" fill="#246d91" text-anchor="middle">1</text><line x1="184" y1="424" x2="264" y2="424" stroke="#246d91" stroke-width="2"/><text x="65" y="543" font-size="24" fill="#687b86" text-anchor="middle">对象 3</text><text x="150" y="543" font-size="30" fill="#233642" text-anchor="middle">10</text><text x="300" y="543" font-size="30" fill="#246d91" text-anchor="middle">9</text><text x="450" y="543" font-size="31" fill="#246d91" text-anchor="middle">1</text><line x1="184" y1="534" x2="264" y2="534" stroke="#246d91" stroke-width="2"/><text x="50" y="650" font-size="29" fill="#246d91" text-anchor="start">差值均值 = 1</text><text x="50" y="704" font-size="29" fill="#246d91" text-anchor="start">差值方差 = 0</text><text x="650" y="185" font-size="28" fill="#bc5b31" text-anchor="start">打乱 B：不同对象相减</text><text x="750" y="246" font-size="27" fill="#233642" text-anchor="middle">A</text><text x="900" y="246" font-size="27" fill="#233642" text-anchor="middle">B</text><text x="1050" y="246" font-size="27" fill="#233642" text-anchor="middle">A − B</text><text x="665" y="323" font-size="24" fill="#687b86" text-anchor="middle">对象 1</text><text x="750" y="323" font-size="30" fill="#233642" text-anchor="middle">4</text><text x="900" y="323" font-size="30" fill="#bc5b31" text-anchor="middle">9</text><text x="1050" y="323" font-size="31" fill="#bc5b31" text-anchor="middle">-5</text><line x1="784" y1="314" x2="864" y2="314" stroke="#bc5b31" stroke-width="2"/><text x="665" y="433" font-size="24" fill="#687b86" text-anchor="middle">对象 2</text><text x="750" y="433" font-size="30" fill="#233642" text-anchor="middle">7</text><text x="900" y="433" font-size="30" fill="#bc5b31" text-anchor="middle">3</text><text x="1050" y="433" font-size="31" fill="#bc5b31" text-anchor="middle">4</text><line x1="784" y1="424" x2="864" y2="424" stroke="#bc5b31" stroke-width="2"/><text x="665" y="543" font-size="24" fill="#687b86" text-anchor="middle">对象 3</text><text x="750" y="543" font-size="30" fill="#233642" text-anchor="middle">10</text><text x="900" y="543" font-size="30" fill="#bc5b31" text-anchor="middle">6</text><text x="1050" y="543" font-size="31" fill="#bc5b31" text-anchor="middle">4</text><line x1="784" y1="534" x2="864" y2="534" stroke="#bc5b31" stroke-width="2"/><text x="650" y="650" font-size="29" fill="#bc5b31" text-anchor="start">差值均值 = 1</text><text x="650" y="704" font-size="29" fill="#bc5b31" text-anchor="start">差值方差 = 18</text><line x1="50" y1="583" x2="1150" y2="583" stroke="#dce5e9" stroke-width="2"/><text x="50" y="788" font-size="25" fill="#233642" text-anchor="start">方差按三个对象归一化；打乱不改变两个均值，却破坏差值的配对含义。</text></g></svg>
