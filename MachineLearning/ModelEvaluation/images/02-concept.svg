<text x="480" y="135" text-anchor="middle">子集 A</text><text x="710" y="135" text-anchor="middle">子集 B</text><text x="940" y="135" text-anchor="middle">子集 C</text><text x="70" y="215">第 1 折</text><rect x="385" y="170" width="195" height="65" rx="12" fill="#fce5d3" stroke="#64748b" /><text x="480" y="210" text-anchor="middle">验证</text><rect x="615" y="170" width="195" height="65" rx="12" fill="#e7f3f5" stroke="#64748b" /><text x="710" y="210" text-anchor="middle">训练</text><rect x="845" y="170" width="195" height="65" rx="12" fill="#e7f3f5" stroke="#64748b" /><text x="940" y="210" text-anchor="middle">训练</text><text x="70" y="300">第 2 折</text><rect x="385" y="255" width="195" height="65" rx="12" fill="#e7f3f5" stroke="#64748b" /><text x="480" y="295" text-anchor="middle">训练</text><rect x="615" y="255" width="195" height="65" rx="12" fill="#fce5d3" stroke="#64748b" /><text x="710" y="295" text-anchor="middle">验证</text><rect x="845" y="255" width="195" height="65" rx="12" fill="#e7f3f5" stroke="#64748b" /><text x="940" y="295" text-anchor="middle">训练</text><text x="70" y="385">第 3 折</text><rect x="385" y="340" width="195" height="65" rx="12" fill="#e7f3f5" stroke="#64748b" /><text x="480" y="380" text-anchor="middle">训练</text><rect x="615" y="340" width="195" height="65" rx="12" fill="#e7f3f5" stroke="#64748b" /><text x="710" y="380" text-anchor="middle">训练</text><rect x="845" y="340" width="195" height="65" rx="12" fill="#fce5d3" stroke="#64748b" /><text x="940" y="380" text-anchor="middle">验证</text><rect x="42" y="560" width="1036.0" height="105" rx="12" fill="#e5f2f4" /><text x="64" y="593" font-size="20" fill="#244c5e">这张简化折分示意把同一份数据的不同角色并列画出：在第一折，A 充当验证集；到第二折，B 才充</text><text x="64" y="621" font-size="20" fill="#244c5e">当验证集。</text></svg>
