<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>分类、标注与生成的输出单位</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">分类、标注与生成的输出单位</text><rect x="60" y="295" width="300" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="75" y="330" font-size="25" fill="#143651">同一段输入文本</text><text x="75" y="373" font-size="22" fill="#143651">编码为任务表示</text><rect x="760" y="135" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3"/><text x="780" y="190" font-size="25" fill="#143651">分类：一个标签</text><line x1="370" y1="345" x2="750" y2="180" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><rect x="760" y="335" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3"/><text x="780" y="390" font-size="25" fill="#143651">标注：每个位置标签</text><line x1="370" y1="345" x2="750" y2="380" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><rect x="760" y="535" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3"/><text x="780" y="590" font-size="25" fill="#143651">生成：输出新序列</text><line x1="370" y1="345" x2="750" y2="580" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><text x="100" y="670" font-size="25" fill="#143651">任务输出单位不同，监督、归约分母与评价指标也应不同。</text></g></svg>
