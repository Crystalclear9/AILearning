<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>分类、标注与生成的输出单位：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分类、标注与生成的输出单位</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="60" y="295" width="300" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="75" y="330" font-size="25" fill="#143651">同一段输入文本</ns0:text><ns0:text x="75" y="373" font-size="22" fill="#143651">编码为任务表示</ns0:text><ns0:rect x="760" y="135" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3" /><ns0:text x="780" y="190" font-size="25" fill="#143651">分类：一个标签</ns0:text><ns0:line x1="370" y1="345" x2="750" y2="180" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="760" y="335" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3" /><ns0:text x="780" y="390" font-size="25" fill="#143651">标注：每个位置标签</ns0:text><ns0:line x1="370" y1="345" x2="750" y2="380" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="760" y="535" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3" /><ns0:text x="780" y="590" font-size="25" fill="#143651">生成：输出新序列</ns0:text><ns0:line x1="370" y1="345" x2="750" y2="580" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="100" y="670" font-size="25" fill="#143651">任务输出单位不同，监督、归约分母与评价指标也应不同。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  同一输入长度四的输出算例</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  token 高分不保证实体完整正确</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">分类：整段输出 1 个类别标签</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">标注：4 个 token 输出 4 个标签</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">若实体跨度为 2 token，仍按跨度评估</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">生成：可输出 3 token；长度不必为 4</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">不能用逐 token 准确率冒充严格实体 F1，也不能以词面重合证</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">明生成事实正确。</ns0:text><ns0:text x="805" y="842" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">真值</ns0:text><ns0:rect x="820" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="836" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B-X</ns0:text><ns0:rect x="942" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="958" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</ns0:text><ns0:rect x="1064" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1080" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</ns0:text><ns0:rect x="1186" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1202" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</ns0:text><ns0:rect x="1308" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1324" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</ns0:text><ns0:text x="805" y="957" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">预测</ns0:text><ns0:rect x="820" y="975" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="836" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B-X</ns0:text><ns0:rect x="942" y="975" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="958" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</ns0:text><ns0:rect x="1064" y="975" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1080" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</ns0:text><ns0:rect x="1186" y="975" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1202" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</ns0:text><ns0:rect x="1308" y="975" width="112" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="1324" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</ns0:text><ns0:text x="805" y="1110" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">token准确率 80%；唯一实体的严格F1为0</ns0:text></ns0:svg>
