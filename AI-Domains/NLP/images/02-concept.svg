<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2056" viewBox="0 0 1200 2056" role="img"><title>分类、标注与生成的输出单位：机制、算例与边界</title><rect width="1200" height="2056" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分类、标注与生成的输出单位</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="625.75" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="745.75" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1295.75" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="545.75" viewBox="0 109 1200 590" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="60" y="295" width="300" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="75" y="330" font-size="25" fill="#143651">同一段输入文本</text><text x="75" y="373" font-size="22" fill="#143651">编码为任务表示</text><rect x="760" y="135" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3" /><text x="780" y="190" font-size="25" fill="#143651">分类：一个标签</text><line x1="370" y1="345" x2="750" y2="180" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="760" y="335" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3" /><text x="780" y="390" font-size="25" fill="#143651">标注：每个位置标签</text><line x1="370" y1="345" x2="750" y2="380" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="760" y="535" width="370" height="90" rx="7" fill="#d9eee5" stroke="#80a0b3" /><text x="780" y="590" font-size="25" fill="#143651">生成：输出新序列</text><line x1="370" y1="345" x2="750" y2="580" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="100" y="670" font-size="25" fill="#143651">任务输出单位不同，监督、归约分母与评价指标也应不同。</text></g></svg><text x="48" y="788.75" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  同一输入长度四的输出算例</text><text x="48" y="1338.75" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  token 高分不保证实体完整正确</text><g transform="translate(30,805.75) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">分类：整段输出 1 个类别标签</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">标注：4 个 token 输出 4 个标签</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">若实体跨度为 2 token，仍按跨度评估</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">生成：可输出 3 token；长度不必为 4</text></g><g transform="translate(45,1355.75) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">不能用逐 token 准确率冒充严格实体 F1，也不能以词面重合证</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">明生成事实正确。</tspan></text><text x="805" y="842" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">真值</text><rect x="820" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="836" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B-X</text><rect x="942" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="958" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</text><rect x="1064" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="1080" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</text><rect x="1186" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="1202" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</text><rect x="1308" y="860" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="1324" y="902" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</text><text x="805" y="957" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">预测</text><rect x="820" y="975" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="836" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B-X</text><rect x="942" y="975" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="958" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</text><rect x="1064" y="975" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="1080" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</text><rect x="1186" y="975" width="112" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="1202" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-X</text><rect x="1308" y="975" width="112" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><text x="1324" y="1017" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</text><text x="805" y="1110" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">token准确率 80%；唯一实体的严格F1为0</text></g></svg>
