<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>联合最优路径与逐位置边缘最优解</title><rect width="1200" height="620" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#19344d"><text x="45" y="58" font-size="32" fill="#19344d" text-anchor="start">同一概率分布，两个决策目标</text><text x="45" y="115" font-size="25" fill="#19344d" text-anchor="start">行：第 1 个标签；列：第 2 个标签</text><text x="245" y="180" font-size="27" fill="#19344d" text-anchor="middle">标签 0</text><text x="395" y="180" font-size="27" fill="#19344d" text-anchor="middle">标签 1</text><text x="70" y="275" font-size="27" fill="#19344d" text-anchor="start">标签 0</text><rect x="170" y="210" width="150" height="130" fill="#eaf2fa" stroke="white" stroke-width="3"/><text x="245" y="285" font-size="32" fill="#19344d" text-anchor="middle">0.35</text><rect x="320" y="210" width="150" height="130" fill="#eaf2fa" stroke="white" stroke-width="3"/><text x="395" y="285" font-size="32" fill="#19344d" text-anchor="middle">0.3</text><text x="70" y="405" font-size="27" fill="#19344d" text-anchor="start">标签 1</text><rect x="170" y="340" width="150" height="130" fill="#eaf2fa" stroke="white" stroke-width="3"/><text x="245" y="415" font-size="32" fill="#19344d" text-anchor="middle">0.01</text><rect x="320" y="340" width="150" height="130" fill="#eaf2fa" stroke="white" stroke-width="3"/><text x="395" y="415" font-size="32" fill="#19344d" text-anchor="middle">0.34</text><rect x="170" y="210" width="150" height="130" fill="none" stroke="#d66b28" stroke-width="3"/><text x="520" y="180" font-size="25" fill="#19344d" text-anchor="start">行边缘</text><text x="560" y="285" font-size="30" fill="#2166ac" text-anchor="middle">0.65</text><text x="560" y="415" font-size="30" fill="#19344d" text-anchor="middle">0.35</text><text x="65" y="535" font-size="25" fill="#19344d" text-anchor="start">列边缘</text><text x="245" y="535" font-size="30" fill="#19344d" text-anchor="middle">0.36</text><text x="395" y="535" font-size="30" fill="#2166ac" text-anchor="middle">0.64</text><text x="720" y="205" font-size="29" fill="#d66b28" text-anchor="start">联合概率最大</text><rect x="730" y="235" width="110" height="70" fill="#fceadf" stroke="white" stroke-width="3"/><rect x="850" y="235" width="110" height="70" fill="#fceadf" stroke="white" stroke-width="3"/><text x="785" y="280" font-size="32" fill="#19344d" text-anchor="middle">0</text><text x="905" y="280" font-size="32" fill="#19344d" text-anchor="middle">0</text><text x="720" y="350" font-size="27" fill="#19344d" text-anchor="start">P(00) = 0.35</text><text x="720" y="425" font-size="29" fill="#2166ac" text-anchor="start">逐位置边缘最大</text><rect x="730" y="455" width="110" height="70" fill="#eaf2fa" stroke="white" stroke-width="3"/><rect x="850" y="455" width="110" height="70" fill="#eaf2fa" stroke="white" stroke-width="3"/><text x="785" y="500" font-size="32" fill="#19344d" text-anchor="middle">0</text><text x="905" y="500" font-size="32" fill="#19344d" text-anchor="middle">1</text><text x="720" y="575" font-size="27" fill="#19344d" text-anchor="start">P(01) = 0.30</text></g></svg>