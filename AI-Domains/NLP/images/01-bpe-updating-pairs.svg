<svg xmlns="http://www.w3.org/2000/svg" width="1158.41" height="759.408" viewBox="20.796 53.796 1158.41 759.408" role="img" aria-labelledby="plate-title"><title id="plate-title">词频加权BPE的相邻对频数和newest的三步合并</title><rect id="edition-paper" x="20.796" y="53.796" width="1158.41" height="759.408" fill="#ffffff"/><svg id="edition-view" x="42" y="75" width="1116" height="717" viewBox="42 75 1116 717" overflow="hidden"><rect x="42" y="75" width="1116" height="717" fill="#ffffff"/><rect width="1280" height="800" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#283341" text-anchor="start">low × 5，lower × 2，newest × 6，widest × 3；平局按符号对字典序。</text><text x="70" y="175" font-size="27" fill="#283341" text-anchor="start">e + s：9</text><rect x="70" y="198" width="220" height="12" fill="#2c6f89"/><text x="370" y="175" font-size="27" fill="#283341" text-anchor="start">s + t：9</text><rect x="370" y="198" width="220" height="12" fill="#2c6f89"/><text x="670" y="175" font-size="27" fill="#283341" text-anchor="start">t + &lt;/w&gt;：9</text><rect x="670" y="198" width="220" height="12" fill="#2c6f89"/><text x="970" y="175" font-size="27" fill="#283341" text-anchor="start">l + o：7</text><rect x="970" y="198" width="170" height="12" fill="#2c6f89"/><text x="60" y="300" font-size="27" fill="#283341" text-anchor="start">初始 newest</text><rect x="280" y="265" width="92" height="60" fill="#eff5f6"/><text x="326.0" y="304" font-size="26" fill="#283341" text-anchor="middle">n</text><rect x="380" y="265" width="92" height="60" fill="#eff5f6"/><text x="426.0" y="304" font-size="26" fill="#283341" text-anchor="middle">e</text><rect x="480" y="265" width="92" height="60" fill="#eff5f6"/><text x="526.0" y="304" font-size="26" fill="#283341" text-anchor="middle">w</text><rect x="580" y="265" width="92" height="60" fill="#faf0eb"/><text x="626.0" y="304" font-size="26" fill="#283341" text-anchor="middle">e</text><rect x="680" y="265" width="92" height="60" fill="#faf0eb"/><text x="726.0" y="304" font-size="26" fill="#283341" text-anchor="middle">s</text><rect x="780" y="265" width="92" height="60" fill="#eff5f6"/><text x="826.0" y="304" font-size="26" fill="#283341" text-anchor="middle">t</text><rect x="880" y="265" width="92" height="60" fill="#eff5f6"/><text x="926.0" y="304" font-size="26" fill="#283341" text-anchor="middle">&lt;/w&gt;</text><text x="60" y="410" font-size="27" fill="#283341" text-anchor="start">合并 e + s</text><rect x="280" y="375" width="92" height="60" fill="#eff5f6"/><text x="326.0" y="414" font-size="26" fill="#283341" text-anchor="middle">n</text><rect x="380" y="375" width="92" height="60" fill="#eff5f6"/><text x="426.0" y="414" font-size="26" fill="#283341" text-anchor="middle">e</text><rect x="480" y="375" width="92" height="60" fill="#eff5f6"/><text x="526.0" y="414" font-size="26" fill="#283341" text-anchor="middle">w</text><rect x="580" y="375" width="192" height="60" fill="#faf0eb"/><text x="676.0" y="414" font-size="26" fill="#283341" text-anchor="middle">es</text><rect x="780" y="375" width="92" height="60" fill="#eff5f6"/><text x="826.0" y="414" font-size="26" fill="#283341" text-anchor="middle">t</text><rect x="880" y="375" width="92" height="60" fill="#eff5f6"/><text x="926.0" y="414" font-size="26" fill="#283341" text-anchor="middle">&lt;/w&gt;</text><text x="60" y="520" font-size="27" fill="#283341" text-anchor="start">合并 es + t</text><rect x="280" y="485" width="92" height="60" fill="#eff5f6"/><text x="326.0" y="524" font-size="26" fill="#283341" text-anchor="middle">n</text><rect x="380" y="485" width="92" height="60" fill="#eff5f6"/><text x="426.0" y="524" font-size="26" fill="#283341" text-anchor="middle">e</text><rect x="480" y="485" width="92" height="60" fill="#eff5f6"/><text x="526.0" y="524" font-size="26" fill="#283341" text-anchor="middle">w</text><rect x="580" y="485" width="292" height="60" fill="#faf0eb"/><text x="726.0" y="524" font-size="26" fill="#283341" text-anchor="middle">est</text><rect x="880" y="485" width="92" height="60" fill="#eff5f6"/><text x="926.0" y="524" font-size="26" fill="#283341" text-anchor="middle">&lt;/w&gt;</text><text x="60" y="630" font-size="27" fill="#283341" text-anchor="start">合并 est + &lt;/w&gt;</text><rect x="280" y="595" width="92" height="60" fill="#eff5f6"/><text x="326.0" y="634" font-size="26" fill="#283341" text-anchor="middle">n</text><rect x="380" y="595" width="92" height="60" fill="#eff5f6"/><text x="426.0" y="634" font-size="26" fill="#283341" text-anchor="middle">e</text><rect x="480" y="595" width="92" height="60" fill="#eff5f6"/><text x="526.0" y="634" font-size="26" fill="#283341" text-anchor="middle">w</text><rect x="580" y="595" width="392" height="60" fill="#faf0eb"/><text x="776.0" y="634" font-size="26" fill="#283341" text-anchor="middle">est&lt;/w&gt;</text><text x="60" y="720" font-size="27" fill="#283341" text-anchor="start">newest 的 6 次与 widest 的 3 次，共同提供每一步 9 次合并机会。</text><text x="60" y="770" font-size="26" fill="#283341" text-anchor="start">s 已并入 es 后，下一步比较的是 es + t，原来的 s + t 不再存在。</text></g></svg></svg>