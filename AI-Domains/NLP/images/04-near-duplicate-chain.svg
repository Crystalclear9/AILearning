<svg xmlns="http://www.w3.org/2000/svg" width="1178.13" height="670.13" viewBox="20.435 53.435 1178.13 670.13" role="img" aria-labelledby="plate-title"><title id="plate-title">三个词集合相邻相似却端点不相似的连通分量反例</title><rect id="edition-paper" x="20.435" y="53.435" width="1178.13" height="670.13" fill="#ffffff"/><svg id="edition-view" x="42" y="75" width="1135" height="627" viewBox="42 75 1135 627" overflow="hidden"><rect x="42" y="75" width="1135" height="627" fill="#ffffff"/><rect width="1280" height="720" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#283341" text-anchor="start">沿用实验一集合：A = {a, b}，B = {a, b, c}，C = {b, c}；阈值 0.6。</text><line x1="160" y1="340" x2="640" y2="215" stroke="#2c6f89" stroke-width="6"/><line x1="640" y1="215" x2="1120" y2="340" stroke="#2c6f89" stroke-width="6"/><circle cx="160" cy="340" r="39" fill="#2c6f89"/><text x="160" y="352" font-size="34" fill="#ffffff" text-anchor="middle">A</text><circle cx="640" cy="215" r="39" fill="#2c6f89"/><text x="640" y="227" font-size="34" fill="#ffffff" text-anchor="middle">B</text><circle cx="1120" cy="340" r="39" fill="#2c6f89"/><text x="1120" y="352" font-size="34" fill="#ffffff" text-anchor="middle">C</text><line x1="200" y1="390" x2="1080" y2="390" stroke="#b56b47" stroke-width="3" stroke-dasharray="10 10"/><text x="60" y="550" font-size="28" fill="#283341" text-anchor="start">两条蓝边已经连通 A、B、C；分组时三者仍属于同一个组件。</text><text x="60" y="615" font-size="28" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">它约束的是跨集合隔离，不是把三篇视作同一事实并删掉两篇。</text><text x="60" y="680" font-size="26" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">连接原因、组件大小和来源身份仍需保留，避免模板链无限扩张。</text><text x="300" y="205" font-size="27" fill="#2c6f89" text-anchor="start" font-family="Microsoft YaHei, sans-serif">J(A, B) =</text><text x="465" y="189" font-size="27" fill="#2c6f89" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">2</text><line x1="451.0" x2="479.0" y1="199" y2="199" stroke="#2c6f89" stroke-width="2"/><text x="465" y="229" font-size="27" fill="#2c6f89" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">3</text><text x="790" y="205" font-size="27" fill="#2c6f89" text-anchor="start" font-family="Microsoft YaHei, sans-serif">J(B, C) =</text><text x="955" y="189" font-size="27" fill="#2c6f89" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">2</text><line x1="941.0" x2="969.0" y1="199" y2="199" stroke="#2c6f89" stroke-width="2"/><text x="955" y="229" font-size="27" fill="#2c6f89" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">3</text><text x="335" y="450" font-size="28" fill="#b56b47" text-anchor="start" font-family="Microsoft YaHei, sans-serif">J(A, C) =</text><text x="505" y="433" font-size="28" fill="#b56b47" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">1</text><line x1="490.0" x2="520.0" y1="443" y2="443" stroke="#b56b47" stroke-width="2"/><text x="505" y="473" font-size="28" fill="#b56b47" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">3</text><text x="545" y="450" font-size="28" fill="#b56b47" text-anchor="start" font-family="Microsoft YaHei, sans-serif">&lt; 0.6：没有相似边</text></g></svg></svg>