="300" x2="850" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><text x="150" y="650" font-size="24" fill="#143651">字符坐标与 token 坐标不同；规范化与分词应保留可追踪映射。</text></g></svg>
