<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>分词改变序列长度和概率单位：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分词改变序列长度和概率单位</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="120" y="200" width="200" height="90" rx="7" fill="#dbeaf6" stroke="#80a0b3" /><ns0:text x="200" y="258" font-size="35" fill="#143651">北</ns0:text><ns0:text x="185" y="170" font-size="23" fill="#143651">位置 0</ns0:text><ns0:rect x="355" y="200" width="200" height="90" rx="7" fill="#dbeaf6" stroke="#80a0b3" /><ns0:text x="435" y="258" font-size="35" fill="#143651">京</ns0:text><ns0:text x="420" y="170" font-size="23" fill="#143651">位置 1</ns0:text><ns0:rect x="590" y="200" width="200" height="90" rx="7" fill="#dbeaf6" stroke="#80a0b3" /><ns0:text x="670" y="258" font-size="35" fill="#143651">大</ns0:text><ns0:text x="655" y="170" font-size="23" fill="#143651">位置 2</ns0:text><ns0:rect x="825" y="200" width="200" height="90" rx="7" fill="#dbeaf6" stroke="#80a0b3" /><ns0:text x="905" y="258" font-size="35" fill="#143651">学</ns0:text><ns0:text x="890" y="170" font-size="23" fill="#143651">位置 3</ns0:text><ns0:rect x="220" y="465" width="300" height="95" rx="7" fill="#c6e5d8" stroke="#80a0b3" /><ns0:text x="325" y="525" font-size="34" fill="#143651">北京</ns0:text><ns0:line x1="220" y1="300" x2="360" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="455" y1="300" x2="380" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="690" y="465" width="300" height="95" rx="7" fill="#c6e5d8" stroke="#80a0b3" /><ns0:text x="795" y="525" font-size="34" fill="#143651">大学</ns0:text><ns0:line x1="690" y1="300" x2="830" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="925" y1="300" x2="850" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="150" y="650" font-size="24" fill="#143651">字符坐标与 token 坐标不同；规范化与分词应保留可追踪映射。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  字符与 token 两套坐标需映射</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  不同词表会改变 token 数</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">原文：北京大学，共 4 个字符</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">示例分词：[北京]、[大学]</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两个 token 对应跨度 [0,2)、[2,4)</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">模型长度 2 不等于字符长度 4</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">4</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">字符数</ns0:text><ns0:rect x="1220" y="953.0" width="120" height="95.0" fill="#e3a461" /><ns0:text x="1215" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">本例 token 数</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">这是一个指定分词示例，不声称所有词表都会如此切分；规范</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">化改变原文时还需额外坐标映射。</ns0:text></ns0:svg>
