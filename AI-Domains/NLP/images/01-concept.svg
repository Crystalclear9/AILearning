<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2022" viewBox="0 0 1200 2022" role="img"><title>分词改变序列长度和概率单位：机制、算例与边界</title><rect width="1200" height="2022" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分词改变序列长度和概率单位</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="592.45" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="712.45" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1262.45" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="512.45" viewBox="0 125 1200 554" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="120" y="200" width="200" height="90" rx="7" fill="#dbeaf6" stroke="#80a0b3" /><text x="200" y="258" font-size="35" fill="#143651">北</text><text x="185" y="170" font-size="23" fill="#143651">位置 0</text><rect x="355" y="200" width="200" height="90" rx="7" fill="#dbeaf6" stroke="#80a0b3" /><text x="435" y="258" font-size="35" fill="#143651">京</text><text x="420" y="170" font-size="23" fill="#143651">位置 1</text><rect x="590" y="200" width="200" height="90" rx="7" fill="#dbeaf6" stroke="#80a0b3" /><text x="670" y="258" font-size="35" fill="#143651">大</text><text x="655" y="170" font-size="23" fill="#143651">位置 2</text><rect x="825" y="200" width="200" height="90" rx="7" fill="#dbeaf6" stroke="#80a0b3" /><text x="905" y="258" font-size="35" fill="#143651">学</text><text x="890" y="170" font-size="23" fill="#143651">位置 3</text><rect x="220" y="465" width="300" height="95" rx="7" fill="#c6e5d8" stroke="#80a0b3" /><text x="325" y="525" font-size="34" fill="#143651">北京</text><line x1="220" y1="300" x2="360" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><line x1="455" y1="300" x2="380" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="690" y="465" width="300" height="95" rx="7" fill="#c6e5d8" stroke="#80a0b3" /><text x="795" y="525" font-size="34" fill="#143651">大学</text><line x1="690" y1="300" x2="830" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><line x1="925" y1="300" x2="850" y2="455" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="150" y="650" font-size="24" fill="#143651">字符坐标与 token 坐标不同；规范化与分词应保留可追踪映射。</text></g></svg><text x="48" y="755.45" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  字符与 token 两套坐标需映射</text><text x="48" y="1305.45" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  不同词表会改变 token 数</text><g transform="translate(30,772.45) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">原文：北京大学，共 4 个字符</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">示例分词：[北京]、[大学]</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两个 token 对应跨度 [0,2)、[2,4)</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">模型长度 2 不等于字符长度 4</text></g><g transform="translate(45,1322.45) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">4</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">字符数</text><rect x="1220" y="953.0" width="120" height="95.0" fill="#e3a461" /><text x="1215" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">本例 token 数</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">这是一个指定分词示例，不声称所有词表都会如此切分；规范</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">化改变原文时还需额外坐标映射。</tspan></text></g></svg>
