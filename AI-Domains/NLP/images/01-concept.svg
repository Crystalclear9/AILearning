<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>分词改变序列长度和概率单位</title>
<desc>原创教学示意：原始字符串|保留原文与字符坐标;规范化|记录变换后的对应关系;分词编码|得到 token 与偏移映射;模型输入|token ID、长度与掩码</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">分词改变序列长度和概率单位</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">原始字符串</text>
<text x="53" y="160" font-size="21" fill="#16324f">保留原文与字符坐标</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">规范化</text>
<text x="603" y="160" font-size="21" fill="#16324f">记录变换后的对应关系</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">分词编码</text>
<text x="53" y="330" font-size="21" fill="#16324f">得到 token 与偏移映射</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">模型输入</text>
<text x="603" y="330" font-size="21" fill="#16324f">token ID、长度与掩码</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="500" font-size="20" fill="#173c53">同一字符串：unhappy；两种词表可产生不同 token 数</text><rect x="60" y="560" width="380" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="72" y="590" font-size="23" fill="#173c53">词表 A</text><text x="72" y="619" font-size="18" fill="#173c53">[unhappy]：1 token</text><rect x="650" y="560" width="380" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="662" y="590" font-size="23" fill="#173c53">词表 B</text><text x="662" y="619" font-size="18" fill="#173c53">[un] [happy]：2 tokens</text><text x="80" y="710" font-size="20" fill="#173c53">字符区间 [0,7)</text><text x="650" y="710" font-size="20" fill="#173c53">字符区间 [0,2)、[2,7)</text><text x="110" y="755" font-size="20" fill="#173c53">原文偏移连接字符与 token；评分、截断与标签必须采用一致单位。</text></g></svg>