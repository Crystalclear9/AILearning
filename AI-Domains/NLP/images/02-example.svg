oke="#7895aa" /><ns0:rect x="580.0" y="490.0" width="266.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="850.0" y="490.0" width="266.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:text x="35" y="676.0" font-size="21" fill="#526b7c">原创教学算例；数值、定义与适用条件见图下说明。</ns0:text><ns0:text x="53.0" y="150.0" font-size="23" fill="#143651">前一标签</ns0:text><ns0:text x="323.0" y="150.0" font-size="23" fill="#143651">后一标签 O</ns0:text><ns0:text x="593.0" y="150.0" font-size="23" fill="#143651">后一标签 B-X</ns0:text><ns0:text x="863.0" y="150.0" font-size="23" fill="#143651">后一标签 I-X</ns0:text><ns0:text x="53.0" y="275.0" font-size="23" fill="#143651">序列起点</ns0:text><ns0:text x="323.0" y="275.0" font-size="23" fill="#143651">允许</ns0:text><ns0:text x="593.0" y="275.0" font-size="23" fill="#143651">允许</ns0:text><ns0:text x="863.0" y="275.0" font-size="23" fill="#143651">通常禁止</ns0:text><ns0:text x="53.0" y="400.0" font-size="23" fill="#143651">O</ns0:text><ns0:text x="323.0" y="400.0" font-size="23" fill="#143651">允许</ns0:text><ns0:text x="593.0" y="400.0" font-size="23" fill="#143651">允许</ns0:text><ns0:text x="863.0" y="400.0" font-size="23" fill="#143651">通常禁止</ns0:text><ns0:text x="53.0" y="525.0" font-size="23" fill="#143651">B-X 或 I-X</ns0:text><ns0:text x="323.0" y="525.0" font-size="23" fill="#143651">允许</ns0:text><ns0:text x="593.0" y="525.0" font-size="23" fill="#143651">允许</ns0:text><ns0:text x="863.0" y="525.0" font-size="23" fill="#143651">允许延续</ns0:text></ns0:g></ns0:svg>
