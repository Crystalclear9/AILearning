<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>生成评估先固定参考与判定规则</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">生成评估先固定参考与判定规则</text><rect x="80" y="280" width="290" height="120" rx="7" fill="#d9ebe3" stroke="#80a0b3"/><text x="105" y="325" font-size="28" fill="#143651">同一任务输入</text><text x="105" y="370" font-size="24" fill="#143651">允许多个正确表述</text><rect x="700" y="150" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3"/><text x="760" y="208" font-size="29" fill="#143651">参考表达 A</text><line x1="380" y1="340" x2="690" y2="195" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><rect x="700" y="330" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3"/><text x="760" y="388" font-size="29" fill="#143651">参考表达 B</text><line x1="380" y1="340" x2="690" y2="375" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><rect x="700" y="510" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3"/><text x="760" y="568" font-size="29" fill="#143651">合理改写 C</text><line x1="380" y1="340" x2="690" y2="555" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><text x="110" y="660" font-size="25" fill="#143651">词面相似、语义等价、事实正确需要分别定义测量规则。</text></g></svg>
