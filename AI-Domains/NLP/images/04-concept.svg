<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2033" viewBox="0 0 1200 2033" role="img"><title>生成评估先固定参考与判定规则：机制、算例与边界</title><rect width="1200" height="2033" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">生成评估先固定参考与判定规则</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="602.625" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="722.625" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1272.625" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="522.625" viewBox="0 124 1200 565" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="80" y="280" width="290" height="120" rx="7" fill="#d9ebe3" stroke="#80a0b3" /><text x="105" y="325" font-size="28" fill="#143651">同一任务输入</text><text x="105" y="370" font-size="24" fill="#143651">允许多个正确表述</text><rect x="700" y="150" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3" /><text x="760" y="208" font-size="29" fill="#143651">参考表达 A</text><line x1="380" y1="340" x2="690" y2="195" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="700" y="330" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3" /><text x="760" y="388" font-size="29" fill="#143651">参考表达 B</text><line x1="380" y1="340" x2="690" y2="375" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="700" y="510" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3" /><text x="760" y="568" font-size="29" fill="#143651">合理改写 C</text><line x1="380" y1="340" x2="690" y2="555" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="110" y="660" font-size="25" fill="#143651">词面相似、语义等价、事实正确需要分别定义测量规则。</text></g></svg><text x="48" y="765.625" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  同一数量事实的参考与反例</text><text x="48" y="1315.625" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相似措辞也可能改错关键关系</text><g transform="translate(30,782.625) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">事实：对象数量为 10</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">参考 A：“10个”；参考 B：“十个”</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">合理改写：“共计十个”</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">反例：“不是十个”词面近但语义相反</text></g><g transform="translate(45,1332.625) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">参考集不完整会产生误判；不能把单一自动分数当成所有任务</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">目标的充分证明。</tspan></text><circle cx="835" cy="900" r="12" fill="#15988d" /><circle cx="895" cy="900" r="12" fill="#15988d" /><circle cx="955" cy="900" r="12" fill="#15988d" /><circle cx="1015" cy="900" r="12" fill="#15988d" /><circle cx="1075" cy="900" r="12" fill="#15988d" /><circle cx="1135" cy="900" r="12" fill="#15988d" /><circle cx="1195" cy="900" r="12" fill="#15988d" /><circle cx="1255" cy="900" r="12" fill="#15988d" /><circle cx="1315" cy="900" r="12" fill="#15988d" /><circle cx="1375" cy="900" r="12" fill="#15988d" /><text x="805" y="850" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">实际对象：10个</text><text x="805" y="1000" font-size="27" fill="#138778" font-family="Microsoft YaHei,sans-serif">“10个”——符合事实</text><text x="805" y="1080" font-size="27" fill="#ad6a33" font-family="Microsoft YaHei,sans-serif">“不是10个”——不符合事实</text></g></svg>
