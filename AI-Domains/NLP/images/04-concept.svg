<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>生成评估先固定参考与判定规则：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">生成评估先固定参考与判定规则</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="80" y="280" width="290" height="120" rx="7" fill="#d9ebe3" stroke="#80a0b3" /><ns0:text x="105" y="325" font-size="28" fill="#143651">同一任务输入</ns0:text><ns0:text x="105" y="370" font-size="24" fill="#143651">允许多个正确表述</ns0:text><ns0:rect x="700" y="150" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3" /><ns0:text x="760" y="208" font-size="29" fill="#143651">参考表达 A</ns0:text><ns0:line x1="380" y1="340" x2="690" y2="195" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="700" y="330" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3" /><ns0:text x="760" y="388" font-size="29" fill="#143651">参考表达 B</ns0:text><ns0:line x1="380" y1="340" x2="690" y2="375" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="700" y="510" width="360" height="95" rx="7" fill="#e1eef7" stroke="#80a0b3" /><ns0:text x="760" y="568" font-size="29" fill="#143651">合理改写 C</ns0:text><ns0:line x1="380" y1="340" x2="690" y2="555" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="110" y="660" font-size="25" fill="#143651">词面相似、语义等价、事实正确需要分别定义测量规则。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  同一数量事实的参考与反例</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相似措辞也可能改错关键关系</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">事实：对象数量为 10</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">参考 A：“10个”；参考 B：“十个”</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">合理改写：“共计十个”</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">反例：“不是十个”词面近但语义相反</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">参考集不完整会产生误判；不能把单一自动分数当成所有任务</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">目标的充分证明。</ns0:text><ns0:circle cx="835" cy="900" r="12" fill="#15988d" /><ns0:circle cx="895" cy="900" r="12" fill="#15988d" /><ns0:circle cx="955" cy="900" r="12" fill="#15988d" /><ns0:circle cx="1015" cy="900" r="12" fill="#15988d" /><ns0:circle cx="1075" cy="900" r="12" fill="#15988d" /><ns0:circle cx="1135" cy="900" r="12" fill="#15988d" /><ns0:circle cx="1195" cy="900" r="12" fill="#15988d" /><ns0:circle cx="1255" cy="900" r="12" fill="#15988d" /><ns0:circle cx="1315" cy="900" r="12" fill="#15988d" /><ns0:circle cx="1375" cy="900" r="12" fill="#15988d" /><ns0:text x="805" y="850" font-size="27" fill="#17374e" font-family="Microsoft YaHei,sans-serif">实际对象：10个</ns0:text><ns0:text x="805" y="1000" font-size="27" fill="#138778" font-family="Microsoft YaHei,sans-serif">“10个”——符合事实</ns0:text><ns0:text x="805" y="1080" font-size="27" fill="#ad6a33" font-family="Microsoft YaHei,sans-serif">“不是10个”——不符合事实</ns0:text></ns0:svg>
