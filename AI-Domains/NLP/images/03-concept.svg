<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>实体跨度与 token 标签对齐：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">实体跨度与 token 标签对齐</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="90" y="245" width="220" height="100" rx="7" fill="#e2edf5" stroke="#80a0b3" /><ns0:text x="150" y="307" font-size="31" fill="#143651">在</ns0:text><ns0:rect x="360" y="245" width="220" height="100" rx="7" fill="#d5ebdf" stroke="#80a0b3" /><ns0:text x="420" y="307" font-size="31" fill="#143651">北京</ns0:text><ns0:rect x="630" y="245" width="220" height="100" rx="7" fill="#d5ebdf" stroke="#80a0b3" /><ns0:text x="690" y="307" font-size="31" fill="#143651">大学</ns0:text><ns0:rect x="900" y="245" width="220" height="100" rx="7" fill="#e2edf5" stroke="#80a0b3" /><ns0:text x="960" y="307" font-size="31" fill="#143651">任职</ns0:text><ns0:line x1="350" y1="200" x2="850" y2="200" stroke="#15988d" stroke-width="6" /><ns0:text x="430" y="160" font-size="29" fill="#143651">原文实体：北京大学</ns0:text><ns0:rect x="90" y="450" width="220" height="95" rx="7" fill="#dcebf5" stroke="#80a0b3" /><ns0:text x="135" y="510" font-size="28" fill="#143651">O</ns0:text><ns0:line x1="200" y1="350" x2="200" y2="440" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="360" y="450" width="220" height="95" rx="7" fill="#dcebf5" stroke="#80a0b3" /><ns0:text x="405" y="510" font-size="28" fill="#143651">B-ORG</ns0:text><ns0:line x1="470" y1="350" x2="470" y2="440" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="630" y="450" width="220" height="95" rx="7" fill="#dcebf5" stroke="#80a0b3" /><ns0:text x="675" y="510" font-size="28" fill="#143651">I-ORG</ns0:text><ns0:line x1="740" y1="350" x2="740" y2="440" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="900" y="450" width="220" height="95" rx="7" fill="#dcebf5" stroke="#80a0b3" /><ns0:text x="945" y="510" font-size="28" fill="#143651">O</ns0:text><ns0:line x1="1010" y1="350" x2="1010" y2="440" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="110" y="650" font-size="24" fill="#143651">图采用两 token 实体示意；偏移映射必须回到原文字段后再算跨度。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  实体跨两个 token 的标签链</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  只预测实体起点会漏掉后半段</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">原文实体：北京大学</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分词：[在] [北京] [大学] [任职]</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">标签：O，B-ORG，I-ORG，O</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">映射回原文后评完整跨度</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">本图固定 BIO 约定；特殊 token、截断与子词扩展策略均需与</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">标注和评价一致。</ns0:text><ns0:text x="805" y="842" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">完整跨度</ns0:text><ns0:rect x="820" y="860" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="830" y="902" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</ns0:text><ns0:rect x="975" y="860" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="985" y="902" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B-ORG</ns0:text><ns0:rect x="1130" y="860" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1140" y="902" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-ORG</ns0:text><ns0:rect x="1285" y="860" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1295" y="902" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</ns0:text><ns0:text x="805" y="957" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">截短跨度</ns0:text><ns0:rect x="820" y="975" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="830" y="1017" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</ns0:text><ns0:rect x="975" y="975" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="985" y="1017" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B-ORG</ns0:text><ns0:rect x="1130" y="975" width="145" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="1140" y="1017" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</ns0:text><ns0:rect x="1285" y="975" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1295" y="1017" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</ns0:text><ns0:text x="805" y="1110" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">真值：北京大学；截短预测仅有“北京”</ns0:text></ns0:svg>
