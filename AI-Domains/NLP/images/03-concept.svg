" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">标签：O，B-ORG，I-ORG，O</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">映射回原文后评完整跨度</text></g><g transform="translate(45,1336.325) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">本图固定 BIO 约定；特殊 token、截断与子词扩展策略均需与</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">标注和评价一致。</tspan></text><text x="805" y="842" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">完整跨度</text><rect x="820" y="860" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="830" y="902" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</text><rect x="975" y="860" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="985" y="902" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B-ORG</text><rect x="1130" y="860" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="1140" y="902" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">I-ORG</text><rect x="1285" y="860" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="1295" y="902" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</text><text x="805" y="957" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">截短跨度</text><rect x="820" y="975" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="830" y="1017" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</text><rect x="975" y="975" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="985" y="1017" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">B-ORG</text><rect x="1130" y="975" width="145" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><text x="1140" y="1017" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</text><rect x="1285" y="975" width="145" height="65" fill="#c6e4d6" stroke="#8caab9" stroke-width="1" /><text x="1295" y="1017" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">O</text><text x="805" y="1110" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">真值：北京大学；截短预测仅有“北京”</text></g></svg>
