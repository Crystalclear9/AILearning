<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>实体跨度与 token 标签对齐</title>
<desc>原创教学示意：原文跨度|实体由字符起止位置定义;token 偏移|每个 token 对应原文区间;标签转换|决定首子词或全部子词策略;还原实体|按原始坐标评价跨度</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">实体跨度与 token 标签对齐</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">原文跨度</text>
<text x="53" y="160" font-size="21" fill="#16324f">实体由字符起止位置定义</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">token 偏移</text>
<text x="603" y="160" font-size="21" fill="#16324f">每个 token 对应原文区间</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">标签转换</text>
<text x="53" y="330" font-size="21" fill="#16324f">决定首子词或全部子词策略</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">还原实体</text>
<text x="603" y="330" font-size="21" fill="#16324f">按原始坐标评价跨度</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="500" font-size="20" fill="#173c53">例：原文 unhappy，整个词是一个实体</text><rect x="70" y="550" width="280" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="82" y="580" font-size="23" fill="#173c53">原文实体</text><text x="82" y="609" font-size="18" fill="#173c53">字符跨度 [0,7)</text><path d="M365,590 L470,590" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="485" y="550" width="250" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="497" y="580" font-size="23" fill="#173c53">子词 un</text><text x="497" y="609" font-size="18" fill="#173c53">偏移 [0,2)，B-ENT</text><rect x="770" y="550" width="280" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="782" y="580" font-size="23" fill="#173c53">子词 happy</text><text x="782" y="609" font-size="18" fill="#173c53">偏移 [2,7)，I-ENT</text><path d="M880,640 L550,700" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="120" y="745" font-size="20" fill="#173c53">合并连续实体标签，并用偏移还原原文跨度 [0,7)；最终按完整跨度评价。</text></g></svg>