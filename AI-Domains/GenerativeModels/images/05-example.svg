<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img"><title>相同均值方差不等于相同生成分布</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f"/></marker></defs><rect width="1160" height="610" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="45" font-size="28" fill="#18364e">相同均值方差不等于相同生成分布</text><rect x="40.0" y="100" width="266.0" height="82" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="52.0" y="129" font-size="20" fill="#18364e">分布</text><rect x="310.0" y="100" width="266.0" height="82" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="322.0" y="129" font-size="20" fill="#18364e">可能取值</text><rect x="580.0" y="100" width="266.0" height="82" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="592.0" y="129" font-size="20" fill="#18364e">概率</text><rect x="850.0" y="100" width="266.0" height="82" rx="6" fill="#cce2f2" stroke="#7895aa"/><text x="862.0" y="129" font-size="20" fill="#18364e">均值与方差</text><rect x="40.0" y="185" width="266.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="214" font-size="20" fill="#18364e">A</text><rect x="310.0" y="185" width="266.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="322.0" y="214" font-size="20" fill="#18364e">−1、＋1</text><rect x="580.0" y="185" width="266.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="592.0" y="214" font-size="20" fill="#18364e">各二分之一</text><rect x="850.0" y="185" width="266.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="862.0" y="214" font-size="20" fill="#18364e">0，1</text><rect x="40.0" y="270" width="266.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="52.0" y="299" font-size="20" fill="#18364e">B</text><rect x="310.0" y="270" width="266.0" height="82" rx="6" fill="#edf5fa" stroke="#7895aa"/><text x="322.0" y="299" font-size="20" fill="#18364e">−√2、0