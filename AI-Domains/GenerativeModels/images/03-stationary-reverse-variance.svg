<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="836" viewBox="0 0 960 836" role="img" aria-labelledby="artwork-title"><title id="artwork-title">精确均值下不同逆向方差造成的生成方差轨迹</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="738.654583"/></clipPath></defs><rect width="960" height="836" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">精确均值下不同逆向方差造成的生成方差轨迹</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>逆向均值完全正确，方差选择仍会改变生成分布</title><svg width="1440" height="718.855" viewBox="29 79 1258 628" role="img"><rect x="29" y="79" width="1258" height="628" fill="#ffffff"/><title>逆向均值完全正确，方差选择仍会改变生成分布</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="120" font-size="27" fill="#1a2b3d" text-anchor="start">标准正态平稳数据；20 步；每步 β = 0.1；从正确的 N(0,1) 开始</text><line x1="110.0" y1="570" x2="110.0" y2="230" stroke="#d9e1e8" stroke-width="2"/><text x="110.0" y="608" font-size="25" fill="#47586b" text-anchor="middle">0</text><line x1="375.0" y1="570" x2="375.0" y2="230" stroke="#d9e1e8" stroke-width="2"/><text x="375.0" y="608" font-size="25" fill="#47586b" text-anchor="middle">5</text><line x1="640.0" y1="570" x2="640.0" y2="230" stroke="#d9e1e8" stroke-width="2"/><text x="640.0" y="608" font-size="25" fill="#47586b" text-anchor="middle">10</text><line x1="905.0" y1="570" x2="905.0" y2="230" stroke="#d9e1e8" stroke-width="2"/><text x="905.0" y="608" font-size="25" fill="#47586b" text-anchor="middle">15</text><line x1="1170.0" y1="570" x2="1170.0" y2="230" stroke="#d9e1e8" stroke-width="2"/><text x="1170.0" y="608" font-size="25" fill="#47586b" text-anchor="middle">20</text><line x1="110" y1="539.0909090909091" x2="1170" y2="539.0909090909091" stroke="#d9e1e8" stroke-width="2"/><text x="95" y="546.0909090909091" font-size="25" fill="#47586b" text-anchor="end">0.75</text><line x1="110" y1="487.5757575757575" x2="1170" y2="487.5757575757575" stroke="#d9e1e8" stroke-width="2"/><text x="95" y="494.5757575757575" font-size="25" fill="#47586b" text-anchor="end">0.8</text><line x1="110" y1="384.5454545454545" x2="1170" y2="384.5454545454545" stroke="#d9e1e8" stroke-width="2"/><text x="95" y="391.5454545454545" font-size="25" fill="#47586b" text-anchor="end">0.9</text><line x1="110" y1="281.51515151515156" x2="1170" y2="281.51515151515156" stroke="#d9e1e8" stroke-width="2"/><text x="95" y="288.51515151515156" font-size="25" fill="#47586b" text-anchor="end">1</text><line fill="none" stroke="#1a6281" stroke-width="4" x1="110" y1="281.52" x2="1170" y2="281.52"/><polyline fill="none" stroke="#b46133" stroke-width="4" points="110,281.52 163,283.1 216,284.73 269,286.43 322,288.23 375,290.16 428,292.27 481,294.59 534,297.18 587,300.12 640,303.49 693,307.43 746,312.07 799,317.67 852,324.55 905,333.23 958,344.57 1011,360.1 1064,383.04 1117,421.69 1170,510.7"/><circle cx="110.0" cy="281.51515151515156" r="5" fill="#b46133"/><circle cx="163.0" cy="283.0995659384269" r="5" fill="#b46133"/><circle cx="216.0" cy="284.72908040263303" r="5" fill="#b46133"/><circle cx="269.0" cy="286.42938917099644" r="5" fill="#b46133"/><circle cx="322.0" cy="288.22926130097943" r="5" fill="#b46133"/><circle cx="375.0" cy="290.16164046582327" r="5" fill="#b46133"/><circle cx="428.0" cy="292.26510205819227" r="5" fill="#b46133"/><circle cx="481.0" cy="294.585832037785" r="5" fill="#b46133"/><circle cx="534.0" cy="297.1803833528527" r="5" fill="#b46133"/><circle cx="587.0" cy="300.11961987534403" r="5" fill="#b46133"/><circle cx="640.0" cy="303.4945271760885" r="5" fill="#b46133"/><circle cx="693.0" cy="307.4250602210317" r="5" fill="#b46133"/><circle cx="746.0" cy="312.0741363612563" r="5" fill="#b46133"/><circle cx="799.0" cy="317.67078175308444" r="5" fill="#b46133"/><circle cx="852.0" cy="324.5505612474259" r="5" fill="#b46133"/><circle cx="905.0" cy="333.23116178815155" r="5" fill="#b46133"/><circle cx="958.0" cy="344.56665016481776" r="5" fill="#b46133"/><circle cx="1011.0" cy="360.1018873045301" r="5" fill="#b46133"/><circle cx="1064.0" cy="383.0382489486717" r="5" fill="#b46133"/><circle cx="1117.0" cy="421.6897669565158" r="5" fill="#b46133"/><circle cx="1170.0" cy="510.7026084426824" r="5" fill="#b46133"/><text x="600" y="185" font-size="28" fill="#1a2b3d" text-anchor="start">蓝：真实逆向方差 β；橙：已知干净值的条件后验方差</text><text x="930" y="445" font-size="28" fill="#a85f39" text-anchor="start">最终方差 0.777553</text><text x="1180" y="640" font-size="26" fill="#1a2b3d" text-anchor="end">逆向更新次数</text><text x="60" y="685" font-size="28" fill="#1a2b3d" text-anchor="start">两条链都使用解析最优均值；差异来自条件对象和方差，而非训练不足</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 718.855) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#1d3145" text-anchor="start">只用精确条件均值反复去噪，也会把分布压窄</text><text x="65" y="170" font-size="36.12px" fill="#1e7499" text-anchor="start">加精确逆过程噪声</text><rect x="480" y="140" width="700" height="46" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="1200" y="173" font-size="34.83px" fill="#1e7499" text-anchor="start">方差 1.000000</text><text x="65" y="255" font-size="36.12px" fill="#af6033" text-anchor="start">加条件 x0 后验噪声</text><rect x="480" y="225" width="544.2873450000001" height="46" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="1200" y="258" font-size="34.83px" fill="#af6033" text-anchor="start">方差 0.777553</text><text x="65" y="340" font-size="36.12px" fill="#47586b" text-anchor="start">完全不加逆过程噪声</text><rect x="480" y="310" width="85.10365821339855" height="46" fill="url(#book-wash-edf5f8)" stroke="#818fa4"/><text x="1200" y="343" font-size="34.83px" fill="#47586b" text-anchor="start">方差 0.121577</text><text x="65" y="435" font-size="37.41px" fill="#1d3145" text-anchor="start">固定同一精确均值，20 步，α=0.9；无噪声时方差是 0.9^20。</text></g></g></g></g></g></svg>