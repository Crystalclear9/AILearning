<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2074" viewBox="0 0 1200 2074" role="img"><title>生成评估的质量与覆盖两条轴：机制、算例与边界</title><rect width="1200" height="2074" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">生成评估的质量与覆盖两条轴</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="644.25" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="764.25" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1314.25" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="564.25" viewBox="0 100 1200 610" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="150" y1="600" x2="1080" y2="600" stroke="#417f9c" stroke-width="3" /><line x1="150" y1="600" x2="150" y2="140" stroke="#417f9c" stroke-width="3" /><text x="870" y="650" font-size="25" fill="#143651">覆盖程度</text><text x="165" y="130" font-size="25" fill="#143651">单样本质量</text><circle cx="350" cy="230" r="18" fill="#ed9a46" stroke="#1d5871" /><text x="250" y="285" font-size="24" fill="#143651">逼真但遗漏模式</text><circle cx="880" cy="240" r="18" fill="#15988d" stroke="#1d5871" /><text x="780" y="295" font-size="24" fill="#143651">高质量且广覆盖</text><circle cx="870" cy="490" r="18" fill="#4b87ba" stroke="#1d5871" /><text x="770" y="545" font-size="24" fill="#143651">覆盖广但质量差</text><text x="180" y="705" font-size="24" fill="#143651">质量、覆盖、条件一致性与记忆检查需要不同证据。</text></g></svg><text x="48" y="807.25" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  模式频率与样本外观分别核对</text><text x="48" y="1357.25" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  逼真度高仍可遗漏整个模式</text><g transform="translate(30,824.25) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">真实模式质量：A=0.5，B=0.5</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">生成分布：A=1，B=0</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A 内样本即使全部逼真</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B 的生成质量仍为零</text></g><g transform="translate(45,1374.25) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">1</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">模式 A 质量</text><rect x="1220" y="1048.0" width="120" height="1" fill="#e3a461" /><text x="1215" y="1033.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">模式 B 质量</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">图中的模式为人工分组；真实高维数据要明确特征与分组定义</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">，不能凭少量展示样本认定覆盖充分。</tspan></text></g></svg>
