<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>生成评估的质量与覆盖两条轴</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">生成评估的质量与覆盖两条轴</text><line x1="150" y1="600" x2="1080" y2="600" stroke="#417f9c" stroke-width="3"/><line x1="150" y1="600" x2="150" y2="140" stroke="#417f9c" stroke-width="3"/><text x="870" y="650" font-size="25" fill="#143651">覆盖程度</text><text x="165" y="130" font-size="25" fill="#143651">单样本质量</text><circle cx="350" cy="230" r="18" fill="#ed9a46" stroke="#1d5871"/><text x="250" y="285" font-size="24" fill="#143651">逼真但遗漏模式</text><circle cx="880" cy="240" r="18" fill="#15988d" stroke="#1d5871"/><text x="780" y="295" font-size="24" fill="#143651">高质量且广覆盖</text><circle cx="870" cy="490" r="18" fill="#4b87ba" stroke="#1d5871"/><text x="770" y="545" font-size="24" fill="#143651">覆盖广但质量差</text><text x="180" y="705" font-size="24" fill="#143651">质量、覆盖、条件一致性与记忆检查需要不同证据。</text></g></svg>
