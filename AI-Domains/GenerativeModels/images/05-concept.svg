<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>生成评估的质量与覆盖两条轴</title>
<desc>原创教学示意：样本质量|单个输出是否可信;分布覆盖|是否遗漏重要模式;条件一致性|是否遵循给定要求;重复与泄漏|是否复现训练样本</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">生成评估的质量与覆盖两条轴</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">样本质量</text>
<text x="53" y="160" font-size="21" fill="#16324f">单个输出是否可信</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">分布覆盖</text>
<text x="603" y="160" font-size="21" fill="#16324f">是否遗漏重要模式</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">条件一致性</text>
<text x="53" y="330" font-size="21" fill="#16324f">是否遵循给定要求</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">重复与泄漏</text>
<text x="603" y="330" font-size="21" fill="#16324f">是否复现训练样本</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="500" font-size="20" fill="#173c53">同样逼真的点，覆盖模式的数量仍可能不同</text><rect x="90" y="540" width="450" height="170" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="125" y="745" font-size="24" fill="#173c53">仅覆盖一个模式</text><circle cx="175" cy="620" r="48" fill="none" stroke="#97afbf" stroke-dasharray="5 4"/><circle cx="195.0" cy="620.0" r="6" fill="#287ba8"/><circle cx="185.8060461173628" cy="638.5123616657737" r="6" fill="#287ba8"/><circle cx="166.67706326905716" cy="640.004543390165" r="6" fill="#287ba8"/><circle cx="155.2001500679911" cy="623.104640177317" r="6" fill="#287ba8"/><circle cx="161.92712758272776" cy="603.3503451032255" r="6" fill="#287ba8"/><circle cx="180.6732437092645" cy="598.9036659574109" r="6" fill="#287ba8"/><circle cx="194.20340573300732" cy="613.8528590396236" r="6" fill="#287ba8"/><circle cx="190.0780450868661" cy="634.4537051718133" r="6" fill="#287ba8"/><circle cx="315" cy="620" r="48" fill="none" stroke="#97afbf" stroke-dasharray="5 4"/><circle cx="455" cy="620" r="48" fill="none" stroke="#97afbf" stroke-dasharray="5 4"/><rect x="630" y="540" width="450" height="170" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="665" y="745" font-size="24" fill="#173c53">覆盖三个模式</text><circle cx="715" cy="620" r="48" fill="none" stroke="#97afbf" stroke-dasharray="5 4"/><circle cx="735.0" cy="620.0" r="6" fill="#287ba8"/><circle cx="725.8060461173628" cy="638.5123616657737" r="6" fill="#287ba8"/><circle cx="706.6770632690572" cy="640.004543390165" r="6" fill="#287ba8"/><circle cx="695.2001500679911" cy="623.104640177317" r="6" fill="#287ba8"/><circle cx="701.9271275827277" cy="603.3503451032255" r="6" fill="#287ba8"/><circle cx="720.6732437092645" cy="598.9036659574109" r="6" fill="#287ba8"/><circle cx="734.2034057330073" cy="613.85285903962