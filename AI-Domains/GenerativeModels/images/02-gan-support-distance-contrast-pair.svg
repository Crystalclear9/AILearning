<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" role="img" aria-labelledby="title description" viewBox="0 0 1200 1157.81751825"><title id="title">分离支撑集上的 JS 与搬运距离</title><desc id="description">(a) 分离的支持让判别结果饱和，距离却不告诉你往哪移。(b) 点质量接近时JS平台与Wasserstein距离的对照。</desc><rect width="1200" fill="#fff" height="1157.81751825"/><text x="60" y="35" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="600" fill="#196f77">(a)</text><view id="a" viewBox="0 51 1200 544.817518248"/><view id="a-textbook-detail-1-1" viewBox="0 51 684 310.545985401"/><view id="a-textbook-detail-1-2" viewBox="516 51 684 310.545985401"/><view id="a-textbook-detail-2-1" viewBox="0 285.271532847 684 310.545985401"/><view id="a-textbook-detail-2-2" viewBox="516 285.271532847 684 310.545985401"/><svg width="1200" height="544.817518248" viewBox="0 0 1370 622" role="img" aria-labelledby="a-label a-detail" id="panel-a" x="0" y="51">
<title id="a-label">分离的支持让判别结果饱和，距离却不告诉你往哪移</title><desc id="a-detail">真实支持与生成支持分离，最优判别器在两支持上的值分别为 1 和 0。平移后仍分离时 JS 为 ln 2。</desc><defs><marker id="a-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="a-wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="a-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="a-wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="a-arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="a-wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="a-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="a-wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="a-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="a-wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="a-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="a-wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1370" height="622" fill="white" stroke="none" stroke-width="1.6"/><line x1="116" y1="238" x2="1225" y2="238" stroke="#202a37" stroke-width="1.85" stroke-linecap="round" marker-end="url(#a-arrow-ink)"/><polygon points="195,238 316,155 437,238" stroke="#196f77" fill="url(#a-wash-teal)" stroke-width="1.65" stroke-linejoin="round"/><polygon points="760,238 881,155 1002,238" stroke="#a84b3b" fill="url(#a-wash-coral)" stroke-width="1.65" stroke-linejoin="round"/><text x="317" y="127" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400">真实分布</text><text x="880" y="127" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400">生成分布</text><text x="317" y="289" fill="#196f77" font-size="27" text-anchor="middle" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-weight="400">D* = 1</text><text x="881" y="289" fill="#a84b3b" font-size="27" text-anchor="middle" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-weight="400">D* = 0</text><line x1="116" y1="495" x2="1225" y2="495" stroke="#202a37" stroke-width="1.85" stroke-linecap="round" marker-end="url(#a-arrow-ink)"/><polygon points="195,495 316,412 437,495" stroke="#196f77" fill="url(#a-wash-teal)" stroke-width="1.65" stroke-linejoin="r