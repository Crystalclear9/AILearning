<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2052" viewBox="0 0 1200 2052" role="img"><title>自回归分解与可逆流的区别：机制、算例与边界</title><rect width="1200" height="2052" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">自回归分解与可逆流的区别</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="622.0500000000001" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="742.0500000000001" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1292.0500000000002" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="542.0500000000001" viewBox="0 124 1200 586" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="65" y="150" width="240" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="80" y="185" font-size="25" fill="#143651">条件步骤 1</text><text x="80" y="228" font-size="22" fill="#143651">前缀 → 下一个值</text><line x1="305" y1="200" x2="345" y2="200" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="355" y="150" width="240" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="370" y="185" font-size="25" fill="#143651">条件步骤 2</text><text x="370" y="228" font-size="22" fill="#143651">前缀 → 下一个值</text><line x1="595" y1="200" x2="635" y2="200" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="645" y="150" width="240" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="660" y="185" font-size="25" fill="#143651">条件步骤 3</text><text x="660" y="228" font-size="22" fill="#143651">前缀 → 下一个值</text><line x1="885" y1="200" x2="925" y2="200" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="935" y="150" width="240" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="950" y="185" font-size="25" fill="#143651">条件步骤 4</text><text x="950" y="228" font-size="22" fill="#143651">前缀 → 下一个值</text><rect x="90" y="420" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="145" y="420" width="52" height="52" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="200" y="420" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="90" y="475" width="52" height="52" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="145" y="475" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="200" y="475" width="52" height="52" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="90" y="530" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="145" y="530" width="52" height="52" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="200" y="530" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="830" y="420" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="885" y="420" width="52" height="52" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="940" y="420" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="830" y="475" width="52" height="52" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="885" y="475" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="940" y="475" width="52" height="52" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="830" y="530" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="885" y="530" width="52" height="52" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="940" y="530" width="52" height="52" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><line x1="290" y1="480" x2="800" y2="480" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><line x1="800" y1="545" x2="290" y2="545" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="420" y="445" font-size="27" fill="#143651">可逆映射＋体积修正</text><text x="430" y="595" font-size="24" fill="#143651">前向与逆向都可计算</text><text x="150" y="690" font-size="25" fill="#143651">上：自回归条件分解；下：归一化流的可逆变量变换。</text></g></svg><text x="48" y="785.0500000000001" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  自回归概率与流密度各有账本</text><text x="48" y="1335.0500000000002" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  连续密度高度不是点事件概率</text><g transform="translate(30,802.0500000000001) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两步离散路径：0.6×0.5＝0.30</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">总对数概率：两步对数概率相加</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">连续缩放 y=2x：体积扩大 2 倍</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">换元密度因此缩小至原来一半</text></g><g transform="translate(45,1352.0500000000002) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">联合条件分解与可逆换元都能建模分布，但概率单位和计算约</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">束不同。</tspan></text><text x="805" y="830" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">离散：P(X=1)=0.5</text><line x1="850" y1="925" x2="1400" y2="925" stroke="#44859a" stroke-width="2" /><line x1="950" y1="925" x2="950" y2="855" stroke="#15988d" stroke-width="5" /><circle cx="950" cy="855" r="10" fill="#15988d" /><text x="940" y="965" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0</text><line x1="1300" y1="925" x2="1300" y2="855" stroke="#15988d" stroke-width="5" /><circle cx="1300" cy="855" r="10" fill="#15988d" /><text x="1290" y="965" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</text><text x="805" y="1010" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">连续均匀[0,2]：P(Y=1)=0</text><rect x="855" y="1040" width="540" height="50" fill="#d8eaf3" stroke="#8caab9" stroke-width="1" /><line x1="1125" y1="1020" x2="1125" y2="1105" stroke="#e2a15f" stroke-width="3" /><text x="1080" y="1118" font-size="21" fill="#17374e" font-family="Microsoft YaHei,sans-serif">单点 1：面积为零</text><text x="850" y="1120" font-size="21" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0</text><text x="1380" y="1120" font-size="21" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text></g></svg>
