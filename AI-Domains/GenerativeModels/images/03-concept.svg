" y1="1020" x2="1385.0" y2="1020" stroke="#c9dce6" stroke-width="2" /><circle cx="1025.0" cy="1020" r="8" fill="#699caf" /><circle cx="1025.0" cy="1020" r="12" fill="#e2a15f" /><text x="805" y="990" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">αbar=0.36：xt=2，距离=0</text><text x="829.0" y="1090" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1.8</text><text x="1009.0" y="1090" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text><text x="1189.0000000000002" y="1090" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2.2</text><text x="1369.0" y="1090" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2.4</text></g></svg>
