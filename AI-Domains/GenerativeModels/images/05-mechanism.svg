<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="675.48" viewBox="-18.24 28.76 996.48 675.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">筛选账本：保留比例与总接受率必须同时计算</title><desc id="artwork-desc">实验四以各半的两个模式提议，A全接收B接收十分之一。按100提议的期望流量为50A,50B，保留50A,5B并拒绝45B，总接受率0.55，模式10/11与1/11，每成功60/11调用。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="588.942308"/></clipPath><linearGradient id="edition-wash-1" x1="0%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#f4f6f8"/><stop offset="100%" stop-color="#ebf0f3"/></linearGradient></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="675.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="639" viewBox="0 47 960 639" overflow="hidden"><rect width="960" height="686" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(8.846154 33.596154) scale(0.673077)"><g><rect x="24" y="63" width="1352" height="875" fill="#ffffff"/><title>筛选前后概率流与全成本</title><desc>实验四以各半的两个模式提议，A全接收B接收十分之一。按100提议的期望流量为50A,50B，保留50A,5B并拒绝45B，总接受率0.55，模式10/11与1/11，每成功60/11调用。</desc><rect width="1400" height="930" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="104" font-size="34.83px" fill="#4f7891" text-anchor="start" font-weight="400">实验四：原模式各半；A 接受率 1，B 接受率 0.1</text><text x="80" y="171" font-size="36.12px" fill="#253d4f" text-anchor="start" font-weight="600">100 次提议的期望流量</text><text x="880" y="171" font-size="36.12px" fill="#253d4f" text-anchor="start" font-weight="600" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">保留与拒绝分开计数</text><rect x="80" y="230" width="170" height="200" rx="6" fill="#2a78a8" stroke="none"/><text x="165" y="340" font-size="38.7px" fill="#ffffff" text-anchor="middle" font-weight="600">A：50</text><rect x="80" y="475" width="170" height="200" rx="6" fill="#b46436" stroke="none"/><text x="165" y="585" font-size="38.7px" fill="#ffffff" text-anchor="middle" font-weight="600">B：50</text><path d="M250 230 C510 230 630 230 880 230 L880 430 C630 430 510 430 250 430 Z" fill="#2a78a8" opacity=".16"/><path d="M250 475 C510 475 630 475 880 475 L880 495 C630 495 510 495 250 495 Z" fill="#b46436" opacity=".28"/><path d="M250 495 C510 495 630 535 880 535 L880 715 C630 715 510 675 250 675 Z" fill="#e6ecf1"/><rect x="880" y="230" width="170" height="200" rx="6" fill="#2a78a8" stroke="none"/><text x="965" y="340" font-size="37.41px" fill="#ffffff" text-anchor="middle" font-weight="600">保留 50</text><rect x="880" y="475" width="170" height="20" rx="0" fill="#b46436" stroke="none"/><text x="1075" y="495" font-size="34.83px" fill="#a55c31" text-anchor="start" font-weight="400">保留 B：5</text><rect x="880" y="535" width="170" height="180" rx="6" fill="url(#edition-wash-1)" stroke="none"/><text x="965" y="633" font-size="36.12px" fill="#4f7891" text-anchor="middle" font-weight="600">拒绝 45</text><text x="1100" y="285" font-size="33.54px" fill="#2a78a8" text-anchor="start" font-weight="400">保留集中 A</text><text x="1200" y="335" font-size="32.13px" fill="#2a78a8" text-anchor="middle" font-weight="400">10</text><line x1="1164" y1="345" x2="1236" y2="345" stroke="#1e719b" stroke-width="2.46"/><text x="1200" y="379" font-size="32.13px" fill="#2a78a8" text-anchor="middle" font-weight="400">11</text><text x="1100" y="580" font-size="33.54px" fill="#217179" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">总接受率</text><text x="1100" y="624" font-size="37.41px" fill="#217179" text-anchor="start" font-weight="600">Z = 0.55</text><line x1="42" y1="765" x2="1358" y2="765" stroke="#dde5eb" stroke-width="2"/><text x="60" y="820" font-size="37.41px" fill="#253d4f" text-anchor="start" font-weight="400">100 次提议 × 3 次单位调用 = 300 次</text><text x="60" y="870" font-size="36.12px" fill="#217179" text-anchor="start" font-weight="600">期望保留 55；长期平均每成功样本约 5.454545 次调用</text><text x="42" y="916" font-size="32.25px" fill="#4f7891" text-anchor="start" font-weight="400">带宽按期望计数绘制；有限次随机接受不保证恰好保留 55 个。</text></g></g></g></g></svg></svg>