<svg xmlns="http://www.w3.org/2000/svg" width="1494.72" height="1430.43" viewBox="-27.36 -27.36 1494.72 1430.43" role="img" aria-labelledby="plate-title"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="plate-title">两个离散编码器的条件分布、聚合后验和完全不同的KL分解</title><rect id="edition-paper" x="-27.36" y="-27.36" width="1494.72" height="1430.43" fill="#ffffff"/><svg id="edition-view" x="0" y="0" width="1440" height="1375.71" viewBox="0 0 1440 1375.71" overflow="hidden"><svg width="1440" height="925.714" viewBox="0 0 1400 900" role="img"><title>相同的平均 KL，可能对应完全不同的输入信息</title><rect width="1400" height="900" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="64" font-size="36" fill="#273240" text-anchor="start" font-weight="normal">相同的平均 KL，可能对应完全不同的输入信息</text><text x="60" y="112" font-size="27" fill="#5b747e" text-anchor="start" font-weight="normal">X 的两种取值等概率；Z 为二元变量，先验 p(Z=1)=0.5</text><text x="65" y="175" font-size="30" fill="#273240" text-anchor="start" font-weight="normal">A：潜变量能区分输入</text><text x="480" y="175" font-size="25" fill="#273240" text-anchor="start" font-weight="normal">Z=0</text><text x="605" y="175" font-size="25" fill="#273240" text-anchor="start" font-weight="normal">Z=1</text><text x="365" y="237" font-size="27" fill="#273240" text-anchor="start" font-weight="normal">X=0</text><rect x="460" y="199" width="112" height="53" fill="#2a708b" stroke="none"/><text x="516" y="235" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="normal">0.9</text><rect x="585" y="199" width="112" height="53" fill="#ebf2f5" stroke="none"/><text x="641" y="235" font-size="29" fill="#273240" text-anchor="middle" font-weight="normal">0.1</text><text x="365" y="301" font-size="27" fill="#273240" text-anchor="start" font-weight="normal">X=1</text><rect x="460" y="263" width="112" height="53" fill="#ebf2f5" stroke="none"/><text x="516" y="299" font-size="29" fill="#273240" text-anchor="middle" font-weight="normal">0.1</text><rect x="585" y="263" width="112" height="53" fill="#2a708b" stroke="none"/><text x="641" y="299" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="normal">0.9</text><text x="815" y="175" font-size="28" fill="#273240" text-anchor="start" font-weight="normal">聚合后验 q(Z=1)</text><rect x="815" y="220" width="200.0" height="55" fill="#ebf2f5" stroke="none"/><rect x="1015.0" y="220" width="200.0" height="55" fill="#2a708b" stroke="none"/><text x="815" y="317" font-size="29" fill="#273240" text-anchor="start" font-weight="normal">0.5 = 先验</text><text x="65" y="425" font-size="30" fill="#273240" text-anchor="start" font-weight="normal">B：潜变量与输入独立</text><text x="480" y="425" font-size="25" fill="#273240" text-anchor="start" font-weight="normal">Z=0</text><text x="605" y="425" font-size="25" fill="#273240" text-anchor="start" font-weight="normal">Z=1</text><text x="365" y="487" font-size="27" fill="#273240" text-anchor="start" font-weight="normal">X=0</text><rect x="460" y="449" width="112" height="53" fill="#ebf2f5" stroke="none"/><text x="516" y="485" font-size="29" fill="#273240" text-anchor="middle" font-weight="normal">0.1</text><rect x="585" y="449" width="112" height="53" fill="#2a708b" stroke="none"/><text x="641" y="485" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="normal">0.9</text><text x="365" y="551" font-size="27" fill="#273240" text-anchor="start" font-weight="normal">X=1</text><rect x="460" y="513" width="112" height="53" fill="#ebf2f5" stroke="none"/><text x="516" y="549" font-size="29" fill="#273240" text-anchor="middle" font-weight="normal">0.1</text><rect x="585" y="513" width="112" height="53" fill="#2a708b" stroke="none"/><text x="641" y="549" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="normal">0.9</text><text x="815" y="425" font-size="28" fill="#273240" text-anchor="start" font-weight="normal">聚合后验 q(Z=1)</text><rect x="815" y="470" width="39.99999999999999" height="55" fill="#ebf2f5" stroke="none"/><rect x="855.0" y="470" width="360.0" height="55" fill="#2a708b" stroke="none"/><text x="815" y="567" font-size="29" fill="#273240" text-anchor="start" font-weight="normal">0.9 ≠ 先验</text><line x1="60" y1="648" x2="1340" y2="648" stroke="#e3e8ee" stroke-width="2"/><text x="60" y="700" font-size="29" fill="#273240" text-anchor="start" font-weight="normal">KL 分解（nat）</text><text x="80" y="764" font-size="28" fill="#273240" text-anchor="start" font-weight="normal">A</text><rect x="145" y="727" width="520" height="46" fill="#2a708b" stroke="none"/><text x="710" y="760" font-size="28" fill="#273240" text-anchor="start" font-weight="normal">互信息 0.368064；聚合 KL = 0</text><text x="80" y="832" font-size="28" fill="#273240" text-anchor="start" font-weight="normal">B</text><rect x="145" y="795" width="520" height="46" fill="#b26945" stroke="none"/><text x="710" y="828" font-size="28" fill="#273240" text-anchor="start" font-weight="normal">互信息 0；聚合 KL = 0.368064</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 925.714) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#e0e7ed" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#213747" text-anchor="start">同样的平均 KL，剩余类别不确定性却不同</text><text x="70" y="125" font-size="31" fill="#213747" text-anchor="start">二元 X 等概率：H(X) = log 2 = 0.6931 nat</text><text x="70" y="204" font-size="28" fill="#213747" text-anchor="start">编码器 A：H(X|Z)</text><rect x="320" y="170" width="217.80559217799998" height="44" fill="url(#book-wash-edf5f8)" stroke="#277290"/><text x="552.805592178" y="204" font-size="28" fill="#213747" text-anchor="start">0.325083</text><text x="70" y="274" font-size="28" fill="#213747" text-anchor="start">编码器 B：H(X|Z)</text><rect x="320" y="240" width="464.40861100200004" height="44" fill="url(#book-wash-fff1e7)" stroke="#ba6b41"/><text x="799.408611002" y="274" font-size="28" fill="#213747" text-anchor="start">0.693147</text><text x="70" y="355" font-size="30" fill="#277290" text-anchor="start">A：I(X;Z)=0.3681；最优判别正确率 0.9</text><text x="70" y="420" font-size="30" fill="#a45e39" text-anchor="start">B：I(X;Z)=0；最优判别正确率 0.5</text></g></g></svg></svg>
