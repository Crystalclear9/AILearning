<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>相同的平均 KL，可能对应完全不同的输入信息</title><rect width="1400" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="64" font-size="36" fill="#19333c" text-anchor="start" font-weight="normal">相同的平均 KL，可能对应完全不同的输入信息</text><text x="60" y="112" font-size="27" fill="#71858d" text-anchor="start" font-weight="normal">X 的两种取值等概率；Z 为二元变量，先验 p(Z=1)=0.5</text><text x="65" y="175" font-size="30" fill="#19333c" text-anchor="start" font-weight="normal">A：潜变量能区分输入</text><text x="480" y="175" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">Z=0</text><text x="605" y="175" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">Z=1</text><text x="365" y="237" font-size="27" fill="#19333c" text-anchor="start" font-weight="normal">X=0</text><rect x="460" y="199" width="112" height="53" fill="#256b82" stroke="none"/><text x="516" y="235" font-size="29" fill="white" text-anchor="middle" font-weight="normal">0.9</text><rect x="585" y="199" width="112" height="53" fill="#e8f0f4" stroke="none"/><text x="641" y="235" font-size="29" fill="#19333c" text-anchor="middle" font-weight="normal">0.1</text><text x="365" y="301" font-size="27" fill="#19333c" text-anchor="start" font-weight="normal">X=1</text><rect x="460" y="263" width="112" height="53" fill="#e8f0f4" stroke="none"/><text x="516" y="299" font-size="29" fill="#19333c" text-anchor="middle" font-weight="normal">0.1</text><rect x="585" y="263" width="112" height="53" fill="#256b82" stroke="none"/><text x="641" y="299" font-size="29" fill="white" text-anchor="middle" font-weight="normal">0.9</text><text x="815" y="175" font-size="28" fill="#19333c" text-anchor="start" font-weight="normal">聚合后验 q(Z=1)</text><rect x="815" y="220" width="200.0" height="55" fill="#e8f0f4" stroke="none"/><rect x="1015.0" y="220" width="200.0" height="55" fill="#256b82" stroke="none"/><text x="815" y="317" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">0.5 = 先验</text><text x="65" y="425" font-size="30" fill="#19333c" text-anchor="start" font-weight="normal">B：潜变量与输入独立</text><text x="480" y="425" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">Z=0</text><text x="605" y="425" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">Z=1</text><text x="365" y="487" font-size="27" fill="#19333c" text-anchor="start" font-weight="normal">X=0</text><rect x="460" y="449" width="112" height="53" fill="#e8f0f4" stroke="none"/><text x="516" y="485" font-size="29" fill="#19333c" text-anchor="middle" font-weight="normal">0.1</text><rect x="585" y="449" width="112" height="53" fill="#256b82" stroke="none"/><text x="641" y="485" font-size="29" fill="white" text-anchor="middle" font-weight="normal">0.9</text><text x="365" y="551" font-size="27" fill="#19333c" text-anchor="start" font-weight="normal">X=1</text><rect x="460" y="513" width="112" height="53" fill="#e8f0f4" stroke="none"/><text x="516" y="549" font-size="29" fill="#19333c" text-anchor="middle" font-weight="normal">0.1</text><rect x="585" y="513" width="112" height="53" fill="#256b82" stroke="none"/><text x="641" y="549" font-size="29" fill="white" text-anchor="middle" font-weight="normal">0.9</text><text x="815" y="425" font-size="28" fill="#19333c" text-anchor="start" font-weight="normal">聚合后验 q(Z=1)</text><rect x="815" y="470" width="39.99999999999999" height="55" fill="#e8f0f4" stroke="none"/><rect x="855.0" y="470" width="360.0" height="55" fill="#256b82" stroke="none"/><text x="815" y="567" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">0.9 ≠ 先验</text><line x1="60" y1="648" x2="1340" y2="648" stroke="#dce5e8" stroke-width="2"/><text x="60" y="700" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">KL 分解（nat）</text><text x="80" y="764" font-size="28" fill="#19333c" text-anchor="start" font-