<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1996" viewBox="0 0 1200 1996" role="img"><title>对抗训练中的两种更新：机制、算例与边界</title><rect width="1200" height="1996" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">对抗训练中的两种更新</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="565.625" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="685.625" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1235.625" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="485.625" viewBox="0 154 1200 525" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="60" y="180" width="250" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="75" y="215" font-size="25" fill="#143651">真实样本</text><text x="75" y="258" font-size="22" fill="#143651">来自数据集</text><rect x="60" y="440" width="250" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="75" y="475" font-size="25" fill="#143651">生成器</text><text x="75" y="518" font-size="22" fill="#143651">噪声 → 生成样本</text><rect x="530" y="305" width="280" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="545" y="340" font-size="25" fill="#143651">判别器</text><text x="545" y="383" font-size="22" fill="#143651">区分真实与生成</text><line x1="310" y1="230" x2="520" y2="340" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><line x1="310" y1="490" x2="520" y2="370" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><line x1="680" y1="410" x2="680" y2="585" stroke="#ed9a46" stroke-width="3" /><line x1="680" y1="585" x2="185" y2="585" stroke="#ed9a46" stroke-width="3" /><line x1="185" y1="585" x2="185" y2="550" stroke="#ed9a46" stroke-width="3" marker-end="url(#arr)" /><text x="800" y="550" font-size="24" fill="#143651">更新 G：梯度穿过 D</text><text x="520" y="650" font-size="25" fill="#143651">固定 D 参数 ≠ 切断输入导数</text></g></svg><text x="48" y="728.625" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  生成器更新仍需穿过固定判别器</text><text x="48" y="1278.625" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  冻结 D 参数不能断开输入梯度</text><g transform="translate(30,745.625) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">简例：Gθ(z)=θz，D(x)=2x</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">取 θ=1，z=3；D(G)=6</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">D 对输入导数为 2</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">D(G) 对 θ 导数：2×3＝6</text></g><g transform="translate(45,1295.625) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">6</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">保留输入导数</text><rect x="1220" y="1048.0" width="120" height="1" fill="#e3a461" /><text x="1215" y="1033.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误 detach 后</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">这里用线性输出检查链式法则，不是完整 GAN 损失。真实目</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">标还要乘损失对判别器输出的导数。</tspan></text></g></svg>
