<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>对抗训练中的两种更新</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">对抗训练中的两种更新</text><rect x="60" y="180" width="250" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="75" y="215" font-size="25" fill="#143651">真实样本</text><text x="75" y="258" font-size="22" fill="#143651">来自数据集</text><rect x="60" y="440" width="250" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="75" y="475" font-size="25" fill="#143651">生成器</text><text x="75" y="518" font-size="22" fill="#143651">噪声 → 生成样本</text><rect x="530" y="305" width="280" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="545" y="340" font-size="25" fill="#143651">判别器</text><text x="545" y="383" font-size="22" fill="#143651">区分真实与生成</text><line x1="310" y1="230" x2="520" y2="340" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><line x1="310" y1="490" x2="520" y2="370" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><line x1="680" y1="410" x2="680" y2="585" stroke="#ed9a46" stroke-width="3"/><line x1="680" y1="585" x2="185" y2="585" stroke="#ed9a46" stroke-width="3"/><line x1="185" y1="585" x2="185" y2="550" stroke="#ed9a46" stroke-width="3" marker-end="url(#arr)"/><text x="800" y="550" font-size="24" fill="#143651">更新 G：梯度穿过 D</text><text x="520" y="650" font-size="25" fill="#143651">固定 D 参数 ≠ 切断输入导数</text></g></svg>
