<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>对抗训练中的两种更新：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">对抗训练中的两种更新</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="60" y="180" width="250" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="75" y="215" font-size="25" fill="#143651">真实样本</ns0:text><ns0:text x="75" y="258" font-size="22" fill="#143651">来自数据集</ns0:text><ns0:rect x="60" y="440" width="250" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="75" y="475" font-size="25" fill="#143651">生成器</ns0:text><ns0:text x="75" y="518" font-size="22" fill="#143651">噪声 → 生成样本</ns0:text><ns0:rect x="530" y="305" width="280" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="545" y="340" font-size="25" fill="#143651">判别器</ns0:text><ns0:text x="545" y="383" font-size="22" fill="#143651">区分真实与生成</ns0:text><ns0:line x1="310" y1="230" x2="520" y2="340" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="310" y1="490" x2="520" y2="370" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="680" y1="410" x2="680" y2="585" stroke="#ed9a46" stroke-width="3" /><ns0:line x1="680" y1="585" x2="185" y2="585" stroke="#ed9a46" stroke-width="3" /><ns0:line x1="185" y1="585" x2="185" y2="550" stroke="#ed9a46" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="800" y="550" font-size="24" fill="#143651">更新 G：梯度穿过 D</ns0:text><ns0:text x="520" y="650" font-size="25" fill="#143651">固定 D 参数 ≠ 切断输入导数</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  生成器更新仍需穿过固定判别器</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  冻结 D 参数不能断开输入梯度</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">简例：Gθ(z)=θz，D(x)=2x</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">取 θ=1，z=3；D(G)=6</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">D 对输入导数为 2</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">D(G) 对 θ 导数：2×3＝6</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">6</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">保留输入导数</ns0:text><ns0:rect x="1220" y="1048.0" width="120" height="1" fill="#e3a461" /><ns0:text x="1215" y="1033.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误 detach 后</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">这里用线性输出检查链式法则，不是完整 GAN 损失。真实目</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">标还要乘损失对判别器输出的导数。</ns0:text></ns0:svg>
