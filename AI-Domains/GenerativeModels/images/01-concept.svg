ext x="430" y="530" font-size="25" fill="#143651">ε：标准正态噪声</text><line x1="360" y1="322" x2="430" y2="322" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><line x1="750" y1="322" x2="830" y2="322" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="840" y="270" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="855" y="305" font-size="25" fill="#143651">z=μ＋σ⊙ε</text><text x="855" y="348" font-size="22" fill="#143651">解码为观测分布</text><text x="150" y="640" font-size="27" fill="#143651">随机性放在 ε；均值与尺度保留可微参数路径。</text></g></svg><text x="48" y="638.9000000000001" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  重参数化把随机性移到基础噪声</text><text x="48" y="1188.9" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  后验均值解码不等于随机采样</text><g transform="translate(30,655.9000000000001) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">μ=1，σ=2，ε=−0.5</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">z=μ＋σε＝0</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">固定 ε 时，z 对 μ 的导数为 1</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">固定 ε 时，z 对 σ 的导数为 −0.5</text></g><g transform="translate(45,1205.9) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">观测分布、重构均值和随机生成是不同对象；不能只看一张均</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">值重构就判断整个生成分布。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">μ=1，σ=2；固定代表点与采样不同</text><text x="805" y="878" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">仅取均值</text><line x1="960" y1="910" x2="1420" y2="910" stroke="#44859a" stroke-width="2" /><circle cx="1180" cy="910" r="11" fill="#15988d" /><text x="1168" y="950" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</text><text x="805" y="998" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">ε取−1、0、1</text><line x1="960" y1="1030" x2="1420" y2="1030" stroke="#44859a" stroke-width="2" /><circle cx="990" cy="1030" r="11" fill="#e2a15f" /><text x="978" y="1070" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">-1</text><circle cx="1180" cy="1030" r="11" fill="#e2a15f" /><text x="1168" y="1070" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</text><circle cx="1370" cy="1030" r="11" fill="#e2a15f" /><text x="1358" y="1070" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">3</text></g></svg>
