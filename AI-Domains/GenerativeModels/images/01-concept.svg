<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>VAE 的编码分布与随机重构</title>
<desc>原创教学示意：观测 x|输入编码器;近似后验|输出均值与尺度;重参数采样|z=μ＋σ⊙ε;解码分布|重构项与 KL 项共同训练</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">VAE 的编码分布与随机重构</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">观测 x</text>
<text x="53" y="160" font-size="21" fill="#16324f">输入编码器</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">近似后验</text>
<text x="603" y="160" font-size="21" fill="#16324f">输出均值与尺度</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">重参数采样</text>
<text x="53" y="330" font-size="21" fill="#16324f">z=μ＋σ⊙ε</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">解码分布</text>
<text x="603" y="330" font-size="21" fill="#16324f">重构项与 KL 项共同训练</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="35" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="47" y="595" font-size="23" fill="#173c53">观测 x</text><text x="47" y="624" font-size="18" fill="#173c53">编码器输入</text><rect x="305" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="317" y="595" font-size="23" fill="#173c53">μ、σ</text><text x="317" y="624" font-size="18" fill="#173c53">输出分布参数</text><path d="M248,603 L295,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="575" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="587" y="595" font-size="23" fill="#173c53">z=μ+σ⊙ε</text><text x="587" y="624" font-size="18" fill="#173c53">ε 来自标准正态</text><path d="M518,603 L565,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="845" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="857" y="595" font-size="23" fill="#173c53">解码分布</text><text x="857" y="624" font-size="18" fill="#173c53">由 z 生成参数</text><path d="M788,603 L835,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="480" y="705" font-size="20" fill="#173c53">↑ 外部噪声 ε；随机性不妨碍对 μ、σ 求导</text><text x="35" y="750" font-size="20" fill="#173c53">重构项评价观测；KL 项约束近似后验与先验。</text></g></svg>