<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>VAE 的编码分布与随机重构：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">VAE 的编码分布与随机重构</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="60" y="270" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="75" y="305" font-size="25" fill="#143651">输入 x</ns0:text><ns0:text x="75" y="348" font-size="22" fill="#143651">编码器给出 μ、σ</ns0:text><ns0:circle cx="430.0" cy="457.88929065773397" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="434.3478260869565" cy="457.27051507552807" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="438.69565217391306" cy="456.49692788988375" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="443.04347826086956" cy="455.5379589191855" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="447.39130434782606" cy="454.359284948547" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="451.7391304347826" cy="452.9229727482485" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="456.0869565217391" cy="451.18781340911204" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="460.4347826086956" cy="449.10988137186524" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="464.7826086956522" cy="446.6433468985