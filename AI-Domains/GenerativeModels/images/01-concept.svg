" /><ns0:circle cx="556.0869565217391" cy="290.5331483036523" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="560.4347826086956" cy="284.0034265443418" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="564.7826086956522" cy="278.5989596938625" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="569.1304347826087" cy="274.4369748511687" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="573.4782608695652" cy="271.60940210078854" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="577.8260869565217" cy="270.1794992780933" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="582.1739130434783" cy="270.1794992780933" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="586.5217391304348" cy="271.60940210078854" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="590.8695652173913" cy="274.4369748511687" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="595.2173913043478" cy="278.5989596938625" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="599.5652173913044" cy="284.0034265443418" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="603.9130434782609" cy="290.5331483036523" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="608.2608695652174" cy="298.04982560782173" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="612.6086956521739" cy="306.3989486013767" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="616.9565217391305" cy="315.41505748040873" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="621.304347826087" cy="324.9271527321912" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="625.6521739130435" cy="334.7640102326929" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="630.0" cy="344.75917465459963" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="634.3478260869565" cy="354.75543501993474" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="638.695652173913" cy="364.60862597545287" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="643.0434782608696" cy="374.19064425084866" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="647.391304347826" cy="383.39161834682517" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="651.7391304347826" cy="392.1212174381485" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="656.0869565217391" cy="400.3091297473765" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="660.4347826086956" cy="407.90477877109487" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="664.7826086956522" cy="414.87637592784097" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="669.1304347826087" cy="421.2094294026133" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="673.4782608695652" cy="426.90484089375354" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="677.8260869565217" cy="431.9767250157705" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="682.1739130434783" cy="436.4500812385332" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="686.5217391304348" cy="440.35843683419614" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="690.8695652173913" cy="443.7415630028656" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="695.2173913043478" cy="446.64334689856145" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="699.5652173913044" cy="449.10988137186524" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="703.9130434782609" cy="451.18781340911204" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="708.2608695652174" cy="452.9229727482485" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="712.608695652174" cy="454.359284948547" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="716.9565217391305" cy="455.5379589191855" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="721.304347826087" cy="456.49692788988375" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="725.6521739130435" cy="457.27051507552807" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:circle cx="730.0" cy="457.88929065773397" r="3" fill="#a0cbbb" stroke="#1d5871" /><ns0:text x="430" y="530" font-size="25" fill="#143651">ε：标准正态噪声</ns0:text><ns0:line x1="360" y1="322" x2="430" y2="322" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="750" y1="322" x2="830" y2="322" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="840" y="270" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="855" y="305" font-size="25" fill="#143651">z=μ＋σ⊙ε</ns0:text><ns0:text x="855" y="348" font-size="22" fill="#143651">解码为观测分布</ns0:text><ns0:text x="150" y="640" font-size="27" fill="#143651">随机性放在 ε；均值与尺度保留可微参数路径。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  重参数化把随机性移到基础噪声</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  后验均值解码不等于随机采样</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">μ=1，σ=2，ε=−0.5</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">z=μ＋σε＝0</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">固定 ε 时，z 对 μ 的导数为 1</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">固定 ε 时，z 对 σ 的导数为 −0.5</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">观测分布、重构均值和随机生成是不同对象；不能只看一张均</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">值重构就判断整个生成分布。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">μ=1，σ=2；固定代表点与采样不同</ns0:text><ns0:text x="805" y="878" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">仅取均值</ns0:text><ns0:line x1="960" y1="910" x2="1420" y2="910" stroke="#44859a" stroke-width="2" /><ns0:circle cx="1180" cy="910" r="11" fill="#15988d" /><ns0:text x="1168" y="950" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</ns0:text><ns0:text x="805" y="998" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">ε取−1、0、1</ns0:text><ns0:line x1="960" y1="1030" x2="1420" y2="1030" stroke="#44859a" stroke-width="2" /><ns0:circle cx="990" cy="1030" r="11" fill="#e2a15f" /><ns0:text x="978" y="1070" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">-1</ns0:text><ns0:circle cx="1180" cy="1030" r="11" fill="#e2a15f" /><ns0:text x="1168" y="1070" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">1</ns0:text><ns0:circle cx="1370" cy="1030" r="11" fill="#e2a15f" /><ns0:text x="1358" y="1070" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">3</ns0:text></ns0:svg>
