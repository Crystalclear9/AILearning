<ns0:rect x="580.0" y="415.0" width="266.0" height="96.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="850.0" y="415.0" width="266.0" height="96.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="40.0" y="515.0" width="266.0" height="96.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="310.0" y="515.0" width="266.0" height="96.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="580.0" y="515.0" width="266.0" height="96.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:rect x="850.0" y="515.0" width="266.0" height="96.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><ns0:text x="53.0" y="150.0" font-size="23" fill="#143651">类别</ns0:text><ns0:text x="323.0" y="150.0" font-size="23" fill="#143651">交集</ns0:text><ns0:text x="593.0" y="150.0" font-size="23" fill="#143651">并集</ns0:text><ns0:text x="863.0" y="150.0" font-size="23" fill="#143651">类别 IoU</ns0:text><ns0:text x="53.0" y="250.0" font-size="23" fill="#143651">常见类</ns0:text><ns0:text x="323.0" y="250.0" font-size="23" fill="#143651">90</ns0:text><ns0:text x="593.0" y="250.0" font-size="23" fill="#143651">100</ns0:text><ns0:text x="863.0" y="250.0" font-size="23" fill="#143651">0.90</ns0:text><ns0:text x="53.0" y="350.0" font-size="23" fill="#143651">稀有类</ns0:text><ns0:text x="323.0" y="350.0" font-size="23" fill="#143651">1</ns0:text><ns0:text x="593.0" y="350.0" font-size="23" fill="#143651">11</ns0:text><ns0:text x="863.0" y="350.0" font-size="23" fill="#143651">0.0909</ns0:text><ns0:text x="53.0" y="450.0" font-size="23" fill="#143651">宏平均</ns0:text><ns0:text x="323.0" y="450.0" font-size="23" fill="#143651">逐类等权</ns0:text><ns0:text x="593.0" y="450.0" font-size="23" fill="#143651">两个类别</ns0:text><ns0:text x="863.0" y="450.0" font-size="23" fill="#143651">约 0.4955</ns0:text><ns0:text x="53.0" y="550.0" font-size="23" fill="#143651">微平均</ns0:text><ns0:text x="323.0" y="550.0" font-size="23" fill="#143651">合计 91</ns0:text><ns0:text x="593.0" y="550.0" font-size="23" fill="#143651">合计 111</ns0:text><ns0:text x="863.0" y="550.0" font-size="23" fill="#143651">约 0.8198</ns0:text><ns0:text x="50" y="655" font-size="23" fill="#143651">同一互斥二类分割：混淆矩阵 [[90,5],[5,1]]，共 101 个有效像素。</ns0:text><ns0:text x="50" y="693" font-size="23" fill="#143651">两类各有 FP＋FN=10；交集 90、1，并集 100、11。</ns0:text></ns0:g></ns0:svg>
