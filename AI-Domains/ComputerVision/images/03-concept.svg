<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>检测与分割输出为何不同：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">检测与分割输出为何不同</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="75" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3" /><ns0:ellipse cx="215" cy="340" rx="75" ry="90" fill="#69b3a3" /><ns0:text x="120" y="530" font-size="25" fill="#143651">图像级：对象 A</ns0:text><ns0:rect x="450" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3" /><ns0:ellipse cx="590" cy="340" rx="75" ry="90" fill="#69b3a3" /><ns0:rect x="505" y="240" width="170" height="200" fill="none" stroke="#ed9a46" stroke-width="5" /><ns0:text x="500" y="530" font-size="25" fill="#143651">检测：类别＋边框</ns0:text><ns0:rect x="825" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3" /><ns0:ellipse cx="965" cy="340" rx="75" ry="90" fill="#69b3a3" /><ns0:text x="860" y="530" font-size="25" fill="#143651">分割：逐像素归属</ns0:text><ns0:text x="150" y="650" font-size="26" fill="#143651">同一视觉对象，三类输出的监督粒度与评价单位不同。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  三个任务的监督维度不同</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  检测框不能替代精细边界</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分类：每张图 1 个类别</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">检测：每目标类别＋4 个框坐标</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分割：H×W 个像素归属</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">相同对象可对应不同输出粒度</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">图中椭圆和包围框表达不同信息，不能用“框正确”证明像素</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">级分割已经正确。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">框：覆盖16格区域</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">掩码：其中12格为对象</ns0:text><ns0:rect x="835" y="860" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><ns0:rect x="883" y="860" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="931" y="860" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="979" y="860" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><ns0:rect x="835" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="883" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="931" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="979" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="835" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="883" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="931" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="979" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="835" y="1004" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><ns0:rect x="883" y="1004" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="931" y="1004" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="979" y="1004" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><ns0:rect x="833" y="858" width="195" height="195" fill="none" stroke="#e2a15f" stroke-width="5" /><ns0:rect x="1165" y="860" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1213" y="860" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1261" y="860" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1309" y="860" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1165" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1213" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1261" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1309" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1165" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1213" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1261" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1309" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1165" y="1004" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1213" y="1004" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1261" y="1004" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><ns0:rect x="1309" y="1004" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><ns0:text x="805" y="1110" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">灰格是背景；包围框不能标明内部像素边界</ns0:text></ns0:svg>
