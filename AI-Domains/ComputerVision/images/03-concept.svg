<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>检测与分割输出为何不同</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">检测与分割输出为何不同</text><rect x="75" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3"/><ellipse cx="215" cy="340" rx="75" ry="90" fill="#69b3a3"/><text x="120" y="530" font-size="25" fill="#143651">图像级：对象 A</text><rect x="450" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3"/><ellipse cx="590" cy="340" rx="75" ry="90" fill="#69b3a3"/><rect x="505" y="240" width="170" height="200" fill="none" stroke="#ed9a46" stroke-width="5"/><text x="500" y="530" font-size="25" fill="#143651">检测：类别＋边框</text><rect x="825" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3"/><ellipse cx="965" cy="340" rx="75" ry="90" fill="#69b3a3"/><text x="860" y="530" font-size="25" fill="#143651">分割：逐像素归属</text><text x="150" y="650" font-size="26" fill="#143651">同一视觉对象，三类输出的监督粒度与评价单位不同。</text></g></svg>
