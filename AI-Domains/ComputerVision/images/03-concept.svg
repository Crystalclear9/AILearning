<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1968" viewBox="0 0 1200 1968" role="img"><title>检测与分割输出为何不同：机制、算例与边界</title><rect width="1200" height="1968" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">检测与分割输出为何不同</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="537.875" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="657.875" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1207.875" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="457.875" viewBox="0 184 1200 495" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="75" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3" /><ellipse cx="215" cy="340" rx="75" ry="90" fill="#69b3a3" /><text x="120" y="530" font-size="25" fill="#143651">图像级：对象 A</text><rect x="450" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3" /><ellipse cx="590" cy="340" rx="75" ry="90" fill="#69b3a3" /><rect x="505" y="240" width="170" height="200" fill="none" stroke="#ed9a46" stroke-width="5" /><text x="500" y="530" font-size="25" fill="#143651">检测：类别＋边框</text><rect x="825" y="210" width="290" height="260" rx="7" fill="#e7f2f8" stroke="#80a0b3" /><ellipse cx="965" cy="340" rx="75" ry="90" fill="#69b3a3" /><text x="860" y="530" font-size="25" fill="#143651">分割：逐像素归属</text><text x="150" y="650" font-size="26" fill="#143651">同一视觉对象，三类输出的监督粒度与评价单位不同。</text></g></svg><text x="48" y="700.875" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  三个任务的监督维度不同</text><text x="48" y="1250.875" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  检测框不能替代精细边界</text><g transform="translate(30,717.875) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分类：每张图 1 个类别</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">检测：每目标类别＋4 个框坐标</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">分割：H×W 个像素归属</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">相同对象可对应不同输出粒度</text></g><g transform="translate(45,1267.875) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">图中椭圆和包围框表达不同信息，不能用“框正确”证明像素</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">级分割已经正确。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">框：覆盖16格区域</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">掩码：其中12格为对象</text><rect x="835" y="860" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><rect x="883" y="860" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="931" y="860" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="979" y="860" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><rect x="835" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="883" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="931" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="979" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="835" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="883" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="931" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="979" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="835" y="1004" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><rect x="883" y="1004" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="931" y="1004" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="979" y="1004" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><rect x="833" y="858" width="195" height="195" fill="none" stroke="#e2a15f" stroke-width="5" /><rect x="1165" y="860" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><rect x="1213" y="860" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1261" y="860" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1309" y="860" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><rect x="1165" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1213" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1261" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1309" y="908" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1165" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1213" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1261" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1309" y="956" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1165" y="1004" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><rect x="1213" y="1004" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1261" y="1004" width="45" height="45" fill="#8fcab5" stroke="#8caab9" stroke-width="1" /><rect x="1309" y="1004" width="45" height="45" fill="#d8e0e6" stroke="#8caab9" stroke-width="1" /><text x="805" y="1110" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">灰格是背景；包围框不能标明内部像素边界</text></g></svg>
