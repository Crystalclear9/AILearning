<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1955" viewBox="0 0 1200 1955" role="img"><title>交并比怎样衡量区域重叠：机制、算例与边界</title><rect width="1200" height="1955" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">交并比怎样衡量区域重叠</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="524.925" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="644.925" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1194.925" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="444.925" viewBox="0 158 1200 481" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="150" y="245" width="350" height="140" rx="7" fill="#bad8e9" stroke="#80a0b3" /><rect x="290" y="245" width="280" height="140" rx="7" fill="#c4e5d4" stroke="#80a0b3" /><rect x="290" y="245" width="210" height="140" rx="7" fill="#64b0a4" stroke="#80a0b3" /><text x="130" y="205" font-size="26" fill="#143651">预测面积 5×2=10</text><text x="520" y="430" font-size="26" fill="#143651">真实面积 4×2=8</text><text x="170" y="495" font-size="27" fill="#143651">交集 3×2=6</text><text x="650" y="285" font-size="27" fill="#143651">并集 = 10＋8−6 = 12</text><text x="690" y="365" font-size="27" fill="#143651">IoU：</text><text x="860" y="335" font-size="30" fill="#143651">6</text><line x1="835" y1="352" x2="920" y2="352" stroke="#417f9c" stroke-width="3" /><text x="850" y="390" font-size="30" fill="#143651">12</text><text x="950" y="365" font-size="25" fill="#143651">＝二分之一</text><text x="160" y="610" font-size="25" fill="#143651">本图按相同高度绘制：重叠区域与面积计算一致。</text></g></svg><text x="48" y="687.925" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  交集与并集使用同一几何尺度</text><text x="48" y="1237.925" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  直接相加面积会重复计算交集</text><g transform="translate(30,704.925) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">预测：5×2＝10</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">真实：4×2＝8</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">交集：3×2＝6</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">并集：10＋8−6＝12；IoU=0.5</text></g><g transform="translate(45,1254.925) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.5</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">正确 IoU</text><rect x="1220" y="921.3333333333334" width="120" height="126.66666666666666" fill="#e3a461" /><text x="1215" y="906.3333333333334" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.33333</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误用 6÷18</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">交并比不是交集除以两个面积之和；检测 AP 还需要分数排序</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">和匹配规则。</tspan></text></g></svg>
