<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>交并比怎样衡量区域重叠：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">交并比怎样衡量区域重叠</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="150" y="245" width="350" height="140" rx="7" fill="#bad8e9" stroke="#80a0b3" /><ns0:rect x="290" y="245" width="280" height="140" rx="7" fill="#c4e5d4" stroke="#80a0b3" /><ns0:rect x="290" y="245" width="210" height="140" rx="7" fill="#64b0a4" stroke="#80a0b3" /><ns0:text x="130" y="205" font-size="26" fill="#143651">预测面积 5×2=10</ns0:text><ns0:text x="520" y="430" font-size="26" fill="#143651">真实面积 4×2=8</ns0:text><ns0:text x="170" y="495" font-size="27" fill="#143651">交集 3×2=6</ns0:text><ns0:text x="650" y="285" font-size="27" fill="#143651">并集 = 10＋8−6 = 12</ns0:text><ns0:text x="690" y="365" font-size="27" fill="#143651">IoU：</ns0:text><ns0:text x="860" y="335" font-size="30" fill="#143651">6</ns0:text><ns0:line x1="835" y1="352" x2="920" y2="352" stroke="#417f9c" stroke-width="3" /><ns0:text x="850" y="390" font-size="30" fill="#143651">12</ns0:text><ns0:text x="950" y="365" font-size="25" fill="#143651">＝二分之一</ns0:text><ns0:text x="160" y="610" font-size="25" fill="#143651">本图按相同高度绘制：重叠区域与面积计算一致。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  交集与并集使用同一几何尺度</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  直接相加面积会重复计算交集</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">预测：5×2＝10</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">真实：4×2＝8</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">交集：3×2＝6</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">并集：10＋8−6＝12；IoU=0.5</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.5</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">正确 IoU</ns0:text><ns0:rect x="1220" y="921.3333333333334" width="120" height="126.66666666666666" fill="#e3a461" /><ns0:text x="1215" y="906.3333333333334" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.33333</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误用 6÷18</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">交并比不是交集除以两个面积之和；检测 AP 还需要分数排序</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">和匹配规则。</ns0:text></ns0:svg>
