<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>交并比怎样衡量区域重叠</title>
<desc>原创教学示意：预测区域|面积 10;真实区域|面积 8;交集区域|面积 6;并集与 IoU|并集 12，IoU 为二分之一</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">交并比怎样衡量区域重叠</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">预测区域</text>
<text x="53" y="160" font-size="21" fill="#16324f">面积 10</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">真实区域</text>
<text x="603" y="160" font-size="21" fill="#16324f">面积 8</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">交集区域</text>
<text x="53" y="330" font-size="21" fill="#16324f">面积 6</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">并集与 IoU</text>
<text x="603" y="330" font-size="21" fill="#16324f">并集 12，IoU 为二分之一</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="500" font-size="20" fill="#173c53">几何算例：同高 2，宽分别为 5 和 4，重叠宽为 3</text><rect x="180" y="555" width="350" height="140" rx="7" fill="#dbeafa" stroke="#8faabc"/><rect x="320" y="555" width="280" height="140" rx="7" fill="#d8efdf" stroke="#8faabc"/><rect x="320" y="555" width="210" height="140" rx="7" fill="#a6cfbc" stroke="#8faabc"/><text x="175" y="730" font-size="20" fill="#173c53">预测：面积10</text><text x="505" y="730" font-size="20" fill="#173c53">真实：面积8</text><text x="730" y="580" font-size="24" fill="#173c53">交集：3×2=6</text><text x="730" y="625" font-size="24" fill="#173c53">并集：10+8-6=12</text><text x="730" y="675" font-size="24" fill="#173c53">IoU：二分之一</text></g></svg>