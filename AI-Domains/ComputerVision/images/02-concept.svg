<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>相同交集，不同并集：本章两个边界框算例</title><desc>左为面积100的真值和向右平移5的面积100预测，右为面积50的预测完全落在面积100真值中。交集都50，IoU分别三分之一和二分之一。</desc><rect width="1600" height="1000" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1d3048"><text x="60.00" y="65.00" font-size="38" fill="#1d3048" text-anchor="start" font-weight="bold">交集都是 50，为什么 IoU 不一样？</text><text x="60.00" y="112.00" font-size="28" fill="#61758b" text-anchor="start" font-weight="normal">真值 G = [0,10) × [0,10)；两侧坐标单位相同，面积按半开边界计算。</text><text x="110.00" y="187.00" font-size="32" fill="#1d3048" text-anchor="start" font-weight="bold">A  预测整体右移 5</text><line x1="110.00" y1="260.00" x2="110.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="110.00" y="650.00" font-size="25" fill="#61758b" text-anchor="middle" font-weight="normal">0</text><line x1="285.00" y1="260.00" x2="285.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="285.00" y="650.00" font-size="25" fill="#61758b" text-anchor="middle" font-weight="normal">5</text><line x1="460.00" y1="260.00" x2="460.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="460.00" y="650.00" font-size="25" fill="#61758b" text-anchor="middle" font-weight="normal">10</text><line x1="635.00" y1="260.00" x2="635.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="635.00" y="650.00" font-size="25" fill="#61758b" text-anchor="middle" font-weight="normal">15</text><line x1="110.00" y1="260.00" x2="635.00" y2="260.00" stroke="#dce6ef" stroke-width="2"/><text x="95.00" y="269.00" font-size="25" fill="#61758b" text-anchor="end" font-weight="normal">0</text><line x1="110.00" y1="435.00" x2="635.00" y2="435.00" stroke="#dce6ef" stroke-width="2"/><text x="95.00" y="444.00" font-size="25" fill="#61758b" text-anchor="end" font-weight="normal">5</text><line x1="110.00" y1="610.00" x2="635.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="95.00" y="619.00" font-size="25" fill="#61758b" text-anchor="end" font-weight="normal">10</text><rect x="110.00" y="260.00" width="350.00" height="350.00" rx="0" fill="#f9dfc2" stroke="none" stroke-width="2"/><rect x="285.00" y="260.00" width="350.00" height="350.00" rx="0" fill="#c6dbf8" stroke="none" stroke-width="2"/><rect x="285.00" y="260.00" width="175.00" height="350.00" rx="0" fill="#95d1be" stroke="none" stroke-width="2"/><rect x="110.00" y="260.00" width="350.00" height="350.00" rx="0" fill="none" stroke="#d17b24" stroke-width="5"/><rect x="285.00" y="260.00" width="350.00" height="350.00" rx="0" fill="none" stroke="#2663c9" stroke-width="5"/><text x="195.00" y="445.00" font-size="28" fill="#d17b24" text-anchor="middle" font-weight="normal">仅真值</text><text x="372.00" y="445.00" font-size="28" fill="#087f73" text-anchor="middle" font-weight="normal">交集</text><text x="547.00" y="445.00" font-size="28" fill="#2663c9" text-anchor="middle" font-weight="normal">仅预测</text><text x="110.00" y="235.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">y</text><text x="660.00" y="650.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">x</text><text x="110.00" y="754.00" font-size="29" fill="#1d3048" text-anchor="start" font-weight="normal">|G| = 100，|P| = 100</text><text x="110.00" y="806.00" font-size="28" fill="#1d3048" text-anchor="start" font-weight="normal">并集 = 100 + 100 − 50 = 150</text><text x="110.00" y="892.00" font-size="31" fill="#087f73" text-anchor="start" font-weight="normal">IoU =</text><text x="280.00" y="864.00" font-size="30" fill="#087f73" text-anchor="middle" font-weight="normal">50</text><line x1="240.00" y1="880.00" x2="320.00" y2="880.00" stroke="#087f73" stroke-width="2"/><text x="280.00" y="918.00" font-size="30" fill="#087f73" text-anchor="middle" font-weight="normal">150</text><text x="352.00" y="892.00" font-size="31" fill="#087f73" text-anchor="start" font-weight="normal">=</text><text x="425.00" y="864.00" font-size="30" fill="#087f73" text-anchor="middle" font-weight="normal">1</text><line x1="395.00" y1="880.00" x2="455.00" y2="880.00" stroke="#087f73" stroke-width="2"/><text x="425.00" y="918.00" font-size="30" fill="#087f73" text-anchor="middle" font-weight="normal">3</text><text x="900.00" y="187.00" font-size="32" fill="#1d3048" text-anchor="start" font-weight="bold">B  预测只覆盖左半区</text><line x1="900.00" y1="260.00" x2="900.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="900.00" y="650.00" font-size="25" fill="#61758b" text-anchor="middle" font-weight="normal">0</text><line x1="1075.00" y1="260.00" x2="1075.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="1075.00" y="650.00" font-size="25" fill="#61758b" text-anchor="middle" font-weight="normal">5</text><line x1="1250.00" y1="260.00" x2="1250.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="1250.00" y="650.00" font-size="25" fill="#61758b" text-anchor="middle" font-weight="normal">10</text><line x1="1425.00" y1="260.00" x2="1425.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="1425.00" y="650.00" font-size="25" fill="#61758b" text-anchor="middle" font-weight="normal">15</text><line x1="900.00" y1="260.00" x2="1425.00" y2="260.00" stroke="#dce6ef" stroke-width="2"/><text x="885.00" y="269.00" font-size="25" fill="#61758b" text-anchor="end" font-weight="normal">0</text><line x1="900.00" y1="435.00" x2="1425.00" y2="435.00" stroke="#dce6ef" stroke-width="2"/><text x="885.00" y="444.00" font-size="25" fill="#61758b" text-anchor="end" font-weight="normal">5</text><line x1="900.00" y1="610.00" x2="1425.00" y2="610.00" stroke="#dce6ef" stroke-width="2"/><text x="885.00" y="619.00" font-size="25" fill="#61758b" text-anchor="end" font-weight="normal">10</text><rect x="900.00" y="260.00" width="350.00" height="350.00" rx="0" fill="#f9dfc2" stroke="none" stroke-width="2"/><rect x="900.00" y="260.00" width="175.00" height="350.00" rx="0" fill="#95d1be" stroke="none" stroke-width="2"/><rect x="900.00" y="260.00" width="350.00" height="350.00" rx="0" fill="none" stroke="#d17b24" stroke-width="5"/><rect x="900.00" y="260.00" width="175.00" height="350.00" rx="0" fill="none" stroke="#2663c9" stroke-width="5"/><text x="987.00" y="445.00" font-size="28" fill="#087f73" text-anchor="middle" font-weight="normal">交集</text><text x="1162.00" y="445.00" font-size="28" fill="#d17b24" text-anchor="middle" font-weight="normal">仅真值</text><text x="900.00" y="235.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">y</text><text x="1450.00" y="650.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">x</text><text x="900.00" y="754.00" font-size="29" fill="#1d3048" text-anchor="start" font-weight="normal">|G| = 100，|P| = 50</text><text x="900.00" y="806.00" font-size="28" fill="#1d3048" text-anchor="start" font-weight="normal">并集 = 100 + 50 − 50 = 100</text><text x="900.00" y="892.00" font-size="31" fill="#087f73" text-anchor="start" font-weight="normal">IoU =</text><text x="1070.00" y="864.00" font-size="30" fill="#087f73" text-anchor="middle" font-weight="normal">50</text><line x1="1030.00" y1="880.00" x2="1110.00" y2="880.00" stroke="#087f73" stroke-width="2"/><text x="1070.00" y="918.00" font-size="30" fill="#087f73" text-anchor="middle" font-weight="normal">100</text><text x="1142.00" y="892.00" font-size="31" fill="#087f73" text-anchor="start" font-weight="normal">=</text><text x="1215.00" y="864.00" font-size="30" fill="#087f73" text-anchor="middle" font-weight="normal">1</text><line x1="1185.00" y1="880.00" x2="1245.00" y2="880.00" stroke="#087f73" stroke-width="2"/><text x="1215.00" y="918.00" font-size="30" fill="#087f73" text-anchor="middle" font-weight="normal">2</text><text x="60.00" y="975.00" font-size="28" fill="#61758b" text-anchor="start" font-weight="normal">绿色区域只计一次；额外包围背景会扩大并集。蓝框是预测，橙框是真值。</text></g></svg>
