<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>交并比怎样衡量区域重叠</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">交并比怎样衡量区域重叠</text><rect x="150" y="245" width="350" height="140" rx="7" fill="#bad8e9" stroke="#80a0b3"/><rect x="290" y="245" width="280" height="140" rx="7" fill="#c4e5d4" stroke="#80a0b3"/><rect x="290" y="245" width="210" height="140" rx="7" fill="#64b0a4" stroke="#80a0b3"/><text x="130" y="205" font-size="26" fill="#143651">预测面积 5×2=10</text><text x="520" y="430" font-size="26" fill="#143651">真实面积 4×2=8</text><text x="170" y="495" font-size="27" fill="#143651">交集 3×2=6</text><text x="650" y="285" font-size="27" fill="#143651">并集 = 10＋8−6 = 12</text><text x="690" y="365" font-size="27" fill="#143651">IoU：</text><text x="860" y="335" font-size="30" fill="#143651">6</text><line x1="835" y1="352" x2="920" y2="352" stroke="#417f9c" stroke-width="3"/><text x="850" y="390" font-size="30" fill="#143651">12</text><text x="950" y="365" font-size="25" fill="#143651">＝二分之一</text><text x="160" y="610" font-size="25" fill="#143651">本图按相同高度绘制：重叠区域与面积计算一致。</text></g></svg>
