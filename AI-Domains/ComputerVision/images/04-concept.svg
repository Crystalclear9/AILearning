<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>鲁棒性评估要固定标签语义：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">鲁棒性评估要固定标签语义</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="100" y="210" width="270" height="270" rx="7" fill="rgb(65,65,65)" stroke="#80a0b3" /><ns0:path d="M170,410 L235,270 L300,410 Z" fill="#a5d8ca" /><ns0:text x="140" y="540" font-size="28" fill="#143651">偏暗</ns0:text><ns0:rect x="465" y="210" width="270" height="270" rx="7" fill="rgb(135,135,135)" stroke="#80a0b3" /><ns0:path d="M535,410 L600,270 L665,410 Z" fill="#a5d8ca" /><ns0:text x="505" y="540" font-size="28" fill="#143651">原条件</ns0:text><ns0:rect x="830" y="210" width="270" height="270" rx="7" fill="rgb(205,205,205)" stroke="#80a0b3" /><ns0:path d="M900,410 L965,270 L1030,410 Z" fill="#a5d8ca" /><ns0:text x="870" y="540" font-size="28" fill="#143651">偏亮</ns0:text><ns0:text x="140" y="645" font-size="24" fill="#143651">受控亮度变化需保持目标可见、标签可判定；模型参数保持固定。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  同一像素的受控亮度变换</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  标签不可判定时不应强求不变</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">固定同一图像、标签与模型</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">像素强度 100；亮度系数 0.7</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">变换后强度：100×0.7＝70</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">其他条件固定，比较同一任务指标</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">测试需要检验标签保持性和扰动强度；不能把严重损毁样本与</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">正常条件混合后随意解释。</ns0:text><ns0:rect x="835" y="865" width="220" height="180" fill="#e6f1f6" stroke="#8caab9" stroke-width="1" /><ns0:polygon points="875,1010 945,885 1015,1010" fill="#15988d" /><ns0:rect x="1165" y="865" width="220" height="180" fill="#e6f1f6" stroke="#8caab9" stroke-width="1" /><ns0:polygon points="1205,1010 1275,885 1345,1010" fill="#15988d" /><ns0:rect x="1165" y="865" width="220" height="140" fill="#b7bec4" stroke="#8caab9" stroke-width="1" /><ns0:text x="1255" y="965" font-size="42" fill="#17374e" font-family="Microsoft YaHei,sans-serif">?</ns0:text><ns0:text x="805" y="1085" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">对象可见</ns0:text><ns0:text x="1150" y="1085" font-size="21" fill="#17374e" font-family="Microsoft YaHei,sans-serif">重遮挡：可判定性需核验</ns0:text></ns0:svg>
