<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1963" viewBox="0 0 1200 1963" role="img"><title>鲁棒性评估要固定标签语义：机制、算例与边界</title><rect width="1200" height="1963" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">鲁棒性评估要固定标签语义</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="533.25" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="653.25" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1203.25" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="453.25" viewBox="0 184 1200 490" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="100" y="210" width="270" height="270" rx="7" fill="rgb(65,65,65)" stroke="#80a0b3" /><path d="M170,410 L235,270 L300,410 Z" fill="#a5d8ca" /><text x="140" y="540" font-size="28" fill="#143651">偏暗</text><rect x="465" y="210" width="270" height="270" rx="7" fill="rgb(135,135,135)" stroke="#80a0b3" /><path d="M535,410 L600,270 L665,410 Z" fill="#a5d8ca" /><text x="505" y="540" font-size="28" fill="#143651">原条件</text><rect x="830" y="210" width="270" height="270" rx="7" fill="rgb(205,205,205)" stroke="#80a0b3" /><path d="M900,410 L965,270 L1030,410 Z" fill="#a5d8ca" /><text x="870" y="540" font-size="28" fill="#143651">偏亮</text><text x="140" y="645" font-size="24" fill="#143651">受控亮度变化需保持目标可见、标签可判定；模型参数保持固定。</text></g></svg><text x="48" y="696.25" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  同一像素的受控亮度变换</text><text x="48" y="1246.25" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  标签不可判定时不应强求不变</text><g transform="translate(30,713.25) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">固定同一图像、标签与模型</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">像素强度 100；亮度系数 0.7</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">变换后强度：100×0.7＝70</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">其他条件固定，比较同一任务指标</text></g><g transform="translate(45,1263.25) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">测试需要检验标签保持性和扰动强度；不能把严重损毁样本与</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">正常条件混合后随意解释。</tspan></text><rect x="835" y="865" width="220" height="180" fill="#e6f1f6" stroke="#8caab9" stroke-width="1" /><polygon points="875,1010 945,885 1015,1010" fill="#15988d" /><rect x="1165" y="865" width="220" height="180" fill="#e6f1f6" stroke="#8caab9" stroke-width="1" /><polygon points="1205,1010 1275,885 1345,1010" fill="#15988d" /><rect x="1165" y="865" width="220" height="140" fill="#b7bec4" stroke="#8caab9" stroke-width="1" /><text x="1255" y="965" font-size="42" fill="#17374e" font-family="Microsoft YaHei,sans-serif">?</text><text x="805" y="1085" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">对象可见</text><text x="1150" y="1085" font-size="21" fill="#17374e" font-family="Microsoft YaHei,sans-serif">重遮挡：可判定性需核验</text></g></svg>
