<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>鲁棒性评估要固定标签语义</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">鲁棒性评估要固定标签语义</text><rect x="100" y="210" width="270" height="270" rx="7" fill="rgb(65,65,65)" stroke="#80a0b3"/><path d="M170,410 L235,270 L300,410 Z" fill="#a5d8ca"/><text x="140" y="540" font-size="28" fill="#143651">偏暗</text><rect x="465" y="210" width="270" height="270" rx="7" fill="rgb(135,135,135)" stroke="#80a0b3"/><path d="M535,410 L600,270 L665,410 Z" fill="#a5d8ca"/><text x="505" y="540" font-size="28" fill="#143651">原条件</text><rect x="830" y="210" width="270" height="270" rx="7" fill="rgb(205,205,205)" stroke="#80a0b3"/><path d="M900,410 L965,270 L1030,410 Z" fill="#a5d8ca"/><text x="870" y="540" font-size="28" fill="#143651">偏亮</text><text x="140" y="645" font-size="24" fill="#143651">受控亮度变化需保持目标可见、标签可判定；模型参数保持固定。</text></g></svg>
