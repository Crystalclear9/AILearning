<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1241.45" height="760.448" viewBox="19.276 49.276 1241.45 760.448" role="img" aria-labelledby="plate-title"><title id="plate-title">同一预测在两个IoU门槛下重新领取不同对象</title><rect id="edition-paper" x="19.276" y="49.276" width="1241.45" height="760.448" fill="#ffffff"/><svg id="edition-view" x="42" y="72" width="1196" height="715" viewBox="42 72 1196 715" overflow="hidden"><rect x="42" y="72" width="1196" height="715" fill="#ffffff"/><rect width="1280" height="800" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="26" fill="#283341" text-anchor="start">同一图、同一类别；四个框竖直范围均为 [0, 10]；只展示水平投影</text><text x="60" y="208" font-size="26" fill="#283341" text-anchor="start">真值 A</text><rect x="315" y="180" width="450" height="35" fill="#2c6f89"/><text x="780" y="208" font-size="26" fill="#283341" text-anchor="start">[0, 10]</text><text x="60" y="273" font-size="26" fill="#283341" text-anchor="start">真值 B</text><rect x="495" y="245" width="450" height="35" fill="#5c968e"/><text x="960" y="273" font-size="26" fill="#283341" text-anchor="start">[4, 14]</text><text x="60" y="338" font-size="26" fill="#283341" text-anchor="start">P1：0.90</text><rect x="180" y="310" width="450" height="35" fill="#b56b47"/><text x="645" y="338" font-size="26" fill="#283341" text-anchor="start">[-3, 7]</text><text x="60" y="403" font-size="26" fill="#283341" text-anchor="start">P2：0.80</text><rect x="360" y="375" width="450" height="35" fill="#b56b47"/><text x="825" y="403" font-size="26" fill="#283341" text-anchor="start">[1, 11]</text><text x="1030" y="200" font-size="26" fill="#283341" text-anchor="middle">对 A / 对 B</text><text x="1030" y="320" font-size="25" fill="#283341" text-anchor="middle">P1：0.538 / 0.176</text><text x="1030" y="385" font-size="25" fill="#283341" text-anchor="middle">P2：0.818 / 0.538</text><line x1="60" y1="445" x2="1220" y2="445" stroke="#e3e8ee" stroke-width="2"/><text x="90" y="505" font-size="31" fill="#283341" text-anchor="start">IoU 门槛 0.50</text><text x="90" y="565" font-size="29" fill="#2c6f89" text-anchor="start">P1 → A：TP</text><text x="90" y="625" font-size="29" fill="#2c6f89" text-anchor="start">P2 → B：TP</text><text x="90" y="685" font-size="29" fill="#2c6f89" text-anchor="start">A、B 均被找到</text><text x="710" y="505" font-size="31" fill="#283341" text-anchor="start">IoU 门槛 0.75</text><text x="710" y="565" font-size="29" fill="#b56b47" text-anchor="start">P1 → 无：FP</text><text x="710" y="625" font-size="29" fill="#b56b47" text-anchor="start">P2 → A：TP</text><text x="710" y="685" font-size="29" fill="#b56b47" text-anchor="start">B 仍然漏检</text><text x="60" y="765" font-size="27" fill="#283341" text-anchor="start">P2 在低门槛领取 B，在高门槛领取 A；不能只筛掉原匹配表中的 P1</text></g></svg></svg>