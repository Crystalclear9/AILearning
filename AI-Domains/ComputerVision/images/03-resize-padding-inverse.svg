<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="538.48" viewBox="-18.24 66.76 996.48 538.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">200乘100原图缩放并填充成128方图，以及漏减填充导致的回投错位</title><desc id="artwork-desc">原图宽200高100，框角点20,10和60,50。缩放0.64得到宽128高64，上下各填32后成为128方图。框在画布中的角点为12.8,38.4和38.4,64。忘记减上方填充会在原图中将框向下错移50像素。</desc><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="451.077586"/></clipPath><linearGradient id="edition-wash-1" x1="0%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#e6eff4"/><stop offset="100%" stop-color="#d3e3eb"/></linearGradient></defs><rect id="edition-paper" x="-18.24" y="66.76" width="996.48" height="538.48" fill="#ffffff"/><svg id="edition-view" x="0" y="85" width="960" height="502" viewBox="0 85 960 502" overflow="hidden"><rect width="960" height="587" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(8.002874 68.892241) scale(0.653736)"><g><rect x="26" y="69" width="1392" height="690" fill="#ffffff"/><title id="title">从原图到缩放图再到填充画布，逆变换必须先减填充再除缩放</title><desc id="desc">原图宽200高100，框角点20,10和60,50。缩放0.64得到宽128高64，上下各填32后成为128方图。框在画布中的角点为12.8,38.4和38.4,64。忘记减上方填充会在原图中将框向下错移50像素。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#466a79" stroke-width="2"/></marker></defs><rect width="1450" height="760" fill="#ffffff"/><g font-family="Microsoft YaHei,DejaVu Sans,sans-serif"><text x="44" y="110" font-size="34.83px" fill="#4c778c" text-anchor="start">连续边界坐标；宽 × 高；三个面板使用同一绘图单位</text><text x="70" y="180" font-size="36.12px" fill="#1d455b" text-anchor="start" font-weight="bold">1  原图：200 × 100</text><rect x="70" y="260" width="500" height="250" fill="#ffffff" stroke="#8da2b6" stroke-width="2"/><text x="650" y="180" font-size="36.12px" fill="#1d455b" text-anchor="start" font-weight="bold">2  缩放：128 × 64</text><rect x="650" y="300" width="320" height="160" fill="#ffffff" stroke="#8da2b6" stroke-width="2"/><text x="1040" y="180" font-size="36.12px" fill="#1d455b" text-anchor="start" font-weight="bold">3  画布：128 × 128</text><rect x="1040" y="220" width="320" height="320" fill="#ffffff" stroke="#8da2b6" stroke-width="2"/><rect x="1040" y="220" width="320" height="80" fill="#f3f6f7" stroke="none" stroke-width="1"/><rect x="1040" y="460" width="320" height="80" fill="#f3f6f7" stroke="none" stroke-width="1"/><text x="1200.0" y="267" font-size="30.96px" fill="#4c778c" text-anchor="middle">顶部填充 32</text><text x="1200.0" y="514" font-size="30.96px" fill="#4c778c" text-anchor="middle">底部填充 32</text><line x1="1040" y1="300" x2="1360" y2="300" stroke="#8da2b6" stroke-width="1"/><line x1="1040" y1="460" x2="1360" y2="460" stroke="#8da2b6" stroke-width="1"/><rect x="120.0" y="285.0" width="100.0" height="100.0" fill="url(#edition-wash-1)" stroke="#1e6c8d" stroke-width="3"/><line x1="132.5" y1="297.5" x2="207.5" y2="372.5" stroke="#1e6c8d" stroke-width="3"/><rect x="682.0" y="316.0" width="64.0" height="64.0" fill="#d3e3eb" stroke="#1e6c8d" stroke-width="3"/><line x1="690.0" y1="324.0" x2="738.0" y2="372.0" stroke="#1e6c8d" stroke-width="3"/><rect x="1072.0" y="316.0" width="64.0" height="64.0" fill="#d3e3eb" stroke="#1e6c8d" stroke-width="3"/><line x1="1080.0" y1="324.0" x2="1128.0" y2="372.0" stroke="#1e6c8d" stroke-width="3"/><rect x="120" y="410" width="100" height="100" fill="none" stroke="#b15e31" stroke-width="3" stroke-dasharray="9 7"/><text x="246" y="458" font-size="33.54px" fill="#a15b35" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">错误回投</text><line x1="590" y1="380" x2="635" y2="380" stroke="#466a79" stroke-width="2" marker-end="url(#arr)"/><line x1="988" y1="380" x2="1027" y2="380" stroke="#466a79" stroke-width="2" marker-end="url(#arr)"/><text x="810" y="247" font-size="33.54px" fill="#2a779b" text-anchor="middle">坐标乘 0.64</text><text x="1200" y="575" font-size="33.54px" fill="#2a779b" text-anchor="middle">纵坐标再加 32</text><text x="70" y="625" font-size="32.25px" fill="#1d455b" text-anchor="start">左上 (20,10)</text><text x="70" y="665" font-size="32.25px" fill="#1d455b" text-anchor="start">右下 (60,50)</text><text x="650" y="625" font-size="32.25px" fill="#1d455b" text-anchor="start">左上 (12.8,6.4)</text><text x="650" y="665" font-size="32.25px" fill="#1d455b" text-anchor="start">右下 (38.4,32.0)</text><text x="1040" y="625" font-size="32.25px" fill="#1d455b" text-anchor="start">左上 (12.8,38.4)</text><text x="1040" y="665" font-size="32.25px" fill="#1d455b" text-anchor="start">右下 (38.4,64.0)</text><line x1="44" y1="688" x2="1400" y2="688" stroke="#dde5eb" stroke-width="1"/><text x="44" y="736" font-size="36.12px" fill="#1d455b" text-anchor="start">回原图：先减填充 (0,32)，再除以 0.64；漏减会把框向下错移 50 个原图像素。</text></g></g></g></g></svg></svg>