<title id="title">200乘100原图缩放并填充成128方图，以及漏减填充导致的回投错位</title>
<desc id="description">三个面板使用共同的长度尺度。先将坐标乘以 0.64，再向下平移 32。原图橙框展示逆变换漏减填充时错移的五十像素。</desc>
<defs>
<linearGradient id="wash-t" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#edf6f6"/><stop offset="1" stop-color="#bfdde0"/></linearGradient>
<linearGradient id="wash-c" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#fbede8"/><stop offset="1" stop-color="#f2cfc5"/></linearGradient>
<linearGradient id="wash-v" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f1edf6"/><stop offset="1" stop-color="#dcd2ea"/></linearGradient>
<linearGradient id="wash-g" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#ecf5ee"/><stop offset="1" stop-color="#cce3d2"/></linearGradient>
<linearGradient id="wash-n" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f7fafb"/><stop offset="1" stop-color="#e7ecef"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="550" fill="white" stroke="none" stroke-width="1.6" rx="0"/>
