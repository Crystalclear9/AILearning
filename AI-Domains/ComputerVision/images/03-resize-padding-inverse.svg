<text x="198.0" y="113" fill="#657682" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400">200 × 100</text>
<rect x="43" y="155" width="310.0" height="155.0" fill="url(#wash-t)" stroke="#196f77" stroke-width="2.5" rx="0"/>
<rect x="74.0" y="170.5" width="62.0" height="62.0" fill="none" stroke="#196f77" stroke-width="4" rx="0"/>
<text x="198.0" y="425" fill="#196f77" font-size="26" text-anchor="middle" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-weight="400">(20, 10) → (60, 50)</text>
<rect x="74.0" y="248.0" width="62.0" height="62.0" fill="none" stroke="#a84b3b" stroke-width="3.5" rx="0" stroke-dasharray="7 5"/>
