<text x="607.2" y="64" fill="#202a37" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400">等比缩放</text>
<text x="607.2" y="113" fill="#657682" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400">128 × 64</text>
