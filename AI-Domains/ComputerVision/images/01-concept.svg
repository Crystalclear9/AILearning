<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>图像坐标到分类输出：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">图像坐标到分类输出</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="65" y="210" width="180" height="180" rx="7" fill="#e4a195" stroke="#80a0b3" /><ns0:rect x="93" y="182" width="180" height="180" rx="7" fill="#a8cfb8" stroke="#80a0b3" /><ns0:rect x="121" y="154" width="180" height="180" rx="7" fill="#a3c7e6" stroke="#80a0b3" /><ns0:text x="55" y="470" font-size="24" fill="#143651">H×W×3：颜色轴须明确</ns0:text><ns0:line x1="320" y1="300" x2="440" y2="300" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="465" y="210" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><ns0:rect x="510" y="210" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><ns0:rect x="555" y="210" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><ns0:rect x="600" y="210" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><ns0:rect x="465" y="255" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><ns0:rect x="510" y="255" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><ns0:rect x="555" y="255" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><ns0:rect x="600" y="255" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><ns0:rect x="465" y="300" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><ns0:rect x="510" y="300" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><ns0:rect x="555" y="300" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><ns0:rect x="600" y="300" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><ns0:rect x="465" y="345" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><ns0:rect x="510" y="345" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><ns0:rect x="555" y="345" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><ns0:rect x="600" y="345" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><ns0:text x="420" y="470" font-size="24" fill="#143651">空间特征 → 汇总向量</ns0:text><ns0:line x1="665" y1="300" x2="760" y2="300" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="800" y="225" width="65" height="180" rx="7" fill="#15988d" stroke="#80a0b3" /><ns0:text x="800" y="445" font-size="21" fill="#143651">类A</ns0:text><ns0:rect x="900" y="305" width="65" height="100" rx="7" fill="#4b87ba" stroke="#80a0b3" /><ns0:text x="900" y="445" font-size="21" fill="#143651">类B</ns0:text><ns0:rect x="1000" y="355" width="65" height="50" rx="7" fill="#ed9a46" stroke="#80a0b3" /><ns0:text x="1000" y="445" font-size="21" fill="#143651">类C</ns0:text><ns0:text x="160" y="615" font-size="24" fill="#143651">分类头预测整体类别；图像轴、颜色顺序与归一化必须保持一致。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  通道与分类头的形状账本</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相同形状也可能错置通道</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入：H×W×3；RGB 顺序固定</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">编码后：H2×W2×64</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">全局平均：64 维向量</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3 类线性头：64×3＋3＝195</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">转置、reshape 和颜色转换承担不同语义；形状检查不能单独</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">发现颜色顺序错误。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">按 RGB 解释</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同一数组按 BGR 解释</ns0:text><ns0:rect x="840" y="880" width="220" height="125" fill="#db4d44" stroke="#8caab9" stroke-width="1" /><ns0:text x="840" y="1050" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">[255,0,0]</ns0:text><ns0:rect x="1170" y="880" width="220" height="125" fill="#4779cb" stroke="#8caab9" stroke-width="1" /><ns0:text x="1170" y="1050" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">[255,0,0]</ns0:text><ns0:text x="805" y="1110" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">相同形状、相同数值，显示颜色却相反</ns0:text></ns0:svg>
