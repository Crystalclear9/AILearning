<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1987" viewBox="0 0 1200 1987" role="img"><title>图像坐标到分类输出：机制、算例与边界</title><rect width="1200" height="1987" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">图像坐标到分类输出</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="557.3" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="677.3" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1227.3" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="477.3" viewBox="0 128 1200 516" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="65" y="210" width="180" height="180" rx="7" fill="#e4a195" stroke="#80a0b3" /><rect x="93" y="182" width="180" height="180" rx="7" fill="#a8cfb8" stroke="#80a0b3" /><rect x="121" y="154" width="180" height="180" rx="7" fill="#a3c7e6" stroke="#80a0b3" /><text x="55" y="470" font-size="24" fill="#143651">H×W×3：颜色轴须明确</text><line x1="320" y1="300" x2="440" y2="300" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="465" y="210" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="510" y="210" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="555" y="210" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="600" y="210" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="465" y="255" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="510" y="255" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="555" y="255" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="600" y="255" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="465" y="300" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="510" y="300" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="555" y="300" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="600" y="300" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="465" y="345" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="510" y="345" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><rect x="555" y="345" width="42" height="42" rx="7" fill="#d6eaf4" stroke="#80a0b3" /><rect x="600" y="345" width="42" height="42" rx="7" fill="#a8d4c5" stroke="#80a0b3" /><text x="420" y="470" font-size="24" fill="#143651">空间特征 → 汇总向量</text><line x1="665" y1="300" x2="760" y2="300" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="800" y="225" width="65" height="180" rx="7" fill="#15988d" stroke="#80a0b3" /><text x="800" y="445" font-size="21" fill="#143651">类A</text><rect x="900" y="305" width="65" height="100" rx="7" fill="#4b87ba" stroke="#80a0b3" /><text x="900" y="445" font-size="21" fill="#143651">类B</text><rect x="1000" y="355" width="65" height="50" rx="7" fill="#ed9a46" stroke="#80a0b3" /><text x="1000" y="445" font-size="21" fill="#143651">类C</text><text x="160" y="615" font-size="24" fill="#143651">分类头预测整体类别；图像轴、颜色顺序与归一化必须保持一致。</text></g></svg><text x="48" y="720.3" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  通道与分类头的形状账本</text><text x="48" y="1270.3" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相同形状也可能错置通道</text><g transform="translate(30,737.3) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入：H×W×3；RGB 顺序固定</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">编码后：H2×W2×64</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">全局平均：64 维向量</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3 类线性头：64×3＋3＝195</text></g><g transform="translate(45,1287.3) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">转置、reshape 和颜色转换承担不同语义；形状检查不能单独</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">发现颜色顺序错误。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">按 RGB 解释</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同一数组按 BGR 解释</text><rect x="840" y="880" width="220" height="125" fill="#db4d44" stroke="#8caab9" stroke-width="1" /><text x="840" y="1050" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">[255,0,0]</text><rect x="1170" y="880" width="220" height="125" fill="#4779cb" stroke="#8caab9" stroke-width="1" /><text x="1170" y="1050" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">[255,0,0]</text><text x="805" y="1110" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">相同形状、相同数值，显示颜色却相反</text></g></svg>
