<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img"><title>精确率—召回率曲线来自按分数逐项纳入</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="674" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">精确率—召回率曲线来自按分数逐项纳入</text><line x1="130" y1="590" x2="1070" y2="590" stroke="#2865a0" stroke-width="3" /><line x1="130" y1="590" x2="130" y2="160" stroke="#2865a0" stroke-width="3" /><text x="145" y="135" font-size="24" fill="#213447">原始前缀精确率</text><text x="120.0" y="620" font-size="24" fill="#213447">0</text><text x="570.0" y="620" font-size="24" fill="#213447">0.5</text><text x="1020.0" y="620" font-size="24" fill="#213447">1</text><text x="63" y="597.0" font-size="24" fill="#213447">0</text><text x="63" y="397.0" font-size="24" fill="#213447">0.5</text><text x="63" y="197.0" font-size="24" fill="#213447">1</text><polyline points="430.0,190.0 430.0,390.0 730.0,323.33333333333337 730.0,390.0 1030.0,350.0" fill="none" stroke="#2865a0" stroke-width="4" /><circle cx="430.0" cy="190.0" r="16" fill="#2865a0" stroke="#2865a0" /><text x="422.0" y="197.0" font-size="24" fill="white">1</text><circle cx="430.0" cy="390.0" r="16" fill="#2865a0" stroke="#2865a0" /><text x="422.0" y="397.0" font-size="24" fill="white">2</text><circle cx="730.0" cy="323.33333333333337" r="16" fill="#2865a0" stroke="#2865a0" /><text x="722.0" y="330.33333333333337" font-size="24" fill="white">3</text><circle cx="730.0" cy="390.0" r="16" fill="#2865a0" stroke="#2865a0" /><text x="722.0" y="397.0" font-size="24" fill="white">4</text><circle cx="1030.0" cy="350.0" r="16" fill="#2865a0" stroke="#2865a0" /><text x="1022.0" y="357.0" font-size="24" fill="white">5</text><text x="450" y="190" font-size="25" fill="#213447">纳入顺序：正、负、正、负、正</text><text x="460" y="2