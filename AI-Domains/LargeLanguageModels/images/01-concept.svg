<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>语言模型预测的是 token 条件分布：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">语言模型预测的是 token 条件分布</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="80" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="140" y="340" font-size="32" fill="#143651">A</ns0:text><ns0:line x1="250" y1="325" x2="355" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="260" y="285" font-size="22" fill="#143651">预测</ns0:text><ns0:rect x="365" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="425" y="340" font-size="32" fill="#143651">B</ns0:text><ns0:line x1="535" y1="325" x2="640" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="545" y="285" font-size="22" fill="#143651">预测</ns0:text><ns0:rect x="650" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="710" y="340" font-size="32" fill="#143651">C</ns0:text><ns0:line x1="820" y1="325" x2="925" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="830" y="285" font-size="22" fill="#143651">预测</ns0:text><ns0:rect x="935" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="995" y="340" font-size="32" fill="#143651">EOS</ns0:text><ns0:text x="155" y="510" font-size="29" fill="#143651">每个位置用已知前缀预测后续 token</ns0:text><ns0:text x="140" y="620" font-size="25" fill="#143651">概率单位由分词器决定；token 不一定等于汉字或单词。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  一条 token 路径的概率可复算</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  token 均值随计量单位改变</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">真实目标条件概率：0.5、0.25</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">路径概率：0.125</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">总负对数似然：ln 8≈2.079</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两 token 平均：约 1.040</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">跨分词器困惑度不能直接当作同单位比较；应固定文本规范化</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">与共同字符或字节口径。</ns0:text><ns0:text x="805" y="840" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同一人工 NLL 总量 12</ns0:text><ns0:rect x="820" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><ns0:text x="850" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:rect x="915" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><ns0:text x="945" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:rect x="1010" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><ns0:text x="1040" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:rect x="1105" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><ns0:text x="1135" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:rect x="1200" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><ns0:text x="1230" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:rect x="1295" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><ns0:text x="1325" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</ns0:text><ns0:text x="805" y="960" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同一人工 NLL 总量 12</ns0:text><ns0:rect x="820" y="990" width="85" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="850" y="1033" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</ns0:text><ns0:rect x="915" y="990" width="85" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="945" y="1033" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</ns0:text><ns0:rect x="1010" y="990" width="85" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><ns0:text x="1040" y="1033" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</ns0:text><ns0:text x="805" y="1110" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">6 项平均为 2；3 项平均为 4</ns0:text></ns0:svg>
