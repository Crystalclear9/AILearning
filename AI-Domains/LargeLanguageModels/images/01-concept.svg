<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>语言模型预测的是 token 条件分布</title>
<desc>原创教学示意：文本|经固定分词器编码;token 前缀|t1、t2、t3;条件分布|每个位置预测后续 token;训练目标|有效位置负对数概率求和</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">语言模型预测的是 token 条件分布</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">文本</text>
<text x="53" y="160" font-size="21" fill="#16324f">经固定分词器编码</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">token 前缀</text>
<text x="603" y="160" font-size="21" fill="#16324f">t1、t2、t3</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">条件分布</text>
<text x="53" y="330" font-size="21" fill="#16324f">每个位置预测后续 token</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">训练目标</text>
<text x="603" y="330" font-size="21" fill="#16324f">有效位置负对数概率求和</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="35" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="47" y="595" font-size="23" fill="#173c53">前缀 t1</text><text x="47" y="624" font-size="18" fill="#173c53">只能见过去</text><rect x="305" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="317" y="595" font-size="23" fill="#173c53">预测 t2</text><text x="317" y="624" font-size="18" fill="#173c53">条件分布</text><path d="M248,603 L295,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="575" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="587" y="595" font-size="23" fill="#173c53">前缀 t1、t2</text><text x="587" y="624" font-size="18" fill="#173c53">训练标签移一位</text><path d="M518,603 L565,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="845" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="857" y="595" font-size="23" fill="#173c53">预测 t3</text><text x="857" y="624" font-size="18" fill="#173c53">不能偷看 t3</text><path d="M788,603 L835,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="90" y="715" font-size="20" fill="#173c53">训练中多个位置可并行评分，但每个预测仍受因果可见关系约束。</text><text x="90" y="750" font-size="20" fill="#173c53">token 单位由分词器与词表共同确定。</text></g></svg>