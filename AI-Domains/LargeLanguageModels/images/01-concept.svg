<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>语言模型预测的是 token 条件分布</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">语言模型预测的是 token 条件分布</text><rect x="80" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="140" y="340" font-size="32" fill="#143651">A</text><line x1="250" y1="325" x2="355" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><text x="260" y="285" font-size="22" fill="#143651">预测</text><rect x="365" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="425" y="340" font-size="32" fill="#143651">B</text><line x1="535" y1="325" x2="640" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><text x="545" y="285" font-size="22" fill="#143651">预测</text><rect x="650" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="710" y="340" font-size="32" fill="#143651">C</text><line x1="820" y1="325" x2="925" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><text x="830" y="285" font-size="22" fill="#143651">预测</text><rect x="935" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="995" y="340" font-size="32" fill="#143651">EOS</text><text x="155" y="510" font-size="29" fill="#143651">每个位置用已知前缀预测后续 token</text><text x="140" y="620" font-size="25" fill="#143651">概率单位由分词器决定；token 不一定等于汉字或单词。</text></g></svg>
