<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1887" viewBox="0 0 1200 1887" role="img"><title>语言模型预测的是 token 条件分布：机制、算例与边界</title><rect width="1200" height="1887" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">语言模型预测的是 token 条件分布</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="457.40000000000003" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="577.4000000000001" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1127.4" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="377.40000000000003" viewBox="0 241 1200 408" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="80" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="140" y="340" font-size="32" fill="#143651">A</text><line x1="250" y1="325" x2="355" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="260" y="285" font-size="22" fill="#143651">预测</text><rect x="365" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="425" y="340" font-size="32" fill="#143651">B</text><line x1="535" y1="325" x2="640" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="545" y="285" font-size="22" fill="#143651">预测</text><rect x="650" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="710" y="340" font-size="32" fill="#143651">C</text><line x1="820" y1="325" x2="925" y2="325" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="830" y="285" font-size="22" fill="#143651">预测</text><rect x="935" y="275" width="170" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="995" y="340" font-size="32" fill="#143651">EOS</text><text x="155" y="510" font-size="29" fill="#143651">每个位置用已知前缀预测后续 token</text><text x="140" y="620" font-size="25" fill="#143651">概率单位由分词器决定；token 不一定等于汉字或单词。</text></g></svg><text x="48" y="620.4000000000001" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  一条 token 路径的概率可复算</text><text x="48" y="1170.4" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  token 均值随计量单位改变</text><g transform="translate(30,637.4000000000001) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">真实目标条件概率：0.5、0.25</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">路径概率：0.125</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">总负对数似然：ln 8≈2.079</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">两 token 平均：约 1.040</text></g><g transform="translate(45,1187.4) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">跨分词器困惑度不能直接当作同单位比较；应固定文本规范化</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">与共同字符或字节口径。</tspan></text><text x="805" y="840" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同一人工 NLL 总量 12</text><rect x="820" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><text x="850" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text><rect x="915" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><text x="945" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text><rect x="1010" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><text x="1040" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text><rect x="1105" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><text x="1135" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text><rect x="1200" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><text x="1230" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text><rect x="1295" y="870" width="85" height="65" fill="#9acdbd" stroke="#8caab9" stroke-width="1" /><text x="1325" y="913" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">2</text><text x="805" y="960" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同一人工 NLL 总量 12</text><rect x="820" y="990" width="85" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><text x="850" y="1033" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</text><rect x="915" y="990" width="85" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><text x="945" y="1033" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</text><rect x="1010" y="990" width="85" height="65" fill="#edbe8d" stroke="#8caab9" stroke-width="1" /><text x="1040" y="1033" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">4</text><text x="805" y="1110" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">6 项平均为 2；3 项平均为 4</text></g></svg>
