<text x="302" y="219" fill="#a84b3b" font-size="21" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(323 211.5) scale(0.88095238) translate(-323 -211.5)">隔离</text>
<line x1="551" y1="247" x2="551" y2="291" stroke="#196f77" stroke-width="1.35" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<text x="551" y="326" fill="#196f77" font-size="23" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(551 317.5) scale(0.80434783) translate(-551 -317.5)">可进入训练</text>
<text x="360" y="386" fill="#202a37" font-size="23" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(360 377.5) scale(0.80434783) translate(-360 -377.5)">训练侧不接收同题镜像或答案</text>
</g>
</svg>
