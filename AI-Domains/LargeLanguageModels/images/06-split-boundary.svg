<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="706.66666667" viewBox="0 0 720 424" role="img" aria-labelledby="title desc">
<title id="title">把整组依赖留在训练边界之外</title>
<desc id="desc">题目、镜像、解析属于同一评估依赖组。题目进入评估，镜像与解析隔离。独立候选进入训练。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#196f77"/></marker>
<linearGradient id="wash-teal" x2="85%" y2="100%"><stop stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient>
<marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#655184"/></marker>
<linearGradient id="wash-violet" x2="85%" y2="100%"><stop stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#a84b3b"/></marker>
<linearGradient id="wash-coral" x2="85%" y2="100%"><stop stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#657682"/></marker>
<linearGradient id="wash-gray" x2="85%" y2="100%"><stop stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient>
</defs>
<rect width="720" height="424" fill="#fff"/>
<g font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">
<text x="360" y="49" fill="#202a37" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(360 38.5) scale(0.72413793) translate(-360 -38.5)">把整组依赖留在训练边界之外</text>
<text x="187" y="110" fill="#655184" font-size="23" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(187 101.5) scale(0.80434783) translate(-187 -101.5)">同一题目族</text>
<text x="554" y="110" fill="#196f77" font-size="23" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(554 101.5) scale(0.80434783) translate(-554 -101.5)">独立候选</text>
<line x1="380" y1="94" x2="380" y2="340" stroke="#657682" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/>
<polygon points="92,134 291,134 278,190 79,190" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.6"/><text x="185" y="171.18" fill="#655184" font-size="23" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(185 162.67999268) scale(0.80434783) translate(-185 -162.67999268)">冻结题目</text>
<polygon points="92,207 291,207 278,263 79,263" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.6"/><text x="185" y="243.16" fill="#a84b3b" font-size="21" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(185 235.66000366) scale(0.88095238) translate(-185 -235.66000366)">镜像与答案解析</text>
<polygon points="468,170 645,170 632,237 455,237" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.6"/><text x="550" y="211.66" fill="#196f77" font-size="21" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(550 204.16000366) scale(0.88095238) translate(-550 -204.16000366)">独立维修记录</text>
<line x1="294" y1="161" x2="338" y2="161" stroke="#655184" stroke-width="1.35" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
