<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>RAG 评估怎样拆开召回与忠实性</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">RAG 评估怎样拆开召回与忠实性</text><rect x="160" y="230" width="220" height="300" rx="7" fill="#c8e1ee" stroke="#80a0b3"/><text x="230" y="200" font-size="34" fill="#143651">100</text><text x="175" y="585" font-size="25" fill="#143651">全部问题</text><rect x="480" y="290" width="220" height="240" rx="7" fill="#89c4b4" stroke="#80a0b3"/><text x="550" y="260" font-size="34" fill="#143651">80</text><text x="495" y="585" font-size="25" fill="#143651">召回证据</text><rect x="800" y="350" width="220" height="180" rx="7" fill="#15988d" stroke="#80a0b3"/><text x="870" y="320" font-size="34" fill="#143651">60</text><text x="815" y="585" font-size="25" fill="#143651">证据内答对</text><text x="110" y="655" font-size="25" fill="#143651">检索召回 80%；条件正确率 75%；示例端到端正确率 60%。</text></g></svg>
