ize="27" fill="#cc6b26" text-anchor="start" font-weight="normal">未知，失败</text><line x1="65" y1="869" x2="1335" y2="869" stroke="#d9e3eb" stroke-width="2"/><text x="70" y="918" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">q2  Nebula，A，t=6</text><text x="460" y="918" font-size="27" fill="#687988" text-anchor="start" font-weight="normal">无权取得</text><text x="680" y="918" font-size="27" fill="#687988" text-anchor="start" font-weight="normal">不适用</text><text x="900" y="918" font-size="27" fill="#687988" text-anchor="start" font-weight="normal">不适用</text><text x="1130" y="918" font-size="27" fill="#687988" text-anchor="start" font-weight="normal">未知，正确</text><line x1="65" y1="945" x2="1335" y2="945" stroke="#d9e3eb" stroke-width="2"/><text x="70" y="1010" font-size="27" fill="#687988" text-anchor="start" font-weight="normal">q2 的不可答来自权限；q4 的不可答输出来自管线失败，二者不能合并。</text><path d="M1270,491 L1315,491 L1303,484 M1315,491 L1303,498" stroke="#17806e" stroke-width="3" fill="none"/></g></svg>
