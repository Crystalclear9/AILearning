<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img"><title>同一规则库：先确定证据资格，再沿阶段追踪</title><rect width="1400" height="1040" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="34" fill="#18354a" text-anchor="start" font-weight="bold">同一规则库：先确定证据资格，再沿阶段追踪</text><text x="48" y="104" font-size="26" fill="#687988" text-anchor="start" font-weight="normal">四个问题均来自正文程序；字符预算 80，候选数 k = 4</text><line x1="48" y1="128" x2="1352" y2="128" stroke="#d9e3eb" stroke-width="2"/><text x="54" y="180" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">① 两条事实才能连接到答案</text><rect x="70" y="215" width="280" height="108" rx="8" fill="#eff5fa" stroke="#d9e3eb" stroke-width="2"/><text x="210.0" y="259" font-size="31" fill="#18354a" text-anchor="middle" font-weight="normal">Orion</text><text x="210.0" y="298" font-size="25" fill="#687988" text-anchor="middle" font-weight="normal">member</text><rect x="530" y="215" width="280" height="108" rx="8" fill="#eff5fa" stroke="#d9e3eb" stroke-width="2"/><text x="670.0" y="259" font-size="31" fill="#18354a" text-anchor="middle" font-weight="normal">plan blue</text><text x="670.0" y="298" font-size="25" fill="#687988" text-anchor="middle" font-weight="normal">中间连接键</text><rect x="1010" y="215" width="280" height="108" rx="8" fill="#eff5fa" stroke="#d9e3eb" stroke-width="2"/><text x="1150.0" y="259" font-size="31" fill="#18354a" text-anchor="middle" font-weight="normal">14 日</text><text x="1150.0" y="298" font-size="25" fill="#687988" text-anchor="middle" font-weight="normal">blue-new，时点 6</text><line x1="350" y1="265" x2="530" y2="265" stroke="#2769a5" stroke-width="3"/><path d="M518.5914266954252,271.2325320018546 L530,265 L518.5914266954252,258.7674679981454" fill="none" stroke="#2769a5" stroke-width="3"/><text x="440" y="237" font-size="26" fill="#2769a5" text-anchor="middle" font-weight="normal">采用</text><line x1="810" y1="265" x2="