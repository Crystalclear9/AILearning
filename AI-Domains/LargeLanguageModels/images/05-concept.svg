<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><title>RAG 评估怎样拆开召回与忠实性：机制、算例与边界</title><rect width="1500" height="1250" fill="white" /><text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">RAG 评估怎样拆开召回与忠实性</text><text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="160" y="230" width="220" height="300" rx="7" fill="#c8e1ee" stroke="#80a0b3" /><text x="230" y="200" font-size="34" fill="#143651">100</text><text x="175" y="585" font-size="25" fill="#143651">全部问题</text><rect x="480" y="290" width="220" height="240" rx="7" fill="#89c4b4" stroke="#80a0b3" /><text x="550" y="260" font-size="34" fill="#143651">80</text><text x="495" y="585" font-size="25" fill="#143651">召回证据</text><rect x="800" y="350" width="220" height="180" rx="7" fill="#15988d" stroke="#80a0b3" /><text x="870" y="320" font-size="34" fill="#143651">60</text><text x="815" y="585" font-size="25" fill="#143651">证据内答对</text><text x="110" y="655" font-size="25" fill="#143651">检索召回 80%；召回内正确率 75%；另假设未召回的 20 问全错。</text></g></svg><line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  阶段条件分母不能直接替代总体</text><text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  忠实与正确也不是同一事件</text><line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">全部问题：100</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">召回证据：80；其中答对 60</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">条件正确率：60÷80＝0.75</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">其余 20 问全错时：总体 60%</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">图中的百分比依赖事件分解；回答主张是否受证据支持和事实</text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">是否正确应分别验收。</text><rect x="810" y="855" width="250" height="75" fill="#e2edf4" stroke="#8caab9" stroke-width="1" /><rect x="1160" y="855" width="250" height="75" fill="#d9eee4" stroke="#8caab9" stroke-width="1" /><text x="825" y="900" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">错误来源：9</text><text x="1175" y="900" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">复述：9</text><line x1="1070" y1="893" x2="1150" y2="893" stroke="#44859a" stroke-width="2" /><rect x="810" y="980" width="250" height="75" fill="#e2edf4" stroke="#8caab9" stroke-width="1" /><rect x="1160" y="980" width="250" height="75" fill="#d9eee4" stroke="#8caab9" stroke-width="1" /><text x="825" y="1025" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">无有效引用</text><text x="1175" y="1025" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">回答：10</text><line x1="1070" y1="1018" x2="1150" y2="1018" stroke="#44859a" stroke-width="2" /><text x="805" y="1110" font-size="22" fill="#17374e" font-family="Microsoft YaHei,sans-serif">真实值取10：上方忠实却错，下方对却缺引用</text></svg>
