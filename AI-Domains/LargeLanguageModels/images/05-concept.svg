<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="776.48" viewBox="-18.24 28.76 996.48 776.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">同一规则库公开与私有两跳事实、版本分支及q4的最小证据成本</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="690"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="776.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="740" viewBox="0 47 960 740" overflow="hidden"><rect width="960" height="787" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(-7.307692 4.461538) scale(0.769231)"><g><rect x="42" y="93" width="1183" height="897" fill="#ffffff"/><title>问题要跨两条关系，权限、版本与预算各有边界</title><rect width="1280" height="1030" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="135" font-size="34.45px" fill="#2c6f89" text-anchor="start">公开链：组 A、B 均可读，查询时点 6</text><circle cx="130" cy="265" r="12" fill="#22627b"/><text x="130" y="313" font-size="34.45px" fill="#283341" text-anchor="middle">Orion</text><circle cx="610" cy="265" r="12" fill="#22627b"/><text x="610" y="313" font-size="34.45px" fill="#283341" text-anchor="middle">blue</text><circle cx="1100" cy="265" r="12" fill="#22627b"/><text x="1100" y="313" font-size="34.45px" fill="#283341" text-anchor="middle">14 日</text><circle cx="1100" cy="400" r="12" fill="#718e98"/><text x="1100" y="448" font-size="34.45px" fill="#283341" text-anchor="middle">7 日</text><line x1="155" y1="265" x2="585" y2="265" stroke="#22627b" stroke-width="4"/><polyline fill="none" stroke="#22627b" stroke-width="4" points="574.47,270.75 585,265 574.47,259.25"/><text x="365" y="225" font-size="32.25px" fill="#2c6f89" text-anchor="middle">member / member-copy</text><line x1="635" y1="265" x2="1075" y2="265" stroke="#22627b" stroke-width="4"/><polyline fill="none" stroke="#22627b" stroke-width="4" points="1064.47,270.75 1075,265 1064.47,259.25"/><text x="850" y="225" font-size="33.54px" fill="#2c6f89" text-anchor="middle">blue-new：t ≥ 5</text><line x1="635" y1="275" x2="1075" y2="400" stroke="#718e98" stroke-width="3"/><text x="840" y="390" font-size="33.54px" fill="#475b6c" text-anchor="middle">blue-old：0 ≤ t &lt; 5</text><text x="60" y="520" font-size="34.45px" fill="#a05f3f" text-anchor="start">私有链：仅组 B 可读，同一句问题不代表同一可答性</text><circle cx="130" cy="620" r="12" fill="#a9603b"/><text x="130" y="670" font-size="34.45px" fill="#a05f3f" text-anchor="middle">Nebula</text><circle cx="610" cy="620" r="12" fill="#a9603b"/><text x="610" y="670" font-size="34.45px" fill="#a05f3f" text-anchor="middle">red</text><circle cx="1100" cy="620" r="12" fill="#a9603b"/><text x="1100" y="670" font-size="34.45px" fill="#a05f3f" text-anchor="middle">60 日</text><line x1="155" y1="620" x2="585" y2="620" stroke="#a9603b" stroke-width="4"/><polyline fill="none" stroke="#a9603b" stroke-width="4" points="574.47,625.75 585,620 574.47,614.25"/><text x="365" y="575" font-size="33.54px" fill="#a05f3f" text-anchor="middle">secret-member</text><line x1="635" y1="620" x2="1075" y2="620" stroke="#a9603b" stroke-width="4"/><polyline fill="none" stroke="#a9603b" stroke-width="4" points="1064.47,625.75 1075,620 1064.47,614.25"/><text x="850" y="575" font-size="33.54px" fill="#a05f3f" text-anchor="middle">secret-rule</text><text x="60" y="745" font-size="34.45px" fill="#283341" text-anchor="start">q4：组 B 有权，但规则排第 5，被 k = 4 截断</text><text x="60" y="805" font-size="34.45px" fill="#283341" text-anchor="start">即使补齐候选，最低充分成本也超过 80：</text><rect x="210" y="850" width="396" height="50" fill="#2c6f89"/><rect x="606" y="850" width="360" height="50" fill="#b56b47"/><text x="408" y="884" font-size="33.54px" fill="#ffffff" text-anchor="middle">成员关系 44</text><text x="786" y="884" font-size="33.54px" fill="#ffffff" text-anchor="middle">规则 40</text><line x1="930" y1="830" x2="930" y2="932" stroke="#283341" stroke-width="3"/><text x="930" y="968" font-size="33.54px" fill="#283341" text-anchor="middle">80 字符上限</text><text x="1110" y="884" font-size="32.48px" fill="#a05f3f" text-anchor="start">合计 84</text></g></g></g></g></svg></svg>