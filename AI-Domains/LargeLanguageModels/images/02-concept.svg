eight="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="800" y="269" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="842" y="269" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="884" y="269" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="926" y="269" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="968" y="269" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="1010" y="269" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="800" y="311" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="842" y="311" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="884" y="311" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="926" y="311" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="968" y="311" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="1010" y="311" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="800" y="353" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="842" y="353" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="884" y="353" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="926" y="353" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="968" y="353" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="1010" y="353" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="800" y="395" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="842" y="395" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="884" y="395" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="926" y="395" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="968" y="395" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="1010" y="395" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="800" y="437" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="842" y="437" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="884" y="437" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="926" y="437" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="968" y="437" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="1010" y="437" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="800" y="479" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="842" y="479" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="884" y="479" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="926" y="479" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="968" y="479" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:rect x="1010" y="479" width="39" height="39" fill="#9dcfbf" stroke="#88a8b9" /><ns0:text x="80" y="140" font-size="24" fill="#143651">B：8×2</ns0:text><ns0:text x="420" y="260" font-size="24" fill="#143651">A：2×6</ns0:text><ns0:text x="810" y="140" font-size="24" fill="#143651">BA：8×6</ns0:text><ns0:text x="265" y="370" font-size="45" fill="#143651">×</ns0:text><ns0:text x="690" y="370" font-size="45" fill="#143651">＝</ns0:text><ns0:text x="75" y="580" font-size="24" fill="#143651">16 个参数</ns0:text><ns0:text x="420" y="580" font-size="24" fill="#143651">12 个参数</ns0:text><ns0:text x="790" y="580" font-size="24" fill="#143651">低秩增量：48 个元素</ns0:text><ns0:text x="120" y="675" font-size="23" fill="#143651">先 B 后 A：总共 28 个因子参数，生成 8×6 的增量；不等于 48 个自由参数。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  因子参数与矩阵自由度分别计算</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  低秩并不约束基座全部秩</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B：8×2，共 16 个参数</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A：2×6，共 12 个参数</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">增量 BA：8×6，共 48 个元素</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">可训练因子合计：28；秩至多 2</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="937.1666666666666" width="120" height="110.83333333333333" fill="#169b8d" /><ns0:text x="895" y="922.1666666666666" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">28</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">LoRA 因子参数</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">48</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">完整矩阵元素</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">增量秩受限制，不代表冻结基座矩阵低秩；缩放、偏置和额外</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">可训练模块需要另外记账。</ns0:text></ns0:svg>
