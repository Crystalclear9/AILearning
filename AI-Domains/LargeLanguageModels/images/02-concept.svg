<text x="53" y="290" font-size="24" fill="#16324f">低秩矩阵 B</text>
<text x="53" y="330" font-size="21" fill="#16324f">8×2</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">合并增量</text>
<text x="603" y="330" font-size="21" fill="#16324f">BA 为 8×6，额外参数 28</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
