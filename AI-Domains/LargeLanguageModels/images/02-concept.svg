<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>LoRA 低秩增量的参数路径</title>
<desc>原创教学示意：冻结基座 W|示例为 8×6;低秩矩阵 A|2×6;低秩矩阵 B|8×2;合并增量|BA 为 8×6，额外参数 28</desc>
