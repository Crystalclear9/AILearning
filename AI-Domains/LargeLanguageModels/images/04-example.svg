<svg xmlns="http://www.w3.org/2000/svg" width="1193" height="794" viewBox="42 82 1193 794" role="img"><rect x="42" y="82" width="1193" height="794" fill="#ffffff" /><title>冻结权重仍要传递导数：相同前向，不同可训练路径</title><rect width="1280" height="900" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="195" font-size="29" fill="#276a80" text-anchor="start">保留计算图</text><circle cx="120" cy="240" r="9" fill="#276a80" /><text x="120" y="287" font-size="25" fill="#19343e" text-anchor="middle">x = 2</text><line x1="140" y1="240" x2="350" y2="240" stroke="#276a80" stroke-width="4" /><path d="M339.47,245.75 L350.00,240.00 L339.47,234.25" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="370" cy="240" r="9" fill="#276a80" /><text x="370" y="287" font-size="25" fill="#19343e" text-anchor="middle">h = ax = 1</text><line x1="390" y1="240" x2="600" y2="240" stroke="#276a80" stroke-width="4" /><path d="M589.47,245.75 L600.00,240.00 L589.47,234.25" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="620" cy="240" r="9" fill="#276a80" /><text x="620" y="287" font-size="25" fill="#19343e" text-anchor="middle">v = wh = 3</text><line x1="640" y1="240" x2="850" y2="240" stroke="#276a80" stroke-width="4" /><path d="M839.47,245.75 L850.00,240.00 L839.47,234.25" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="870" cy="240" r="9" fill="#276a80" /><text x="870" y="287" font-size="25" fill="#19343e" text-anchor="middle">y = bv = 12</text><line x1="890" y1="240" x2="1120" y2="240" stroke="#276a80" stroke-width="4" /><path d="M1109.47,245.75 L1120.00,240.00 L1109.47,234.25" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="1140" cy="240" r="9" fill="#276a80" /><line x1="1130" y1="356" x2="880" y2="356" stroke="#c2673f" stroke-width="4" /><path d="M890.53,350.25 L880.00,356.00 L890.53,361.75" fill="none" stroke="#c2673f" stroke-width="4" /><line x1="860" y1="356" x2="630" y2="356" stroke="#c2673f" stroke-width="4" /><path d="M640.53,350.25 L630.00,356.00 L640.53,361.75" fill="none" stroke="#c2673f" stroke-width="4" /><line x1="610" y1="356" x2="380" y2="356" stroke="#c2673f" stroke-width="4" /><path d="M390.53,350.25 L380.00,356.00 L390.53,361.75" fill="none" stroke="#c2673f" stroke-width="4" /><text x="60" y="545" font-size="29" fill="#c2673f" text-anchor="start">在 v 处切断计算图</text><circle cx="120" cy="590" r="9" fill="#276a80" /><text x="120" y="637" font-size="25" fill="#19343e" text-anchor="middle">x = 2</text><line x1="140" y1="590" x2="350" y2="590" stroke="#276a80" stroke-width="4" /><path d="M339.47,595.75 L350.00,590.00 L339.47,584.25" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="370" cy="590" r="9" fill="#276a80" /><text x="370" y="637" font-size="25" fill="#19343e" text-anchor="middle">h = ax = 1</text><line x1="390" y1="590" x2="600" y2="590" stroke="#276a80" stroke-width="4" /><path d="M589.47,595.75 L600.00,590.00 L589.47,584.25" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="620" cy="590" r="9" fill="#276a80" /><text x="620" y="637" font-size="25" fill="#19343e" text-anchor="middle">v = wh = 3</text><line x1="640" y1="590" x2="850" y2="590" stroke="#276a80" stroke-width="4" /><path d="M839.47,595.75 L850.00,590.00 L839.47,584.25" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="870" cy="590" r="9" fill="#276a80" /><text x="870" y="637" font-size="25" fill="#19343e" text-anchor="middle">y = bv = 12</text><line x1="890" y1="590" x2="1120" y2="590" stroke="#276a80" stroke-width="4" /><path d="M1109.47,595.75 L1120.00,590.00 L1109.47,584.25" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="1140" cy="590" r="9" fill="#276a80" /><line x1="1130" y1="706" x2="880" y2="706" stroke="#c2673f" stroke-width="4" /><path d="M890.53,700.25 L880.00,706.00 L890.53,711.75" fill="none" stroke="#c2673f" stroke-width="4" /><line x1="860" y1="706" x2="630" y2="706" stroke="#c2673f" stroke-width="4" /><path d="M640.53,700.25 L630.00,706.00 L640.53,711.75" fill="none" stroke="#c2673f" stroke-width="4" /><line x1="610" y1="706" x2="510" y2="706" stroke="#c2673f" stroke-width="4" /><path d="M520.53,700.25 L510.00,706.00 L520.53,711.75" fill="none" stroke="#c2673f" stroke-width="4" /><line x1="500" y1="680" x2="500" y2="730" stroke="#c2673f" stroke-width="5" /><text x="630" y="800" font-size="27" fill="#c2673f" text-anchor="middle">a 的梯度缺失；b 的梯度仍为 36</text><text x="60" y="850" font-size="28" fill="#19343e" text-anchor="start">两条路径的 y 和 L 完全相同；w 都不更新</text><text x="60" y="125" font-size="29" fill="#19343e" text-anchor="start">独立标量例：x = 2，a =</text><text x="415" y="106" font-size="25" fill="#19343e" text-anchor="middle">1</text><line x1="401.0" y1="114" x2="429.0" y2="114" stroke="#19343e" stroke-width="1.4" /><text x="415" y="139" font-size="25" fill="#19343e" text-anchor="middle">2</text><text x="447" y="125" font-size="29" fill="#19343e" text-anchor="start">，固定 w = 3，b = 4</text><text x="1040" y="287" font-size="25" fill="#19343e" text-anchor="start">L =</text><text x="1102" y="269" font-size="23" fill="#19343e" text-anchor="middle">1</text><line x1="1089.5" y1="277" x2="1114.5" y2="277" stroke="#19343e" stroke-width="1.4" /><text x="1102" y="302" font-size="23" fill="#19343e" text-anchor="middle">2</text><text x="1123" y="287" font-size="25" fill="#19343e" text-anchor="start">y² = 72</text><text x="1040" y="637" font-size="25" fill="#19343e" text-anchor="start">L =</text><text x="1102" y="619" font-size="23" fill="#19343e" text-anchor="middle">1</text><line x1="1089.5" y1="627" x2="1114.5" y2="627" stroke="#19343e" stroke-width="1.4" /><text x="1102" y="652" font-size="23" fill="#19343e" text-anchor="middle">2</text><text x="1123" y="637" font-size="25" fill="#19343e" text-anchor="start">y² = 72</text><text x="1075.0" y="387.0" font-size="23" fill="#c2673f" text-anchor="middle">∂L</text><line x1="1055.0" y1="395.0" x2="1095.0" y2="395.0" stroke="#c2673f" stroke-width="1.4" /><text x="1075.0" y="420.0" font-size="23" fill="#c2673f" text-anchor="middle">∂y</text><text x="1104.0" y="405.0" font-size="24" fill="#c2673f" text-anchor="start">= 12</text><text x="805.0" y="387.0" font-size="23" fill="#c2673f" text-anchor="middle">∂L</text><line x1="785.0" y1="395.0" x2="825.0" y2="395.0" stroke="#c2673f" stroke-width="1.4" /><text x="805.0" y="420.0" font-size="23" fill="#c2673f" text-anchor="middle">∂v</text><text x="834.0" y="405.0" font-size="24" fill="#c2673f" text-anchor="start">= 48</text><text x="555.0" y="387.0" font-size="23" fill="#c2673f" text-anchor="middle">∂L</text><line x1="535.0" y1="395.0" x2="575.0" y2="395.0" stroke="#c2673f" stroke-width="1.4" /><text x="555.0" y="420.0" font-size="23" fill="#c2673f" text-anchor="middle">∂h</text><text x="584.0" y="405.0" font-size="24" fill="#c2673f" text-anchor="start">= 144</text><text x="305.0" y="387.0" font-size="23" fill="#c2673f" text-anchor="middle">∂L</text><line x1="285.0" y1="395.0" x2="325.0" y2="395.0" stroke="#c2673f" stroke-width="1.4" /><text x="305.0" y="420.0" font-size="23" fill="#c2673f" text-anchor="middle">∂a</text><text x="334.0" y="405.0" font-size="24" fill="#c2673f" text-anchor="start">= 288</text><text x="1075.0" y="737.0" font-size="23" fill="#c2673f" text-anchor="middle">∂L</text><line x1="1055.0" y1="745.0" x2="1095.0" y2="745.0" stroke="#c2673f" stroke-width="1.4" /><text x="1075.0" y="770.0" font-size="23" fill="#c2673f" text-anchor="middle">∂y</text><text x="1104.0" y="755.0" font-size="24" fill="#c2673f" text-anchor="start">= 12</text><text x="805.0" y="737.0" font-size="23" fill="#c2673f" text-anchor="middle">∂L</text><line x1="785.0" y1="745.0" x2="825.0" y2="745.0" stroke="#c2673f" stroke-width="1.4" /><text x="805.0" y="770.0" font-size="23" fill="#c2673f" text-anchor="middle">∂v</text><text x="834.0" y="755.0" font-size="24" fill="#c2673f" text-anchor="start">= 48</text></g></svg>
