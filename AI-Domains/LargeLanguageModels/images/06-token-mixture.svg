<line x1="220" y1="262" x2="585" y2="262" stroke="#657682" stroke-width="2.6" stroke-linecap="round"/>
<text x="360" y="324" fill="#202a37" font-size="23" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(360 315.5) scale(0.80434783) translate(-360 -315.5)">每格代表 100 个有效预测位置</text>
