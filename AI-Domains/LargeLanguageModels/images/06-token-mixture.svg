<polygon points="417,182 494,182 481,240 404,240" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.6"/><text x="449" y="219.5" fill="#655184" font-size="22" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400" transform="translate(449.0703125 210.5) scale(0.72727273) translate(-449.0703125 -210.5)">100</text>
