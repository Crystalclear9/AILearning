<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 720 345" role="img" aria-labelledby="title desc">
<title id="title">相似边连通，文档仍可能不同</title>
<desc id="desc">A 与 B、B 与 C 都达到三分之二。A 与 C 只达到三分之一，因此直接相似不具有传递性。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#196f77"/></marker>
<linearGradient id="wash-teal" x2="85%" y2="100%"><stop stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient>
<marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#655184"/></marker>
<linearGradient id="wash-violet" x2="85%" y2="100%"><stop stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#a84b3b"/></marker>
<linearGradient id="wash-coral" x2="85%" y2="100%"><stop stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#657682"/></marker>
<linearGradient id="wash-gray" x2="85%" y2="100%"><stop stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient>
</defs>
<rect width="720" height="345" fill="#fff"/>
<g font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">
<text x="360" y="49" fill="#202a37" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(360 38.5) scale(0.72413793) translate(-360 -38.5)">相似边连通，文档仍可能不同</text>
<line x1="160" y1="155" x2="320" y2="155" stroke="#196f77" stroke-width="2.6" stroke-linecap="round"/>
<line x1="400" y1="155" x2="560" y2="155" stroke="#196f77" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="120" cy="155" r="39" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.75"/><text x="120" y="165" fill="#196f77" font-size="28" text-anchor="middle" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400" transform="translate(119.7734375 154.5) scale(0.66071429) translate(-119.7734375 -154.5)">A</text>
<circle cx="360" cy="155" r="39" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.75"/><text x="360" y="165" fill="#655184" font-size="28" text-anchor="middle" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400" transform="translate(360 154.5) scale(0.66071429) translate(-360 -154.5)">B</text>
<circle cx="600" cy="155" r="39" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.75"/><text x="600" y="165" fill="#196f77" font-size="28" text-anchor="middle" font-family="Cambria, Noto Serif, Georgia, serif" font-weight="400" transform="translate(600 154.5) scale(0.66071429) translate(-600 -154.5)">C</text>
<g fill="#196f77" font-size="25" text-anchor="middle">
<text x="240" y="108" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400" transform="translate(240 97.5) scale(0.64) translate(-240 -97.5)">2</text>
<line x1="227" y1="113" x2="253" y2="113" stroke="#196f77" stroke-width="1.6"/>
<text x="240" y="135" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400" transform="translate(240 124.5) scale(0.64) translate(-240 -124.5)">3</text>
</g>
<g fill="#196f77" font-size="25" text-anchor="middle">
<text x="480" y="108" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400" transform="translate(480 97.5) scale(0.64) translate(-480 -97.5)">2</text>
<line x1="467" y1="113" x2="493" y2="113" stroke="#196f77" stroke-width="1.6"/>
<text x="480" y="135" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400" transform="translate(480 124.5) scale(0.64) translate(-480 -124.5)">3</text>
</g>
<path d="M120 209 V243 H600 V209" fill="none" stroke="#a84b3b" stroke-width="2.3" stroke-dasharray="7 6"/>
<rect x="319" y="220" width="82" height="44" fill="#fff"/>
<g fill="#a84b3b" font-size="25" text-anchor="middle">
<text x="360" y="231" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400" transform="translate(360 220.5) scale(0.64) translate(-360 -220.5)">1</text>
<line x1="347" y1="236" x2="373" y2="236" stroke="#a84b3b" stroke-width="1.6"/>
<text x="360" y="258" font-family="Segoe UI, DejaVu Sans, sans-serif" font-weight="400" transform="translate(360 247.5) scale(0.64) translate(-360 -247.5)">3</text>
</g>
<text x="360" y="312" fill="#202a37" font-size="22" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(360 304) scale(0.84090909) translate(-360 -304)">阈值为三分之二，A 与 C 只通过 B 间接相连</text>
</g>
</svg>
