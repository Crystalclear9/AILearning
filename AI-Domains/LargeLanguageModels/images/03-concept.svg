<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>RAG 的证据链与生成链</title>
<desc>原创教学示意：用户查询|确定信息需求;检索重排|选出候选证据;上下文构造|保留来源与相关片段;条件生成|依据证据形成回答</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">RAG 的证据链与生成链</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">用户查询</text>
<text x="53" y="160" font-size="21" fill="#16324f">确定信息需求</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">检索重排</text>
<text x="603" y="160" font-size="21" fill="#16324f">选出候选证据</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">上下文构造</text>
<text x="53" y="330" font-size="21" fill="#16324f">保留来源与相关片段</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">条件生成</text>
<text x="603" y="330" font-size="21" fill="#16324f">依据证据形成回答</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="35" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="47" y="595" font-size="23" fill="#173c53">查询</text><text x="47" y="624" font-size="18" fill="#173c53">用户信息需求</text><rect x="305" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="317" y="595" font-size="23" fill="#173c53">检索 → 重排</text><text x="317" y="624" font-size="18" fill="#173c53">候选文档与分数</text><path d="M248,603 L295,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="575" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="587" y="595" font-size="23" fill="#173c53">证据上下文</text><text x="587" y="624" font-size="18" fill="#173c53">片段 + 来源</text><path d="M518,603 L565,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="845" y="565" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="857" y="595" font-size="23" fill="#173c53">生成与引用</text><text x="857" y="624" font-size="18" fill="#173c53">只用实际输入证据</text><path d="M788,603 L835,603" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="90" y="715" font-size="20" fill="#173c53">检查点：召回到了？重排保留了？真正进入提示了？回答正确引用了？</text><text x="90" y="750" font-size="20" fill="#173c53">证据文本是数据，不自动成为可信指令。</text></g></svg>