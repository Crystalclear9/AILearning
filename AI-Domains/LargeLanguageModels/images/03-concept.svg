 stroke="#8faec1" stroke-width="2"/><line x1="390" y1="503" x2="540" y2="503" stroke="#8faec1" stroke-width="2"/><line x1="280" y1="330" x2="360" y2="485" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><line x1="580" y1="485" x2="735" y2="330" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><rect x="745" y="280" width="350" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="760" y="315" font-size="25" fill="#143651">上下文证据</text><text x="760" y="358" font-size="22" fill="#143651">带来源的片段</text><text x="735" y="520" font-size="25" fill="#143651">再用于条件回答与引用绑定</text><text x="110" y="660" font-size="25" fill="#143651">检索可用、证据被使用与最终回答正确是不同环节。</text></g></svg>
