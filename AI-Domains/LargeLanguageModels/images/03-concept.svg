<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>RAG 的证据链与生成链：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">RAG 的证据链与生成链</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="50" y="280" width="220" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="65" y="315" font-size="25" fill="#143651">查询</ns0:text><ns0:text x="65" y="358" font-size="22" fill="#143651">确定需求</ns0:text><ns0:rect x="370" y="140" width="205" height="110" rx="7" fill="#e2eef6" stroke="#80a0b3" /><ns0:line x1="390" y1="167" x2="540" y2="167" stroke="#8faec1" stroke-width="2" /><ns0:line x1="390" y1="190" x2="540" y2="190" stroke="#8faec1" stroke-width="2" /><ns0:line x1="390" y1="213" x2="540" y2="213" stroke="#8faec1" stroke-width="2" /><ns0:line x1="280" y1="330" x2="360" y2="195" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="580" y1="195" x2="735" y2="330" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="370" y="285" width="205" height="110" rx="7" fill="#e2eef6" stroke="#80a0b3" /><ns0:line x1="390" y1="312" x2="540" y2="312" stroke="#8faec1" stroke-width="2" /><ns0:line x1="390" y1="335" x2="540" y2="335" stroke="#8faec1" stroke-width="2" /><ns0:line x1="390" y1="358" x2="540" y2="358" stroke="#8faec1" stroke-width="2" /><ns0:line x1="280" y1="330" x2="360" y2="340" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="580" y1="340" x2="735" y2="330" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="370" y="430" width="205" height="110" rx="7" fill="#e2eef6" stroke="#80a0b3" /><ns0:line x1="390" y1="457" x2="540" y2="457" stroke="#8faec1" stroke-width="2" /><ns0:line x1="390" y1="480" x2="540" y2="480" stroke="#8faec1" stroke-width="2" /><ns0:line x1="390" y1="503" x2="540" y2="503" stroke="#8faec1" stroke-width="2" /><ns0:line x1="280" y1="330" x2="360" y2="485" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="580" y1="485" x2="735" y2="330" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="745" y="280" width="350" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="760" y="315" font-size="25" fill="#143651">上下文证据</ns0:text><ns0:text x="760" y="358" font-size="22" fill="#143651">带来源的片段</ns0:text><ns0:text x="735" y="520" font-size="25" fill="#143651">再用于条件回答与引用绑定</ns0:text><ns0:text x="110" y="660" font-size="25" fill="#143651">检索可用、证据被使用与最终回答正确是不同环节。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  RAG 每一阶段都可能首先失败</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  检索召回不等于回答正确率</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">100 问题中检索有证据 80 个</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">其中真正使用证据 60 个</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">使用后正确回答 54 个</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">若其余全错：端到端 54%</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">80</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">检索证据数</ns0:text><ns0:rect x="1220" y="919.75" width="120" height="128.25" fill="#e3a461" /><ns0:text x="1215" y="904.75" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">54</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">正确回答数</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">这些是说明事件分解的人工计数；证据缺失时模型也可能答对</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">，真实台账应覆盖其他路径。</ns0:text></ns0:svg>
