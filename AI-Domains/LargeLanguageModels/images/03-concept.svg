<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="plate-title"><title id="plate-title">同一型号最新有效版本与权限撤销的时间路径</title><rect width="1450" height="900" fill="white"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill: #173c5b}</style><text x="80" y="60" font-size="32" text-anchor="start" font-weight="normal" style="fill: #173c5b">同一型号 A 的版本时间</text><line x1="150" y1="220" x2="1290" y2="220" stroke="#5b7a8d" stroke-width="3"/><text x="150" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill: #5b7a8d">1</text><text x="650" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill: #5b7a8d">2</text><text x="1150" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill: #5b7a8d">3</text><line x1="150" y1="160" x2="650" y2="160" stroke="#2176a2" stroke-width="20"/><text x="370" y="125" font-size="30" text-anchor="middle" font-weight="normal" style="fill: #2176a2">旧版：上限 35</text><line x1="650" y1="335" x2="1290" y2="335" stroke="#cd783d" stroke-width="20"/><text x="950" y="395" font-size="30" text-anchor="middle" font-weight="normal" style="fill: #cd783d">新版：上限 40</text><line x1="650" y1="100" x2="650" y2="430" stroke="#5b7a8d" stroke-width="2" stroke-dasharray="6 6"/><text x="650" y="480" font-size="31" text-anchor="middle" font-weight="normal" style="fill: #173c5b">时点 2：新版已替换旧版</text><line x1="50" y1="540" x2="1400" y2="540" stroke="#bec8d9" stroke-width="2"/><text x="100" y="620" font-size="31" text-anchor="start" font-weight="normal" style="fill: #2176a2">team-a 在时点 1：旧版可见 → 35</text><text x="100" y="705" font-size="31" text-anchor="start" font-weight="normal" style="fill: #cd783d">team-a 在时点 2：新版仅限 team-b → 无可见证据</text><text x="100" y="790" font-size="31" text-anchor="start" font-weight="normal" style="fill: #2d9499">team-b 在时点 2：新版可见 → 40</text></svg>