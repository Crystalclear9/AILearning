<svg xmlns="http://www.w3.org/2000/svg" width="1505.1" height="955.1" viewBox="-27.55 -27.55 1505.1 955.1" role="img" aria-labelledby="plate-title"><title id="plate-title">同一型号最新有效版本与权限撤销的时间路径</title><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill: #173c5b}</style><rect id="edition-paper" x="-27.55" y="-27.55" width="1505.1" height="955.1" fill="#ffffff"/><svg id="edition-view" x="0" y="0" width="1450" height="900" viewBox="0 0 1450 900" overflow="hidden"><rect width="1450" height="900" fill="#ffffff"/><text x="80" y="60" font-size="32" text-anchor="start" font-weight="normal" style="fill: #1d425a">同一型号 A 的版本时间</text><line x1="150" y1="220" x2="1290" y2="220" stroke="#5a7a8b" stroke-width="3"/><text x="150" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill: #5a7a8b">1</text><text x="650" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill: #5a7a8b">2</text><text x="1150" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill: #5a7a8b">3</text><line x1="150" y1="160" x2="650" y2="160" stroke="#2a7698" stroke-width="20"/><text x="370" y="125" font-size="30" text-anchor="middle" font-weight="normal" style="fill: #2a7698">旧版：上限 35</text><line x1="650" y1="335" x2="1290" y2="335" stroke="#c27243" stroke-width="20"/><text x="950" y="395" font-size="30" text-anchor="middle" font-weight="normal" style="fill: #c27243">新版：上限 40</text><line x1="650" y1="100" x2="650" y2="430" stroke="#5a7a8b" stroke-width="2" stroke-dasharray="6 6"/><text x="650" y="480" font-size="31" text-anchor="middle" font-weight="normal" style="fill: #1d425a">时点 2：新版已替换旧版</text><line x1="50" y1="540" x2="1400" y2="540" stroke="#c6d1de" stroke-width="2"/><text x="100" y="620" font-size="31" text-anchor="start" font-weight="normal" style="fill: #2a7698">team-a 在时点 1：旧版可见 → 35</text><text x="100" y="705" font-size="31" text-anchor="start" font-weight="normal" style="fill: #c27243">team-a 在时点 2：新版仅限 team-b → 无可