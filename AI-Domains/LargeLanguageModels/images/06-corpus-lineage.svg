<text x="347" y="257" fill="#196f77" font-size="21" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(347 249.5) scale(0.88095238) translate(-347 -249.5)">提取版本</text>
<text x="360" y="315" fill="#202a37" font-size="23" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-weight="400" transform="translate(360 306.5) scale(0.80434783) translate(-360 -306.5)">区间可沿父级键回到原始记录</text>
</g>
</svg>
