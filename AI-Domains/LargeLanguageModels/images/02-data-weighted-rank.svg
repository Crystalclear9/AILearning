<text x="447" y="421" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="21" text-anchor="middle" font-weight="400">矩阵误差平方</text>
<text x="775" y="421" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="21" text-anchor="middle" font-weight="400">预测风险</text>
<text x="74" y="624" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="24" text-anchor="start" font-weight="400">矩阵误差选方向 1；输入加权后，预测风险选方向 2。</text>
