<text x="170" y="285" fill="#3c7459" font-size="25" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" text-anchor="middle" font-weight="400" transform="translate(170 276.5) scale(0.74) translate(-170 -276.5)">可信授权</text>
