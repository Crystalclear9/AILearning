<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="708.33333333" viewBox="0 0 720 425" role="img" aria-labelledby="title desc">
<title id="title">从可读资料到授权执行</title><desc id="desc">资料只提供证据，模型只能提出动作。执行器用可信身份和授权核对后才提交，拒绝越权请求。</desc>
<defs>
