<svg xmlns="http://www.w3.org/2000/svg" width="1101.32" height="770.318" viewBox="21.841 51.841 1101.32 770.318" role="img" aria-labelledby="plate-title"><title id="plate-title">同一总体上，条件读取正确率与最终正确率的变化</title><rect id="edition-paper" x="21.841" y="51.841" width="1101.32" height="770.318" fill="#ffffff"/><svg id="edition-view" x="42" y="72" width="1061" height="730" viewBox="42 72 1061 730" overflow="hidden"><rect x="42" y="72" width="1061" height="730" fill="#ffffff"/><rect width="1280" height="800" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="26" fill="#283341" text-anchor="start">固定 100 题：80 道容易、20 道困难；读取器分层成功率始终为 90% 与 40%</text><text x="60" y="185" font-size="28" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">总体题目</text><rect x="285" y="150" width="640" height="55" fill="#2c6f89"/><rect x="925" y="150" width="160" height="55" fill="#b56b47"/><text x="605" y="187" font-size="28" fill="#ffffff" text-anchor="middle">容易 80</text><text x="1005" y="187" font-size="28" fill="#ffffff" text-anchor="middle">困难 20</text><text x="60" y="330" font-size="28" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">原检索</text><rect x="285" y="300" width="288" height="55" fill="#5c968e"/><text x="429" y="337" font-size="28" fill="#ffffff" text-anchor="middle">36</text><rect x="573" y="300" width="32" height="55" fill="#d2dbe5"/><text x="589" y="337" font-size="28" fill="#283341" text-anchor="middle">4</text><rect x="605" y="300" width="480" height="55" fill="#f0f4f5"/><text x="845" y="337" font-size="28" fill="#283341" text-anchor="middle">60</text><text x="60" y="465" font-size="28" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">改进检索</text><rect x="285" y="435" width="640" height="55" fill="#5c968e"/><text x="605" y="472" font-size="28" fill="#ffffff" text-anchor="middle">80</text><rect x="925" y="435" width="160" height="55" fill="#d2dbe5"/><text x="1005" y="472" font-size="28" fill="#283341" text-anchor="middle">20</text><rect x="1085" y="435" width="0" height="55" fill="#f0f4f5"/><text x="285" y="565" font-size="27" fill="#5c968e" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">绿色：最终正确</text><text x="620" y="565" font-size="27" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">蓝灰：有证据但读错</text><text x="285" y="615" font-size="27" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">浅灰：缺证据，未进入条件分母</text><text x="60" y="695" font-size="29" fill="#283341" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">有证据时：</text><text x="280" y="676" font-size="25" fill="#283341" text-anchor="middle">36</text><line x1="251.0" y1="684" x2="309.0" y2="684" stroke="#283341" stroke-width="1.4"/><text x="280" y="709" font-size="25" fill="#283341" text-anchor="middle">40</text><text x="325" y="695" font-size="29" fill="#283341" text-anchor="start">= 90%  →</text><text x="565" y="676" font-size="25" fill="#283341" text-anchor="middle">80</text><line x1="535.0" y1="684" x2="595.0" y2="684" stroke="#283341" stroke-width="1.4"/><text x="565" y="709" font-size="25" fill="#283341" text-anchor="middle">100</text><text x="610" y="695" font-size="29" fill="#283341" text-anchor="start">= 80%</text><text x="60" y="771" font-size="29" fill="#5c968e" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同一总体上：</text><text x="280" y="752" font-size="25" fill="#5c968e" text-anchor="middle">36</text><line x1="251.0" y1="760" x2="309.0" y2="760" stroke="#5c968e" stroke-width="1.4"/><text x="280" y="785" font-size="25" fill="#5c968e" text-anchor="middle">100</text><text x="325" y="771" font-size="29" fill="#5c968e" text-anchor="start">= 36%  →</text><text x="565" y="752" font-size="25" fill="#5c968e" text-anchor="middle">80</text><line x1="535.0" y1="760" x2="595.0" y2="760" stroke="#5c968e" stroke-width="1.4"/><text x="565" y="785" font-size="25" fill="#5c968e" text-anchor="middle">100</text><text x="610" y="771" font-size="29" fill="#5c968e" text-anchor="start">= 80%</text></g></svg></svg>