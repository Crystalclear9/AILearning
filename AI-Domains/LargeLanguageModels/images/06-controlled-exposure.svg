<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676.66666667" viewBox="0 0 720 406" role="img" aria-labelledby="title desc"><title id="title">同预算下分别改变配比和原样暴露</title><desc id="desc">三组各有二十个有效预测位置。基准组指南四、档案十六。配比组指南十二、档案八。暴露组的来源配额等于基准组，指南的四个位置中有两个改为原样评估题。</desc><defs><linearGradient id="wash-guide" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><linearGradient id="wash-archive" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><linearGradient id="wash-exam" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient></defs><rect width="720" height="406" fill="#fff"/><text x="360" y="51" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="30" font-weight="400" text-anchor="middle" transform="translate(360 40) scale(0.7) translate(-360 -40)">同预算下分别改变配比和原样暴露</text><rect x="168" y="82" width="19" height="15" fill="url(#wash-guide)" stroke="#196f77" stroke-width="1.2"/><text x="195" y="97" fill="#196f77" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="21" font-weight="400" text-anchor="start" transform="translate(216 89.5) scale(0.88095238) translate(-216 -89.5)">指南</text><rect x="294" y="82" width="19" height="15" fill="url(#wash-archive)" stroke="#3c7459" stroke-width="1.2"/><text x="321" y="97" fill="#3c7459" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="21" font-weight="400" text-anchor="start" transform="translate(342 89.5) scale(0.88095238) translate(-342 -89.5)">档案</text><rect x="420" y="82" width="19" height="15" fill="url(#wash-exam)" stroke="#a84b3b" stroke