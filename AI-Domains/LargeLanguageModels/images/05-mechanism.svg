<svg xmlns="http://www.w3.org/2000/svg" width="1390.92" height="1008.92" viewBox="4.54 38.54 1390.92 1008.92" role="img" aria-labelledby="plate-title"><title id="plate-title">同一 q4 在不同候选数、预算与打包策略下的实际证据可达性</title><rect id="edition-paper" x="4.54" y="38.54" width="1390.92" height="1008.92" fill="#ffffff"/><svg id="edition-view" x="30" y="64" width="1340" height="958" viewBox="30 64 1340 958" overflow="hidden"><rect x="30" y="64" width="1340" height="958" fill="#ffffff"/><rect width="1400" height="1030" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="104" font-size="26" fill="#658294" text-anchor="start" font-weight="normal">仍是 q4；保持同一排序与读取器，仅改变明确列出的条件</text><line x1="48" y1="128" x2="1352" y2="128" stroke="#dee7ed" stroke-width="2"/><text x="65" y="185" font-size="29" fill="#213747" text-anchor="start" font-weight="bold" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">① 保持贪心策略：扩大候选不等于读到完整证据</text><text x="535" y="249" font-size="29" fill="#213747" text-anchor="middle" font-weight="bold">预算 80</text><text x="835" y="249" font-size="29" fill="#213747" text-anchor="middle" font-weight="bold">预算 84</text><text x="1135" y="249" font-size="29" fill="#213747" text-anchor="middle" font-weight="bold">预算 159</text><text x="65" y="365" font-size="31" fill="#2d7bab" text-anchor="start" font-weight="normal">k = 4</text><rect x="395" y="290" width="280" height="143" rx="8" fill="#f5f7fa" stroke="#dee7ed" stroke-width="2"/><text x="535" y="340" font-size="32" fill="#b96735" text-anchor="middle" font-weight="bold" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未知</text><text x="535" y="389" font-size="26" fill="#213747" text-anchor="middle" font-weight="normal">44</text><rect x="695" y="290" width="280" height="143" rx="8" fill="#f5f7fa" stroke="#dee7ed" stroke-width="2"/><text x="835" y="340" font-size="32" fill="#b96735" text-anchor="middle" font-weight="bold" font-family="SimSun, Noto S