<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>微调数据中的监督位置：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">微调数据中的监督位置</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="65" y="235" width="200" height="100" rx="7" fill="#dce9f3" stroke="#80a0b3" /><ns0:text x="100" y="295" font-size="29" fill="#143651">指令</ns0:text><ns0:rect x="65" y="405" width="200" height="85" rx="7" fill="#eceeef" stroke="#80a0b3" /><ns0:text x="100" y="460" font-size="25" fill="#143651">不监督</ns0:text><ns0:rect x="290" y="235" width="200" height="100" rx="7" fill="#dce9f3" stroke="#80a0b3" /><ns0:text x="325" y="295" font-size="29" fill="#143651">上下文</ns0:text><ns0:rect x="290" y="405" width="200" height="85" rx="7" fill="#eceeef" stroke="#80a0b3" /><ns0:text x="325" y="460" font-size="25" fill="#143651">不监督</ns0:text><ns0:rect x="515" y="235" width="200" height="100" rx="7" fill="#a6d7c2" stroke="#80a0b3" /><ns0:text x="550" y="295" font-size="29" fill="#143651">答案1</ns0:text><ns0:rect x="515" y="405" width="200" height="85" rx="7" fill="#d8eee3" stroke="#80a0b3" /><ns0:text x="550" y="460" font-size="25" fill="#143651">计入损失</ns0:text><ns0:rect x="740" y="235" width="200" height="100" rx="7" fill="#a6d7c2" stroke="#80a0b3" /><ns0:text x="775" y="295" font-size="29" fill="#143651">答案2</ns0:text><ns0:rect x="740" y="405" width="200" height="85" rx="7" fill="#d8eee3" stroke="#80a0b3" /><ns0:text x="775" y="460" font-size="25" fill="#143651">计入损失</ns0:text><ns0:rect x="965" y="235" width="200" height="100" rx="7" fill="#a6d7c2" stroke="#80a0b3" /><ns0:text x="1000" y="295" font-size="29" fill="#143651">EOS</ns0:text><ns0:rect x="965" y="405" width="200" height="85" rx="7" fill="#d8eee3" stroke="#80a0b3" /><ns0:text x="1000" y="460" font-size="25" fill="#143651">计入损失</ns0:text><ns0:text x="130" y="610" font-size="25" fill="#143651">图例：浅蓝为输入条件，青绿为本例有效监督位置。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  损失归约只计入本例监督位置</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  存储长度不是监督分母</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入 5 个 token：2 个提示＋3 个答案</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">答案损失：1、2、3</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">有效损失和：6</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">按答案平均：6÷3＝2</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">答案位置平均</ns0:text><ns0:rect x="1220" y="934.0" width="120" height="114.0" fill="#e3a461" /><ns0:text x="1215" y="919.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">1.2</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误除以 5</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">特殊结束符是否监督应预先规定。带权或混合目标的分母需要</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">按实际目标重新推导。</ns0:text></ns0:svg>
