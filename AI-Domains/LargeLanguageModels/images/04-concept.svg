<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">因果监督：先对齐下一个符号，再选出有效标签</title><desc id="desc">正文两个样本的真实输入与标签；SEP位置预测首答案，答案位置预测后继，EOS有效、PAD无效，共五个监督位置。</desc><rect width="1400" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="45" y="55" font-size="38" fill="#20343d" text-anchor="start" font-weight="700">因果监督：SEP 位置负责预测第一个答案</text>
<text x="45" y="105" font-size="27" fill="#6d7c84" text-anchor="start" font-weight="400">正文 encode 的两个样本；每列是一组对齐的输入与预测目标。</text>
