<text x="292" y="364" font-size="29" fill="#6d7c84" text-anchor="middle" font-weight="400">忽略</text>
<rect x="390" y="205" width="165" height="65" fill="#edf4f7" stroke="#d5dfe3" stroke-width="2"/>
<text x="472" y="249" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">4</text>
