<rect x="390" y="320" width="165" height="65" fill="#f5f6f7" stroke="#e1e7ea" stroke-width="2"/>
<text x="472" y="364" font-size="29" fill="#6d7c84" text-anchor="middle" font-weight="400">忽略</text>
