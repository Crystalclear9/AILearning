<text x="832" y="644" font-size="29" fill="#c67630" text-anchor="middle" font-weight="400">EOS</text>
<rect x="930" y="485" width="165" height="65" fill="#edf4f7" stroke="#d5dfe3" stroke-width="2"/>
<text x="1012" y="529" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">PAD</text>
<line x1="1012" y1="555" x2="1012" y2="586" stroke="#cbd5da" stroke-width="3"/>
<rect x="930" y="600" width="165" height="65" fill="#f5f6f7" stroke="#e1e7ea" stroke-width="2"/>
<text x="1012" y="644" font-size="29" fill="#6d7c84" text-anchor="middle" font-weight="400">忽略</text>
<rect x="1110" y="485" width="165" height="65" fill="#edf4f7" stroke="#d5dfe3" stroke-width="2"/>
<text x="1192" y="529" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">PAD</text>
<line x1="1192" y1="555" x2="1192" y2="586" stroke="#cbd5da" stroke-width="3"/>
<rect x="1110" y="600" width="165" height="65" fill="#f5f6f7" stroke="#e1e7ea" stroke-width="2"/>
<text x="1192" y="644" font-size="29" fill="#6d7c84" text-anchor="middle" font-weight="400">忽略</text>
<text x="210" y="710" font-size="28" fill="#c67630" text-anchor="start" font-weight="400">有效目标：7、EOS，共 2 个</text>
<line x1="45" y1="765" x2="1355" y2="765" stroke="#a9b8be" stroke-width="2"/>
<text x="60" y="825" font-size="32" fill="#20343d" text-anchor="start" font-weight="700">L = 五个有效位置的损失之和 ÷ 5</text>
<text x="60" y="875" font-size="26" fill="#6d7c84" text-anchor="start" font-weight="400">提示参与前向；填充和忽略标签不进入损失分母。</text></g></svg>
