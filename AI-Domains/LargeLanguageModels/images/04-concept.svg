<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1908" viewBox="0 0 1200 1908" role="img"><title>微调数据中的监督位置：机制、算例与边界</title><rect width="1200" height="1908" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">微调数据中的监督位置</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="477.75" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="597.75" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1147.75" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="397.75" viewBox="0 209 1200 430" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="65" y="235" width="200" height="100" rx="7" fill="#dce9f3" stroke="#80a0b3" /><text x="100" y="295" font-size="29" fill="#143651">指令</text><rect x="65" y="405" width="200" height="85" rx="7" fill="#eceeef" stroke="#80a0b3" /><text x="100" y="460" font-size="25" fill="#143651">不监督</text><rect x="290" y="235" width="200" height="100" rx="7" fill="#dce9f3" stroke="#80a0b3" /><text x="325" y="295" font-size="29" fill="#143651">上下文</text><rect x="290" y="405" width="200" height="85" rx="7" fill="#eceeef" stroke="#80a0b3" /><text x="325" y="460" font-size="25" fill="#143651">不监督</text><rect x="515" y="235" width="200" height="100" rx="7" fill="#a6d7c2" stroke="#80a0b3" /><text x="550" y="295" font-size="29" fill="#143651">答案1</text><rect x="515" y="405" width="200" height="85" rx="7" fill="#d8eee3" stroke="#80a0b3" /><text x="550" y="460" font-size="25" fill="#143651">计入损失</text><rect x="740" y="235" width="200" height="100" rx="7" fill="#a6d7c2" stroke="#80a0b3" /><text x="775" y="295" font-size="29" fill="#143651">答案2</text><rect x="740" y="405" width="200" height="85" rx="7" fill="#d8eee3" stroke="#80a0b3" /><text x="775" y="460" font-size="25" fill="#143651">计入损失</text><rect x="965" y="235" width="200" height="100" rx="7" fill="#a6d7c2" stroke="#80a0b3" /><text x="1000" y="295" font-size="29" fill="#143651">EOS</text><rect x="965" y="405" width="200" height="85" rx="7" fill="#d8eee3" stroke="#80a0b3" /><text x="1000" y="460" font-size="25" fill="#143651">计入损失</text><text x="130" y="610" font-size="25" fill="#143651">图例：浅蓝为输入条件，青绿为本例有效监督位置。</text></g></svg><text x="48" y="640.75" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  损失归约只计入本例监督位置</text><text x="48" y="1190.75" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  存储长度不是监督分母</text><g transform="translate(30,657.75) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输入 5 个 token：2 个提示＋3 个答案</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">答案损失：1、2、3</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">有效损失和：6</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">按答案平均：6÷3＝2</text></g><g transform="translate(45,1207.75) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">答案位置平均</text><rect x="1220" y="934.0" width="120" height="114.0" fill="#e3a461" /><text x="1215" y="919.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">1.2</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">错误除以 5</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">特殊结束符是否监督应预先规定。带权或混合目标的分母需要</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">按实际目标重新推导。</tspan></text></g></svg>
