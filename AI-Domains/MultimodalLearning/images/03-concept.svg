"81" rx="7" fill="rgb(217,239,240)" stroke="#80a0b3" /><ns0:text x="337" y="336.0" font-size="22" fill="#143651">0.1</ns0:text><ns0:rect x="410" y="285" width="81" height="81" rx="7" fill="rgb(199,231,230)" stroke="#80a0b3" /><ns0:text x="422" y="336.0" font-size="22" fill="#143651">0.2</ns0:text><ns0:rect x="495" y="285" width="81" height="81" rx="7" fill="rgb(145,207,200)" stroke="#80a0b3" /><ns0:text x="507" y="336.0" font-size="22" fill="#143651">0.5</ns0:text><ns0:rect x="580" y="285" width="81" height="81" rx="7" fill="rgb(217,239,240)" stroke="#80a0b3" /><ns0:text x="592" y="336.0" font-size="22" fill="#143651">0.1</ns0:text><ns0:rect x="240" y="370" width="81" height="81" rx="7" fill="rgb(226,243,245)" stroke="#80a0b3" /><ns0:text x="252" y="421.0" font-size="22" fill="#143651">0.05</ns0:text><ns0:rect x="325" y="370" width="81" height="81" rx="7" fill="rgb(226,243,245)" stroke="#80a0b3" /><ns0:text x="337" y="421.0" font-size="22" fill="#143651">0.05</ns0:text><ns0:rect x="410" y="370" width="81" height="81" rx="7" fill="rgb(217,239,240)" stroke="#80a0b3" /><ns0:text x="422" y="421.0" font-size="22" fill="#143651">0.1</ns0:text><ns0:rect x="495" y="370" width="81" height="81" rx="7" fill="rgb(199,231,230)" stroke="#80a0b3" /><ns0:text x="507" y="421.0" font-size="22" fill="#143651">0.2</ns0:text><ns0:rect x="580" y="370" width="81" height="81" rx="7" fill="rgb(127,199,190)" stroke="#80a0b3" /><ns0:text x="592" y="421.0" font-size="22" fill="#143651">0.6</ns0:text><ns0:text x="270" y="160" font-size="27" fill="#143651">S=5 个视觉位置</ns0:text><ns0:text x="40" y="340" font-size="24" fill="#143651">T=3 个文本查询</ns0:text><ns0:text x="750" y="280" font-size="27" fill="#143651">权重形状 T×S</ns0:text><ns0:text x="750" y="370" font-size="25" fill="#143651">输出保留 T 个位置</ns0:text><ns0:text x="160" y="635" font-size="25" fill="#143651">查询决定输出数量，键和值决定可读取的信息来源。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  查询数量决定融合输出长度</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  把权重按列归一化会改变读取</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">文本查询：3×4</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">视觉键：5×4；值：5×6</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">权重：3×5，沿视觉候选归一化</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">输出：3×6</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">形状依然合法不表示目标相同；多头、批次与输出投影须按正</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">文逐轴核对。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">逐行 softmax</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">误用逐列 softmax</ns0:text><ns0:rect x="835" y="870" width="100" height="75" fill="#8fcab6" stroke="#8caab9" stroke-width="1" /><ns0:text x="850" y="920" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.881</ns0:text><ns0:rect x="945" y="870" width="100" height="75" fill="#d9eaf4" stroke="#8caab9" stroke-width="1" /><ns0:text x="960" y="920" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.119</ns0:text><ns0:rect x="835" y="955" width="100" height="75" fill="#d9eaf4" stroke="#8caab9" stroke-width="1" /><ns0:text x="850" y="1005" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.500</ns0:text><ns0:rect x="945" y="955" width="100" height="75" fill="#d9eaf4" stroke="#8caab9" stroke-width="1" /><ns0:text x="960" y="1005" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.500</ns0:text><ns0:rect x="1165" y="870" width="100" height="75" fill="#8fcab6" stroke="#8caab9" stroke-width="1" /><ns0:text x="1180" y="920" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.881</ns0:text><ns0:rect x="1275" y="870" width="100" height="75" fill="#d9eaf4" stroke="#8caab9" stroke-width="1" /><ns0:text x="1290" y="920" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.500</ns0:text><ns0:rect x="1165" y="955" width="100" height="75" fill="#d9eaf4" stroke="#8caab9" stroke-width="1" /><ns0:text x="1180" y="1005" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.119</ns0:text><ns0:rect x="1275" y="955" width="100" height="75" fill="#d9eaf4" stroke="#8caab9" stroke-width="1" /><ns0:text x="1290" y="1005" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0.500</ns0:text><ns0:text x="805" y="1085" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">行和：[1,1]</ns0:text><ns0:text x="1135" y