<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>跨模态对比学习中的配对矩阵：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">跨模态对比学习中的配对矩阵</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="220" y="200" width="101" height="101" rx="7" fill="rgb(73,175,160)" stroke="#80a0b3" /><ns0:text x="232" y="263.0" font-size="22" fill="#143651">0.9</ns0:text><ns0:rect x="325" y="200" width="101" height="101" rx="7" fill="rgb(217,239,240)" stroke="#80a0b3" /><ns0:text x="337" y="263.0" font-size="22" fill="#143651">0.1</ns0:text><ns0:rect x="430" y="200" width="101" height="101" rx="7" fill="rgb(226,243,245)" stroke="#80a0b3" /><ns0:text x="442" y="263.0" font-size="22" fill="#143651">0.05</ns0:text><ns0:rect x="220" y="305" width="101" height="101" rx="7" fill="rgb(217,239,240)" stroke="#80a0b3" /><ns0:text x="232" y="368.0" font-size="22" fill="#143651">0.1</ns0:text><ns0:rect x="325" y="305" width="101" height="101" rx="7" fill="rgb(82,179,165)" stroke="#80a0b3" /><ns0:text x="337" y="368.0" font-size="22" fill="#143651">0.85</ns0:text><ns0:rect x="430" y="305" width="101" height="101" rx="7" fill="rgb(208,235,235)" stroke="#80a0b3" /><ns0:text x="442" y="368.0" font-size="22" fill="#143651">0.15</ns0:text><ns0:rect x="220" y="410" width="101" height="101" rx="7" fill="rgb(226,243,245)" stroke="#80a0b3" /><ns0:text x="232" y="473.0" font-size="22" fill="#143651">0.05</ns0:text><ns0:rect x="325" y="410" width="101" height="101" rx="7" fill="rgb(199,231,230)" stroke="#80a0b3" /><ns0:text x="337" y="473.0" font-size="22" fill="#143651">0.2</ns0:text><ns0:rect x="430" y="410" width="101" height="101" rx="7" fill="rgb(64,171,155)" stroke="#80a0b3" /><ns0:text x="442" y="473.0" font-size="22" fill="#143651">0.95</ns0:text><ns0:text x="250" y="160" font-size="26" fill="#143651">文本候选 →</ns0:text><ns0:text x="40" y="355" font-size="25" fill="#143651">图像查询 ↓</ns0:text><ns0:text x="650" y="280" font-size="26" fill="#143651">对角：已知配对</ns0:text><ns0:text x="650" y="355" font-size="25" fill="#143651">按行与按列分别归一化</ns0:text><ns0:text x="180" y="635" font-size="24" fill="#143651">相似度矩阵不等于概率矩阵；温度与方向决定概率化方式。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  三对图文形成九个配对分数</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  非对角候选也可能语义正确</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3 个图像查询；3 个文本候选</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">相似度矩阵：3×3</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">已知对角配对：3 个</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">其余候选：6 个，未必都是真负例</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">批内负例是目标构造，不是自动的真值判断；多正例与假负例</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">需按语义粒度处理。</ns0:text><ns0:rect x="845" y="875" width="160" height="60" fill="#cb5d55" stroke="#8caab9" stroke-width="1" /><ns0:circle cx="875" cy="945" r="15" fill="#445461" /><ns0:circle cx="975" cy="945" r="15" fill="#445461" /><ns0:text x="835" y="1000" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">红车</ns0:text><ns0:text x="1135" y="885" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">红色汽车：正例</ns0:text><ns0:text x="1135" y="945" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">红车：也可正例</ns0:text><ns0:text x="1135" y="1035" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">蓝船：语义不同</ns0:text><ns0:polygon points="1165,1070 1375,1070 1340,1110 1200,1110" fill="#5a8fbc" /></ns0:svg>
