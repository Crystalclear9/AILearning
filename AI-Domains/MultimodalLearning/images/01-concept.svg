<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2020" viewBox="0 0 1200 2020" role="img"><title>跨模态对比学习中的配对矩阵：机制、算例与边界</title><rect width="1200" height="2020" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">跨模态对比学习中的配对矩阵</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="589.675" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="709.675" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1259.675" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="509.675" viewBox="0 113 1200 551" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="220" y="200" width="101" height="101" rx="7" fill="rgb(73,175,160)" stroke="#80a0b3" /><text x="232" y="263.0" font-size="22" fill="#143651">0.9</text><rect x="325" y="200" width="101" height="101" rx="7" fill="rgb(217,239,240)" stroke="#80a0b3" /><text x="337" y="263.0" font-size="22" fill="#143651">0.1</text><rect x="430" y="200" width="101" height="101" rx="7" fill="rgb(226,243,245)" stroke="#80a0b3" /><text x="442" y="263.0" font-size="22" fill="#143651">0.05</text><rect x="220" y="305" width="101" height="101" rx="7" fill="rgb(217,239,240)" stroke="#80a0b3" /><text x="232" y="368.0" font-size="22" fill="#143651">0.1</text><rect x="325" y="305" width="101" height="101" rx="7" fill="rgb(82,179,165)" stroke="#80a0b3" /><text x="337" y="368.0" font-size="22" fill="#143651">0.85</text><rect x="430" y="305" width="101" height="101" rx="7" fill="rgb(208,235,235)" stroke="#80a0b3" /><text x="442" y="368.0" font-size="22" fill="#143651">0.15</text><rect x="220" y="410" width="101" height="101" rx="7" fill="rgb(226,243,245)" stroke="#80a0b3" /><text x="232" y="473.0" font-size="22" fill="#143651">0.05</text><rect x="325" y="410" width="101" height="101" rx="7" fill="rgb(199,231,230)" stroke="#80a0b3" /><text x="337" y="473.0" font-size="22" fill="#143651">0.2</text><rect x="430" y="410" width="101" height="101" rx="7" fill="rgb(64,171,155)" stroke="#80a0b3" /><text x="442" y="473.0" font-size="22" fill="#143651">0.95</text><text x="250" y="160" font-size="26" fill="#143651">文本候选 →</text><text x="40" y="355" font-size="25" fill="#143651">图像查询 ↓</text><text x="650" y="280" font-size="26" fill="#143651">对角：已知配对</text><text x="650" y="355" font-size="25" fill="#143651">按行与按列分别归一化</text><text x="180" y="635" font-size="24" fill="#143651">相似度矩阵不等于概率矩阵；温度与方向决定概率化方式。</text></g></svg><text x="48" y="752.675" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  三对图文形成九个配对分数</text><text x="48" y="1302.675" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  非对角候选也可能语义正确</text><g transform="translate(30,769.675) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3 个图像查询；3 个文本候选</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">相似度矩阵：3×3</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">已知对角配对：3 个</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">其余候选：6 个，未必都是真负例</text></g><g transform="translate(45,1319.675) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">批内负例是目标构造，不是自动的真值判断；多正例与假负例</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">需按语义粒度处理。</tspan></text><rect x="845" y="875" width="160" height="60" fill="#cb5d55" stroke="#8caab9" stroke-width="1" /><circle cx="875" cy="945" r="15" fill="#445461" /><circle cx="975" cy="945" r="15" fill="#445461" /><text x="835" y="1000" font-size="25" fill="#17374e" font-family="Microsoft YaHei,sans-serif">红车</text><text x="1135" y="885" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">红色汽车：正例</text><text x="1135" y="945" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">红车：也可正例</text><text x="1135" y="1035" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">蓝船：语义不同</text><polygon points="1165,1070 1375,1070 1340,1110 1200,1110" fill="#5a8fbc" /></g></svg>
