line x1="1010" y1="250" x2="1010" y2="470" stroke="#acc8d3" stroke-width="2"/><text x="260" y="650" font-size="25" fill="#143651">共同时间轴（毫秒）：相同序号不代表相同发生时间。</text></g></svg>
