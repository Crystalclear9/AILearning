<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>音视频时间对齐的共同时间轴：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">音视频时间对齐的共同时间轴</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:line x1="155" y1="230" x2="1090" y2="230" stroke="#417f9c" stroke-width="3" /><ns0:text x="35" y="239" font-size="27" fill="#143651">视频</ns0:text><ns0:circle cx="210" cy="230" r="18" fill="#15988d" stroke="#1d5871" /><ns0:text x="190" y="295" font-size="25" fill="#143651">0</ns0:text><ns0:circle cx="610" cy="230" r="18" fill="#15988d" stroke="#1d5871" /><ns0:text x="590" y="295" font-size="25" fill="#143651">40</ns0:text><ns0:circle cx="1010" cy="230" r="18" fill="#15988d" stroke="#1d5871" /><ns0:text x="990" y="295" font-size="25" fill="#143651">80</ns0:text><ns0:line x1="155" y1="490" x2="1090" y2="490" stroke="#417f9c" stroke-width="3" /><ns0:text x="35" y="499" font-size="27" fill="#143651">音频</ns0:text><ns0:circle cx="210" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><ns0:text x="190" y="555" font-size="25" fill="#143651">0</ns0:text><ns0:circle cx="410" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><ns0:text x="390" y="555" font-size="25" fill="#143651">20</ns0:text><ns0:circle cx="610" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><ns0:text x="590" y="555" font-size="25" fill="#143651">40</ns0:text><ns0:circle cx="810" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><ns0:text x="790" y="555" font-size="25" fill="#143651">60</ns0:text><ns0:circle cx="1010" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><ns0:text x="990" y="555" font-size="25" fill="#143651">80</ns0:text><ns0:line x1="210" y1="250" x2="210" y2="470" stroke="#acc8d3" stroke-width="2" /><ns0:line x1="610" y1="250" x2="610" y2="470" stroke="#acc8d3" stroke-width="2" /><ns0:line x1="1010" y1="250" x2="1010" y2="470" stroke="#acc8d3" stroke-width="2" /><ns0:text x="260" y="650" font-size="25" fill="#143651">共同时间轴（毫秒）：相同序号不代表相同发生时间。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  两采样率必须回到共同时间坐标</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相同索引可以相差四十毫秒</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">视频间隔：40 毫秒</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">音频特征间隔：20 毫秒</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第 3 个视频位置：80 毫秒</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第 3 个音频位置：40 毫秒</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">80</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">视频索引 2 的时刻</ns0:text><ns0:rect x="1220" y="953.0" width="120" height="95.0" fill="#e3a461" /><ns0:text x="1215" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">40</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">音频索引 2 的时刻</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">图中索引从零开始；实际还需设备起始偏移、丢帧、时间戳与</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">同步误差的检查。</ns0:text></ns0:svg>
