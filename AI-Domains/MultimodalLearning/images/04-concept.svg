<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1967" viewBox="0 0 1200 1967" role="img"><title>音视频时间对齐的共同时间轴：机制、算例与边界</title><rect width="1200" height="1967" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">音视频时间对齐的共同时间轴</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="536.95" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="656.95" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1206.95" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="456.95000000000005" viewBox="0 186 1200 494" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="155" y1="230" x2="1090" y2="230" stroke="#417f9c" stroke-width="3" /><text x="35" y="239" font-size="27" fill="#143651">视频</text><circle cx="210" cy="230" r="18" fill="#15988d" stroke="#1d5871" /><text x="190" y="295" font-size="25" fill="#143651">0</text><circle cx="610" cy="230" r="18" fill="#15988d" stroke="#1d5871" /><text x="590" y="295" font-size="25" fill="#143651">40</text><circle cx="1010" cy="230" r="18" fill="#15988d" stroke="#1d5871" /><text x="990" y="295" font-size="25" fill="#143651">80</text><line x1="155" y1="490" x2="1090" y2="490" stroke="#417f9c" stroke-width="3" /><text x="35" y="499" font-size="27" fill="#143651">音频</text><circle cx="210" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><text x="190" y="555" font-size="25" fill="#143651">0</text><circle cx="410" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><text x="390" y="555" font-size="25" fill="#143651">20</text><circle cx="610" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><text x="590" y="555" font-size="25" fill="#143651">40</text><circle cx="810" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><text x="790" y="555" font-size="25" fill="#143651">60</text><circle cx="1010" cy="490" r="18" fill="#ed9a46" stroke="#1d5871" /><text x="990" y="555" font-size="25" fill="#143651">80</text><line x1="210" y1="250" x2="210" y2="470" stroke="#acc8d3" stroke-width="2" /><line x1="610" y1="250" x2="610" y2="470" stroke="#acc8d3" stroke-width="2" /><line x1="1010" y1="250" x2="1010" y2="470" stroke="#acc8d3" stroke-width="2" /><text x="260" y="650" font-size="25" fill="#143651">共同时间轴（毫秒）：相同序号不代表相同发生时间。</text></g></svg><text x="48" y="699.95" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  两采样率必须回到共同时间坐标</text><text x="48" y="1249.95" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  相同索引可以相差四十毫秒</text><g transform="translate(30,716.95) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">视频间隔：40 毫秒</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">音频特征间隔：20 毫秒</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第 3 个视频位置：80 毫秒</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第 3 个音频位置：40 毫秒</text></g><g transform="translate(45,1266.95) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">80</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">视频索引 2 的时刻</text><rect x="1220" y="953.0" width="120" height="95.0" fill="#e3a461" /><text x="1215" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">40</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">音频索引 2 的时刻</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">图中索引从零开始；实际还需设备起始偏移、丢帧、时间戳与</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">同步误差的检查。</tspan></text></g></svg>
