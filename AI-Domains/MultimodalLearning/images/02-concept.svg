<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>融合前先辨认模态缺失：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">融合前先辨认模态缺失</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:rect x="65" y="170" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="80" y="205" font-size="25" fill="#143651">视觉编码</ns0:text><ns0:text x="80" y="248" font-size="22" fill="#143651">图像特征</ns0:text><ns0:rect x="65" y="470" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="80" y="505" font-size="25" fill="#143651">语言编码</ns0:text><ns0:text x="80" y="548" font-size="22" fill="#143651">文本特征</ns0:text><ns0:line x1="355" y1="225" x2="640" y2="345" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="355" y1="525" x2="640" y2="375" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="650" y="305" width="300" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="665" y="340" font-size="25" fill="#143651">融合模块</ns0:text><ns0:text x="665" y="383" font-size="22" fill="#143651">联合输出</ns0:text><ns0:path d="M355 525 H520 V625 H985 V410" fill="none" stroke="#ed9a46" stroke-width="3" stroke-dasharray="8 5" /><ns0:text x="540" y="660" font-size="24" fill="#143651">单模态对照：检验模型是否只依赖文本捷径</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  固定 50 个问题的人工对照计数</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  缺失不等于一张全零真实图像</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">仅图像答对 35：准确率 70%</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">仅文本答对 40：准确率 80%</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">双模态答对 41：准确率 82%</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">文本错配后答对 31：准确率 62%</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">缺失标志、训练中缺失机制和业务可见信息都要明确；更高置</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">信度也不自动表示更准确。</ns0:text><ns0:text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">合法零值观测</ns0:text><ns0:text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">没有观测</ns0:text><ns0:rect x="840" y="875" width="90" height="80" fill="#c7e4d8" stroke="#8caab9" stroke-width="1" /><ns0:text x="875" y="930" font-size="35" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0</ns0:text><ns0:rect x="945" y="875" width="90" height="80" fill="#c7e4d8" stroke="#8caab9" stroke-width="1" /><ns0:text x="980" y="930" font-size="35" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0</ns0:text><ns0:rect x="1170" y="875" width="90" height="80" fill="#dfe3e7" stroke="#8caab9" stroke-width="1" /><ns0:text x="1205" y="930" font-size="35" fill="#17374e" font-family="Microsoft YaHei,sans-serif">?</ns0:text><ns0:rect x="1275" y="875" width="90" height="80" fill="#dfe3e7" stroke="#8caab9" stroke-width="1" /><ns0:text x="1310" y="930" font-size="35" fill="#17374e" font-family="Microsoft YaHei,sans-serif">?</ns0:text><ns0:text x="835" y="1045" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">观测掩码=1</ns0:text><ns0:text x="1165" y="1045" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">观测掩码=0</ns0:text></ns0:svg>
