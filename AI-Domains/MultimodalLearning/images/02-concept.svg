<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2014" viewBox="0 0 1200 2014" role="img"><title>融合前先辨认模态缺失：机制、算例与边界</title><rect width="1200" height="2014" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">融合前先辨认模态缺失</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="584.125" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="704.125" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1254.125" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="504.125" viewBox="0 144 1200 545" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="65" y="170" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="80" y="205" font-size="25" fill="#143651">视觉编码</text><text x="80" y="248" font-size="22" fill="#143651">图像特征</text><rect x="65" y="470" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="80" y="505" font-size="25" fill="#143651">语言编码</text><text x="80" y="548" font-size="22" fill="#143651">文本特征</text><line x1="355" y1="225" x2="640" y2="345" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><line x1="355" y1="525" x2="640" y2="375" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="650" y="305" width="300" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="665" y="340" font-size="25" fill="#143651">融合模块</text><text x="665" y="383" font-size="22" fill="#143651">联合输出</text><path d="M355 525 H520 V625 H985 V410" fill="none" stroke="#ed9a46" stroke-width="3" stroke-dasharray="8 5" /><text x="540" y="660" font-size="24" fill="#143651">单模态对照：检验模型是否只依赖文本捷径</text></g></svg><text x="48" y="747.125" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  固定 50 个问题的人工对照计数</text><text x="48" y="1297.125" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  缺失不等于一张全零真实图像</text><g transform="translate(30,764.125) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">仅图像答对 35：准确率 70%</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">仅文本答对 40：准确率 80%</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">双模态答对 41：准确率 82%</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">文本错配后答对 31：准确率 62%</text></g><g transform="translate(45,1314.125) scale(1.48) translate(-785,-800)"><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">缺失标志、训练中缺失机制和业务可见信息都要明确；更高置</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">信度也不自动表示更准确。</tspan></text><text x="805" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">合法零值观测</text><text x="1135" y="830" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">没有观测</text><rect x="840" y="875" width="90" height="80" fill="#c7e4d8" stroke="#8caab9" stroke-width="1" /><text x="875" y="930" font-size="35" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0</text><rect x="945" y="875" width="90" height="80" fill="#c7e4d8" stroke="#8caab9" stroke-width="1" /><text x="980" y="930" font-size="35" fill="#17374e" font-family="Microsoft YaHei,sans-serif">0</text><rect x="1170" y="875" width="90" height="80" fill="#dfe3e7" stroke="#8caab9" stroke-width="1" /><text x="1205" y="930" font-size="35" fill="#17374e" font-family="Microsoft YaHei,sans-serif">?</text><rect x="1275" y="875" width="90" height="80" fill="#dfe3e7" stroke="#8caab9" stroke-width="1" /><text x="1310" y="930" font-size="35" fill="#17374e" font-family="Microsoft YaHei,sans-serif">?</text><text x="835" y="1045" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">观测掩码=1</text><text x="1165" y="1045" font-size="26" fill="#17374e" font-family="Microsoft YaHei,sans-serif">观测掩码=0</text></g></svg>
