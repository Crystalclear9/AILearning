<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>融合前先辨认模态缺失</title>
<desc>原创教学示意：视觉特征|来自图像编码器;文本特征|来自语言编码器;融合模块|结合两类证据;缺失测试|只给一种模态再评估</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">融合前先辨认模态缺失</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">视觉特征</text>
<text x="53" y="160" font-size="21" fill="#16324f">来自图像编码器</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">文本特征</text>
<text x="603" y="160" font-size="21" fill="#16324f">来自语言编码器</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">融合模块</text>
<text x="53" y="330" font-size="21" fill="#16324f">结合两类证据</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">缺失测试</text>
<text x="603" y="330" font-size="21" fill="#16324f">只给一种模态再评估</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="60" y="535" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="72" y="565" font-size="23" fill="#173c53">图像编码</text><text x="72" y="594" font-size="18" fill="#173c53">视觉证据</text><rect x="60" y="665" width="210" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="72" y="695" font-size="23" fill="#173c53">文本编码</text><text x="72" y="724" font-size="18" fill="#173c53">语言证据</text><path d="M285,570 L495,610" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M285,700 L495,640" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="510" y="590" width="260" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="522" y="620" font-size="23" fill="#173c53">融合模型</text><text x="522" y="649" font-size="18" fill="#173c53">两类证据共同输入</text><path d="M785,625 L865,625" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="880" y="590" width="205" height="75" rx="7" fill="#edf5fb" stroke="#8faabc"/><text x="892" y="620" font-size="23" fill="#173c53">评价输出</text><text x="892" y="649" font-size="18" fill="#173c53">再做缺失对照</text><text x="330" y="755" font-size="19" fill="#173c53">对照实验：完整双输入、仅图像、仅文本；区分真实缺失与不自然扰乱。</text></g></svg>