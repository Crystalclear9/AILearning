<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="628" viewBox="0 47 960 628" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">颜色形状边际相同但红色物体形状不同的两个场景</title><desc id="artwork-desc">颜色和形状都在，绑定关系却可能已经丢失</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="577.32093"/></clipPath></defs><rect width="960" height="675" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(-62.190698 16.744186) scale(0.846512)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><rect x="103" y="70" width="1075" height="682" fill="#ffffff"/><title id="title">颜色和形状都在，绑定关系却可能已经丢失</title><desc id="desc">颜色和形状都在，绑定关系却可能已经丢失</desc><rect width="1280" height="800" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#748e9f"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3348"><text x="640" y="115" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400">问题：红色物体是什么形状？</text><text x="320" y="180" font-size="31.304945px" fill="#1f3348" text-anchor="middle" font-weight="400">场景 A</text><circle cx="205" cy="280" r="62" fill="#bb3a32" stroke="#bb3a32" stroke-width="2"/><rect x="365" y="218" width="124" height="124" fill="#2479b3" stroke="none" stroke-width="2"/><text x="320" y="400" font-size="31.304945px" fill="#b14039" text-anchor="middle" font-weight="400">答案：圆形</text><text x="320" y="458" font-size="26.375px" fill="#47586b" text-anchor="middle" font-weight="400">左 / 右位置、颜色数、形状数均相同</text><line fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)" x1="320" y1="485" x2="640" y2="565"/><text x="960" y="180" font-size="31.304945px" fill="#1f3348" text-anchor="middle" font-weight="400">场景 B</text><circle cx="845" cy="280" r="62" fill="#1773a5" stroke="#1773a5" stroke-width="2"/><rect x="1005" y="218" width="124" height="124" fill="#c34c45" stroke="none" stroke-width="2"/><text x="960" y="400" font-size="31.304945px" fill="#b14039" text-anchor="middle" font-weight="400">答案：方形</text><text x="960" y="458" font-size="26.375px" fill="#47586b" text-anchor="middle" font-weight="400">左 / 右位置、颜色数、形状数均相同</text><line fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)" x1="960" y1="485" x2="640" y2="565"/><rect x="155" y="590" width="970" height="80" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="640" y="640" font-size="31.304945px" fill="#2479b3" text-anchor="middle" font-weight="400">分别编码颜色、形状、位置，再平均：六个分量全为 0.5</text><text x="640" y="730" font-size="31.304945px" fill="#1f3348" text-anchor="middle" font-weight="400">相同摘要 + 相同问题 → 相同输出，无法同时答对这两个场景</text></g></g></g></g></svg>