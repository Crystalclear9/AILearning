<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><ns0:title>额外证据可能使单次预测更不确定</ns0:title><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></ns0:marker></ns0:defs><ns0:rect width="1200" height="750" fill="#f5faff" /><ns0:rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:text x="38" y="50" font-size="30" fill="#143651">额外证据可能使单次预测更不确定</ns0:text><ns0:line x1="130" y1="570" x2="1090" y2="570" stroke="#407e9e" stroke-width="3" /><ns0:line x1="130" y1="570" x2="130" y2="180" stroke="#407e9e" stroke-width="3" /><ns0:text x="70" y="577" font-size="20" fill="#143651">0</ns0:text><ns0:line x1="130" y1="570" x2="1090" y2="570" stroke="#d9e7ef" stroke-width="1" /><ns0:text x="70" y="397.0" font-size="20" fill="#143651">0.5</ns0:text><ns0:line x1="130" y1="390.0" x2="1090" y2="390.0" stroke="#d9e7ef" stroke-width="1" /><ns0:text x="70" y="217" font-size="20" fill="#143651">1</ns0:text><ns0:line x1="130" y1="210" x2="1090" y2="210" stroke="#d9e7ef" stroke-width="1" /><ns0:rect x="190.0" y="246.0" width="45" height="324.0" rx="8" fill="#15988d" stroke="#82a2b7" /><ns0:text x="188.0" y="226.0" font-size="18" fill="#143651">0.90</ns0:text><ns0:rect x="245.0" y="390.0" width="45" height="180.0" rx="8" fill="#ed9a46" stroke="#82a2b7" /><ns0:text x="243.0" y="370.0" font-size="18" fill="#143651">0.50</ns0:text><ns0:text x="190.0" y="620" font-size="22" fill="#143651">类别 1</ns0:text><ns0:rect x="615.0" y="534.0" width="45" height="36.0" rx="8" fill="#15988d" stroke="#82a2b7" /><ns0:text x="613.0" y="514.0" font-size="18" fill="#143651">0.10</ns0:text><ns0:rect x="670.0" y="390.0" width="45" height="180.0" rx="8" fill="#ed9a46" stroke="#82a2b7" /><ns0:text x="668.0" y="370.0" font-size="18" fill="#143651">0.50</ns0:text><ns0:text x="615.0" y="620" font-size="22" fill="#143651">类别 2</ns0:text><ns0:rect x="180" y="125" width="20" height="20" rx="8" fill="#15988d" stroke="#82a2b7" /><ns0:text x="210" y="145" font-size="21" fill="#143651">原预测</ns0:text><ns0:rect x="480" y="125" width="20" height="20" rx="8" fill="#ed9a46" stroke="#82a2b7" /><ns0:text x="510" y="145" font-size="21" fill="#143651">特定新证据后</ns0:text><ns0:text x="75" y="665" font-size="24" fill="#143651">真实后验反例：P(E|类1)=0.1，P(E|类2)=0.9。</ns0:text><ns0:text x="75" y="703" font-size="23" fill="#143651">证据概率=0.18；后验各 0.5。平均减熵针对真实分布，并非任意模型。</ns0:text></ns0:g></ns0:svg>
