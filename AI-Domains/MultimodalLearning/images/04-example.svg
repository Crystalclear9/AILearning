<text x="40" y="724" font-size="30" fill="#2a3645" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">重复一次对应，可表达局部伸缩；不是任意交换顺序。</text>
