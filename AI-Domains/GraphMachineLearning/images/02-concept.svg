<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>邻居采样的计算树与重复节点</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">邻居采样的计算树与重复节点</text><circle cx="590" cy="160" r="28" fill="#15988d" stroke="#1d5871"/><text x="576.0" y="168" font-size="23" fill="white">v</text><line x1="590" y1="190" x2="310" y2="300" stroke="#417f9c" stroke-width="3"/><circle cx="310" cy="320" r="27" fill="#15988d" stroke="#1d5871"/><text x="296.5" y="328" font-size="23" fill="white">u1</text><line x1="310" y1="345" x2="200" y2="485" stroke="#417f9c" stroke-width="3"/><circle cx="200" cy="510" r="27" fill="#15988d" stroke="#1d5871"/><text x="186.5" y="518" font-size="23" fill="white">w1</text><line x1="310" y1="345" x2="420" y2="485" stroke="#417f9c" stroke-width="3"/><circle cx="420" cy="510" r="27" fill="#15988d" stroke="#1d5871"/><text x="406.5" y="518" font-size="23" fill="white">w2</text><line x1="590" y1="190" x2="870" y2="300" stroke="#417f9c" stroke-width="3"/><circle cx="870" cy="320" r="27" fill="#15988d" stroke="#1d5871"/><text x="856.5" y="328" font-size="23" fill="white">u2</text><line x1="870" y1="345" x2="760" y2="485" stroke="#417f9c" stroke-width="3"/><circle cx="760" cy="510" r="27" fill="#15988d" stroke="#1d5871"/><text x="746.5" y="518" font-size="23" fill="white">w3</text><line x1="870" y1="345" x2="980" y2="485" stroke="#417f9c" stroke-width="3"/><circle cx="980" cy="510" r="27" fill="#15988d" stroke="#1d5871"/><text x="966.5" y="518" font-size="23" fill="white">w4</text><text x="80" y="145" font-size="25" fill="#143651">种子 1 个</text><text x="40" y="280" font-size="24" fill="#143651">第一层最多 2 个槽位</text><text x="40" y="605" font-size="24" fill="#143651">第二层最多 4 个槽位</text><text x="220" y="650" font-size="25" fill="#143651">最多 7 个展开槽位；不同槽位可能指向同一个实际节点。</text></g></svg>
