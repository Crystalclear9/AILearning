<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2046" viewBox="0 0 1200 2046" role="img"><title>邻居采样的计算树与重复节点：机制、算例与边界</title><rect width="1200" height="2046" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">邻居采样的计算树与重复节点</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="615.575" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="735.575" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1285.575" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="535.575" viewBox="0 100 1200 579" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><circle cx="590" cy="160" r="28" fill="#15988d" stroke="#1d5871" /><text x="576.0" y="168" font-size="23" fill="white">v</text><line x1="590" y1="190" x2="310" y2="300" stroke="#417f9c" stroke-width="3" /><circle cx="310" cy="320" r="27" fill="#15988d" stroke="#1d5871" /><text x="296.5" y="328" font-size="23" fill="white">u1</text><line x1="310" y1="345" x2="200" y2="485" stroke="#417f9c" stroke-width="3" /><circle cx="200" cy="510" r="27" fill="#15988d" stroke="#1d5871" /><text x="186.5" y="518" font-size="23" fill="white">w1</text><line x1="310" y1="345" x2="420" y2="485" stroke="#417f9c" stroke-width="3" /><circle cx="420" cy="510" r="27" fill="#15988d" stroke="#1d5871" /><text x="406.5" y="518" font-size="23" fill="white">w2</text><line x1="590" y1="190" x2="870" y2="300" stroke="#417f9c" stroke-width="3" /><circle cx="870" cy="320" r="27" fill="#15988d" stroke="#1d5871" /><text x="856.5" y="328" font-size="23" fill="white">u2</text><line x1="870" y1="345" x2="760" y2="485" stroke="#417f9c" stroke-width="3" /><circle cx="760" cy="510" r="27" fill="#15988d" stroke="#1d5871" /><text x="746.5" y="518" font-size="23" fill="white">w3</text><line x1="870" y1="345" x2="980" y2="485" stroke="#417f9c" stroke-width="3" /><circle cx="980" cy="510" r="27" fill="#15988d" stroke="#1d5871" /><text x="966.5" y="518" font-size="23" fill="white">w4</text><text x="80" y="145" font-size="25" fill="#143651">种子 1 个</text><text x="40" y="280" font-size="24" fill="#143651">第一层最多 2 个槽位</text><text x="40" y="605" font-size="24" fill="#143651">第二层最多 4 个槽位</text><text x="220" y="650" font-size="25" fill="#143651">最多 7 个展开槽位；不同槽位可能指向同一个实际节点。</text></g></svg><text x="48" y="778.575" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  两层扇出展开最多七个槽位</text><text x="48" y="1328.575" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  槽位数量不等于不同节点数量</text><g transform="translate(30,795.575) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">种子：1 个槽位</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第一层扇出 2：最多 2 个</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第二层扇出 2：最多 4 个</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">合计：1＋2＋4＝7</text></g><g transform="translate(45,1345.575) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">7</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">展开槽位上界</text><rect x="1220" y="939.4285714285714" width="120" height="108.57142857142857" fill="#e3a461" /><text x="1215" y="924.4285714285714" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">4</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">可能独立节点数示例</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">右柱是重复邻居导致的一个可能数量，不是固定结果；应按实</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">际采样索引去重后计算节点数。</tspan></text></g></svg>
