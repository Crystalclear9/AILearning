<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>邻居采样的计算树与重复节点：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">邻居采样的计算树与重复节点</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:circle cx="590" cy="160" r="28" fill="#15988d" stroke="#1d5871" /><ns0:text x="576.0" y="168" font-size="23" fill="white">v</ns0:text><ns0:line x1="590" y1="190" x2="310" y2="300" stroke="#417f9c" stroke-width="3" /><ns0:circle cx="310" cy="320" r="27" fill="#15988d" stroke="#1d5871" /><ns0:text x="296.5" y="328" font-size="23" fill="white">u1</ns0:text><ns0:line x1="310" y1="345" x2="200" y2="485" stroke="#417f9c" stroke-width="3" /><ns0:circle cx="200" cy="510" r="27" fill="#15988d" stroke="#1d5871" /><ns0:text x="186.5" y="518" font-size="23" fill="white">w1</ns0:text><ns0:line x1="310" y1="345" x2="420" y2="485" stroke="#417f9c" stroke-width="3" /><ns0:circle cx="420" cy="510" r="27" fill="#15988d" stroke="#1d5871" /><ns0:text x="406.5" y="518" font-size="23" fill="white">w2</ns0:text><ns0:line x1="590" y1="190" x2="870" y2="300" stroke="#417f9c" stroke-width="3" /><ns0:circle cx="870" cy="320" r="27" fill="#15988d" stroke="#1d5871" /><ns0:text x="856.5" y="328" font-size="23" fill="white">u2</ns0:text><ns0:line x1="870" y1="345" x2="760" y2="485" stroke="#417f9c" stroke-width="3" /><ns0:circle cx="760" cy="510" r="27" fill="#15988d" stroke="#1d5871" /><ns0:text x="746.5" y="518" font-size="23" fill="white">w3</ns0:text><ns0:line x1="870" y1="345" x2="980" y2="485" stroke="#417f9c" stroke-width="3" /><ns0:circle cx="980" cy="510" r="27" fill="#15988d" stroke="#1d5871" /><ns0:text x="966.5" y="518" font-size="23" fill="white">w4</ns0:text><ns0:text x="80" y="145" font-size="25" fill="#143651">种子 1 个</ns0:text><ns0:text x="40" y="280" font-size="24" fill="#143651">第一层最多 2 个槽位</ns0:text><ns0:text x="40" y="605" font-size="24" fill="#143651">第二层最多 4 个槽位</ns0:text><ns0:text x="220" y="650" font-size="25" fill="#143651">最多 7 个展开槽位；不同槽位可能指向同一个实际节点。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  两层扇出展开最多七个槽位</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  槽位数量不等于不同节点数量</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">种子：1 个槽位</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第一层扇出 2：最多 2 个</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">第二层扇出 2：最多 4 个</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">合计：1＋2＋4＝7</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">7</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">展开槽位上界</ns0:text><ns0:rect x="1220" y="939.4285714285714" width="120" height="108.57142857142857" fill="#e3a461" /><ns0:text x="1215" y="924.4285714285714" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">4</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">可能独立节点数示例</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">右柱是重复邻居导致的一个可能数量，不是固定结果；应按实</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">际采样索引去重后计算节点数。</ns0:text></ns0:svg>
