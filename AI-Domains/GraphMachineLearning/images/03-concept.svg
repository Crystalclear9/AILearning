<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>GCN 的对称度归一化：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">GCN 的对称度归一化</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:circle cx="300" cy="340" r="35" fill="#15988d" stroke="#1d5871" /><ns0:text x="120" y="280" font-size="27" fill="#143651">度 4</ns0:text><ns0:line x1="300" y1="340" x2="410.0" y2="340.0" stroke="#a1becc" stroke-width="3" /><ns0:line x1="300" y1="340" x2="245.00000000000003" y2="452.58330249197707" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="245.00000000000003" cy="452.58330249197707" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:line x1="300" y1="340" x2="244.99999999999994" y2="227.416697508023" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="244.99999999999994" cy="227.416697508023" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:circle cx="890" cy="340" r="35" fill="#15988d" stroke="#1d5871" /><ns0:text x="1020" y="260" font-size="27" fill="#143651">度 9</ns0:text><ns0:line x1="890" y1="340" x2="1000.0" y2="340.0" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="1000.0" cy="340.0" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:line x1="890" y1="340" x2="967.7817459305202" y2="431.9238815542512" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="967.7817459305202" cy="431.9238815542512" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:line x1="890" y1="340" x2="890.0" y2="470.0" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="890.0" cy="470.0" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:line x1="890" y1="340" x2="812.2182540694798" y2="431.9238815542512" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="812.2182540694798" cy="431.9238815542512" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:line x1="890" y1="340" x2="780.0" y2="340.0" stroke="#a1becc" stroke-width="3" /><ns0:line x1="890" y1="340" x2="812.2182540694797" y2="248.07611844574882" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="812.2182540694797" cy="248.07611844574882" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:line x1="890" y1="340" x2="890.0" y2="210.0" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="890.0" cy="210.0" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:line x1="890" y1="340" x2="967.7817459305202" y2="248.07611844574882" stroke="#a1becc" stroke-width="3" /><ns0:circle cx="967.7817459305202" cy="248.07611844574882" r="10" fill="#bdd8e4" stroke="#1d5871" /><ns0:line x1="350" y1="340" x2="840" y2="340" stroke="#ed9a46" stroke-width="6" /><ns0:text x="480" y="290" font-size="25" fill="#143651">边系数</ns0:text><ns0:text x="550" y="380" font-size="31" fill="#143651">1</ns0:text><ns0:line x1="510" y1="397" x2="610" y2="397" stroke="#417f9c" stroke-width="3" /><ns0:text x="545" y="435" font-size="31" fill="#143651">6</ns0:text><ns0:text x="150" y="635" font-size="24" fill="#143651">加自环后两端度数为 4 与 9，系数为平方根乘积的倒数。</ns0:text><ns0:path d="M280 312 C245 205 355 205 320 312" fill="none" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="135" y="330" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">自环</ns0:text><ns0:path d="M870 312 C835 205 945 205 910 312" fill="none" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="1020" y="310" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">自环</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  边系数来自两端加环后的度数</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  不等于按接收端度数取平均</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">中心加环后度：4</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">邻居加环后度：9</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">平方根乘积：2×3＝6</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">该边归一化系数为六分之一</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="921.3333333333334" width="120" height="126.66666666666666" fill="#169b8d" /><ns0:text x="895" y="906.3333333333334" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.16667</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">对称归一化系数</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.25</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">只用中心度倒数</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">对称归一化通常不是逐行和为一的概率权重；改变归一化会改</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">变传播算子。</ns0:text></ns0:svg>
