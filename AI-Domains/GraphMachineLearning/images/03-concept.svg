<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="1620.0" viewBox="0 0 1280 1620" role="img"><title>一层 GCN：先变通道，再逐边混合，最后加偏置与 ReLU</title><rect width="1280" height="1050" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">一层 GCN：先变通道，再逐边混合，最后加偏置与 ReLU</text><text x="60" y="120" font-size="27" fill="#74888d" text-anchor="start">原例三节点链 + 单位自环；度为 (2,3,2)，每个节点两个通道。</text><line x1="285" y1="210" x2="595" y2="210" stroke="#276a80" stroke-width="4" /><circle cx="240" cy="210" r="36" fill="#276a80" /><text x="240" y="220" font-size="28" fill="white" text-anchor="middle">0</text><text x="240" y="280" font-size="29" fill="#19343e" text-anchor="middle">X = (1,0)</text><text x="240" y="390" font-size="32" fill="#276a80" text-anchor="middle">(1,−1)</text><line x1="240" y1="300" x2="240" y2="350" stroke="#276a80" stroke-width="4" /><path d="M234.25,339.47 L240.00,350.00 L245.75,339.47" fill="none" stroke="#276a80" stroke-width="4" /><line x1="685" y1="210" x2="995" y2="210" stroke="#276a80" stroke-width="4" /><circle cx="640" cy="210" r="36" fill="#276a80" /><text x="640" y="220" font-size="28" fill="white" text-anchor="middle">1</text><text x="640" y="280" font-size="29" fill="#19343e" text-anchor="middle">X = (0,2)</text><text x="640" y="390" font-size="32" fill="#276a80" text-anchor="middle">(4,2)</text><line x1="640" y1="300" x2="640" y2="350" stroke="#276a80" stroke-width="4" /><path d="M634.25,339.47 L640.00,350.00 L645.75,339.47" fill="none" stroke="#276a80" stroke-width="4" /><circle cx="1040" cy="210" r="36" fill="#276a80" /><text x="1040" y="220" font-size="28" fill="white" text-anchor="middle">2</text><text x="1040" y="280" font-size="29" fill="#19343e" text-anchor="middle">X = (3,1)</text><text x="1040" y="390" font-size="32" fill="#276a80" text-anchor="middle">(5,−2)</text><line x1="1040" y1="300" x2="1040" y2="350" stroke="#276a80" stroke-width="4" /><path d="M1034.25,339.47 L1040.00,350.00 L1045.75,339.47" fill="none" stroke="#276a80" stroke-width="4" /><text x="60" y="350" font-size="27" fill="#19343e" text-anchor="start">右乘 W</text><text x="60" y="425" font-size="27" fill="#74888d" text-anchor="start">W 的两行：(1,−1)、(2,1)</text><line x1="240" y1="450" x2="240" y2="500" stroke="#c2673f" stroke-width="4" /><path d="M234.25,489.47 L240.00,500.00 L245.75,489.47" fill="none" stroke="#c2673f" stroke-width="4" /><text x="240" y="540" font-size="27" fill="#c2673f" text-anchor="middle">节点 0 → 1</text><text x="240" y="590" font-size="28" fill="#19343e" text-anchor="middle">(0.4082,−0.4082)</text><line x1="640" y1="450" x2="640" y2="500" stroke="#c2673f" stroke-width="4" /><path d="M634.25,489.47 L640.00,500.00 L645.75,489.47" fill="none" stroke="#c2673f" stroke-width="4" /><text x="640" y="540" font-size="27" fill="#c2673f" text-anchor="middle">节点 1 自环</text><text x="640" y="590" font-size="28" fill="#19343e" text-anchor="middle">(1.3333,0.6667)</text><line x1="1040" y1="450" x2="1040" y2="500" stroke="#c2673f" stroke-width="4" /><path d="M1034.25,489.47 L1040.00,500.00 L1045.75,489.47" fill="none" stroke="#c2673f" stroke-width="4" /><text x="1040" y="540" font-size="27" fill="#c2673f" text-anchor="middle">节点 2 → 1</text><text x="1040" y="590" font-size="28" fill="#19343e" text-anchor="middle">(2.0412,−0.8165)</text><text x="60" y="675" font-size="29" fill="#19343e" text-anchor="start">中心 1：相加 (3.7828,−0.5581) + 偏置 (0.1,−0.2)</text><text x="60" y="735" font-size="31" fill="#c2673f" text-anchor="start">激活前 (3.8828,−0.7581) → ReLU → (3.8828,0)</text><line x1="60" y1="785" x2="1220" y2="785" stroke="#dbe5e8" stroke-width="2" /><text x="60" y="845" font-size="30" fill="#19343e" text-anchor="start">全部输出</text><text x="240" y="920" font-size="31" fill="#276a80" text-anchor="middle">(2.2330,0.1165)</text><text x="640" y="920" font-size="31" fill="#276a80" text-anchor="middle">(3.8828,0)</text><text x="1040" y="920" font-size="31" fill="#276a80" text-anchor="middle">(4.2330,0)</text><text x="60" y="1000" font-size="27" fill="#19343e" text-anchor="start">每个输出都读同一份旧 X；零值来自负通道被 ReLU 截断，不是节点没收到消息。</text></g><g transform="translate(0,1050) scale(1.38889)"><metadata>
