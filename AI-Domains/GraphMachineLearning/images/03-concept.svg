<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>GCN 的对称度归一化</title>
<desc>原创教学示意：先加自环|邻接矩阵变为 A＋I;计算度数|按加环后的邻接计算;边系数|两端度数平方根乘积的倒数;特征更新|归一化邻接乘 XW</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">GCN 的对称度归一化</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">先加自环</text>
<text x="53" y="160" font-size="21" fill="#16324f">邻接矩阵变为 A＋I</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">计算度数</text>
<text x="603" y="160" font-size="21" fill="#16324f">按加环后的邻接计算</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">边系数</text>
<text x="53" y="330" font-size="21" fill="#16324f">两端度数平方根乘积的倒数</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">特征更新</text>
<text x="603" y="330" font-size="21" fill="#16324f">归一化邻接乘 XW</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><circle cx="220" cy="620" r="25" fill="#daedf7" stroke="#377999"/><text x="205" y="627" font-size="19" fill="#173c53">u</text><circle cx="750" cy="620" r="25" fill="#daedf7" stroke="#377999"/><text x="735" y="627" font-size="19" fill="#173c53">v</text><path d="M250,620 L710,620" stroke="#2877a7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="140" y="550" font-size="23" fill="#173c53">加环后度数 4</text><text x="675" y="550" font-size="23" fill="#173c53">加环后度数 9</text><text x="370" y="590" font-size="24" fill="#173c53">边系数：六分之一</text><text x="125" y="715" font-size="20" fill="#173c53">自身系数：四分之一</text><text x="680" y="715" font-size="20" fill="#173c53">自身系数：九分之一</text><text x="120" y="760" font-size="19" fill="#173c53">对称归一化同时使用边两端度数；这些系数一般不构成行和为一的概率。</text></g></svg>