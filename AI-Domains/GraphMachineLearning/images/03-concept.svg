<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1963" viewBox="0 0 1200 1963" role="img"><title>GCN 的对称度归一化：机制、算例与边界</title><rect width="1200" height="1963" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">GCN 的对称度归一化</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="533.25" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="653.25" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1203.25" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="453.25" viewBox="0 174 1200 490" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><circle cx="300" cy="340" r="35" fill="#15988d" stroke="#1d5871" /><text x="120" y="280" font-size="27" fill="#143651">度 4</text><line x1="300" y1="340" x2="410.0" y2="340.0" stroke="#a1becc" stroke-width="3" /><line x1="300" y1="340" x2="245.00000000000003" y2="452.58330249197707" stroke="#a1becc" stroke-width="3" /><circle cx="245.00000000000003" cy="452.58330249197707" r="10" fill="#bdd8e4" stroke="#1d5871" /><line x1="300" y1="340" x2="244.99999999999994" y2="227.416697508023" stroke="#a1becc" stroke-width="3" /><circle cx="244.99999999999994" cy="227.416697508023" r="10" fill="#bdd8e4" stroke="#1d5871" /><circle cx="890" cy="340" r="35" fill="#15988d" stroke="#1d5871" /><text x="1020" y="260" font-size="27" fill="#143651">度 9</text><line x1="890" y1="340" x2="1000.0" y2="340.0" stroke="#a1becc" stroke-width="3" /><circle cx="1000.0" cy="340.0" r="10" fill="#bdd8e4" stroke="#1d5871" /><line x1="890" y1="340" x2="967.7817459305202" y2="431.9238815542512" stroke="#a1becc" stroke-width="3" /><circle cx="967.7817459305202" cy="431.9238815542512" r="10" fill="#bdd8e4" stroke="#1d5871" /><line x1="890" y1="340" x2="890.0" y2="470.0" stroke="#a1becc" stroke-width="3" /><circle cx="890.0" cy="470.0" r="10" fill="#bdd8e4" stroke="#1d5871" /><line x1="890" y1="340" x2="812.2182540694798" y2="431.9238815542512" stroke="#a1becc" stroke-width="3" /><circle cx="812.2182540694798" cy="431.9238815542512" r="10" fill="#bdd8e4" stroke="#1d5871" /><line x1="890" y1="340" x2="780.0" y2="340.0" stroke="#a1becc" stroke-width="3" /><line x1="890" y1="340" x2="812.2182540694797" y2="248.07611844574882" stroke="#a1becc" stroke-width="3" /><circle cx="812.2182540694797" cy="248.07611844574882" r="10" fill="#bdd8e4" stroke="#1d5871" /><line x1="890" y1="340" x2="890.0" y2="210.0" stroke="#a1becc" stroke-width="3" /><circle cx="890.0" cy="210.0" r="10" fill="#bdd8e4" stroke="#1d5871" /><line x1="890" y1="340" x2="967.7817459305202" y2="248.07611844574882" stroke="#a1becc" stroke-width="3" /><circle cx="967.7817459305202" cy="248.07611844574882" r="10" fill="#bdd8e4" stroke="#1d5871" /><line x1="350" y1="340" x2="840" y2="340" stroke="#ed9a46" stroke-width="6" /><text x="480" y="290" font-size="25" fill="#143651">边系数</text><text x="550" y="380" font-size="31" fill="#143651">1</text><line x1="510" y1="397" x2="610" y2="397" stroke="#417f9c" stroke-width="3" /><text x="545" y="435" font-size="31" fill="#143651">6</text><text x="150" y="635" font-size="24" fill="#143651">加自环后两端度数为 4 与 9，系数为平方根乘积的倒数。</text><path d="M280 312 C245 205 355 205 320 312" fill="none" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="135" y="330" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">自环</text><path d="M870 312 C835 205 945 205 910 312" fill="none" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="1020" y="310" font-size="24" fill="#17374e" font-family="Microsoft YaHei,sans-serif">自环</text></g></svg><text x="48" y="696.25" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  边系数来自两端加环后的度数</text><text x="48" y="1246.25" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  不等于按接收端度数取平均</text><g transform="translate(30,713.25) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">中心加环后度：4</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">邻居加环后度：9</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">平方根乘积：2×3＝6</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">该边归一化系数为六分之一</text></g><g transform="translate(45,1263.25) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="921.3333333333334" width="120" height="126.66666666666666" fill="#169b8d" /><text x="895" y="906.3333333333334" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.16667</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">对称归一化系数</text><rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">0.25</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">只用中心度倒数</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">对称归一化通常不是逐行和为一的概率权重；改变归一化会改</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">变传播算子。</tspan></text></g></svg>
