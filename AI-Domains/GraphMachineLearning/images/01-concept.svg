<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>消息聚合怎样更新一个节点：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">消息聚合怎样更新一个节点</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:circle cx="230" cy="230" r="33" fill="#15988d" stroke="#1d5871" /><ns0:text x="213.5" y="238" font-size="23" fill="white">1</ns0:text><ns0:circle cx="230" cy="480" r="33" fill="#15988d" stroke="#1d5871" /><ns0:text x="213.5" y="488" font-size="23" fill="white">5</ns0:text><ns0:circle cx="650" cy="355" r="38" fill="#15988d" stroke="#1d5871" /><ns0:text x="631.0" y="363" font-size="23" fill="white">2</ns0:text><ns0:line x1="270" y1="240" x2="610" y2="340" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:line x1="270" y1="470" x2="610" y2="370" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="290" y="350" font-size="26" fill="#143651">邻居均值 (1＋5)÷2=3</ns0:text><ns0:rect x="850" y="300" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="865" y="335" font-size="25" fill="#143651">更新输入</ns0:text><ns0:text x="865" y="378" font-size="22" fill="#143651">自身 2 ＋ 邻居 3</ns0:text><ns0:line x1="690" y1="355" x2="840" y2="355" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:text x="150" y="635" font-size="24" fill="#143651">先按集合聚合，再结合自身作可训练变换；图为均值聚合算例。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  邻居均值与自身不是同一统计量</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  把自身纳入均值会改变定义</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">邻居特征：1 与 5</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">邻居均值：(1＋5)÷2＝3</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">中心自身特征：2</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">拼接后输入：[2，3]</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><ns0:text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">仅邻居均值</ns0:text><ns0:rect x="1220" y="879.1111111111111" width="120" height="168.88888888888889" fill="#e3a461" /><ns0:text x="1215" y="864.1111111111111" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2.6667</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">含自身均值</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">是否自环与是否拼接自身必须显式约定；这个均值例子不是标</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">准 GCN 对称归一化公式。</ns0:text></ns0:svg>
