<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>消息聚合怎样更新一个节点</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c"/></marker></defs><rect width="1200" height="750" fill="#f5faff"/><rect x="18" y="90" width="1164" height="635" rx="14" fill="white" stroke="#d6e7f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="53" font-size="30" fill="#143651">消息聚合怎样更新一个节点</text><circle cx="230" cy="230" r="33" fill="#15988d" stroke="#1d5871"/><text x="213.5" y="238" font-size="23" fill="white">1</text><circle cx="230" cy="480" r="33" fill="#15988d" stroke="#1d5871"/><text x="213.5" y="488" font-size="23" fill="white">5</text><circle cx="650" cy="355" r="38" fill="#15988d" stroke="#1d5871"/><text x="631.0" y="363" font-size="23" fill="white">2</text><line x1="270" y1="240" x2="610" y2="340" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><line x1="270" y1="470" x2="610" y2="370" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><text x="290" y="350" font-size="26" fill="#143651">邻居均值 (1＋5)÷2=3</text><rect x="850" y="300" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3"/><text x="865" y="335" font-size="25" fill="#143651">更新输入</text><text x="865" y="378" font-size="22" fill="#143651">自身 2 ＋ 邻居 3</text><line x1="690" y1="355" x2="840" y2="355" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)"/><text x="150" y="635" font-size="24" fill="#143651">先按集合聚合，再结合自身作可训练变换；图为均值聚合算例。</text></g></svg>
