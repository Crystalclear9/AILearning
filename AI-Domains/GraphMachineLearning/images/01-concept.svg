<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1966" viewBox="0 0 1200 1966" role="img"><title>消息聚合怎样更新一个节点：机制、算例与边界</title><rect width="1200" height="1966" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">消息聚合怎样更新一个节点</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="536.0250000000001" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="656.0250000000001" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1206.025" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="456.02500000000003" viewBox="0 171 1200 493" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><circle cx="230" cy="230" r="33" fill="#15988d" stroke="#1d5871" /><text x="213.5" y="238" font-size="23" fill="white">1</text><circle cx="230" cy="480" r="33" fill="#15988d" stroke="#1d5871" /><text x="213.5" y="488" font-size="23" fill="white">5</text><circle cx="650" cy="355" r="38" fill="#15988d" stroke="#1d5871" /><text x="631.0" y="363" font-size="23" fill="white">2</text><line x1="270" y1="240" x2="610" y2="340" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><line x1="270" y1="470" x2="610" y2="370" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="290" y="350" font-size="26" fill="#143651">邻居均值 (1＋5)÷2=3</text><rect x="850" y="300" width="290" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="865" y="335" font-size="25" fill="#143651">更新输入</text><text x="865" y="378" font-size="22" fill="#143651">自身 2 ＋ 邻居 3</text><line x1="690" y1="355" x2="840" y2="355" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><text x="150" y="635" font-size="24" fill="#143651">先按集合聚合，再结合自身作可训练变换；图为均值聚合算例。</text></g></svg><text x="48" y="699.0250000000001" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  邻居均值与自身不是同一统计量</text><text x="48" y="1249.025" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  把自身纳入均值会改变定义</text><g transform="translate(30,716.0250000000001) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">邻居特征：1 与 5</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">邻居均值：(1＋5)÷2＝3</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">中心自身特征：2</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">拼接后输入：[2，3]</text></g><g transform="translate(45,1266.025) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="858.0" width="120" height="190.0" fill="#169b8d" /><text x="895" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">3</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">仅邻居均值</text><rect x="1220" y="879.1111111111111" width="120" height="168.88888888888889" fill="#e3a461" /><text x="1215" y="864.1111111111111" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">2.6667</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">含自身均值</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">是否自环与是否拼接自身必须显式约定；这个均值例子不是标</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">准 GCN 对称归一化公式。</tspan></text></g></svg>
