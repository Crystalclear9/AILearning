<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc"><title id="title">图读出：重排顺序与复制重数是两件事</title><desc id="desc">固定节点表示1、2、3、2。置换保持求和8和均值2；整体复制使求和16，均值仍2。</desc><rect width="1400" height="790" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="48" y="59" font-size="37" fill="#20343d" text-anchor="start" font-weight="700">图读出：重排顺序与复制重数是两件事</text>
<text x="48" y="110" font-size="28" fill="#91a1aa" text-anchor="start" font-weight="400">先固定消息传递后的节点表示，再比较读出函数。</text>
<text x="1030" y="180" font-size="30" fill="#20343d" text-anchor="middle" font-weight="700">求和</text>
<text x="1240" y="180" font-size="30" fill="#20343d" text-anchor="middle" font-weight="700">均值</text>
<text x="48" y="269" font-size="30" fill="#24699e" text-anchor="start" font-weight="700">原顺序</text>
<rect x="230" y="228" width="64" height="64" fill="#edf3f7" stroke="none" stroke-width="2"/>
<text x="262" y="270" font-size="31" fill="#24699e" text-anchor="middle" font-weight="400">1</text>
<rect x="310" y="228" width="64" height="64" fill="#edf3f7" stroke="none" stroke-width="2"/>
<text x="342" y="270" font-size="31" fill="#24699e" text-anchor="middle" font-weight="400">2</text>
<rect x="390" y="228" width="64" height="64" fill="#edf3f7" stroke="none" stroke-width="2"/>
<text x="422" y="270" font-size="31" fill="#24699e" text-anchor="middle" font-weight="400">3</text>
<rect x="470" y="228" width="64" height="64" fill="#edf3f7" stroke="none" stroke-width="2"/>
<text x="502" y="270" font-size="31" fill="#24699e" text-anchor="middle" font-weight="400">2</text>
<text x="1030" y="269" font-size="34" fill="#24699e" text-anchor="middle" font-weight="700">8</text>
<text x="1240" y="269" font-size="34" fill="#24699e" text-anchor="middle" font-weight="700">2</text>
<text x="48" y="439" font-size="30" fill="#24699e" text-anchor="start" font-weight="700">只重排</text>
<rect x="230" y="398" width="64" height="64" fill="#edf3f7" stroke="none" stroke-width="2"/>
<text x="262" y="440" font-size="31" fill="#24699e" text-anchor="middle" font-weight="400">3</text>
<rect x="310" y="398" width="64" height="64" fill="#edf3f7" stroke="none" stroke-width="2"/>
<text x="342" y="440" font-size="31" fill="#24699e" text-anchor="middle" font-weight="400">1</text>
<rect x="390" y="398" width="64" height="64" fill="#edf3f7" stroke="none" stroke-width="2"/>
<text x="422" y="440" font-size="31" fill="#24699e" text-anchor="middle" font-weight="400">2</text>
<rect x="470" y="398" width="64" height="64" fill="#edf3f7" stroke="none" stroke-width="2"/>
<text x="502" y="440" font-size="31" fill="#24699e" text-anchor="middle" font-weight="400">2</text>
<text x="1030" y="439" font-size="34" fill="#24699e" text-anchor="middle" font-weight="700">8</text>
<text x="1240" y="439" font-size="34" fill="#24699e" text-anchor="middle" font-weight="700">2</text>
<text x="48" y="609" font-size="30" fill="#ca7028" text-anchor="start" font-weight="700">整体复制</text>
<rect x="230" y="568" width="64" height="64" fill="#fcf0e4" stroke="none" stroke-width="2"/>
<text x="262" y="610" font-size="31" fill="#ca7028" text-anchor="middle" font-weight="400">1</text>
<rect x="310" y="568" width="64" height="64" fill="#fcf0e4" stroke="none" stroke-width="2"/>
<text x="342" y="610" font-size="31" fill="#ca7028" text-anchor="middle" font-weight="400">2</text>
<rect x="390" y="568" width="64" height="64" fill="#fcf0e4" stroke="none" stroke-width="2"/>
<text x="422" y="610" font-size="31" fill="#ca7028" text-anchor="middle" font-weight="400">3</text>
<rect x="470" y="568" width="64" height="64" fill="#fcf0e4" stroke="none" stroke-width="2"/>
<text x="502" y="610" font-size="31" fill="#ca7028" text-anchor="middle" font-weight="400">2</text>
<rect x="550" y="568" width="64" height="64" fill="#fcf0e4" stroke="none" stroke-width="2"/>
<text x="582" y="610" font-size="31" fill="#ca7028" text-anchor="middle" font-weight="400">1</text>
<rect x="630" y="568" width="64" height="64" fill="#fcf0e4" stroke="none" stroke-width="2"/>
<text x="662" y="610" font-size="31" fill="#ca7028" text-anchor="middle" font-weight="400">2</text>
<rect x="710" y="568" width="64" height="64" fill="#fcf0e4" stroke="none" stroke-width="2"/>
<text x="742" y="610" font-size="31" fill="#ca7028" text-anchor="middle" font-weight="400">3</text>
<rect x="790" y="568" width="64" height="64" fill="#fcf0e4" stroke="none" stroke-width="2"/>
<text x="822" y="610" font-size="31" fill="#ca7028" text-anchor="middle" font-weight="400">2</text>
<text x="1030" y="609" font-size="34" fill="#ca7028" text-anchor="middle" font-weight="700">16</text>
<text x="1240" y="609" font-size="34" fill="#ca7028" text-anchor="middle" font-weight="700">2</text>
<line x1="48" y1="670" x2="1352" y2="670" stroke="#dce5ea" stroke-width="2"/>
<text x="48" y="722" font-size="30" fill="#20343d" text-anchor="start" font-weight="400">两者都对顺序不变；只有求和在这里保留了整体复制次数。</text>
<text x="48" y="770" font-size="27" fill="#91a1aa" text-anchor="start" font-weight="400">比较对象是固定多重集合，不假设复制原图后传播表示仍然相同。</text></g></svg>
