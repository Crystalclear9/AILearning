<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img"><ns0:title>图级预测如何避免节点顺序影响：机制、算例与边界</ns0:title><ns0:rect width="1500" height="1250" fill="white" /><ns0:text x="40" y="52" font-size="34" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">图级预测如何避免节点顺序影响</ns0:text><ns0:text x="45" y="103" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</ns0:text><ns0:line x1="40" y1="120" x2="1460" y2="120" stroke="#b2c9d5" stroke-width="2" /><ns0:svg width="1400" height="570" viewBox="0 100 1200 610" role="img" x="50" y="135" preserveAspectRatio="xMidYMid meet"><ns0:defs><ns0:marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><ns0:path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><ns0:circle cx="170" cy="240" r="30" fill="#15988d" stroke="#1d5871" /><ns0:text x="155.0" y="248" font-size="23" fill="white">1</ns0:text><ns0:circle cx="330" cy="190" r="30" fill="#15988d" stroke="#1d5871" /><ns0:text x="315.0" y="198" font-size="23" fill="white">2</ns0:text><ns0:circle cx="330" cy="390" r="30" fill="#15988d" stroke="#1d5871" /><ns0:text x="315.0" y="398" font-size="23" fill="white">3</ns0:text><ns0:circle cx="170" cy="440" r="30" fill="#15988d" stroke="#1d5871" /><ns0:text x="155.0" y="448" font-size="23" fill="white">2</ns0:text><ns0:line x1="170" y1="240" x2="330" y2="190" stroke="#417f9c" stroke-width="3" /><ns0:line x1="330" y1="190" x2="330" y2="390" stroke="#417f9c" stroke-width="3" /><ns0:line x1="330" y1="390" x2="170" y2="440" stroke="#417f9c" stroke-width="3" /><ns0:line x1="170" y1="440" x2="170" y2="240" stroke="#417f9c" stroke-width="3" /><ns0:line x1="390" y1="320" x2="590" y2="320" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><ns0:rect x="630" y="160" width="420" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="645" y="195" font-size="25" fill="#143651">sum 读出</ns0:text><ns0:text x="645" y="238" font-size="22" fill="#143651">1＋2＋3＋2＝8</ns0:text><ns0:rect x="630" y="395" width="420" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><ns0:text x="645" y="430" font-size="25" fill="#143651">mean 读出</ns0:text><ns0:text x="645" y="473" font-size="22" fill="#143651">8÷4＝2</ns0:text><ns0:text x="160" y="650" font-size="24" fill="#143651">图级读出不依赖节点重新编号；求和与均值保留的信息不同。</ns0:text></ns0:g></ns0:svg><ns0:line x1="40" y1="730" x2="1460" y2="730" stroke="#8daab9" stroke-width="2" /><ns0:text x="45" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  求和与均值保留不同数量信息</ns0:text><ns0:text x="785" y="777" font-size="25" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  复制全部节点特征后均值不变</ns0:text><ns0:line x1="750" y1="760" x2="750" y2="1210" stroke="#b2c9d5" stroke-width="2" /><ns0:text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</ns0:text><ns0:text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">节点特征：1、2、3、2</ns0:text><ns0:line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</ns0:text><ns0:text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">求和：8</ns0:text><ns0:line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</ns0:text><ns0:text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">节点数：4</ns0:text><ns0:line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><ns0:text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</ns0:text><ns0:text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">均值：8÷4＝2</ns0:text><ns0:line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><ns0:rect x="900" y="953.0" width="120" height="95.0" fill="#169b8d" /><ns0:text x="895" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">8</ns0:text><ns0:text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">原图特征和</ns0:text><ns0:rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><ns0:text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">16</ns0:text><ns0:text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">全部复制后和</ns0:text><ns0:text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">复制是聚合多重集合的反例，不表示复制后的图结构一定保持</ns0:text><ns0:text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif">相同；均值仍为二，求和则翻倍。</ns0:text></ns0:svg>
