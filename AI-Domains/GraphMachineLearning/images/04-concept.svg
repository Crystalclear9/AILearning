<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img">
<title>图级预测如何避免节点顺序影响</title>
<desc>原创教学示意：节点表示|每个节点一个向量;读出聚合|求和、均值或其他不变函数;图向量|得到固定长度表示;预测头|输出整张图的标签</desc>
<rect width="1120" height="790" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="35" y="48" font-size="29" fill="#16324f">图级预测如何避免节点顺序影响</text>
<rect x="35" y="85" width="500" height="130" rx="12" fill="#eef6ff" stroke="#a8bed1"/>
<text x="53" y="120" font-size="24" fill="#16324f">节点表示</text>
<text x="53" y="160" font-size="21" fill="#16324f">每个节点一个向量</text>
<rect x="585" y="85" width="500" height="130" rx="12" fill="#e9f8f1" stroke="#a8bed1"/>
<text x="603" y="120" font-size="24" fill="#16324f">读出聚合</text>
<text x="603" y="160" font-size="21" fill="#16324f">求和、均值或其他不变函数</text>
<rect x="35" y="255" width="500" height="130" rx="12" fill="#fff6e5" stroke="#a8bed1"/>
<text x="53" y="290" font-size="24" fill="#16324f">图向量</text>
<text x="53" y="330" font-size="21" fill="#16324f">得到固定长度表示</text>
<rect x="585" y="255" width="500" height="130" rx="12" fill="#f4effb" stroke="#a8bed1"/>
<text x="603" y="290" font-size="24" fill="#16324f">预测头</text>
<text x="603" y="330" font-size="21" fill="#16324f">输出整张图的标签</text>
<text x="35" y="446" font-size="20" fill="#516477">示意中的数值与形状仅用于本章算例；具体条件见图下说明。</text>
</g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2877a7"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="500" font-size="20" fill="#173c53">以标量节点表示为例：置换不改读出，数量变化会影响求和</text><circle cx="85" cy="580" r="22" fill="#daedf7" stroke="#377999"/><text x="70" y="587" font-size="19" fill="#173c53">1</text><circle cx="150" cy="580" r="22" fill="#daedf7" stroke="#377999"/><text x="135" y="587" font-size="19" fill="#173c53">3</text><text x="40" y="660" font-size="25" fill="#173c53">sum=4</text><text x="40" y="705" font-size="25" fill="#173c53">mean=2</text><circle cx="445" cy="580" r="22" fill="#daedf7" stroke="#377999"/><text x="430" y="587" font-size="19" fill="#173c53">3</text><circle cx="510" cy="580" r="22" fill="#daedf7" stroke="#377999"/><text x="495" y="587" font-size="19" fill="#173c53">1</text><text x="400" y="660" font-size="25" fill="#173c53">sum=4</text><text x="400" y="705" font-size="25" fill="#173c53">mean=2</text><circle cx="805" cy="580" r="22" fill="#daedf7" stroke="#377999"/><text x="790" y="587" font-size="19" fill="#173c53">1</text><circle cx="870" cy="580" r="22" fill="#daedf7" stroke="#377999"/><text x="855" y="587" font-size="19" fill="#173c53">3</text><circle cx="935" cy="580" r="22" fill="#daedf7" stroke="#377999"/><text x="920" y="587" font-size="19" fill="#173c53">1</text><circle cx="1000" cy="580" r="22" fill="#daedf7" stroke="#377999"/><text x="985" y="587" font-size="19" fill="#173c53">3</text><text x="760" y="660" font-size="25" fill="#173c53">sum=8</text><text x="760" y="705" font-size="25" fill="#173c53">mean=2</text><text x="100" y="760" font-size="20" fill="#173c53">左与中仅节点顺序不同；右侧复制节点，均值不变但和翻倍。</text></g></svg>