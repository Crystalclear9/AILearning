<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2014" viewBox="0 0 1200 2014" role="img"><title>图级预测如何避免节点顺序影响：机制、算例与边界</title><rect width="1200" height="2014" fill="#f3f6f8" /><text x="44" y="57" font-size="32" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">图级预测如何避免节点顺序影响</text><rect x="44" y="76" width="68" height="5" rx="2" fill="#168f85" /><rect x="25" y="105" width="1150" height="584.125" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="704.125" width="1150" height="525" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><rect x="25" y="1254.125" width="1150" height="715" rx="16" fill="white" stroke="#d8e2e8" stroke-width="1.2" /><text x="48" y="141" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">A  核心机制与对象关系</text><svg width="1110" height="504.125" viewBox="0 134 1200 545" role="img" x="45" y="150" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#417f9c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><circle cx="170" cy="240" r="30" fill="#15988d" stroke="#1d5871" /><text x="155.0" y="248" font-size="23" fill="white">1</text><circle cx="330" cy="190" r="30" fill="#15988d" stroke="#1d5871" /><text x="315.0" y="198" font-size="23" fill="white">2</text><circle cx="330" cy="390" r="30" fill="#15988d" stroke="#1d5871" /><text x="315.0" y="398" font-size="23" fill="white">3</text><circle cx="170" cy="440" r="30" fill="#15988d" stroke="#1d5871" /><text x="155.0" y="448" font-size="23" fill="white">2</text><line x1="170" y1="240" x2="330" y2="190" stroke="#417f9c" stroke-width="3" /><line x1="330" y1="190" x2="330" y2="390" stroke="#417f9c" stroke-width="3" /><line x1="330" y1="390" x2="170" y2="440" stroke="#417f9c" stroke-width="3" /><line x1="170" y1="440" x2="170" y2="240" stroke="#417f9c" stroke-width="3" /><line x1="390" y1="320" x2="590" y2="320" stroke="#417f9c" stroke-width="3" marker-end="url(#arr)" /><rect x="630" y="160" width="420" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="645" y="195" font-size="25" fill="#143651">sum 读出</text><text x="645" y="238" font-size="22" fill="#143651">1＋2＋3＋2＝8</text><rect x="630" y="395" width="420" height="105" rx="7" fill="#e0f1ec" stroke="#80a0b3" /><text x="645" y="430" font-size="25" fill="#143651">mean 读出</text><text x="645" y="473" font-size="22" fill="#143651">8÷4＝2</text><text x="160" y="650" font-size="24" fill="#143651">图级读出不依赖节点重新编号；求和与均值保留的信息不同。</text></g></svg><text x="48" y="747.125" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">B  求和与均值保留不同数量信息</text><text x="48" y="1297.125" font-size="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">C  复制全部节点特征后均值不变</text><g transform="translate(30,764.125) scale(1.48) translate(-40,-800)"><text x="56" y="832" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">01</text><text x="105" y="832" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">节点特征：1、2、3、2</text><line x1="105" y1="867" x2="690" y2="867" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="912" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">02</text><text x="105" y="912" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">求和：8</text><line x1="105" y1="947" x2="690" y2="947" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="992" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">03</text><text x="105" y="992" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">节点数：4</text><line x1="105" y1="1027" x2="690" y2="1027" stroke="#e1eaf0" stroke-width="1" /><text x="56" y="1072" font-size="21" fill="#518c99" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">04</text><text x="105" y="1072" font-size="26" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">均值：8÷4＝2</text></g><g transform="translate(45,1314.125) scale(1.48) translate(-785,-800)"><line x1="815" y1="1048" x2="1430" y2="1048" stroke="#8ba9b9" stroke-width="2" /><rect x="900" y="953.0" width="120" height="95.0" fill="#169b8d" /><text x="895" y="938.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">8</text><text x="840" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">原图特征和</text><rect x="1220" y="858.0" width="120" height="190.0" fill="#e3a461" /><text x="1215" y="843.0" font-size="28" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">16</text><text x="1160" y="1086" font-size="23" fill="#17374e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">全部复制后和</text><text x="785" y="1154" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">复制是聚合多重集合的反例，不表示复制后的图结构一定保持</tspan></text><text x="785" y="1183" font-size="23" fill="#17374e" font-family="Microsoft YaHei,sans-serif"><tspan x="785" dy="0">相同；均值仍为二，求和则翻倍。</tspan></text></g></svg>
