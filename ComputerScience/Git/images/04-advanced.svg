<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="536" viewBox="0 0 960 536" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">显式租约只接受预期的远程旧值</title><desc id="artwork-desc">显式租约比较当前旧值，不是远程变化的完整日志 实际更新还受权限、受保护分支、服务端钩子及并发引用更新规则约束。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="438.18929"/></clipPath></defs><rect width="960" height="536" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">显式租约只接受预期的远程旧值</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(12.360864 28.627865) scale(0.74056)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#446578" stroke-width="1.6"/></marker></defs><rect width="1228.8" height="591.7" fill="white" x="17.067" y="63.968"/><text x="44" y="112" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#243b53" text-anchor="start" font-weight="400">同一服务器引用可能经历 A → B → A；请求始终携带明确预期 A。</text><text x="225" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#243b53" text-anchor="middle" font-weight="400">t0：原状态</text><circle cx="225" cy="245" r="35" fill="#147fba" stroke="none"/><text x="225" y="255" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="35.783736px" fill="white" text-anchor="middle" font-weight="400">A</text><line x1="270" y1="245" x2="570" y2="245" stroke="#bdcad7" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="615" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#243b53" text-anchor="middle" font-weight="400">t1：别人推进</text><circle cx="615" cy="245" r="35" fill="#ba5614" stroke="none"/><text x="615" y="255" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="35.783736px" fill="white" text-anchor="middle" font-weight="400">B</text><line x1="660" y1="245" x2="960" y2="245" stroke="#bdcad7" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="1005" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#243b53" text-anchor="middle" font-weight="400">t2：后来退回</text><circle cx="1005" cy="245" r="35" fill="#147fba" stroke="none"/><text x="1005" y="255" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="35.783736px" fill="white" text-anchor="middle" font-weight="400">A</text><text x="44" y="351" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#243b53" text-anchor="start" font-weight="400">预期对象是不可变提交 A；服务器分支名仍是可移动引用。</text><rect x="44" y="398" width="230" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="159.0" y="431" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">请求时点</text><rect x="274" y="398" width="265" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="406.5" y="431" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">明确预期</text><rect x="539" y="398" width="265" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="671.5" y="431" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">服务器当前</text><rect x="804" y="398" width="415" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="1011.5" y="431" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">单看租约条件</text><rect x="44" y="447" width="230" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="159.0" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">t1</text><rect x="274" y="447" width="265" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="406.5" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">A</text><rect x="539" y="447" width="265" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="671.5" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">B</text><rect x="804" y="447" width="415" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="1011.5" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#af5a1d" text-anchor="middle" font-weight="400">不等：拒绝该租约更新</text><rect x="44" y="496" width="230" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="159.0" y="529" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">t2</text><rect x="274" y="496" width="265" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="406.5" y="529" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">A</text><rect x="539" y="496" width="265" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="671.5" y="529" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">A</text><rect x="804" y="496" width="415" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="1011.5" y="529" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#1e78b7" text-anchor="middle" font-weight="400">相等：租约条件满足</text><text x="44" y="626" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34.83px" fill="#af5a1d" text-anchor="start" font-weight="400">t2 无法仅靠相等比较得知 B 曾出现；租约不保证内容已审查。</text><desc> 显式租约比较当前旧值，不是远程变化的完整日志 实际更新还受权限、受保护分支、服务端钩子及并发引用更新规则约束。</desc></g></g></g></svg>