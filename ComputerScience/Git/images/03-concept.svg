<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>revert 增加反向提交，不抹去原提交</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><rect width="1200" height="720" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">revert 增加反向提交，不抹去原提交</text><rect x="75" y="180" width="285" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="93" y="220" font-size="25" fill="#173c53">A</text><text x="93" y="256" font-size="20" fill="#173c53">文件内容：x=0</text><rect x="460" y="180" width="285" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="478" y="220" font-size="25" fill="#173c53">B</text><text x="478" y="256" font-size="20" fill="#173c53">修改后：x=1</text><rect x="845" y="180" width="285" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="863" y="220" font-size="25" fill="#173c53">R = revert B</text><text x="863" y="256" font-size="20" fill="#173c53">反向修改后：x=0</text><path d="M370,230 L450,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><path d="M755,230 L835,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><text x="375" y="175" font-size="21" fill="#173c53">修改</text><text x="760" y="175" font-size="21" fill="#173c53">撤销</text><rect x="100" y="390" width="1000" height="150" rx="10" fill="#e9f4fa" stroke="#a4bfce" /><text x="130" y="435" font-size="26" fill="#173c53">历史：A → B → R，B 仍然是 R 的祖先。</text><text x="130" y="480" font-size="25" fill="#173c53">内容：x=0 → x=1 → x=0；新提交记录了反向变更。</text><text x="55" y="630" font-size="21" fill="#173c53">本图省略后续依赖，展示可直接反转的最小例子；内容恢复不等于祖先关系消失。</text><text x="55" y="662" font-size="21" fill="#173c53">复杂撤销可能冲突；撤销合并提交还需选择主线。箭头同样表示祖先到后继。</text></g></svg>
