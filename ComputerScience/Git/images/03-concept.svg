<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">revert 增加反向提交，不抹去原提交</title><desc id="plateDesc">B 明确内容的变化与提交数量的增加。C 只比较通常分支场景中这两个操作的引用效果：reset 移动当前分支，revert 新增反向提交；不应把分支不再指向某对象说成该对象已从存储中立即删除。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">revert 增加反向提交，不抹去原提交</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">revert 是继续增加一段历史</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">反向提交恢复内容但保留历史</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">reset 与 revert 改变不同对象</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 630.0" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>revert 增加反向提交，不抹去原提交</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="panelA-tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">revert 增加反向提交，不抹去原提交</text><rect x="75" y="180" width="285" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="93" y="220" font-size="25" fill="#173c53">A</text><text x="93" y="256" font-size="20" fill="#173c53">文件内容：x=0</text><rect x="460" y="180" width="285" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="478" y="220" font-size="25" fill="#173c53">B</text><text x="478" y="256" font-size="20" fill="#173c53">修改后：x=1</text><rect x="845" y="180" width="285" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="863" y="220" font-size="25" fill="#173c53">R = revert B</text><text x="863" y="256" font-size="20" fill="#173c53">反向修改后：x=0</text><path d="M370,230 L450,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M755,230 L835,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="375" y="175" font-size="21" fill="#173c53">修改</text><text x="760" y="175" font-size="21" fill="#173c53">撤销</text><rect x="100" y="390" width="1000" height="150" rx="10" fill="#e9f4fa" stroke="#a4bfce" /><text x="130" y="435" font-size="26" fill="#173c53">历史：A → B → R，B 仍然是 R 的祖先。</text><text x="130" y="480" font-size="25" fill="#173c53">内容：x=0 → x=1 → x=0；新提交记录了反向变更。</text><text x="55" y="630" font-size="21" fill="#173c53">本图省略后续依赖，展示可直接反转的最小例子；内容恢复不等于祖先关系消失。</text><text x="55" y="662" font-size="21" fill="#173c53">复杂撤销可能冲突；撤销合并提交还需选择主线。箭头同样表示祖先到后继。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">提交 A</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 938.5) scale(0.7272727273 1) translate(-485 -938.5)">内容 0</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">提交 B</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1008.5) scale(0.7272727273 1) translate(-485 -1008.5)">内容 1</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">新增 revert B 的 R</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1078.5) scale(0.7272727273 1) translate(-485 -1078.5)">内容回到 0</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">当前分支指向新增的 R</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="806" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="815" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 923) scale(0.7272727273 1) translate(-815 -923)">比较对象</text><rect x="1006" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1015" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 923) scale(0.7272727273 1) translate(-1015 -923)">revert 后</text><rect x="1206" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1215" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 923) scale(0.7272727273 1) translate(-1215 -923)">reset 到 A 后</text><rect x="806" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="815" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 978) scale(0.7272727273 1) translate(-815 -978)">分支位置</text><rect x="1006" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1015" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 978) scale(0.7272727273 1) translate(-1015 -978)">新提交 R</text><rect x="1206" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1215" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 978) scale(0.7272727273 1) translate(-1215 -978)">既有提交 A</text><rect x="806" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="815" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 1036) scale(0.7272727273 1) translate(-815 -1036)">B 的历史</text><rect x="1006" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1015" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 1036) scale(0.7272727273 1) translate(-1015 -1036)">在当前祖先链上</text><rect x="1206" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1215" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 1036) scale(0.7272727273 1) translate(-1215 -1036)">不再由此分支指向</text><text x="806" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1150) scale(0.7272727273 1) translate(-806 -1150)">其他引用与引用日志是否保留 B 需另查</text></g></svg>
