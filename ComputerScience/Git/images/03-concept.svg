text x="1550" y="102" font-size="41.28px" fill="#b15e27" text-anchor="middle" font-weight="400">main → R</text><text x="575" y="750" font-size="38.7px" fill="#1672a0" text-anchor="middle" font-weight="400">B 引入的补丁</text><text x="575" y="825" font-size="43.86px" fill="#47586b" text-anchor="middle" font-weight="400">− x=0</text><text x="575" y="895" font-size="43.86px" fill="#1672a0" text-anchor="middle" font-weight="400">+ x=1</text><text x="1225" y="750" font-size="38.7px" fill="#b15e27" text-anchor="middle" font-weight="400">R 应用的反向补丁</text><text x="1225" y="825" font-size="43.86px" fill="#47586b" text-anchor="middle" font-weight="400">− x=1</text><text x="1225" y="895" font-size="43.86px" fill="#b15e27" text-anchor="middle" font-weight="400">+ x=0</text><text x="900" y="1000" font-size="41.28px" fill="#20354a" text-anchor="middle" font-weight="400">A 与 R 的文件内容相同；R → B → A 的父链仍存在</text></g></g></g></g></svg>