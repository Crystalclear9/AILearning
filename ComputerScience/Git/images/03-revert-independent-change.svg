aceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#137286" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="38.43956px" fill="#20354a" text-anchor="start" font-weight="400">x、y 位于不同文件；只撤销 B 对 x 的修改</text><circle cx="170" cy="180" r="40" fill="white" stroke="#0b6690" stroke-width="2"/><text x="170" y="192" font-size="38.43956px" fill="#1672a0" text-anchor="middle" font-weight="400">A</text><rect x="80" y="320" width="180" height="90" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="170" y="378" font-size="38.43956px" fill="#1672a0" text-anchor="middle" font-weight="400">x = 1</text><rect x="80" y="455" width="180" height="90" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="170" y="513" font-size="38.43956px" fill="#1672a0" text-anchor="middle" font-weight="400">y = 0</text><line x1="170" y1="225" x2="170" y2="305" stroke="#818fa4" stroke-width="2"/><circle cx="490" cy="180" r="40" fill="white" stroke="#0b6690" stroke-width="2"/><text x="490" y="192" font-size="38.43956px" fill="#1672a0" text-anchor="middle" font-weight="400">B</text><line x1="440" y1="180" x2="225" y2="180" stroke="#0b6690" stroke-width="3" marker-end="url(#b)"/><text x="335" y="145" font-size="32.25px" fill="#47586b" text-anchor="middle" font-weight="400">parent</text><rect x="400" y="320" width="180" height="90" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="490" y="378" font-size="38.43956px" fill="#1672a0" text-anchor="middle" font-weight="400">x = 2</text><rect x="400" y="455" width="180" height="90" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="490" y="513" font-size="38.43956px" fill="#1672a0" text-anchor="middle" font-weight="400">y = 0</text><line x1="490" y1="225" x2="490" y2="305" stroke="#818fa4" stroke-width="2"/><circle cx="810" cy="180" r="40" fill="white" stroke="#0b6690" stroke-width="2"/><text x="810" y="192" font-size="38.43956px" fill="#1672a0" text-anchor="middle" font-weight="400">C</text><line x1="760" y1="180" x2="545" y2="180" stroke="#0b6690" stroke-width="3" marker-end="url(#b)"/><text x="655" y="145" font-size="32.25px" fill="#47586b" text-anchor="middle" font-weight="400">parent</text><rect x="720" y="320" width="180" height="90" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="810" y="378" font-size="38.43956px" fill="#1672a0" text-anchor="middle" font-weight="400">x = 2</text><rect x="720" y="455" width="180" height="90" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#137286" stroke-width="2"/><text x="810" y="513" font-size="38.43956px" fill="#197b7e" text-anchor="middle" font-weight="400">y = 5</text><line x1="810" y1="225" x2="810" y2="305" stroke="#818fa4" stroke-width="2"/><circle cx="1130" cy="180" r="40" fill="white" stroke="#ce6521" stroke-width="2"/><text x="1130" y="192" font-size="38.43956px" fill="#b15e27" text-anchor="middle" font-weight="400">R</text><line x1="1080" y1="180" x2="865" y2="180" stroke="#0b6690" stroke-width="3" marker-end="url(#b)"/><text x="975" y="145" font-size="32.25px" fill="#47586b" text-anchor="middle" font-weight="400">parent</text><rect x="1040" y="320" width="180" height="90" rx="4" fill="url(#book-wash-fff1e5)" stroke="#ce6521" stroke-width="2"/><text x="1130" y="378" font-size="38.43956px" fill="#b15e27" text-anchor="middle" font-weight="400">x = 1</text><rect x="1040" y="455" width="180" height="90" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#137286" stroke-width="2"/><text x="1130" y="513" font-size="38.43956px" fill="#197b7e" text-anchor="middle" font-weight="400">y = 5</text><line x1="1130" y1="225" x2="1130" y2="305" stroke="#818fa4" stroke-width="2"/><text x="165" y="640" font-size="36.12px" fill="#47586b" text-anchor="middle" font-weight="400">初始快照</text><text x="490" y="640" font-size="36.12px" fill="#1672a0" text-anchor="middle" font-weight="400">B：只改 x</text><text x="810" y="640" font-size="36.12px" fill="#197b7e" text-anchor="middle" font-weight="400">C：只改 y</text><text x="1130" y="640" font-size="36.12px" fill="#197b7e" text-anchor="middle" font-weight="400">R：保留 y=5</text><rect x="230" y="720" width="860" height="90" rx="4" fill="white" stroke="#ce6521" stroke-width="2"/><text x="660" y="778" font-size="38.43956px" fill="#b15e27" text-anchor="middle" font-weight="400">对 B 的反向变化：x = 2 → 1；不回滚 C 的 y = 5</text></g></g></g></g></svg>