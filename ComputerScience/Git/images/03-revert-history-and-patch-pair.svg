<text x="546" y="237" fill="#a84b3b" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="23" text-anchor="middle" font-weight="400">x = 1</text>
<path d="M435 156 L311 156" fill="none" stroke="#655184" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M311 156 L322 151 L322 161 Z" fill="#655184" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M809 184 L836 132 L1034 132 L1007 184 Z" fill="url(#b-t)" stroke="#196f77" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="921.5" y="166.75" fill="#196f77" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="25" text-anchor="middle" font-weight="400">R</text>
<text x="912" y="237" fill="#196f77" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="23" text-anchor="middle" font-weight="400">x = 0</text>
