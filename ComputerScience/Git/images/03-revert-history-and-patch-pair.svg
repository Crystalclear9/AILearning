<text x="180" y="237" fill="#657682" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="23" text-anchor="middle" font-weight="400">x = 0</text>
<path d="M443 184 L470 132 L668 132 L641 184 Z" fill="url(#b-r)" stroke="#a84b3b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
