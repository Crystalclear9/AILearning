<title id="b-fig-title">反向提交保存旧历史，并可保留无关改动</title>
<desc id="b-fig-desc">撤销 B 新增一个反向提交。若 C 修改了另一文件，撤销 B 不会把 C 的结果一并回滚。</desc>
<rect x="0" y="0" width="1200" height="576" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="b-t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf6f6"/></linearGradient>
<linearGradient id="b-r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="b-v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1edf6"/></linearGradient>
<linearGradient id="b-n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7f8"/></linearGradient>
<linearGradient id="b-blue" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f1f8"/></linearGradient>
<linearGradient id="b-ochre" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7f0d9"/></linearGradient>
<linearGradient id="b-green" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf5ee"/></linearGradient>
</defs>
<text x="76" y="58" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="31" text-anchor="start" font-weight="400">撤销记录新增提交，父链继续保留</text>
