<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>提交 DAG：共同祖先 O 分叉为 A、B，再合并为 M</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">提交 DAG：共同祖先 O 分叉为 A、B，再合并为 M</text><rect x="65" y="280" width="210" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce"/><text x="83" y="320" font-size="25" fill="#173c53">O</text><text x="83" y="356" font-size="20" fill="#173c53">共同祖先</text><rect x="445" y="140" width="260" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce"/><text x="463" y="180" font-size="25" fill="#173c53">A</text><text x="463" y="216" font-size="20" fill="#173c53">分支 A 的提交</text><rect x="445" y="410" width="260" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce"/><text x="463" y="450" font-size="25" fill="#173c53">B</text><text x="463" y="486" font-size="20" fill="#173c53">分支 B 的提交</text><rect x="895" y="280" width="240" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce"/><text x="913" y="320" font-size="25" fill="#173c53">M</text><text x="913" y="356" font-size="20" fill="#173c53">合并提交</text><path d="M280,310 L435,215" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><path d="M280,350 L435,440" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><path d="M715,210 L885,310" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><path d="M715,450 L885,350" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><text x="360" y="330" font-size="22" fill="#173c53">三方比较：O → A 与 O → B</text><text x="385" y="365" font-size="21" fill="#173c53">M 同时具有 A、B 两个父提交</text><text x="55" y="630" font-size="21" fill="#173c53">图中箭头是祖先 → 后继的阅读方向；实际 Git 提交保存的是指向父提交的引用。</text><text x="55" y="662" font-size="21" fill="#173c53">三方合并参考共同祖先；无文本冲突不能证明单位、标签或实验协议没有语义冲突。</text></g></svg>