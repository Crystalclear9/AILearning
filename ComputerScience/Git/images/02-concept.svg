<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">提交 DAG：共同祖先 O 分叉为 A、B，再合并为 M</title><desc id="plateDesc">B 用同一行从共同基线走向两个值说明三方比较的依据。C 用不同文件中的单位约定构造自动合并也能发生的百倍错误；冲突标记消失只意味着文本组合已作决定，不能代替接口、数据单位与行为验证。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">提交 DAG：共同祖先 O 分叉为 A、B，再合并为 M</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Git</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">分叉历史需要共同祖先参与比较</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">同一行的竞争修改需要决定</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">共同祖先</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">x=1</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">分支 A</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">x=2</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">分支 B</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">x=3</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">不能仅凭两份最终文本决定意图</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">无文本冲突仍可有单位冲突</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">一方接口约定</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">长度单位：米</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">另一方输入变化</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">100 厘米</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">组合后误读</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">100 米，而非 1 米</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">不同文件可自动合并，语义仍要验证</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 630.0" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>提交 DAG：共同祖先 O 分叉为 A、B，再合并为 M</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="panelA-tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">提交 DAG：共同祖先 O 分叉为 A、B，再合并为 M</text><rect x="65" y="280" width="210" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="83" y="320" font-size="25" fill="#173c53">O</text><text x="83" y="356" font-size="20" fill="#173c53">共同祖先</text><rect x="445" y="140" width="260" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="463" y="180" font-size="25" fill="#173c53">A</text><text x="463" y="216" font-size="20" fill="#173c53">分支 A 的提交</text><rect x="445" y="410" width="260" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="463" y="450" font-size="25" fill="#173c53">B</text><text x="463" y="486" font-size="20" fill="#173c53">分支 B 的提交</text><rect x="895" y="280" width="240" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="913" y="320" font-size="25" fill="#173c53">M</text><text x="913" y="356" font-size="20" fill="#173c53">合并提交</text><path d="M280,310 L435,215" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M280,350 L435,440" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M715,210 L885,310" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M715,450 L885,350" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="360" y="330" font-size="22" fill="#173c53">三方比较：O → A 与 O → B</text><text x="385" y="365" font-size="21" fill="#173c53">M 同时具有 A、B 两个父提交</text><text x="55" y="630" font-size="21" fill="#173c53">图中箭头是祖先 → 后继的阅读方向；实际 Git 提交保存的是指向父提交的引用。</text><text x="55" y="662" font-size="21" fill="#173c53">三方合并参考共同祖先；无文本冲突不能证明单位、标签或实验协议没有语义冲突。</text></g></svg></svg>
