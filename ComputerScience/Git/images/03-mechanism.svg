<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">历史二分需要可判定且具有边界的性质</title><desc id="desc">把六个线性历史版本按时间排列，前三个通过、后三个失败。只有当待查性质在这段历史中形成这样的边界，并且每次测试可靠，二分才能稳定缩小首个失败版本的范围。 这里的柱高 0 表示通过、1 表示失败，不是性能量测。真实历史可能多次好坏交替；测试不稳定、环境变化或不可测试版本都必须显式处理，找到提交也不等于证明根因。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#fbfdff" stroke="#fbfdff" rx="0"/><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3"/><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">历史二分需要可判定且具有边界的性质</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">用具体对象、数值或条件对照，核对这一节的推理。</text><path d="M208,345 L255,345" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="80" y="280" width="130" height="130" fill="#d9eee8" stroke="#92b1c4" rx="10"/><text x="145" y="325" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">版本 1</text><text x="145" y="375" font-size="24" fill="#268d8c" text-anchor="middle" font-weight="400">通过</text><path d="M391,345 L438,345" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="263" y="280" width="130" height="130" fill="#d9eee8" stroke="#92b1c4" rx="10"/><text x="328" y="325" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">版本 2</text><text x="328" y="375" font-size="24" fill="#268d8c" text-anchor="middle" font-weight="400">通过</text><path d="M574,345 L621,345" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="446" y="280" width="130" height="130" fill="#d9eee8" stroke="#92b1c4" rx="10"/><text x="511" y="325" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">版本 3</text><text x="511" y="375" font-size="24" fill="#268d8c" text-anchor="middle" font-weight="400">通过</text><path d="M757,345 L804,345" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="629" y="280" width="130" height="130" fill="#f5ddce" stroke="#92b1c4" rx="10"/><text x="694" y="325" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">版本 4</text><text x="694" y="375" font-size="24" fill="#a9562c" text-anchor="middle" font-weight="400">失败</text><path d="M940,345 L987,345" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="812" y="280" width="130" height="130" fill="#f5ddce" stroke="#92b1c4" rx="10"/><text x="877" y="325" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">版本 5</text><text x="877" y="375" font-size="24" fill="#a9562c" text-anchor="middle" font-weight="400">失败</text><rect x="995" y="280" width="130" height="130" fill="#f5ddce" stroke="#92b1c4" rx="10"/><text x="1060" y="325" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">版本 6</text><text x="1060" y="375" font-size="24" fill="#a9562c" text-anchor="middle" font-weight="400">失败</text><path d="M600,460 L600,515" stroke="#d67c47" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="600" y="560" font-size="27" fill="#20384f" text-anchor="middle" font-weight="400">待定位边界：首个失败是版本 4</text><text x="60" y="700" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">原创教学图 · 条件、变量含义及适用边界见相邻正文</text></g></svg>
