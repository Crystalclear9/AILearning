<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">变基重放变化，产生新的提交身份</title><desc id="desc">旧提交 A 的变化原本建立在 O 上，变基把相应变化重新应用到新基线 N，得到 A′。即使用户意图相近，父关系已经改变，提交身份也会改变；新的组合必须重新验证。 箭头沿祖先到后继方向，真实提交对象记录反向的父引用。示意省略冲突解决细节，A′ 的内容不保证与 A 完全相同，也不能把变基理解成只移动一个显示标签。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#fbfdff" stroke="#fbfdff" rx="0"/><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3"/><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">变基重放变化，产生新的提交身份</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">用具体对象、数值或条件对照，核对这一节的推理。</text><path d="M335,230 L440,230" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M192.5,285 L192.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M335,505 L440,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M725,505 L850,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="50" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="192.5" y="238" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">旧基线 O</text><rect x="440" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="582.5" y="238" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">旧提交 A</text><rect x="50" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="192.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">新基线 N</text><rect x="440" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="582.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">重放后 A′</text><rect x="850" y="450" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10"/><text x="992.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">需重新验证结果</text><text x="60" y="700" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">原创教学图 · 条件、变量含义及适用边界见相邻正文</text></g></svg>
