<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">同一路径同时存在三个版本：提交读取索引</title><desc id="plateDesc">B 把两种差异的比较对象直接写出，避免把暂存理解成一个开关。C 在该状态提交后，HEAD 记录索引的 a=2，而工作区 a=3 仍未进入提交；这里不执行任何提交命令，只解释快照来源。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">同一路径同时存在三个版本：提交读取索引</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">工作区、索引与 HEAD 是三份状态</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">两个 diff 比较不同的边</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">提交只记录索引中的内容</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 630.0" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>同一路径同时存在三个版本：提交读取索引</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="panelA-tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">同一路径同时存在三个版本：提交读取索引</text><rect x="70" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="88" y="220" font-size="25" fill="#173c53">工作区</text><text x="88" y="256" font-size="20" fill="#173c53">同一路径：v3</text><rect x="450" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="468" y="220" font-size="25" fill="#173c53">索引 / 暂存区</text><text x="468" y="256" font-size="20" fill="#173c53">同一路径：v2</text><rect x="830" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="848" y="220" font-size="25" fill="#173c53">HEAD 提交</text><text x="848" y="256" font-size="20" fill="#173c53">同一路径：v1</text><path d="M375,230 L440,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="375" y="170" font-size="21" fill="#173c53">add</text><path d="M755,230 L820,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="752" y="170" font-size="21" fill="#173c53">commit</text><text x="65" y="400" font-size="25" fill="#173c53">当前状态不是三个版本自动同步：</text><rect x="80" y="435" width="1040" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="94.0" y="467" font-size="20" fill="#173c53">检查命令</text><text x="614.0" y="467" font-size="20" fill="#173c53">比较对象</text><path d="M80,483 h1040" stroke="#b9cbd6" /><text x="94.0" y="516" font-size="21" fill="#173c53">git diff</text><text x="614.0" y="516" font-size="21" fill="#173c53">工作区 v3 与 索引 v2</text><path d="M80,533 h1040" stroke="#b9cbd6" /><text x="94.0" y="566" font-size="21" fill="#173c53">git diff --cached</text><text x="614.0" y="566" font-size="21" fill="#173c53">索引 v2 与 HEAD v1</text><text x="55" y="630" font-size="21" fill="#173c53">箭头表示执行命令时更新目标状态；单纯编辑只改变工作区。</text><text x="55" y="662" font-size="21" fill="#173c53">当前若直接 commit，提交的是 v2；只有重新 add 后，v3 才进入索引。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 923) scale(0.7272727273 1) translate(-105 -923)">比较</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 923) scale(0.7272727273 1) translate(-305 -923)">旧值</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 923) scale(0.7272727273 1) translate(-505 -923)">新值</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 978) scale(0.7272727273 1) translate(-105 -978)">工作区对索引</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 978) scale(0.7272727273 1) translate(-305 -978)">a=2</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 978) scale(0.7272727273 1) translate(-505 -978)">a=3</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 1036) scale(0.7272727273 1) translate(-105 -1036)">索引对 HEAD</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 1036) scale(0.7272727273 1) translate(-305 -1036)">a=1</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 1036) scale(0.7272727273 1) translate(-505 -1036)">a=2</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1150) scale(0.7272727273 1) translate(-96 -1150)">当前 HEAD、索引、工作区分别为 1、2、3</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">提交之后 HEAD</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 938.5) scale(0.7272727273 1) translate(-1195 -938.5)">a=2</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 994) scale(0.7272727273 1) translate(-806 -994)">索引</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1008.5) scale(0.7272727273 1) translate(-1195 -1008.5)">a=2</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1064) scale(0.7272727273 1) translate(-806 -1064)">工作区</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1078.5) scale(0.7272727273 1) translate(-1195 -1078.5)">仍为 a=3</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">工作区还存在未暂存的变化</text></g></svg>
