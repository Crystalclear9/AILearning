"#186585" stroke-width="4" marker-end="url(#b)"/><text x="60" y="957" font-size="32" fill="#243b4c" text-anchor="start" font-weight="400">再编辑成 C</text><path d="M511.0000 905 H811.0000 L789.0000 1005 H489.0000 Z" fill="url(#mechanism-wash-t)" stroke="#196d75" stroke-width="1.85" stroke-linejoin="round"/><text x="650" y="967" font-size="37" fill="#475b6c" text-anchor="middle" font-weight="400">rate=A</text><path d="M961.0000 905 H1261.0000 L1239.0000 1005 H939.0000 Z" fill="url(#mechanism-wash-t)" stroke="#196d75" stroke-width="1.85" stroke-linejoin="round"/><text x="1100" y="967" font-size="37" fill="#217296" text-anchor="middle" font-weight="400">rate=B</text><path d="M1411.0000 905 H1711.0000 L1689.0000 1005 H1389.0000 Z" fill="url(#mechanism-wash-c)" stroke="#a74838" stroke-width="1.85" stroke-linejoin="round"/><text x="1550" y="967" font-size="37" fill="#a65b30" text-anchor="middle" font-weight="400">rate=C</text><text x="60" y="1192" font-size="32" fill="#243b4c" text-anchor="start" font-weight="400">普通 git commit</text><path d="M511.0000 1140 H811.0000 L789.0000 1240 H489.0000 Z" fill="url(#mechanism-wash-t)" stroke="#196d75" stroke-width="1.85" stroke-linejoin="round"/><text x="650" y="1202" font-size="37" fill="#217296" text-anchor="middle" font-weight="400">rate=B</text><path d="M961.0000 1140 H1261.0000 L1239.0000 1240 H939.0000 Z" fill="url(#mechanism-wash-t)" stroke="#196d75" stroke-width="1.85" stroke-linejoin="round"/><text x="1100" y="1202" font-size="37" fill="#217296" text-anchor="middle" font-weight="400">rate=B</text><path d="M1411.0000 1140 H1711.0000 L1689.0000 1240 H1389.0000 Z" fill="url(#mechanism-wash-c)" stroke="#a74838" stroke-width="1.85" stroke-linejoin="round"/><text x="1550" y="1202" font-size="37" fill="#a65b30" text-anchor="middle" font-weight="400">rate=C</text><path d="M 1100 1110 C 1100 1050 650 1050 650 1120" fill="none" stroke="#186585" stroke-width="4" marker-end="url(#b)"/></g></svg><g id="round-20261105c-teaching" transform="translate(0 1380) scale(1.25)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">删除工作文件也有两个状态：工作区消失，索引未必消失</text><rect x="65" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="276.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">HEAD：内容A</text><rect x="495" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="706.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">索引：内容A</text><rect x="925" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1136.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">工作区：不存在</text><text x="65" y="260" font-size="38.7px" fill="#213747" text-anchor="start">此时删除尚未暂存：普通 commit 仍可记录索引中的 A。</text><rect x="65" y="315" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="276.0" y="354" font-size="36.12px" fill="#a55f3a" text-anchor="middle">HEAD：内容A</text><rect x="495" y="315" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="706.0" y="354" font-size="36.12px" fill="#a55f3a" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">索引：删除</text><rect x="925" y="315" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="1136.0" y="354" font-size="36.12px" fill="#a55f3a" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">工作区：不存在</text><text x="65" y="417" font-size="34.83px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">把删除加入索引后，下一次提交才记录该路径移除；暂存并不只适用于新增内容。</text></g></g></g></g></g></svg></svg>
