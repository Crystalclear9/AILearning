<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="44" y="52" font-family="Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#18354a" text-anchor="start" font-weight="700">先暂存 B，再编辑 C：提交到底记录哪一个？</text><text x="44" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">与第 8 节实验一致：同一路径 config.txt，内容依次为 rate=A、B、C。</text><rect x="44" y="160" width="405" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="246.5" y="193" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">刚完成的操作</text><rect x="449" y="160" width="235" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="566.5" y="193" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">HEAD 文件</text><rect x="684" y="160" width="235" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="801.5" y="193" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">索引文件</text><rect x="919" y="160" width="235" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="1036.5" y="193" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">工作区文件</text><rect x="44" y="209" width="405" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="246.5" y="242" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">提交初始 A</text><rect x="449" y="209" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="566.5" y="242" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="684" y="209" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="801.5" y="242" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="919" y="209" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1036.5" y="242" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="44" y="258" width="405" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="246.5" y="291" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">编辑成 B</text><rect x="449" y="258" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="566.5" y="291" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="684" y="258" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="801.5" y="291" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="919" y="258" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1036.5" y="291" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">B</text><rect x="44" y="307" width="405" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="246.5" y="340" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">git add</text><rect x="449" y="307" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="566.5" y="340" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="684" y="307" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="801.5" y="340" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#2676b5" text-anchor="middle" font-weight="400">B</text><rect x="919" y="307" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1036.5" y="340" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">B</text><rect x="44" y="356" width="405" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="246.5" y="389" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">继续编辑成 C</text><rect x="449" y="356" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="566.5" y="389" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="684" y="356" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="801.5" y="389" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">B</text><rect x="919" y="356" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1036.5" y="389" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="middle" font-weight="400">C</text><rect x="44" y="405" width="405" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="246.5" y="438" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">普通 git commit</text><rect x="449" y="405" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="566.5" y="438" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#2676b5" text-anchor="middle" font-weight="400">B</text><rect x="684" y="405" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="801.5" y="438" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">B</text><rect x="919" y="405" width="235" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1036.5" y="438" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="middle" font-weight="400">C</text><text x="44" y="535" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">提交前：git diff --staged 比较 A → B；git diff 比较 B → C。</text><text x="44" y="598" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">提交后：索引与新 HEAD 都是 B，暂存差异为空，未暂存差异仍是 B → C。</text><text x="44" y="685" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#cc661c" text-anchor="start" font-weight="400">编辑器测试的是工作区 C；不能据此声称提交 B 已通过相同测试。</text></svg>