<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">同一路径同时存在三个版本：提交读取索引</title><desc id="plateDesc">B 把两种差异的比较对象直接写出，避免把暂存理解成一个开关。C 在该状态提交后，HEAD 记录索引的 a=2，而工作区 a=3 仍未进入提交；这里不执行任何提交命令，只解释快照来源。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">同一路径同时存在三个版本：提交读取索引</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Git</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">工作区、索引与 HEAD 是三份状态</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">两个 diff 比较不同的边</text><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">比较</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">旧值</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">新值</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">工作区对索引</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">a=2</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">a=3</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">索引对 HEAD</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">a=1</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">a=2</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">当前 HEAD、索引、工作区分别为 1、2、3</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">提交只记录索引中的内容</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">提交之后 HEAD</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">a=2</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">索引</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">a=2</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">工作区</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">仍为 a=3</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">工作区还存在未暂存的变化</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 630.0" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>同一路径同时存在三个版本：提交读取索引</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="panelA-tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">同一路径同时存在三个版本：提交读取索引</text><rect x="70" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="88" y="220" font-size="25" fill="#173c53">工作区</text><text x="88" y="256" font-size="20" fill="#173c53">同一路径：v3</text><rect x="450" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="468" y="220" font-size="25" fill="#173c53">索引 / 暂存区</text><text x="468" y="256" font-size="20" fill="#173c53">同一路径：v2</text><rect x="830" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="848" y="220" font-size="25" fill="#173c53">HEAD 提交</text><text x="848" y="256" font-size="20" fill="#173c53">同一路径：v1</text><path d="M375,230 L440,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="375" y="170" font-size="21" fill="#173c53">add</text><path d="M755,230 L820,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="752" y="170" font-size="21" fill="#173c53">commit</text><text x="65" y="400" font-size="25" fill="#173c53">当前状态不是三个版本自动同步：</text><rect x="80" y="435" width="1040" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="94.0" y="467" font-size="20" fill="#173c53">检查命令</text><text x="614.0" y="467" font-size="20" fill="#173c53">比较对象</text><path d="M80,483 h1040" stroke="#b9cbd6" /><text x="94.0" y="516" font-size="21" fill="#173c53">git diff</text><text x="614.0" y="516" font-size="21" fill="#173c53">工作区 v3 ↔ 索引 v2</text><path d="M80,533 h1040" stroke="#b9cbd6" /><text x="94.0" y="566" font-size="21" fill="#173c53">git diff --cached</text><text x="614.0" y="566" font-size="21" fill="#173c53">索引 v2 ↔ HEAD v1</text><text x="55" y="630" font-size="21" fill="#173c53">箭头表示执行命令时更新目标状态；单纯编辑只改变工作区。</text><text x="55" y="662" font-size="21" fill="#173c53">当前若直接 commit，提交的是 v2；只有重新 add 后，v3 才进入索引。</text></g></svg></svg>
