<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>同一路径同时存在三个版本：提交读取索引</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><rect width="1200" height="720" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">同一路径同时存在三个版本：提交读取索引</text><rect x="70" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="88" y="220" font-size="25" fill="#173c53">工作区</text><text x="88" y="256" font-size="20" fill="#173c53">同一路径：v3</text><rect x="450" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="468" y="220" font-size="25" fill="#173c53">索引 / 暂存区</text><text x="468" y="256" font-size="20" fill="#173c53">同一路径：v2</text><rect x="830" y="180" width="300" height="145" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="848" y="220" font-size="25" fill="#173c53">HEAD 提交</text><text x="848" y="256" font-size="20" fill="#173c53">同一路径：v1</text><path d="M375,230 L440,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><text x="375" y="170" font-size="21" fill="#173c53">add</text><path d="M755,230 L820,230" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><text x="752" y="170" font-size="21" fill="#173c53">commit</text><text x="65" y="400" font-size="25" fill="#173c53">当前状态不是三个版本自动同步：</text><rect x="80" y="435" width="1040" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="94.0" y="467" font-size="20" fill="#173c53">检查命令</text><text x="614.0" y="467" font-size="20" fill="#173c53">比较对象</text><path d="M80,483 h1040" stroke="#b9cbd6" /><text x="94.0" y="516" font-size="21" fill="#173c53">git diff</text><text x="614.0" y="516" font-size="21" fill="#173c53">工作区 v3 ↔ 索引 v2</text><path d="M80,533 h1040" stroke="#b9cbd6" /><text x="94.0" y="566" font-size="21" fill="#173c53">git diff --cached</text><text x="614.0" y="566" font-size="21" fill="#173c53">索引 v2 ↔ HEAD v1</text><text x="55" y="630" font-size="21" fill="#173c53">箭头表示执行命令时更新目标状态；单纯编辑只改变工作区。</text><text x="55" y="662" font-size="21" fill="#173c53">当前若直接 commit，提交的是 v2；只有重新 add 后，v3 才进入索引。</text></g></svg>
