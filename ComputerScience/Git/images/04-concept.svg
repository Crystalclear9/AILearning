<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">实验身份：输入依赖汇入清单，清单关联产物</title><desc id="plateDesc">B 和 C 固定同一个求均值程序，只改变两项输入，输出由二变为三。符号 C1、D1、D2 用于说明身份关系，不是实际 Git 或数据摘要；真实实验应记录可核验的身份与有效配置，而不只是一个无法确认内容的路径字符串。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">实验身份：输入依赖汇入清单，清单关联产物</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Git</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">实验身份要覆盖代码以外的依赖</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">同一程序可因数据改变结果</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">同一均值程序</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">代码 C1</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">数据 D1</text><rect x="281" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="381.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">1</text><rect x="488.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="588.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">3</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">输出</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">均值 2</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">C1、D1 是本图的符号身份标签</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">只有 commit 不能固定数据内容</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">代码仍为 C1</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">数据改为 D2</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">D2 的内容</text><rect x="991" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1091.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">1</text><rect x="1198.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1298.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">5</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">输出</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">均值 3</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">应分别固定数据、有效配置与环境身份</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 630.0" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>实验身份：输入依赖汇入清单，清单关联产物</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="panelA-tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">实验身份：输入依赖汇入清单，清单关联产物</text><rect x="55" y="140" width="310" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="73" y="180" font-size="25" fill="#173c53">代码身份</text><text x="73" y="216" font-size="20" fill="#173c53">完整 commit ID</text><rect x="445" y="140" width="310" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="463" y="180" font-size="25" fill="#173c53">输入身份</text><text x="463" y="216" font-size="20" fill="#173c53">数据摘要 + 配置摘要</text><rect x="835" y="140" width="310" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="853" y="180" font-size="25" fill="#173c53">运行环境</text><text x="853" y="216" font-size="20" fill="#173c53">依赖版本 + 随机状态</text><path d="M215,250 L470,365" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M600,250 L600,365" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M990,250 L730,365" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><rect x="420" y="380" width="360" height="105" rx="10" fill="#e7f3fa" stroke="#a4bfce" /><text x="438" y="420" font-size="25" fill="#173c53">实验清单 run.json</text><text x="438" y="456" font-size="20" fill="#173c53">关联代码、输入与环境</text><path d="M595,495 L350,550" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M620,495 L900,550" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="170" y="590" font-size="25" fill="#173c53">模型文件 + 内容摘要</text><text x="790" y="590" font-size="25" fill="#173c53">评价结果 + 指标协议</text><text x="55" y="630" font-size="21" fill="#173c53">提交只固定受版本管理的内容；模型、数据与配置还需可访问的版本和内容身份。</text><text x="55" y="662" font-size="21" fill="#173c53">箭头表示依赖或清单关联，不表示 Git 会自动保存外部数据与模型。</text></g></svg></svg>
