<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>实验身份：输入依赖汇入清单，清单关联产物</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">实验身份：输入依赖汇入清单，清单关联产物</text><rect x="55" y="140" width="310" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce"/><text x="73" y="180" font-size="25" fill="#173c53">代码身份</text><text x="73" y="216" font-size="20" fill="#173c53">完整 commit ID</text><rect x="445" y="140" width="310" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce"/><text x="463" y="180" font-size="25" fill="#173c53">输入身份</text><text x="463" y="216" font-size="20" fill="#173c53">数据摘要 + 配置摘要</text><rect x="835" y="140" width="310" height="100" rx="10" fill="#e7f3fa" stroke="#a4bfce"/><text x="853" y="180" font-size="25" fill="#173c53">运行环境</text><text x="853" y="216" font-size="20" fill="#173c53">依赖版本 + 随机状态</text><path d="M215,250 L470,365" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><path d="M600,250 L600,365" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><path d="M990,250 L730,365" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><rect x="420" y="380" width="360" height="105" rx="10" fill="#e7f3fa" stroke="#a4bfce"/><text x="438" y="420" font-size="25" fill="#173c53">实验清单 run.json</text><text x="438" y="456" font-size="20" fill="#173c53">关联代码、输入与环境</text><path d="M595,495 L350,550" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><path d="M620,495 L900,550" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><text x="170" y="590" font-size="25" fill="#173c53">模型文件 + 内容摘要</text><text x="790" y="590" font-size="25" fill="#173c53">评价结果 + 指标协议</text><text x="55" y="630" font-size="21" fill="#173c53">提交只固定受版本管理的内容；模型、数据与配置还需可访问的版本和内容身份。</text><text x="55" y="662" font-size="21" fill="#173c53">箭头表示依赖或清单关联，不表示 Git 会自动保存外部数据与模型。</text></g></svg>