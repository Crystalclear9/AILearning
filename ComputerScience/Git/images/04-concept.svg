="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同一提交与同一权重，还不能确定输出编号的业务含义</text><rect x="65" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="276.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">同一分数 [0.9,0.1]</text><rect x="495" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="706.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">映射 [猫,狗]</text><rect x="925" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1136.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">编号0 → 猫</text><rect x="65" y="280" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="276.0" y="319" font-size="36.12px" fill="#a55f3a" text-anchor="middle">同一分数 [0.9,0.1]</text><rect x="495" y="280" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="706.0" y="319" font-size="36.12px" fill="#a55f3a" text-anchor="middle">映射 [狗,猫]</text><rect x="925" y="280" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="1136.0" y="319" font-size="36.12px" fill="#a55f3a" text-anchor="middle">编号0 → 狗</text><text x="65" y="412" font-size="34.83px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">类别顺序属于产物契约；代码提交、数据身份、预处理与输出映射应共同绑定。</text></g></g></g></g></g></svg></svg>