<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">相同文件树不代表相同提交</title><desc id="desc">两个提交可以指向完全相同的文件树，却因父引用等提交元数据不同而具有不同身份。文件内容、树快照和提交历史是不同层次，不能用目录内容相同替代对提交身份的固定。 右侧结论框用于比较，不是树对象的真实引用；真正的对象引用只有两条提交到树的箭头。提交还包含作者、提交者等字段，相同文件树只固定了快照的一部分身份。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">相同文件树不代表相同提交</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">明确对象、计算关系与适用条件，避免只凭外观判断。</text><path d="M345,275.272 L520,324.728" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M345,461.63 L520,408.37" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><rect x="60" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="202.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">提交 C1：父引用 P1</text><rect x="60" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="202.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">提交 C2：父引用 P2</text><rect x="520" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="662.5" y="373" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">同一个文件树 T</text><rect x="900" y="310" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" /><text x="1042.5" y="373" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">提交身份仍不同</text><text x="60" y="695" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">条件与计算见相邻正文。</text></g></svg>
