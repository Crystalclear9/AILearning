644  config.txt</text><text xml:space="preserve" x="980" y="555" font-size="36.12px" fill="#23394a" text-anchor="start" font-weight="400">→ 同一个内容对象</text></g><desc> 相同文件树，仍然可以有不同的提交父关系 树身份只固定路径、模式与内容；不同父引用足以改变提交对象。</desc></g></g></g></svg></svg>