<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="650" viewBox="0 47 960 650" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">清理只能删除当前任务确实拥有的资源</title><desc id="artwork-desc">清理集合来自资源所有权，不来自名字长得相似 最终结果即使来自本任务，也已进入发布阶段，应按保留协议管理。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="599.29078"/></clipPath></defs><rect width="960" height="697" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(10.248227 24.368794) scale(0.737589)"><g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2f5467" stroke-width="1.5"/></marker></defs><rect width="1233.75" height="812.5" fill="white" x="20.0" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="35.927885px" fill="#1f3348" text-anchor="start" font-weight="400">同一目录含本任务临时文件、其他任务临时文件和已发布结果</text><text xml:space="preserve" x="70" y="250" font-size="35.927885px" fill="#1f3348" text-anchor="start" font-weight="400">共享父目录</text><line x1="170" y1="285" x2="170" y2="750" stroke="#b0c0cf" stroke-width="4" stroke-dasharray=""/><line x1="170" y1="350" x2="320" y2="350" stroke="#b0c0cf" stroke-width="3" stroke-dasharray=""/><polygon stroke="#147bb1" stroke-width="3" fill="#f7fafc" stroke-dasharray="" points="340,302 550,302 590,342 590,398 340,398"/><text xml:space="preserve" x="460" y="360" font-size="35.927885px" fill="#1f3348" text-anchor="middle" font-weight="400">run-17.tmp</text><text xml:space="preserve" x="660" y="360" font-size="35.927885px" fill="#1e76af" text-anchor="start" font-weight="400">本任务创建</text><line x1="170" y1="550" x2="320" y2="550" stroke="#b0c0cf" stroke-width="3" stroke-dasharray=""/><polygon stroke="#b2591a" stroke-width="3" fill="#f7fafc" stroke-dasharray="" points="340,502 550,502 590,542 590,598 340,598"/><text xml:space="preserve" x="460" y="560" font-size="35.927885px" fill="#1f3348" text-anchor="middle" font-weight="400">run-18.tmp</text><text xml:space="preserve" x="660" y="560" font-size="35.927885px" fill="#a85d22" text-anchor="start" font-weight="400">其他任务创建</text><line x1="170" y1="750" x2="320" y2="750" stroke="#b0c0cf" stroke-width="3" stroke-dasharray=""/><polygon stroke="#67889b" stroke-width="3" fill="#f7fafc" stroke-dasharray="" points="340,702 550,702 590,742 590,798 340,798"/><text xml:space="preserve" x="460" y="760" font-size="35.927885px" fill="#1f3348" text-anchor="middle" font-weight="400">result</text><text xml:space="preserve" x="660" y="760" font-size="35.927885px" fill="#4a758f" text-anchor="start" font-weight="400">已发布的共享结果</text><polyline stroke="#147bb1" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)" points="960,350 1140,350 1140,450"/><text xml:space="preserve" x="1000" y="285" font-size="30.8px" fill="#1e76af" text-anchor="start" font-weight="400">已记录的确切资源</text><text xml:space="preserve" x="1050" y="510" font-size="35.927885px" fill="#1e76af" text-anchor="middle" font-weight="400">允许清理：run-17.tmp</text><polyline stroke="#b2591a" stroke-width="3" fill="none" stroke-dasharray="" points="325,300 300,300 300,600 325,600"/><text xml:space="preserve" x="50" y="845" font-size="35.927885px" fill="#a85d22" text-anchor="start" font-weight="400">宽泛匹配 run-*.tmp 会同时选中 17 与 18：名称模式不证明所有权。</text></g><desc> 清理集合来自资源所有权，不来自名字长得相似 最终结果即使来自本任务，也已进入发布阶段，应按保留协议管理。</desc></g></g></g></svg>