<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="581.48" viewBox="-18.24 28.76 996.48 581.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">逐级目录搜索与最终文件读取的权限检查</title><desc id="artwork-desc">知道文件名，仍须逐级通过目录的搜索权限 知道文件名，仍须逐级通过目录的搜索权限 EACCES</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="494.087681"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="581.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="545" viewBox="0 47 960 545" overflow="hidden"><rect width="960" height="592" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(18.597436 29.553834) scale(0.75033)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="title">知道文件名，仍须逐级通过目录的搜索权限</title><desc id="desc">知道文件名，仍须逐级通过目录的搜索权限 知道文件名，仍须逐级通过目录的搜索权限 EACCES</desc><rect width="1212.8" height="658.494" fill="#ffffff" x="8.533" y="61.901"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#708d9d"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23394a"><text x="40" y="110" font-size="34.83px" fill="#23394a" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">普通非特权进程；只讨论传统权限位，父目录均允许搜索</text><text x="130" y="205" font-size="35.317802px" fill="#23394a" text-anchor="middle" font-weight="400">/</text><rect x="35" y="230" width="190" height="60" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="130" y="271" font-size="35.317802px" fill="#2b739b" text-anchor="middle" font-weight="400">目录 x</text><text x="435" y="205" font-size="35.317802px" fill="#23394a" text-anchor="middle" font-weight="400">project</text><rect x="340" y="230" width="190" height="60" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="435" y="271" font-size="35.317802px" fill="#2b739b" text-anchor="middle" font-weight="400">目录 x</text><text x="770" y="205" font-size="35.317802px" fill="#23394a" text-anchor="middle" font-weight="400">data</text><rect x="675" y="230" width="190" height="60" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="770" y="271" font-size="35.317802px" fill="#2b739b" text-anchor="middle" font-weight="400">目录 x</text><text x="1100" y="205" font-size="35.317802px" fill="#23394a" text-anchor="middle" font-weight="400">sample.txt</text><rect x="1005" y="230" width="190" height="60" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="1100" y="271" font-size="35.317802px" fill="#2b739b" text-anchor="middle" font-weight="400">文件 r</text><line fill="none" stroke="#708d9d" stroke-width="3" marker-end="url(#arrow)" x1="235" y1="255" x2="325" y2="255"/><line fill="none" stroke="#708d9d" stroke-width="3" marker-end="url(#arrow)" x1="540" y1="255" x2="660" y2="255"/><line fill="none" stroke="#708d9d" stroke-width="3" marker-end="url(#arrow)" x1="875" y1="255" x2="990" y2="255"/><text x="40" y="355" font-size="35.317802px" fill="#23394a" text-anchor="start" font-weight="600">data 的权限</text><text x="50" y="420" font-size="35.317802px" fill="#a05e37" text-anchor="start" font-weight="600">r–：可列名称，不能搜索</text><line fill="none" stroke="#ac5e32" stroke-width="3" marker-end="url(#arrow)" x1="690" y1="410" x2="965" y2="410"/><text x="50" y="470" font-size="35.317802px" fill="#23394a" text-anchor="start" font-weight="400">查找 sample.txt 时被拒绝，即使文件自身允许读</text><text x="50" y="565" font-size="35.317802px" fill="#2e7ca7" text-anchor="start" font-weight="600">–x：可搜索，不能列名称</text><line fill="none" stroke="#22739a" stroke-width="3" marker-end="url(#arrow)" x1="690" y1="555" x2="1170" y2="555"/><text x="50" y="615" font-size="35.317802px" fill="#23394a" text-anchor="start" font-weight="400">已知完整文件名时，可继续检查文件 r 并打开</text><text x="40" y="690" font-size="31.32px" fill="#23394a" text-anchor="start" font-weight="400">目录 r 用于读取名称列表；目录 x 用于通过名称查找对象，两者不是替代关系</text><line stroke="#ac5e32" stroke-width="6" x1="985" y1="385" x2="985" y2="435"/><text x="1020" y="420" font-size="35.317802px" fill="#a05e37">EACCES</text></g></g></g></g></svg></svg>
