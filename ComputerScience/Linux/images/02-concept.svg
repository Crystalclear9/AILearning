<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">退出状态、日志与产物三路验收</title><desc id="plateDesc">B 复算主图中的缺失两条记录。C 用事先定义的验收协议解释为什么 stderr 里的进度文本不必然失败，而非零退出也不能只因产物存在就忽略；日志内容应按程序约定解释，任务完成还应包含必要的子进程回收。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">退出状态、日志与产物三路验收</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Linux</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">退出、日志与产物给出不同证据</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">行级验收独立于成功日志</text><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">预期 100 行，实际 98 行</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">缺失记录数：100−98=2</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">即便退出码为 0，仍不满足本例交付规格</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">标准错误有文字不自动代表失败</text><rect x="806" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="815" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">约定的验收协议</text><rect x="1006" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="1015" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">退出码</text><rect x="1206" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="1215" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">100 行齐全</text><rect x="806" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="815" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">stderr 是进度信息</text><rect x="1006" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="1015" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">0</text><rect x="1206" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="1215" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">可通过</text><rect x="806" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="815" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">程序报告失败</text><rect x="1006" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="1015" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">7</text><rect x="1206" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="1215" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">仍应判失败</text><text x="806" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">本例要求退出成功且内容验收通过</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 135 1200.0 640.0" role="img" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>退出状态、日志与产物三路验收</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="panelA-tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker><marker id="panelA-tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker><marker id="panelA-tip-d67c47" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#d67c47" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">退出状态、日志与产物三路验收</text><circle cx="240" cy="300" r="96" fill="#f0f6fa" stroke="#268d8c" stroke-width="4" /><text x="240" y="315" font-size="31" fill="#268d8c" text-anchor="middle" font-weight="400">0</text><text x="240" y="440" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">退出码</text><path d="M240,467 L600,585" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#panelA-tip-268d8c)" /><circle cx="600" cy="300" r="96" fill="#f0f6fa" stroke="#507db3" stroke-width="4" /><text x="600" y="315" font-size="31" fill="#507db3" text-anchor="middle" font-weight="400">完成</text><text x="600" y="440" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">日志文字</text><path d="M600,467 L600,585" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#panelA-tip-507db3)" /><circle cx="960" cy="300" r="96" fill="#f0f6fa" stroke="#d67c47" stroke-width="4" /><text x="960" y="315" font-size="31" fill="#d67c47" text-anchor="middle" font-weight="400">98 条</text><text x="960" y="440" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">产物：应有100条</text><path d="M960,467 L600,585" stroke="#d67c47" stroke-width="3" fill="none" marker-end="url(#panelA-tip-d67c47)" /><rect x="350" y="590" width="500" height="100" fill="#f9e4d7" stroke="#e9b99e" rx="10" /><text x="600" y="650" font-size="30" fill="#a85b32" text-anchor="middle" font-weight="400">独立验收：未通过</text></g></svg></svg>
