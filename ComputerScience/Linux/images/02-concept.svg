#19354a" text-anchor="start" font-weight="400" transform="translate(1015 923) scale(0.7272727273 1) translate(-1015 -923)">退出码</text><rect x="1206" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1215" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 923) scale(0.7272727273 1) translate(-1215 -923)">100 行齐全</text><rect x="806" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="815" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 978) scale(0.7272727273 1) translate(-815 -978)">stderr 是进度信息</text><rect x="1006" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1015" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 978) scale(0.7272727273 1) translate(-1015 -978)">0</text><rect x="1206" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1215" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 978) scale(0.7272727273 1) translate(-1215 -978)">可通过</text><rect x="806" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="815" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 1036) scale(0.7272727273 1) translate(-815 -1036)">程序报告失败</text><rect x="1006" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1015" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 1036) scale(0.7272727273 1) translate(-1015 -1036)">7</text><rect x="1206" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1215" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 1036) scale(0.7272727273 1) translate(-1215 -1036)">仍应判失败</text><t