<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">退出状态、日志与产物三路验收</title><desc id="desc">父进程应组合多个信号验收结果。退出零但产物缺少记录仍不是成功；标准错误出现进度条也不自动表示失败，必须结合程序约定和独立内容检查。 图中没有把日志当作数据库提交记录。超时与信号终止时，还要等待并回收子进程，区分正常退出、合作清理和强制终止造成的不同状态。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#cb7845"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="55" font-size="32" fill="#18324d" font-weight="700">退出状态、日志与产物三路验收</text><rect x="45" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="67" y="230" font-size="25" fill="#18324d" font-weight="700">子进程退出码</text><text x="67" y="366" font-size="21" fill="#315d59">零状态只说明程序声明成功</text><rect x="440" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="462" y="230" font-size="25" fill="#18324d" font-weight="700">标准输出与错误流</text><text x="462" y="366" font-size="21" fill="#315d59">日志可能缓冲或不完整</text><rect x="835" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="857" y="230" font-size="25" fill="#18324d" font-weight="700">独立校验的产物</text><text x="857" y="366" font-size="21" fill="#315d59">产物需核对模式与输入身份</text><text x="60" y="525" font-size="23" fill="#18324d">三个并列的验收信号：需共同核对，不代表先后生成关系。</text><text x="50" y="612" font-size="19" fill="#637789">原创教学示意图 · 具体假设与省略内容见正文图解</text></g></svg>