<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">可见发布与崩溃持久性分层</title><desc id="plateDesc">B 区分一次运行观察与跨故障保证。C 给出需要按存储模型实施的验证设计：在多个发布阶段注入故障，再核对恢复版本、摘要和内容完整性；图没有凭空给出这些实验在所有文件系统上的结论，也没有把同步操作当作任意故障的万能保证。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">可见发布与崩溃持久性分层</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">原子可见性与持久恢复分别论证</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">一次成功读取得到的证据有限</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">故障注入应覆盖不同发布阶段</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 135 1200.0 640.0" role="img" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>可见发布与崩溃持久性分层</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="panelA-tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">可见发布与崩溃持久性分层</text><circle cx="170" cy="245" r="14" fill="#507db3" /><text x="70" y="198" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">写入内容</text><path d="M190,245 L418,245" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#panelA-tip-507db3)" /><circle cx="440" cy="245" r="14" fill="#507db3" /><text x="340" y="198" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">刷新内容</text><path d="M460,245 L688,245" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#panelA-tip-507db3)" /><circle cx="710" cy="245" r="14" fill="#268d8c" /><text x="610" y="198" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">原子替换路径</text><path d="M730,245 L958,245" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#panelA-tip-507db3)" /><circle cx="980" cy="245" r="14" fill="#268d8c" /><text x="880" y="198" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">同步目录项</text><text x="90" y="355" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">读者可见性</text><rect x="170" y="390" width="540" height="75" fill="#e5edf7" stroke="#cbd9e5" rx="10" /><text x="440" y="437" font-size="27" fill="#20384f" text-anchor="middle" font-weight="400">旧版</text><rect x="710" y="390" width="340" height="75" fill="#d8eee7" stroke="#cbd9e5" rx="10" /><text x="880" y="437" font-size="27" fill="#268d8c" text-anchor="middle" font-weight="400">新版</text><path d="M710,270 L710,500" stroke="#d67c47" stroke-width="2" fill="none" /><text x="710" y="540" font-size="24" fill="#d67c47" text-anchor="middle" font-weight="400">路径切换点</text><text x="110" y="625" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">崩溃恢复还要核对：内容同步、目录项同步及底层存储保证。</text><text x="110" y="685" font-size="24" fill="#5c7185" text-anchor="start" font-weight="400">“没有半文件”与“断电后能恢复新版”是两个需要分别论证的性质。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 923) scale(0.7272727273 1) translate(-105 -923)">观察</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 923) scale(0.7272727273 1) translate(-305 -923)">能够说明</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 923) scale(0.7272727273 1) translate(-505 -923)">不能单独说明</text><rect x="96" y="953" width="197" height="65" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 978) scale(0.7272727273 1) translate(-105 -978)">读到完整新版</text><rect x="296" y="953" width="197" height="65" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 978) scale(0.7272727273 1) translate(-305 -978)">该次读未见半文件</text><rect x="496" y="953" width="197" height="65" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 978) scale(0.7272727273 1) translate(-505 -978)">任意故障后都可恢复</text><rect x="96" y="1021" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="105" y="1046" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 1046) scale(0.7272727273 1) translate(-105 -1046)">内容校验通过</text><rect x="296" y="1021" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="305" y="1046" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 1046) scale(0.7272727273 1) translate(-305 -1046)">该次字节符合清单</text><rect x="496" y="1021" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="505" y="1046" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 1046) scale(0.7272727273 1) translate(-505 -1046)">目录项已持久化</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1150) scale(0.7272727273 1) translate(-96 -1150)">验证对象、时间和故障模型必须明确</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">注入点</text><rect x="991" y="900" width="131.333" height="65" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1056.67" y="939.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1056.67 939.5) scale(0.7272727273 1) translate(-1056.67 -939.5)">写入中</text><rect x="1129.33" y="900" width="131.333" height="65" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1195" y="939.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 939.5) scale(0.7272727273 1) translate(-1195 -939.5)">替换后</text><rect x="1267.67" y="900" width="131.333" height="65" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1333.33" y="939.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1333.33 939.5) scale(0.7272727273 1) translate(-1333.33 -939.5)">同步后</text><text x="806" y="996" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 996) scale(0.7272727273 1) translate(-806 -996)">恢复检查</text><rect x="991" y="972" width="131.333" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1056.67" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1056.67 1011.5) scale(0.7272727273 1) translate(-1056.67 -1011.5)">版本身份</text><rect x="1129.33" y="972" width="131.333" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1011.5) scale(0.7272727273 1) translate(-1195 -1011.5)">内容摘要</text><rect x="1267.67" y="972" width="131.333" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1333.33" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1333.33 1011.5) scale(0.7272727273 1) translate(-1333.33 -1011.5)">完整性</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">这是需要执行的验证设计，不宣称所有平台结果相同</text></g></svg>
