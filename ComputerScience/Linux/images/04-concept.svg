<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>可见发布与崩溃持久性分层</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="605" fill="white" stroke="#dce6ee" rx="18" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">可见发布与崩溃持久性分层</text><circle cx="170" cy="245" r="14" fill="#507db3" /><text x="70" y="198" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">写入内容</text><path d="M190,245 L418,245" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><circle cx="440" cy="245" r="14" fill="#507db3" /><text x="340" y="198" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">刷新内容</text><path d="M460,245 L688,245" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><circle cx="710" cy="245" r="14" fill="#268d8c" /><text x="610" y="198" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">原子替换路径</text><path d="M730,245 L958,245" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><circle cx="980" cy="245" r="14" fill="#268d8c" /><text x="880" y="198" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">同步目录项</text><text x="90" y="355" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">读者可见性</text><rect x="170" y="390" width="540" height="75" fill="#e5edf7" stroke="#cbd9e5" rx="10" /><text x="440" y="437" font-size="27" fill="#20384f" text-anchor="middle" font-weight="400">旧版</text><rect x="710" y="390" width="340" height="75" fill="#d8eee7" stroke="#cbd9e5" rx="10" /><text x="880" y="437" font-size="27" fill="#268d8c" text-anchor="middle" font-weight="400">新版</text><path d="M710,270 L710,500" stroke="#d67c47" stroke-width="2" fill="none" /><text x="710" y="540" font-size="24" fill="#d67c47" text-anchor="middle" font-weight="400">路径切换点</text><text x="110" y="625" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">崩溃恢复还要核对：内容同步、目录项同步及底层存储保证。</text><text x="110" y="685" font-size="24" fill="#5c7185" text-anchor="start" font-weight="400">“没有半文件”与“断电后能恢复新版”是两个需要分别论证的性质。</text></g></svg>
