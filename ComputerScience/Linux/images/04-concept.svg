<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">可见发布与崩溃持久性分层</title><desc id="desc">图中先区分可见性和持久性：替换路径可以在适用条件下形成清晰切换点，但机器崩溃后保留下来的内容和目录项还取决于同步及底层存储语义。 成功返回不能证明任意故障都不丢数据。检查点应结合版本身份、内容校验和恢复演练；本地文件测试也不能直接作为对象存储或多文件事务的保证。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#cb7845"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="55" font-size="32" fill="#18324d" font-weight="700">可见发布与崩溃持久性分层</text><rect x="45" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="67" y="230" font-size="25" fill="#18324d" font-weight="700">数据写入并刷新</text><text x="67" y="366" font-size="21" fill="#315d59">读者是否看到半文件</text><rect x="440" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="462" y="230" font-size="25" fill="#18324d" font-weight="700">校验后原子替换</text><text x="462" y="366" font-size="21" fill="#315d59">故障后能否恢复新名称</text><rect x="835" y="190" width="320" height="250" rx="16" fill="#f1f6fb" stroke="#527a9d" stroke-width="2"/><text x="857" y="230" font-size="25" fill="#18324d" font-weight="700">目录项与存储持久化</text><text x="857" y="366" font-size="21" fill="#315d59">两种保证需要分别论证</text><path d="M372 315 L430 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M767 315 L825 315" stroke="#cb7845" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="60" y="525" font-size="23" fill="#18324d">读图顺序：先辨认对象与数值，再追踪箭头表示的变换或依赖。</text><text x="50" y="612" font-size="19" fill="#637789">原创教学示意图 · 具体假设与省略内容见正文图解</text></g></svg>