<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="625.48" viewBox="-18.24 28.76 996.48 625.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">可见发布与崩溃持久性分层</title><desc id="artwork-desc">发布新文件：内容同步与目录项同步分别作用于不同对象 应用异常实验可核验旧、新内容与调用顺序；断电恢复保证仍需文件系统和设备契约。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="538.155253"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="625.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="589" viewBox="0 47 960 589" overflow="hidden"><rect width="960" height="636" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.801922 35.991388) scale(0.588362)"><g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#325666" stroke-width="1.5"/></marker></defs><rect width="1546.667" height="914.667" fill="#ffffff" x="17.333" y="68.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#23394a"><text xml:space="preserve" x="50" y="125" font-size="37.41px" fill="#23394a" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同一文件系统、单写者；图中实线表示名字到对象的关联</text><text xml:space="preserve" x="50" y="220" font-size="38.7px" fill="#23394a" text-anchor="start" font-weight="400">先写完并验证临时对象 B</text><rect x="65" y="285" width="330" height="410" rx="0" fill="#ffffff" stroke="#becdd8" stroke-width="3"/><text xml:space="preserve" x="95" y="335" font-size="36.12px" fill="#23394a" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">父目录的名称关联</text><text xml:space="preserve" x="100" y="435" font-size="43.86px" fill="#23394a" text-anchor="start" font-weight="400">data</text><line x1="230" y1="425" x2="505" y2="410" stroke="#207aa4" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="100" y="595" font-size="41.28px" fill="#23394a" text-anchor="start" font-weight="400">pending</text><line x1="270" y1="585" x2="505" y2="565" stroke="#207aa4" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="520" y="355" width="200" height="110" rx="0" fill="#f0f6f9" stroke="#becdd8" stroke-width="3"/><text xml:space="preserve" x="620" y="398" font-size="38.7px" fill="#23394a" text-anchor="middle" font-weight="400">对象 A</text><text xml:space="preserve" x="620" y="442" font-size="36.12px" fill="#23394a" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">旧字节</text><rect x="520" y="510" width="200" height="125" rx="0" fill="#fbf4ee" stroke="#be7548" stroke-width="3"/><text xml:space="preserve" x="620" y="555" font-size="38.7px" fill="#23394a" text-anchor="middle" font-weight="400">对象 B</text><text xml:space="preserve" x="620" y="604" font-size="36.12px" fill="#23394a" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">新字节</text><text xml:space="preserve" x="860" y="220" font-size="38.7px" fill="#23394a" text-anchor="start" font-weight="400">rename 以后，正式名字改指向 B</text><rect x="875" y="285" width="330" height="410" rx="0" fill="#ffffff" stroke="#becdd8" stroke-width="3"/><text xml:space="preserve" x="905" y="335" font-size="36.12px" fill="#23394a" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">父目录的名称关联</text><text xml:space="preserve" x="910" y="435" font-size="43.86px" fill="#23394a" text-anchor="start" font-weight="400">data</text><line x1="1040" y1="425" x2="1315" y2="545" stroke="#a65625" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="910" y="595" font-size="36.12px" fill="#4c768b" text-anchor="start" font-weight="400">pending 已移除</text><rect x="1330" y="355" width="200" height="110" rx="0" fill="#f0f6f9" stroke="#becdd8" stroke-width="3"/><text xml:space="preserve" x="1430" y="398" font-size="38.7px" fill="#23394a" text-anchor="middle" font-weight="400">旧 A</text><text xml:space="preserve" x="1430" y="442" font-size="36.12px" fill="#23394a" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">可能回收</text><rect x="1330" y="510" width="200" height="125" rx="0" fill="#fbf4ee" stroke="#be7548" stroke-width="3"/><text xml:space="preserve" x="1430" y="555" font-size="38.7px" fill="#23394a" text-anchor="middle" font-weight="400">对象 B</text><text xml:space="preserve" x="1430" y="604" font-size="36.12px" fill="#23394a" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">新字节</text><line x1="790" y1="175" x2="790" y2="950" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><line stroke="#207aa4" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)" x1="620" y1="735" x2="620" y2="643"/><text xml:space="preserve" x="50" y="790" font-size="34.83px" fill="#2878a3" text-anchor="start" font-weight="400">fsync(临时文件)：请求同步 B 的内容与文件元数据</text><line stroke="#a65625" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)" x1="1040" y1="735" x2="1040" y2="704"/><text xml:space="preserve" x="860" y="790" font-size="34.83px" fill="#9e592b" text-anchor="start" font-weight="400">fsync(父目录)：请求同步名称关联变化</text><text xml:space="preserve" x="50" y="900" font-size="37.41px" fill="#23394a" text-anchor="start" font-weight="400">rename 给读者一个可见的名字切换点；不等于所有存储层都已持久确认。</text></g><desc> 发布新文件：内容同步与目录项同步分别作用于不同对象 应用异常实验可核验旧、新内容与调用顺序；断电恢复保证仍需文件系统和设备契约。</desc></g></g></g></svg></svg>