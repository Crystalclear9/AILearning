<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770"><rect width="1280" height="770" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="50" y="55" font-size="32" fill="#203449" text-anchor="start">环境是启动时的输入：旧子进程不会随父级配置同步更新</text><text x="50" y="103" font-size="26" fill="#203449" text-anchor="start">父级为每次启动显式传入环境映射 env；跟踪其中同一个变量的值</text><text x="550" y="177" font-size="28" fill="#203449" text-anchor="middle">父级映射 env</text><text x="850" y="177" font-size="28" fill="#203449" text-anchor="middle">子进程 1</text><text x="1130" y="177" font-size="28" fill="#203449" text-anchor="middle">子进程 2</text><path d="M50 294L1230 294" stroke="#e1e8ee" stroke-width="2"/><text x="50" y="255" font-size="26" fill="#203449" text-anchor="start">以 A 启动子进程 1</text><text x="550" y="258" font-size="38" fill="#247bb5" text-anchor="middle">A</text><text x="850" y="258" font-size="38" fill="#247bb5" text-anchor="middle">A</text><text x="1130" y="258" font-size="38" fill="#8b98a3" text-anchor="middle">—</text><path d="M50 404L1230 404" stroke="#e1e8ee" stroke-width="2"/><text x="50" y="365" font-size="26" fill="#203449" text-anchor="start">父级将映射改为 B</text><text x="550" y="368" font-size="38" fill="#087e7c" text-anchor="middle">B</text><text x="850" y="368" font-size="38" fill="#247bb5" text-anchor="middle">A</text><text x="1130" y="368" font-size="38" fill="#8b98a3" text-anchor="middle">—</text><path d="M50 514L1230 514" stroke="#e1e8ee" stroke-width="2"/><text x="50" y="475" font-size="26" fill="#203449" text-anchor="start">子进程 1 自己改成 C</text><text x="550" y="478" font-size="38" fill="#087e7c" text-anchor="middle">B</text><text x="850" y="478" font-size="38" fill="#b95a17" text-anchor="middle">C</text><text x="1130" y="478" font-size="38" fill="#8b98a3" text-anchor="middle">—</text><path d="M50 624L1230 624" stroke="#e1e8ee" stroke-width="2"/><text x="50" y="585" font-size="26" fill="#203449" text-anchor="start">用当前映射启动子进程 2</text><text x="550" y="588" font-size="38" fill="#087e7c" text-anchor="middle">B</text><text x="850" y="588" font-size="38" fill="#b95a17" text-anchor="middle">C</text><text x="1130" y="588" font-size="38" fill="#087e7c" text-anchor="middle">B</text><text x="50" y="713" font-size="25" fill="#203449" text-anchor="start">父级变化不回写旧子进程；子进程变化不回写父级；新子进程取得下一次启动传入的值。</text></g></svg>