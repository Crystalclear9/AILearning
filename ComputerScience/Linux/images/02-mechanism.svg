<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">环境继承是创建子进程时的一次传递</title><desc id="desc">创建子进程时，环境作为输入传递过去。父进程随后改变自己的环境，不会自动修改已经运行的子进程环境；这有助于区分当前终端设置与实际服务进程真正拿到的输入。 图示默认继承环境，调用方也可以显式构造或过滤子进程环境。共享配置文件、进程间通信等是另外的更新通道，不能与环境继承混为一谈。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#fbfdff" stroke="#fbfdff" rx="0"/><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3"/><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">环境继承是创建子进程时的一次传递</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">用具体对象、数值或条件对照，核对这一节的推理。</text><path d="M340,230 L430,230" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M715,230 L830,230" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M197.5,285 L197.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M972.5,285 L972.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="55" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="197.5" y="238" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">父进程：MODE=A</text><rect x="430" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="572.5" y="238" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">创建子进程</text><rect x="830" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="972.5" y="238" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">子进程初始 MODE=A</text><rect x="55" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10"/><text x="197.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">父进程改为 MODE=B</text><rect x="830" y="450" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10"/><text x="972.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">已存在子进程仍为 A</text><text x="60" y="700" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">原创教学图 · 条件、变量含义及适用边界见相邻正文</text></g></svg>
