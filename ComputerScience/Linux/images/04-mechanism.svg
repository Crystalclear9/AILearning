<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">诊断证据需要排除竞争解释</title><desc id="desc">同一指标通常能由多个机制产生。先列出竞争解释，再设计能区分它们的观察，才能把“看到相关现象”推进到有证据的诊断；例如低 GPU 利用率本身不能证明应增加数据工作进程。 表中的检查是推理示例，不是固定命令清单。应控制采样边界、测量开销及工作负载，必要时用单因素干预检验诊断是否支持性能改善。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#fbfdff" stroke="#fbfdff" rx="0"/><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3"/><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">诊断证据需要排除竞争解释</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">用具体对象、数值或条件对照，核对这一节的推理。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">观测</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">可能解释之一</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">仍需区分的解释</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">下一项检查</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">CPU 使用率低</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="345" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">等待 I/O</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="615" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">锁等待、供数慢</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="885" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">分阶段耗时</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0"/><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">内存占用高</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0"/><text x="345" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">对象持续增长</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0"/><text x="615" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">缓存与分配器保留</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0"/><text x="885" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">生命周期与计数范围</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">GPU 利用率低</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="345" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">主机供数不足</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="615" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">同步、短核、通信</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="885" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">设备时间线</text><text x="60" y="700" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">原创教学图 · 条件、变量含义及适用边界见相邻正文</text></g></svg>
