<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">路径名称与打开文件对象</title><desc id="desc">替换路径改变目录中的名称关联，已经打开的描述符仍引用原打开对象。读者因此可能继续读旧内容，而后来打开同一路径的读者看到新版本。 图解依赖适用的 Linux 文件系统语义，不能直接推广到所有网络存储或 Windows 挂载映射。权限检查、原子可见性和断电持久性也属于不同层次。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><rect width="1200" height="640" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">路径名称与打开文件对象</text><rect x="60" y="160" width="340" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="85" y="200" font-size="24" fill="#18324d" font-weight="400">替换前：名称 data</text><text x="85" y="240" font-size="22" fill="#18324d" font-weight="400">打开 fd 后保留引用</text><rect x="780" y="120" width="330" height="100" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2" /><text x="810" y="180" font-size="24" fill="#18324d" font-weight="400">旧 inode：旧内容</text><rect x="780" y="390" width="330" height="100" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="810" y="450" font-size="24" fill="#18324d" font-weight="400">新 inode：新内容</text><rect x="60" y="390" width="340" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="85" y="430" font-size="24" fill="#18324d" font-weight="400">替换后：名称 data</text><text x="85" y="470" font-size="22" fill="#18324d" font-weight="400">以后打开时重新解析</text><path d="M410 205 L765 170" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#tip-c9773e)" /><text x="450" y="155" font-size="22" fill="#18324d" font-weight="400">已有 fd 仍指向旧对象</text><path d="M410 440 L765 440" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#tip-c9773e)" /><text x="455" y="410" font-size="22" fill="#18324d" font-weight="400">新路径查询</text><text x="90" y="565" font-size="24" fill="#18324d" font-weight="400">原子替换切换名称指向；不会把已有文件描述符自动迁移到新对象</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
