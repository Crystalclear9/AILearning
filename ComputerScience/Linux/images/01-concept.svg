<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">路径名称与打开文件对象</title><desc id="plateDesc">B 为旧、新对象各指定一组可辨识内容，说明已有句柄不会因路径替换自动换目标。C 单独取消唯一目录链接后，已有打开引用仍可保留对象；其他硬链接、映射和具体文件系统规则也会影响生命周期，不能仅据名称消失推断空间已回收。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">路径名称与打开文件对象</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Linux</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">路径名称与已有文件描述符分离</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">已有句柄与新打开读到不同版本</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">替换前打开的 fd</text><rect x="281" y="900" width="200.5" height="65" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="381.25" y="939.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">旧 inode</text><rect x="488.5" y="900" width="200.5" height="65" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="588.75" y="939.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">内容 [1,2]</text><text x="96" y="996" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">替换后新 open</text><rect x="281" y="972" width="200.5" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="381.25" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">新 inode</text><rect x="488.5" y="972" width="200.5" height="65" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="588.75" y="1011.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">内容 [3,4]</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">这里假设替换的是同文件系统中的路径入口</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">删除名称不等于所有引用消失</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">唯一目录名字</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">已取消链接</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">已有打开 fd</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">仍引用对象</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">空间回收</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">还需结合其余引用</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">图省略其他硬链接与映射</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">路径名称与打开文件对象</title><desc id="panelA-desc">替换路径改变目录中的名称关联，已经打开的描述符仍引用原打开对象。读者因此可能继续读旧内容，而后来打开同一路径的读者看到新版本。 图解依赖适用的 Linux 文件系统语义，不能直接推广到所有网络存储或 Windows 挂载映射。权限检查、原子可见性和断电持久性也属于不同层次。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">路径名称与打开文件对象</text><rect x="60" y="160" width="340" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="85" y="200" font-size="24" fill="#18324d" font-weight="400">替换前：名称 data</text><text x="85" y="240" font-size="22" fill="#18324d" font-weight="400">打开 fd 后保留引用</text><rect x="780" y="120" width="330" height="100" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2" /><text x="810" y="180" font-size="24" fill="#18324d" font-weight="400">旧 inode：旧内容</text><rect x="780" y="390" width="330" height="100" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="810" y="450" font-size="24" fill="#18324d" font-weight="400">新 inode：新内容</text><rect x="60" y="390" width="340" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="85" y="430" font-size="24" fill="#18324d" font-weight="400">替换后：名称 data</text><text x="85" y="470" font-size="22" fill="#18324d" font-weight="400">以后打开时重新解析</text><path d="M410 205 L765 170" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="450" y="155" font-size="22" fill="#18324d" font-weight="400">已有 fd 仍指向旧对象</text><path d="M410 440 L765 440" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="455" y="410" font-size="22" fill="#18324d" font-weight="400">新路径查询</text><text x="90" y="565" font-size="24" fill="#18324d" font-weight="400">原子替换切换名称指向；不会把已有文件描述符自动迁移到新对象</text></g></svg></svg>
