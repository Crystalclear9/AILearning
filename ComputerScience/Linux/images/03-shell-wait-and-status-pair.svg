<text x="76" y="557" fill="#a84b3b" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="23" text-anchor="start" font-weight="400">Bash 不带参数的 wait 等完所有作业后返回 0。</text>
<text x="76" y="608" fill="#657682" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="22" text-anchor="start" font-weight="400">应在每个 wait 之后立即保存状态。</text>
</svg></svg>
