<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" role="img" aria-labelledby="title description" viewBox="0 0 1200 1306.18181818"><title id="title">后台作业与退出状态</title><desc id="description">(a) 逐个等待才能取得每个作业状态。(b) 后台作业需要逐个等待。</desc><rect width="1200" fill="#fff" height="1306.18181818"/><text x="60" y="35" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="600" fill="#196f77">(a)</text><view id="a" viewBox="0 51 1200 528.181818182"/><view id="a-textbook-detail-1-1" viewBox="0 51 684 301.063636364"/><view id="a-textbook-detail-1-2" viewBox="516 51 684 301.063636364"/><view id="a-textbook-detail-2-1" viewBox="0 278.118181818 684 301.063636364"/><view id="a-textbook-detail-2-2" viewBox="516 278.118181818 684 301.063636364"/><svg width="1200" height="528.181818182" viewBox="0 0 1320 581" role="img" aria-labelledby="a-plate-title a-plate-desc" id="panel-a" x="0" y="51">
<title id="a-plate-title">逐个等待才能取得每个作业状态</title><desc id="a-plate-desc">三个作业结束状态为 0、7、0。父进程逐个等待并保存，不以最后一个状态代表全部。</desc><defs><marker id="a-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="a-wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="a-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="a-wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="a-arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="a-wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="a-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="a-wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="a-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="a-wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="a-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="a-wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="581" fill="white" stroke="none" stroke-width="1.6"/><text x="243" y="63" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" text-anchor="middle" font-weight="400">各自退出</text><text x="1037" y="63" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" text-anchor="middle" font-weight="400">父进程分别记账</text><polygon points="112,199 302,199 347,127 157,127" stroke="#196f77" fill="url(#a-wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="229.5" y="174.9" fill="#196f77" font-size="34" font-family="Cambria, Noto Serif, Georgia, serif" text-anchor="middle" font-weight="400">PID 1</text><line x1="365" y1="163" x2="515" y2="163" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a-arrow-teal)"/><text x="575" y="175" fill="#196f77" font-size="34" font-family="Segoe UI, DejaVu Sans, sans-serif" text-anchor="middle" font-weight="400" transform="translate(575 161) scale(0.8627451) translate(-575 -161)">0</text><line x1="628" y1="163" x2="806" y2="163" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a-arrow-teal)"/><polygon points="829,199 1162,199 1207,127 874,127" stroke="#196f77" fill="url(#a-wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="1018" y="173.85" fill="#196f77" font-size="31" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" text-anchor="middle" font-weight="400">wait "$pid1" → 0</text><polygon points="112,335 302,335 347,263 157,263" stroke="#a84b3b" fill="url(#a-wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="229.5" y="310.9" fill="#a84b3b" font-size="34" font-family="Cambria, Noto Serif, Georgia, serif" text-anchor="middle" font-weight="400">PID 2</text><line x1="365" y1="299" x2="515" y2="299" stroke="#a84b3b" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a-arrow-coral)"/><text x="575" y="311" fill="#a84b3b" font-size="34" font-family="Segoe UI, DejaVu Sans, sans-serif" text-anchor="middle" font-weight="400" transform="translate(575 297) scale(0.8627451) translate(-575 -297)">7</text><line x1="628" y1="299" x2="806" y2="299" stroke="#a84b3b" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a-arrow-coral)"/><polygon points="829,335 1162,335 1207,263 874,263" stroke="#a84b3b" fill="url(#a-wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="1018" y="309.85" fill="#a84b3b" font-size="31" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" text-anchor="middle" font-weight="400">wait "$pid2" → 7</text><polygon points="112,471 302,471 347,399 157,399" stroke="#196f77" fill="url(#a-wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="229.5" y="446.9" fill="#196f77" font-size="34" font-family="Cambria, Noto Serif, Georgia, serif" text-anchor="middle" font-weight="400">PID 3</text><line x1="365" y1="435" x2="515" y2="435" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a-arrow-teal)"/><text x="575" y="447" fill="#196f77" font-size="34" font-family="Segoe UI, DejaVu Sans, sans-serif" text-anchor="middle" font-weight="400" transform="translate(575 433) scale(0.8627451) translate(-575 -433)">0</text><line x1="628" y1="435" x2="806" y2="435" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a-arrow-teal)"/><polygon points="829,471 1162,471 1207,399 874,399" stroke="#196f77" fill="url(#a-wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="1018" y="445.85" fill="#196f77" font-size="31" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" text-anchor="middle" font-weight="400">wait "$pid3" → 0</text><text x="663" y="548" fill="#202a37" font-size="30" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" text-anchor="middle" font-weight="400">第二个作业失败，第三个成功不能覆盖它</text></svg><line x1="58" x2="1142" y1="591.181818182" y2="591.181818182" stroke="#dce6e8" stroke-width="1"/><text x="60" y="638.181818182" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="600" fill="#196f77">(b)</text><view id="b" viewBox="0 654.181818182 1200 652"/><view id="b-textbook-detail-1-1" viewBox="0 654.181818182 540 293.4"/><view id="b-textbook-detail-1-2" viewBox="330 654.181818182 540 293.4"/><view id="b-textbook-detail-1-3" viewBox="660 654.181818182 540 293.4"/><view id="b-textbook-detail-2-1" viewBox="0 833.481818182 540 293.4"/><view id="b-textbook-detail-2-2" viewBox="330 833.481818182 540 293.4"/><view id="b-textbook-detail-2-3" viewBox="660 833.481818182 540 293.4"/><view id="b-textbook-detail-3-1" viewBox="0 984.994845962 591.14166667 321.18697222"/><view id="b-textbook-detail-3-2" viewBox="330 1012.78181818 540 293.4"/><view id="b-textbook-detail-3-3" viewBox="660 1012.78181818 540 293.4"/><svg width="1200" height="652" viewBox="0 0 1200 652" role="img" aria-labelledby="b-fig-title b-fig-desc" id="panel-b" x="0" y="654.181818182">
