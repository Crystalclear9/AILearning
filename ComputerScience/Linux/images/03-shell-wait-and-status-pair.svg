<desc id="b-fig-desc">示意任务长度三、一、二。按启动顺序等待会先得到 A 的结果，但 B 实际更早结束。</desc>
<rect x="0" y="0" width="1200" height="652" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="b-t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf6f6"/></linearGradient>
