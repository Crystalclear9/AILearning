<linearGradient id="b-n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7f8"/></linearGradient>
<linearGradient id="b-blue" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f1f8"/></linearGradient>
<linearGradient id="b-ochre" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7f0d9"/></linearGradient>
<linearGradient id="b-green" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf5ee"/></linearGradient>
</defs>
