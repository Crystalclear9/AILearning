<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="585" viewBox="0 0 960 585" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">容器内存限制可能先于主机容量成为边界</title><desc id="artwork-desc">同一cgroup当前计费三点八GB，新增零点四GB需求，合计四点二超过示意四GB边界；需求不等于已驻留量。排查还需区分high节流和max硬限制。 容器内存：把需求、计费量和限制分开</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="487.666667"/></clipPath></defs><rect width="960" height="585" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">容器内存限制可能先于主机容量成为边界</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(13.333333 26.222222) scale(0.777778)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">容器内存：把需求、计费量和限制分开</title><desc id="figure-desc">同一cgroup当前计费三点八GB，新增零点四GB需求，合计四点二超过示意四GB边界；需求不等于已驻留量。排查还需区分high节流和max硬限制。 容器内存：把需求、计费量和限制分开</desc><rect width="1170.0" height="627.0" fill="white" x="15.0" y="64.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="34.071429px" fill="#1f3449" text-anchor="start" font-weight="400">十进制 GB 的示意账本；按同一 cgroup 计费范围比较</text><line x1="210" y1="170" x2="210" y2="375" stroke="#d9e1e8" stroke-width="1"/><text x="210" y="160" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">0</text><line x1="410" y1="170" x2="410" y2="375" stroke="#d9e1e8" stroke-width="1"/><text x="410" y="160" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">1</text><line x1="610" y1="170" x2="610" y2="375" stroke="#d9e1e8" stroke-width="1"/><text x="610" y="160" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">2</text><line x1="810" y1="170" x2="810" y2="375" stroke="#d9e1e8" stroke-width="1"/><text x="810" y="160" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">3</text><line x1="1010" y1="170" x2="1010" y2="375" stroke="#d9e1e8" stroke-width="1"/><text x="1010" y="160" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">4</text><text x="40" y="245" font-size="34.071429px" fill="#1f3449" text-anchor="start" font-weight="400">需求</text><rect x="210" y="210" width="760" height="70" fill="#2472b1"/><rect x="970.0" y="210" width="80" height="70" fill="#c57439"/><text x="590.0" y="255" font-size="34.071429px" fill="white" text-anchor="middle" font-weight="400">当前 3.8</text><text x="970.0" y="325" font-size="34.071429px" fill="#a86331" text-anchor="middle" font-weight="400">新增 0.4</text><line x1="1010" y1="185" x2="1010" y2="375" stroke="#b9642b" stroke-width="2.5" stroke-dasharray="6 5"/><text x="1010" y="420" font-size="34.071429px" fill="#a86331" text-anchor="middle" font-weight="400">memory.max = 4 GB</text><text x="40" y="480" font-size="34.071429px" fill="#1f3449" text-anchor="start" font-weight="400">需求合计 4.2 GB：越线部分不是已成功驻留的内存。</text><rect x="40" y="530" width="330" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="205.0" y="574.1" font-size="30.16px" fill="#2472b1" text-anchor="middle" font-weight="400">核对 memory.current</text><line fill="none" stroke="#176fa3" stroke-width="2.8" marker-end="url(#arrow-blue)" x1="390" y1="565" x2="445" y2="565"/><rect x="465" y="530" width="300" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="615.0" y="574.1" font-size="30.16px" fill="#2472b1" text-anchor="middle" font-weight="400">结合回收与事件计数</text><line fill="none" stroke="#176fa3" stroke-width="2.8" marker-end="url(#arrow-blue)" x1="785" y1="565" x2="840" y2="565"/><rect x="860" y="530" width="300" height="70" rx="6" fill="url(#book-wash-fff0e3)" stroke="#b9642b" stroke-width="1.5"/><text x="1010.0" y="574.1" font-size="33.54px" fill="#a86331" text-anchor="middle" font-weight="400">再判断压力来源</text><text x="40" y="660" font-size="33.54px" fill="#1f3449" text-anchor="start" font-weight="400">memory.high：回收与节流；memory.max：硬限制与相应处理。</text></g></g></g></g></svg>