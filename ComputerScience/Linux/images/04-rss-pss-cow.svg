<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img"><title>同一组页映射：RSS不变，写时复制增加物理页</title><desc>三个进程各映射四个共享物理页和一个私有页。一个进程复制共享页后，各RSS仍为五页，总PSS从七页变八页。</desc><rect width="1400" height="1040" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="54" font-size="32" fill="#23394b" text-anchor="start" font-weight="600">RSS 数映射；PSS 分摊物理页；写时复制会改变共享关系</text><text x="40" y="105" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">只跟踪图中等大小、已驻留的普通页；不计其他进程、内核和缓存</text><text x="40" y="169" font-size="28" fill="#23394b" text-anchor="start" font-weight="600">写入前：三个进程共享 A–D</text><text x="40" y="216" font-size="25" fill="#63788a" text-anchor="start" font-weight="400">每个格子的文字是物理页身份</text><text x="40" y="283" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">进程 0</text><rect x="150" y="250" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="188" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">A</text><rect x="234" y="250" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="272" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">B</text><rect x="318" y="250" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="356" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">C</text><rect x="402" y="250" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="440" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">D</text><rect x="486" y="250" width="76" height="52" rx="6" fill="#587b6a" stroke="none"/><text x="524" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">P0</text><text x="590" y="284" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">RSS 5</text><text x="40" y="370" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">进程 1</text><rect x="150" y="337" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="188" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">A</text><rect x="234" y="337" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="272" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">B</text><rect x="318" y="337" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="356" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">C</text><rect x="402" y="337" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="440" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">D</text><rect x="486" y="337" width="76" height="52" rx="6" fill="#587b6a" stroke="none"/><text x="524" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">P1</text><text x="590" y="371" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">RSS 5</text><text x="40" y="457" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">进程 2</text><rect x="150" y="424" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="188" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">A</text><rect x="234" y="424" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="272" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">B</text><rect x="318" y="424" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="356" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">C</text><rect x="402" y="424" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="440" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">D</text><rect x="486" y="424" width="76" height="52" rx="6" fill="#587b6a" stroke="none"/><text x="524" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">P2</text><text x="590" y="458" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">RSS 5</text><text x="40" y="552" font-size="27" fill="#23394b" text-anchor="start" font-weight="400">物理页只数一次：</text><rect x="40" y="579" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="105" y="612" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">A</text><rect x="184" y="579" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="249" y="612" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">B</text><rect x="328" y="579" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="393" y="612" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">C</text><rect x="472" y="579" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="537" y="612" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">D</text><rect x="40" y="641" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="105" y="674" font-size="25" fill="#587b6a" text-anchor="middle" font-weight="400">P0</text><rect x="184" y="641" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="249" y="674" font-size="25" fill="#587b6a" text-anchor="middle" font-weight="400">P1</text><rect x="328" y="641" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="393" y="674" font-size="25" fill="#587b6a" text-anchor="middle" font-weight="400">P2</text><text x="40" y="748" font-size="27" fill="#2368a2" text-anchor="start" font-weight="400">PSS：三个进程各分摊约 2.333 页</text><text x="40" y="792" font-size="28" fill="#23394b" text-anchor="start" font-weight="600">物理页合计：7 页</text><text x="735" y="169" font-size="28" fill="#23394b" text-anchor="start" font-weight="600">写入后：进程 1 拥有新页 D′</text><text x="735" y="216" font-size="25" fill="#63788a" text-anchor="start" font-weight="400">每个格子的文字是物理页身份</text><text x="735" y="283" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">进程 0</text><rect x="845" y="250" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="883" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">A</text><rect x="929" y="250" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="967" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">B</text><rect x="1013" y="250" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="1051" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">C</text><rect x="1097" y="250" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="1135" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">D</text><rect x="1181" y="250" width="76" height="52" rx="6" fill="#587b6a" stroke="none"/><text x="1219" y="285" font-size="25" fill="white" text-anchor="middle" font-weight="400">P0</text><text x="1285" y="284" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">RSS 5</text><text x="735" y="370" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">进程 1</text><rect x="845" y="337" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="883" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">A</text><rect x="929" y="337" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="967" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">B</text><rect x="1013" y="337" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="1051" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">C</text><rect x="1097" y="337" width="76" height="52" rx="6" fill="#c56728" stroke="none"/><text x="1135" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">D′</text><rect x="1181" y="337" width="76" height="52" rx="6" fill="#587b6a" stroke="none"/><text x="1219" y="372" font-size="25" fill="white" text-anchor="middle" font-weight="400">P1</text><text x="1285" y="371" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">RSS 5</text><text x="735" y="457" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">进程 2</text><rect x="845" y="424" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="883" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">A</text><rect x="929" y="424" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="967" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">B</text><rect x="1013" y="424" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="1051" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">C</text><rect x="1097" y="424" width="76" height="52" rx="6" fill="#2368a2" stroke="none"/><text x="1135" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">D</text><rect x="1181" y="424" width="76" height="52" rx="6" fill="#587b6a" stroke="none"/><text x="1219" y="459" font-size="25" fill="white" text-anchor="middle" font-weight="400">P2</text><text x="1285" y="458" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">RSS 5</text><text x="735" y="552" font-size="27" fill="#23394b" text-anchor="start" font-weight="400">物理页只数一次：</text><rect x="735" y="579" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="800" y="612" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">A</text><rect x="879" y="579" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="944" y="612" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">B</text><rect x="1023" y="579" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="1088" y="612" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">C</text><rect x="1167" y="579" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="1232" y="612" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">D</text><rect x="735" y="641" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="800" y="674" font-size="25" fill="#587b6a" text-anchor="middle" font-weight="400">P0</text><rect x="879" y="641" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="944" y="674" font-size="25" fill="#587b6a" text-anchor="middle" font-weight="400">P1</text><rect x="1023" y="641" width="130" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="1088" y="674" font-size="25" fill="#587b6a" text-anchor="middle" font-weight="400">P2</text><rect x="1167" y="641" width="130" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="1232" y="674" font-size="25" fill="#c56728" text-anchor="middle" font-weight="400">D′</text><text x="735" y="748" font-size="27" fill="#2368a2" text-anchor="start" font-weight="400">PSS：2.5 + 3 + 2.5 = 8 页</text><text x="735" y="792" font-size="28" fill="#23394b" text-anchor="start" font-weight="600">物理页合计：8 页</text><line x1="700" y1="145" x2="700" y2="820" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="856" width="1320" height="132" rx="6" fill="#e8f1f8" stroke="none"/><text x="65" y="897" font-size="30" fill="#2368a2" text-anchor="start" font-weight="600">两侧 RSS 相加都是 15 页；物理页却从 7 页增加到 8 页。</text><text x="65" y="944" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">进程 1 写 D 后得到 D′；旧 D 仍由进程 0、2 共享。</text><text x="40" y="1020" font-size="24" fill="#63788a" text-anchor="start" font-weight="400">PSS 总和仅在计入全部共享者、同一时刻与同一页集合时，才还原该集合的物理占用。</text></g></svg>