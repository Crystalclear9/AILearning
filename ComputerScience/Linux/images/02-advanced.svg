<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title id="figure-title">父子树与进程组：信号范围不是同一张树</title><desc id="figure-desc">PID100创建101，101创建102，102另建会话并属于进程组102。父子链仍存在，而进程组100只含100和101。</desc><rect width="1200" height="720" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">父子树与进程组：信号范围不是同一张树</text><text x="40" y="115" font-size="28" fill="#213447" text-anchor="start" font-weight="400">POSIX 示例：102 建立新会话，亲缘关系仍然存在</text><text x="40" y="185" font-size="29" fill="#213447" text-anchor="start" font-weight="600">父子树：箭头表示创建关系</text><rect x="80" y="225" width="300" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="230.0" y="273.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">PID 100</text><path d="M230 315 L230 345" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="80" y="365" width="300" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="230.0" y="413.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">PID 101</text><path d="M230 455 L230 485" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="80" y="505" width="300" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="230.0" y="553.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">PID 102</text><text x="650" y="185" font-size="29" fill="#213447" text-anchor="start" font-weight="600">信号作用域按目标身份选择</text><rect x="650" y="225" width="500" height="150" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="685" y="275" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">进程组 100</text><text x="685" y="335" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">成员：100、101</text><rect x="650" y="435" width="500" height="150" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="685" y="485" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">进程组 102</text><text x="685" y="545" font-size="30" fill="#c87536" text-anchor="start" font-weight="400">成员：102</text><text x="40" y="665" font-size="27" fill="#213447" text-anchor="start" font-weight="400">给 PID 100 发信号只指向它；给进程组 100 发信号不包含 102。</text></g></svg>
