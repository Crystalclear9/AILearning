<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">后台作业需要逐个等待</title><desc id="plateDesc">B 在时刻一失败，C 在二结束，但 A 到三才结束。只等 C 不但可能看到零退出，还可能在 A 尚未完成时提前报告。图采用三个独立、必要作业的假设，汇总协议应同时保证等待与回收完整、失败状态不丢失。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">后台作业需要逐个等待</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Linux</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">后台作业各自有状态与完成时刻</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">逐个 wait 后汇总所有状态</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">A 的退出码</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">0</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">B 的退出码</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">7</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">C 的退出码</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">0</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">任一必要作业失败，本例整体应报告失败</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">只等待最后一个无法证明完成</text><text x="914" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400">0</text><text x="1151" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400">1.5</text><text x="1388" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400">3</text><text x="806" y="965" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">A：0</text><text x="806" y="1030" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">B：7</text><text x="806" y="1095" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">C：0</text><rect x="914" y="935" width="471" height="44" rx="3" fill="#d5ebe4" stroke="#d5e1e8"/><text x="1149.5" y="964" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">运行</text><rect x="914" y="1000" width="155" height="44" rx="3" fill="#e0eaf6" stroke="#d5e1e8"/><text x="991.5" y="1029" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">运行</text><rect x="914" y="1065" width="313" height="44" rx="3" fill="#f8e5d2" stroke="#d5e1e8"/><text x="1070.5" y="1094" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400">运行</text><text x="1406" y="1159" font-size="20" fill="#5c7281" text-anchor="end" font-weight="400">逻辑时间（见正文假设）</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">后台作业需要逐个等待</title><desc id="panelA-desc">每个后台作业有独立退出结果，监督者需要保存身份、逐个等待并汇总。示例中最后作业成功，不能覆盖中间作业失败的事实。 等待顺序不等于完成顺序。真正的脚本还要处理中断、清理和重试幂等；set -e 的例外上下文很多，不能把打开一个选项当作完整监督协议。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">后台作业需要逐个等待</text><text x="80" y="135" font-size="27" fill="#18324d" font-weight="400">分别启动并保存 PID，再逐一 wait</text><rect x="80" y="190" width="250" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="110" y="235" font-size="24" fill="#18324d" font-weight="400">作业 A / PID A</text><text x="110" y="275" font-size="22" fill="#18324d" font-weight="400">退出码 0</text><rect x="475" y="190" width="250" height="100" rx="8" fill="#fbe5dc" stroke="#47769a" stroke-width="2" /><text x="505" y="235" font-size="24" fill="#18324d" font-weight="400">作业 B / PID B</text><text x="505" y="275" font-size="22" fill="#a23f2a" font-weight="400">退出码 7</text><rect x="870" y="190" width="250" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="900" y="235" font-size="24" fill="#18324d" font-weight="400">作业 C / PID C</text><text x="900" y="275" font-size="22" fill="#18324d" font-weight="400">退出码 0</text><path d="M205 305 L520 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M600 305 L600 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M995 305 L680 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><rect x="390" y="445" width="440" height="80" rx="8" fill="#fbe5dc" stroke="#47769a" stroke-width="2" /><text x="420" y="495" font-size="24" fill="#18324d" font-weight="400">汇总：存在失败，不能报全成功</text><text x="80" y="580" font-size="24" fill="#18324d" font-weight="400">仅查看最后一个 wait 的状态，会把 B 的失败隐藏在 C 的成功之后</text></g></svg></svg>
