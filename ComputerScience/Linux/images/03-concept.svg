<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">后台作业需要逐个等待</title><desc id="plateDesc">B 在时刻一失败，C 在二结束，但 A 到三才结束。只等 C 不但可能看到零退出，还可能在 A 尚未完成时提前报告。图采用三个独立、必要作业的假设，汇总协议应同时保证等待与回收完整、失败状态不丢失。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">后台作业需要逐个等待</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">后台作业各自有状态与完成时刻</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">逐个 wait 后汇总所有状态</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">只等待最后一个无法证明完成</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">后台作业需要逐个等待</title><desc id="panelA-desc">每个后台作业有独立退出结果，监督者需要保存身份、逐个等待并汇总。示例中最后作业成功，不能覆盖中间作业失败的事实。 等待顺序不等于完成顺序。真正的脚本还要处理中断、清理和重试幂等；set -e 的例外上下文很多，不能把打开一个选项当作完整监督协议。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">后台作业需要逐个等待</text><text x="80" y="135" font-size="27" fill="#18324d" font-weight="400">分别启动并保存 PID，再逐一 wait</text><rect x="80" y="190" width="250" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="110" y="235" font-size="24" fill="#18324d" font-weight="400">作业 A / PID A</text><text x="110" y="275" font-size="22" fill="#18324d" font-weight="400">退出码 0</text><rect x="475" y="190" width="250" height="100" rx="8" fill="#fbe5dc" stroke="#47769a" stroke-width="2" /><text x="505" y="235" font-size="24" fill="#18324d" font-weight="400">作业 B / PID B</text><text x="505" y="275" font-size="22" fill="#a23f2a" font-weight="400">退出码 7</text><rect x="870" y="190" width="250" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="900" y="235" font-size="24" fill="#18324d" font-weight="400">作业 C / PID C</text><text x="900" y="275" font-size="22" fill="#18324d" font-weight="400">退出码 0</text><path d="M205 305 L520 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M600 305 L600 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M995 305 L680 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><rect x="390" y="445" width="440" height="80" rx="8" fill="#fbe5dc" stroke="#47769a" stroke-width="2" /><text x="420" y="495" font-size="24" fill="#18324d" font-weight="400">汇总：存在失败，不能报全成功</text><text x="80" y="580" font-size="24" fill="#18324d" font-weight="400">仅查看最后一个 wait 的状态，会把 B 的失败隐藏在 C 的成功之后</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">A 的退出码</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 938.5) scale(0.7272727273 1) translate(-485 -938.5)">0</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">B 的退出码</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1008.5) scale(0.7272727273 1) translate(-485 -1008.5)">7</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">C 的退出码</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1078.5) scale(0.7272727273 1) translate(-485 -1078.5)">0</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">任一必要作业失败，本例整体应报告失败</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="914" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(914 913) scale(0.7272727273 1) translate(-914 -913)">0</text><text x="1151" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(1151 913) scale(0.7272727273 1) translate(-1151 -913)">1.5</text><text x="1388" y="913" font-size="18" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(1388 913) scale(0.7272727273 1) translate(-1388 -913)">3</text><text x="806" y="965" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 965) scale(0.7272727273 1) translate(-806 -965)">A：0</text><text x="806" y="1030" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1030) scale(0.7272727273 1) translate(-806 -1030)">B：7</text><text x="806" y="1095" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1095) scale(0.7272727273 1) translate(-806 -1095)">C：0</text><rect x="914" y="935" width="471" height="44" rx="3" fill="#d5ebe4" stroke="#d5e1e8" /><text x="1149.5" y="964" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1149.5 964) scale(0.7272727273 1) translate(-1149.5 -964)">运行</text><rect x="914" y="1000" width="155" height="44" rx="3" fill="#e0eaf6" stroke="#d5e1e8" /><text x="991.5" y="1029" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(991.5 1029) scale(0.7272727273 1) translate(-991.5 -1029)">运行</text><rect x="914" y="1065" width="313" height="44" rx="3" fill="#f8e5d2" stroke="#d5e1e8" /><text x="1070.5" y="1094" font-size="20" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1070.5 1094) scale(0.7272727273 1) translate(-1070.5 -1094)">运行</text><text x="1406" y="1159" font-size="20" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(1406 1159) scale(0.7272727273 1) translate(-1406 -1159)">逻辑时间（见正文假设）</text></g></svg>
