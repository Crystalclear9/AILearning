<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">后台作业需要逐个等待</title><desc id="desc">每个后台作业有独立退出结果，监督者需要保存身份、逐个等待并汇总。示例中最后作业成功，不能覆盖中间作业失败的事实。 等待顺序不等于完成顺序。真正的脚本还要处理中断、清理和重试幂等；set -e 的例外上下文很多，不能把打开一个选项当作完整监督协议。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">后台作业需要逐个等待</text><text x="80" y="135" font-size="27" fill="#18324d" font-weight="400">分别启动并保存 PID，再逐一 wait</text><rect x="80" y="190" width="250" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="110" y="235" font-size="24" fill="#18324d" font-weight="400">作业 A / PID A</text><text x="110" y="275" font-size="22" fill="#18324d" font-weight="400">退出码 0</text><rect x="475" y="190" width="250" height="100" rx="8" fill="#fbe5dc" stroke="#47769a" stroke-width="2"/><text x="505" y="235" font-size="24" fill="#18324d" font-weight="400">作业 B / PID B</text><text x="505" y="275" font-size="22" fill="#a23f2a" font-weight="400">退出码 7</text><rect x="870" y="190" width="250" height="100" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="900" y="235" font-size="24" fill="#18324d" font-weight="400">作业 C / PID C</text><text x="900" y="275" font-size="22" fill="#18324d" font-weight="400">退出码 0</text><path d="M205 305 L520 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 305 L600 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M995 305 L680 430" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="445" width="440" height="80" rx="8" fill="#fbe5dc" stroke="#47769a" stroke-width="2"/><text x="420" y="495" font-size="24" fill="#18324d" font-weight="400">汇总：存在失败，不能报全成功</text><text x="80" y="580" font-size="24" fill="#18324d" font-weight="400">仅查看最后一个 wait 的状态，会把 B 的失败隐藏在 C 的成功之后</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
