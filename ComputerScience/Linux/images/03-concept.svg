<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="922.48" viewBox="-18.24 28.76 996.48 922.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">后台作业需要逐个等待</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="835.487431"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="922.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="886" viewBox="0 47 960 886" overflow="hidden"><rect width="960" height="933" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>03-Shell脚本参数与作业管理</title><svg width="1440" height="872.093" viewBox="18.750 70.000 1290.000 781.250"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#325666" stroke-width="1.5"/></marker></defs><rect width="1290.0" height="781.25" fill="#ffffff" x="18.75" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#23394a"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#23394a" text-anchor="start" font-weight="400">示意时长 A=3、B=1、C=2；退出状态分别为 0、7、0</text><text xml:space="preserve" x="50" y="185" font-size="27" fill="#23394a" text-anchor="start" font-weight="400">横轴是教学时间单位，不是 Bash 在本机测得的秒数</text><text xml:space="preserve" x="60" y="345" font-size="32" fill="#23394a" text-anchor="start" font-weight="400">任务 A</text><rect x="260" y="300" width="600" height="75" rx="0" fill="#ebf4fa" stroke="#207aa4" stroke-width="2"/><text xml:space="preserve" x="280" y="349" font-size="29" fill="#2878a3" text-anchor="start" font-weight="400">exit 0</text><circle cx="1070" cy="335" r="30" fill="#f3f6f8" stroke="#899fb5" stroke-width="2"/><text xml:space="preserve" x="1070" y="345" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1130" y="345" font-size="29" fill="#2878a3" text-anchor="start" font-weight="400">wait A → 0</text><text xml:space="preserve" x="60" y="515" font-size="32" fill="#23394a" text-anchor="start" font-weight="400">任务 B</text><rect x="260" y="470" width="200" height="75" rx="0" fill="#fbf4ee" stroke="#a65625" stroke-width="2"/><text xml:space="preserve" x="280" y="519" font-size="29" fill="#9e592b" text-anchor="start" font-weight="400">exit 7</text><circle cx="1070" cy="505" r="30" fill="#f3f6f8" stroke="#899fb5" stroke-width="2"/><text xml:space="preserve" x="1070" y="515" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="1130" y="515" font-size="29" fill="#9e592b" text-anchor="start" font-weight="400">wait B → 7</text><text xml:space="preserve" x="60" y="685" font-size="32" fill="#23394a" text-anchor="start" font-weight="400">任务 C</text><rect x="260" y="640" width="400" height="75" rx="0" fill="#ebf4fa" stroke="#207aa4" stroke-width="2"/><text xml:space="preserve" x="280" y="689" font-size="29" fill="#2878a3" text-anchor="start" font-weight="400">exit 0</text><circle cx="1070" cy="675" r="30" fill="#f3f6f8" stroke="#899fb5" stroke-width="2"/><text xml:space="preserve" x="1070" y="685" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">3</text><text xml:space="preserve" x="1130" y="685" font-size="29" fill="#2878a3" text-anchor="start" font-weight="400">wait C → 0</text><line x1="260" y1="765" x2="920" y2="765" stroke="#899fb5" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="260" y1="755" x2="260" y2="775" stroke="#899fb5" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="260" y="820" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">0</text><line x1="460" y1="755" x2="460" y2="775" stroke="#899fb5" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="460" y="820" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">1</text><line x1="660" y1="755" x2="660" y2="775" stroke="#899fb5" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="660" y="820" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">2</text><line x1="860" y1="755" x2="860" y2="775" stroke="#899fb5" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="860" y="820" font-size="29" fill="#23394a" text-anchor="middle" font-weight="400">3</text><text xml:space="preserve" x="1000" y="230" font-size="29" fill="#23394a" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">按启动次序等待</text></g><desc> 后台作业：完成次序与等待次序是两件事 只等最后启动的 C 会得到 0；逐项收集后，整体才能识别 B 的失败。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 872.093) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start">裸 wait 的成功状态，不等于所有后台作业都成功</text><rect x="65" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="271.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">A：exit0</text><rect x="485" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="691.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">B：exit7</text><rect x="905" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1111.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">C：exit0</text><text x="65" y="275" font-size="38.7px" fill="#a55f3a" text-anchor="start">Bash：wait 不带参数，等待全部作业后返回 0</text><text x="65" y="345" font-size="38.7px" fill="#277290" text-anchor="start">逐个 wait PID：保存 [0,7,0]，才能按整批规则判定失败</text><text x="65" y="420" font-size="36.12px" fill="#213747" text-anchor="start">必须在命令之后立即保存状态；后续成功打印会覆盖 $?。</text></g></g></g></g></g></svg></svg>