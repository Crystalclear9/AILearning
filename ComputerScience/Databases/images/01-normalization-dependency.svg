<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">当前城市的重复维护异常与订单用户拆表后的唯一连接</title><desc id="artwork-desc">拆表不是少存信息：让同一事实只维护一次</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="492.73415"/></clipPath></defs><rect width="960" height="590" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">当前城市的重复维护异常与订单用户拆表后的唯一连接</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(12.523321 31.560741) scale(0.731041)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#446578" stroke-width="1.6"/></marker></defs><rect width="1244.8" height="674.017" fill="white" x="17.067" y="60.789"/><text x="44" y="110" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="36.12px" fill="#243b53" text-anchor="start" font-weight="400">当前城市重复在订单中：一次搬家要同步三行</text><rect x="44" y="135" width="160" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="124.0" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">订单</text><rect x="204" y="135" width="160" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="284.0" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">用户</text><rect x="364" y="135" width="230" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="479.0" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">当前城市</text><rect x="44" y="184" width="160" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="124.0" y="217" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29.75px" fill="#243b53" text-anchor="middle" font-weight="400">101</text><rect x="204" y="184" width="160" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="284.0" y="217" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">U1</text><rect x="364" y="184" width="230" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="479.0" y="217" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">甲城</text><rect x="44" y="233" width="160" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="124.0" y="266" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29.75px" fill="#243b53" text-anchor="middle" font-weight="400">102</text><rect x="204" y="233" width="160" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="284.0" y="266" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">U1</text><rect x="364" y="233" width="230" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="479.0" y="266" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">甲城</text><rect x="44" y="282" width="160" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="124.0" y="315" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29.75px" fill="#243b53" text-anchor="middle" font-weight="400">103</text><rect x="204" y="282" width="160" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="284.0" y="315" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">U1</text><rect x="364" y="282" width="230" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="479.0" y="315" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#af5a1d" text-anchor="middle" font-weight="400">乙城</text><text x="650" y="185" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="36.12px" fill="#1e78b7" text-anchor="start" font-weight="400">规则：用户 → 当前城市</text><text x="650" y="238" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#af5a1d" text-anchor="start" font-weight="400">U1 同时出现甲城与乙城，违反依赖</text><text x="650" y="287" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#243b53" text-anchor="start" font-weight="400">订单主键唯一，并不能阻止这个矛盾</text><line x1="44" y1="365" x2="1236" y2="365" stroke="#bdcad7" stroke-width="2" stroke-dasharray=""/><text x="44" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="36.12px" fill="#243b53" text-anchor="start" font-weight="400">订单：每笔订单的用户归属</text><rect x="44" y="440" width="180" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="134.0" y="473" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">订单</text><rect x="224" y="440" width="180" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="314.0" y="473" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">用户</text><rect x="44" y="489" width="180" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="134.0" y="522" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29.75px" fill="#243b53" text-anchor="middle" font-weight="400">101</text><rect x="224" y="489" width="180" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="314.0" y="522" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">U1</text><rect x="44" y="538" width="180" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="134.0" y="571" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29.75px" fill="#243b53" text-anchor="middle" font-weight="400">102</text><rect x="224" y="538" width="180" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="314.0" y="571" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">U1</text><rect x="44" y="587" width="180" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="134.0" y="620" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29.75px" fill="#243b53" text-anchor="middle" font-weight="400">103</text><rect x="224" y="587" width="180" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="314.0" y="620" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">U1</text><text x="565" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="36.12px" fill="#243b53" text-anchor="start" font-weight="400">用户：每个用户的一项当前事实</text><rect x="565" y="440" width="180" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="655.0" y="473" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29px" fill="#243b53" text-anchor="middle" font-weight="600">用户（主键）</text><rect x="745" y="440" width="230" height="49" rx="0" fill="url(#book-wash-edf4f9)" stroke="#cfd9e2"/><text x="860.0" y="473" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="600">当前城市</text><rect x="565" y="489" width="180" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="655.0" y="522" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">U1</text><rect x="745" y="489" width="230" height="49" rx="0" fill="white" stroke="#cfd9e2"/><text x="860.0" y="522" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32.25px" fill="#243b53" text-anchor="middle" font-weight="400">乙城</text><line x1="425" y1="536" x2="529" y2="536" stroke="#bdcad7" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="1108" y="485" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#1e78b7" text-anchor="middle" font-weight="400">按用户连接</text><text x="1108" y="535" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30.96px" fill="#243b53" text-anchor="middle" font-weight="400">每单恰好匹配一次</text><text x="1108" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30.96px" fill="#243b53" text-anchor="middle" font-weight="400">3 条订单仍为 3 条</text><text x="44" y="705" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#243b53" text-anchor="start" font-weight="400">若需要下单时城市，应保存订单快照或地址历史；不能拿当前城市代替。</text><desc> 拆表不是少存信息：让同一事实只维护一次</desc></g></g></g></svg>