xt><text x="1108" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30.96px" fill="#284154" text-anchor="middle" font-weight="400">3 条订单仍为 3 条</text><text x="44" y="705" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="33.54px" fill="#284154" text-anchor="start" font-weight="400">若需要下单时城市，应保存订单快照或地址历史；不能拿当前城市代替。</text><desc> 拆表不是少存信息：让同一事实只维护一次</desc></g></g></g></svg></svg>
