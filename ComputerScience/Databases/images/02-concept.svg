<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>左连接：一个订单 × 两条同键属性 = 两条结果</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">左连接：一个订单 × 两条同键属性 = 两条结果</text><text x="65" y="125" font-size="22" fill="#173c53">订单表（左）</text><rect x="65" y="150" width="450" height="98" rx="10" fill="#edf5fb" stroke="#a4bfce"/><text x="79.0" y="182" font-size="20" fill="#173c53">订单</text><text x="229.0" y="182" font-size="20" fill="#173c53">用户</text><text x="379.0" y="182" font-size="20" fill="#173c53">金额</text><path d="M65,198 h450" stroke="#b9cbd6"/><text x="79.0" y="231" font-size="21" fill="#173c53">O1</text><text x="229.0" y="231" font-size="21" fill="#173c53">U</text><text x="379.0" y="231" font-size="21" fill="#173c53">100</text><text x="650" y="125" font-size="22" fill="#173c53">属性表（右）</text><rect x="650" y="150" width="450" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce"/><text x="664.0" y="182" font-size="20" fill="#173c53">用户</text><text x="889.0" y="182" font-size="20" fill="#173c53">版本</text><path d="M650,198 h450" stroke="#b9cbd6"/><text x="664.0" y="231" font-size="21" fill="#173c53">U</text><text x="889.0" y="231" font-size="21" fill="#173c53">V1</text><path d="M650,248 h450" stroke="#b9cbd6"/><text x="664.0" y="281" font-size="21" fill="#173c53">U</text><text x="889.0" y="281" font-size="21" fill="#173c53">V2</text><path d="M300,270 L480,375" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><path d="M860,310 L720,375" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#arr)"/><text x="490" y="340" font-size="22" fill="#173c53">按用户 LEFT JOIN</text><rect x="300" y="395" width="600" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce"/><text x="314.0" y="427" font-size="20" fill="#173c53">订单</text><text x="514.0" y="427" font-size="20" fill="#173c53">金额</text><text x="714.0" y="427" font-size="20" fill="#173c53">版本</text><rect x="302" y="443" width="596" height="49" fill="#d4eddc"/><path d="M300,443 h600" stroke="#b9cbd6"/><text x="314.0" y="476" font-size="21" fill="#173c53">O1</text><text x="514.0" y="476" font-size="21" fill="#173c53">100</text><text x="714.0" y="476" font-size="21" fill="#173c53">V1</text><rect x="302" y="493" width="596" height="49" fill="#d4eddc"/><path d="M300,493 h600" stroke="#b9cbd6"/><text x="314.0" y="526" font-size="21" fill="#173c53">O1</text><text x="514.0" y="526" font-size="21" fill="#173c53">100</text><text x="714.0" y="526" font-size="21" fill="#173c53">V2</text><text x="55" y="630" font-size="21" fill="#173c53">订单键仍然存在，但金额被携带两次：直接 SUM 会从 100 变成 200。</text><text x="55" y="662" font-size="21" fill="#173c53">没有匹配时才补一条 NULL；业务要求一对一时必须先验证右表唯一性。</text></g></svg>