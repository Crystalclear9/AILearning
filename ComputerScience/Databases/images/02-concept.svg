<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">左连接：一个订单 × 两条同键属性 = 两条结果</title><desc id="plateDesc">B 沿两条匹配分别生成结果行，从而看清为什么不能只验收查询成功。C 通过属性键唯一性改变配对数量；若业务要求每订单一行，可以用约束、历史版本选择或连接基数验证落实这个要求，不能事后把不明重复行随意去重。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">左连接：一个订单 × 两条同键属性 = 两条结果</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">连接的基数决定结果粒度</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">一笔订单可在结果中出现两次</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">唯一属性键保留订单粒度</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 630.0" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>左连接：一个订单 × 两条同键属性 = 两条结果</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="panelA-tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">左连接：一个订单 × 两条同键属性 = 两条结果</text><text x="65" y="125" font-size="22" fill="#173c53">订单表（左）</text><rect x="65" y="150" width="450" height="98" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="79.0" y="182" font-size="20" fill="#173c53">订单</text><text x="229.0" y="182" font-size="20" fill="#173c53">用户</text><text x="379.0" y="182" font-size="20" fill="#173c53">金额</text><path d="M65,198 h450" stroke="#b9cbd6" /><text x="79.0" y="231" font-size="21" fill="#173c53">O1</text><text x="229.0" y="231" font-size="21" fill="#173c53">U</text><text x="379.0" y="231" font-size="21" fill="#173c53">100</text><text x="650" y="125" font-size="22" fill="#173c53">属性表（右）</text><rect x="650" y="150" width="450" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="664.0" y="182" font-size="20" fill="#173c53">用户</text><text x="889.0" y="182" font-size="20" fill="#173c53">版本</text><path d="M650,198 h450" stroke="#b9cbd6" /><text x="664.0" y="231" font-size="21" fill="#173c53">U</text><text x="889.0" y="231" font-size="21" fill="#173c53">V1</text><path d="M650,248 h450" stroke="#b9cbd6" /><text x="664.0" y="281" font-size="21" fill="#173c53">U</text><text x="889.0" y="281" font-size="21" fill="#173c53">V2</text><path d="M300,270 L480,375" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M860,310 L720,375" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="490" y="340" font-size="22" fill="#173c53">按用户 LEFT JOIN</text><rect x="300" y="395" width="600" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="314.0" y="427" font-size="20" fill="#173c53">订单</text><text x="514.0" y="427" font-size="20" fill="#173c53">金额</text><text x="714.0" y="427" font-size="20" fill="#173c53">版本</text><rect x="302" y="443" width="596" height="49" fill="#d4eddc" /><path d="M300,443 h600" stroke="#b9cbd6" /><text x="314.0" y="476" font-size="21" fill="#173c53">O1</text><text x="514.0" y="476" font-size="21" fill="#173c53">100</text><text x="714.0" y="476" font-size="21" fill="#173c53">V1</text><rect x="302" y="493" width="596" height="49" fill="#d4eddc" /><path d="M300,493 h600" stroke="#b9cbd6" /><text x="314.0" y="526" font-size="21" fill="#173c53">O1</text><text x="514.0" y="526" font-size="21" fill="#173c53">100</text><text x="714.0" y="526" font-size="21" fill="#173c53">V2</text><text x="55" y="630" font-size="21" fill="#173c53">订单键仍然存在，但金额被携带两次：直接 SUM 会从 100 变成 200。</text><text x="55" y="662" font-size="21" fill="#173c53">没有匹配时才补一条 NULL；业务要求一对一时必须先验证右表唯一性。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">原订单</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 938.5) scale(0.7272727273 1) translate(-485 -938.5)">O1：100</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">匹配属性</text><rect x="281" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="381.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 1008.5) scale(0.7272727273 1) translate(-381.25 -1008.5)">V1</text><rect x="488.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="588.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 1008.5) scale(0.7272727273 1) translate(-588.75 -1008.5)">V2</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">结果金额</text><rect x="281" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="381.25" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 1078.5) scale(0.7272727273 1) translate(-381.25 -1078.5)">100</text><rect x="488.5" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="588.75" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 1078.5) scale(0.7272727273 1) translate(-588.75 -1078.5)">100</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">SUM 结果为 200，原订单仍只有一笔</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1091) scale(0.7272727273 1) translate(-856 -1091)">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1057.6) scale(0.7272727273 1) translate(-856 -1057.6)">0.5</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 1024.2) scale(0.7272727273 1) translate(-856 -1024.2)">1</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 990.8) scale(0.7272727273 1) translate(-856 -990.8)">1.5</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 957.4) scale(0.7272727273 1) translate(-856 -957.4)">2</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(856 924) scale(0.7272727273 1) translate(-856 -924)">2.5</text><rect x="951.75" y="1018.2" width="86" height="66.8" rx="3" fill="#168a83" stroke="#168a83" /><text x="994.75" y="1008.2" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(994.75 1008.2) scale(0.7272727273 1) translate(-994.75 -1008.2)">1</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(869 1113) scale(0.7272727273 1) translate(-869 -1113)">唯一属性记录</text><rect x="1209.25" y="951.4" width="86" height="133.6" rx="3" fill="#d17c3e" stroke="#d17c3e" /><text x="1252.25" y="941.4" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1252.25 941.4) scale(0.7272727273 1) translate(-1252.25 -941.4)">2</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1126.5 1113) scale(0.7272727273 1) translate(-1126.5 -1113)">两条匹配属性</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1153) scale(0.7272727273 1) translate(-806 -1153)">同一订单的连接结果行数</text></g></svg>
