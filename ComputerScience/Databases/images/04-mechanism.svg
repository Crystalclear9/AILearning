<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="481.03" viewBox="5.00 0.00 1170.00 469.00" role="img"><title id="figure-title">复合索引按整个键的字典序排列</title><desc id="figure-desc">按 (user_id,event_time) 字典序排列时，同一用户的记录相邻，用户内部再按时间排序。图中 user_id=2 且 event_time≥3 对应连续的 (2,3)、(2,8) 两项；这不是把两个字段分别独立排序。是否还需额外排序与回表，要看完整查询及索引覆盖情况。</desc><rect x="0" y="0" width="1200" height="515" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">复合索引按整个键的字典序排列</text><text x="45" y="115" font-size="30" fill="#213447" text-anchor="start" font-weight="400">索引键：(user_id, event_time)</text><rect x="45" y="180" width="200" height="105" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="145" y="245" font-size="32" fill="#213447" text-anchor="middle" font-weight="400">(1, 9)</text><path d="M250 230 L265 230" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="270" y="180" width="200" height="105" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="370" y="245" font-size="32" fill="#213447" text-anchor="middle" font-weight="400">(2, 1)</text><path d="M475 230 L490 230" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="495" y="180" width="200" height="105" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="595" y="245" font-size="32" fill="#213447" text-anchor="middle" font-weight="400">(2, 3)</text><path d="M700 230 L715 230" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="720" y="180" width="200" height="105" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="820" y="245" font-size="32" fill="#213447" text-anchor="middle" font-weight="400">(2, 8)</text><path d="M925 230 L940 230" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="945" y="180" width="200" height="105" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="1045" y="245" font-size="32" fill="#213447" text-anchor="middle" font-weight="400">(3, 2)</text><text x="45" y="365" font-size="30" fill="#c87536" text-anchor="start" font-weight="400">WHERE user_id = 2 AND event_time ≥ 3</text><line x1="495" y1="320" x2="920" y2="320" stroke="#c87536" stroke-width="4" /><line x1="495" y1="310" x2="495" y2="330" stroke="#c87536" stroke-width="3" /><line x1="920" y1="310" x2="920" y2="330" stroke="#c87536" stroke-width="3" /><text x="510" y="430" font-size="30" fill="#c87536" text-anchor="start" font-weight="400">选中连续的两个索引项</text></g></svg>
