#23394a" text-anchor="middle" font-weight="400">位置 0</text><rect x="290" y="675" width="140" height="75" rx="5" fill="#ffffff" stroke="#b7c8d4" stroke-width="2"/><text xml:space="preserve" x="360" y="724" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="565" y="645" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 1</text><rect x="495" y="675" width="140" height="75" rx="5" fill="#ffffff" stroke="#b7c8d4" stroke-width="2"/><text xml:space="preserve" x="565" y="724" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="770" y="645" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 2</text><rect x="700" y="675" width="140" height="75" rx="5" fill="url(#book-wash-fff0e4)" stroke="#b9622f" stroke-width="2"/><text xml:space="preserve" x="770" y="724" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="975" y="645" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 3</text><rect x="905" y="675" width="140" height="75" rx="5" fill="url(#book-wash-fff0e4)" stroke="#b9622f" stroke-width="2"/><text xml:space="preserve" x="975" y="724" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">3</text><text xml:space="preserve" x="1180" y="645" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 4</text><rect x="1110" y="675" width="140" height="75" rx="5" fill="#ffffff" stroke="#b7c8d4" stroke-width="2"/><text xml:space="preserve" x="1180" y="724" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">4</text><text xml:space="preserve" x="1430" y="720" font-size="30" fill="#9e5a30" text-anchor="middle" font-weight="400">返回 2,3</text><text xml:space="preserve" x="55" y="870" font-size="30" fill="#23394a" text-anchor="start" font-weight="700">插入 0 后：key &gt; 2</text><text xml:space="preserve" x="360" y="935" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 0</text><rect x="290" y="965" width="140" height="75" rx="5" fill="#ffffff" stroke="#b7c8d4" stroke-width="2"/><text xml:space="preserve" x="360" y="1014" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="565" y="935" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 1</text><rect x="495" y="965" width="140" height="75" rx="5" fill="#ffffff" stroke="#b7c8d4" stroke-width="2"/><text xml:space="preserve" x="565" y="1014" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="770" y="935" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 2</text><rect x="700" y="965" width="140" height="75" rx="5" fill="#ffffff" stroke="#b7c8d4" stroke-width="2"/><text xml:space="preserve" x="770" y="1014" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="975" y="935" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 3</text><rect x="905" y="965" width="140" height="75" rx="5" fill="url(#book-wash-edf5fa)" stroke="#207aa4" stroke-width="2"/><text xml:space="preserve" x="975" y="1014" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">3</text><text xml:space="preserve" x="1180" y="935" font-size="26" fill="#23394a" text-anchor="middle" font-weight="400">位置 4</text><rect x="1110" y="965" width="140" height="75" rx="5" fill="url(#book-wash-edf5fa)" stroke="#207aa4" stroke-width="2"/><text xml:space="preserve" x="1180" y="1014" font-size="34" fill="#23394a" text-anchor="middle" font-weight="400">4</text><text xml:space="preserve" x="1430" y="1010" font-size="30" fill="#2878a3" text-anchor="middle" font-weight="400">返回 3,4</text><path d="M565,420 C565,480 660,560 690,712" stroke="#b9622f" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="980" y="475" font-size="29" fill="#9e5a30" text-anchor="middle" font-weight="400">键 2 的位置由 1 移到 2</text><text xml:space="preserve" x="55" y="1080" font-size="30" fill="#23394a" text-anchor="start" font-weight="400">键集续页不重复 2，但新插入且已落在游标之前的 0 也不会被这一轮补读</text></g><desc> OFFSET 追随当前行位置；键集分页追随已越过的键</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 1024.72) scale(1.0408)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start">删除游标前面的记录：OFFSET 还会从重复变成遗漏</text><rect x="65" y="140" width="252" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="191.0" y="179" font-size="33.32px" fill="#277290" text-anchor="middle">1</text><rect x="325" y="140" width="252" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="451.0" y="179" font-size="33.32px" fill="#277290" text-anchor="middle">2</text><rect x="585" y="140" width="252" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="711.0" y="179" font-size="33.32px" fill="#277290" text-anchor="middle">3</text><rect x="845" y="140" width="252" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="971.0" y="179" font-size="33.32px" fill="#277290" text-anchor="middle">4</text><text x="65" y="120" font-size="36.12px" fill="#213747" text-anchor="start">第一批已读取 1、2</text><rect x="65" y="280" width="252" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="191.0" y="319" font-size="33.32px" fill="#a55f3a" text-anchor="middle">2</text><rect x="325" y="280" width="252" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="451.0" y="319" font-size="33.32px" fill="#a55f3a" text-anchor="middle">3</text><rect x="585" y="280" width="252" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="711.0" y="319" font-size="33.32px" fill="#a55f3a" text-anchor="middle">4</text><text x="1110" y="180" font-size="37.41px" fill="#a55f3a" text-anchor="start">删除 1 后：</text><text x="1110" y="245" font-size="39.99px" fill="#a55f3a" text-anchor="start">OFFSET 2 → 4</text><text x="1110" y="310" font-size="39.99px" fill="#277290" text-anchor="s