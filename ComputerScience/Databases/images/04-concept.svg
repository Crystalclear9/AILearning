<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>分页边界：位置移动与稳定键游标</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><rect width="1200" height="720" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">分页边界：位置移动与稳定键游标</text><text x="65" y="125" font-size="22" fill="#173c53">页大小 2；首批已读完键 1、2。</text><text x="55" y="225" font-size="21" fill="#173c53">原始</text><rect x="220" y="190" width="145" height="75" rx="10" fill="#d4eddc" stroke="#a4bfce" /><text x="238" y="230" font-size="25" fill="#173c53">1</text><text x="238" y="266" font-size="20" fill="#173c53" /><rect x="395" y="190" width="145" height="75" rx="10" fill="#d4eddc" stroke="#a4bfce" /><text x="413" y="230" font-size="25" fill="#173c53">2</text><text x="413" y="266" font-size="20" fill="#173c53" /><rect x="570" y="190" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="588" y="230" font-size="25" fill="#173c53">3</text><text x="588" y="266" font-size="20" fill="#173c53" /><rect x="745" y="190" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="763" y="230" font-size="25" fill="#173c53">4</text><text x="763" y="266" font-size="20" fill="#173c53" /><text x="55" y="365" font-size="21" fill="#173c53">插入 0 后</text><rect x="220" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="238" y="370" font-size="25" fill="#173c53">0</text><text x="238" y="406" font-size="20" fill="#173c53" /><rect x="395" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="413" y="370" font-size="25" fill="#173c53">1</text><text x="413" y="406" font-size="20" fill="#173c53" /><rect x="570" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="588" y="370" font-size="25" fill="#173c53">2</text><text x="588" y="406" font-size="20" fill="#173c53" /><rect x="745" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="763" y="370" font-size="25" fill="#173c53">3</text><text x="763" y="406" font-size="20" fill="#173c53" /><rect x="920" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="938" y="370" font-size="25" fill="#173c53">4</text><text x="938" y="406" font-size="20" fill="#173c53" /><path d="M620,275 L660,325" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><text x="685" y="292" font-size="22" fill="#173c53">键的位置右移</text><rect x="60" y="470" width="500" height="100" rx="10" fill="#fff0e7" stroke="#a4bfce" /><text x="85" y="510" font-size="22" fill="#173c53">OFFSET 2 LIMIT 2 → [2,3]</text><text x="85" y="547" font-size="22" fill="#173c53">键 2 重复出现</text><rect x="635" y="470" width="500" height="100" rx="10" fill="#e5f4eb" stroke="#a4bfce" /><text x="660" y="510" font-size="22" fill="#173c53">WHERE key &gt; 2 LIMIT 2 → [3,4]</text><text x="660" y="547" font-size="22" fill="#173c53">沿最后成功键继续</text><text x="55" y="630" font-size="21" fill="#173c53">绿色是首批已经读取的键。插入前缀会改变 OFFSET 的位置含义。</text><text x="55" y="662" font-size="21" fill="#173c53">键集分页仍需稳定全序、快照或变更协议；不能仅凭游标证明任意可变源不重不漏。</text></g></svg>
