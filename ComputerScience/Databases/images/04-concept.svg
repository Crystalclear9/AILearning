<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">分页边界：位置移动与稳定键游标</title><desc id="plateDesc">B 同时列出两种分页的具体下一页，不把“更稳定”当成抽象口号。C 在读取剩余记录前删除键三，稳定键分页也不能凭空恢复原快照的三；提取协议还必须定义希望覆盖哪个版本，以及如何处理删除、补录与并发提交。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">分页边界：位置移动与稳定键游标</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Databases</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">分页位置变化与稳定键游标</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">插入后 OFFSET 会重复键 2</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">已读第一页</text><rect x="281" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="381.25" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">1</text><rect x="488.5" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="588.75" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">2</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">插入 0 后 OFFSET </text><text x="96" y="1022" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">2</text><rect x="281" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="381.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">2</text><rect x="488.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="588.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">3</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">游标 key&gt;2</text><rect x="281" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="381.25" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">3</text><rect x="488.5" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="588.75" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">4</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">两条一页：位置改变，键边界不随之平移</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">游标不保证原快照仍完整</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">最初尚未读取</text><rect x="991" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1091.25" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">3</text><rect x="1198.5" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1298.75" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">4</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">并发删除键 3</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">仅剩 4</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">同一游标下一页</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">4</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">若目标是原始快照，仍需快照或版本协议</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 630.0" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>分页边界：位置移动与稳定键游标</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="panelA-tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">分页边界：位置移动与稳定键游标</text><text x="65" y="125" font-size="22" fill="#173c53">页大小 2；首批已读完键 1、2。</text><text x="55" y="225" font-size="21" fill="#173c53">原始</text><rect x="220" y="190" width="145" height="75" rx="10" fill="#d4eddc" stroke="#a4bfce" /><text x="238" y="230" font-size="25" fill="#173c53">1</text><text x="238" y="266" font-size="20" fill="#173c53" /><rect x="395" y="190" width="145" height="75" rx="10" fill="#d4eddc" stroke="#a4bfce" /><text x="413" y="230" font-size="25" fill="#173c53">2</text><text x="413" y="266" font-size="20" fill="#173c53" /><rect x="570" y="190" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="588" y="230" font-size="25" fill="#173c53">3</text><text x="588" y="266" font-size="20" fill="#173c53" /><rect x="745" y="190" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="763" y="230" font-size="25" fill="#173c53">4</text><text x="763" y="266" font-size="20" fill="#173c53" /><text x="55" y="365" font-size="21" fill="#173c53">插入 0 后</text><rect x="220" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="238" y="370" font-size="25" fill="#173c53">0</text><text x="238" y="406" font-size="20" fill="#173c53" /><rect x="395" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="413" y="370" font-size="25" fill="#173c53">1</text><text x="413" y="406" font-size="20" fill="#173c53" /><rect x="570" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="588" y="370" font-size="25" fill="#173c53">2</text><text x="588" y="406" font-size="20" fill="#173c53" /><rect x="745" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="763" y="370" font-size="25" fill="#173c53">3</text><text x="763" y="406" font-size="20" fill="#173c53" /><rect x="920" y="330" width="145" height="75" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="938" y="370" font-size="25" fill="#173c53">4</text><text x="938" y="406" font-size="20" fill="#173c53" /><path d="M620,275 L660,325" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="685" y="292" font-size="22" fill="#173c53">键的位置右移</text><rect x="60" y="470" width="500" height="100" rx="10" fill="#fff0e7" stroke="#a4bfce" /><text x="85" y="510" font-size="22" fill="#173c53">OFFSET 2 LIMIT 2 → [2,3]</text><text x="85" y="547" font-size="22" fill="#173c53">键 2 重复出现</text><rect x="635" y="470" width="500" height="100" rx="10" fill="#e5f4eb" stroke="#a4bfce" /><text x="660" y="510" font-size="22" fill="#173c53">WHERE key &gt; 2 LIMIT 2 → [3,4]</text><text x="660" y="547" font-size="22" fill="#173c53">沿最后成功键继续</text><text x="55" y="630" font-size="21" fill="#173c53">绿色是首批已经读取的键。插入前缀会改变 OFFSET 的位置含义。</text><text x="55" y="662" font-size="21" fill="#173c53">键集分页仍需稳定全序、快照或变更协议；不能仅凭游标证明任意可变源不重不漏。</text></g></svg></svg>
