<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title id="figure-title">LAST_VALUE 读取窗口的最后一项</title><desc id="figure-desc">三行值为 10、20、30，并按唯一键排序。左侧窗口从分区开头到当前行，每行取到的最后值依次是 10、20、30；右侧窗口从分区开头延伸到分区末尾，因此三行都取到 30。图中蓝格表示当前窗口覆盖，白格尚未纳入；要得到右侧结果，需要显式指定相应的完整分区 frame。</desc><rect x="0" y="0" width="1200" height="580" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">LAST_VALUE 读取窗口的最后一项</text><text x="40" y="118" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">窗口到当前行</text><text x="665" y="118" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">窗口到分区末尾</text><text x="35" y="215" font-size="27" fill="#213447" text-anchor="start" font-weight="400">行 1</text><rect x="130" y="175" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="171" y="218" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="665" y="175" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="706" y="218" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="225" y="175" width="82" height="65" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="266" y="218" font-size="28" fill="#627689" text-anchor="middle" font-weight="400">20</text><rect x="760" y="175" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="801" y="218" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="320" y="175" width="82" height="65" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="361" y="218" font-size="28" fill="#627689" text-anchor="middle" font-weight="400">30</text><rect x="855" y="175" width="82" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="896" y="218" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">30</text><path d="M425 208 L480 208" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="505" y="218" font-size="30" fill="#2865a0" text-anchor="start" font-weight="600">10</text><path d="M965 208 L1020 208" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="1045" y="218" font-size="30" fill="#c87536" text-anchor="start" font-weight="600">30</text><text x="35" y="330" font-size="27" fill="#213447" text-anchor="start" font-weight="400">行 2</text><rect x="130" y="290" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="171" y="333" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="665" y="290" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="706" y="333" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="225" y="290" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="266" y="333" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="760" y="290" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="801" y="333" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="320" y="290" width="82" height="65" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="361" y="333" font-size="28" fill="#627689" text-anchor="middle" font-weight="400">30</text><rect x="855" y="290" width="82" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="896" y="333" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">30</text><path d="M425 323 L480 323" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="505" y="333" font-size="30" fill="#2865a0" text-anchor="start" font-weight="600">20</text><path d="M965 323 L1020 323" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="1045" y="333" font-size="30" fill="#c87536" text-anchor="start" font-weight="600">30</text><text x="35" y="445" font-size="27" fill="#213447" text-anchor="start" font-weight="400">行 3</text><rect x="130" y="405" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="171" y="448" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="665" y="405" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="706" y="448" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="225" y="405" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="266" y="448" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="760" y="405" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="801" y="448" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="320" y="405" width="82" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="361" y="448" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">30</text><rect x="855" y="405" width="82" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="896" y="448" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">30</text><path d="M425 438 L480 438" fill="none" stroke="#2865a0" stroke-width="2