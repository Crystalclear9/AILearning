<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="637" viewBox="0 0 960 637" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">普通索引通过rowid查表，覆盖索引直接提供amount</title><desc id="artwork-desc">覆盖索引：从索引项直接拿到要输出的列 覆盖索引：从索引项直接拿到要输出的列</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="539.313653"/></clipPath></defs><rect width="960" height="637" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">普通索引通过rowid查表，覆盖索引直接提供amount</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(14.923099 31.056893) scale(0.726682)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="title">覆盖索引：从索引项直接拿到要输出的列</title><desc id="desc">覆盖索引：从索引项直接拿到要输出的列 覆盖索引：从索引项直接拿到要输出的列</desc><rect width="1252.267" height="742.159" fill="white" x="13.867" y="61.847"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#748e9f"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3348"><text x="40" y="110" font-size="34.83px" fill="#1f3348" text-anchor="start" font-weight="400">SQLite 普通 rowid 表；查询 user_id = 2、t ≥ 3，按 t 输出 amount</text><text x="40" y="165" font-size="36.467116px" fill="#2479b3" text-anchor="start" font-weight="600">索引 (user_id, t)</text><rect x="45" y="195" width="405" height="57" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="65" y="234" font-size="34.83px" fill="#2479b3" text-anchor="start" font-weight="400">(2, 3) → rowid 11</text><rect x="45" y="259" width="405" height="57" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="65" y="298" font-size="34.83px" fill="#2479b3" text-anchor="start" font-weight="400">(2, 8) → rowid 22</text><rect x="45" y="323" width="405" height="57" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="65" y="362" font-size="34.83px" fill="#47586b" text-anchor="start" font-weight="400">(3, 1) → rowid 33</text><text x="740" y="165" font-size="36.12px" fill="#1f3348" text-anchor="start" font-weight="600">表记录：按 rowid 找 amount</text><rect x="770" y="195" width="445" height="57" fill="#f9efe8" stroke="none" stroke-width="2"/><text x="790" y="234" font-size="34.83px" fill="#aa602f" text-anchor="start" font-weight="400">id 11   →   amount 100</text><line fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)" x1="470" y1="225" x2="750" y2="225"/><rect x="770" y="259" width="445" height="57" fill="#f9efe8" stroke="none" stroke-width="2"/><text x="790" y="298" font-size="34.83px" fill="#aa602f" text-anchor="start" font-weight="400">id 22   →   amount 200</text><line fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)" x1="470" y1="289" x2="750" y2="289"/><rect x="770" y="323" width="445" height="57" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="790" y="362" font-size="34.83px" fill="#47586b" text-anchor="start" font-weight="400">id 33   →   amount 300</text><text x="600" y="414" font-size="36.12px" fill="#1f3348" text-anchor="middle" font-weight="400">两条命中索引项 → 两条表记录 → 输出 100、200</text><line fill="none" stroke="#d9e1e8" stroke-width="2" x1="40" y1="445" x2="1240" y2="445"/><text x="40" y="485" font-size="36.467116px" fill="#2479b3" text-anchor="start" font-weight="600">索引 (user_id, t, amount)</text><rect x="45" y="515" width="560" height="57" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="65" y="554" font-size="34.83px" fill="#2479b3" text-anchor="start" font-weight="400">(2, 3, 100) → rowid 11</text><line fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)" x1="630" y1="545" x2="835" y2="545"/><text x="885" y="555" font-size="36.467116px" fill="#aa602f" text-anchor="start" font-weight="400">输出 100</text><rect x="45" y="579" width="560" height="57" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="65" y="618" font-size="34.83px" fill="#2479b3" text-anchor="start" font-weight="400">(2, 8, 200) → rowid 22</text><line fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)" x1="630" y1="609" x2="835" y2="609"/><text x="885" y="619" font-size="36.467116px" fill="#aa602f" text-anchor="start" font-weight="400">输出 200</text><rect x="45" y="643" width="560" height="57" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="65" y="682" font-size="34.83px" fill="#47586b" text-anchor="start" font-weight="400">(3, 1, 300) → rowid 33</text><text x="40" y="775" font-size="34.83px" fill="#1f3348" text-anchor="start" font-weight="400">查询所需的筛选、排序与输出列都已在索引中；此路线不再查表取 amount</text></g></g></g></g></svg>