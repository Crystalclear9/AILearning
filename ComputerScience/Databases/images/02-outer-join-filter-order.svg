<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="577" viewBox="0 47 960 577" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">ON约束决定匹配与补空，WHERE在补空以后过滤</title><desc id="artwork-desc">先生成哪些行，再决定保留哪些行 先生成哪些行，再决定保留哪些行</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="526.919545"/></clipPath></defs><rect width="960" height="624" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.75733 30.317557) scale(0.738636)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="title">先生成哪些行，再决定保留哪些行</title><desc id="desc">先生成哪些行，再决定保留哪些行 先生成哪些行，再决定保留哪些行</desc><rect width="1232.0" height="713.368" fill="white" x="13.867" y="61.847"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#748e9f"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3348"><text x="40" y="110" font-size="34.83px" fill="#1f3348" text-anchor="start" font-weight="400">用户 1 有 done、cancelled；用户 2 无订单；用户 3 只有 cancelled</text><text x="40" y="165" font-size="35.876923px" fill="#2479b3" text-anchor="start" font-weight="600">把 done 放进 ON：只用合格订单匹配，未匹配用户补空行</text><circle cx="205" cy="215" r="26" fill="white" stroke="#1773a5" stroke-width="2"/><text x="205" y="225" font-size="33.32px" fill="#2479b3" text-anchor="middle" font-weight="400">1</text><line fill="none" stroke="#748e9f" stroke-width="2" marker-end="url(#arrow)" x1="205" y1="245" x2="205" y2="285"/><rect x="55" y="300" width="300" height="62" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="205" y="341" font-size="34.83px" fill="#1f3348" text-anchor="middle" font-weight="400">(1, 10)</text><circle cx="625" cy="215" r="26" fill="white" stroke="#1773a5" stroke-width="2"/><text x="625" y="225" font-size="33.32px" fill="#2479b3" text-anchor="middle" font-weight="400">2</text><line fill="none" stroke="#748e9f" stroke-width="2" marker-end="url(#arrow)" x1="625" y1="245" x2="625" y2="285"/><rect x="475" y="300" width="300" height="62" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="625" y="341" font-size="34.83px" fill="#1f3348" text-anchor="middle" font-weight="400">(2, NULL)</text><circle cx="1045" cy="215" r="26" fill="white" stroke="#1773a5" stroke-width="2"/><text x="1045" y="225" font-size="33.32px" fill="#2479b3" text-anchor="middle" font-weight="400">3</text><line fill="none" stroke="#748e9f" stroke-width="2" marker-end="url(#arrow)" x1="1045" y1="245" x2="1045" y2="285"/><rect x="895" y="300" width="300" height="62" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="1045" y="341" font-size="34.83px" fill="#1f3348" text-anchor="middle" font-weight="400">(3, NULL)</text><text x="40" y="430" font-size="35.876923px" fill="#aa602f" text-anchor="start" font-weight="600">先按用户连接，再 WHERE done：过滤不会重新补空行</text><rect x="55" y="465" width="280" height="60" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="195" y="504" font-size="30.96px" fill="#1f3348" text-anchor="middle" font-weight="400">(1, 10, done)</text><line fill="none" stroke="#748e9f" stroke-width="2" marker-end="url(#arrow)" x1="195" y1="535" x2="195" y2="578"/><text x="195" y="614" font-size="34.83px" fill="#2479b3" text-anchor="middle" font-weight="400">TRUE</text><text x="195" y="662" font-size="34.83px" fill="#2479b3" text-anchor="middle" font-weight="400">保留用户 1</text><rect x="350" y="465" width="280" height="60" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="490" y="504" font-size="30.96px" fill="#1f3348" text-anchor="middle" font-weight="400">(1, 11, cancelled)</text><line fill="none" stroke="#748e9f" stroke-width="2" marker-end="url(#arrow)" x1="490" y1="535" x2="490" y2="578"/><text x="490" y="614" font-size="34.83px" fill="#aa602f" text-anchor="middle" font-weight="400">FALSE</text><text x="490" y="662" font-size="34.83px" fill="#aa602f" text-anchor="middle" font-weight="400">丢弃</text><rect x="645" y="465" width="280" height="60" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="785" y="504" font-size="30.96px" fill="#1f3348" text-anchor="middle" font-weight="400">(2, NULL, NULL)</text><line fill="none" stroke="#748e9f" stroke-width="2" marker-end="url(#arrow)" x1="785" y1="535" x2="785" y2="578"/><text x="785" y="614" font-size="34.83px" fill="#aa602f" text-anchor="middle" font-weight="400">UNKNOWN</text><text x="785" y="662" font-size="34.83px" fill="#aa602f" text-anchor="middle" font-weight="400">丢弃</text><rect x="940" y="465" width="280" height="60" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="1080" y="504" font-size="30.96px" fill="#1f3348" text-anchor="middle" font-weight="400">(3, 12, cancelled)</text><line fill="none" stroke="#748e9f" stroke-width="2" marker-end="url(#arrow)" x1="1080" y1="535" x2="1080" y2="578"/><text x="1080" y="614" font-size="34.83px" fill="#aa602f" text-anchor="middle" font-weight="400">FALSE</text><text x="1080" y="662" font-size="34.83px" fill="#aa602f" text-anchor="middle" font-weight="400">丢弃</text><text x="40" y="745" font-size="35.876923px" fill="#1f3348" text-anchor="start" font-weight="400">加 OR 订单号 IS NULL 只救回用户 2；用户 3 已匹配过，仍被丢弃</text></g></g></g></g></svg>