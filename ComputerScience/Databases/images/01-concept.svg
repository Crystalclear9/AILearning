<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>WHERE 与 HAVING：同一输入，两种统计对象</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><rect width="1200" height="720" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">WHERE 与 HAVING：同一输入，两种统计对象</text><rect x="380" y="105" width="440" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="394.0" y="137" font-size="20" fill="#173c53">用户</text><text x="614.0" y="137" font-size="20" fill="#173c53">金额</text><path d="M380,153 h440" stroke="#b9cbd6" /><text x="394.0" y="186" font-size="21" fill="#173c53">U</text><text x="614.0" y="186" font-size="21" fill="#173c53">40</text><path d="M380,203 h440" stroke="#b9cbd6" /><text x="394.0" y="236" font-size="21" fill="#173c53">U</text><text x="614.0" y="236" font-size="21" fill="#173c53">160</text><path d="M420,260 L230,335" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><path d="M780,260 L960,335" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><text x="85" y="310" font-size="22" fill="#173c53">先 WHERE 金额 &gt; 100</text><text x="800" y="310" font-size="22" fill="#173c53">先 GROUP BY 用户</text><rect x="65" y="355" width="460" height="98" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="79.0" y="387" font-size="20" fill="#173c53">筛后金额</text><text x="309.0" y="387" font-size="20" fill="#173c53">AVG</text><rect x="67" y="403" width="456" height="49" fill="#d4eddc" /><path d="M65,403 h460" stroke="#b9cbd6" /><text x="79.0" y="436" font-size="21" fill="#173c53">160</text><text x="309.0" y="436" font-size="21" fill="#173c53">160</text><rect x="675" y="355" width="460" height="98" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="689.0" y="387" font-size="20" fill="#173c53">完整金额</text><text x="919.0" y="387" font-size="20" fill="#173c53">AVG</text><path d="M675,403 h460" stroke="#b9cbd6" /><text x="689.0" y="436" font-size="21" fill="#173c53">40、160</text><text x="919.0" y="436" font-size="21" fill="#173c53">100</text><path d="M300,460 L300,515" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><path d="M900,460 L900,515" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#tip-2877a7)" /><text x="100" y="560" font-size="25" fill="#173c53">保留 U；筛后均值为 160</text><text x="735" y="560" font-size="25" fill="#173c53">HAVING AVG &gt; 100：无行</text><text x="55" y="630" font-size="21" fill="#173c53">WHERE 先改变聚合输入；HAVING 对已经形成的组统计量做筛选。</text><text x="55" y="662" font-size="21" fill="#173c53">100 不满足严格大于 100；两种条件通常不能互换。</text></g></svg>
