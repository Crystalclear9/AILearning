<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">WHERE 与 HAVING：同一输入，两种统计对象</title><desc id="plateDesc">B 完整列出过滤前后的聚合对象，说明两个条件尽管都写金额或平均值大于一百，语义不同。C 加入一条金额为 NULL 的记录，非 NULL 计数仍为二、平均仍为一百；如果把 NULL 填零则会改变结果与指标对象。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">WHERE 与 HAVING：同一输入，两种统计对象</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">过滤行与过滤分组的顺序</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">两条 SQL 目标得到不同结果</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">NULL 不作为零参与 AVG</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 630.0" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title>WHERE 与 HAVING：同一输入，两种统计对象</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker><marker id="panelA-tip-2877a7" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">WHERE 与 HAVING：同一输入，两种统计对象</text><rect x="380" y="105" width="440" height="148" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="394.0" y="137" font-size="20" fill="#173c53">用户</text><text x="614.0" y="137" font-size="20" fill="#173c53">金额</text><path d="M380,153 h440" stroke="#b9cbd6" /><text x="394.0" y="186" font-size="21" fill="#173c53">U</text><text x="614.0" y="186" font-size="21" fill="#173c53">40</text><path d="M380,203 h440" stroke="#b9cbd6" /><text x="394.0" y="236" font-size="21" fill="#173c53">U</text><text x="614.0" y="236" font-size="21" fill="#173c53">160</text><path d="M420,260 L230,335" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M780,260 L960,335" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="85" y="310" font-size="22" fill="#173c53">先 WHERE 金额 &gt; 100</text><text x="800" y="310" font-size="22" fill="#173c53">先 GROUP BY 用户</text><rect x="65" y="355" width="460" height="98" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="79.0" y="387" font-size="20" fill="#173c53">筛后金额</text><text x="309.0" y="387" font-size="20" fill="#173c53">AVG</text><rect x="67" y="403" width="456" height="49" fill="#d4eddc" /><path d="M65,403 h460" stroke="#b9cbd6" /><text x="79.0" y="436" font-size="21" fill="#173c53">160</text><text x="309.0" y="436" font-size="21" fill="#173c53">160</text><rect x="675" y="355" width="460" height="98" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="689.0" y="387" font-size="20" fill="#173c53">完整金额</text><text x="919.0" y="387" font-size="20" fill="#173c53">AVG</text><path d="M675,403 h460" stroke="#b9cbd6" /><text x="689.0" y="436" font-size="21" fill="#173c53">40、160</text><text x="919.0" y="436" font-size="21" fill="#173c53">100</text><path d="M300,460 L300,515" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><path d="M900,460 L900,515" fill="none" stroke="#2877a7" stroke-width="3" marker-end="url(#panelA-tip-2877a7)" /><text x="100" y="560" font-size="25" fill="#173c53">保留 U；筛后均值为 160</text><text x="735" y="560" font-size="25" fill="#173c53">HAVING AVG &gt; 100：无行</text><text x="55" y="630" font-size="21" fill="#173c53">WHERE 先改变聚合输入；HAVING 对已经形成的组统计量做筛选。</text><text x="55" y="662" font-size="21" fill="#173c53">100 不满足严格大于 100；两种条件通常不能互换。</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 923) scale(0.7272727273 1) translate(-105 -923)">顺序</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 923) scale(0.7272727273 1) translate(-305 -923)">聚合输入</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 923) scale(0.7272727273 1) translate(-505 -923)">结果</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 978) scale(0.7272727273 1) translate(-105 -978)">WHERE 金额&gt;100</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 978) scale(0.7272727273 1) translate(-305 -978)">160</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 978) scale(0.7272727273 1) translate(-505 -978)">AVG=160</text><rect x="96" y="1011" width="197" height="65" rx="2" fill="white" stroke="#d5e1e8" /><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(105 1036) scale(0.7272727273 1) translate(-105 -1036)">先分组再 HAVING</text><rect x="296" y="1011" width="197" height="65" rx="2" fill="white" stroke="#d5e1e8" /><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(305 1036) scale(0.7272727273 1) translate(-305 -1036)">40,160</text><rect x="496" y="1011" width="197" height="65" rx="2" fill="white" stroke="#d5e1e8" /><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(505 1036) scale(0.7272727273 1) translate(-505 -1036)">AVG=100，组被去掉</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1150) scale(0.7272727273 1) translate(-96 -1150)">条件均使用严格大于 100</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">加入 NULL 后</text><rect x="991" y="900" width="131.333" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1056.67" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1056.67 938.5) scale(0.7272727273 1) translate(-1056.67 -938.5)">40</text><rect x="1129.33" y="900" width="131.333" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 938.5) scale(0.7272727273 1) translate(-1195 -938.5)">160</text><rect x="1267.67" y="900" width="131.333" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1333.33" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1333.33 938.5) scale(0.7272727273 1) translate(-1333.33 -938.5)">NULL</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 994) scale(0.7272727273 1) translate(-806 -994)">COUNT(金额)</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1008.5) scale(0.7272727273 1) translate(-1195 -1008.5)">2</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1064) scale(0.7272727273 1) translate(-806 -1064)">AVG(金额)</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1078.5) scale(0.7272727273 1) translate(-1195 -1078.5)">仍为 100</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">WHERE 与 HAVING 不能任意交换</text></g></svg>
