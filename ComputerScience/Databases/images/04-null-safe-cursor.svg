<svg xmlns="http://www.w3.org/2000/svg" width="1140.76" height="705.762" viewBox="-5.881 28.119 1140.76 705.762" role="img" aria-labelledby="title desc"><title id="title">带空值标记的完整键让分页跨入NULL时间组</title><desc id="desc">六条记录按空值标记、非空时间或占位零、唯一编号组成全序。显式编码使键集分页能跨入空值组。 排序能排到最后，不代表普通比较能续读 ORDER BY 与续页谓词必须使用完全相同的键定义；游标不能替代快照。</desc><rect id="edition-paper" x="-5.881" y="28.119" width="1140.76" height="705.762" fill="#ffffff"/><svg id="edition-view" x="15" y="49" width="1099" height="664" viewBox="15 49 1099 664" overflow="hidden"><rect width="1099.0" height="664.0" fill="#ffffff" x="15.0" y="49.0"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="95" font-size="26" fill="#577487" text-anchor="start">固定数据视图 · 时间升序 · 空时间排最后 · id 唯一且非空</text><rect x="215" y="130" width="275" height="55" fill="#2e77a6" opacity="0.09" rx="3"/><text x="352" y="166" font-size="27" fill="#2a6d99" text-anchor="middle">第 1 页</text><rect x="515" y="130" width="275" height="55" fill="#2e77a6" opacity="0.09" rx="3"/><text x="652" y="166" font-size="27" fill="#2a6d99" text-anchor="middle">第 2 页</text><rect x="815" y="130" width="275" height="55" fill="#2e77a6" opacity="0.09" rx="3"/><text x="952" y="166" font-size="27" fill="#2a6d99" text-anchor="middle">第 3 页</text><text x="40" y="230" font-size="27" fill="#233a4b" text-anchor="start">id</text><text x="40" y="300" font-size="27" fill="#233a4b" text-anchor="start">原时间 t</text><text x="40" y="370" font-size="27" fill="#233a4b" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">空值标记</text><text x="40" y="440" font-size="27" fill="#233a4b" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">数值键</text><text x="245" y="230" font-size="27" fill="#2e77a6" text-anchor="middle">6</text><text x="245" y="300" font-size="27" fill="#2e77a6" text-anchor="middle">0</text><text x="245" y="370" font-size="27" fill="#2e77a6" text-anchor="middle">0</text><text x="245" y="440" font-size="27" fill="#2e77a6" text-anchor="middle">0</text><text x="390" y="230" font-size="27" fill="#2e77a6" text-anchor="middle">1</text><text x="390" y="300" font-size="27" fill="#2e77a6" text-anchor="middle">5</text><text x="390" y="370" font-size="27" fill="#2e77a6" text-anchor="middle">0</text><text x="390" y="440" font-size="27" fill="#2e77a6" text-anchor="middle">5</text><line x1="462" y1="200" x2="462" y2="465" stroke="#e0e9ef" stroke-width="3"/><text x="535" y="230" font-size="27" fill="#2e77a6" text-anchor="middle">3</text><text x="535" y="300" font-size="27" fill="#2e77a6" text-anchor="middle">5</text><text x="535" y="370" font-size="27" fill="#2e77a6" text-anchor="middle">0</text><text x="535" y="440" font-size="27" fill="#2e77a6" text-anchor="middle">5</text><text x="680" y="230" font-size="27" fill="#2e77a6" text-anchor="middle">5</text><text x="680" y="300" font-size="27" fill="#2e77a6" text-anchor="middle">8</text><text x="680" y="370" font-size="27" fill="#2e77a6" text-anchor="middle">0</text><text x="680" y="440" font-size="27" fill="#2e77a6" text-anchor="middle">8</text><line x1="752" y1="200" x2="752" y2="465" stroke="#e0e9ef" stroke-width="3"/><text x="825" y="230" font-size="27" fill="#a16139" text-anchor="middle">2</text><text x="825" y="300" font-size="27" fill="#a16139" text-anchor="middle">NULL</text><text x="825" y="370" font-size="27" fill="#a16139" text-anchor="middle">1</text><text x="825" y="440" font-size="27" fill="#a16139" text-anchor="middle">0</text><text x="970" y="230" font-size="27" fill="#a16139" text-anchor="middle">4</text><text x="970" y="300" font-size="27" fill="#a16139" text-anchor="middle">NULL</text><text x="970" y="370" font-size="27" fill="#a16139" text-anchor="middle">1</text><text x="970" y="440" font-size="27" fill="#a16139" text-anchor="middle">0</text><text x="40" y="505" font-size="29" fill="#233a4b" text-anchor="start">统一游标键：(空值标记，COALESCE(t,0)，id)</text><text x="40" y="565" font-size="26" fill="#2e77a6" text-anchor="start">跨过第二页的游标 (0, 8, 5)，下一页为 (1, 0, 2)、(1, 0, 4)。</text><text x="40" y="625" font-size="26" fill="#a16139" text-anchor="start">直接比较 (NULL, id) &gt; (8, 5) 得到未知；WHERE 不会保留这些行。</text><text x="40" y="685" font-size="25" fill="#233a4b" text-anchor="start">0 只是被空值标记隔开的占位；真实时间 0 仍属于非空组，不会碰撞。</text></g></svg></svg>
