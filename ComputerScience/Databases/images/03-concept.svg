<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">同值键的窗口边界：ROWS 与 RANGE</title><desc id="plateDesc">B 固定在第一条值为一的记录比较 frame，避免把 RANGE 当成另一个逐行窗口。C 给相同 value 增加唯一 id，形成不同排序键，原来的两条记录不再属于同级；图讨论无界前缀至当前行的 frame，不推广到所有带距离偏移的 RANGE 语法。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">同值键的窗口边界：ROWS 与 RANGE</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">Databases</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">同级行与窗口终点决定聚合输入</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">第一条记录的两个窗口</text><rect x="96" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="105" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">第一条 value=1</text><rect x="296" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="305" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">纳入值</text><rect x="496" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="505" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">SUM</text><rect x="96" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="105" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">ROWS 到当前行</text><rect x="296" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="305" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">1</text><rect x="496" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="505" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">1</text><rect x="96" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="105" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">RANGE 到当前行</text><rect x="296" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="305" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">1,1</text><rect x="496" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="505" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">2</text><text x="96" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">排序值依次为 1、1、2</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">确定的次级键改变同级关系</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">仅按 value 排序</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">两个 1 同级</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">按 value,id 排序</text><rect x="991" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1091.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">(1,a)</text><rect x="1198.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1298.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">(1,b)</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">唯一顺序的首行</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">只纳入 (1,a)</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">同级定义由整个 ORDER BY 键确定</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 630.0" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title>同值键的窗口边界：ROWS 与 RANGE</title><defs><marker id="panelA-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">同值键的窗口边界：ROWS 与 RANGE</text><text x="60" y="125" font-size="22" fill="#173c53">仅按 value 排序；当前行为图示中的第一条 1（并列内部顺序未保证）</text><rect x="70" y="170" width="420" height="198" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="84.0" y="202" font-size="20" fill="#173c53">位置</text><text x="294.0" y="202" font-size="20" fill="#173c53">value</text><rect x="72" y="218" width="416" height="49" fill="#d4eddc" /><path d="M70,218 h420" stroke="#b9cbd6" /><text x="84.0" y="251" font-size="21" fill="#173c53">1</text><text x="294.0" y="251" font-size="21" fill="#173c53">1</text><path d="M70,268 h420" stroke="#b9cbd6" /><text x="84.0" y="301" font-size="21" fill="#173c53">2</text><text x="294.0" y="301" font-size="21" fill="#173c53">1</text><path d="M70,318 h420" stroke="#b9cbd6" /><text x="84.0" y="351" font-size="21" fill="#173c53">3</text><text x="294.0" y="351" font-size="21" fill="#173c53">2</text><rect x="700" y="170" width="420" height="198" rx="10" fill="#edf5fb" stroke="#a4bfce" /><text x="714.0" y="202" font-size="20" fill="#173c53">位置</text><text x="924.0" y="202" font-size="20" fill="#173c53">value</text><rect x="702" y="218" width="416" height="49" fill="#d4eddc" /><path d="M700,218 h420" stroke="#b9cbd6" /><text x="714.0" y="251" font-size="21" fill="#173c53">1</text><text x="924.0" y="251" font-size="21" fill="#173c53">1</text><rect x="702" y="268" width="416" height="49" fill="#d4eddc" /><path d="M700,268 h420" stroke="#b9cbd6" /><text x="714.0" y="301" font-size="21" fill="#173c53">2</text><text x="924.0" y="301" font-size="21" fill="#173c53">1</text><path d="M700,318 h420" stroke="#b9cbd6" /><text x="714.0" y="351" font-size="21" fill="#173c53">3</text><text x="924.0" y="351" font-size="21" fill="#173c53">2</text><text x="70" y="410" font-size="21" fill="#173c53">ROWS：UNBOUNDED PRECEDING</text><text x="70" y="443" font-size="23" fill="#173c53">到 CURRENT ROW：累计 1 行</text><text x="700" y="410" font-size="21" fill="#173c53">RANGE：UNBOUNDED PRECEDING</text><text x="700" y="443" font-size="23" fill="#173c53">到 CURRENT ROW：纳入两个 1</text><rect x="70" y="475" width="1050" height="95" rx="10" fill="#fff4e1" stroke="#a4bfce" /><text x="95" y="513" font-size="22" fill="#173c53">绿色表示进入当前窗口的记录。</text><text x="95" y="548" font-size="22" fill="#173c53">若对 value 求 SUM：图示 ROWS 为 1，RANGE 为 2。</text><text x="55" y="630" font-size="21" fill="#173c53">ROWS 看行位置；RANGE 的当前值边界包含与当前排序键相同的记录。</text><text x="55" y="662" font-size="21" fill="#173c53">真实逐事件计算应使用稳定次级键并显式指定框架；数据库语法与默认值需另行核对。</text></g></svg></svg>
