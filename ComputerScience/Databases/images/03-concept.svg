<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>同值键的窗口边界：ROWS 与 RANGE</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2877a7"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="60" font-size="31" fill="#173c53">同值键的窗口边界：ROWS 与 RANGE</text><text x="60" y="125" font-size="22" fill="#173c53">仅按 value 排序；当前行为图示中的第一条 1（并列内部顺序未保证）</text><rect x="70" y="170" width="420" height="198" rx="10" fill="#edf5fb" stroke="#a4bfce"/><text x="84.0" y="202" font-size="20" fill="#173c53">位置</text><text x="294.0" y="202" font-size="20" fill="#173c53">value</text><rect x="72" y="218" width="416" height="49" fill="#d4eddc"/><path d="M70,218 h420" stroke="#b9cbd6"/><text x="84.0" y="251" font-size="21" fill="#173c53">1</text><text x="294.0" y="251" font-size="21" fill="#173c53">1</text><path d="M70,268 h420" stroke="#b9cbd6"/><text x="84.0" y="301" font-size="21" fill="#173c53">2</text><text x="294.0" y="301" font-size="21" fill="#173c53">1</text><path d="M70,318 h420" stroke="#b9cbd6"/><text x="84.0" y="351" font-size="21" fill="#173c53">3</text><text x="294.0" y="351" font-size="21" fill="#173c53">2</text><rect x="700" y="170" width="420" height="198" rx="10" fill="#edf5fb" stroke="#a4bfce"/><text x="714.0" y="202" font-size="20" fill="#173c53">位置</text><text x="924.0" y="202" font-size="20" fill="#173c53">value</text><rect x="702" y="218" width="416" height="49" fill="#d4eddc"/><path d="M700,218 h420" stroke="#b9cbd6"/><text x="714.0" y="251" font-size="21" fill="#173c53">1</text><text x="924.0" y="251" font-size="21" fill="#173c53">1</text><rect x="702" y="268" width="416" height="49" fill="#d4eddc"/><path d="M700,268 h420" stroke="#b9cbd6"/><text x="714.0" y="301" font-size="21" fill="#173c53">2</text><text x="924.0" y="301" font-size="21" fill="#173c53">1</text><path d="M700,318 h420" stroke="#b9cbd6"/><text x="714.0" y="351" font-size="21" fill="#173c53">3</text><text x="924.0" y="351" font-size="21" fill="#173c53">2</text><text x="70" y="410" font-size="21" fill="#173c53">ROWS：UNBOUNDED PRECEDING</text><text x="70" y="443" font-size="23" fill="#173c53">到 CURRENT ROW：累计 1 行</text><text x="700" y="410" font-size="21" fill="#173c53">RANGE：UNBOUNDED PRECEDING</text><text x="700" y="443" font-size="23" fill="#173c53">到 CURRENT ROW：纳入两个 1</text><rect x="70" y="475" width="1050" height="95" rx="10" fill="#fff4e1" stroke="#a4bfce"/><text x="95" y="513" font-size="22" fill="#173c53">绿色表示进入当前窗口的记录。</text><text x="95" y="548" font-size="22" fill="#173c53">若对 value 求 SUM：图示 ROWS 为 1，RANGE 为 2。</text><text x="55" y="630" font-size="21" fill="#173c53">ROWS 看行位置；RANGE 的当前值边界包含与当前排序键相同的记录。</text><text x="55" y="662" font-size="21" fill="#173c53">真实逐事件计算应使用稳定次级键并显式指定框架；数据库语法与默认值需另行核对。</text></g></svg>