xt x="44" y="647" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#af5a1d" text-anchor="start" font-weight="400">命中位置 3、7、11 分散：不能当作一个窄的连续区间</text><text x="44" y="755" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="33.54px" fill="#243b53" text-anchor="start" font-weight="400">跳跃扫描或覆盖扫描仍可能可用；真正选哪条路径，应查看执行计划。</text><desc> 复合索引是一条字典序，不是二维任意范围都连续</desc></g></g></g></svg>