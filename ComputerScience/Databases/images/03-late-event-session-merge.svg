<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="543" viewBox="0 0 960 543" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">迟到的中间事件把两个已有会话合并并改变旧事件的会话归属</title><desc id="artwork-desc">迟到的一条事件，可以把两个旧会话连接起来</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="445.508884"/></clipPath></defs><rect width="960" height="543" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">迟到的中间事件把两个已有会话合并并改变旧事件的会话归属</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(14.156473 76) scale(0.781966)"><g><title id="title">迟到的一条事件，可以把两个旧会话连接起来</title><desc id="desc">迟到的一条事件，可以把两个旧会话连接起来 </desc><rect width="1163.733" height="569.729" fill="white" x="13.867" y="0.0"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#748e9f"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3348" transform="translate(0,-100)"><text x="40" y="145" font-size="33.888928px" fill="#1f3348" text-anchor="start" font-weight="400">相邻事件间隔 &gt; 5 才断开；同一用户</text><text x="40" y="190" font-size="33.888928px" fill="#1f3348" text-anchor="start" font-weight="600">可用时刻 8：只收到事件时间 0、8</text><line fill="none" stroke="#748e9f" stroke-width="2" x1="175" y1="285" x2="1055" y2="285"/><circle cx="175" cy="285" r="11" fill="#1773a5" stroke="#1773a5" stroke-width="2"/><text x="175" y="330" font-size="33.32px" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><text x="175" y="245" font-size="33.888928px" fill="#2479b3" text-anchor="middle" font-weight="400">会话 1 · 金额 10</text><circle cx="1055" cy="285" r="11" fill="#b86028" stroke="#b86028" stroke-width="2"/><text x="1055" y="330" font-size="33.32px" fill="#1f3348" text-anchor="middle" font-weight="400">8</text><text x="1055" y="245" font-size="31.32px" fill="#aa602f" text-anchor="middle" font-weight="400">会话 2 · 金额 20</text><text x="615" y="280" font-size="33.888928px" fill="#47586b" text-anchor="middle" font-weight="400">间隔 8 &gt; 5</text><text x="40" y="420" font-size="33.888928px" fill="#1f3348" text-anchor="start" font-weight="600">可用时刻 9：补到事件时间 4、金额 5</text><line fill="none" stroke="#1773a5" stroke-width="5" x1="175" y1="520" x2="1055" y2="520"/><circle cx="175" cy="520" r="12" fill="#1773a5" stroke="#1773a5" stroke-width="2"/><text x="175" y="565" font-size="33.32px" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><circle cx="615" cy="520" r="12" fill="#b86028" stroke="#b86028" stroke-width="2"/><text x="615" y="565" font-size="33.32px" fill="#1f3348" text-anchor="middle" font-weight="400">4</text><circle cx="1055" cy="520" r="12" fill="#1773a5" stroke="#1773a5" stroke-width="2"/><text x="1055" y="565" font-size="33.32px" fill="#1f3348" text-anchor="middle" font-weight="400">8</text><text x="395" y="485" font-size="33.888928px" fill="#2479b3" text-anchor="middle" font-weight="400">间隔 4 ≤ 5</text><text x="835" y="485" font-size="33.888928px" fill="#2479b3" text-anchor="middle" font-weight="400">间隔 4 ≤ 5</text><text x="640" y="640" font-size="33.888928px" fill="#1f3348" text-anchor="middle" font-weight="400">合并后：10 + 5 + 20 = 35</text></g></g></g></g></svg>