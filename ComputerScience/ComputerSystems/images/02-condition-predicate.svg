<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="611" viewBox="0 0 960 611" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">条件变量通知、锁竞争与队列谓词变化的交错</title><desc id="artwork-desc">一次通知唤醒两个消费者，但数据只有一项 若 C2 用 if 并把“被通知”当作“可直接取项”，就会对空队列执行消费。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="513.085915"/></clipPath></defs><rect width="960" height="611" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">条件变量通知、锁竞争与队列谓词变化的交错</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(7.68142 35.078793) scale(0.737997)"><g><rect width="1233.067" height="695.241" fill="white" x="23.467" y="55.449"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#20344a"><text x="50" y="103" font-size="33.54px" fill="#20344a" text-anchor="start">共享条件：队列非空；通知不转移锁，也不为被唤醒线程预留项目。</text><text x="240" y="175" font-size="35.907995px" fill="#20344a" text-anchor="middle">生产者 P</text><line stroke="#d9e1e8" stroke-width="2" stroke-dasharray="5 7" x1="240" y1="195" x2="240" y2="690"/><text x="640" y="175" font-size="35.907995px" fill="#20344a" text-anchor="middle">消费者 C1</text><line stroke="#d9e1e8" stroke-width="2" stroke-dasharray="5 7" x1="640" y1="195" x2="640" y2="690"/><text x="1040" y="175" font-size="35.907995px" fill="#20344a" text-anchor="middle">消费者 C2</text><line stroke="#d9e1e8" stroke-width="2" stroke-dasharray="5 7" x1="1040" y1="195" x2="1040" y2="690"/><text x="50" y="235" font-size="30.96px" fill="#20344a" text-anchor="start">时间向下</text><text x="50" y="320" font-size="30.96px" fill="#20344a" text-anchor="start">加入一项</text><text x="50" y="430" font-size="30.96px" fill="#20344a" text-anchor="start">释放锁</text><text x="50" y="535" font-size="30.96px" fill="#20344a" text-anchor="start">C1 先取得锁</text><text x="50" y="645" font-size="30.96px" fill="#20344a" text-anchor="start">C2 再取得锁</text><rect x="495" y="210" width="290" height="55" fill="#edf4fa"/><text x="640" y="247" font-size="33.54px" fill="#20344a" text-anchor="middle">wait：队列为空</text><rect x="895" y="210" width="290" height="55" fill="#edf4fa"/><text x="1040" y="247" font-size="33.54px" fill="#20344a" text-anchor="middle">wait：队列为空</text><rect x="150" y="280" width="260" height="110" fill="#eef6f5"/><text x="280" y="318" font-size="27.43px" fill="#127682" text-anchor="middle">持锁：q = [项目]</text><text x="280" y="364" font-size="33.54px" fill="#127682" text-anchor="middle">notify_all()</text><line stroke="#b66428" stroke-width="3" x1="410" y1="350" x2="640" y2="410"/><text x="640" y="455" font-size="32.25px" fill="#b45b1c" text-anchor="middle">已唤醒，仍需竞争锁</text><line stroke="#b66428" stroke-width="3" x1="410" y1="350" x2="1040" y2="410"/><text x="1040" y="455" font-size="32.25px" fill="#b45b1c" text-anchor="middle">已唤醒，仍需竞争锁</text><rect x="480" y="495" width="320" height="82" fill="#eef6f5"/><text x="640" y="527" font-size="29px" fill="#127682" text-anchor="middle">检查非空，取走唯一项</text><text x="640" y="563" font-size="32.25px" fill="#127682" text-anchor="middle">q = []，随后释放锁</text><rect x="880" y="600" width="320" height="82" fill="#fff1e6"/><text x="1040" y="632" font-size="29px" fill="#b45b1c" text-anchor="middle">重新检查：队列又为空</text><text x="1040" y="668" font-size="32.25px" fill="#b45b1c" text-anchor="middle">while → 再次 wait</text><line stroke="#d9e1e8" stroke-width="2" x1="50" y1="724" x2="1230" y2="724"/></g><desc> 一次通知唤醒两个消费者，但数据只有一项 若 C2 用 if 并把“被通知”当作“可直接取项”，就会对空队列执行消费。</desc></g></g></g></svg>