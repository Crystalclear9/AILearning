<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">局部加速受串行部分限制</title><desc id="desc">图中把原总时间归一为一，可优化部分即使局部快十倍，仍留下占原时间四分之三的串行部分。整体速度应由新旧总时间比较，不能直接引用局部倍数。 这是假设工作量与其余成本不变的 Amdahl 模型。若优化增加调度、搬运或改变任务质量，应把这些额外变化加入时间账本，再用同条件实验验证。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">局部加速受串行部分限制</text><text x="70" y="145" font-size="26" fill="#18324d" font-weight="400">优化前：总时间归一化为 1</text><rect x="100" y="180" width="712.5" height="65" rx="0" fill="#c6deef" stroke="white" stroke-width="2"/><text x="110" y="222" font-size="22" fill="#18324d" font-weight="400">串行部分：0.75</text><rect x="812.5" y="180" width="237.5" height="65" rx="0" fill="#f9dc9a" stroke="white" stroke-width="2"/><text x="822.5" y="222" font-size="22" fill="#18324d" font-weight="400">可优化：0.25</text><text x="70" y="335" font-size="26" fill="#18324d" font-weight="400">优化后：只有右侧部分加速 10 倍</text><rect x="100" y="370" width="712.5" height="65" rx="0" fill="#c6deef" stroke="white" stroke-width="2"/><text x="110" y="412" font-size="22" fill="#18324d" font-weight="400">串行部分：0.75</text><rect x="812.5" y="370" width="23.75" height="65" rx="0" fill="#b6ddcf" stroke="white" stroke-width="2"/><text x="822.5" y="412" font-size="22" fill="#18324d" font-weight="400"></text><path d="M835 450 L970 500" fill="none" stroke="#c9773e" stroke-width="3"/><text x="680" y="535" font-size="23" fill="#18324d" font-weight="400">可优化部分剩 0.025</text><text x="100" y="585" font-size="26" fill="#18324d" font-weight="400">新时间 0.775；整体加速约 1.29 倍（1 ÷ 0.775）</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
