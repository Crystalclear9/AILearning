<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">局部加速受串行部分限制</title><desc id="plateDesc">B 按原时间比例计算实际总时间，避免把局部算子的十倍直接当作程序十倍。C 展示固定串行比例下的加速曲线与三分之四的极限；如果工作量、重叠关系或串行比例也变化，就需要重新建立模型。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">局部加速受串行部分限制</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">ComputerSystems</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">局部加速与全局时间的关系</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">局部十倍只得到约 1.29 倍</text><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">新时间：0.75 + 0.25÷10 = 0.775</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">整体加速：1 ÷ 0.775 ≈ 1.2903</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">固定问题规模，串行部分仍占原时间 0.75</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">可优化部分无限快仍有上限</text><path d="M868,1085 L1378,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="857" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1</text><path d="M868,1005 L1378,1005" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="857" y="1011" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1.17</text><path d="M868,925 L1378,925" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="857" y="931" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1.34</text><text x="868" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400">1</text><text x="975.368" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400">5</text><text x="1378" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400">20</text><polyline points="868,1085 894.842,1017.77 975.368,967.353 1109.58,948.378 1378,938.423" fill="none" stroke="#168a83" stroke-width="3"/><circle cx="868" cy="1085" r="4.5" fill="#168a83"/><circle cx="894.842" cy="1017.77" r="4.5" fill="#168a83"/><circle cx="975.368" cy="967.353" r="4.5" fill="#168a83"/><circle cx="1109.58" cy="948.378" r="4.5" fill="#168a83"/><circle cx="1378" cy="938.423" r="4.5" fill="#168a83"/><path d="M868,928.137 L1378,928.137" fill="none" stroke="#d17c3e" stroke-width="2" stroke-dasharray="6 6"/><text x="1378" y="918.137" font-size="20" fill="#d17c3e" text-anchor="end" font-weight="400">上限 1.333</text><text x="806" y="901" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">整体加速倍数</text><text x="1378" y="1144" font-size="20" fill="#5c7281" text-anchor="end" font-weight="400">局部加速倍数</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">局部加速受串行部分限制</title><desc id="panelA-desc">图中把原总时间归一为一，可优化部分即使局部快十倍，仍留下占原时间四分之三的串行部分。整体速度应由新旧总时间比较，不能直接引用局部倍数。 这是假设工作量与其余成本不变的 Amdahl 模型。若优化增加调度、搬运或改变任务质量，应把这些额外变化加入时间账本，再用同条件实验验证。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">局部加速受串行部分限制</text><text x="70" y="145" font-size="26" fill="#18324d" font-weight="400">优化前：总时间归一化为 1</text><rect x="100" y="180" width="712.5" height="65" rx="0" fill="#c6deef" stroke="white" stroke-width="2" /><text x="110" y="222" font-size="22" fill="#18324d" font-weight="400">串行部分：0.75</text><rect x="812.5" y="180" width="237.5" height="65" rx="0" fill="#f9dc9a" stroke="white" stroke-width="2" /><text x="822.5" y="222" font-size="22" fill="#18324d" font-weight="400">可优化：0.25</text><text x="70" y="335" font-size="26" fill="#18324d" font-weight="400">优化后：只有右侧部分加速 10 倍</text><rect x="100" y="370" width="712.5" height="65" rx="0" fill="#c6deef" stroke="white" stroke-width="2" /><text x="110" y="412" font-size="22" fill="#18324d" font-weight="400">串行部分：0.75</text><rect x="812.5" y="370" width="23.75" height="65" rx="0" fill="#b6ddcf" stroke="white" stroke-width="2" /><text x="822.5" y="412" font-size="22" fill="#18324d" font-weight="400" /><path d="M835 450 L970 500" fill="none" stroke="#c9773e" stroke-width="3" /><text x="680" y="535" font-size="23" fill="#18324d" font-weight="400">可优化部分剩 0.025</text><text x="100" y="585" font-size="26" fill="#18324d" font-weight="400">新时间 0.775；整体加速约 1.29 倍（1 ÷ 0.775）</text></g></svg></svg>
