<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">局部加速受串行部分限制</title><desc id="plateDesc">B 按原时间比例计算实际总时间，避免把局部算子的十倍直接当作程序十倍。C 展示固定串行比例下的加速曲线与三分之四的极限；如果工作量、重叠关系或串行比例也变化，就需要重新建立模型。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">局部加速受串行部分限制</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">局部加速与全局时间的关系</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">局部十倍只得到约 1.29 倍</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">可优化部分无限快仍有上限</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">局部加速受串行部分限制</title><desc id="panelA-desc">图中把原总时间归一为一，可优化部分即使局部快十倍，仍留下占原时间四分之三的串行部分。整体速度应由新旧总时间比较，不能直接引用局部倍数。 这是假设工作量与其余成本不变的 Amdahl 模型。若优化增加调度、搬运或改变任务质量，应把这些额外变化加入时间账本，再用同条件实验验证。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">局部加速受串行部分限制</text><text x="70" y="145" font-size="26" fill="#18324d" font-weight="400">优化前：总时间归一化为 1</text><rect x="100" y="180" width="712.5" height="65" rx="0" fill="#c6deef" stroke="white" stroke-width="2" /><text x="110" y="222" font-size="22" fill="#18324d" font-weight="400">串行部分：0.75</text><rect x="812.5" y="180" width="237.5" height="65" rx="0" fill="#f9dc9a" stroke="white" stroke-width="2" /><text x="822.5" y="222" font-size="22" fill="#18324d" font-weight="400">可优化：0.25</text><text x="70" y="335" font-size="26" fill="#18324d" font-weight="400">优化后：只有右侧部分加速 10 倍</text><rect x="100" y="370" width="712.5" height="65" rx="0" fill="#c6deef" stroke="white" stroke-width="2" /><text x="110" y="412" font-size="22" fill="#18324d" font-weight="400">串行部分：0.75</text><rect x="812.5" y="370" width="23.75" height="65" rx="0" fill="#b6ddcf" stroke="white" stroke-width="2" /><text x="822.5" y="412" font-size="22" fill="#18324d" font-weight="400" /><path d="M835 450 L970 500" fill="none" stroke="#c9773e" stroke-width="3" /><text x="680" y="535" font-size="23" fill="#18324d" font-weight="400">可优化部分剩 0.025</text><text x="100" y="585" font-size="26" fill="#18324d" font-weight="400">新时间 0.775；整体加速约 1.29 倍（1 ÷ 0.775）</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 928) scale(0.7272727273 1) translate(-96 -928)">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 928) scale(0.7272727273 1) translate(-138 -928)">新时间：0.75 + 0.25÷10 = 0.775</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1010) scale(0.7272727273 1) translate(-96 -1010)">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1010) scale(0.7272727273 1) translate(-138 -1010)">整体加速：1 ÷ 0.775 ≈ 1.2903</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1092) scale(0.7272727273 1) translate(-96 -1092)">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1092) scale(0.7272727273 1) translate(-138 -1092)">固定问题规模，串行部分仍占原时间 0.75</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M868,1085 L1378,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="857" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(857 1091) scale(0.7272727273 1) translate(-857 -1091)">1</text><path d="M868,1005 L1378,1005" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="857" y="1011" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(857 1011) scale(0.7272727273 1) translate(-857 -1011)">1.17</text><path d="M868,925 L1378,925" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="857" y="931" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(857 931) scale(0.7272727273 1) translate(-857 -931)">1.34</text><text x="868" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(868 1112) scale(0.7272727273 1) translate(-868 -1112)">1</text><text x="975.368" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(975.368 1112) scale(0.7272727273 1) translate(-975.368 -1112)">5</text><text x="1378" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(1378 1112) scale(0.7272727273 1) translate(-1378 -1112)">20</text><polyline points="868,1085 894.842,1017.77 975.368,967.353 1109.58,948.378 1378,938.423" fill="none" stroke="#168a83" stroke-width="3" /><circle cx="868" cy="1085" r="4.5" fill="#168a83" /><circle cx="894.842" cy="1017.77" r="4.5" fill="#168a83" /><circle cx="975.368" cy="967.353" r="4.5" fill="#168a83" /><circle cx="1109.58" cy="948.378" r="4.5" fill="#168a83" /><circle cx="1378" cy="938.423" r="4.5" fill="#168a83" /><path d="M868,928.137 L1378,928.137" fill="none" stroke="#d17c3e" stroke-width="2" stroke-dasharray="6 6" /><text x="1378" y="918.137" font-size="20" fill="#d17c3e" text-anchor="end" font-weight="400" transform="translate(1378 918.137) scale(0.7272727273 1) translate(-1378 -918.137)">上限 1.333</text><text x="806" y="901" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 901) scale(0.7272727273 1) translate(-806 -901)">整体加速倍数</text><text x="1378" y="1144" font-size="20" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(1378 1144) scale(0.7272727273 1) translate(-1378 -1144)">局部加速倍数</text></g></svg>
