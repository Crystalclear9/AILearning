<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="757.48" viewBox="-18.24 28.76 996.48 757.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">总工作与关键路径的两个下界</title><desc id="artwork-desc">把依赖图兑现成排程：更多执行单元在哪里失去收益？</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="670.121951"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="757.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="721" viewBox="0 47 960 721" overflow="hidden"><rect width="960" height="768" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(7.926829 32.463415) scale(0.682927)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>把依赖图兑现成排程：更多执行单元在哪里失去收益？</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#74909d"/></marker></defs><rect width="1332.5" height="981.25" fill="#ffffff" x="25.0" y="63.75"/><g font-family="Microsoft YaHei, sans-serif" fill="#23394a"><text x="55" y="117" font-size="36.12px" fill="#475b6c" text-anchor="start">A=2，B=C=3，D=1；依赖 A→B、A→C、B→D、C→D；无调度开销</text><line fill="none" stroke="#74909d" stroke-width="2" marker-end="url(#a)" x1="285" y1="310" x2="555" y2="230"/><line fill="none" stroke="#74909d" stroke-width="2" marker-end="url(#a)" x1="285" y1="310" x2="555" y2="410"/><line fill="none" stroke="#74909d" stroke-width="2" marker-end="url(#a)" x1="685" y1="230" x2="1015" y2="310"/><line fill="none" stroke="#74909d" stroke-width="2" marker-end="url(#a)" x1="685" y1="410" x2="1015" y2="310"/><rect x="160" y="273" width="120" height="74" fill="url(#book-wash-edf4f9)" stroke="#1f6e93" stroke-width="2"/><text x="220" y="321" font-size="38.803571px" fill="#23394a" text-anchor="middle">A:2</text><rect x="560" y="193" width="120" height="74" fill="url(#book-wash-edf4f9)" stroke="#1f6e93" stroke-width="2"/><text x="620" y="241" font-size="38.803571px" fill="#23394a" text-anchor="middle">B:3</text><rect x="560" y="373" width="120" height="74" fill="url(#book-wash-edf4f9)" stroke="#1f6e93" stroke-width="2"/><text x="620" y="421" font-size="38.803571px" fill="#23394a" text-anchor="middle">C:3</text><rect x="1020" y="273" width="120" height="74" fill="url(#book-wash-edf4f9)" stroke="#1f6e93" stroke-width="2"/><text x="1080" y="321" font-size="38.803571px" fill="#23394a" text-anchor="middle">D:1</text><text x="55" y="510" font-size="38.7px" fill="#23394a" text-anchor="start">一条最长链为 A→B→D，长度 6；总工作 W=9。</text><text x="55" y="612" font-size="36.12px" fill="#23394a" text-anchor="start">1 个执行单元</text><rect x="330" y="580" width="218" height="55" fill="#2a76a0" stroke="none" stroke-width="2"/><text x="440" y="617" font-size="38.7px" fill="#ffffff" text-anchor="middle">A</text><rect x="550" y="580" width="328" height="55" fill="#2a76a0" stroke="none" stroke-width="2"/><text x="715" y="617" font-size="38.7px" fill="#ffffff" text-anchor="middle">B</text><rect x="880" y="580" width="328" height="55" fill="#b5693d" stroke="none" stroke-width="2"/><text x="1045" y="617" font-size="38.7px" fill="#ffffff" text-anchor="middle">C</text><rect x="1210" y="580" width="108" height="55" fill="#2a76a0" stroke="none" stroke-width="2"/><text x="1265" y="617" font-size="38.7px" fill="#ffffff" text-anchor="middle">D</text><line fill="none" stroke="#74909d" stroke-width="2" stroke-dasharray="4 5" x1="1320" y1="572" x2="1320" y2="650"/><text x="55" y="722" font-size="36.12px" fill="#23394a" text-anchor="start">2 个：单元 1</text><rect x="330" y="690" width="218" height="55" fill="#2a76a0" stroke="none" stroke-width="2"/><text x="440" y="727" font-size="38.7px" fill="#ffffff" text-anchor="middle">A</text><rect x="550" y="690" width="328" height="55" fill="#2a76a0" stroke="none" stroke-width="2"/><text x="715" y="727" font-size="38.7px" fill="#ffffff" text-anchor="middle">B</text><rect x="880" y="690" width="108" height="55" fill="#2a76a0" stroke="none" stroke-width="2"/><text x="935" y="727" font-size="38.7px" fill="#ffffff" text-anchor="middle">D</text><line fill="none" stroke="#74909d" stroke-width="2" stroke-dasharray="4 5" x1="990" y1="682" x2="990" y2="760"/><text x="55" y="832" font-size="36.12px" fill="#23394a" text-anchor="start">2 个：单元 2</text><rect x="550" y="800" width="328" height="55" fill="#b5693d" stroke="none" stroke-width="2"/><text x="715" y="837" font-size="38.7px" fill="#ffffff" text-anchor="middle">C</text><line fill="none" stroke="#74909d" stroke-width="2" stroke-dasharray="4 5" x1="990" y1="792" x2="990" y2="870"/><text x="330" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">0</text><text x="440" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">1</text><text x="550" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">2</text><text x="660" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">3</text><text x="770" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">4</text><text x="880" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">5</text><text x="990" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">6</text><text x="1100" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">7</text><text x="1210" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">8</text><text x="1320" y="950" font-size="30.94px" fill="#475b6c" text-anchor="middle">9</text><text x="55" y="1010" font-size="38.7px" fill="#23394a" text-anchor="start">达到 6 后，再加单元无法越过依赖链；这个实例的最大加速为 9÷6=1.5。</text></g><desc> 把依赖图兑现成排程：更多执行单元在哪里失去收益？</desc></g></g></g></svg></svg>