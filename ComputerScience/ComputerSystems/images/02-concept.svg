<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">总工作与关键路径的两个下界</title><desc id="plateDesc">B 同时计算总工作与关键路径两个下界。C 对这个具体任务图，两个执行单元能够把 B、C 同时执行，达到六毫秒；一个执行单元需要九毫秒。下界在此例可达到，并不意味着所有一般任务图都存在同样无开销的最优调度。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">总工作与关键路径的两个下界</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">ComputerSystems</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">任务依赖与可并行区间</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">关键路径给出六毫秒下界</text><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">总工作量：2+3+3+1=9 ms</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">关键路径：2+3+1=6 ms</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">两执行单元下界 max(9÷2,6)=6 ms</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">单执行单元不能重叠 B 与 C</text><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">2</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">4</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">6</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">8</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">10</text><rect x="951.75" y="984.8" width="86" height="100.2" rx="3" fill="#168a83" stroke="#168a83"/><text x="994.75" y="974.8" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">6</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">理想两单元调度</text><rect x="1209.25" y="934.7" width="86" height="150.3" rx="3" fill="#d17c3e" stroke="#d17c3e"/><text x="1252.25" y="924.7" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">9</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">单单元串行调度</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">时间 / ms；忽略调度与同步开销</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">总工作与关键路径的两个下界</title><desc id="panelA-desc">图中任务存在分叉与汇合。总工作为九毫秒，但最长依赖链为六毫秒；两个执行单元即使能提供足够算力，也无法越过依赖提前开始最后任务。 六毫秒是本例零调度开销、足够独立资源下可达到的时间。实际调度、同步和通信还可能增加成本；线程数量增加也不会自动缩短一条必须串行完成的链。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">总工作与关键路径的两个下界</text><circle cx="120" cy="310" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="108" y="319" font-size="24" fill="#18324d" font-weight="400">A</text><circle cx="500" cy="180" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="488" y="189" font-size="24" fill="#18324d" font-weight="400">B</text><circle cx="500" cy="440" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="488" y="449" font-size="24" fill="#18324d" font-weight="400">C</text><circle cx="920" cy="310" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="908" y="319" font-size="24" fill="#18324d" font-weight="400">D</text><path d="M157 298 L460 195" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M157 323 L460 425" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M537 195 L880 297" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M537 425 L880 323" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="78" y="380" font-size="24" fill="#18324d" font-weight="400">2 ms</text><text x="463" y="115" font-size="24" fill="#18324d" font-weight="400">3 ms</text><text x="463" y="510" font-size="24" fill="#18324d" font-weight="400">3 ms</text><text x="880" y="380" font-size="24" fill="#18324d" font-weight="400">1 ms</text><text x="170" y="555" font-size="25" fill="#18324d" font-weight="400">总工作：2 + 3 + 3 + 1 = 9 ms；关键路径：2 + 3 + 1 = 6 ms</text></g></svg></svg>
