<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">总工作与关键路径的两个下界</title><desc id="desc">图中任务存在分叉与汇合。总工作为九毫秒，但最长依赖链为六毫秒；两个执行单元即使能提供足够算力，也无法越过依赖提前开始最后任务。 六毫秒是本例零调度开销、足够独立资源下可达到的时间。实际调度、同步和通信还可能增加成本；线程数量增加也不会自动缩短一条必须串行完成的链。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">总工作与关键路径的两个下界</text><circle cx="120" cy="310" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="108" y="319" font-size="24" fill="#18324d" font-weight="400">A</text><circle cx="500" cy="180" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="488" y="189" font-size="24" fill="#18324d" font-weight="400">B</text><circle cx="500" cy="440" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="488" y="449" font-size="24" fill="#18324d" font-weight="400">C</text><circle cx="920" cy="310" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="908" y="319" font-size="24" fill="#18324d" font-weight="400">D</text><path d="M157 298 L460 195" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M157 323 L460 425" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M537 195 L880 297" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M537 425 L880 323" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><text x="78" y="380" font-size="24" fill="#18324d" font-weight="400">2 ms</text><text x="463" y="115" font-size="24" fill="#18324d" font-weight="400">3 ms</text><text x="463" y="510" font-size="24" fill="#18324d" font-weight="400">3 ms</text><text x="880" y="380" font-size="24" fill="#18324d" font-weight="400">1 ms</text><text x="170" y="555" font-size="25" fill="#18324d" font-weight="400">总工作：2 + 3 + 3 + 1 = 9 ms；关键路径：2 + 3 + 1 = 6 ms</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
