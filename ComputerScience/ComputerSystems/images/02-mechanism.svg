<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">读改写竞态：两个加一为何只得到一</title><desc id="desc">把加一拆成读取、计算和写回，两个线程就可能读到同一个旧值。两次写回都写入 1，最终结果丢失一次更新；问题在于复合操作没有作为一个受保护的整体执行。 表表示允许这种交错的抽象共享内存模型，不断言某一 Python 版本恰好按此字节码交错。实际并发接口需要按其原子性和同步语义分析。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#fbfdff" stroke="#fbfdff" rx="0"/><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3"/><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">读改写竞态：两个加一为何只得到一</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">用具体对象、数值或条件对照，核对这一节的推理。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">时间</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">线程 A</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">线程 B</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0"/><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">共享 x</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">开始</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0"/><text x="345" y="260" font-siz