="787" font-size="33" fill="#b15e27" text-anchor="middle" font-weight="400">1</text><text x="1350" y="1000" font-size="32" fill="#197b7e" text-anchor="middle" font-weight="400">结果 2：B 读到 A 写入的 1</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1050) scale(1.25)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#1d3145" text-anchor="start">锁保护的范围必须包含整个“读旧值 → 算新值 → 写回”</text><text x="65" y="125" font-size="37.41px" fill="#1e7499" text-anchor="start">线程 A</text><rect x="65" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="276.0" y="184" font-size="36.12px" fill="#1e7499" text-anchor="middle">获得锁</text><rect x="495" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="706.0" y="184" font-size="36.12px" fill="#1e7499" text-anchor="middle">读0，算1，写1</text><rect x="925" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="1136.0" y="184" font-size="36.12px" fill="#1e7499" text-anchor="middle">释放锁</text><text x="65" y="260" font-size="37.41px" fill="#af6033" text-anchor="start">线程 B</text><rect x="65" y="280" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="276.0" y="319" font-size="36.12px" fill="#af6033" text-anchor="middle">等待 A 释放</text><rect x="495" y="280" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="706.0" y="319" font-size="36.12px" fill="#af6033" text-anchor="middle">读1，算2，写2</text><rect x="925" y="280" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="1136.0" y="319" font-size="36.12px" fill="#af6033" text-anchor="middle">释放锁</text><text x="65" y="412" font-size="36.12px" fill="#1d3145" text-anchor="start">若只给写回加锁，两次读取仍可能都得到 0，最终仍可丢掉一次递增。</text></g></g></g></g></g></svg>