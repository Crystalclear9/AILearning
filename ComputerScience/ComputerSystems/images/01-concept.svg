<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">缓存块与连续访问的字节利用</title><desc id="desc">块搬运带来空间局部性：连续访问能重复利用同一块已搬到近处的数据；跨块只取单项时，搬运量可能远高于真正需要的元素字节数。 该例是冷数据与指定块边界下的模型。缓存命中、预取、对齐、写分配和访问顺序都会改变实际流量，因此不能仅根据数组大小推断主存带宽占用。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker></defs><rect width="1200" height="640" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">缓存块与连续访问的字节利用</text><text x="70" y="135" font-size="26" fill="#18324d" font-weight="400">一条缓存线：64 字节，按 4 字节的 float32 划分为 16 格</text><rect x="40" y="190" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="60" y="226" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="110" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="130" y="226" font-size="22" fill="#18324d" font-weight="400">1</text><rect x="180" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="200" y="226" font-size="22" fill="#18324d" font-weight="400">2</text><rect x="250" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="270" y="226" font-size="22" fill="#18324d" font-weight="400">3</text><rect x="320" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="340" y="226" font-size="22" fill="#18324d" font-weight="400">4</text><rect x="390" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="410" y="226" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="460" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="480" y="226" font-size="22" fill="#18324d" font-weight="400">6</text><rect x="530" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="550" y="226" font-size="22" fill="#18324d" font-weight="400">7</text><rect x="600" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="620" y="226" font-size="22" fill="#18324d" font-weight="400">8</text><rect x="670" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="690" y="226" font-size="22" fill="#18324d" font-weight="400">9</text><rect x="740" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="760" y="226" font-size="22" fill="#18324d" font-weight="400">10</text><rect x="810" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="830" y="226" font-size="22" fill="#18324d" font-weight="400">11</text><rect x="880" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="900" y="226" font-size="22" fill="#18324d" font-weight="400">12</text><rect x="950" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="970" y="226" font-size="22" fill="#18324d" font-weight="400">13</text><rect x="1020" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="1040" y="226" font-size="22" fill="#18324d" font-weight="400">14</text><rect x="1090" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="1110" y="226" font-size="22" fill="#18324d" font-weight="400">15</text><text x="65" y="300" font-size="25" fill="#18324d" font-weight="400">连续读取全部格：搬运 64 字节，使用 64 字节</text><rect x="80" y="330" width="950" height="65" rx="0" fill="#b6ddcf" stroke="white" stroke-width="2" /><text x="90" y="372" font-size="22" fill="#18324d" font-weight="400">全部字节有效使用</text><text x="65" y="445" font-size="25" fill="#18324d" font-weight="400">若每条线仅使用第 0 格：搬运 64 字节，只使用 4 字节</text><rect x="80" y="475" width="59.375" height="65" rx="0" fill="#f9dc9a" stroke="white" stroke-width="2" /><text x="90" y="517" font-size="22" fill="#18324d" font-weight="400" /><rect x="139.375" y="475" width="890.625" height="65" rx="0" fill="#e7edf4" stroke="white" stroke-width="2" /><text x="149.375" y="517" font-size="22" fill="#18324d" font-weight="400">其余 60 字节未被本次访问利用</text><text x="80" y="580" font-size="22" fill="#18324d" font-weight="400">这是载荷利用率示意；缓存命中率与实际吞吐还取决于复用和访问模式</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
