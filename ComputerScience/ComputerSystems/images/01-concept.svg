<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">缓存块与连续访问的字节利用</title><desc id="plateDesc">B 每条线只用四字节时，载荷利用率为百分之六点二五。C 固定读取十六个 float32，若它们正好占一条对齐缓存线，只需该线六十四字节；若每项分别落在不同线，则涉及十六条线共一千零二十四字节。预取、已驻留缓存和跨线对齐会改变实际流量，本图采用明确的冷缓存模型。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">缓存块与连续访问的字节利用</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">ComputerSystems</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">连续访问与缓存块的字节利用</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">一条线内含十六个 float32</text><text x="312" y="965" font-size="29" fill="#19354a" text-anchor="middle" font-weight="400">4 字节</text><path d="M249.711,981 L374.289,981" fill="none" stroke="#19354a" stroke-width="2"/><text x="312" y="1020" font-size="29" fill="#19354a" text-anchor="middle" font-weight="400">64 字节</text><text x="399.289" y="998" font-size="29" fill="#168a83" text-anchor="start" font-weight="400">= 6.25%</text><text x="96" y="1125" font-size="22" fill="#5c7281" text-anchor="start" font-weight="400">每条缓存线只使用一项时的载荷利用率</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">同样有效数据可能搬运更多字节</text><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">250</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">500</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">750</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1000</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">1250</text><rect x="951.75" y="1076.45" width="86" height="8.5504" rx="3" fill="#168a83" stroke="#168a83"/><text x="994.75" y="1066.45" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">64</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">16 项连续读取</text><rect x="1209.25" y="948.194" width="86" height="136.806" rx="3" fill="#d17c3e" stroke="#d17c3e"/><text x="1252.25" y="938.194" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">1024</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">16 项跨线读取</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">搬运字节：冷缓存、64 字节线的简化模型</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">缓存块与连续访问的字节利用</title><desc id="panelA-desc">块搬运带来空间局部性：连续访问能重复利用同一块已搬到近处的数据；跨块只取单项时，搬运量可能远高于真正需要的元素字节数。 该例是冷数据与指定块边界下的模型。缓存命中、预取、对齐、写分配和访问顺序都会改变实际流量，因此不能仅根据数组大小推断主存带宽占用。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">缓存块与连续访问的字节利用</text><text x="70" y="135" font-size="26" fill="#18324d" font-weight="400">一条缓存线：64 字节，按 4 字节的 float32 划分为 16 格</text><rect x="40" y="190" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="60" y="226" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="110" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="130" y="226" font-size="22" fill="#18324d" font-weight="400">1</text><rect x="180" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="200" y="226" font-size="22" fill="#18324d" font-weight="400">2</text><rect x="250" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="270" y="226" font-size="22" fill="#18324d" font-weight="400">3</text><rect x="320" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="340" y="226" font-size="22" fill="#18324d" font-weight="400">4</text><rect x="390" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="410" y="226" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="460" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="480" y="226" font-size="22" fill="#18324d" font-weight="400">6</text><rect x="530" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="550" y="226" font-size="22" fill="#18324d" font-weight="400">7</text><rect x="600" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="620" y="226" font-size="22" fill="#18324d" font-weight="400">8</text><rect x="670" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="690" y="226" font-size="22" fill="#18324d" font-weight="400">9</text><rect x="740" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="760" y="226" font-size="22" fill="#18324d" font-weight="400">10</text><rect x="810" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="830" y="226" font-size="22" fill="#18324d" font-weight="400">11</text><rect x="880" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="900" y="226" font-size="22" fill="#18324d" font-weight="400">12</text><rect x="950" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="970" y="226" font-size="22" fill="#18324d" font-weight="400">13</text><rect x="1020" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="1040" y="226" font-size="22" fill="#18324d" font-weight="400">14</text><rect x="1090" y="190" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="1110" y="226" font-size="22" fill="#18324d" font-weight="400">15</text><text x="65" y="300" font-size="25" fill="#18324d" font-weight="400">连续读取全部格：搬运 64 字节，使用 64 字节</text><rect x="80" y="330" width="950" height="65" rx="0" fill="#b6ddcf" stroke="white" stroke-width="2" /><text x="90" y="372" font-size="22" fill="#18324d" font-weight="400">全部字节有效使用</text><text x="65" y="445" font-size="25" fill="#18324d" font-weight="400">若每条线仅使用第 0 格：搬运 64 字节，只使用 4 字节</text><rect x="80" y="475" width="59.375" height="65" rx="0" fill="#f9dc9a" stroke="white" stroke-width="2" /><text x="90" y="517" font-size="22" fill="#18324d" font-weight="400" /><rect x="139.375" y="475" width="890.625" height="65" rx="0" fill="#e7edf4" stroke="white" stroke-width="2" /><text x="149.375" y="517" font-size="22" fill="#18324d" font-weight="400">其余 60 字节未被本次访问利用</text><text x="80" y="580" font-size="22" fill="#18324d" font-weight="400">这是载荷利用率示意；缓存命中率与实际吞吐还取决于复用和访问模式</text></g></svg></svg>
