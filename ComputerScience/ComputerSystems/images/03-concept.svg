<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">流水线首批延迟与稳态节拍</title><desc id="plateDesc">B 分开计算首批延迟与后续九个节拍。C 仅把瓶颈阶段从五毫秒改成八毫秒，首批变成十四，总时间为十四加九乘八等于八十六。图假设阶段独占资源并允许队列缓冲；真实流水线还会受到队列容量、抖动和争用影响。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">流水线首批延迟与稳态节拍</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">ComputerSystems</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">阶段节拍与流水线首批延迟</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">十批总时间包含填充与稳态</text><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">首批：2+5+4=11 ms</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">后续每批理想节拍：5 ms</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">十批：11+9×5=56 ms</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">更慢的瓶颈改变全程时间</text><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0</text><path d="M866,1051.6 L1381,1051.6" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1057.6" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">20</text><path d="M866,1018.2 L1381,1018.2" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1024.2" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">40</text><path d="M866,984.8 L1381,984.8" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="990.8" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">60</text><path d="M866,951.4 L1381,951.4" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="957.4" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">80</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">100</text><rect x="951.75" y="991.48" width="86" height="93.52" rx="3" fill="#168a83" stroke="#168a83"/><text x="994.75" y="981.48" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">56</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">阶段二为 5 ms</text><rect x="1209.25" y="941.38" width="86" height="143.62" rx="3" fill="#d17c3e" stroke="#d17c3e"/><text x="1252.25" y="931.38" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">86</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">阶段二为 8 ms</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">十批总时间 / ms；其余阶段仍为 2、4</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">流水线首批延迟与稳态节拍</title><desc id="panelA-desc">每个批次必须依次完成三个阶段，但不同批次可在独立资源上重叠。首批延迟是三段耗时之和，持续输出间隔由最慢阶段决定。 该公式要求阶段耗时固定、资源独立并有足够缓冲。实际读取抖动、队列容量与共享 CPU 会改变节拍，不能把模拟时间称为真实设备吞吐。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">流水线首批延迟与稳态节拍</text><text x="70" y="200" font-size="24" fill="#18324d" font-weight="400">阶段一</text><rect x="220" y="160" width="70" height="58" rx="8" fill="#c6deef" stroke="#47769a" stroke-width="2" /><text x="228" y="196" font-size="22" fill="#18324d" font-weight="400">A</text><rect x="290" y="160" width="70" height="58" rx="8" fill="#b6ddcf" stroke="#47769a" stroke-width="2" /><text x="298" y="196" font-size="22" fill="#18324d" font-weight="400">B</text><rect x="360" y="160" width="70" height="58" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="368" y="196" font-size="22" fill="#18324d" font-weight="400">C</text><text x="70" y="300" font-size="24" fill="#18324d" font-weight="400">阶段二</text><rect x="290" y="260" width="175" height="58" rx="8" fill="#c6deef" stroke="#47769a" stroke-width="2" /><text x="298" y="296" font-size="22" fill="#18324d" font-weight="400">A</text><rect x="465" y="260" width="175" height="58" rx="8" fill="#b6ddcf" stroke="#47769a" stroke-width="2" /><text x="473" y="296" font-size="22" fill="#18324d" font-weight="400">B</text><rect x="640" y="260" width="175" height="58" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="648" y="296" font-size="22" fill="#18324d" font-weight="400">C</text><text x="70" y="400" font-size="24" fill="#18324d" font-weight="400">阶段三</text><rect x="465" y="360" width="140" height="58" rx="8" fill="#c6deef" stroke="#47769a" stroke-width="2" /><text x="473" y="396" font-size="22" fill="#18324d" font-weight="400">A</text><rect x="640" y="360" width="140" height="58" rx="8" fill="#b6ddcf" stroke="#47769a" stroke-width="2" /><text x="648" y="396" font-size="22" fill="#18324d" font-weight="400">B</text><rect x="815" y="360" width="140" height="58" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="823" y="396" font-size="22" fill="#18324d" font-weight="400">C</text><text x="215" y="485" font-size="20" fill="#18324d" font-weight="400">0ms</text><text x="390" y="485" font-size="20" fill="#18324d" font-weight="400">5ms</text><text x="565" y="485" font-size="20" fill="#18324d" font-weight="400">10ms</text><text x="740" y="485" font-size="20" fill="#18324d" font-weight="400">15ms</text><text x="915" y="485" font-size="20" fill="#18324d" font-weight="400">20ms</text><text x="85" y="540" font-size="25" fill="#18324d" font-weight="400">首批 A：2 + 5 + 4 = 11 ms；稳态节拍由 5 ms 的阶段二限制</text><text x="85" y="580" font-size="23" fill="#18324d" font-weight="400">图示允许缓冲、阶段独占；10 批理想总时长为 11 + 9 × 5 = 56 ms</text></g></svg></svg>
