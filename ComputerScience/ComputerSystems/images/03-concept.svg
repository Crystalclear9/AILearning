<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">流水线首批延迟与稳态节拍</title><desc id="desc">每个批次必须依次完成三个阶段，但不同批次可在独立资源上重叠。首批延迟是三段耗时之和，持续输出间隔由最慢阶段决定。 该公式要求阶段耗时固定、资源独立并有足够缓冲。实际读取抖动、队列容量与共享 CPU 会改变节拍，不能把模拟时间称为真实设备吞吐。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">流水线首批延迟与稳态节拍</text><text x="70" y="200" font-size="24" fill="#18324d" font-weight="400">阶段一</text><rect x="220" y="160" width="70" height="58" rx="8" fill="#c6deef" stroke="#47769a" stroke-width="2"/><text x="228" y="196" font-size="22" fill="#18324d" font-weight="400">A</text><rect x="290" y="160" width="70" height="58" rx="8" fill="#b6ddcf" stroke="#47769a" stroke-width="2"/><text x="298" y="196" font-size="22" fill="#18324d" font-weight="400">B</text><rect x="360" y="160" width="70" height="58" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2"/><text x="368" y="196" font-size="22" fill="#18324d" font-weight="400">C</text><text x="70" y="300" font-size="24" fill="#18324d" font-weight="400">阶段二</text><rect x="290" y="260" width="175" height="58" rx="8" fill="#c6deef" stroke="#47769a" stroke-width="2"/><text x="298" y="296" font-size="22" fill="#18324d" font-weight="400">A</text><rect x="465" y="260" width="175" height="58" rx="8" fill="#b6ddcf" stroke="#47769a" stroke-width="2"/><text x="473" y="296" font-size="22" fill="#18324d" font-weight="400">B</text><rect x="640" y="260" width="175" height="58" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2"/><text x="648" y="296" font-size="22" fill="#18324d" font-weight="400">C</text><text x="70" y="400" font-size="24" fill="#18324d" font-weight="400">阶段三</text><rect x="465" y="360" width="140" height="58" rx="8" fill="#c6deef" stroke="#47769a" stroke-width="2"/><text x="473" y="396" font-size="22" fill="#18324d" font-weight="400">A</text><rect x="640" y="360" width="140" height="58" rx="8" fill="#b6ddcf" stroke="#47769a" stroke-width="2"/><text x="648" y="396" font-size="22" fill="#18324d" font-weight="400">B</text><rect x="815" y="360" width="140" height="58" rx="8" fill="#f9dc9a" stroke="#47769a" stroke-width="2"/><text x="823" y="396" font-size="22" fill="#18324d" font-weight="400">C</text><text x="215" y="485" font-size="20" fill="#18324d" font-weight="400">0ms</text><text x="390" y="485" font-size="20" fill="#18324d" font-weight="400">5ms</text><text x="565" y="485" font-size="20" fill="#18324d" font-weight="400">10ms</text><text x="740" y="485" font-size="20" fill="#18324d" font-weight="400">15ms</text><text x="915" y="485" font-size="20" fill="#18324d" font-weight="400">20ms</text><text x="85" y="540" font-size="25" fill="#18324d" font-weight="400">首批 A：2 + 5 + 4 = 11 ms；稳态节拍由 5 ms 的阶段二限制</text><text x="85" y="580" font-size="23" fill="#18324d" font-weight="400">图示允许缓冲、阶段独占；10 批理想总时长为 11 + 9 × 5 = 56 ms</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
