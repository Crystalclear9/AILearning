<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">复制梯度与分片梯度的范数</title><desc id="desc">全局范数必须对唯一参数坐标计数。复制布局中每张卡已有完整梯度，再跨卡求和会重复计数；分片布局则需要归约各自独占坐标的平方和。 图中只解释数值归约，不代表已运行多设备训练。真实系统还要核对梯度是否已经平均、哪些并行组拥有副本，以及混合精度是否已经解除缩放。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><rect width="1200" height="640" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">复制梯度与分片梯度的范数</text><text x="100" y="140" font-size="26" fill="#18324d" font-weight="400">复制：两个设备持有同一梯度</text><rect x="150" y="180" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="170" y="216" font-size="22" fill="#18324d" font-weight="400">3</text><rect x="220" y="180" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="240" y="216" font-size="22" fill="#18324d" font-weight="400">4</text><rect x="500" y="180" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="520" y="216" font-size="22" fill="#18324d" font-weight="400">3</text><rect x="570" y="180" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="590" y="216" font-size="22" fill="#18324d" font-weight="400">4</text><text x="110" y="290" font-size="26" fill="#18324d" font-weight="400">只计一次：3² + 4² = 25，范数为 5</text><path d="M80 335 L1110 335" fill="none" stroke="#ccd8e2" stroke-width="3" /><text x="100" y="395" font-size="26" fill="#18324d" font-weight="400">分片：每个设备只持有不同坐标</text><rect x="150" y="430" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="170" y="466" font-size="22" fill="#18324d" font-weight="400">3</text><rect x="500" y="430" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="520" y="466" font-size="22" fill="#18324d" font-weight="400">4</text><path d="M235 460 L800 475" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#tip-c9773e)" /><path d="M585 460 L800 475" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#tip-c9773e)" /><rect x="820" y="425" width="260" height="95" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2" /><text x="845" y="465" font-size="24" fill="#18324d" font-weight="400">归约：9 + 16</text><text x="845" y="502" font-size="23" fill="#18324d" font-weight="400">开方：5</text><text x="100" y="580" font-size="24" fill="#18324d" font-weight="400">复制副本再次求和会重复计数；分片需要合并各坐标的平方和</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
