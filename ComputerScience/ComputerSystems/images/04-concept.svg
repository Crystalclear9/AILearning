<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">复制梯度与分片梯度的范数</title><desc id="plateDesc">B 对完整参数向量计算平方和与裁剪系数。C 若两个设备各自已有完整副本，却把两份平方和再次相加，就错误得到根号五十；以此裁剪会比目标更强。图讨论的是参数坐标的布局与计数，不替代通信库的梯度平均约定。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">复制梯度与分片梯度的范数</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">ComputerSystems</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">梯度副本与参数分片不能混为一谈</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">分片的平方和必须完整归约</text><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">参数梯度：g=(3,4)</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">分片平方和：9+16=25；范数 5</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400">裁剪阈值 1 → 正确梯度 (0.6,0.8)</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">副本重复计数会过度裁剪</text><path d="M866,1085 L1381,1085" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">0</text><path d="M866,1043.25 L1381,1043.25" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1049.25" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">2</text><path d="M866,1001.5 L1381,1001.5" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="1007.5" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">4</text><path d="M866,959.75 L1381,959.75" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="965.75" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">6</text><path d="M866,918 L1381,918" fill="none" stroke="#dde7ed" stroke-width="2"/><text x="856" y="924" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400">8</text><rect x="951.75" y="980.625" width="86" height="104.375" rx="3" fill="#168a83" stroke="#168a83"/><text x="994.75" y="970.625" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">5</text><text x="869" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">正确范数</text><rect x="1209.25" y="937.391" width="86" height="147.609" rx="3" fill="#d17c3e" stroke="#d17c3e"/><text x="1252.25" y="927.391" font-size="24" fill="#19354a" text-anchor="middle" font-weight="400">7.071</text><text x="1126.5" y="1113" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">把两个副本重复相加</text><text x="806" y="1153" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">同一参数向量的范数估计</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">复制梯度与分片梯度的范数</title><desc id="panelA-desc">全局范数必须对唯一参数坐标计数。复制布局中每张卡已有完整梯度，再跨卡求和会重复计数；分片布局则需要归约各自独占坐标的平方和。 图中只解释数值归约，不代表已运行多设备训练。真实系统还要核对梯度是否已经平均、哪些并行组拥有副本，以及混合精度是否已经解除缩放。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">复制梯度与分片梯度的范数</text><text x="100" y="140" font-size="26" fill="#18324d" font-weight="400">复制：两个设备持有同一梯度</text><rect x="150" y="180" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="170" y="216" font-size="22" fill="#18324d" font-weight="400">3</text><rect x="220" y="180" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="240" y="216" font-size="22" fill="#18324d" font-weight="400">4</text><rect x="500" y="180" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="520" y="216" font-size="22" fill="#18324d" font-weight="400">3</text><rect x="570" y="180" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="590" y="216" font-size="22" fill="#18324d" font-weight="400">4</text><text x="110" y="290" font-size="26" fill="#18324d" font-weight="400">只计一次：3² + 4² = 25，范数为 5</text><path d="M80 335 L1110 335" fill="none" stroke="#ccd8e2" stroke-width="3" /><text x="100" y="395" font-size="26" fill="#18324d" font-weight="400">分片：每个设备只持有不同坐标</text><rect x="150" y="430" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="170" y="466" font-size="22" fill="#18324d" font-weight="400">3</text><rect x="500" y="430" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="520" y="466" font-size="22" fill="#18324d" font-weight="400">4</text><path d="M235 460 L800 475" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M585 460 L800 475" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><rect x="820" y="425" width="260" height="95" rx="8" fill="#e2f2e9" stroke="#47769a" stroke-width="2" /><text x="845" y="465" font-size="24" fill="#18324d" font-weight="400">归约：9 + 16</text><text x="845" y="502" font-size="23" fill="#18324d" font-weight="400">开方：5</text><text x="100" y="580" font-size="24" fill="#18324d" font-weight="400">复制副本再次求和会重复计数；分片需要合并各坐标的平方和</text></g></svg></svg>
