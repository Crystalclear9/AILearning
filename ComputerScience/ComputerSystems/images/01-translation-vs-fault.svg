<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="566.48" viewBox="-18.24 28.76 996.48 566.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">同一进程三次访问的地址翻译、驻留与数据缓存区别</title><desc id="artwork-desc">翻译未命中、页面不驻留、数据未命中：三个不同事件 第二行只是补做地址翻译，未发生缺页；第三行需由系统处理，不能预先给出有效物理地址。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="479.160274"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="566.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="530" viewBox="0 47 960 530" overflow="hidden"><rect width="960" height="577" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(14.845252 35.353182) scale(0.732296)"><g><rect width="1242.667" height="654.326" fill="#ffffff" x="13.867" y="55.506"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#243a4c"><text x="50" y="103" font-size="33.54px" fill="#243a4c" text-anchor="start">固定同一进程；教学页大小 16 B；当前 TLB 仅缓存“页 1 → 帧 2”</text><text x="50" y="174" font-size="36.187555px" fill="#243a4c" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">虚拟地址</text><text x="300" y="174" font-size="36.187555px" fill="#243a4c" text-anchor="start">TLB 查询</text><text x="600" y="174" font-size="36.187555px" fill="#243a4c" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">页表状态</text><text x="960" y="174" font-size="36.187555px" fill="#243a4c" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">翻译结果</text><rect x="40" y="200" width="1190" height="90" fill="#f0f6fa"/><text x="50" y="250" font-size="31.32px" fill="#2678a3" text-anchor="start">0x13 = 页 1 + 3</text><text x="300" y="250" font-size="34.83px" fill="#2678a3" text-anchor="start">命中：1 → 2</text><text x="600" y="250" font-size="34.83px" fill="#2678a3" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">无需本次页表遍历</text><text x="960" y="250" font-size="34.83px" fill="#2678a3" text-anchor="start">0x23</text><rect x="40" y="310" width="1190" height="90" fill="#f0f7f6"/><text x="50" y="360" font-size="31.32px" fill="#1b6d7c" text-anchor="start">0x32 = 页 3 + 2</text><text x="300" y="360" font-size="34.83px" fill="#1b6d7c" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未命中</text><text x="600" y="360" font-size="34.83px" fill="#1b6d7c" text-anchor="start">页 3 驻留于帧 5</text><text x="960" y="360" font-size="34.83px" fill="#1b6d7c" text-anchor="start">0x52</text><rect x="40" y="420" width="1190" height="90" fill="#faf3ee"/><text x="50" y="470" font-size="31.32px" fill="#a85827" text-anchor="start">0x23 = 页 2 + 3</text><text x="300" y="470" font-size="34.83px" fill="#a85827" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未命中</text><text x="600" y="470" font-size="34.83px" fill="#a85827" text-anchor="start">页 2 暂不驻留</text><text x="960" y="470" font-size="34.83px" fill="#a85827" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">转入缺页处理</text><text x="50" y="583" font-size="36.12px" fill="#243a4c" text-anchor="start">前两次翻译得到物理地址后，还需访问数据缓存 / 下层存储。</text><text x="50" y="637" font-size="36.12px" fill="#2678a3" text-anchor="start">TLB 命中只说明翻译已缓存，不能推出数据本身也命中缓存。</text><line stroke="#dde5eb" stroke-width="2" x1="50" y1="682" x2="1230" y2="682"/></g><desc> 翻译未命中、页面不驻留、数据未命中：三个不同事件 第二行只是补做地址翻译，未发生缺页；第三行需由系统处理，不能预先给出有效物理地址。</desc></g></g></g></svg></svg>