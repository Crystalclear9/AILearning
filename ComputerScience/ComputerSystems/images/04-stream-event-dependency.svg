<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="564.48" viewBox="-18.24 28.76 996.48 564.48" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">异步提交之后，依赖仍要明确建立</title><desc id="artwork-desc">事件等待建立传输后计算的执行依赖；设备输入存储还必须活过消费阶段。流间等待与缓存分配器存储复用管理不是同一种保证。 跨流依赖：数据就绪与存储存活是两件事 事件等待不会自动管理所有缓冲的生命周期。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="477.363718"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="564.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="528" viewBox="0 47 960 528" overflow="hidden"><rect width="960" height="575" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(11.988382 23.95353) scale(0.813226)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf1ec"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">跨流依赖：数据就绪与存储存活是两件事</title><desc id="figure-desc">事件等待建立传输后计算的执行依赖；设备输入存储还必须活过消费阶段。流间等待与缓存分配器存储复用管理不是同一种保证。 跨流依赖：数据就绪与存储存活是两件事 事件等待不会自动管理所有缓冲的生命周期。</desc><rect width="1119.0" height="587.0" fill="#ffffff" x="16.0" y="64.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2e77a6"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b96f41"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="32.586264px" fill="#233a4b" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">等待保证数据已就绪；存储存活还需另行保证</text><line x1="280" y1="150" x2="280" y2="475" stroke="#dde5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="280" y="145" font-size="29.75px" fill="#4f7791" text-anchor="middle" font-weight="400">0</text><line x1="445" y1="150" x2="445" y2="475" stroke="#dde5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="445" y="145" font-size="29.75px" fill="#4f7791" text-anchor="middle" font-weight="400">1</text><line x1="610" y1="150" x2="610" y2="475" stroke="#dde5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="610" y="145" font-size="29.75px" fill="#4f7791" text-anchor="middle" font-weight="400">2</text><line x1="775" y1="150" x2="775" y2="475" stroke="#dde5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="775" y="145" font-size="29.75px" fill="#4f7791" text-anchor="middle" font-weight="400">3</text><line x1="940" y1="150" x2="940" y2="475" stroke="#dde5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="940" y="145" font-size="29.75px" fill="#4f7791" text-anchor="middle" font-weight="400">4</text><line x1="1105" y1="150" x2="1105" y2="475" stroke="#dde5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="1105" y="145" font-size="29.75px" fill="#4f7791" text-anchor="middle" font-weight="400">5</text><text x="40" y="230" font-size="32.586264px" fill="#233a4b" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">传输流</text><rect x="280" y="185" width="330" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#227199" stroke-width="1.5"/><text x="445.0" y="229.8" font-size="32.586264px" fill="#2e77a6" text-anchor="middle" font-weight="400">H2D 复制</text><text x="40" y="355" font-size="32.586264px" fill="#233a4b" text-anchor="start" font-weight="400">计算流 C</text><rect x="610" y="310" width="495" height="70" rx="6" fill="url(#book-wash-fff0e3)" stroke="#ad6134" stroke-width="1.5"/><text x="857.5" y="354.8" font-size="32.586264px" fill="#9f6038" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">使用输入，执行计算</text><line fill="none" stroke="#ad6134" stroke-width="2.8" marker-end="url(#arrow-orange)" x1="610" y1="265" x2="610" y2="300"/><text x="635" y="290" font-size="32.586264px" fill="#9f6038" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">等待复制完成事件</text><text x="40" y="455" font-size="32.586264px" fill="#233a4b" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">设备输入存储</text><rect x="280" y="420" width="825" height="55" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#227199" stroke-width="1.5"/><text x="690" y="458" font-size="32.586264px" fill="#2e77a6" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">覆盖复制与消费的存活期</text><text x="40" y="560" font-size="32.586264px" fill="#9f6038" text-anchor="start" font-weight="400">wait_event / wait_stream：建立执行先后</text><text x="40" y="620" font-size="32.586264px" fill="#2e77a6" text-anchor="start" font-weight="400">record_stream(C) 或显式管理：避免分配器过早复用存储</text></g></g></g></g></svg></svg>