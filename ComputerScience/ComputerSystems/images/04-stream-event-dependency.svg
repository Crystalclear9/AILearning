<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="575" viewBox="0 0 960 575" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">异步提交之后，依赖仍要明确建立</title><desc id="artwork-desc">事件等待建立传输后计算的执行依赖；设备输入存储还必须活过消费阶段。流间等待与缓存分配器存储复用管理不是同一种保证。 跨流依赖：数据就绪与存储存活是两件事 事件等待不会自动管理所有缓冲的生命周期。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="477.363718"/></clipPath></defs><rect width="960" height="575" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">异步提交之后，依赖仍要明确建立</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(11.988382 23.95353) scale(0.813226)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">跨流依赖：数据就绪与存储存活是两件事</title><desc id="figure-desc">事件等待建立传输后计算的执行依赖；设备输入存储还必须活过消费阶段。流间等待与缓存分配器存储复用管理不是同一种保证。 跨流依赖：数据就绪与存储存活是两件事 事件等待不会自动管理所有缓冲的生命周期。</desc><rect width="1119.0" height="587.0" fill="white" x="16.0" y="64.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="32.586264px" fill="#1f3449" text-anchor="start" font-weight="400">等待保证数据已就绪；存储存活还需另行保证</text><line x1="280" y1="150" x2="280" y2="475" stroke="#d9e1e8" stroke-width="1" stroke-dasharray="4 5"/><text x="280" y="145" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">0</text><line x1="445" y1="150" x2="445" y2="475" stroke="#d9e1e8" stroke-width="1" stroke-dasharray="4 5"/><text x="445" y="145" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">1</text><line x1="610" y1="150" x2="610" y2="475" stroke="#d9e1e8" stroke-width="1" stroke-dasharray="4 5"/><text x="610" y="145" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">2</text><line x1="775" y1="150" x2="775" y2="475" stroke="#d9e1e8" stroke-width="1" stroke-dasharray="4 5"/><text x="775" y="145" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">3</text><line x1="940" y1="150" x2="940" y2="475" stroke="#d9e1e8" stroke-width="1" stroke-dasharray="4 5"/><text x="940" y="145" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">4</text><line x1="1105" y1="150" x2="1105" y2="475" stroke="#d9e1e8" stroke-width="1" stroke-dasharray="4 5"/><text x="1105" y="145" font-size="29.75px" fill="#4d7595" text-anchor="middle" font-weight="400">5</text><text x="40" y="230" font-size="32.586264px" fill="#1f3449" text-anchor="start" font-weight="400">传输流</text><rect x="280" y="185" width="330" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="445.0" y="229.8" font-size="32.586264px" fill="#2472b1" text-anchor="middle" font-weight="400">H2D 复制</text><text x="40" y="355" font-size="32.586264px" fill="#1f3449" text-anchor="start" font-weight="400">计算流 C</text><rect x="610" y="310" width="495" height="70" rx="6" fill="url(#book-wash-fff0e3)" stroke="#b9642b" stroke-width="1.5"/><text x="857.5" y="354.8" font-size="32.586264px" fill="#a86331" text-anchor="middle" font-weight="400">使用输入，执行计算</text><line fill="none" stroke="#b9642b" stroke-width="2.8" marker-end="url(#arrow-orange)" x1="610" y1="265" x2="610" y2="300"/><text x="635" y="290" font-size="32.586264px" fill="#a86331" text-anchor="start" font-weight="400">等待复制完成事件</text><text x="40" y="455" font-size="32.586264px" fill="#1f3449" text-anchor="start" font-weight="400">设备输入存储</text><rect x="280" y="420" width="825" height="55" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="690" y="458" font-size="32.586264px" fill="#2472b1" text-anchor="middle" font-weight="400">覆盖复制与消费的存活期</text><text x="40" y="560" font-size="32.586264px" fill="#a86331" text-anchor="start" font-weight="400">wait_event / wait_stream：建立执行先后</text><text x="40" y="620" font-size="32.586264px" fill="#2472b1" text-anchor="start" font-weight="400">record_stream(C) 或显式管理：避免分配器过早复用存储</text></g></g></g></g></svg>