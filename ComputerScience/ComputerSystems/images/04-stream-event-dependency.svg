<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="635" viewBox="0 0 1200 635" role="img"><title id="figure-title">异步提交之后，依赖仍要明确建立</title><desc id="figure-desc">横轴是同一组示意时间单位：传输流在 0 到 2 复制本批输入，计算流先等待这次复制完成的事件，再于 2 到 5 使用输入。同流顺序与跨流事件不能混为一谈，发起调用的主机返回也不代表设备工作完成。此图只展示一批数据的依赖；要让其他批次的传输与计算重叠，还需独立资源、合适的缓冲与生命周期安排，图中的耗时不是设备性能实测。</desc><rect width="1200" height="635" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">异步提交之后，依赖仍要明确建立</text><text x="40" y="110" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">不同流之间：用事件建立复制 → 计算的依赖</text><line x1="245" y1="155" x2="245" y2="505" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="245" y="140" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="415" y1="155" x2="415" y2="505" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="415" y="140" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">1</text><line x1="585" y1="155" x2="585" y2="505" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="585" y="140" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">2</text><line x1="755" y1="155" x2="755" y2="505" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="755" y="140" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">3</text><line x1="925" y1="155" x2="925" y2="505" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="925" y="140" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">4</text><line x1="1095" y1="155" x2="1095" y2="505" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="1095" y="140" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">5</text><text x="35" y="230" font-size="28" fill="#213447" text-anchor="start" font-weight="400">传输流</text><rect x="245" y="185" width="340" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="415" y="235" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">H2D 复制</text><text x="35" y="395" font-size="28" fill="#213447" text-anchor="start" font-weight="400">计算流</text><rect x="585" y="350" width="510" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="840.0" y="400" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">读取设备输入并计算</text><circle cx="585" cy="280" r="11" fill="#2865a0" /><path d="M585 295 L585 335" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="650" y="300" font-size="27" fill="#c87536" text-anchor="start" font-weight="400">复制完成事件 → 计算流等待</text><text x="35" y="565" font-size="28" fill="#213447" text-anchor="start" font-weight="400">主机提交结束，不能替代设备完成；末端测量仍需等待完成。</text></g></svg>
