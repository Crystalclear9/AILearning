<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img"><title>虚拟地址通过页表映射到物理帧</title><rect width="1280" height="680" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">虚拟地址通过页表映射到物理帧</text><text x="40" y="110" font-size="28" fill="#233943" text-anchor="start">每页 16 字节：页号参与查表，页内偏移保持不变</text><text x="45" y="215" font-size="28" fill="#276884" text-anchor="start">甲：0x13</text><rect x="230" y="180" width="115" height="64" fill="#f0f5f7" stroke="#276884" stroke-width="2"/><text x="287" y="222" font-size="28" fill="#276884" text-anchor="middle">页 1</text><rect x="345" y="180" width="130" height="64" fill="#faf9f4" stroke="#276884" stroke-width="2"/><text x="410" y="222" font-size="28" fill="#276884" text-anchor="middle">偏移 3</text><line x1="490" y1="212" x2="665" y2="212" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="665,212 653.9472680719654,216.6730201077038 653.9472680719654,207.3269798922962" fill="#276884"/><text x="577" y="165" font-size="26" fill="#276884" text-anchor="middle">页表 1 → 2</text><rect x="685" y="180" width="115" height="64" fill="#f0f5f7" stroke="#276884" stroke-width="2"/><text x="742" y="222" font-size="28" fill="#276884" text-anchor="middle">帧 2</text><rect x="800" y="180" width="130" height="64" fill="#faf9f4" stroke="#276884" stroke-width="2"/><text x="865" y="222" font-size="28" fill="#276884" text-anchor="middle">偏移 3</text><text x="960" y="220" font-size="30" fill="#276884" text-anchor="start">= 0x23</text><text x="45" y="365" font-size="28" fill="#b25d2b" text-anchor="start">乙：0x03</text><rect x="230" y="330" width="115" height="64" fill="#f0f5f7" stroke="#b25d2b" stroke-width="2"/><text x="287" y="372" font-size="28" fill="#b25d2b" text-anchor="middle">页 0</text><rect x="345" y="330" width="130" height="64" fill="#faf9f4" stroke="#b25d2b" stroke-width="2"/><text x="410" y="372" font-size="28" fill="#b25d2b" text-anchor="middle">偏移 3</text><line x1="490" y1="362" x2="665" y2="362" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray=""/><polygon points="665,362 653.9472680719654,366.6730201077038 653.9472680719654,357.3269798922962" fill="#b25d2b"/><text x="577" y="315" font-size="26" fill="#b25d2b" text-anchor="middle">页表 0 → 2</text><rect x="685" y="330" width="115" height="64" fill="#f0f5f7" stroke="#b25d2b" stroke-width="2"/><text x="742" y="372" font-size="28" fill="#b25d2b" text-anchor="middle">帧 2</text><rect x="800" y="330" width="130" height="64" fill="#faf9f4" stroke="#b25d2b" stroke-width="2"/><text x="865" y="372" font-size="28" fill="#b25d2b" text-anchor="middle">偏移 3</text><text x="960" y="370" font-size="30" fill="#b25d2b" text-anchor="start">= 0x23</text><text x="45" y="515" font-size="28" fill="#697d87" text-anchor="start">甲：0x03</text><rect x="230" y="480" width="115" height="64" fill="#f0f5f7" stroke="#697d87" stroke-width="2"/><text x="287" y="522" font-size="28" fill="#697d87" text-anchor="middle">页 0</text><rect x="345" y="480" width="130" height="64" fill="#faf9f4" stroke="#697d87" stroke-width="2"/><text x="410" y="522" font-size="28" fill="#697d87" text-anchor="middle">偏移 3</text><line x1="490" y1="512" x2="665" y2="512" stroke="#697d87" stroke-width="2.5" stroke-dasharray=""/><polygon points="665,512 653.9472680719654,516.6730201077038 653.9472680719654,507.3269798922962" fill="#697d87"/><text x="577" y="465" font-size="26" fill="#697d87" text-anchor="middle">页表 0 → 7</text><rect x="685" y="480" width="115" height="64" fill="#f0f5f7" stroke="#697d87" stroke-width="2"/><text x="742" y="522" font-size="28" fill="#697d87" text-anchor="middle">帧 7</text><rect x="800" y="480" width="130" height="64" fill="#faf9f4" stroke="#697d87" stroke-width="2"/><text x="865" y="522" font-size="28" fill="#697d87" text-anchor="middle">偏移 3</text><text x="960" y="520" font-size="30" fill="#697d87" text-anchor="start">= 0x73</text><text x="685" y="290" font-size="26" fill="#276884" text-anchor="start">2 × 16 + 3 = 35：同一物理字节</text><text x="685" y="590" font-size="26" fill="#697d87" text-anchor="start">7 × 16 + 3 = 115：不同物理字节</text><text x="40" y="645" font-size="26" fill="#233943" text-anchor="start">相同虚拟地址未必对应相同物理地址；不同虚拟地址也可能共享</text></g></svg>
