<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">缓存命中不等于命中了正确的数据版本</title><desc id="desc">若缓存键只有路径字符串，文件在原路径更新后仍可能命中旧结果。此时命中率很高，却没有正确反映输入版本；缓存正确性要求键和失效规则覆盖会影响结果的依赖。 图中的错误来自刻意缺失版本条件。可采用内容摘要、可信版本号或受约束的失效协议，但还要考虑配置、代码和外部表变化；只检查修改时间也有适用边界。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="#f2f6fb" stroke="#f2f6fb" rx="0" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" /><text x="67" y="70" font-size="29" fill="#20384f" text-anchor="start" font-weight="700">缓存命中不等于命中了正确的数据版本</text><text x="67" y="111" font-size="18" fill="#5c7185" text-anchor="start" font-weight="400">明确对象、计算关系与适用条件，避免只凭外观判断。</text><path d="M335,235 L450,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M735,235 L850,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M273.981,450 L511.019,290" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><path d="M992.5,290 L992.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" /><rect x="50" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="192.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">旧输入版本 v1</text><rect x="450" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="592.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">缓存键只含路径</text><rect x="850" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="992.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">缓存结果 f(v1)</text><rect x="50" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" /><text x="192.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">同路径更新为 v2</text><rect x="850" y="450" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" /><text x="992.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">错误复用旧结果</text><text x="60" y="695" font-size="17" fill="#5c7185" text-anchor="start" font-weight="400">条件与计算见相邻正文。</text></g></svg>
