<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="920.48" viewBox="-18.24 28.76 996.48 920.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">负权边使已定型的最短距离失效</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="833.098681"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="920.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="884" viewBox="0 47 960 884" overflow="hidden"><rect width="960" height="931" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>负边破坏的是“出队即可定型”，而不只是距离计算</title><svg width="1440" height="868.31" viewBox="25.000 63.750 1420.000 856.250"><title>负边破坏的是“出队即可定型”，而不只是距离计算</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#74909d"/></marker></defs><rect width="1420.0" height="856.25" fill="#ffffff" x="25.0" y="63.75"/><g font-family="Microsoft YaHei, sans-serif" fill="#23394a"><text x="55" y="117" font-size="28" fill="#475b6c" text-anchor="start">有向边 s→a 为 2，s→b 为 5，b→a 为 −10；无负环</text><line fill="none" stroke="#1f6e93" stroke-width="3" marker-end="url(#a)" x1="302" y1="331" x2="848" y2="239"/><text x="605.0" y="265.0" font-size="32" fill="#2a76a0" text-anchor="start">2</text><line fill="none" stroke="#1f6e93" stroke-width="3" marker-end="url(#a)" x1="302" y1="353" x2="848" y2="487"/><text x="605.0" y="400.0" font-size="32" fill="#2a76a0" text-anchor="start">5</text><line fill="none" stroke="#a85c31" stroke-width="3" marker-end="url(#a)" x1="900" y1="467" x2="900" y2="263"/><text x="930.0" y="345.0" font-size="32" fill="#a05e37" text-anchor="start">-10</text><rect x="198" y="307" width="104" height="66" fill="url(#book-wash-edf4f9)" stroke="#1f6e93" stroke-width="2"/><text x="250" y="351" font-size="32" fill="#23394a" text-anchor="middle">s</text><rect x="848" y="197" width="104" height="66" fill="url(#book-wash-edf4f9)" stroke="#1f6e93" stroke-width="2"/><text x="900" y="241" font-size="32" fill="#23394a" text-anchor="middle">a</text><rect x="848" y="467" width="104" height="66" fill="url(#book-wash-edf4f9)" stroke="#1f6e93" stroke-width="2"/><text x="900" y="511" font-size="32" fill="#23394a" text-anchor="middle">b</text><text x="55" y="610" font-size="32" fill="#23394a" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">按最小暂定距离弹出</text><text x="600" y="610" font-size="32" fill="#23394a" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">新信息</text><text x="1150" y="610" font-size="32" fill="#23394a" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">已定型</text><rect x="55" y="647" width="1360" height="73" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="75" y="690" font-size="30" fill="#23394a" text-anchor="start">s，距离 0</text><text x="600" y="690" font-size="30" fill="#23394a" text-anchor="start">a←2，b←5</text><text x="1150" y="690" font-size="30" fill="#23394a" text-anchor="start">s</text><rect x="55" y="732" width="1360" height="73" fill="#ffffff" stroke="none" stroke-width="2"/><text x="75" y="775" font-size="30" fill="#23394a" text-anchor="start">a，距离 2</text><text x="600" y="775" font-size="30" fill="#23394a" text-anchor="start">a 被当成最终答案</text><text x="1150" y="775" font-size="30" fill="#23394a" text-anchor="start">s,a</text><rect x="55" y="817" width="1360" height="73" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="75" y="860" font-size="30" fill="#23394a" text-anchor="start">b，距离 5</text><text x="600" y="860" font-size="30" fill="#a05e37" text-anchor="start">经 b 到 a 为 5−10=−5</text><text x="1150" y="860" font-size="30" fill="#23394a" text-anchor="start">s,a,b</text></g><desc> 负边破坏的是“出队即可定型”，而不只是距离计算 若禁止改写已定型 a，就漏掉 −5；允许重新打开顶点，则已经放弃一次定型的证明。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 868.31) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start">同步松弛轮次：第 k 轮只使用至多 k 条边的路径信息</text><rect x="65" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="271.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">轮0：s=0</text><rect x="485" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="691.0" y="184" font-size="41.4993px" fill="#277290" text-anchor="middle">a=∞</text><rect x="905" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1111.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">b=∞</text><rect x="65" y="245" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="271.0" y="284" font-size="36.12px" fill="#277290" text-anchor="middle">轮1：s=0</text><rect x="485" y="245" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="691.0" y="284" font-size="36.12px" fill="#277290" text-anchor="middle">a=2</text><rect x="905" y="245" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1111.0" y="284" font-size="36.12px" fill="#277290" text-anchor="middle">b=5</text><rect x="65" y="345" width="412" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="271.0" y="384" font-size="36.12px" fill="#a55f3a" text-anchor="middle">轮2：s=0</text><rect x="485" y="345" width="412" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="691.0" y="384" font-size="36.12px" fill="#a55f3a" text-anchor="middle">a=−5</text><rect x="905" y="345" width="412" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="1111.0" y="384" font-size="36.12px" fill="#a55f3a" text-anchor="middle">b=5</text><text x="65" y="442" font-size="34.83px" fill="#213747" text-anchor="start">第二轮用旧 b=5 经边 −10 改进 a；过早把 a=2 定型才是失败原因。</text></g></g></g></g></g></svg></svg>