<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">零一背包倒序保留旧状态</title><desc id="plateDesc">B 把正确倒序的依赖值标为旧值，C 把正序使用的值标为本轮新值。这样能从读写关系理解零一限制，而不是只背诵循环应从大到小；若任务本身是完全背包，允许重复选取时应采用对应的状态与更新证明。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">零一背包倒序保留旧状态</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">零一背包更新必须保留旧轮依赖</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">倒序只让同一件贡献一次</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">正序会重复使用刚更新的值</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">零一背包倒序保留旧状态</title><desc id="panelA-desc">一维表复用两层状态，循环方向决定读取的是旧层还是刚更新的新层。正序在容量六处可能再次使用同一物品，从而把零一背包误写成允许重复使用的目标。 倒序正确性来自状态依赖，而不是背口诀。若任务改成完全背包，正序可能正是需要的政策；还要分别定义恰好装满与不超过容量的初始化。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-47769a" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#47769a" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">零一背包倒序保留旧状态</text><text x="65" y="130" font-size="26" fill="#18324d" font-weight="400">仅一件物品：重量 3、价值 5；背包容量 6</text><text x="65" y="210" font-size="25" fill="#18324d" font-weight="400">正序更新：</text><rect x="275" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="295" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="345" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="365" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="415" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="435" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="485" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="505" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="555" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="575" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="625" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="645" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="695" y="170" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="715" y="206" font-size="22" fill="#18324d" font-weight="400">10</text><text x="290" y="275" font-size="24" fill="#b14b30" font-weight="400">新 f[3]=5 又被 f[6] 使用 → 同一件被选两次</text><text x="65" y="380" font-size="25" fill="#18324d" font-weight="400">倒序更新：</text><rect x="275" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="295" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="345" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="365" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="415" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="435" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="485" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="505" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="555" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="575" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="625" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="645" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="695" y="340" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="715" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><text x="290" y="445" font-size="24" fill="#18324d" font-weight="400">计算 f[6] 时，f[3] 仍为旧值 0 → 只选一次</text><path d="M755 495 L305 495" fill="none" stroke="#47769a" stroke-width="3" marker-end="url(#panelA-tip-47769a)" /><text x="230" y="565" font-size="23" fill="#18324d" font-weight="400">零一背包的容量循环从大到小；图中表示“不超过容量”的最大价值</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">容量 6 先更新</text><rect x="281" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="381.25" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 938.5) scale(0.7272727273 1) translate(-381.25 -938.5)">旧 f[3]=0</text><rect x="488.5" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="588.75" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 938.5) scale(0.7272727273 1) translate(-588.75 -938.5)">得到 5</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">之后更新容量 3</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1008.5) scale(0.7272727273 1) translate(-485 -1008.5)">得到 5</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">最终 f[6]</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1078.5) scale(0.7272727273 1) translate(-485 -1078.5)">5</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">仅有一件重量 3、价值 5 的物品</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">先算容量 3</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 938.5) scale(0.7272727273 1) translate(-1195 -938.5)">新 f[3]=5</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 994) scale(0.7272727273 1) translate(-806 -994)">再算容量 6</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1008.5) scale(0.7272727273 1) translate(-1195 -1008.5)">5+5=10</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1064) scale(0.7272727273 1) translate(-806 -1064)">错误含义</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1078.5) scale(0.7272727273 1) translate(-1195 -1078.5)">同一件用了两次</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">容量递推顺序改变了物品使用次数</text></g></svg>
