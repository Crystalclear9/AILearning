<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">零一背包倒序保留旧状态</title><desc id="plateDesc">B 把正确倒序的依赖值标为旧值，C 把正序使用的值标为本轮新值。这样能从读写关系理解零一限制，而不是只背诵循环应从大到小；若任务本身是完全背包，允许重复选取时应采用对应的状态与更新证明。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">零一背包倒序保留旧状态</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">DataStructuresAndAlgorithms</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">零一背包更新必须保留旧轮依赖</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">倒序只让同一件贡献一次</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">容量 6 先更新</text><rect x="281" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="381.25" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">旧 f[3]=0</text><rect x="488.5" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="588.75" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">得到 5</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">之后更新容量 3</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">得到 5</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">最终 f[6]</text><rect x="281" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="485" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">5</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">仅有一件重量 3、价值 5 的物品</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">正序会重复使用刚更新的值</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">先算容量 3</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">新 f[3]=5</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">再算容量 6</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">5+5=10</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">错误含义</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">同一件用了两次</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">容量递推顺序改变了物品使用次数</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">零一背包倒序保留旧状态</title><desc id="panelA-desc">一维表复用两层状态，循环方向决定读取的是旧层还是刚更新的新层。正序在容量六处可能再次使用同一物品，从而把零一背包误写成允许重复使用的目标。 倒序正确性来自状态依赖，而不是背口诀。若任务改成完全背包，正序可能正是需要的政策；还要分别定义恰好装满与不超过容量的初始化。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-47769a" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#47769a" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">零一背包倒序保留旧状态</text><text x="65" y="130" font-size="26" fill="#18324d" font-weight="400">仅一件物品：重量 3、价值 5；背包容量 6</text><text x="65" y="210" font-size="25" fill="#18324d" font-weight="400">正序更新：</text><rect x="275" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="295" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="345" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="365" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="415" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="435" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="485" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="505" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="555" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="575" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="625" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="645" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="695" y="170" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="715" y="206" font-size="22" fill="#18324d" font-weight="400">10</text><text x="290" y="275" font-size="24" fill="#b14b30" font-weight="400">新 f[3]=5 又被 f[6] 使用 → 同一件被选两次</text><text x="65" y="380" font-size="25" fill="#18324d" font-weight="400">倒序更新：</text><rect x="275" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="295" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="345" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="365" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="415" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="435" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="485" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="505" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="555" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="575" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="625" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="645" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="695" y="340" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="715" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><text x="290" y="445" font-size="24" fill="#18324d" font-weight="400">计算 f[6] 时，f[3] 仍为旧值 0 → 只选一次</text><path d="M755 495 L305 495" fill="none" stroke="#47769a" stroke-width="3" marker-end="url(#panelA-tip-47769a)" /><text x="230" y="565" font-size="23" fill="#18324d" font-weight="400">零一背包的容量循环从大到小；图中表示“不超过容量”的最大价值</text></g></svg></svg>
