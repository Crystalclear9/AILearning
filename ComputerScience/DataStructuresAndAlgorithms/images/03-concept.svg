<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">零一背包倒序保留旧状态</title><desc id="desc">一维表复用两层状态，循环方向决定读取的是旧层还是刚更新的新层。正序在容量六处可能再次使用同一物品，从而把零一背包误写成允许重复使用的目标。 倒序正确性来自状态依赖，而不是背口诀。若任务改成完全背包，正序可能正是需要的政策；还要分别定义恰好装满与不超过容量的初始化。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">零一背包倒序保留旧状态</text><text x="65" y="130" font-size="26" fill="#18324d" font-weight="400">仅一件物品：重量 3、价值 5；背包容量 6</text><text x="65" y="210" font-size="25" fill="#18324d" font-weight="400">正序更新：</text><rect x="275" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="295" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="345" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="365" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="415" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="435" y="206" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="485" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="505" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="555" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="575" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="625" y="170" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="645" y="206" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="695" y="170" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2"/><text x="715" y="206" font-size="22" fill="#18324d" font-weight="400">10</text><text x="290" y="275" font-size="24" fill="#b14b30" font-weight="400">新 f[3]=5 又被 f[6] 使用 → 同一件被选两次</text><text x="65" y="380" font-size="25" fill="#18324d" font-weight="400">倒序更新：</text><rect x="275" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="295" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="345" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="365" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="415" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="435" y="376" font-size="22" fill="#18324d" font-weight="400">0</text><rect x="485" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="505" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="555" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="575" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="625" y="340" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="645" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><rect x="695" y="340" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2"/><text x="715" y="376" font-size="22" fill="#18324d" font-weight="400">5</text><text x="290" y="445" font-size="24" fill="#18324d" font-weight="400">计算 f[6] 时，f[3] 仍为旧值 0 → 只选一次</text><path d="M755 495 L305 495" fill="none" stroke="#47769a" stroke-width="3" marker-end="url(#arrow)"/><text x="230" y="565" font-size="23" fill="#18324d" font-weight="400">零一背包的容量循环从大到小；图中表示“不超过容量”的最大价值</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
