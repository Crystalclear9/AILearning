<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="655.48" viewBox="-18.24 28.76 996.48 655.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">状态若丢失约束历史，后续动作就不确定</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="568.75"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="655.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="619" viewBox="0 47 960 619" overflow="hidden"><rect width="960" height="666" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>状态压缩之前，先看两个历史能否拥有同一条未来</title><rect width="1440" height="900" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif">
<text x="55" y="65" font-size="41.934066px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">状态压缩之前，先看两个历史能否拥有同一条未来</text>
<text x="60" y="130" font-size="37.41px" fill="#213747" text-anchor="start">三件物品：重量都为 2；价值 4、5、6；总容量 6；禁止相邻同选</text>
<text x="60" y="245" font-size="39.99px" fill="#277290" text-anchor="start">历史 A</text>
<circle cx="260" cy="237" r="36" fill="#1c6583" stroke="#1c6583" stroke-width="2"/>
<text x="260" y="248" font-size="34.51px" fill="#ffffff" text-anchor="middle">1</text>
<text x="260" y="305" font-size="34.83px" fill="#213747" text-anchor="middle">价值 4</text>
<circle cx="405" cy="237" r="36" fill="#ffffff" stroke="#76889b" stroke-width="2"/>
<text x="405" y="248" font-size="34.51px" fill="#213747" text-anchor="middle">2</text>
<text x="405" y="305" font-size="34.83px" fill="#213747" text-anchor="middle">价值 5</text>
<circle cx="550" cy="237" r="36" fill="#ffffff" stroke="#76889b" stroke-width="2"/>
<text x="550" y="248" font-size="34.51px" fill="#213747" text-anchor="middle">3</text>
<text x="550" y="305" font-size="34.83px" fill="#213747" text-anchor="middle">价值 6</text>
<text x="770" y="225" font-size="36.12px" fill="#213747" text-anchor="start">同为：i=3，剩余容量 c=4</text>
<text x="770" y="275" font-size="36.12px" fill="#277290" text-anchor="start">前一件是否已选 b=0</text>
<text x="60" y="425" font-size="39.99px" fill="#277290" text-anchor="start">历史 B</text>
<circle cx="260" cy="417" r="36" fill="#ffffff" stroke="#76889b" stroke-width="2"/>
<text x="260" y="428" font-size="34.51px" fill="#213747" text-anchor="middle">1</text>
<text x="260" y="485" font-size="34.83px" fill="#213747" text-anchor="middle">价值 4</text>
<circle cx="405" cy="417" r="36" fill="#1c6583" stroke="#1c6583" stroke-width="2"/>
<text x="405" y="428" font-size="34.51px" fill="#ffffff" text-anchor="middle">2</text>
<text x="405" y="485" font-size="34.83px" fill="#213747" text-anchor="middle">价值 5</text>
<circle cx="550" cy="417" r="36" fill="#ffffff" stroke="#76889b" stroke-width="2"/>
<text x="550" y="428" font-size="34.51px" fill="#213747" text-anchor="middle">3</text>
<text x="550" y="485" font-size="34.83px" fill="#213747" text-anchor="middle">价值 6</text>
<text x="770" y="405" font-size="36.12px" fill="#213747" text-anchor="start">同为：i=3，剩余容量 c=4</text>
<text x="770" y="455" font-size="36.12px" fill="#a55f3a" text-anchor="start">前一件是否已选 b=1</text>
<line x1="60" y1="535" x2="1380" y2="535" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/>
<text x="60" y="590" font-size="39.99px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">相同容量，两个不同的后续子问题</text>
<rect x="60" y="615" width="320" height="70" rx="3" fill="url(#book-wash-edf5f8)" stroke="#1c6583" stroke-dasharray=""/>
<text x="220" y="660" font-size="38.7px" fill="#277290" text-anchor="middle">G(3,4,0) = 6</text>
<line x1="395" y1="650" x2="590" y2="650" stroke="#1c6583" stroke-width="2.46" stroke-dasharray=""/>
<polyline fill="none" stroke="#1c6583" stroke-width="2.46" points="578.95,654.67 590,650 578.95,645.33"/>
<text x="615" y="658" font-size="37.41px" fill="#277290" text-anchor="start">可选第 3 件</text>
<text x="1030" y="658" font-size="38.7px" fill="#277290" text-anchor="start">4 + 6 = 10</text>
<rect x="60" y="725" width="320" height="70" rx="3" fill="url(#book-wash-fff1e7)" stroke="#ae5f34" stroke-dasharray=""/>
<text x="220" y="770" font-size="38.7px" fill="#a55f3a" text-anchor="middle">G(3,4,1) = 0</text>
<line x1="395" y1="760" x2="590" y2="760" stroke="#ae5f34" stroke-width="2.46" stroke-dasharray=""/>
<polyline fill="none" stroke="#ae5f34" stroke-width="2.46" points="578.95,764.67 590,760 578.95,755.33"/>
<text x="615" y="768" font-size="37.41px" fill="#a55f3a" text-anchor="start">第 3 件被约束禁止</text>
<text x="1030" y="768" font-size="38.7px" fill="#a55f3a" text-anchor="start">5 + 0 = 5</text>
<text x="60" y="865" font-size="36.12px" fill="#a55f3a" text-anchor="start">若把 A 的“未来收益 6”复用给 B，就会错误选择相邻的第 2、3 件。</text>
</g></g></g></g></svg></svg>