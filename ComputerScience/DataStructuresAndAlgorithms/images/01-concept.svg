<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">动态数组扩容的摊还成本</title><desc id="plateDesc">B 从容量一开始，按倍增策略累计追加与扩容复制，八次追加总计十五次工作。C 加一扩容对应连续复制旧数组，总工作在八项时达到三十六；曲线只计元素写入与搬移，实际时间还取决于分配器、元素表示与缓存。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">动态数组扩容的摊还成本</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">倍增扩容的复制发生在哪些时刻</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">八次追加的累计工作</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">加一扩容不再有相同摊还保证</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">动态数组扩容的摊还成本</title><desc id="panelA-desc">图中的大箭头表示少数昂贵搬迁，小规模追加并非每次都搬整个前缀。容量按固定倍数增长时，历次复制量形成几何级数，总量可由最终规模的常数倍控制。 摊还常数成本不表示每次追加都恒定耗时，也不表示任意增长政策都一样。若每次只增加固定容量，反复复制前缀可能形成平方级总工作。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">动态数组扩容的摊还成本</text><text x="80" y="125" font-size="25" fill="#18324d" font-weight="400">容量按 2 倍增长；黄色为新追加元素</text><rect x="90" y="160" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="110" y="196" font-size="22" fill="#18324d" font-weight="400">a</text><rect x="300" y="160" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="320" y="196" font-size="22" fill="#18324d" font-weight="400">a</text><rect x="370" y="160" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="390" y="196" font-size="22" fill="#18324d" font-weight="400">b</text><rect x="650" y="160" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="670" y="196" font-size="22" fill="#18324d" font-weight="400">a</text><rect x="720" y="160" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="740" y="196" font-size="22" fill="#18324d" font-weight="400">b</text><rect x="790" y="160" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="810" y="196" font-size="22" fill="#18324d" font-weight="400">c</text><rect x="860" y="160" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="880" y="196" font-size="22" fill="#18324d" font-weight="400">d</text><path d="M180 185 L285 185" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M455 185 L635 185" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="80" y="290" font-size="26" fill="#18324d" font-weight="400">扩容时搬移旧元素：1 + 2 + 4 + …</text><rect x="90" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="110" y="381" font-size="22" fill="#18324d" font-weight="400">a</text><rect x="160" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="180" y="381" font-size="22" fill="#18324d" font-weight="400">b</text><rect x="230" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="250" y="381" font-size="22" fill="#18324d" font-weight="400">c</text><rect x="300" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="320" y="381" font-size="22" fill="#18324d" font-weight="400">d</text><rect x="370" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="390" y="381" font-size="22" fill="#18324d" font-weight="400">e</text><rect x="440" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="460" y="381" font-size="22" fill="#18324d" font-weight="400">f</text><rect x="510" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2" /><text x="530" y="381" font-size="22" fill="#18324d" font-weight="400">g</text><rect x="580" y="345" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2" /><text x="600" y="381" font-size="22" fill="#18324d" font-weight="400">h</text><text x="90" y="455" font-size="25" fill="#18324d" font-weight="400">复制总量为几何级数；单次扩容昂贵，不代表每次追加都昂贵</text><text x="90" y="535" font-size="25" fill="#18324d" font-weight="400">固定倍增策略下，n 次追加的总搬移与写入工作是 O(n)</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="928" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 928) scale(0.7272727273 1) translate(-96 -928)">01</text><text x="138" y="928" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 928) scale(0.7272727273 1) translate(-138 -928)">追加写入：8 次</text><text x="96" y="1010" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1010) scale(0.7272727273 1) translate(-96 -1010)">02</text><text x="138" y="1010" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1010) scale(0.7272727273 1) translate(-138 -1010)">扩容复制：1+2+4=7 次</text><text x="96" y="1092" font-size="19" fill="#168a83" text-anchor="start" font-weight="700" transform="translate(96 1092) scale(0.7272727273 1) translate(-96 -1092)">03</text><text x="138" y="1092" font-size="23" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(138 1092) scale(0.7272727273 1) translate(-138 -1092)">总工作：15 &lt; 2×8</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M868,1085 L1378,1085" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="857" y="1091" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(857 1091) scale(0.7272727273 1) translate(-857 -1091)">0</text><path d="M868,1005 L1378,1005" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="857" y="1011" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(857 1011) scale(0.7272727273 1) translate(-857 -1011)">18</text><path d="M868,925 L1378,925" fill="none" stroke="#dde7ed" stroke-width="2" /><text x="857" y="931" font-size="18" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(857 931) scale(0.7272727273 1) translate(-857 -931)">36</text><text x="868" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(868 1112) scale(0.7272727273 1) translate(-868 -1112)">1</text><text x="1159.43" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(1159.43 1112) scale(0.7272727273 1) translate(-1159.43 -1112)">5</text><text x="1378" y="1112" font-size="20" fill="#5c7281" text-anchor="middle" font-weight="400" transform="translate(1378 1112) scale(0.7272727273 1) translate(-1378 -1112)">8</text><polyline points="868,1080.56 940.857,1071.67 1013.71,1058.33 1086.57,1053.89 1159.43,1031.67 1232.29,1027.22 1305.14,1022.78 1378,1018.33" fill="none" stroke="#168a83" stroke-width="3" /><circle cx="868" cy="1080.56" r="4.5" fill="#168a83" /><circle cx="940.857" cy="1071.67" r="4.5" fill="#168a83" /><circle cx="1013.71" cy="1058.33" r="4.5" fill="#168a83" /><circle cx="1086.57" cy="1053.89" r="4.5" fill="#168a83" /><circle cx="1159.43" cy="1031.67" r="4.5" fill="#168a83" /><circle cx="1232.29" cy="1027.22" r="4.5" fill="#168a83" /><circle cx="1305.14" cy="1022.78" r="4.5" fill="#168a83" /><circle cx="1378" cy="1018.33" r="4.5" fill="#168a83" /><polyline points="868,1080.56 940.857,1071.67 1013.71,1058.33 1086.57,1040.56 1159.43,1018.33 1232.29,991.667 1305.14,960.556 1378,925" fill="none" stroke="#d17c3e" stroke-width="3" /><circle cx="868" cy="1080.56" r="4.5" fill="#d17c3e" /><circle cx="940.857" cy="1071.67" r="4.5" fill="#d17c3e" /><circle cx="1013.71" cy="1058.33" r="4.5" fill="#d17c3e" /><circle cx="1086.57" cy="1040.56" r="4.5" fill="#d17c3e" /><circle cx="1159.43" cy="1018.33" r="4.5" fill="#d17c3e" /><circle cx="1232.29" cy="991.667" r="4.5" fill="#d17c3e" /><circle cx="1305.14" cy="960.556" r="4.5" fill="#d17c3e" /><circle cx="1378" cy="925" r="4.5" fill="#d17c3e" /><text x="806" y="901" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 901) scale(0.7272727273 1) translate(-806 -901)">累计写入与复制次数</text><text x="1378" y="1144" font-size="20" fill="#5c7281" text-anchor="end" font-weight="400" transform="translate(1378 1144) scale(0.7272727273 1) translate(-1378 -1144)">已追加元素数</text><text x="831" y="1180" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(831 1180) scale(0.7272727273 1) translate(-831 -1180)">青绿：倍增；橙色：每次加一</text></g></svg>
