<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">动态数组扩容的摊还成本</title><desc id="desc">图中的大箭头表示少数昂贵搬迁，小规模追加并非每次都搬整个前缀。容量按固定倍数增长时，历次复制量形成几何级数，总量可由最终规模的常数倍控制。 摊还常数成本不表示每次追加都恒定耗时，也不表示任意增长政策都一样。若每次只增加固定容量，反复复制前缀可能形成平方级总工作。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">动态数组扩容的摊还成本</text><text x="80" y="125" font-size="25" fill="#18324d" font-weight="400">容量按 2 倍增长；黄色为新追加元素</text><rect x="90" y="160" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2"/><text x="110" y="196" font-size="22" fill="#18324d" font-weight="400">a</text><rect x="300" y="160" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="320" y="196" font-size="22" fill="#18324d" font-weight="400">a</text><rect x="370" y="160" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2"/><text x="390" y="196" font-size="22" fill="#18324d" font-weight="400">b</text><rect x="650" y="160" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="670" y="196" font-size="22" fill="#18324d" font-weight="400">a</text><rect x="720" y="160" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="740" y="196" font-size="22" fill="#18324d" font-weight="400">b</text><rect x="790" y="160" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="810" y="196" font-size="22" fill="#18324d" font-weight="400">c</text><rect x="860" y="160" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2"/><text x="880" y="196" font-size="22" fill="#18324d" font-weight="400">d</text><path d="M180 185 L285 185" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><path d="M455 185 L635 185" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="290" font-size="26" fill="#18324d" font-weight="400">扩容时搬移旧元素：1 + 2 + 4 + …</text><rect x="90" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="110" y="381" font-size="22" fill="#18324d" font-weight="400">a</text><rect x="160" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="180" y="381" font-size="22" fill="#18324d" font-weight="400">b</text><rect x="230" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="250" y="381" font-size="22" fill="#18324d" font-weight="400">c</text><rect x="300" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="320" y="381" font-size="22" fill="#18324d" font-weight="400">d</text><rect x="370" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="390" y="381" font-size="22" fill="#18324d" font-weight="400">e</text><rect x="440" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="460" y="381" font-size="22" fill="#18324d" font-weight="400">f</text><rect x="510" y="345" width="70" height="55" rx="0" fill="#e3eef8" stroke="#6c8ca5" stroke-width="2"/><text x="530" y="381" font-size="22" fill="#18324d" font-weight="400">g</text><rect x="580" y="345" width="70" height="55" rx="0" fill="#f9dc9a" stroke="#6c8ca5" stroke-width="2"/><text x="600" y="381" font-size="22" fill="#18324d" font-weight="400">h</text><text x="90" y="455" font-size="25" fill="#18324d" font-weight="400">复制总量为几何级数；单次扩容昂贵，不代表每次追加都昂贵</text><text x="90" y="535" font-size="25" fill="#18324d" font-weight="400">固定倍增策略下，n 次追加的总搬移与写入工作是 O(n)</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
