<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">Top-k 堆根保存当前门槛</title><desc id="plateDesc">B 和 C 是从相同初始候选出发的两次独立测试。B 新值十应替换八；C 新值八点五也应替换八，若误用最大值九作为进入门槛，就会错误拒绝一个应当进入 Top-2 的值。堆内部布局不要求完全排序，最终展示排序是另一步。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">Top-k 堆根保存当前门槛</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">DataStructuresAndAlgorithms</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">Top-k 最小堆根是当前门槛</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">新值十替换最差的八</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">初始候选</text><rect x="281" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="381.25" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">8</text><rect x="488.5" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="588.75" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">9</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">新记录</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">10</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">保留最大两项</text><rect x="281" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="381.25" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">9</text><rect x="488.5" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="588.75" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">10</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">三者从同一初始候选开始比较</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">错误堆根会拒绝应保留项</text><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">重新从 [8,9] 出发</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">新值 8.5</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">正确：根为最小值 </text><text x="806" y="1022" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">8</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">保留 8.5 与 9</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">误以最大值 9 为门</text><text x="806" y="1092" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">槛</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">会漏掉 8.5</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">候选中最差的一项才是淘汰边界</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">Top-k 堆根保存当前门槛</title><desc id="panelA-desc">保存最大 k 项时采用最小堆，让根成为当前最差候选。新记录一到来后先比较门槛，未超过八就丢弃；无条件替换根会错误删除更好的八。 堆只组织候选的局部顺序，不是完整排名。稳定同分规则也必须进入维护键，不能等最终输出时再补；若目标改成实体聚合排名，还需先重新定义记录贡献。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">Top-k 堆根保存当前门槛</text><circle cx="280" cy="205" r="36" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="268" y="214" font-size="24" fill="#18324d" font-weight="400">8</text><circle cx="130" cy="375" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="118" y="384" font-size="24" fill="#18324d" font-weight="400">9</text><path d="M260 238 L150 342" fill="none" stroke="#47769a" stroke-width="3" /><text x="110" y="480" font-size="23" fill="#18324d" font-weight="400">最小堆：根是已保留候选中最小者</text><rect x="650" y="160" width="400" height="110" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="680" y="205" font-size="24" fill="#18324d" font-weight="400">新记录：1</text><text x="680" y="245" font-size="24" fill="#18324d" font-weight="400">1 &lt; 根 8，因此拒绝</text><path d="M650 220 L335 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="650" y="380" font-size="25" fill="#18324d" font-weight="400">仍保留最大的两项：8、9</text><text x="100" y="560" font-size="24" fill="#18324d" font-weight="400">堆保证根为门槛，不保证整个数组有序；最终排序是另一项操作</text></g></svg></svg>
