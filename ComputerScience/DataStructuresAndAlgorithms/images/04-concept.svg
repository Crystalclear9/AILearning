<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">Top-k 堆根保存当前门槛</title><desc id="plateDesc">B 和 C 是从相同初始候选出发的两次独立测试。B 新值十应替换八；C 新值八点五也应替换八，若误用最大值九作为进入门槛，就会错误拒绝一个应当进入 Top-2 的值。堆内部布局不要求完全排序，最终展示排序是另一步。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">Top-k 堆根保存当前门槛</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">Top-k 最小堆根是当前门槛</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">新值十替换最差的八</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">错误堆根会拒绝应保留项</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">Top-k 堆根保存当前门槛</title><desc id="panelA-desc">保存最大 k 项时采用最小堆，让根成为当前最差候选。新记录一到来后先比较门槛，未超过八就丢弃；无条件替换根会错误删除更好的八。 堆只组织候选的局部顺序，不是完整排名。稳定同分规则也必须进入维护键，不能等最终输出时再补；若目标改成实体聚合排名，还需先重新定义记录贡献。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">Top-k 堆根保存当前门槛</text><circle cx="280" cy="205" r="36" fill="#f9dc9a" stroke="#47769a" stroke-width="2" /><text x="268" y="214" font-size="24" fill="#18324d" font-weight="400">8</text><circle cx="130" cy="375" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="118" y="384" font-size="24" fill="#18324d" font-weight="400">9</text><path d="M260 238 L150 342" fill="none" stroke="#47769a" stroke-width="3" /><text x="110" y="480" font-size="23" fill="#18324d" font-weight="400">最小堆：根是已保留候选中最小者</text><rect x="650" y="160" width="400" height="110" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="680" y="205" font-size="24" fill="#18324d" font-weight="400">新记录：1</text><text x="680" y="245" font-size="24" fill="#18324d" font-weight="400">1 &lt; 根 8，因此拒绝</text><path d="M650 220 L335 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="650" y="380" font-size="25" fill="#18324d" font-weight="400">仍保留最大的两项：8、9</text><text x="100" y="560" font-size="24" fill="#18324d" font-weight="400">堆保证根为门槛，不保证整个数组有序；最终排序是另一项操作</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">初始候选</text><rect x="281" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="381.25" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 938.5) scale(0.7272727273 1) translate(-381.25 -938.5)">8</text><rect x="488.5" y="900" width="200.5" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="588.75" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 938.5) scale(0.7272727273 1) translate(-588.75 -938.5)">9</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">新记录</text><rect x="281" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="485" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 1008.5) scale(0.7272727273 1) translate(-485 -1008.5)">10</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">保留最大两项</text><rect x="281" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="381.25" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 1078.5) scale(0.7272727273 1) translate(-381.25 -1078.5)">9</text><rect x="488.5" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="588.75" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 1078.5) scale(0.7272727273 1) translate(-588.75 -1078.5)">10</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">三者从同一初始候选开始比较</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="806" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 924) scale(0.7272727273 1) translate(-806 -924)">重新从 [8,9] 出发</text><rect x="991" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="1195" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 938.5) scale(0.7272727273 1) translate(-1195 -938.5)">新值 8.5</text><text x="806" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 994) scale(0.7272727273 1) translate(-806 -994)">正确：根为最小值 8</text><rect x="991" y="970" width="408" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="1195" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1008.5) scale(0.7272727273 1) translate(-1195 -1008.5)">保留 8.5 与 9</text><text x="806" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(806 1064) scale(0.7272727273 1) translate(-806 -1064)">误以最大值 9 为门槛</text><rect x="991" y="1040" width="408" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="1195" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(1195 1078.5) scale(0.7272727273 1) translate(-1195 -1078.5)">会漏掉 8.5</text><text x="806" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1144) scale(0.7272727273 1) translate(-806 -1144)">候选中最差的一项才是淘汰边界</text></g></svg>
