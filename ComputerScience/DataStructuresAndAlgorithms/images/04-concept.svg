<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Top-k 堆根保存当前门槛</title><desc id="desc">保存最大 k 项时采用最小堆，让根成为当前最差候选。新记录一到来后先比较门槛，未超过八就丢弃；无条件替换根会错误删除更好的八。 堆只组织候选的局部顺序，不是完整排名。稳定同分规则也必须进入维护键，不能等最终输出时再补；若目标改成实体聚合排名，还需先重新定义记录贡献。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">Top-k 堆根保存当前门槛</text><circle cx="280" cy="205" r="36" fill="#f9dc9a" stroke="#47769a" stroke-width="2"/><text x="268" y="214" font-size="24" fill="#18324d" font-weight="400">8</text><circle cx="130" cy="375" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="118" y="384" font-size="24" fill="#18324d" font-weight="400">9</text><path d="M260 238 L150 342" fill="none" stroke="#47769a" stroke-width="3"/><text x="110" y="480" font-size="23" fill="#18324d" font-weight="400">最小堆：根是已保留候选中最小者</text><rect x="650" y="160" width="400" height="110" rx="8" fill="#edf4fb" stroke="#47769a" stroke-width="2"/><text x="680" y="205" font-size="24" fill="#18324d" font-weight="400">新记录：1</text><text x="680" y="245" font-size="24" fill="#18324d" font-weight="400">1 &lt; 根 8，因此拒绝</text><path d="M650 220 L335 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="380" font-size="25" fill="#18324d" font-weight="400">仍保留最大的两项：8、9</text><text x="100" y="560" font-size="24" fill="#18324d" font-weight="400">堆保证根为门槛，不保证整个数组有序；最终排序是另一项操作</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
