<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="714" viewBox="0 0 960 714" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">编辑距离：格子依赖左、上与左上</title><desc id="artwork-desc">编辑距离：把数值依赖还原成真正的字符操作 箭头画的是前缀状态依赖；右侧序列给出这些候选的完整见证。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="616.220472"/></clipPath></defs><rect width="960" height="714" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">编辑距离：格子依赖左、上与左上</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(10.669291 25.84252) scale(0.716535)"><g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2f5467" stroke-width="1.5"/></marker></defs><rect width="1270.0" height="860.0" fill="white" x="20.0" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="36.983516px" fill="#1f3348" text-anchor="start" font-weight="400">源串 ab → 目标串 ac；插入、删除、替换各耗费 1</text><text xml:space="preserve" x="235" y="220" font-size="36.983516px" fill="#1f3348" text-anchor="middle" font-weight="400">空</text><text xml:space="preserve" x="380" y="220" font-size="36.983516px" fill="#1f3348" text-anchor="middle" font-weight="400">a</text><text xml:space="preserve" x="525" y="220" font-size="36.983516px" fill="#1f3348" text-anchor="middle" font-weight="400">ac</text><text xml:space="preserve" x="115" y="325" font-size="36.983516px" fill="#1f3348" text-anchor="middle" font-weight="400">空</text><text xml:space="preserve" x="115" y="470" font-size="36.983516px" fill="#1f3348" text-anchor="middle" font-weight="400">a</text><text xml:space="preserve" x="115" y="615" font-size="36.983516px" fill="#1f3348" text-anchor="middle" font-weight="400">ab</text><rect x="180" y="260" width="110" height="110" rx="0" fill="#eef5f9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="235" y="328" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><rect x="325" y="260" width="110" height="110" rx="0" fill="#eef5f9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="380" y="328" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><rect x="470" y="260" width="110" height="110" rx="0" fill="#eef5f9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="525" y="328" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">2</text><rect x="180" y="405" width="110" height="110" rx="0" fill="#eef5f9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="235" y="473" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><rect x="325" y="405" width="110" height="110" rx="0" fill="#eef5f9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="380" y="473" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><rect x="470" y="405" width="110" height="110" rx="0" fill="#eef5f9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="525" y="473" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><rect x="180" y="550" width="110" height="110" rx="0" fill="#eef5f9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="235" y="618" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">2</text><rect x="325" y="550" width="110" height="110" rx="0" fill="#eef5f9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="380" y="618" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><rect x="470" y="550" width="110" height="110" rx="0" fill="#fdf4e9" stroke="#b2c1d0" stroke-width="2"/><text xml:space="preserve" x="525" y="618" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><line x1="445" y1="575" x2="464" y2="575" stroke="#147bb1" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="525" y1="515" x2="525" y2="543" stroke="#147bb1" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="432" y1="512" x2="464" y2="544" stroke="#b2591a" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="690" y1="180" x2="690" y2="780" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="755" y="225" font-size="36.983516px" fill="#1f3348" text-anchor="start" font-weight="400">末步删除 b</text><text xml:space="preserve" x="800" y="302" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">ab</text><line x1="850" y1="290" x2="958" y2="290" stroke="#147bb1" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1020" y="302" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">acb</text><line x1="1070" y1="290" x2="1178" y2="290" stroke="#147bb1" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1240" y="302" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">ac</text><text xml:space="preserve" x="755" y="357" font-size="36.983516px" fill="#1f3348" text-anchor="start" font-weight="400">候选代价 1 + 1 = 2</text><text xml:space="preserve" x="755" y="420" font-size="36.983516px" fill="#1f3348" text-anchor="start" font-weight="400">末步插入 c</text><text xml:space="preserve" x="800" y="497" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">ab</text><line x1="850" y1="485" x2="958" y2="485" stroke="#147bb1" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1020" y="497" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">a</text><line x1="1070" y1="485" x2="1178" y2="485" stroke="#147bb1" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1240" y="497" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">ac</text><text xml:space="preserve" x="755" y="552" font-size="36.983516px" fill="#1f3348" text-anchor="start" font-weight="400">候选代价 1 + 1 = 2</text><text xml:space="preserve" x="755" y="615" font-size="36.983516px" fill="#a85d22" text-anchor="start" font-weight="400">末步替换 b → c</text><text xml:space="preserve" x="800" y="692" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">ab</text><line x1="850" y1="680" x2="958" y2="680" stroke="#b2591a" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1020" y="692" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">ac</text><text xml:space="preserve" x="755" y="747" font-size="36.983516px" fill="#1f3348" text-anchor="start" font-weight="400">候选代价 0 + 1 = 1</text><text xml:space="preserve" x="50" y="830" font-size="36.983516px" fill="#1f3348" text-anchor="start" font-weight="400">格子 D(2,2) 取三者最小值 1；橙色左上依赖来自匹配前缀 a。</text><text xml:space="preserve" x="50" y="895" font-size="36.983516px" fill="#1f3348" text-anchor="start" font-weight="400">插入或删除路线也合法，但都用了两次操作，不是最优方案。</text></g><desc> 编辑距离：把数值依赖还原成真正的字符操作 箭头画的是前缀状态依赖；右侧序列给出这些候选的完整见证。</desc></g></g></g></svg>