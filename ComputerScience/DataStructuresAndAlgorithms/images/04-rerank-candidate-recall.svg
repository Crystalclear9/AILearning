<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="477" viewBox="0 47 960 477" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">重排只能重新排列已经进入候选的记录</title><desc id="artwork-desc">全库四条记录按最终评分应排为 a、b、c、d，真正的前一名是 a。假设廉价第一阶段只交付 b、c、d，即使第二阶段对这三条采用完全精确的最终分数，最优返回也只能是 b。图中分数只是固定的课堂算例，不代表某个具体索引的召回率。评价时应同时检查候选召回与候选内排序；除非另有可证明的剪枝界，否则“精确重排”不等于“全库精确检索”。 重排只能重新排列已经进入候选的记录</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="426.663701"/></clipPath></defs><rect width="960" height="524" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(12.046263 22.565836) scale(0.809609)"><g><defs><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">重排只能重新排列已经进入候选的记录</title><desc id="figure-desc">全库四条记录按最终评分应排为 a、b、c、d，真正的前一名是 a。假设廉价第一阶段只交付 b、c、d，即使第二阶段对这三条采用完全精确的最终分数，最优返回也只能是 b。图中分数只是固定的课堂算例，不代表某个具体索引的召回率。评价时应同时检查候选召回与候选内排序；除非另有可证明的剪枝界，否则“精确重排”不等于“全库精确检索”。 重排只能重新排列已经进入候选的记录</desc><rect width="1124.0" height="527.0" fill="white" x="16.0" y="66.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="115" font-size="32.731868px" fill="#2472b1" text-anchor="start" font-weight="600">全库最终分数</text><text x="40" y="200" font-size="32.731868px" fill="#1f3449" text-anchor="start" font-weight="400">a</text><rect x="95" y="165" width="287.1" height="50" rx="6" fill="url(#book-wash-fff0e3)" stroke="#b9642b" stroke-width="1.5"/><text x="405" y="200" font-size="32.731868px" fill="#a86331" text-anchor="start" font-weight="400">0.99</text><text x="40" y="295" font-size="32.731868px" fill="#1f3449" text-anchor="start" font-weight="400">b</text><rect x="95" y="260" width="261.0" height="50" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="405" y="295" font-size="32.731868px" fill="#2472b1" text-anchor="start" font-weight="400">0.90</text><text x="40" y="390" font-size="32.731868px" fill="#1f3449" text-anchor="start" font-weight="400">c</text><rect x="95" y="355" width="232.0" height="50" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="405" y="390" font-size="32.731868px" fill="#2472b1" text-anchor="start" font-weight="400">0.80</text><text x="40" y="485" font-size="32.731868px" fill="#1f3449" text-anchor="start" font-weight="400">d</text><rect x="95" y="450" width="203.0" height="50" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="405" y="485" font-size="32.731868px" fill="#2472b1" text-anchor="start" font-weight="400">0.70</text><text x="555" y="115" font-size="32.731868px" fill="#2472b1" text-anchor="start" font-weight="600">第一阶段候选</text><rect x="560" y="175" width="185" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="652.5" y="217.3" font-size="32.731868px" fill="#2472b1" text-anchor="middle" font-weight="400">b</text><rect x="560" y="290" width="185" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="652.5" y="332.3" font-size="32.731868px" fill="#2472b1" text-anchor="middle" font-weight="400">c</text><rect x="560" y="405" width="185" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#176fa3" stroke-width="1.5"/><text x="652.5" y="447.3" font-size="32.731868px" fill="#2472b1" text-anchor="middle" font-weight="400">d</text><line fill="none" stroke="#176fa3" stroke-width="2.8" marker-end="url(#arrow-blue)" x1="765" y1="320" x2="865" y2="320"/><text x="900" y="205" font-size="32.731868px" fill="#a86331" text-anchor="start" font-weight="600">精确重排</text><rect x="895" y="265" width="220" height="80" rx="6" fill="url(#book-wash-fff0e3)" stroke="#b9642b" stroke-width="1.5"/><text x="1005.0" y="315.5" font-size="32.731868px" fill="#a86331" text-anchor="middle" font-weight="400">返回 b</text><text x="555" y="565" font-size="32.731868px" fill="#a86331" text-anchor="start" font-weight="400">a 未入候选，重排无法把它找回来。</text></g></g></g></g></svg>