<svg xmlns="http://www.w3.org/2000/svg" width="1159.24" height="785.971" viewBox="-10.5522 40.6478 1159.24 785.971" role="img" aria-labelledby="plate-title"><title id="plate-title">蓄水池采样让后来的项仍有公平机会</title><desc> 蓄水池采样：十二条等概率路径，六种最终子集 j &lt; 2 才替换对应槽；否则保留原池。表中展示排序后的身份集合。</desc><rect id="edition-paper" x="-10.5522" y="40.6478" width="1159.24" height="785.971" fill="#ffffff"/><svg id="edition-view" x="10.667" y="61.867" width="1116.8" height="743.533" viewBox="10.667 61.867 1116.8 743.533" overflow="hidden"><rect width="1116.8" height="743.533" fill="#ffffff" x="10.667" y="61.867"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="110" font-size="27" fill="#233949" text-anchor="start">容量 k=2；依次读取 0、1、2、3，初始池为 [0,1]</text><text x="310" y="175" font-size="28" fill="#233949" text-anchor="start">第四项：随机槽位 j4</text><text x="390" y="225" font-size="27" fill="#233949" text-anchor="middle">j4=0</text><text x="600" y="225" font-size="27" fill="#233949" text-anchor="middle">j4=1</text><text x="810" y="225" font-size="27" fill="#233949" text-anchor="middle">j4=2</text><text x="1020" y="225" font-size="27" fill="#233949" text-anchor="middle">j4=3</text><text x="40" y="325" font-size="28" fill="#233949" text-anchor="start">j3=0</text><text x="150" y="325" font-size="26" fill="#2c6f8d" text-anchor="start">[2, 1]</text><rect x="310" y="280" width="160" height="85" fill="#eff5f8" stroke="#e3e8ee" stroke-width="2"/><text x="390" y="334" font-size="30" fill="#2c6f8d" text-anchor="middle">{1,3}</text><rect x="520" y="280" width="160" height="85" fill="#eff5f8" stroke="#e3e8ee" stroke-width="2"/><text x="600" y="334" font-size="30" fill="#2c6f8d" text-anchor="middle">{2,3}</text><rect x="730" y="280" width="160" height="85" fill="#eff5f8" stroke="#e3e8ee" stroke-width="2"/><text x="810" y="334" font-size="30" fill="#2c6f8d" text-anchor="middle">{1,2}</text><rect x="940" y="280" width="160" height="85" fill="#eff5f8" stroke="#e3e8ee" stroke-width="2"/><text x="1020" y="334" font-