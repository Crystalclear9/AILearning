<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1359.78" height="814.78" viewBox="-24.89 -24.89 1359.78 814.78" role="img" aria-labelledby="title description"><title id="title">同一哈希桶与墓碑后的查找</title><desc id="description">链式哈希的桶二连接 2、6、10。开放寻址依次探查槽 2、3、0、1。墓碑不终止查找；在槽 0 找到旧键 10 并更新。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#293442"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#1e6672"/></marker><marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#9d493e"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#635280"/></marker><linearGradient id="water" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#78bfc9" stop-opacity=".14"/><stop offset="100%" stop-color="#78bfc9" stop-opacity=".49"/></linearGradient><linearGradient id="peach" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#e7aea5" stop-opacity=".14"/><stop offset="100%" stop-color="#e7aea5" stop-opacity=".49"/></linearGradient><linearGradient id="lilac" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#bfaedc" stop-opacity=".14"/><stop offset="100%" stop-color="#bfaedc" stop-opacity=".49"/></linearGradient></defs><rect id="edition-paper" x="-24.89" y="-24.89" width="1359.78" height="814.78" fill="#ffffff"/><svg id="edition-view" x="0" y="0" width="1310" height="765" viewBox="0 0 1310 765" overflow="hidden"><rect x="0" y="0" width="1310" height="765" fill="#ffffff"/><text x="66" y="70" fill="#293442" font-family="SimSun, Noto Serif CJK SC,