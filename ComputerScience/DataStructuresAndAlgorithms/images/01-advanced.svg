<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1310" height="765" viewBox="0 0 1310 765" role="img" aria-labelledby="title description"><title id="title">同一哈希桶与墓碑后的查找</title><desc id="description">链式哈希的桶二连接 2、6、10。开放寻址依次探查槽 2、3、0、1。墓碑不终止查找；在槽 0 找到旧键 10 并更新。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#202939"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#166d76"/></marker><marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#a54538"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#625281"/></marker><linearGradient id="water" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7acbd1" stop-opacity=".14"/><stop offset="100%" stop-color="#7acbd1" stop-opacity=".49"/></linearGradient><linearGradient id="peach" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ef9b8e" stop-opacity=".14"/><stop offset="100%" stop-color="#ef9b8e" stop-opacity=".49"/></linearGradient><linearGradient id="lilac" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b3a1da" stop-opacity=".14"/><stop offset="100%" stop-color="#b3a1da" stop-opacity=".49"/></linearGradient></defs><rect x="0" y="0" width="1310" height="765" fill="white"/><text x="66" y="70" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="37" text-anchor="start">链式哈希</text><text x="65" y="137" fill="#166d76" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="28" text-anchor="start">h(k) = k mod 4</text><rect x="351" y="80" width="163" height="67" rx="3" fill="url(#water)" stroke="#166d76" stroke-width="1.8"/><text x="432" y="124" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">桶 2</text><line x1="522" y1="114" x2="586" y2="114" stroke="#202939" stroke-width="2" stroke-linecap="round" marker-end="url(#ink)"/><circle cx="624" cy="114" r="32" stroke="#166d76" stroke-width="1.8" fill="url(#water)"/><text x="624" y="126" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="32" text-anchor="middle">2</text><line x1="661" y1="114" x2="776" y2="114" stroke="#202939" stroke-width="2" stroke-linecap="round" marker-end="url(#ink)"/><circle cx="814" cy="114" r="32" stroke="#166d76" stroke-width="1.8" fill="url(#water)"/><text x="814" y="126" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="32" text-anchor="middle">6</text><line x1="851" y1="114" x2="966" y2="114" stroke="#202939" stroke-width="2" stroke-linecap="round" marker-end="url(#ink)"/><circle cx="1004" cy="114" r="32" stroke="#166d76" stroke-width="1.8" fill="url(#water)"/><text x="1004" y="126" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="32" text-anchor="middle">10</text><text x="65" y="232" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="37" text-anchor="start">开放寻址</text><text x="310" y="232" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="start">按探查顺序排列槽位</text><text x="448" y="304" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">槽 2</text><text x="670" y="304" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">槽 3</text><text x="892" y="304" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">槽 0</text><text x="1114" y="304" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">槽 1</text><text x="65" y="406" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="start">删成空槽</text><rect x="390" y="362" width="116" height="70" rx="3" fill="url(#peach)" stroke="#a54538" stroke-width="1.8"/><text x="448" y="409" fill="#a54538" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">空槽</text><rect x="612" y="362" width="116" height="70" fill="#fbfcfc" stroke="#8998a8" stroke-width="1.4" rx="3"/><text x="670" y="409" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">6</text><rect x="834" y="362" width="116" height="70" fill="#fbfcfc" stroke="#8998a8" stroke-width="1.4" rx="3"/><text x="892" y="409" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">10</text><rect x="1056" y="362" width="116" height="70" fill="#fbfcfc" stroke="#8998a8" stroke-width="1.4" rx="3"/><text x="1114" y="409" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">空槽</text><line x1="448" y1="440" x2="448" y2="461" stroke="#a54538" stroke-width="1.8" stroke-linecap="round"/><text x="448" y="501" fill="#a54538" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">提前停止，漏查 10</text><text x="65" y="592" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="start">保留墓碑</text><rect x="390" y="548" width="116" height="70" rx="3" fill="url(#lilac)" stroke="#625281" stroke-width="1.8"/><text x="448" y="595" fill="#625281" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">墓碑</text><rect x="612" y="548" width="116" height="70" fill="#fbfcfc" stroke="#8998a8" stroke-width="1.4" rx="3"/><text x="670" y="595" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">6</text><rect x="834" y="548" width="116" height="70" rx="3" fill="url(#water)" stroke="#166d76" stroke-width="1.8"/><text x="892" y="595" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">10</text><rect x="1056" y="548" width="116" height="70" fill="#fbfcfc" stroke="#8998a8" stroke-width="1.4" rx="3"/><text x="1114" y="595" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">空槽</text><line x1="512" y1="584" x2="601" y2="584" stroke="#166d76" stroke-width="2.3" stroke-linecap="round" marker-end="url(#teal)"/><line x1="734" y1="584" x2="823" y2="584" stroke="#166d76" stroke-width="2.3" stroke-linecap="round" marker-end="url(#teal)"/><line x1="892" y1="626" x2="892" y2="650" stroke="#166d76" stroke-width="1.8" stroke-linecap="round"/><text x="892" y="691" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" text-anchor="middle">命中旧键 10，更新原槽</text><text x="448" y="691" fill="#625281" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" text-anchor="middle">记住可复用的位置</text></svg>