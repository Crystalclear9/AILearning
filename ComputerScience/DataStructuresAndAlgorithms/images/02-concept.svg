<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">BFS 的分层与最短边数</title><desc id="desc">队列按发现顺序推进，使未加权图中较浅层先完成扩展。首次发现目标的距离就是最少边数，父节点链可恢复一条对应路径。 最少边数并不等于任意加权路径的最小成本。若一条边代价很大而另一条两边路径便宜，应换用适合权重前提的算法，而不是继续沿用 BFS 的距离解释。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><rect width="1200" height="640" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">BFS 的分层与最短边数</text><text x="70" y="130" font-size="24" fill="#18324d" font-weight="400">第 0 层</text><text x="440" y="130" font-size="24" fill="#18324d" font-weight="400">第 1 层</text><text x="900" y="130" font-size="24" fill="#18324d" font-weight="400">第 2 层</text><circle cx="160" cy="320" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="148" y="329" font-size="24" fill="#18324d" font-weight="400">s</text><circle cx="520" cy="220" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="508" y="229" font-size="24" fill="#18324d" font-weight="400">a</text><circle cx="520" cy="420" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="508" y="429" font-size="24" fill="#18324d" font-weight="400">b</text><circle cx="960" cy="220" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="948" y="229" font-size="24" fill="#18324d" font-weight="400">t</text><path d="M197 309 L480 232" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#tip-c9773e)" /><path d="M197 331 L480 409" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#tip-c9773e)" /><path d="M557 220 L920 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#tip-c9773e)" /><text x="110" y="515" font-size="27" fill="#18324d" font-weight="400">FIFO 队列按层展开；首次发现时记录父节点</text><text x="110" y="560" font-size="26" fill="#18324d" font-weight="400">无权图中最短路径 s → a → t，距离为 2 条边</text><text x="45" y="625" font-size="18" fill="#637789" font-weight="400">原创教学示意图 · 对应条件、数值与省略内容见正文图解</text></g></svg>
