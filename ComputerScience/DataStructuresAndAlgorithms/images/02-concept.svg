<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plateTitle plateDesc" width="1200" height="1690" viewBox="0 0 1200 1690" role="img"><title id="plateTitle">BFS 的分层与最短边数</title><desc id="plateDesc">B 以原图的无权边追踪 FIFO 队列。C 另构一个三顶点加权图，直接边权五，经 a 的两条边各为一；最少边数路径反而权重更大，明确说明 BFS 的最短路保证依赖无权或等权条件。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1200" height="1690" fill="#f3f6f8" /><text x="48" y="61" font-size="30" font-weight="700" fill="#19354a">BFS 的分层与最短边数</text><rect x="32" y="104" width="1136" height="596" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="124" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">A</text><text x="111" y="151" font-size="28" font-weight="700" fill="#19354a">BFS 按首次发现建立层序</text><path d="M52,180 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="730" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="750" width="42" height="38" rx="10" fill="#e4f2ef" /><text x="73" y="777" text-anchor="middle" font-size="24" font-weight="700" fill="#168a83">B</text><text x="111" y="777" font-size="28" font-weight="700" fill="#19354a">队列推进与父节点记录</text><path d="M52,806 H1148" stroke="#e6edf1" fill="none" /><rect x="32" y="1210" width="1136" height="450" rx="16" fill="white" stroke="#dce5eb" /><rect x="52" y="1230.0" width="42" height="38" rx="10" fill="#faecdf" /><text x="73" y="1257.0" text-anchor="middle" font-size="24" font-weight="700" fill="#b5632f">C</text><text x="111" y="1257.0" font-size="28" font-weight="700" fill="#19354a">最少边数不等于最小权重</text><path d="M52,1286 H1148" stroke="#e6edf1" fill="none" /></g><svg width="1104" height="490" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="48" y="193" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">BFS 的分层与最短边数</title><desc id="panelA-desc">队列按发现顺序推进，使未加权图中较浅层先完成扩展。首次发现目标的距离就是最少边数，父节点链可恢复一条对应路径。 最少边数并不等于任意加权路径的最小成本。若一条边代价很大而另一条两边路径便宜，应换用适合权重前提的算法，而不是继续沿用 BFS 的距离解释。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">BFS 的分层与最短边数</text><text x="70" y="130" font-size="24" fill="#18324d" font-weight="400">第 0 层</text><text x="440" y="130" font-size="24" fill="#18324d" font-weight="400">第 1 层</text><text x="900" y="130" font-size="24" fill="#18324d" font-weight="400">第 2 层</text><circle cx="160" cy="320" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="148" y="329" font-size="24" fill="#18324d" font-weight="400">s</text><circle cx="520" cy="220" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="508" y="229" font-size="24" fill="#18324d" font-weight="400">a</text><circle cx="520" cy="420" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="508" y="429" font-size="24" fill="#18324d" font-weight="400">b</text><circle cx="960" cy="220" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="948" y="229" font-size="24" fill="#18324d" font-weight="400">t</text><path d="M197 309 L480 232" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M197 331 L480 409" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M557 220 L920 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="110" y="515" font-size="27" fill="#18324d" font-weight="400">FIFO 队列按层展开；首次发现时记录父节点</text><text x="110" y="560" font-size="26" fill="#18324d" font-weight="400">无权图中最短路径 s → a → t，距离为 2 条边</text></g></svg><g transform="translate(48 824) scale(1.65 1.2) translate(-70 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 924) scale(0.7272727273 1) translate(-96 -924)">初始化队列</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8" /><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(485 938.5) scale(0.7272727273 1) translate(-485 -938.5)">s</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 994) scale(0.7272727273 1) translate(-96 -994)">展开 s</text><rect x="281" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="381.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 1008.5) scale(0.7272727273 1) translate(-381.25 -1008.5)">a</text><rect x="488.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8" /><text x="588.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 1008.5) scale(0.7272727273 1) translate(-588.75 -1008.5)">b</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(96 1064) scale(0.7272727273 1) translate(-96 -1064)">展开 a</text><rect x="281" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="381.25" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(381.25 1078.5) scale(0.7272727273 1) translate(-381.25 -1078.5)">b</text><rect x="488.5" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8" /><text x="588.75" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400" transform="translate(588.75 1078.5) scale(0.7272727273 1) translate(-588.75 -1078.5)">t</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(96 1144) scale(0.7272727273 1) translate(-96 -1144)">首次发现 t 时，父节点为 a，距离为 2</text></g><g transform="translate(48 1304) scale(1.65 1.2) translate(-780 -896)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="806" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="815" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 923) scale(0.7272727273 1) translate(-815 -923)">路径</text><rect x="1006" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1015" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 923) scale(0.7272727273 1) translate(-1015 -923)">边数</text><rect x="1206" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white" /><text x="1215" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 923) scale(0.7272727273 1) translate(-1215 -923)">总权重</text><rect x="806" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="815" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 978) scale(0.7272727273 1) translate(-815 -978)">s→t</text><rect x="1006" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1015" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 978) scale(0.7272727273 1) translate(-1015 -978)">1</text><rect x="1206" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8" /><text x="1215" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 978) scale(0.7272727273 1) translate(-1215 -978)">5</text><rect x="806" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="815" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(815 1036) scale(0.7272727273 1) translate(-815 -1036)">s→a→t</text><rect x="1006" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1015" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1015 1036) scale(0.7272727273 1) translate(-1015 -1036)">2</text><rect x="1206" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8" /><text x="1215" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400" transform="translate(1215 1036) scale(0.7272727273 1) translate(-1215 -1036)">2</text><text x="806" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400" transform="translate(806 1150) scale(0.7272727273 1) translate(-806 -1150)">加权反例：边权为 5、1、1</text></g></svg>
