<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="plateTitle plateDesc"><title id="plateTitle">BFS 的分层与最短边数</title><desc id="plateDesc">B 以原图的无权边追踪 FIFO 队列。C 另构一个三顶点加权图，直接边权五，经 a 的两条边各为一；最少边数路径反而权重更大，明确说明 BFS 的最短路保证依赖无权或等权条件。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1500" height="1240" rx="0" fill="white" stroke="white"/><text x="70" y="75" font-size="36" fill="#19354a" text-anchor="start" font-weight="700">BFS 的分层与最短边数</text><text x="1430" y="78" font-size="22" fill="#5c7281" text-anchor="end" font-weight="400">DataStructuresAndAlgorithms</text><path d="M70,115 L1430,115" fill="none" stroke="#19354a" stroke-width="2"/><rect x="70" y="155" width="1360" height="635" rx="8" fill="white" stroke="#d0dfe6"/><rect x="70" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><rect x="780" y="825" width="650" height="360" rx="8" fill="white" stroke="#d0dfe6"/><text x="95" y="199" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">A</text><text x="140" y="199" font-size="27" fill="#19354a" text-anchor="start" font-weight="700">BFS 按首次发现建立层序</text><text x="95" y="869" font-size="27" fill="#168a83" text-anchor="start" font-weight="700">B</text><text x="140" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">队列推进与父节点记录</text><text x="96" y="924" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">初始化队列</text><rect x="281" y="900" width="408" height="63" rx="8" fill="#e1f0eb" stroke="#d5e1e8"/><text x="485" y="938.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">s</text><text x="96" y="994" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">展开 s</text><rect x="281" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="381.25" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">a</text><rect x="488.5" y="970" width="200.5" height="63" rx="8" fill="#edf2f8" stroke="#d5e1e8"/><text x="588.75" y="1008.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">b</text><text x="96" y="1064" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">展开 a</text><rect x="281" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="381.25" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">b</text><rect x="488.5" y="1040" width="200.5" height="63" rx="8" fill="#f9e9d9" stroke="#d5e1e8"/><text x="588.75" y="1078.5" font-size="22" fill="#19354a" text-anchor="middle" font-weight="400">t</text><text x="96" y="1144" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">首次发现 t 时，父节点为 a，距离为 2</text><text x="805" y="869" font-size="27" fill="#d17c3e" text-anchor="start" font-weight="700">C</text><text x="850" y="869" font-size="25" fill="#19354a" text-anchor="start" font-weight="400">最少边数不等于最小权重</text><rect x="806" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="815" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">路径</text><rect x="1006" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="1015" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">边数</text><rect x="1206" y="900" width="197" height="50" rx="3" fill="#e3eef4" stroke="white"/><text x="1215" y="923" font-size="20" fill="#19354a" text-anchor="start" font-weight="400">总权重</text><rect x="806" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="815" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">s→t</text><rect x="1006" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="1015" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">1</text><rect x="1206" y="953" width="197" height="55" rx="2" fill="#f4f8fa" stroke="#d5e1e8"/><text x="1215" y="978" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">5</text><rect x="806" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="815" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">s→a→t</text><rect x="1006" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="1015" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">2</text><rect x="1206" y="1011" width="197" height="55" rx="2" fill="white" stroke="#d5e1e8"/><text x="1215" y="1036" font-size="21" fill="#19354a" text-anchor="start" font-weight="400">2</text><text x="806" y="1150" font-size="20" fill="#5c7281" text-anchor="start" font-weight="400">加权反例：边权为 5、1、1</text></g><svg xmlns="http://www.w3.org/2000/svg" width="1340" height="530" viewBox="0 85 1200.0 550.0" role="img" aria-labelledby="panelA-title panelA-desc" x="80" y="225" preserveAspectRatio="xMidYMid meet"><title id="panelA-title">BFS 的分层与最短边数</title><desc id="panelA-desc">队列按发现顺序推进，使未加权图中较浅层先完成扩展。首次发现目标的距离就是最少边数，父节点链可恢复一条对应路径。 最少边数并不等于任意加权路径的最小成本。若一条边代价很大而另一条两边路径便宜，应换用适合权重前提的算法，而不是继续沿用 BFS 的距离解释。</desc><defs><marker id="panelA-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c9773e" /></marker><marker id="panelA-tip-c9773e" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c9773e" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="45" y="55" font-size="32" fill="#18324d" font-weight="700">BFS 的分层与最短边数</text><text x="70" y="130" font-size="24" fill="#18324d" font-weight="400">第 0 层</text><text x="440" y="130" font-size="24" fill="#18324d" font-weight="400">第 1 层</text><text x="900" y="130" font-size="24" fill="#18324d" font-weight="400">第 2 层</text><circle cx="160" cy="320" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="148" y="329" font-size="24" fill="#18324d" font-weight="400">s</text><circle cx="520" cy="220" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="508" y="229" font-size="24" fill="#18324d" font-weight="400">a</text><circle cx="520" cy="420" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="508" y="429" font-size="24" fill="#18324d" font-weight="400">b</text><circle cx="960" cy="220" r="36" fill="#edf4fb" stroke="#47769a" stroke-width="2" /><text x="948" y="229" font-size="24" fill="#18324d" font-weight="400">t</text><path d="M197 309 L480 232" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M197 331 L480 409" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><path d="M557 220 L920 220" fill="none" stroke="#c9773e" stroke-width="3" marker-end="url(#panelA-tip-c9773e)" /><text x="110" y="515" font-size="27" fill="#18324d" font-weight="400">FIFO 队列按层展开；首次发现时记录父节点</text><text x="110" y="560" font-size="26" fill="#18324d" font-weight="400">无权图中最短路径 s → a → t，距离为 2 条边</text></g></svg></svg>
