<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="795.48" viewBox="-18.24 28.76 996.48 795.48" role="img" aria-labelledby="artwork-title"><title id="artwork-title">金额状态表、最优前驱路径和局部贪心路径对照</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="708.833125"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="795.48" fill="#ffffff"/><svg id="edition-view" x="0" y="47" width="960" height="759" viewBox="0 47 960 759" overflow="hidden"><rect width="960" height="806" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>最少硬币：状态值与一条可恢复的选择路径</title><svg width="1440" height="671.667" viewBox="13.867 60.823 1217.067 567.683" role="img" aria-labelledby="title desc"><title id="title">最少硬币：状态值与一条可恢复的选择路径</title><desc id="desc">最少硬币：状态值与一条可恢复的选择路径 最少硬币：状态值与一条可恢复的选择路径 两枚已能组成 6，而没有面额 6；可行上界与下界相合，证明最优值为 2</desc><rect width="1217.067" height="567.683" fill="#ffffff" x="13.867" y="60.823"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#708d9d"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23394a"><text x="40" y="110" font-size="28" fill="#23394a" text-anchor="start" font-weight="400">面额 1、3、4，可无限使用；目标金额 6</text><text x="40" y="170" font-size="26" fill="#475b6c" text-anchor="start" font-weight="400">金额 a</text><text x="40" y="232" font-size="26" fill="#475b6c" text-anchor="start" font-weight="400">最少枚数 D(a)</text><text x="290" y="170" font-size="31" fill="#23394a" text-anchor="middle" font-weight="400">0</text><rect x="245" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="290" y="234" font-size="31" fill="#2b749c" text-anchor="middle" font-weight="400">0</text><text x="435" y="170" font-size="31" fill="#23394a" text-anchor="middle" font-weight="400">1</text><rect x="390" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="435" y="234" font-size="31" fill="#2b749c" text-anchor="middle" font-weight="400">1</text><text x="580" y="170" font-size="31" fill="#23394a" text-anchor="middle" font-weight="400">2</text><rect x="535" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="580" y="234" font-size="31" fill="#2b749c" text-anchor="middle" font-weight="400">2</text><text x="725" y="170" font-size="31" fill="#23394a" text-anchor="middle" font-weight="400">3</text><rect x="680" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="725" y="234" font-size="31" fill="#2b749c" text-anchor="middle" font-weight="400">1</text><text x="870" y="170" font-size="31" fill="#23394a" text-anchor="middle" font-weight="400">4</text><rect x="825" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="870" y="234" font-size="31" fill="#2b749c" text-anchor="middle" font-weight="400">1</text><text x="1015" y="170" font-size="31" fill="#23394a" text-anchor="middle" font-weight="400">5</text><rect x="970" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="1015" y="234" font-size="31" fill="#2b749c" text-anchor="middle" font-weight="400">2</text><text x="1160" y="170" font-size="31" fill="#23394a" text-anchor="middle" font-weight="400">6</text><rect x="1115" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="1160" y="234" font-size="31" fill="#2b749c" text-anchor="middle" font-weight="400">2</text><text x="40" y="315" font-size="27" fill="#23394a" text-anchor="start" font-weight="400">D(6) 的末枚候选：1 + D(5) = 3；1 + D(3) = 2；1 + D(2) = 3</text><text x="40" y="387" font-size="28" fill="#2e7ca7" text-anchor="start" font-weight="600" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">沿最优前驱恢复</text><circle cx="355" cy="430" r="31" fill="#ffffff" stroke="#22739a" stroke-width="2"/><circle cx="750" cy="430" r="31" fill="#ffffff" stroke="#22739a" stroke-width="2"/><circle cx="1145" cy="430" r="31" fill="#ffffff" stroke="#22739a" stroke-width="2"/><text x="355" y="440" font-size="29" fill="#2e7ca7" text-anchor="middle" font-weight="400">6</text><text x="750" y="440" font-size="29" fill="#2e7ca7" text-anchor="middle" font-weight="400">3</text><text x="1145" y="440" font-size="29" fill="#2e7ca7" text-anchor="middle" font-weight="400">0</text><line fill="none" stroke="#22739a" stroke-width="3" marker-end="url(#arrow)" x1="405" y1="430" x2="700" y2="430"/><text x="550" y="410" font-size="27" fill="#2e7ca7" text-anchor="middle" font-weight="400">取 3</text><line fill="none" stroke="#22739a" stroke-width="3" marker-end="url(#arrow)" x1="800" y1="430" x2="1095" y2="430"/><text x="945" y="410" font-size="27" fill="#2e7ca7" text-anchor="middle" font-weight="400">取 3</text><text x="40" y="528" font-size="28" fill="#a05e37" text-anchor="start" font-weight="600" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">局部贪心作对照</text><circle cx="355" cy="570" r="31" fill="#ffffff" stroke="#ac5e32" stroke-width="2"/><text x="355" y="580" font-size="29" fill="#a05e37" text-anchor="middle" font-weight="400">6</text><circle cx="620" cy="570" r="31" fill="#ffffff" stroke="#ac5e32" stroke-width="2"/><text x="620" y="580" font-size="29" fill="#a05e37" text-anchor="middle" font-weight="400">2</text><circle cx="885" cy="570" r="31" fill="#ffffff" stroke="#ac5e32" stroke-width="2"/><text x="885" y="580" font-size="29" fill="#a05e37" text-anchor="middle" font-weight="400">1</text><circle cx="1150" cy="570" r="31" fill="#ffffff" stroke="#ac5e32" stroke-width="2"/><text x="1150" y="580" font-size="29" fill="#a05e37" text-anchor="middle" font-weight="400">0</text><line fill="none" stroke="#ac5e32" stroke-width="3" marker-end="url(#arrow)" x1="405" y1="570" x2="570" y2="570"/><text x="487" y="550" font-size="27" fill="#a05e37" text-anchor="middle" font-weight="400">取 4</text><line fill="none" stroke="#ac5e32" stroke-width="3" marker-end="url(#arrow)" x1="670" y1="570" x2="835" y2="570"/><text x="752" y="550" font-size="27" fill="#a05e37" text-anchor="middle" font-weight="400">取 1</text><line fill="none" stroke="#ac5e32" stroke-width="3" marker-end="url(#arrow)" x1="935" y1="570" x2="1100" y2="570"/><text x="1017" y="550" font-size="27" fill="#a05e37" text-anchor="middle" font-weight="400">取 1</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 671.667) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同一面额与金额，换一个递推对象就会换一个答案</text><text x="65" y="125" font-size="38.7px" fill="#213747" text-anchor="start">面额 {1,3,4}，金额6；库存无限</text><rect x="65" y="190" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="276.0" y="229" font-size="36.12px" fill="#277290" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">最小枚数</text><rect x="495" y="190" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="706.0" y="229" font-size="36.12px" fill="#277290" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">无序组合数</text><rect x="925" y="190" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1136.0" y="229" font-size="36.12px" fill="#277290" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">有序序列数</text><rect x="65" y="290" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="276.0" y="329" font-size="36.12px" fill="#a55f3a" text-anchor="middle">2：3+3</text><rect x="495" y="290" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="706.0" y="329" font-size="36.12px" fill="#a55f3a" text-anchor="middle">4 种</text><rect x="925" y="290" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ae5f34"/><text x="1136.0" y="329" font-size="36.12px" fill="#a55f3a" text-anchor="middle">9 种</text><text x="65" y="412" font-size="34.83px" fill="#213747" text-anchor="start">3+1+1+1 与 1+3+1+1：组合相同、序列不同；状态与迭代顺序先服务目标。</text></g></g></g></g></g></svg></svg>
