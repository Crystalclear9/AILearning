<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>奇异方向决定误差放大</title>
<desc>最大奇异值=1；最小奇异值=0.01；条件数=100；弱方向的逆增益=100</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">奇异方向决定误差放大</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">最大奇异值=1</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">最小奇异值=0.01</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">条件数=100</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">弱方向的逆增益=100</text>
<text x="90" y="150.0" fill="#16344c" font-size="21">最弱方向受到更强压缩；求逆时放大</text><rect x="130.0" y="222.5" width="140" height="304.5" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">最大奇异值</text><text x="130.0" y="193.5" fill="#16344c" font-size="21">1</text><rect x="555.0" y="523.95" width="140" height="3.045" fill="#d86922" /><text x="555.0" y="563.25" fill="#16344c" font-size="21">最小奇异值</text><text x="555.0" y="494.95" fill="#16344c" font-size="21">0.01</text></g></svg>
