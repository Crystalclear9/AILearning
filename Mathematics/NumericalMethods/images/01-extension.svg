<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>求和次序会改变舍入误差</title><desc>在只能保留约16位十进制有效数字的典型浮点环境中，先把巨大数与1相加，1可能被舍去，再与相反巨大数相加得到0；先抵消巨大数则得到1。图将两棵运算树放在一起，说明实数加法的结合律不能直接当成浮点程序的等价规则。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac"/></marker></defs><rect width="1200" height="800" fill="#f7fbfd"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#193e54" text-anchor="start">求和次序会改变舍入误差</text><rect x="50" y="190" width="360" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8"/><text x="65" y="227" font-size="25" fill="#193e54" text-anchor="start">10¹⁶ + 1</text><text x="65" y="265" font-size="21" fill="#193e54" text-anchor="start">舍入为10¹⁶</text><rect x="760" y="190" width="360" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8"/><text x="775" y="227" font-size="25" fill="#193e54" text-anchor="start">10¹⁶ + (-10¹⁶)</text><text x="775" y="265" font-size="21" fill="#193e54" text-anchor="start">精确抵消为0</text><path d="M230,300 L230,450" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M940,300 L940,450" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="50" y="470" width="360" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8"/><text x="65" y="507" font-size="25" fill="#193e54" text-anchor="start">再加 -10¹⁶</text><text x="65" y="545" font-size="21" fill="#193e54" text-anchor="start">结果0</text><rect x="760" y="470" width="360" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8"/><text x="775" y="507" font-size="25" fill="#193e54" text-anchor="start">再加 1</text><text x="775" y="545" font-size="21" fill="#193e54" text-anchor="start">结果1</text><text x="440" y="400" font-size="25" fill="#193e54" text-anchor="start">改变求和树</text><text x="120" y="720" font-size="22" fill="#193e54" text-anchor="start">典型binary64算例；两棵树在实数算术中等价，在浮点中不同。</text></g></svg>
