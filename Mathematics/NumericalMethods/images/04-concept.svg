<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img"><title>二分法保留的区间与中点误差界</title><desc>x平方减2在一到二区间，四次折半后区间为1.375到1.4375；中点1.40625，半宽0.03125。</desc><rect width="1280" height="790" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="36" fill="#19333c" text-anchor="start" font-weight="600">二分法保留的是包含根的区间</text><text x="60" y="112" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">f(x) = x² − 2 连续，且在 [1, 2] 严格递增；根为 √2</text><line x1="542.081528017131" y1="175" x2="542.081528017131" y2="565" stroke="#78878b" stroke-width="2" stroke-dasharray="8 6"/><text x="554.081528017131" y="190" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">√2</text><text x="65" y="243" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">n = 0</text><line x1="190" y1="235" x2="1040" y2="235" stroke="#dce4e5" stroke-width="2"/><line x1="190.0" y1="235" x2="1040.0" y2="235" stroke="#256b82" stroke-width="7"/><circle cx="190.0" cy="235" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="1040.0" cy="235" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="615.0" cy="235" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="1080" y="243" font-size="25" fill="#19333c" text-anchor="start" font-weight="400">宽 1.0</text><text x="65" y="318" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">n = 1</text><line x1="190" y1="310" x2="1040" y2="310" stroke="#dce4e5" stroke-width="2"/><line x1="190.0" y1="310" x2="615.0" y2="310" stroke="#256b82" stroke-width="7"/><circle cx="190.0" cy="310" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="615.0" cy="310" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="402.5" cy="310" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="1080" y="318" font-size="25" fill="#19333c" text-anchor="start" font-weight="400">宽 0.5</text><text x="65" y="393" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">n = 2</text><line x1="190" y1="385" x2="1040" y2="385" stroke="#dce4e5" stroke-width="2"/><line x1="402.5" y1="385" x2="615.0" y2="385" stroke="#256b82" stroke-width="7"/><circle cx="402.5" cy="385" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="615.0" cy="385" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="508.75" cy="385" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="1080" y="393" font-size="25" fill="#19333c" text-anchor="start" font-weight="400">宽 0.25</text><text x="65" y="468" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">n = 3</text><line x1="190" y1="460" x2="1040" y2="460" stroke="#dce4e5" stroke-width="2"/><line x1="508.75" y1="460" x2="615.0" y2="460" stroke="#256b82" stroke-width="7"/><circle cx="508.75" cy="460" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="615.0" cy="460" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="561.875" cy="460" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="1080" y="468" font-size="25" fill="#19333c" text-anchor="start" font-weight="400">宽 0.125</text><text x="65" y="543" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">n = 4</text><line x1="190" y1="535" x2="1040" y2="535" stroke="#dce4e5" stroke-width="2"/><line x1="508.75" y1="535" x2="561.875" y2="535" stroke="#256b82" stroke-width="7"/><circle cx="508.75" cy="535" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="561.875" cy="535" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="535.3125" cy="535" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="1080" y="543" font-size="25" fill="#19333c" text-anchor="start" font-weight="400">宽 0.0625</text><text x="190" y="618" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">1</text><text x="402.5" y="618" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">1.25</text><text x="615.0" y="618" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">1.5</text><text x="827.5" y="618" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">1.75</text><text x="1040" y="618" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">2</text><line x1="60" y1="650" x2="1220" y2="650" stroke="#dce4e5" stroke-width="2"/><text x="60" y="698" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">四次折半后：[1.375, 1.4375]；返回中点 1.40625，误差至多 0.03125。</text><text x="60" y="750" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">蓝线是保留区间，橙点是当前中点；包含保证依赖连续性与可信的端点符号。</text></g></svg>
