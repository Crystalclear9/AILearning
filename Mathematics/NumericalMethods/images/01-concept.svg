<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img"><title>可表示格点解释巨大数加一后相消</title><desc>binary64最近舍入平局取偶数，在a等于10的16次方附近间隔2；a+1不可表示，舍入为a，之后减a得到0。</desc><rect width="1280" height="750" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="36" fill="#19333c" text-anchor="start" font-weight="600">先看格点：丢失的 1 发生在相加时</text><text x="60" y="115" font-size="28" fill="#78878b" text-anchor="start" font-weight="400">a = 10 的 16 次方；binary64，最近舍入且平局取偶数</text><text x="60" y="180" font-size="29" fill="#19333c" text-anchor="start" font-weight="400">邻近可表示数，间隔为 2</text><line x1="70" y1="280" x2="1100" y2="280" stroke="#19333c" stroke-width="2"/><circle cx="340" cy="280" r="9" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="340" y="338" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">a</text><circle cx="640" cy="280" r="9" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="640" y="338" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">a + 2</text><circle cx="940" cy="280" r="9" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="940" y="338" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">a + 4</text><circle cx="490" cy="280" r="8" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="490" y="232" font-size="28" fill="#c0643c" text-anchor="middle" font-weight="400">精确和 a + 1</text><line x1="490" y1="370" x2="340" y2="370" stroke="#c0643c" stroke-width="3"/><path d="M350.53,364.25 L340.00,370.00 L350.53,375.75" stroke="#c0643c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="710" y="388" font-size="28" fill="#c0643c" text-anchor="start" font-weight="400">中点舍入回 a</text><line x1="60" y1="435" x2="1220" y2="435" stroke="#dce4e5" stroke-width="2"/><text x="60" y="498" font-size="31" fill="#256b82" text-anchor="start" font-weight="400">先加 1，再抵消</text><text x="680" y="498" font-size="31" fill="#c0643c" text-anchor="start" font-weight="400">先抵消，再加 1</text><text x="60" y="555" font-size="29" fill="#19333c" text-anchor="start" font-weight="400">round(a + 1) = a</text><text x="680" y="555" font-size="29" fill="#19333c" text-anchor="start" font-weight="400">a − a = 0</text><text x="60" y="612" font-size="32" fill="#256b82" text-anchor="start" font-weight="400">a − a = 0</text><text x="680" y="612" font-size="32" fill="#c0643c" text-anchor="start" font-weight="400">0 + 1 = 1</text><text x="60" y="699" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">最后的减法可以完全准确，但它无法恢复上一步已经丢失的信息。</text></g></svg>
