<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>相消为何放大浮点影响</title>
<desc>a=1.000001；b=1.000000；差值 a-b=0.000001；输入末位误差影响差的相对精度</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">相消为何放大浮点影响</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">a=1.000001</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">b=1.000000</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">差值 a-b=0.000001</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">输入末位误差影响差的相对精度</text>
<text x="240" y="205" font-size="40" fill="#173b51">1 . 0 0 0 0 0 1</text><text x="180" y="270" font-size="40" fill="#173b51">− 1 . 0 0 0 0 0 0</text><line x1="170" y1="295" x2="800" y2="295" stroke="#267ab0" stroke-width="3" /><text x="240" y="350" font-size="40" fill="#173b51">0 . 0 0 0 0 0 1</text><text x="830" y="340" font-size="22" fill="#173b51">差值尺度远小于输入</text></g></svg>
