<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="809.7306" viewBox="0 0 1440 809.7306" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">完整梯度、对称矩阵 Frobenius 梯度与独立坐标梯度对应同一个方向导数</title><rect width="1440" height="809.7306" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">完整梯度、对称矩阵 Frobenius 梯度与独立坐标梯度对应同一个方向导数</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="667.7306" viewBox="46.2222 107.3778 1119.2889 556.0889" role="img" x="48" y="106" overflow="hidden"><title>同一个微分，非对角梯度为什么会是 3 或 6？</title><rect width="1280" height="750" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="70" y="155" font-size="28" fill="#1a2a3b" text-anchor="start">完整矩阵梯度 G</text><rect x="95" y="220" width="88" height="88" fill="#f7f8f9"/><text x="139" y="278" font-size="32" fill="#516b7b" text-anchor="middle">0</text><rect x="190" y="220" width="88" height="88" fill="#e4eff2"/><text x="234" y="278" font-size="32" fill="#bd6a3f" text-anchor="middle">2</text><rect x="95" y="315" width="88" height="88" fill="#e4eff2"/><text x="139" y="373" font-size="32" fill="#bd6a3f" text-anchor="middle">4</text><rect x="190" y="315" width="88" height="88" fill="#f7f8f9"/><text x="234" y="373" font-size="32" fill="#516b7b" text-anchor="middle">0</text><text x="440" y="155" font-size="27" fill="#1a2a3b" text-anchor="start">对称空间的 Frobenius 梯度</text><rect x="505" y="220" width="88" height="88" fill="#f7f8f9"/><text x="549" y="278" font-size="32" fill="#516b7b" text-anchor="middle">0</text><rect x="600" y="220" width="88" height="88" fill="#e4eff2"/><text x="644" y="278" font-size="32" fill="#227292" text-anchor="middle">3</text><rect x="505" y="315" width="88" height="88" fill="#e4eff2"/><text x="549" y="373" font-size="32" fill="#227292" text-anchor="middle">3</text><rect x="600" y="315" width="88" height="88" fill="#f7f8f9"/><text x="644" y="373" font-size="32" fill="#516b7b" text-anchor="middle">0</text><text x="915" y="155" font-size="28" fill="#1a2a3b" text-anchor="start">独立坐标 c 的梯度</text><text x="1015" y="345" font-size="70" fill="#bd6a3f" text-anchor="middle">6</text><text x="80" y="490" font-size="30" fill="#1a2a3b" text-anchor="start">允许扰动 δA 的两处非对角条目，都等于同一个 δc。</text><text x="80" y="575" font-size="29" fill="#bd6a3f" text-anchor="start">完整空间：2δc + 4δc = 6δc</text><text x="80" y="635" font-size="29" fill="#227292" text-anchor="start">对称空间：3δc + 3δc = 6δc</text><text x="730" y="575" font-size="29" fill="#bd6a3f" text-anchor="start">独立坐标：6 × δc</text><text x="730" y="635" font-size="28" fill="#1a2a3b" text-anchor="start">导数相同，梯度表示不同。</text></g><desc> 同一个微分，非对角梯度为什么会是 3 或 6？</desc></svg></svg>
