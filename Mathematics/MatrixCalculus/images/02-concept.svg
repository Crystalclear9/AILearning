<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>平均损失中的批量系数</title>
<desc>样本梯度 g₁=2；样本梯度 g₂=6；求和梯度=8；均值梯度=4</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">平均损失中的批量系数</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">样本梯度 g₁=2</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">样本梯度 g₂=6</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">求和梯度=8</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">均值梯度=4</text>
<text x="90" y="150.0" fill="#16344c" font-size="21">共享参数的梯度贡献与目标归约</text><rect x="130.0" y="450.88" width="140" height="76.125" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">样本 1</text><text x="130.0" y="421.88" fill="#16344c" font-size="21">2</text><rect x="342.5" y="298.62" width="140" height="228.375" fill="#d86922" /><text x="342.5" y="563.25" fill="#16344c" font-size="21">样本 2</text><text x="342.5" y="269.62" fill="#16344c" font-size="21">6</text><rect x="555.0" y="222.5" width="140" height="304.5" fill="#12816c" /><text x="555.0" y="563.25" fill="#16344c" font-size="21">求和</text><text x="555.0" y="193.5" fill="#16344c" font-size="21">8</text><rect x="767.5" y="374.75" width="140" height="152.25" fill="#8d67b1" /><text x="767.5" y="563.25" fill="#16344c" font-size="21">均值</text><text x="767.5" y="345.75" fill="#16344c" font-size="21">4</text></g></svg>
