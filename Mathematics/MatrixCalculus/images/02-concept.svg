<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img"><title>平均损失中的批量系数</title><desc>A把两个样本的计算路径接到同一个参数，回传贡献在共享参数处相加。B用2和6复算求和梯度8、均值梯度4。C把第二个微批扩大为3个有效样本，合并均值应为5，说明微批平均不能无条件再等权平均。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#118779" /></marker></defs><rect width="1500" height="1050" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="310.0000" y2="310.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="845.0000" y2="845.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="781.6667" y2="781.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="718.3333" y2="718.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="655.0000" y2="655.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="55.00" y="65.00" font-size="34" fill="#15364c" text-anchor="start">平均损失中的批量系数</text><text x="60.00" y="125.00" font-size="25" fill="#15364c" text-anchor="start">A  核心机制与几何</text><text x="985.00" y="125.00" font-size="25" fill="#15364c" text-anchor="start">B  可复算的数值</text><text x="985.00" y="565.00" font-size="25" fill="#15364c" text-anchor="start">C  对照、变化与边界</text><line x1="945.00" y1="150.00" x2="945.00" y2="980.00" stroke="#d8e3e8" stroke-width="2" /><line x1="980.00" y1="535.00" x2="1440.00" y2="535.00" stroke="#d8e3e8" stroke-width="2" /><circle cx="186.00" cy="388.00" r="26" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="186.00" y="397.12" font-size="21" fill="#15364c" text-anchor="middle">样本1</text><circle cx="186.00" cy="707.20" r="26" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="186.00" y="716.32" font-size="21" fill="#15364c" text-anchor="middle">样本2</text><circle cx="732.00" cy="547.60" r="26" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="732.00" y="556.72" font-size="21" fill="#15364c" text-anchor="middle">参数</text><path d="M236.40,388.00 L673.20,532.40" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" /><path d="M236.40,707.20 L673.20,570.40" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" /><text x="354.00" y="372.80" font-size="25" fill="#15364c" text-anchor="start">回传2</text><text x="354.00" y="752.80" font-size="25" fill="#15364c" text-anchor="start">回传6</text><text x="606.00" y="692.00" font-size="26" fill="#15364c" text-anchor="start">总和8</text><text x="160.80" y="220.80" font-size="25" fill="#15364c" text-anchor="start">共享参数处汇流</text><text x="1040.00" y="185.00" font-size="20" fill="#15364c" text-anchor="start">相同参数点的样本梯度</text><rect x="1060.21" y="367.00" width="55.82" height="38.00" fill="#118779" /><text x="1088.12" y="358.00" font-size="21" fill="#15364c" text-anchor="middle">2</text><text x="1088.12" y="437.00" font-size="18" fill="#15364c" text-anchor="middle">g1</text><rect x="1156.46" y="291.00" width="55.82" height="114.00" fill="#cb702a" /><text x="1184.38" y="282.00" font-size="21" fill="#15364c" text-anchor="middle">6</text><text x="1184.38" y="437.00" font-size="18" fill="#15364c" text-anchor="middle">g2</text><rect x="1252.71" y="253.00" width="55.82" height="152.00" fill="#497da4" /><text x="1280.62" y="244.00" font-size="21" fill="#15364c" text-anchor="middle">8</text><text x="1280.62" y="437.00" font-size="18" fill="#15364c" text-anchor="middle">求和</text><rect x="1348.96" y="329.00" width="55.82" height="76.00" fill="#118779" /><text x="1376.88" y="320.00" font-size="21" fill="#15364c" text-anchor="middle">4</text><text x="1376.88" y="437.00" font-size="18" fill="#15364c" text-anchor="middle">均值</text><text x="1040.00" y="625.00" font-size="20" fill="#15364c" text-anchor="start">微批大小1、3</text><rect x="1080.42" y="718.33" width="111.65" height="126.67" fill="#118779" /><text x="1136.25" y="709.33" font-size="21" fill="#15364c" text-anchor="middle">4</text><text x="1136.25" y="877.00" font-size="18" fill="#15364c" text-anchor="middle">微批等权</text><rect x="1272.92" y="686.67" width="111.65" height="158.33" fill="#cb702a" /><text x="1328.75" y="677.67" font-size="21" fill="#15364c" text-anchor="middle">5</text><text x="1328.75" y="877.00" font-size="18" fill="#15364c" text-anchor="middle">按有效计数加权</text><text x="1032" y="411" text-anchor="end" font-size="18" fill="#15364c">0</text><text x="1032" y="316" text-anchor="end" font-size="18" fill="#15364c">5</text><text x="1032" y="221" text-anchor="end" font-size="18" fill="#15364c">10</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /><text x="1032" y="851" text-anchor="end" font-size="18" fill="#15364c">0</text><text x="1032" y="787.667" text-anchor="end" font-size="18" fill="#15364c">2</text><text x="1032" y="724.333" text-anchor="end" font-size="18" fill="#15364c">4</text><text x="1032" y="661" text-anchor="end" font-size="18" fill="#15364c">6</text><line x1="1040" x2="1425" y1="845.0000" y2="845.0000" stroke="#95adba" stroke-width="2" /></g></svg>
