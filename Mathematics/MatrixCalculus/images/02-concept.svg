<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>同一残差矩阵，平均轴不同，梯度就差一个输出数</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">同一残差矩阵，平均轴不同，梯度就差一个输出数</text><text x="55" y="165" font-size="26" fill="#19333c" text-anchor="start">残差 R</text><rect x="100" y="260" width="92" height="92" fill="#e6eff2"/><text x="146" y="319" font-size="32" fill="#256b82" text-anchor="middle">1</text><rect x="200" y="260" width="92" height="92" fill="#e6eff2"/><text x="246" y="319" font-size="32" fill="#256b82" text-anchor="middle">2</text><rect x="100" y="360" width="92" height="92" fill="#e6eff2"/><text x="146" y="419" font-size="32" fill="#256b82" text-anchor="middle">3</text><rect x="200" y="360" width="92" height="92" fill="#e6eff2"/><text x="246" y="419" font-size="32" fill="#256b82" text-anchor="middle">4</text><text x="55" y="555" font-size="29" fill="#19333c" text-anchor="start">平方和 = 30</text><text x="55" y="625" font-size="27" fill="#19333c" text-anchor="start">同一组预测与标签</text><text x="465" y="165" font-size="26" fill="#19333c" text-anchor="start">按样本平均：R 的一半</text><rect x="510" y="260" width="92" height="92" fill="#e6eff2"/><text x="556" y="319" font-size="32" fill="#256b82" text-anchor="middle">0.5</text><rect x="610" y="260" width="92" height="92" fill="#e6eff2"/><text x="656" y="319" font-size="32" fill="#256b82" text-anchor="middle">1</text><rect x="510" y="360" width="92" height="92" fill="#e6eff2"/><text x="556" y="419" font-size="32" fill="#256b82" text-anchor="middle">1.5</text><rect x="610" y="360" width="92" height="92" fill="#e6eff2"/><text x="656" y="419" font-size="32" fill="#256b82" text-anchor="middle">2</text><text x="465" y="555" font-size="29" fill="#19333c" text-anchor="start">损失 = 7.5</text><text x="465" y="625" font-size="27" fill="#19333c" text-anchor="start">偏置梯度 (2, 3)</text><text x="875" y="165" font-size="26" fill="#19333c" text-anchor="start">按元素平均：R 的四分之一</text><rect x="920" y="260" width="92" height="92" fill="#e6eff2"/><text x="966" y="319" font-size="32" fill="#256b82" text-anchor="middle">0.25</text><rect x="1020" y="260" width="92" height="92" fill="#e6eff2"/><text x="1066" y="319" font-size="32" fill="#256b82" text-anchor="middle">0.5</text><rect x="920" y="360" width="92" height="92" fill="#e6eff2"/><text x="966" y="419" font-size="32" fill="#256b82" text-anchor="middle">0.75</text><rect x="1020" y="360" width="92" height="92" fill="#e6eff2"/><text x="1066" y="419" font-size="32" fill="#256b82" text-anchor="middle">1</text><text x="875" y="555" font-size="29" fill="#19333c" text-anchor="start">损失 = 3.75</text><text x="875" y="625" font-size="27" fill="#19333c" text-anchor="start">偏置梯度 (1, 1.5)</text><text x="75" y="720" font-size="29" fill="#19333c" text-anchor="start">局部偏置反向始终沿样本求和；目标的分母已经在上游梯度里。</text></g></svg>
