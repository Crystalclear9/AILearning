<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img"><title>雅可比矩阵编码输入输出形状</title><desc>A把f=(x1²,x1x2)的两条输出依赖画到二维雅可比矩阵：在(1,2)处为[[2,0],[2,1]]。B选输入扰动方向(1,0)，一阶输出方向为(2,2)。C对比J与J转置的作用结果，说明向前传播扰动和向后传播敏感性具有不同形状与含义。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#118779" /></marker></defs><rect width="1500" height="1050" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55.00" y="65.00" font-size="34" fill="#15364c" text-anchor="start">雅可比矩阵编码输入输出形状</text><text x="60.00" y="125.00" font-size="25" fill="#15364c" text-anchor="start">A  核心机制与几何</text><text x="985.00" y="125.00" font-size="25" fill="#15364c" text-anchor="start">B  可复算的数值</text><text x="985.00" y="565.00" font-size="25" fill="#15364c" text-anchor="start">C  对照、变化与边界</text><line x1="945.00" y1="150.00" x2="945.00" y2="980.00" stroke="#d8e3e8" stroke-width="2" /><line x1="980.00" y1="535.00" x2="1440.00" y2="535.00" stroke="#d8e3e8" stroke-width="2" /><text x="93.60" y="220.80" font-size="25" fill="#15364c" text-anchor="start">在x=(1,2)处，画出每条局部导数</text><circle cx="160.80" cy="403.20" r="25" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="160.80" y="412.32" font-size="21" fill="#15364c" text-anchor="middle">x1=1</text><circle cx="160.80" cy="692.00" r="25" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="160.80" y="701.12" font-size="21" fill="#15364c" text-anchor="middle">x2=2</text><circle cx="706.80" cy="403.20" r="25" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="706.80" y="412.32" font-size="21" fill="#15364c" text-anchor="middle">f1=1</text><circle cx="706.80" cy="692.00" r="25" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="706.80" y="701.12" font-size="21" fill="#15364c" text-anchor="middle">f2=2</text><path d="M202.80,403.20 L664.80,403.20" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" /><text x="412.80" y="372.80" font-size="24" fill="#15364c" text-anchor="start">2x1=2</text><path d="M202.80,418.40 L664.80,669.20" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" /><text x="345.60" y="555.20" font-size="24" fill="#cb702a" text-anchor="start">x2=2</text><path d="M202.80,692.00 L664.80,692.00" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" /><text x="421.20" y="752.80" font-size="24" fill="#15364c" text-anchor="start">x1=1</text><text x="211.20" y="874.40" font-size="25" fill="#15364c" text-anchor="start">缺失的x2→f1支路：导数0；J=[[2,0],[2,1]]</text><path d="M1035.20,325.00 L1371.00,325.00" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" /><circle cx="1035.20" cy="325.00" r="20" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="1035.20" y="328.96" font-size="21" fill="#15364c" text-anchor="middle">Δx</text><circle cx="1371.00" cy="325.00" r="20" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="1371.00" y="328.96" font-size="21" fill="#15364c" text-anchor="middle">Δf</text><text x="1003.00" y="232.60" font-size="24" fill="#15364c" text-anchor="start">(1,0)</text><text x="1274.40" y="232.60" font-size="23" fill="#15364c" text-anchor="start">J(1,0)=(2,2)</text><text x="1072.00" y="424.00" font-size="21" fill="#15364c" text-anchor="start">一阶方向，不是有限差分等式</text><text x="1007.60" y="633.00" font-size="21" fill="#15364c" text-anchor="start">转置改变传播对象</text><text x="1015.60" y="696.36" font-size="20" fill="#15364c" text-anchor="start">映射</text><text x="1150.53" y="696.36" font-size="20" fill="#15364c" text-anchor="start">输入(1,0)</text><text x="1285.47" y="696.36" font-size="20" fill="#15364c" text-anchor="start">结果</text><rect x="1007.60" y="712.20" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1075.07" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">J</text><rect x="1142.53" y="712.20" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1210.00" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">方向</text><rect x="1277.47" y="712.20" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1344.93" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">(2,2)</text><rect x="1007.60" y="751.80" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1075.07" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">Jᵀ</text><rect x="1142.53" y="751.80" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1210.00" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">敏感性</text><rect x="1277.47" y="751.80" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1344.93" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">(2,0)</text></g></svg>
