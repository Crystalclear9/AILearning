<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>雅可比矩阵编码输入输出形状</title>
<desc>输入 x∈R²；输出 f=(x₁²,x₁x₂)；在 x=(1,2)；J=[[2,0],[2,1]]</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">雅可比矩阵编码输入输出形状</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">输入 x∈R²</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">输出 f=(x₁²,x₁x₂)</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">在 x=(1,2)</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">J=[[2,0],[2,1]]</text>
<rect x="110" y="190" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="128" y="233" font-size="22" fill="#173b51">f₁ 对 x₁ 的偏导 = 2</text><rect x="690" y="190" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="708" y="233" font-size="22" fill="#173b51">f₁ 对 x₂ 的偏导 = 0</text><rect x="110" y="340" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="128" y="383" font-size="22" fill="#173b51">f₂ 对 x₁ 的偏导 = 2</text><rect x="690" y="340" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="708" y="383" font-size="22" fill="#173b51">f₂ 对 x₂ 的偏导 = 1</text><text x="510" y="175" font-size="22" fill="#173b51">输入坐标：列</text><text x="15" y="315" font-size="22" fill="#173b51">输出：行</text></g></svg>
