<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>线性层反传是一对互为伴随的映射</title><desc>取 W=[[1,2],[3,4]]，前向扰动满足 Δy=WΔx。若输出敏感性为g=(1,−1)，则输入敏感性为Wᵀg=(−2,−2)。任取Δx=(1,0)，输出内积g·Δy与输入内积(Wᵀg)·Δx都等于−2，这是转置出现的可复核依据。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac"/></marker></defs><rect width="1200" height="800" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#193e54" text-anchor="start">线性层反传是一对互为伴随的映射</text><rect x="55" y="210" width="330" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8"/><text x="70" y="247" font-size="25" fill="#193e54" text-anchor="start">Δx=(1,0)</text><text x="70" y="285" font-size="21" fill="#193e54" text-anchor="start">输入扰动</text><rect x="750" y="210" width="330" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8"/><text x="765" y="247" font-size="25" fill="#193e54" text-anchor="start">Δy=(1,3)</text><text x="765" y="285" font-size="21" fill="#193e54" text-anchor="start">WΔx</text><path d="M400,255 L735,255" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="475" y="225" font-size="24" fill="#193e54" text-anchor="start">前向乘 W</text><rect x="750" y="480" width="330" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8"/><text x="765" y="517" font-size="25" fill="#193e54" text-anchor="start">g=(1,-1)</text><text x="765" y="555" font-size="21" fill="#193e54" text-anchor="start">输出敏感性</text><rect x="55" y="480" width="330" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8"/><text x="70" y="517" font-size="25" fill="#193e54" text-anchor="start">Wᵀg=(-2,-2)</text><text x="70" y="555" font-size="21" fill="#193e54" text-anchor="start">输入敏感性</text><path d="M735,525 L400,525" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="455" y="495" font-size="24" fill="#193e54" text-anchor="start">反向乘 Wᵀ</text><text x="150" y="700" font-size="22" fill="#193e54" text-anchor="start">两侧内积都为 -2：线性映射与伴随对同一变化给出一致预测。</text></g></svg>