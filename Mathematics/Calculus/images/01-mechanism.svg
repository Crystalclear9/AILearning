<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>同一个输入，为什么要算两次？</title><desc>输入 x 在平方和恒等两支路被复用。x=2 时一阶变化分别为 4h 与 h。h=0.1 时精确输出增加 0.51，其中 0.50 为线性项，0.01 为平方支路余项。</desc><rect width="1200" height="750" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="44" y="58" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">同一个输入，为什么要算两次？</text><text x="44" y="105" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">L(x) = x² + x     ·     在 x = 2 附近追踪一次扰动</text><path d="M190 302 C300 302 290 205 420 205 L740 205 C850 205 840 302 980 302" fill="none" stroke="#256b82" stroke-width="5"/><path d="M190 302 C300 302 290 395 420 395 L740 395 C850 395 840 302 980 302" fill="none" stroke="#c0643c" stroke-width="5"/><circle cx="420" cy="205" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="740" cy="205" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="420" cy="395" r="6" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="740" cy="395" r="6" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="170" cy="302" r="32" fill="white" stroke="#19333c" stroke-width="2"/><text x="170" y="312" font-size="30" fill="#19333c" text-anchor="middle" font-weight="400">x</text><circle cx="1008" cy="302" r="32" fill="white" stroke="#19333c" stroke-width="2"/><text x="1008" y="312" font-size="34" fill="#19333c" text-anchor="middle" font-weight="400">+</text><text x="580" y="180" font-size="27" fill="#256b82" text-anchor="middle" font-weight="400">平方支路   u = x²</text><text x="580" y="244" font-size="30" fill="#256b82" text-anchor="middle" font-weight="400">变化 ≈ 4h</text><text x="580" y="370" font-size="27" fill="#c0643c" text-anchor="middle" font-weight="400">恒等支路   v = x</text><text x="580" y="436" font-size="30" fill="#c0643c" text-anchor="middle" font-weight="400">变化 = h</text><text x="80" y="375" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">x → x + h</text><text x="1020" y="230" font-size="28" fill="#19333c" text-anchor="middle" font-weight="400">L = 6</text><text x="1008" y="375" font-size="27" fill="#19333c" text-anchor="middle" font-weight="400">变化 ≈ 5h</text><line x1="44" y1="485" x2="1155" y2="485" stroke="#dce4e5" stroke-width="2"/><text x="44" y="536" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">让 h = 0.1，检查实际增加了多少</text><rect x="65" y="575" width="560" height="48" fill="#dbecef" stroke="none" stroke-width="2"/><rect x="625" y="575" width="140" height="48" fill="#f3ddd0" stroke="none" stroke-width="2"/><rect x="765" y="575" width="14" height="48" fill="#19333c" stroke="none" stroke-width="2"/><text x="345" y="609" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">平方支路的一阶项 0.40</text><text x="695" y="609" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">0.10</text><text x="893" y="606" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">余项 0.01</text><line x1="779" y1="599" x2="870" y2="599" stroke="#19333c" stroke-width="1"/><line x1="65" y1="641" x2="765" y2="641" stroke="#78878b" stroke-width="2"/><line x1="65" y1="635" x2="65" y2="650" stroke="#78878b" stroke-width="2"/><line x1="765" y1="635" x2="765" y2="650" stroke="#78878b" stroke-width="2"/><text x="415" y="682" font-size="28" fill="#19333c" text-anchor="middle" font-weight="400">线性预测 0.50</text><text x="1155" y="711" font-size="29" fill="#19333c" text-anchor="end" font-weight="400">实际增量 0.51</text></g></svg>
