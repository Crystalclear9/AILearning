<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>同一计算图：前向传播扰动，反向汇总敏感性</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">同一计算图：前向传播扰动，反向汇总敏感性</text><text x="60" y="115" font-size="28" fill="#71858b" text-anchor="start">固定 x = 1，y = 2；u = x²，v = x + y，L = uv = 3</text><text x="70" y="180" font-size="29" fill="#256b82" text-anchor="start">前向：输入方向 (1, −1)</text><line x1="110" y1="290" x2="330" y2="290" stroke="#256b82" stroke-width="3"/><polygon points="270.0,290.0 258.0,284.0 258.0,296.0" fill="#256b82"/><line x1="110" y1="290" x2="330" y2="500" stroke="#256b82" stroke-width="3"/><polygon points="286.5986673513857,458.57145519905 282.06125530175785,445.94561297399855 273.7755463415678,454.6258795037214" fill="#256b82"/><line x1="110" y1="500" x2="330" y2="500" stroke="#256b82" stroke-width="3"/><polygon points="270.0,500.0 258.0,494.0 258.0,506.0" fill="#256b82"/><line x1="330" y1="290" x2="520" y2="395" stroke="#256b82" stroke-width="3"/><polygon points="467.4855078736438,365.97883329859263 459.88472611851336,354.9231507456755 454.08049277823187,365.4260491709468" fill="#256b82"/><line x1="330" y1="500" x2="520" y2="395" stroke="#256b82" stroke-width="3"/><polygon points="467.4855078736438,424.02116670140737 454.08049277823187,424.5739508290532 459.88472611851336,435.0768492543245" fill="#256b82"/><rect x="62" y="267" width="96" height="46" fill="white"/><text x="110" y="299" font-size="27" fill="#19333c" text-anchor="middle">x = 1</text><rect x="62" y="477" width="96" height="46" fill="white"/><text x="110" y="509" font-size="27" fill="#19333c" text-anchor="middle">y = 2</text><rect x="282" y="267" width="96" height="46" fill="white"/><text x="330" y="299" font-size="27" fill="#19333c" text-anchor="middle">u = 1</text><rect x="282" y="477" width="96" height="46" fill="white"/><text x="330" y="509" font-size="27" fill="#19333c" text-anchor="middle">v = 3</text><rect x="472" y="372" width="96" height="46" fill="white"/><text x="520" y="404" font-size="27" fill="#19333c" text-anchor="middle">L = 3</text><text x="110" y="352" font-size="25" fill="#256b82" text-anchor="middle">扰动率 1</text><text x="110" y="562" font-size="25" fill="#256b82" text-anchor="middle">扰动率 -1</text><text x="330" y="352" font-size="25" fill="#256b82" text-anchor="middle">扰动率 2</text><text x="330" y="562" font-size="25" fill="#256b82" text-anchor="middle">扰动率 0</text><text x="520" y="457" font-size="25" fill="#256b82" text-anchor="middle">扰动率 6</text><text x="690" y="180" font-size="29" fill="#c0643c" text-anchor="start">反向：从 L 的敏感性 1 开始</text><line x1="730" y1="290" x2="950" y2="290" stroke="#c0643c" stroke-width="3"/><polygon points="790.0,290.0 802.0,296.0 802.0,284.0" fill="#c0643c"/><line x1="730" y1="290" x2="950" y2="500" stroke="#c0643c" stroke-width="3"/><polygon points="773.4013326486144,331.42854480095 777.9387446982422,344.05438702600145 786.2244536584323,335.3741204962786" fill="#c0643c"/><line x1="730" y1="500" x2="950" y2="500" stroke="#c0643c" stroke-width="3"/><polygon points="790.0,500.0 802.0,506.0 802.0,494.0" fill="#c0643c"/><line x1="950" y1="290" x2="1140" y2="395" stroke="#c0643c" stroke-width="3"/><polygon points="1002.5144921263562,319.02116670140737 1010.1152738814868,330.0768492543245 1015.9195072217682,319.5739508290532" fill="#c0643c"/><line x1="950" y1="500" x2="1140" y2="395" stroke="#c0643c" stroke-width="3"/><polygon points="1002.5144921263562,470.97883329859263 1015.9195072217682,470.4260491709468 1010.1152738814868,459.9231507456755" fill="#c0643c"/><rect x="682" y="267" width="96" height="46" fill="white"/><text x="730" y="299" font-size="27" fill="#19333c" text-anchor="middle">x = 1</text><rect x="682" y="477" width="96" height="46" fill="white"/><text x="730" y="509" font-size="27" fill="#19333c" text-anchor="middle">y = 2</text><rect x="902" y="267" width="96" height="46" fill="white"/><text x="950" y="299" font-size="27" fill="#19333c" text-anchor="middle">u = 1</text><rect x="902" y="477" width="96" height="46" fill="white"/><text x="950" y="509" font-size="27" fill="#19333c" text-anchor="middle">v = 3</text><rect x="1092" y="372" width="96" height="46" fill="white"/><text x="1140" y="404" font-size="27" fill="#19333c" text-anchor="middle">L = 3</text><text x="730" y="352" font-size="25" fill="#c0643c" text-anchor="middle">敏感性 7</text><text x="730" y="562" font-size="25" fill="#c0643c" text-anchor="middle">敏感性 1</text><text x="950" y="352" font-size="25" fill="#c0643c" text-anchor="middle">敏感性 3</text><text x="950" y="562" font-size="25" fill="#c0643c" text-anchor="middle">敏感性 1</text><text x="1140" y="457" font-size="25" fill="#c0643c" text-anchor="middle">敏感性 1</text><line x1="60" y1="615" x2="1220" y2="615" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="675" font-size="27" fill="#256b82" text-anchor="start">前向：u 的扰动率 = 2，v 的扰动率 = 0，L 的扰动率 = 3 × 2 + 1 × 0 = 6。</text><text x="60" y="730" font-size="26" fill="#c0643c" text-anchor="start">反向：x 经 u 贡献 3 × 2 = 6，经 v 贡献 1 × 1 = 1；合计 7，y 的敏感性为 1。</text><text x="60" y="790" font-size="27" fill="#19333c" text-anchor="start">同一方向的两种算法一致：7 × 1 + 1 × (−1) = 6。</text></g></svg>
