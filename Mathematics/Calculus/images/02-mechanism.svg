<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img"><title>同样的步长，遇到不同曲率会怎样？</title><desc>目标a*w²，初值1。左图a1,eta.2时倍率.6，a4,eta.2时倍率-.6；右图a4,eta.3倍率-1.4发散。横轴整数迭代次数0到8，两图纵轴范围明确不同。</desc><rect width="1200" height="715" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">同样的步长，遇到不同曲率会怎样？</text><text x="40" y="103" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">f(w) = aw²；w(0) = 1；每步倍率为 1 − 2aη</text><text x="95" y="170" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">同用学习率：η = 0.2</text><line x1="95" y1="570" x2="487" y2="570" stroke="#dce4e5" stroke-width="2"/><text x="80" y="578" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">-1</text><line x1="95" y1="420" x2="487" y2="420" stroke="#dce4e5" stroke-width="2"/><text x="80" y="428" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">0</text><line x1="95" y1="270" x2="487" y2="270" stroke="#dce4e5" stroke-width="2"/><text x="80" y="278" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">1</text><line x1="95" y1="600" x2="487" y2="600" stroke="#78878b" stroke-width="2"/><text x="95" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0</text><text x="193" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">2</text><text x="291" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">4</text><text x="389" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">6</text><text x="487" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">8</text><path d="M95.00,270.00 L144.00,330.00 L193.00,366.00 L242.00,387.60 L291.00,400.56 L340.00,408.34 L389.00,413.00 L438.00,415.80 L487.00,417.48" stroke="#256b82" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="95" cy="270.0" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="144" cy="330.0" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="193" cy="366.0" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="242" cy="387.6" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="291" cy="400.56" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="340" cy="408.336" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="389" cy="413.0016" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="438" cy="415.80096" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="487" cy="417.480576" r="5" fill="#256b82" stroke="#256b82" stroke-width="2"/><path d="M95.00,270.00 L144.00,510.00 L193.00,366.00 L242.00,452.40 L291.00,400.56 L340.00,431.66 L389.00,413.00 L438.00,424.20 L487.00,417.48" stroke="#c0643c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="95" cy="270.0" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="144" cy="510.0" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="193" cy="366.0" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="242" cy="452.4" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="291" cy="400.56" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="340" cy="431.664" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="389" cy="413.0016" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="438" cy="424.19904" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="487" cy="417.480576" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="95" y="211" font-size="25" fill="#256b82" text-anchor="start" font-weight="400">蓝：a = 1，乘 0.6</text><text x="95" y="249" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">橙：a = 4，乘 −0.6</text><text x="700" y="170" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">增大学习率：η = 0.3</text><line x1="700" y1="600" x2="1092" y2="600" stroke="#dce4e5" stroke-width="2"/><text x="685" y="608" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">-15</text><line x1="700" y1="420" x2="1092" y2="420" stroke="#dce4e5" stroke-width="2"/><text x="685" y="428" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">0</text><line x1="700" y1="240" x2="1092" y2="240" stroke="#dce4e5" stroke-width="2"/><text x="685" y="248" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">15</text><line x1="700" y1="600" x2="1092" y2="600" stroke="#78878b" stroke-width="2"/><text x="700" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0</text><text x="798" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">2</text><text x="896" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">4</text><text x="994" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">6</text><text x="1092" y="633" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">8</text><path d="M700.00,408.00 L749.00,436.80 L798.00,396.48 L847.00,452.93 L896.00,373.90 L945.00,484.54 L994.00,329.65 L1043.00,546.50 L1092.00,242.91" stroke="#c0643c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="700" cy="408.0" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="749" cy="436.8" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="798" cy="396.48" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="847" cy="452.928" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="896" cy="373.9008" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="945" cy="484.53887999999995" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="994" cy="329.645568" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="1043" cy="546.4962048" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="1092" cy="242.9053132800001" r="5" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="700" y="212" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">a = 4：每步乘 −1.4</text><text x="40" y="690" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">横轴都是迭代次数；右图纵轴范围更大，振幅增长与交替符号要分别判断。</text></g></svg>
