<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img"><title>同一个二次目标：曲率和步长共同决定倍率</title><rect width="1280" height="900" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">同一个二次目标：曲率和步长共同决定倍率</text><text x="60" y="115" font-size="28" fill="#71858b" text-anchor="start">统一目标 f(w) = a w² 的一半；每步倍率 1 − aη，初值均为 1</text><line x1="115" y1="660" x2="545" y2="660" stroke="#dbe5e8" stroke-width="2"/><text x="103" y="668" font-size="24" fill="#71858b" text-anchor="end">-1</text><line x1="115" y1="500" x2="545" y2="500" stroke="#dbe5e8" stroke-width="2"/><text x="103" y="508" font-size="24" fill="#71858b" text-anchor="end">0</text><line x1="115" y1="340" x2="545" y2="340" stroke="#dbe5e8" stroke-width="2"/><text x="103" y="348" font-size="24" fill="#71858b" text-anchor="end">1</text><text x="115" y="690" font-size="24" fill="#71858b" text-anchor="middle">0</text><text x="217" y="690" font-size="24" fill="#71858b" text-anchor="middle">2</text><text x="319" y="690" font-size="24" fill="#71858b" text-anchor="middle">4</text><text x="421" y="690" font-size="24" fill="#71858b" text-anchor="middle">6</text><text x="523" y="690" font-size="24" fill="#71858b" text-anchor="middle">8</text><path d="M115.00,340.00 L166.00,388.00 L217.00,421.60 L268.00,445.12 L319.00,461.58 L370.00,473.11 L421.00,481.18 L472.00,486.82 L523.00,490.78" fill="none" stroke="#256b82" stroke-width="4"/><circle cx="115" cy="340.0" r="5" fill="#256b82"/><circle cx="166" cy="388.0" r="5" fill="#256b82"/><circle cx="217" cy="421.6" r="5" fill="#256b82"/><circle cx="268" cy="445.12" r="5" fill="#256b82"/><circle cx="319" cy="461.584" r="5" fill="#256b82"/><circle cx="370" cy="473.10880000000003" r="5" fill="#256b82"/><circle cx="421" cy="481.17616" r="5" fill="#256b82"/><circle cx="472" cy="486.823312" r="5" fill="#256b82"/><circle cx="523" cy="490.7763184" r="5" fill="#256b82"/><path d="M115.00,340.00 L166.00,580.00 L217.00,460.00 L268.00,520.00 L319.00,490.00 L370.00,505.00 L421.00,497.50 L472.00,501.25 L523.00,499.38" fill="none" stroke="#c0643c" stroke-width="4"/><circle cx="115" cy="340.0" r="5" fill="#c0643c"/><circle cx="166" cy="580.0" r="5" fill="#c0643c"/><circle cx="217" cy="460.0" r="5" fill="#c0643c"/><circle cx="268" cy="520.0" r="5" fill="#c0643c"/><circle cx="319" cy="490.0" r="5" fill="#c0643c"/><circle cx="370" cy="505.0" r="5" fill="#c0643c"/><circle cx="421" cy="497.5" r="5" fill="#c0643c"/><circle cx="472" cy="501.25" r="5" fill="#c0643c"/><circle cx="523" cy="499.375" r="5" fill="#c0643c"/><text x="115" y="185" font-size="28" fill="#19333c" text-anchor="start">η = 0.15：a = 2 与 a = 10</text><text x="115" y="230" font-size="27" fill="#71858b" text-anchor="start">倍率 0.7（蓝）、−0.5（橙）</text><line x1="735" y1="740" x2="1165" y2="740" stroke="#dbe5e8" stroke-width="2"/><text x="723" y="748" font-size="24" fill="#71858b" text-anchor="end">-30</text><line x1="735" y1="620" x2="1165" y2="620" stroke="#dbe5e8" stroke-width="2"/><text x="723" y="628" font-size="24" fill="#71858b" text-anchor="end">-15</text><line x1="735" y1="500" x2="1165" y2="500" stroke="#dbe5e8" stroke-width="2"/><text x="723" y="508" font-size="24" fill="#71858b" text-anchor="end">0</text><line x1="735" y1="380" x2="1165" y2="380" stroke="#dbe5e8" stroke-width="2"/><text x="723" y="388" font-size="24" fill="#71858b" text-anchor="end">15</text><line x1="735" y1="260" x2="1165" y2="260" stroke="#dbe5e8" stroke-width="2"/><text x="723" y="268" font-size="24" fill="#71858b" text-anchor="end">30</text><text x="735" y="805" font-size="24" fill="#71858b" text-anchor="middle">0</text><text x="837" y="805" font-size="24" fill="#71858b" text-anchor="middle">2</text><text x="939" y="805" font-size="24" fill="#71858b" text-anchor="middle">4</text><text x="1041" y="805" font-size="24" fill="#71858b" text-anchor="middle">6</text><text x="1143" y="805" font-size="24" fill="#71858b" text-anchor="middle">8</text><path d="M735.00,492.00 L786.00,512.00 L837.00,482.00 L888.00,527.00 L939.00,459.50 L990.00,560.75 L1041.00,408.88 L1092.00,636.69 L1143.00,294.97" fill="none" stroke="#c0643c" stroke-width="4"/><circle cx="735" cy="492.0" r="5" fill="#c0643c"/><circle cx="786" cy="512.0" r="5" fill="#c0643c"/><circle cx="837" cy="482.0" r="5" fill="#c0643c"/><circle cx="888" cy="527.0" r="5" fill="#c0643c"/><circle cx="939" cy="459.5" r="5" fill="#c0643c"/><circle cx="990" cy="560.75" r="5" fill="#c0643c"/><circle cx="1041" cy="408.875" r="5" fill="#c0643c"/><circle cx="1092" cy="636.6875" r="5" fill="#c0643c"/><circle cx="1143" cy="294.96875" r="5" fill="#c0643c"/><text x="735" y="185" font-size="28" fill="#19333c" text-anchor="start">a = 10：η 改为 0.25</text><text x="735" y="230" font-size="27" fill="#71858b" text-anchor="start">倍率 −1.5，振幅增长</text><text x="60" y="875" font-size="25" fill="#71858b" text-anchor="start">横轴为更新次数；左右使用不同纵轴范围，分别看同侧收敛、交替收敛与交替发散。</text></g></svg>
