<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="548" viewBox="0 47 960 548" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">滑动窗口的上下文与目标计分归属</title><desc id="artwork-desc">以同一文档的 A,B,C,D,E,F 六个 token 为例，不额外添加起始符，因而第一个 token A 不计分。长度为四的窗口一读取 A,B,C,D，对目标 B,C,D 计分；窗口二读取 C,D,E,F，只对新目标 E,F 计分。C,D 再次出现是为了提供历史，不应再次增加它们的损失或分母。图中色块按目标索引标记对应的移位损失；预测目标时仍使用因果历史，不允许读取目标自身或后续 token。 这套协议的有效目标数是 5，而不是两个窗口各计三个目标得到的 6。E 在窗口二中只有 C,D 两个历史 token，F 只有 C,D,E；因此唯一计分与完整上下文是两个独立要求。与无限上下文的完整文档似然比较时，必须记录这种历史截断，不能只核对分母相同就认定评分对象相同。 上下文可以重叠，计分目标只计一次</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="497.028112"/></clipPath></defs><rect width="960" height="595" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(13.427011 14.480619) scale(0.913655)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="extra-title">上下文可以重叠，计分目标只计一次</title><desc id="extra-desc">以同一文档的 A,B,C,D,E,F 六个 token 为例，不额外添加起始符，因而第一个 token A 不计分。长度为四的窗口一读取 A,B,C,D，对目标 B,C,D 计分；窗口二读取 C,D,E,F，只对新目标 E,F 计分。C,D 再次出现是为了提供历史，不应再次增加它们的损失或分母。图中色块按目标索引标记对应的移位损失；预测目标时仍使用因果历史，不允许读取目标自身或后续 token。

这套协议的有效目标数是 5，而不是两个窗口各计三个目标得到的 6。E 在窗口二中只有 C,D 两个历史 token，F 只有 C,D,E；因此唯一计分与完整上下文是两个独立要求。与无限上下文的完整文档似然比较时，必须记录这种历史截断，不能只核对分母相同就认定评分对象相同。 上下文可以重叠，计分目标只计一次</desc><rect width="1200" height="635" fill="white"/><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cb7436"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="112" font-size="29.004396px" fill="#2472b1" text-anchor="start" font-weight="400">蓝格：该目标计分；灰格：仅作上下文</text><text x="357" y="170" font-size="29" fill="#1f3449" text-anchor="middle" font-weight="400">A</text><text x="472" y="170" font-size="29" fill="#1f3449" text-anchor="middle" font-weight="400">B</text><text x="587" y="170" font-size="29" fill="#1f3449" text-anchor="middle" font-weight="400">C</text><text x="702" y="170" font-size="29" fill="#1f3449" text-anchor="middle" font-weight="400">D</text><text x="817" y="170" font-size="29" fill="#1f3449" text-anchor="middle" font-weight="400">E</text><text x="932" y="170" font-size="29" fill="#1f3449" text-anchor="middle" font-weight="400">F</text><text x="45" y="255" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">窗口 1</text><rect x="305" y="215" width="105" height="70" rx="6" fill="#edf0f3" stroke="#d9e1e8" stroke-width="1.5"/><text x="357.5" y="260.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">A</text><rect x="420" y="215" width="105" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#d9e1e8" stroke-width="1.5"/><text x="472.5" y="260.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">B</text><line x1="430" y1="281" x2="515" y2="281" stroke="#176fa3" stroke-width="5"/><rect x="535" y="215" width="105" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#d9e1e8" stroke-width="1.5"/><text x="587.5" y="260.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">C</text><line x1="545" y1="281" x2="630" y2="281" stroke="#176fa3" stroke-width="5"/><rect x="650" y="215" width="105" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#d9e1e8" stroke-width="1.5"/><text x="702.5" y="260.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">D</text><line x1="660" y1="281" x2="745" y2="281" stroke="#176fa3" stroke-width="5"/><text x="45" y="380" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">窗口 2</text><rect x="535" y="340" width="105" height="70" rx="6" fill="#edf0f3" stroke="#d9e1e8" stroke-width="1.5"/><text x="587.5" y="385.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">C</text><rect x="650" y="340" width="105" height="70" rx="6" fill="#edf0f3" stroke="#d9e1e8" stroke-width="1.5"/><text x="702.5" y="385.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">D</text><rect x="765" y="340" width="105" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#d9e1e8" stroke-width="1.5"/><text x="817.5" y="385.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">E</text><line x1="775" y1="406" x2="860" y2="406" stroke="#176fa3" stroke-width="5"/><rect x="880" y="340" width="105" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#d9e1e8" stroke-width="1.5"/><text x="932.5" y="385.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">F</text><line x1="890" y1="406" x2="975" y2="406" stroke="#176fa3" stroke-width="5"/><text x="45" y="520" font-size="29.004396px" fill="#1f3449" text-anchor="start" font-weight="400">累计计分次数</text><text x="357" y="520" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">0</text><text x="472" y="520" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">1</text><text x="587" y="520" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">1</text><text x="702" y="520" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">1</text><text x="817" y="520" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">1</text><text x="932" y="520" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">1</text><text x="445" y="585" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">B 至 F 各计一次，共 5 个目标</text></g></g></g></g></svg>