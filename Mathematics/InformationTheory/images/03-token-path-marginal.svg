<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="778.3816" viewBox="0 0 1440 778.3816" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">同一字符串由两条已终止的 token 路径产生，字符串概率需相加</title><rect width="1440" height="778.3816" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">同一字符串由两条已终止的 token 路径产生，字符串概率需相加</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="636.3816" viewBox="36.2667 83.2 1207.4667 571.7333" role="img" x="48" y="106" overflow="hidden"><title>同一字符串可以由不同 token 路径生成</title><rect width="1280" height="730" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="70" y="130" font-size="29" fill="#1a2a3b" text-anchor="start">合法生成树：所有分支最终终止</text><rect x="95" y="327" width="110" height="56" fill="#f0f5f6"/><text x="150" y="365" font-size="28" fill="#1a2a3b" text-anchor="middle">BOS</text><rect x="385" y="197" width="110" height="56" fill="#f0f5f6"/><text x="440" y="235" font-size="28" fill="#227292" text-anchor="middle">AB</text><rect x="385" y="442" width="110" height="56" fill="#f0f5f6"/><text x="440" y="480" font-size="28" fill="#227292" text-anchor="middle">A</text><rect x="680" y="197" width="110" height="56" fill="#f0f5f6"/><text x="735" y="235" font-size="28" fill="#227292" text-anchor="middle">EOS</text><rect x="680" y="377" width="110" height="56" fill="#f0f5f6"/><text x="735" y="415" font-size="28" fill="#227292" text-anchor="middle">B</text><rect x="680" y="532" width="110" height="56" fill="#f0f5f6"/><text x="735" y="570" font-size="28" fill="#227292" text-anchor="middle">EOS</text><rect x="970" y="377" width="110" height="56" fill="#f0f5f6"/><text x="1025" y="415" font-size="28" fill="#227292" text-anchor="middle">EOS</text><line x1="205" y1="330" x2="385" y2="245" stroke="#227292" stroke-width="3"/><text x="285" y="260" font-size="26" fill="#227292" text-anchor="start">0.4</text><line x1="205" y1="380" x2="385" y2="450" stroke="#bd6a3f" stroke-width="3"/><text x="285" y="450" font-size="26" fill="#bd6a3f" text-anchor="start">0.6</text><line x1="495" y1="225" x2="680" y2="225" stroke="#227292" stroke-width="3"/><text x="585" y="202" font-size="26" fill="#227292" text-anchor="start">1</text><line x1="495" y1="458" x2="680" y2="415" stroke="#bd6a3f" stroke-width="3"/><text x="580" y="405" font-size="26" fill="#bd6a3f" text-anchor="start">0.5</text><line x1="495" y1="490" x2="680" y2="548" stroke="#728d97" stroke-width="3"/><text x="580" y="555" font-size="26" fill="#516b7b" text-anchor="start">0.5</text><line x1="790" y1="405" x2="970" y2="405" stroke="#bd6a3f" stroke-width="3"/><text x="870" y="382" font-size="26" fill="#bd6a3f" text-anchor="start">1</text><text x="1025" y="225" font-size="28" fill="#227292" text-anchor="middle">“ab”  概率 0.4</text><text x="1025" y="475" font-size="28" fill="#bd6a3f" text-anchor="middle">“ab”  概率 0.3</text><text x="960" y="580" font-size="28" fill="#516b7b" text-anchor="middle">“a”  概率 0.3</text><line x1="60" y1="630" x2="1220" y2="630" stroke="#dfe4eb" stroke-width="2"/></g><desc> 同一字符串可以由不同 token 路径生成 规范路径 [AB, EOS]：0.4；完整字符串“ab”：0.4 + 0.6 × 0.5 = 0.7。</desc></svg></svg>
