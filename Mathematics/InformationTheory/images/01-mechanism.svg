<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img"><title>Huffman 从低概率合并到短码字</title><desc>概率0.4、0.3、0.2、0.1，先合并C与D，再合并B与CD；平均码长1.9 bit。</desc><rect width="1280" height="790" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="36" fill="#19333c" text-anchor="start" font-weight="600">Huffman：先合并最轻的两个节点</text><text x="60" y="112" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">同一组概率，向上合并；沿根到叶的路径读取码字</text><line x1="355" y1="165" x2="130" y2="550" stroke="#256b82" stroke-width="3"/><text x="257.5" y="357.5" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">0</text><line x1="355" y1="165" x2="585" y2="265" stroke="#256b82" stroke-width="3"/><text x="485.0" y="215.0" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">1</text><line x1="585" y1="265" x2="390" y2="550" stroke="#256b82" stroke-width="3"/><text x="502.5" y="407.5" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">0</text><line x1="585" y1="265" x2="780" y2="400" stroke="#256b82" stroke-width="3"/><text x="697.5" y="332.5" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">1</text><line x1="780" y1="400" x2="650" y2="550" stroke="#256b82" stroke-width="3"/><text x="730.0" y="475.0" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">0</text><line x1="780" y1="400" x2="910" y2="550" stroke="#256b82" stroke-width="3"/><text x="860.0" y="475.0" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">1</text><rect x="313" y="142" width="84" height="45" fill="white" stroke="#256b82" stroke-width="2"/><text x="355" y="174" font-size="27" fill="#256b82" text-anchor="middle" font-weight="400">1.0</text><rect x="543" y="242" width="84" height="45" fill="white" stroke="#256b82" stroke-width="2"/><text x="585" y="274" font-size="27" fill="#256b82" text-anchor="middle" font-weight="400">0.6</text><rect x="738" y="377" width="84" height="45" fill="white" stroke="#256b82" stroke-width="2"/><text x="780" y="409" font-size="27" fill="#256b82" text-anchor="middle" font-weight="400">0.3</text><circle cx="130" cy="550" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="130" y="593" font-size="28" fill="#19333c" text-anchor="middle" font-weight="400">A  .4</text><text x="130" y="640" font-size="34" fill="#256b82" text-anchor="middle" font-weight="600">0</text><circle cx="390" cy="550" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="390" y="593" font-size="28" fill="#19333c" text-anchor="middle" font-weight="400">B  .3</text><text x="390" y="640" font-size="34" fill="#256b82" text-anchor="middle" font-weight="600">10</text><circle cx="650" cy="550" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="650" y="593" font-size="28" fill="#19333c" text-anchor="middle" font-weight="400">C  .2</text><text x="650" y="640" font-size="34" fill="#256b82" text-anchor="middle" font-weight="600">110</text><circle cx="910" cy="550" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="910" y="593" font-size="28" fill="#19333c" text-anchor="middle" font-weight="400">D  .1</text><text x="910" y="640" font-size="34" fill="#256b82" text-anchor="middle" font-weight="600">111</text><text x="1030" y="330" font-size="26" fill="#c0643c" text-anchor="start" font-weight="400">① 0.1 + 0.2</text><text x="1030" y="375" font-size="26" fill="#c0643c" text-anchor="start" font-weight="400">② 0.3 + 0.3</text><text x="1030" y="420" font-size="26" fill="#c0643c" text-anchor="start" font-weight="400">③ 0.4 + 0.6</text><line x1="60" y1="675" x2="1220" y2="675" stroke="#dce4e5" stroke-width="2"/><text x="60" y="723" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">平均码长  0.4 × 1 + 0.3 × 2 + 0.2 × 3 + 0.1 × 3 = 1.9 bit</text><text x="60" y="767" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">源熵约 1.8464 bit；固定两位编码的平均长度为 2 bit。</text></g></svg>
