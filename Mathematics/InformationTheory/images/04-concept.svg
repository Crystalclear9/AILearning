<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>异或说明边际相关不足以选特征</title>
<desc>独立公平位 X₁、X₂；目标 Y=X₁ XOR X₂；单独观察任一位：0 bit；联合观察两位：1 bit</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">异或说明边际相关不足以选特征</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">独立公平位 X₁、X₂</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">目标 Y=X₁ XOR X₂</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">单独观察任一位：0 bit</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">联合观察两位：1 bit</text>
<text x="90" y="150.0" fill="#16344c" font-size="21">异或目标的互信息（bit）</text><rect x="130.0" y="527.0" width="140" height="0.0" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">仅 X₁</text><text x="130.0" y="498.0" fill="#16344c" font-size="21">0</text><rect x="413.3" y="527.0" width="140" height="0.0" fill="#d86922" /><text x="413.3333333333333" y="563.25" fill="#16344c" font-size="21">仅 X₂</text><text x="413.3333333333333" y="498.0" fill="#16344c" font-size="21">0</text><rect x="696.7" y="222.5" width="140" height="304.5" fill="#12816c" /><text x="696.6666666666666" y="563.25" fill="#16344c" font-size="21">(X₁,X₂)</text><text x="696.6666666666666" y="193.5" fill="#16344c" font-size="21">1</text></g></svg>
