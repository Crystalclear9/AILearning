<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>异或说明边际相关不足以选特征</title>
<desc>独立公平位 X₁、X₂；目标 Y=X₁ XOR X₂；单独观察任一位：0 bit；联合观察两位：1 bit</desc>
<rect width="1200" height="850" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="60" y="65" font-size="31" font-weight="bold" fill="#153652">异或说明边际相关不足以选特征</text>
<text x="60" y="110" font-size="21" fill="#526878">具体算例 · 从条件到结果，逐项核对</text>
<rect x="60" y="470" width="530" height="112" rx="12" fill="#edf5fc" stroke="#bacbd8"/>
<text x="78" y="503" font-size="19" fill="#557086">01</text>
<text x="78" y="539" font-size="24" fill="#18374e">独立公平位 X₁、X₂</text>
<rect x="625" y="470" width="530" height="112" rx="12" fill="#eef8f2" stroke="#bacbd8"/>
<text x="643" y="503" font-size="19" fill="#557086">02</text>
<text x="643" y="539" font-size="24" fill="#18374e">目标 Y=X₁ XOR X₂</text>
<rect x="60" y="610" width="530" height="112" rx="12" fill="#fff6e7" stroke="#bacbd8"/>
<text x="78" y="643" font-size="19" fill="#557086">03</text>
<text x="78" y="679" font-size="24" fill="#18374e">单独观察任一位：0 bit</text>
<rect x="625" y="610" width="530" height="112" rx="12" fill="#f3effb" stroke="#bacbd8"/>
<text x="643" y="643" font-size="19" fill="#557086">04</text>
<text x="643" y="679" font-size="24" fill="#18374e">联合观察两位：1 bit</text>
<text x="60" y="785" font-size="20" fill="#526878">各框属于同一论证或算例；具体适用条件与读图方法见正文。</text>
<text x="90" y="150" fill="#1b3b50" font-size="21">异或目标的互信息（bit）</text><rect x="130.0" y="410.0" width="140" height="0.0" fill="#1976b5"/><text x="130.0" y="435" fill="#1b3b50" font-size="21">仅 X₁</text><text x="130.0" y="390.0" fill="#1b3b50" font-size="21">0</text><rect x="413.3" y="410.0" width="140" height="0.0" fill="#d86922"/><text x="413.3333333333333" y="435" fill="#1b3b50" font-size="21">仅 X₂</text><text x="413.3333333333333" y="390.0" fill="#1b3b50" font-size="21">0</text><rect x="696.7" y="200.0" width="140" height="210.0" fill="#12816c"/><text x="696.6666666666666" y="435" fill="#1b3b50" font-size="21">(X₁,X₂)</text><text x="696.6666666666666" y="180.0" fill="#1b3b50" font-size="21">1</text></g></svg>