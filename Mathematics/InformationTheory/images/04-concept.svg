<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img"><title>异或说明边际相关不足以选特征</title><desc>A枚举两个独立公平位的异或结果，任意单个位都不能确定Y，两个位联合却能确定。B因此得到边际互信息0、联合互信息1 bit。C把X2改成X1的复制，第二个特征变为冗余信息，不能把各自互信息相加当成联合收益。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#118779" /></marker></defs><rect width="1500" height="1050" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="341.6667" y2="341.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="278.3333" y2="278.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="55.00" y="65.00" font-size="34" fill="#15364c" text-anchor="start">异或说明边际相关不足以选特征</text><text x="60.00" y="125.00" font-size="25" fill="#15364c" text-anchor="start">A  核心机制与几何</text><text x="985.00" y="125.00" font-size="25" fill="#15364c" text-anchor="start">B  可复算的数值</text><text x="985.00" y="565.00" font-size="25" fill="#15364c" text-anchor="start">C  对照、变化与边界</text><line x1="945.00" y1="150.00" x2="945.00" y2="980.00" stroke="#d8e3e8" stroke-width="2" /><line x1="980.00" y1="535.00" x2="1440.00" y2="535.00" stroke="#d8e3e8" stroke-width="2" /><text x="110.40" y="236.00" font-size="21" fill="#15364c" text-anchor="start">四个结果等概率</text><text x="118.40" y="378.20" font-size="20" fill="#15364c" text-anchor="start">X1</text><text x="364.80" y="378.20" font-size="20" fill="#15364c" text-anchor="start">X2</text><text x="611.20" y="378.20" font-size="20" fill="#15364c" text-anchor="start">Y</text><rect x="110.40" y="412.20" width="243.40" height="82.00" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="233.60" y="467.45" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="356.80" y="412.20" w