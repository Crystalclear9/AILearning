<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img"><title>三个目标词的概率链与困惑度</title><desc>条件概率二分之一、四分之一、二分之一；序列概率十六分之一，平均负对数概率ln16除以3，困惑度为16的立方根。</desc><rect width="1280" height="730" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="36" fill="#19333c" text-anchor="start" font-weight="600">困惑度：把三个不同难度的预测换成等难度</text><text x="60" y="112" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">仅沿真实目标序列计分；其余候选分支在各步汇总</text><line x1="205" y1="270" x2="535" y2="270" stroke="#256b82" stroke-width="4"/><path d="M524.47,275.75 L535.00,270.00 L524.47,264.25" stroke="#256b82" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="190" cy="270" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="190" y="195" font-size="29" fill="#19333c" text-anchor="middle" font-weight="400">目标 1</text><text x="190" y="238" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">条件概率 0.5</text><line x1="190" y1="290" x2="190" y2="380" stroke="#78878b" stroke-width="3"/><path d="M184.25,369.47 L190.00,380.00 L195.75,369.47" stroke="#78878b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="190" y="420" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">其他候选 0.5</text><line x1="565" y1="270" x2="895" y2="270" stroke="#256b82" stroke-width="4"/><path d="M884.47,275.75 L895.00,270.00 L884.47,264.25" stroke="#256b82" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="550" cy="270" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="550" y="195" font-size="29" fill="#19333c" text-anchor="middle" font-weight="400">目标 2</text><text x="550" y="238" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">条件概率 0.25</text><line x1="550" y1="290" x2="550" y2="380" stroke="#78878b" stroke-width="3"/><path d="M544.25,369.47 L550.00,380.00 L555.75,369.47" stroke="#78878b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="550" y="420" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">其他候选 0.75</text><circle cx="910" cy="270" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="910" y="195" font-size="29" fill="#19333c" text-anchor="middle" font-weight="400">目标 3</text><text x="910" y="238" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">条件概率 0.5</text><line x1="910" y1="290" x2="910" y2="380" stroke="#78878b" stroke-width="3"/><path d="M904.25,369.47 L910.00,380.00 L915.75,369.47" stroke="#78878b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="910" y="420" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">其他候选 0.5</text><text x="60" y="475" font-size="29" fill="#19333c" text-anchor="start" font-weight="400">序列概率</text><text x="275" y="458" font-size="26" fill="#19333c" text-anchor="middle" font-weight="400">1</text><line x1="254" y1="467" x2="296" y2="467" stroke="#19333c" stroke-width="2"/><text x="275" y="498" font-size="26" fill="#19333c" text-anchor="middle" font-weight="400">16</text><text x="400" y="475" font-size="29" fill="#19333c" text-anchor="start" font-weight="400">总损失 ln 16</text><text x="760" y="475" font-size="29" fill="#19333c" text-anchor="start" font-weight="400">平均损失 ≈ 0.9242 nat</text><line x1="60" y1="525" x2="1220" y2="525" stroke="#dce4e5" stroke-width="2"/><text x="60" y="580" font-size="29" fill="#19333c" text-anchor="start" font-weight="400">等效的每步真实词概率  ≈ 0.3969</text><text x="60" y="630" font-size="33" fill="#256b82" text-anchor="start" font-weight="600">PPL = 16 的立方根  ≈ 2.5198</text><text x="60" y="682" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">三个 0.3969 相乘约为 0.0625；PPL 不要求是整数，也不是词表大小。</text></g></svg>
