<svg xmlns="http://www.w3.org/2000/svg" width="1370.16" height="652.16" viewBox="-25.08 -25.08 1370.16 652.16" role="img" aria-labelledby="title description">
  <title id="title">一个输入与两个输入分别告诉我们什么</title>
  <desc id="description">独立且公平的 X1 和 X2 经异或产生 Y。只知道一个输入时结果仍公平，同时知道两个输入时可直接确定。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L11 6 L0 12 L2.5 6 Z" fill="#242e3a"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L11 6 L0 12 L2.5 6 Z" fill="#217283"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L11 6 L0 12 L2.5 6 Z" fill="#af5546"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L11 6 L0 12 L2.5 6 Z" fill="#675e8c"/>
    </marker>
    <linearGradient id="wash-cyan" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#95cdd4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#95cdd4" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="wash-red" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#eab6b0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#eab6b0" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="wash-violet" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#beb4d3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#beb4d3" stop-opacity="0.48"/>
    </linearGradient>
  </defs>
  <rect id="edition-paper" x="-25.08" y="-25.08" width="1370.16" height="652.16" fill="#ffffff"/><svg id="edition-view" x="0" y="0" width="1320" height="602" viewBox="0 0 1320 602" overflow="hidden"><rect width="1320" height="602" fill="#ffffff"/>
  <g font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">
