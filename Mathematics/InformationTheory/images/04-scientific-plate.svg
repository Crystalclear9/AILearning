    <text x="964" y="57" font-size="37" fill="#242e3a" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同时知道两个输入</text>
    <polygon points="83.00000,209.00000 177.00000,137.00000 553.00000,137.00000 459.00000,209.00000" fill="url(#wash-cyan)" stroke="#217283" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="318" y="183" font-size="33" fill="#217283" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">仍有两种可能</text>
    <line x1="324" y1="231" x2="192" y2="374" stroke="#242e3a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
