    <text x="1060" y="289.1" font-size="34" fill="#9b4b3e" text-anchor="middle" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">Y = 1</text>
    <rect x="805" y="329" width="165" height="100" rx="2" fill="url(#wash-red)"/>
    <text x="890" y="394.1" font-size="34" fill="#9b4b3e" text-anchor="middle" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">Y = 1</text>
    <rect x="975" y="329" width="165" height="100" rx="2" fill="url(#wash-cyan)"/>
    <text x="1060" y="394.1" font-size="34" fill="#217283" text-anchor="middle" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">Y = 0</text>
    <text x="970" y="499" font-size="30" fill="#242e3a" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">由这一格确定输出</text>
    <text x="970" y="552" font-size="27" fill="#4b5e6b" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">四格概率相同</text>
