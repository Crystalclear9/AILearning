    <text x="1060" y="195" font-size="31" fill="#242e3a" text-anchor="middle" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">X₂ = 1</text>
    <text x="775" y="387.8" font-size="31" fill="#242e3a" text-anchor="end" font-weight="400" font-family="Cambria Math, STIX Two Text, Georgia, SimSun, serif">X₁ = 1</text>
