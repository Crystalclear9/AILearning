<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="title desc"><title id="title">交叉熵是按真实频率加权的损失面积</title><desc id="desc">真实分布两类各半。匹配模型两类损失均为1比特；偏置模型预测0.9和0.1，对应损失0.152和3.322比特，平均为1.737比特。矩形纵向高度保持相同，宽度按负对数预测概率变化。</desc><rect width="1400" height="830" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="56" y="62" font-size="38" fill="#20343d" text-anchor="start" font-weight="600">给一类过高信心，另一类会付出更大代价</text>
<text x="56" y="111" font-size="27" fill="#667e89" text-anchor="start" font-weight="400">两类真实概率始终各半；宽度 = 单次损失，面积 = 平均损失的贡献。</text>
<text x="100" y="180" font-size="29" fill="#20343d" text-anchor="start" font-weight="600">匹配预测</text>
<text x="100" y="219" font-size="27" fill="#667e89" text-anchor="start" font-weight="400">Q = (0.5, 0.5)</text>
<text x="101" y="345" font-size="30" fill="#147d92" text-anchor="start" font-weight="600">A</text>
<text x="153" y="325" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<line x1="140" y1="332" x2="166" y2="332" stroke="#20343d" stroke-width="1.5"/>
<text x="153" y="360" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">2</text>
<rect x="195" y="270" width="120" height="130" fill="#147d92" stroke="none" stroke-width="2"/>
<text x="330" y="345" font-size="28" fill="#147d92" text-anchor="start" font-weight="600">1.000</text>
<text x="101" y="475" font-size="30" fill="#bf7b2e" text-anchor="start" font-weight="600">B</text>
<text x="153" y="455" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<line x1="140" y1="462" x2="166" y2="462" stroke="#20343d" stroke-width="1.5"/>
<text x="153" y="490" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">2</text>
<rect x="195" y="400" width="120" height="130" fill="#bf7b2e" stroke="none" stroke-width="2"/>
<text x="330" y="475" font-size="28" fill="#bf7b2e" text-anchor="start" font-weight="600">1.000</text>
<line x1="195" y1="548" x2="615" y2="548" stroke="#667e89" stroke-width="2"/>
<line x1="195" y1="543" x2="195" y2="554" stroke="#667e89" stroke-width="2"/>
<text x="195" y="590" font-size="24" fill="#667e89" text-anchor="middle" font-weight="400">0</text>
<line x1="315" y1="543" x2="315" y2="554" stroke="#667e89" stroke-width="2"/>
<text x="315" y="590" font-size="24" fill="#667e89" text-anchor="middle" font-weight="400">1</text>
<line x1="435" y1="543" x2="435" y2="554" stroke="#667e89" stroke-width="2"/>
<text x="435" y="590" font-size="24" fill="#667e89" text-anchor="middle" font-weight="400">2</text>
<line x1="555" y1="543" x2="555" y2="554" stroke="#667e89" stroke-width="2"/>
<text x="555" y="590" font-size="24" fill="#667e89" text-anchor="middle" font-weight="400">3</text>
<text x="405" y="633" font-size="26" fill="#667e89" text-anchor="middle" font-weight="400">单次损失（bit）</text>
<text x="765" y="180" font-size="29" fill="#20343d" text-anchor="start" font-weight="600">失配预测</text>
<text x="765" y="219" font-size="27" fill="#667e89" text-anchor="start" font-weight="400">Q = (0.9, 0.1)</text>
<text x="766" y="345" font-size="30" fill="#147d92" text-anchor="start" font-weight="600">A</text>
<text x="818" y="325" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<line x1="805" y1="332" x2="831" y2="332" stroke="#20343d" stroke-width="1.5"/>
<text x="818" y="360" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">2</text>
<rect x="860" y="270" width="18.240371213405997" height="130" fill="#147d92" stroke="none" stroke-width="2"/>
<text x="893.240371213406" y="345" font-size="28" fill="#147d92" text-anchor="start" font-weight="600">0.152</text>
<line x1="980" y1="274" x2="980" y2="396" stroke="#20343d" stroke-width="2" stroke-dasharray="7 6"/>
<text x="766" y="475" font-size="30" fill="#bf7b2e" text-anchor="start" font-weight="600">B</text>
<text x="818" y="455" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<line x1="805" y1="462" x2="831" y2="462" stroke="#20343d" stroke-width="1.5"/>
<text x="818" y="490" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">2</text>
<rect x="860" y="400" width="398.63137138648347" height="130" fill="#bf7b2e" stroke="none" stroke-width="2"/>
<text x="1273.6313713864834" y="475" font-size="28" fill="#bf7b2e" text-anchor="start" font-weight="600">3.322</text>
<line x1="980" y1="404" x2="980" y2="526" stroke="#20343d" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="860" y1="548" x2="1280" y2="548" stroke="#667e89" stroke-width="2"/>
<line x1="860" y1="543" x2="860" y2="554" stroke="#667e89" stroke-width="2"/>
<text x="860" y="590" font-size="24" fill="#667e89" text-anchor="middle" font-weight="400">0</text>
<line x1="980" y1="543" x2="980" y2="554" stroke="#667e89" stroke-width="2"/>
<text x="980" y="590" font-size="24" fill="#667e89" text-anchor="middle" font-weight="400">1</text>
<line x1="1100" y1="543" x2="1100" y2="554" stroke="#667e89" stroke-width="2"/>
<text x="1100" y="590" font-size="24" fill="#667e89" text-anchor="middle" font-weight="400">2</text>
<line x1="1220" y1="543" x2="1220" y2="554" stroke="#667e89" stroke-width="2"/>
<text x="1220" y="590" font-size="24" fill="#667e89" text-anchor="middle" font-weight="400">3</text>
<text x="1070" y="633" font-size="26" fill="#667e89" text-anchor="middle" font-weight="400">单次损失（bit）</text>
<text x="100" y="678" font-size="31" fill="#20343d" text-anchor="start" font-weight="600">H(P) = 1.000 bit</text>
<text x="765" y="678" font-size="31" fill="#20343d" text-anchor="start" font-weight="600">H(P, Q) ≈ 1.737 bit</text>
<line x1="56" y1="708" x2="1344" y2="708" stroke="#dce4e7" stroke-width="2"/>
<text x="56" y="760" font-size="27" fill="#667e89" text-anchor="start" font-weight="400">失配多出的面积</text>
<text x="340" y="760" font-size="32" fill="#20343d" text-anchor="start" font-weight="600">D(P ∥ Q) ≈ 0.737 bit</text>
<text x="850" y="760" font-size="25" fill="#667e89" text-anchor="start" font-weight="400">虚线：匹配预测的 1 bit 宽度</text></g></svg>
