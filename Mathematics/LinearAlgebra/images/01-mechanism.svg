<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"><title>输入不同，输出为何完全一样？</title><desc>秩一映射A(x,y)=(x+y,0)。输入空间中x+y=c的每一整条平行直线映射为输出横轴上的同一个点(c,0)。零空间是c=0直线。</desc><rect width="1200" height="690" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">输入不同，输出为何完全一样？</text><text x="40" y="103" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">A(x, y) = (x + y, 0)     ·     相同颜色表示相同输出</text><line x1="144.0" y1="430" x2="501.0" y2="430" stroke="#78878b" stroke-width="2"/><line x1="270" y1="556.0" x2="270" y2="198.99999999999997" stroke="#78878b" stroke-width="2"/><line x1="154.5" y1="314.5" x2="385.5" y2="545.5" stroke="#78878b" stroke-width="4"/><circle cx="270" cy="430" r="7" fill="#78878b" stroke="#78878b" stroke-width="2"/><circle cx="375" cy="535" r="7" fill="#78878b" stroke="#78878b" stroke-width="2"/><line x1="154.5" y1="209.5" x2="490.5" y2="545.5" stroke="#256b82" stroke-width="4"/><circle cx="270" cy="325" r="7" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="375" cy="430" r="7" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="480" cy="535" r="7" fill="#256b82" stroke="#256b82" stroke-width="2"/><line x1="259.5" y1="209.5" x2="490.5" y2="440.5" stroke="#c0643c" stroke-width="4"/><circle cx="270" cy="220" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="375" cy="325" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="480" cy="430" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="80" y="163" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">输入：一整条线</text><text x="255" y="305" font-size="25" fill="#256b82" text-anchor="start" font-weight="400">Q = (0, 1)</text><text x="391" y="458" font-size="25" fill="#256b82" text-anchor="start" font-weight="400">P = (1, 0)</text><text x="403" y="547" font-size="25" fill="#78878b" text-anchor="start" font-weight="400">零空间</text><text x="395" y="310" font-size="25" fill="#c0643c" text-anchor="start" font-weight="400">x + y = 2</text><text x="250" y="460" font-size="24" fill="#78878b" text-anchor="start" font-weight="400">0</text><text x="735" y="163" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">输出：一个点</text><line x1="580" y1="345" x2="675" y2="345" stroke="#19333c" stroke-width="3"/><path d="M664.47,350.75 L675.00,345.00 L664.47,339.25" stroke="#19333c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="720" y1="430" x2="1125" y2="430" stroke="#78878b" stroke-width="2"/><circle cx="750" cy="430" r="10" fill="#78878b" stroke="#78878b" stroke-width="2"/><text x="750" y="478" font-size="27" fill="#78878b" text-anchor="middle" font-weight="400">(0, 0)</text><circle cx="910" cy="430" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="910" y="478" font-size="27" fill="#256b82" text-anchor="middle" font-weight="400">(1, 0)</text><circle cx="1070" cy="430" r="10" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="1070" y="478" font-size="27" fill="#c0643c" text-anchor="middle" font-weight="400">(2, 0)</text><text x="750" y="560" font-size="28" fill="#256b82" text-anchor="start" font-weight="400">P、Q 都到 (1, 0)</text><text x="40" y="640" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">沿 (1, −1) 移动，坐标和不变；这一方向的信息在输出中消失。</text></g></svg>
