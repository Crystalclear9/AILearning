<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>PCA 的方差保留与重构损失</title>
<desc>协方差 diag(9,1)；保留第一特征方向；解释方差比例=90%；丢弃方差=1</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">PCA 的方差保留与重构损失</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">协方差 diag(9,1)</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">保留第一特征方向</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">解释方差比例=90%</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">丢弃方差=1</text>
<text x="90" y="150.0" fill="#16344c" font-size="21">两个正交主方向的总体方差</text><rect x="130.0" y="222.5" width="140" height="304.5" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">方向 1</text><text x="130.0" y="193.5" fill="#16344c" font-size="21">9</text><rect x="555.0" y="493.21" width="140" height="33.785" fill="#d86922" /><text x="555.0" y="563.25" fill="#16344c" font-size="21">方向 2</text><text x="555.0" y="464.17" fill="#16344c" font-size="21">1</text></g></svg>
