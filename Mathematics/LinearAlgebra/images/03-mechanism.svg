<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>收敛不等于每一步的误差都更小</title><desc>二维误差递推B=[[0.5,4],[0,0.5]]，e0=(0,1)。谱半径0.5，但误差前两步大于初始误差；e_k=(8k/2^k,1/2^k)，最终归零。对照B=0.5I。</desc><rect width="1200" height="730" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">收敛不等于每一步的误差都更小</text><text x="40" y="103" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">相同特征值 0.5；非对角耦合能造成暂时放大</text><text x="45" y="169" font-size="28" fill="#c0643c" text-anchor="start" font-weight="400">B = [[0.5, 4], [0, 0.5]]</text><text x="680" y="169" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">误差的欧氏长度</text><line x1="100" y1="520" x2="562.0" y2="520" stroke="#78878b" stroke-width="2"/><line x1="100" y1="520" x2="100" y2="228.79999999999995" stroke="#78878b" stroke-width="2"/><line x1="100.0" y1="260.0" x2="520.0" y2="390.0" stroke="#c0643c" stroke-width="2"/><path d="M508.24,392.38 L520.00,390.00 L511.64,381.39" stroke="#c0643c" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="520.0" y1="390.0" x2="520.0" y2="455.0" stroke="#c0643c" stroke-width="2"/><path d="M514.25,444.47 L520.00,455.00 L525.75,444.47" stroke="#c0643c" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="520.0" y1="455.0" x2="415.0" y2="487.5" stroke="#c0643c" stroke-width="2"/><path d="M423.36,478.89 L415.00,487.50 L426.76,489.88" stroke="#c0643c" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="415.0" y1="487.5" x2="310.0" y2="503.75" stroke="#c0643c" stroke-width="2"/><path d="M319.53,496.45 L310.00,503.75 L321.29,507.82" stroke="#c0643c" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="310.0" y1="503.75" x2="231.25" y2="511.875" stroke="#c0643c" stroke-width="2"/><path d="M241.13,505.07 L231.25