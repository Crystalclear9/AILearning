<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>小残差与大解误差的区别</title>
<desc>A=diag(1,0.001)；右端扰动 Δb=(0,0.001)；解扰动 Δx=(0,1)；二范数条件数=1000</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">小残差与大解误差的区别</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">A=diag(1,0.001)</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">右端扰动 Δb=(0,0.001)</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">解扰动 Δx=(0,1)</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">二范数条件数=1000</text>
<text x="90" y="150.0" fill="#16344c" font-size="21">同一线性系统中绝对扰动的放大</text><rect x="130.0" y="526.71" width="140" height="0.29" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">右端扰动范数</text><text x="130.0" y="497.7" fill="#16344c" font-size="21">0.001</text><rect x="555.0" y="222.5" width="140" height="304.5" fill="#d86922" /><text x="555.0" y="563.25" fill="#16344c" font-size="21">解扰动范数</text><text x="555.0" y="193.5" fill="#16344c" font-size="21">1</text></g></svg>
