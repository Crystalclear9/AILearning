<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1640" viewBox="0 0 1100 1640" role="img"><title>正交投影把向量拆成两部分</title><desc>A把b=(2,1)分解为正交投影p=(2,0)与残差r=(0,1)，直角记号对应p·r=0。B验证长度平方5=4+1。C选同一子空间中的另一点q=(1,0)，残差变成(1,1)，平方误差升为2，说明最小二乘选解依赖正交条件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#118779" /></marker></defs><rect width="1100" height="1640" fill="#f3f6f8" /><rect x="24" y="88" width="1052" height="996" rx="16" fill="#ffffff" stroke="#dbe4e9" /><rect x="24" y="1104" width="516" height="510" rx="16" fill="#ffffff" stroke="#dbe4e9" /><rect x="560" y="1104" width="516" height="510" rx="16" fill="#ffffff" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">正交投影把向量拆成两部分</text><rect x="40" y="106" width="4" height="26" rx="2" fill="#118779" /><text x="52" y="130" font-size="25" font-weight="650" fill="#15364c">A  机制与几何</text><rect x="36" y="1123" width="4" height="26" rx="2" fill="#118779" /><text x="48" y="1147" font-size="25" font-weight="650" fill="#15364c">B  数值算例</text><rect x="572" y="1123" width="4" height="26" rx="2" fill="#118779" /><text x="584" y="1147" font-size="25" font-weight="650" fill="#15364c">C  对照与边界</text><g transform="scale(1.08)"><line x1="154.08" y1="585.60" x2="831.12" y2="585.60" stroke="#95adba" stroke-width="2" /><line x1="438.00" y1="847.68" x2="438.00" y2="258.00" stroke="#95adba" stroke-width="2" /><text x="831.12" y="613.99" font-size="20" fill="#15364c" text-anchor="start">x</text><text x="409.61" y="268.92" font-size="20" fill="#15364c" text-anchor="start">y</text><path d="M438.00,585.60 L743.76,432.72" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><path d="M438.00,585.60 L743.76,585.60" stroke="#497da4" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round