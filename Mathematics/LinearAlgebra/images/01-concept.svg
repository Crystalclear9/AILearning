<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>矩阵怎样移动标准基向量</title>
<desc>A=[[2,1],[0,1]]；e₁=(1,0) → (2,0)；e₂=(0,1) → (1,1)；A(1,1)=(3,1)</desc>
<rect width="1200" height="850" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="60" y="65" font-size="31" font-weight="bold" fill="#153652">矩阵怎样移动标准基向量</text>
<text x="60" y="110" font-size="21" fill="#526878">具体算例 · 从条件到结果，逐项核对</text>
<rect x="60" y="470" width="530" height="112" rx="12" fill="#edf5fc" stroke="#bacbd8"/>
<text x="78" y="503" font-size="19" fill="#557086">01</text>
<text x="78" y="539" font-size="24" fill="#18374e">A=[[2,1],[0,1]]</text>
<rect x="625" y="470" width="530" height="112" rx="12" fill="#eef8f2" stroke="#bacbd8"/>
<text x="643" y="503" font-size="19" fill="#557086">02</text>
<text x="643" y="539" font-size="24" fill="#18374e">e₁=(1,0) → (2,0)</text>
<rect x="60" y="610" width="530" height="112" rx="12" fill="#fff6e7" stroke="#bacbd8"/>
<text x="78" y="643" font-size="19" fill="#557086">03</text>
<text x="78" y="679" font-size="24" fill="#18374e">e₂=(0,1) → (1,1)</text>
<rect x="625" y="610" width="530" height="112" rx="12" fill="#f3effb" stroke="#bacbd8"/>
<text x="643" y="643" font-size="19" fill="#557086">04</text>
<text x="643" y="679" font-size="24" fill="#18374e">A(1,1)=(3,1)</text>
<text x="60" y="785" font-size="20" fill="#526878">各框属于同一论证或算例；具体适用条件与读图方法见正文。</text>
<line x1="200" y1="400" x2="1000" y2="400" stroke="#267ab0" stroke-width="3"/><line x1="200" y1="400" x2="200" y2="170" stroke="#267ab0" stroke-width="3"/><line x1="200" y1="400" x2="650" y2="400" stroke="#267ab0" stroke-width="3"/><line x1="200" y1="400" x2="425" y2="225" stroke="#267ab0" stroke-width="3"/><line x1="200" y1="400" x2="875" y2="225" stroke="#267ab0" stroke-width="3"/><text x="630" y="430" font-size="22" fill="#173b51">Ae₁=(2,0)</text><text x="300" y="210" font-size="22" fill="#173b51">Ae₂=(1,1)</text><text x="800" y="205" font-size="22" fill="#173b51">A(e₁+e₂)=(3,1)</text></g></svg>