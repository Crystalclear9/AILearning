<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>矩阵怎样移动标准基向量</title>
<desc>A=[[2,1],[0,1]]；e₁=(1,0) → (2,0)；e₂=(0,1) → (1,1)；A(1,1)=(3,1)</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">矩阵怎样移动标准基向量</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">A=[[2,1],[0,1]]</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">e₁=(1,0) → (2,0)</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">e₂=(0,1) → (1,1)</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">A(1,1)=(3,1)</text>
<line x1="200" y1="400" x2="1000" y2="400" stroke="#267ab0" stroke-width="3" /><line x1="200" y1="400" x2="200" y2="170" stroke="#267ab0" stroke-width="3" /><line x1="200" y1="400" x2="650" y2="400" stroke="#267ab0" stroke-width="3" marker-end="url(#vector-head)" /><line x1="200" y1="400" x2="425" y2="225" stroke="#267ab0" stroke-width="3" marker-end="url(#vector-head)" /><line x1="200" y1="400" x2="875" y2="225" stroke="#267ab0" stroke-width="3" marker-end="url(#vector-head)" /><text x="630" y="430" font-size="22" fill="#173b51">Ae₁=(2,0)</text><text x="300" y="210" font-size="22" fill="#173b51">Ae₂=(1,1)</text><text x="800" y="205" font-size="22" fill="#173b51">A(e₁+e₂)=(3,1)</text></g><defs><marker id="vector-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#267ab0" /></marker></defs></svg>
