<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="961.3903" viewBox="0 0 1440 961.3903" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">半平面约束下，普通试探点、欧氏投影与梯度映射的两步对照</title><rect width="1440" height="961.3903" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">半平面约束下，普通试探点、欧氏投影与梯度映射的两步对照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="819.3903" viewBox="36.2667 73.2444 1147.7333 699.7333" role="img" x="48" y="106" overflow="hidden"><title>约束后的移动，才是边界处应检查的残差</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="120" font-size="29" fill="#516b7b" text-anchor="start">f(x, y) = x + 0.5y²，约束 x ≥ 0，步长 η = 1</text><rect x="300" y="240" width="230" height="380" fill="#edf4f6"/><line x1="100.0" y1="550" x2="500.0" y2="550" stroke="#728d97" stroke-width="2"/><line x1="300" y1="620" x2="300" y2="240" stroke="#227292" stroke-width="3"/><text x="496.8" y="588" font-size="25" fill="#1a2a3b" text-anchor="start">x</text><text x="312" y="252" font-size="25" fill="#1a2a3b" text-anchor="start">y</text><text x="360" y="290" font-size="25" fill="#227292" text-anchor="start">可行半平面</text><text x="60" y="188" font-size="28" fill="#1a2a3b" text-anchor="start">从内部出发：先试探，再投影</text><line x1="396.0" y1="340" x2="236.0" y2="550" stroke="#728d97" stroke-width="4"/><path d="M236.0,550 L250.65867026917036,542.3108267063525 L239.52262618871535,533.8262216926724 Z" fill="#728d97"/><line x1="236.0" y1="550" x2="300" y2="550" stroke="#bd6a3f" stroke-width="4"/><path d="M300,550 L285.0,543.0 L285.0,557.0 Z" fill="#bd6a3f"/><line x1="396.0" y1="340" x2="300" y2="550" stroke="#227292" stroke-width="4"/><path d="M300,550 L312.6027177331175,539.2682011880876 L299.87007507491626,533.4475645443384 Z" fill="#227292"/><circle cx="396.0" cy="340" r="7" fill="#227292"/><circle cx="236.0" cy="550" r="7" fill="#bd6a3f"/><circle cx="300" cy="550" r="7" fill="#1a2a3b"/><text x="411.0" y="320" font-size="26" fill="#227292" text-anchor="start">起点 (0.6, 1)</text><text x="216.0" y="617" font-size="25" fill="#bd6a3f" text-anchor="middle">试探 (−0.4, 0)</text><text x="330" y="598" font-size="26" fill="#1a2a3b" text-anchor="start">投影 (0, 0)</text><text x="60" y="697" font-size="28" fill="#516b7b" text-anchor="start">普通梯度 (1, 1)</text><text x="60" y="744" font-size="28" fill="#227292" text-anchor="start">梯度映射 (0.6, 1)</text><rect x="930" y="240" width="230" height="380" fill="#edf4f6"/><line x1="730.0" y1="550" x2="1130.0" y2="550" stroke="#728d97" stroke-width="2"/><line x1="930" y1="620" x2="930" y2="240" stroke="#227292" stroke-width="3"/><text x="1126.8" y="588" font-size="25" fill="#1a2a3b" text-anchor="start">x</text><text x="942" y="252" font-size="25" fill="#1a2a3b" text-anchor="start">y</text><text x="990" y="290" font-size="25" fill="#227292" text-anchor="start">可行半平面</text><text x="690" y="188" font-size="28" fill="#1a2a3b" text-anchor="start">到达最优：负梯度指向不可行侧</text><line x1="930" y1="550" x2="770" y2="550" stroke="#728d97" stroke-width="4"/><path d="M770,550 L785.0,557.0 L785.0,543.0 Z" fill="#728d97"/><line x1="770" y1="595" x2="930" y2="595" stroke="#bd6a3f" stroke-width="4"/><path d="M930,595 L915.0,588.0 L915.0,602.0 Z" fill="#bd6a3f"/><circle cx="930" cy="550" r="8" fill="#1a2a3b"/><circle cx="770" cy="550" r="7" fill="#bd6a3f"/><text x="770" y="522" font-size="25" fill="#bd6a3f" text-anchor="middle">试探 (−1, 0)</text><text x="948" y="525" font-size="26" fill="#1a2a3b" text-anchor="start">最优 (0, 0)</text><text x="690" y="697" font-size="28" fill="#516b7b" text-anchor="start">普通梯度 (1, 0)，并非零</text><text x="690" y="744" font-size="28" fill="#227292" text-anchor="start">投影回原点：梯度映射为零</text></g><desc> 约束后的移动，才是边界处应检查的残差</desc></svg></svg>
