<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img"><title>同一检查点的一步更新账本</title><desc>固定同一初值误差，将当前梯度、实际位移、接受后目标与一阶预测逐项连接。</desc><rect width="1600" height="1120" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#182b43"><text x="60.00" y="66.00" font-size="38" fill="#182b43" text-anchor="start" font-weight="bold">一步更新账本：先固定状态，再比较方向</text><text x="60.00" y="115.00" font-size="29" fill="#607287" text-anchor="start" font-weight="normal">e0 = x0 − x* = (1.5, 2.5)      g0 = H e0      e1 = e0 + s</text><rect x="55" y="165" width="1490" height="395" rx="12" fill="#f6f9fc" stroke="#e4ebf1" stroke-width="2"/><text x="85.00" y="214.00" font-size="32" fill="#182b43" text-anchor="start" font-weight="bold">A  轴对齐</text><text x="85.00" y="265.00" font-size="29" fill="#182b43" text-anchor="start" font-weight="normal">g0 = (1.5, 250)</text><text x="85.00" y="308.00" font-size="29" fill="#182b43" text-anchor="start" font-weight="normal">f0 = 313.625</text><text x="85.00" y="365.00" font-size="27" fill="#607287" text-anchor="start" font-weight="normal">方法</text><text x="455.00" y="365.00" font-size="27" fill="#607287" text-anchor="start" font-weight="normal">实际位移 s</text><text x="865.00" y="365.00" font-size="27" fill="#607287" text-anchor="start" font-weight="normal">接受后误差 e1</text><text x="1310.00" y="365.00" font-size="27" fill="#607287" text-anchor="start" font-weight="normal">接受后 f1</text><text x="85.00" y="417.00" font-size="29" fill="#2563eb" text-anchor="start" font-weight="bold">普通</text><text x="455.00" y="417.00" font-size="28" fill="#2563eb" text-anchor="start" font-weight="normal"> (−0.015, −2.5)</text><text x="865.00" y="417.00" font-size="28" fill="#2563eb" text-anchor="start" font-weight="normal">(1.485, 0)</text><text x="1310.00" y="417.00" font-size="28" fill="#2563eb" text-anchor="start" font-weight="normal">1.1026125</text><text x="85.00" y="468.00" font-size="29" fill="#e58a24" text-anchor="start" font-weight="bold">对角</text><text x="455.00" y="468.00" font-size="28" fill="#e58a24" text-anchor="start" font-weight="normal">(−1.5, −2.5)</text><text x="865.00" y="468.00" font-size="28" fill="#e58a24" text-anchor="start" font-weight="normal">(0, 0)</text><text x="1310.00" y="468.00" font-size="28" fill="#e58a24" text-anchor="start" font-weight="normal">0</text><text x="85.00" y="519.00" font-size="29" fill="#0c857a" text-anchor="start" font-weight="bold">精确</text><text x="455.00" y="519.00" font-size="28" fill="#0c857a" text-anchor="start" font-weight="normal">(−1.5, −2.5)</text><text x="865.00" y="519.00" font-size="28" fill="#0c857a" text-anchor="start" font-weight="normal">(0, 0)</text><text x="1310.00" y="519.00" font-size="28" fill="#0c857a" text-anchor="start" font-weight="normal">0</text><rect x="55" y="595" width="1490" height="395" rx="12" fill="#f6f9fc" stroke="#e4ebf1" stroke-width="2"/><text x="85.00" y="644.00" font-size="32" fill="#182b43" text-anchor="start" font-weight="bold">B  旋转 45°</text><text x="85.00" y="695.00" font-size="29" fill="#182b43" text-anchor="start" font-weight="normal">g0 = (−48, 52)</text><text x="85.00" y="738.00" font-size="29" fill="#182b43" text-anchor="start" font-weight="normal">f0 = 29</text><text x="85.00" y="795.00" font-size="27" fill="#607287" text-anchor="start" font-weight="normal">方法</text><text x="455.00" y="795.00" font-size="27" fill="#607287" text-anchor="start" font-weight="normal">实际位移 s</text><text x="865.00" y="795.00" font-size="27" fill="#607287" text-anchor="start" font-weight="normal">接受后误差 e1</text><text x="1310.00" y="795.00" font-size="27" fill="#607287" text-anchor="start" font-weight="normal">接受后 f1</text><text x="85.00" y="847.00" font-size="29" fill="#2563eb" text-anchor="start" font-weight="bold">普通</text><text x="455.00" y="847.00" font-size="28" fill="#2563eb" text-anchor="start" font-weight="normal">(0.48, −0.52)</text><text x="865.00" y="847.00" font-size="28" fill="#2563eb" text-anchor="start" font-weight="normal">(1.98, 1.98)</text><text x="1310.00" y="847.00" font-size="28" fill="#2563eb" text-anchor="start" font-weight="normal">3.9204</text><text x="85.00" y="898.00" font-size="29" fill="#e58a24" text-anchor="start" font-weight="bold">对角</text><text x="455.00" y="898.00" font-size="28" fill="#e58a24" text-anchor="start" font-weight="normal">(0.48, −0.52)</text><text x="865.00" y="898.00" font-size="28" fill="#e58a24" text-anchor="start" font-weight="normal">(1.98, 1.98)</text><text x="1310.00" y="898.00" font-size="28" fill="#e58a24" text-anchor="start" font-weight="normal">3.9204</text><text x="85.00" y="949.00" font-size="29" fill="#0c857a" text-anchor="start" font-weight="bold">精确</text><text x="455.00" y="949.00" font-size="28" fill="#0c857a" text-anchor="start" font-weight="normal">(−1.5, −2.5)</text><text x="865.00" y="949.00" font-size="28" fill="#0c857a" text-anchor="start" font-weight="normal">(0, 0)</text><text x="1310.00" y="949.00" font-size="28" fill="#0c857a" text-anchor="start" font-weight="normal">0</text><text x="65.00" y="1041.00" font-size="28" fill="#182b43" text-anchor="start" font-weight="normal">旋转后的对角法：方向除以 50.5，但步长为 0.505；两者相消后仍是 −0.01g。</text><text x="65.00" y="1088.00" font-size="28" fill="#607287" text-anchor="start" font-weight="normal">精确法：一阶预测 p = g0 · e0 = 2f0，实际降低 a = f0，因此本章 ρ = 0.5。</text></g></svg>
