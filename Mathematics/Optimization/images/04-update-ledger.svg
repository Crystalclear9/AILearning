<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>同一检查点的一步账本：比较实际位移，再核对新目标</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">同一检查点的一步账本：比较实际位移，再核对新目标</text><text x="60" y="120" font-size="28" fill="#71858b" text-anchor="start">共同初始误差 e0 = (1.5, 2.5)；下面每行独立从同一初值计算</text><text x="60" y="185" font-size="31" fill="#19333c" text-anchor="start">A 轴对齐</text><text x="60" y="235" font-size="28" fill="#71858b" text-anchor="start">当前梯度 g0 = (1.5, 250)；当前目标 f0 = 313.625</text><text x="60" y="288" font-size="27" fill="#19333c" text-anchor="start">方法</text><text x="385" y="288" font-size="27" fill="#19333c" text-anchor="middle">实际位移 s</text><text x="755" y="288" font-size="27" fill="#19333c" text-anchor="middle">新误差 e1</text><text x="1100" y="288" font-size="27" fill="#19333c" text-anchor="middle">新目标 f1</text><line x1="60" y1="307" x2="1215" y2="307" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="352" font-size="28" fill="#256b82" text-anchor="start">普通 GD</text><text x="385" y="352" font-size="29" fill="#256b82" text-anchor="middle">(−0.015, −2.5)</text><text x="755" y="352" font-size="29" fill="#256b82" text-anchor="middle">(1.485, 0)</text><text x="1100" y="352" font-size="28" fill="#256b82" text-anchor="middle">1.1026125</text><text x="60" y="418" font-size="28" fill="#c0643c" text-anchor="start">对角 = 精确</text><text x="385" y="418" font-size="29" fill="#c0643c" text-anchor="middle">(−1.5, −2.5)</text><text x="755" y="418" font-size="29" fill="#c0643c" text-anchor="middle">(0, 0)</text><text x="1100" y="418" font-size="28" fill="#c0643c" text-anchor="middle">0</text><text x="60" y="485" font-size="31" fill="#19333c" text-anchor="start">B 旋转 45°</text><text x="60" y="535" font-size="28" fill="#71858b" text-anchor="start">当前梯度 g0 = (−48, 52)；当前目标 f0 = 29</text><text x="60" y="588" font-size="27" fill="#19333c" text-anchor="start">方法</text><text x="385" y="588" font-size="27" fill="#19333c" text-anchor="middle">实际位移 s</text><text x="755" y="588" font-size="27" fill="#19333c" text-anchor="middle">新误差 e1</text><text x="1100" y="588" font-size="27" fill="#19333c" text-anchor="middle">新目标 f1</text><line x1="60" y1="607" x2="1215" y2="607" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="652" font-size="28" fill="#256b82" text-anchor="start">普通 = 对角</text><text x="385" y="652" font-size="29" fill="#256b82" text-anchor="middle">(0.48, −0.52)</text><text x="755" y="652" font-size="29" fill="#256b82" text-anchor="middle">(1.98, 1.98)</text><text x="1100" y="652" font-size="28" fill="#256b82" text-anchor="middle">3.9204</text><text x="60" y="718" font-size="28" fill="#c0643c" text-anchor="start">精确</text><text x="385" y="718" font-size="29" fill="#c0643c" text-anchor="middle">(−1.5, −2.5)</text><text x="755" y="718" font-size="29" fill="#c0643c" text-anchor="middle">(0, 0)</text><text x="1100" y="718" font-size="28" fill="#c0643c" text-anchor="middle">0</text><text x="60" y="815" font-size="27" fill="#71858b" text-anchor="start">e1 = e0 + s；f1 = 0.5 e1^T H e1。内部方向还要乘步长，才能得到 s。</text></g></svg>
