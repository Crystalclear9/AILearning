<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="755" viewBox="0 0 1320 755" role="img" aria-labelledby="title description">
  <title id="title">三角形上的投影、参数路径与乘子</title>
  <desc id="description">图 A 是平面坐标，图 B 和 C 的横轴才是参数 a。两处分段切换位于 a=1 和 a=3。</desc>
