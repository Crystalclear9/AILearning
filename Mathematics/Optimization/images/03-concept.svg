<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>边界最优：目标梯度与约束法向恰好平衡</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">边界最优：目标梯度与约束法向恰好平衡</text><text x="60" y="120" font-size="28" fill="#71858b" text-anchor="start">min x² + y²，约束 x + y ≥ 2；最优点 (1, 1)，目标值 2</text><defs><clipPath id="plot"><rect x="135" y="260" width="405" height="405"/></clipPath></defs><g clip-path="url(#plot)"><polygon points="135.0,275.0 135.0,260.0 540.0,260.0 540.0,665.0 525.0,665.0" fill="#edf4f6"/><circle cx="180" cy="620" r="150" fill="none" stroke="#dbe5e8" stroke-width="3"/><circle cx="180" cy="620" r="212.13203435596427" fill="none" stroke="#dbe5e8" stroke-width="3"/><circle cx="180" cy="620" r="300" fill="none" stroke="#dbe5e8" stroke-width="3"/><line x1="135.0" y1="275.0" x2="525.0" y2="665.0" stroke="#256b82" stroke-width="4"/></g><line x1="135" y1="620" x2="555" y2="620" stroke="#71858b" stroke-width="2"/><line x1="180" y1="665" x2="180" y2="245" stroke="#71858b" stroke-width="2"/><text x="180" y="706" font-size="24" fill="#71858b" text-anchor="middle">0</text><text x="330" y="706" font-size="24" fill="#71858b" text-anchor="middle">1</text><text x="480" y="706" font-size="24" fill="#71858b" text-anchor="middle">2</text><text x="118" y="479" font-size="24" fill="#71858b" text-anchor="end">1</text><text x="118" y="329" font-size="24" fill="#71858b" text-anchor="end">2</text><circle cx="180" cy="620" r="6" fill="#71858b"/><circle cx="330" cy="470" r="8" fill="#c0643c"/><text x="350" y="482" font-size="27" fill="#c0643c" text-anchor="start">(1, 1)</text><text x="220" y="305" font-size="28" fill="#256b82" text-anchor="start">可行域</text><text x="60" y="185" font-size="29" fill="#19333c" text-anchor="start">最近等值圆在边界相切</text><text x="670" y="185" font-size="29" fill="#19333c" text-anchor="start">同一最优点的向量平衡</text><line x1="915" y1="420" x2="1055" y2="280" stroke="#256b82" stroke-width="5"/><path d="M1055,280 l-16.97056274847714,5.65685424949238 l11.31370849898476,11.31370849898476 Z" fill="#256b82"/><line x1="915" y1="420" x2="775" y2="560" stroke="#c0643c" stroke-width="5"/><path d="M775,560 l16.97056274847714,-5.65685424949238 l-11.31370849898476,-11.31370849898476 Z" fill="#c0643c"/><circle cx="915" cy="420" r="8" fill="#19333c"/><text x="1040" y="250" font-size="27" fill="#256b82" text-anchor="middle">目标梯度 (2, 2)</text><text x="905" y="625" font-size="27" fill="#c0643c" text-anchor="middle">乘子 × 约束梯度 (−2, −2)</text><text x="930" y="696" font-size="27" fill="#19333c" text-anchor="middle">两者之和 = 0；目标梯度自身 ≠ 0</text><text x="60" y="780" font-size="27" fill="#71858b" text-anchor="start">约束写作 2 − x − y ≤ 0；λ = 2，满足非负乘子、可行、互补与驻点。</text></g></svg>
