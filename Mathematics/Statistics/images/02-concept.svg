<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>检验结论不能直接反推假设概率</title><rect width="1200" height="850" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#153652">检验结论不能直接反推假设概率</text><text x="60" y="110" font-size="21" fill="#526878">具体算例 · 从条件到结果，逐项核对</text>
<rect x="60" y="470" width="530" height="112" rx="12" fill="#edf5fc" stroke="#bacbd8"/><text x="78" y="500" font-size="19" fill="#557086">01</text>
<text x="78" y="539" font-size="24" fill="#18374e">设定零假设 H₀</text>
<rect x="625" y="470" width="530" height="112" rx="12" fill="#eef8f2" stroke="#bacbd8"/><text x="643" y="500" font-size="19" fill="#557086">02</text>
<text x="643" y="539" font-size="24" fill="#18374e">计算极端数据概率 p</text>
<rect x="60" y="610" width="530" height="112" rx="12" fill="#fff6e7" stroke="#bacbd8"/><text x="78" y="640" font-size="19" fill="#557086">03</text>
<text x="78" y="679" font-size="24" fill="#18374e">比较 p 与显著性水平 α</text>
<rect x="625" y="610" width="530" height="112" rx="12" fill="#f3effb" stroke="#bacbd8"/><text x="643" y="640" font-size="19" fill="#557086">04</text>
<text x="643" y="679" font-size="24" fill="#18374e">拒绝或不拒绝 H₀</text>
<text x="60" y="785" font-size="20" fill="#526878">各框属于同一论证或算例；具体适用条件与读图方法见正文。</text><line x1="280" y1="220" x2="860" y2="220" stroke="#267ab0" stroke-width="3"/><text x="565.0" y="208.0" font-size="18" fill="#173b51">定义分布</text><line x1="860" y1="220" x2="860" y2="370" stroke="#267ab0" stroke-width="3"/><text x="855.0" y="283.0" font-size="18" fill="#173b51">比较极端程度</text><line x1="280" y1="370" x2="860" y2="370" stroke="#267ab0" stroke-width="3"/><text x="565.0" y="358.0" font-size="18" fill="#173b51">定位观测值</text><rect x="110" y="190" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae"/><text x="128" y="233" font-size="22" fill="#173b51">假设 H₀ 成立</text><rect x="690" y="190" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae"/><text x="708" y="233" font-size="22" fill="#173b51">统计量的零分布</text><rect x="110" y="340" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae"/><text x="128" y="383" font-size="22" fill="#173b51">实际观测统计量</text><rect x="690" y="340" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae"/><text x="708" y="383" font-size="22" fill="#173b51">零分布下的尾概率 p</text></g></svg>