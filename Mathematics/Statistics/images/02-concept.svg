<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>检验结论不能直接反推假设概率</title><rect width="1200" height="850" fill="#f7fbfd" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">检验结论不能直接反推假设概率</text><rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="690.0" font-size="22" fill="#16344c">设定零假设 H₀</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="690.0" font-size="22" fill="#16344c">计算极端数据概率 p</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="780.0" font-size="22" fill="#16344c">比较 p 与显著性水平 α</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="780.0" font-size="22" fill="#16344c">拒绝或不拒绝 H₀</text>
<line x1="490.0" y1="255.0" x2="690.0" y2="255.0" stroke="#267ab0" stroke-width="3" marker-end="url(#semantic-arrow)" /><text x="565.0" y="237.0" font-size="18" fill="#173b51">定义分布</text><line x1="860.0" y1="315.0" x2="860.0" y2="435.0" stroke="#267ab0" stroke-width="3" marker-end="url(#semantic-arrow)" /><text x="855.0" y="349.5" font-size="18" fill="#173b51">比较极端程度</text><line x1="490.0" y1="480.0" x2="690.0" y2="480.0" stroke="#267ab0" stroke-width="3" marker-end="url(#semantic-arrow)" /><text x="565.0" y="462.0" font-size="18" fill="#173b51">定位观测值</text><rect x="110" y="210.0" width="380" height="105.0" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="128" y="274.5" font-size="22" fill="#173b51">假设 H₀ 成立</text><rect x="690" y="210.0" width="380" height="105.0" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="708" y="274.5" font-size="22" fill="#173b51">统计量的零分布</text><rect x="110" y="435.0" width="380" height="105.0" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="128" y="499.5" font-size="22" fill="#173b51">实际观测统计量</text><rect x="690" y="435.0" width="380" height="105.0" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="708" y="499.5" font-size="22" fill="#173b51">零分布下的尾概率 p</text></g><defs><marker id="semantic-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#267ab0" /></marker></defs></svg>
