<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1640" viewBox="0 0 1100 1640" role="img"><title>回归系数如何受混杂影响</title><desc>A画出共同原因同时影响输入与结果的分叉，回归关联因此未必是干预效应。B在两个层内都设处理成功率高0.1。C改变两组层构成后，粗率发生反转；按共同各半总体标准化才恢复可比的层加权差。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#118779" /></marker></defs><rect width="1100" height="1640" fill="#f3f6f8" /><rect x="24" y="88" width="1052" height="996" rx="16" fill="#ffffff" stroke="#dbe4e9" /><rect x="24" y="1104" width="516" height="510" rx="16" fill="#ffffff" stroke="#dbe4e9" /><rect x="560" y="1104" width="516" height="510" rx="16" fill="#ffffff" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">回归系数如何受混杂影响</text><rect x="40" y="106" width="4" height="26" rx="2" fill="#118779" /><text x="52" y="130" font-size="25" font-weight="650" fill="#15364c">A  机制与几何</text><rect x="36" y="1123" width="4" height="26" rx="2" fill="#118779" /><text x="48" y="1147" font-size="25" font-weight="650" fill="#15364c">B  数值算例</text><rect x="572" y="1123" width="4" height="26" rx="2" fill="#118779" /><text x="584" y="1147" font-size="25" font-weight="650" fill="#15364c">C  对照与边界</text><g transform="scale(1.08)"><circle cx="480.00" cy="327.20" r="26" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="480.00" y="336.32" font-size="21" fill="#15364c" text-anchor="middle">Z</text><circle cx="228.00" cy="692.00" r="26" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="228.00" y="701.12" font-size="21" fill="#15364c" text-anchor="middle">T</text><circle cx="732.00" cy="692.00" r="26" fill="#e4f1ef" stroke="#118779" stroke-width="2" /><text x="732.00" y="701.12" font-size="21" fill="#15364c" text-anchor="middle">Y</text><path d="M446.40,365.20 L261.60,646.40" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" strok