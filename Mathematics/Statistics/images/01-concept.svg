<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>置信区间的重复抽样含义</title><rect width="1200" height="850" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#153652">置信区间的重复抽样含义</text><text x="60" y="110" font-size="21" fill="#526878">具体算例 · 从条件到结果，逐项核对</text>
<rect x="60" y="470" width="530" height="112" rx="12" fill="#edf5fc" stroke="#bacbd8"/><text x="78" y="500" font-size="19" fill="#557086">01</text>
<text x="78" y="539" font-size="24" fill="#18374e">固定未知参数 θ</text>
<rect x="625" y="470" width="530" height="112" rx="12" fill="#eef8f2" stroke="#bacbd8"/><text x="643" y="500" font-size="19" fill="#557086">02</text>
<text x="643" y="539" font-size="24" fill="#18374e">反复抽样得到不同区间</text>
<rect x="60" y="610" width="530" height="112" rx="12" fill="#fff6e7" stroke="#bacbd8"/><text x="78" y="640" font-size="19" fill="#557086">03</text>
<text x="78" y="679" font-size="24" fill="#18374e">名义覆盖率 95%</text>
<rect x="625" y="610" width="530" height="112" rx="12" fill="#f3effb" stroke="#bacbd8"/><text x="643" y="640" font-size="19" fill="#557086">04</text>
<text x="643" y="679" font-size="24" fill="#18374e">长期约 95% 区间覆盖 θ</text>
<text x="60" y="785" font-size="20" fill="#526878">各框属于同一论证或算例；具体适用条件与读图方法见正文。</text><line x1="600" y1="160" x2="600" y2="420" stroke="#267ab0" stroke-width="3"/><text x="580" y="150" font-size="22" fill="#173b51">固定 θ</text><line x1="380" y1="190" x2="710" y2="190" stroke="#267ab0" stroke-width="3"/><text x="180" y="196" font-size="18" fill="#173b51">样本 1</text><line x1="490" y1="220" x2="840" y2="220" stroke="#267ab0" stroke-width="3"/><text x="180" y="226" font-size="18" fill="#173b51">样本 2</text><line x1="340" y1="250" x2="650" y2="250" stroke="#267ab0" stroke-width="3"/><text x="180" y="256" font-size="18" fill="#173b51">样本 3</text><line x1="660" y1="280" x2="980" y2="280" stroke="#267ab0" stroke-width="3"/><text x="180" y="286" font-size="18" fill="#173b51">样本 4</text><line x1="440" y1="310" x2="730" y2="310" stroke="#267ab0" stroke-width="3"/><text x="180" y="316" font-size="18" fill="#173b51">样本 5</text><line x1="280" y1="340" x2="620" y2="340" stroke="#267ab0" stroke-width="3"/><text x="180" y="346" font-size="18" fill="#173b51">样本 6</text><line x1="570" y1="370" x2="900" y2="370" stroke="#267ab0" stroke-width="3"/><text x="180" y="376" font-size="18" fill="#173b51">样本 7</text><text x="700" y="170" font-size="22" fill="#173b51">示意：不要求小样本覆盖比例恰好 95%</text></g></svg>