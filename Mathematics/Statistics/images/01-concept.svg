<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img"><title>置信区间的重复抽样含义</title><desc>A固定真实参数，只让反复抽样的区间变化，其中一条故意不覆盖，以区分程序覆盖率与单个已观察区间的解释。B明确这10条只是示意，不能从9条覆盖反推名义95%的精确实测结果。C在10次零成功时对照退化Wald与非退化Wilson区间。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#118779" /></marker></defs><rect width="1500" height="1050" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="341.6667" y2="341.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="278.3333" y2="278.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="55.00" y="65.00" font-size="34" fill="#15364c" text-anchor="start">置信区间的重复抽样含义</text><text x="60.00" y="125.00" font-size="25" fill="#15364c" text-anchor="start">A  核心机制与几何</text><text x="985.00" y="125.00" font-size="25" fill="#15364c" text-anchor="start">B  可复算的数值</text><text x="985.00" y="565.00" font-size="25" fill="#15364c" text-anchor="start">C  对照、变化与边界</text><line x1="945.00" y1="150.00" x2="945.00" y2="980.00" stroke="#d8e3e8" stroke-width="2" /><line x1="980.00" y1="535.00" x2="1440.00" y2="535.00" stroke="#d8e3e8" stroke-width="2" /><line x1="538.80" y1="236.00" x2="538.80" y2="844.00" stroke="#cb702a" stroke-width="2" /><text x="538.80" y="213.20" font-size="22" fill="#15364c" text-anchor="middle">固定参数θ</text><line x1="312.00" y1="281.60" x2="648.00" y2="281.60" stroke="#118779" stroke-width="2" /><text x="102.00" y="290.72" font-size="20" fill="#15364c" text-anchor="start">样本1</text><line x1="438.00" y1="338.60" x2="732.00" y2="338.60" stroke="#118779" stroke-width="2" /><text x="102.00" y="347.72" font-size="20" fill="#15364c" text-anchor="start">样本2</text><line x1="228.00" y1="39