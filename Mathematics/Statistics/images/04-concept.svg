<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>抽十五行，还是抽三位患者？</title><desc>三位独立患者各重复五个完全相同测量0、2、4。经验簇bootstrap均值分布通过27个有序样本精确枚举；错误逐行bootstrap均值分布通过3项多项式15次卷积精确计算。方差分别8/9和8/45。仅用于展示伪重复，不提供小群组可靠覆盖保证。</desc><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">抽十五行，还是抽三位患者？</text><text x="40" y="102" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">三位患者各重复五次完全相同测量；真实的独立单位只有三位</text><text x="50" y="180" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">患者 1</text><circle cx="240" cy="170" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="240" y="179" font-size="25" fill="white" text-anchor="middle" font-weight="400">0</text><circle cx="330" cy="170" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="330" y="179" font-size="25" fill="white" text-anchor="middle" font-weight="400">0</text><circle cx="420" cy="170" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="420" y="179" font-size="25" fill="white" text-anchor="middle" font-weight="400">0</text><circle cx="510" cy="170" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="510" y="179" font-size="25" fill="white" text-anchor="middle" font-weight="400">0</text><circle cx="600" cy="170" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="600" y="179" font-size="25" fill="white" text-anchor="middle" font-weight="400">0</text><text x="50" y="254" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">患者 2</text><circle cx="240" cy="244" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="240" y="253" font-size="25" fill="white" text-anchor="middle" font-weight="400">2</text><circle cx="330" cy="244" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="330" y="253" font-size="25" fill="white" text-anchor="middle" font-weight="400">2</text><circle cx="420" cy="244" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="420" y="253" font-size="25" fill="white" text-anchor="middle" font-weight="400">2</text><circle cx="510" cy="244" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="510" y="253" font-size="25" fill="white" text-anchor="middle" font-weight="400">2</text><circle cx="600" cy="244" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="600" y="253" font-size="25" fill="white" text-anchor="middle" font-weight="400">2</text><text x="50" y="328" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">患者 3</text><circle cx="240" cy="318" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="240" y="327" font-size="25" fill="white" text-anchor="middle" font-weight="400">4</text><circle cx="330" cy="318" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="330" y="327" font-size="25" fill="white" text-anchor="middle" font-weight="400">4</text><circle cx="420" cy="318" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="420" y="327" font-size="25" fill="white" text-anchor="middle" font-weight="400">4</text><circle cx="510" cy="318" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="510" y="327" font-size="25" fill="white" text-anchor="middle" font-weight="400">4</text><circle cx="600" cy="318" r="23" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="600" y="327" font-size="25" fill="white" text-anchor="middle" font-weight="400">4</text><text x="760" y="182" font-size="28" fill="#c0643c" text-anchor="start" font-weight="700">抽到 [3, 3, 1]</text><text x="760" y="228" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">整组带走：4、4、0</text><text x="760" y="270" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">每次均值按患者等权</text><text x="760" y="314" font-size="27" fill="#c0643c" text-anchor="start" font-weight="400">此轮均