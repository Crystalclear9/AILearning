<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>重采样必须尊重独立单位</title><rect width="1200" height="850" fill="#f7fbfd" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">重采样必须尊重独立单位</text><rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="690.0" font-size="22" fill="#16344c">同一患者的多条记录</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="690.0" font-size="22" fill="#16344c">患者间近似独立</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="780.0" font-size="22" fill="#16344c">按患者整体重采样</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="780.0" font-size="22" fill="#16344c">保留患者内相关结构</text>
<rect x="140" y="180" width="260" height="215" rx="15" fill="#eef6fc" stroke="#6893ae" /><text x="165" y="215" font-size="22" fill="#173b51">患者 1</text><circle cx="180" cy="260" r="13" fill="#287eaf" /><circle cx="223" cy="305" r="13" fill="#287eaf" /><circle cx="266" cy="260" r="13" fill="#287eaf" /><circle cx="309" cy="305" r="13" fill="#287eaf" /><circle cx="352" cy="260" r="13" fill="#287eaf" /><text x="155" y="370" font-size="22" fill="#173b51">整簇抽取，保留相关</text><rect x="480" y="180" width="260" height="215" rx="15" fill="#eef6fc" stroke="#6893ae" /><text x="505" y="215" font-size="22" fill="#173b51">患者 2</text><circle cx="520" cy="260" r="13" fill="#287eaf" /><circle cx="563" cy="305" r="13" fill="#287eaf" /><circle cx="606" cy="260" r="13" fill="#287eaf" /><circle cx="649" cy="305" r="13" fill="#287eaf" /><circle cx="692" cy="260" r="13" fill="#287eaf" /><text x="495" y="370" font-size="22" fill="#173b51">整簇抽取，保留相关</text><rect x="820" y="180" width="260" height="215" rx="15" fill="#eef6fc" stroke="#6893ae" /><text x="845" y="215" font-size="22" fill="#173b51">患者 3</text><circle cx="860" cy="260" r="13" fill="#287eaf" /><circle cx="903" cy="305" r="13" fill="#287eaf" /><circle cx="946" cy="260" r="13" fill="#287eaf" /><circle cx="989" cy="305" r="13" fill="#287eaf" /><circle cx="1032" cy="260" r="13" fill="#287eaf" /><text x="835" y="370" font-size="22" fill="#173b51">整簇抽取，保留相关</text></g></svg>
