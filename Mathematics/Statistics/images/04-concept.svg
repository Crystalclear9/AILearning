<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1640" viewBox="0 0 1100 1640" role="img"><title>重采样必须尊重独立单位</title><desc>A把每位患者的5次记录画在同一簇内，真正近似独立的是患者而非行。B用配对A/B观测说明抽取编号时应整对带走，重复编号也保留配对。C区分15行与3个独立簇，防止把重采样次数或记录数误作独立信息量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#118779" /></marker></defs><rect width="1100" height="1640" fill="#f3f6f8" /><rect x="24" y="88" width="1052" height="996" rx="16" fill="#ffffff" stroke="#dbe4e9" /><rect x="24" y="1104" width="516" height="510" rx="16" fill="#ffffff" stroke="#dbe4e9" /><rect x="560" y="1104" width="516" height="510" rx="16" fill="#ffffff" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">重采样必须尊重独立单位</text><rect x="40" y="106" width="4" height="26" rx="2" fill="#118779" /><text x="52" y="130" font-size="25" font-weight="650" fill="#15364c">A  机制与几何</text><rect x="36" y="1123" width="4" height="26" rx="2" fill="#118779" /><text x="48" y="1147" font-size="25" font-weight="650" fill="#15364c">B  数值算例</text><rect x="572" y="1123" width="4" height="26" rx="2" fill="#118779" /><text x="584" y="1147" font-size="25" font-weight="650" fill="#15364c">C  对照与边界</text><g transform="scale(1.08)"><rect x="110.40" y="312.00" width="226.80" height="418.00" rx="5" fill="#edf5f8" stroke="#a5bdc8" /><text x="122.40" y="365.20" font-size="23" fill="#15364c" text-anchor="start">患者1</text><circle cx="156.60" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="223.80" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="291.00" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="156.60" cy="578.00" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="223.80" cy="578.00" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><rect x="370.80" y="312.00" width="226.80" height="418.00" rx="5" fill="#edf5f8" stroke="#a5bdc8" /><text x="382.80" y="365.20" font-size="23" fill="#15364c" text-anchor="start">患者2</text><circle cx="417.00" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="484.20" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="551.40" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="417.00" cy="578.00" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="484.20" cy="578.00" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><rect x="631.20" y="312.00" width="226.80" height="418.00" rx="5" fill="#edf5f8" stroke="#a5bdc8" /><text x="643.20" y="365.20" font-size="23" fill="#15364c" text-anchor="start">患者3</text><circle cx="677.40" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="744.60" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="811.80" cy="479.20" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="677.40" cy="578.00" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><circle cx="744.60" cy="578.00" r="9" fill="#118779" stroke="#118779" stroke-width="2" /><text x="110.40" y="844.00" font-size="24" fill="#15364c" text-anchor="start">每个矩形是一整个重采样单位</text></g><g transform="translate(-998.8,1021) scale(1.06)"><text x="1003.00" y="199.60" font-size="22" fill="#15364c" text-anchor="start">按受试者编号抽取整对</text><text x="1003.00" y="275.50" font-size="23" fill="#15364c" text-anchor="start">编号1：A=2，B=3</text><text x="1003.00" y="325.00" font-size="23" fill="#15364c" text-anchor="start">编号2：A=5，B=4</text><path d="M1210.00,348.10 L1210.00,391.00" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="1003.00" y="440.50" font-size="22" fill="#15364c" text-anchor="start">抽[2,2,1]：重复保留整对</text></g><g transform="translate(-458.8,554.6) scale(1.06)"><lin