<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>权重不均匀如何缩小有效样本量</title><desc>四个归一化权重之和为1，但第一项独占0.7。常用权重有效样本量等于平方和的倒数，这里为约1.923，而不是4。图将行数与权重集中度分开，说明少数高权重样本可能支配估计。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac"/></marker></defs><rect width="1200" height="800" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#193e54" text-anchor="start">权重不均匀如何缩小有效样本量</text><text x="85" y="190" font-size="22" fill="#193e54" text-anchor="start">数值</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#277eac" stroke-width="2.5"/><rect x="135.0" y="318.3" width="145.0" height="291.7" fill="#1977b4"/><text x="207.5" y="302.33333333333337" font-size="24" fill="#193e54" text-anchor="middle">0.7</text><text x="207.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">归一化权重1</text><rect x="370.0" y="568.3" width="145.0" height="41.7" fill="#d26724"/><text x="442.5" y="552.3333333333334" font-size="24" fill="#193e54" text-anchor="middle">0.1</text><text x="442.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">归一化权重2</text><rect x="605.0" y="568.3" width="145.0" height="41.7" fill="#148671"/><text x="677.5" y="552.3333333333334" font-size="24" fill="#193e54" text-anchor="middle">0.1</text><text x="677.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">归一化权重3</text><rect x="840.0" y="568.3" width="145.0" height="41.7" fill="#1977b4"/><text x="912.5" y="552.3333333333334" font-size="24" fill="#193e54" text-anchor="middle">0.1</text><text x="912.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">归一化权重4</text></g></svg>