<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title>同一组权重，不能独自决定积分误差</title><desc>四个归一化权重为.7,.1,.1,.1，有效样本量25/13。相同权重下，被积函数常数1的估计恒为1；指示首点的函数估计为.7。固定样本示意不代表已知目标积分。</desc><rect width="1200" height="710" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">同一组权重，不能独自决定积分误差</text><text x="40" y="103" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">归一化权重相同，ESS 都是 1.923；还要看函数值与未覆盖区域</text><text x="40" y="173" font-size="27" fill="#19333c" text-anchor="start" font-weight="700">样本</text><text x="360" y="173" font-size="28" fill="#78878b" text-anchor="middle" font-weight="400">1</text><rect x="305" y="225.0" width="110" height="190.0" fill="#dbecef" stroke="#256b82" stroke-width="2"/><text x="360" y="450" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">0.7</text><text x="565" y="173" font-size="28" fill="#78878b" text-anchor="middle" font-weight="400">2</text><rect x="510" y="387.85714285714283" width="110" height="27.142857142857146" fill="#dbecef" stroke="#256b82" stroke-width="2"/><text x="565" y="450" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">0.1</text><text x="770" y="173" font-size="28" fill="#78878b" text-anchor="middle" font-weight="400">3</text><rect x="715" y="387.85714285714283" width="110" height="27.142857142857146" fill="#dbecef" stroke="#256b82" stroke-width="2"/><text x="770" y="450" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">0.1</text><text x="975" y="173" font-size="28" fill="#78878b" text-anchor="middle" font-weight="400">4</text><rect x="920" y="387.85714285714283" width="110" height="27.142857142857146" fill="#dbecef" stroke="#256b82" stroke-width="2"/><text x="975" y="450" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">0.1</text><text x="40" y="270" font-size="28" fill="#256b82" text-anchor="start" font-weight="400">权重</text><text x="40" y="321" font-size="25" fill="#78878b" text-anchor="start" font-weight="400">总和 = 1</text><line x1="40" y1="483" x2="1160" y2="483" stroke="#dce4e5" stroke-width="2"/><text x="40" y="538" font-size="28" fill="#256b82" text-anchor="start" font-weight="400">常数函数</text><text x="360" y="538" font-size="29" fill="#256b82" text-anchor="middle" font-weight="400">1</text><text x="565" y="538" font-size="29" fill="#256b82" text-anchor="middle" font-weight="400">1</text><text x="770" y="538" font-size="29" fill="#256b82" text-anchor="middle" font-weight="400">1</text><text x="975" y="538" font-size="29" fill="#256b82" text-anchor="middle" font-weight="400">1</text><text x="1105" y="538" font-size="27" fill="#256b82" text-anchor="middle" font-weight="400">→ 1</text><text x="40" y="611" font-size="28" fill="#c0643c" text-anchor="start" font-weight="400">另一个函数</text><text x="360" y="611" font-size="29" fill="#c0643c" text-anchor="middle" font-weight="400">1</text><text x="565" y="611" font-size="29" fill="#c0643c" text-anchor="middle" font-weight="400">0</text><text x="770" y="611" font-size="29" fill="#c0643c" text-anchor="middle" font-weight="400">0</text><text x="975" y="611" font-size="29" fill="#c0643c" text-anchor="middle" font-weight="400">0</text><text x="1105" y="611" font-size="27" fill="#c0643c" text-anchor="middle" font-weight="400">→ 0.7</text><text x="40" y="684" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">常数函数无需随机估计误差；另一函数的真值和误差，不能只从权重表得出。</text></g></svg>
