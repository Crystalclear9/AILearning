<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>全方差：把每个观测的偏差拆成两段</title><desc>两组等权，第一组取负一与一，第二组取三与五；四点等概率。组内方差1，组均值0与4，总均值2，组间方差4，总方差5。</desc><rect width="1200" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">全方差：把每个观测的偏差拆成两段</text><text x="40" y="103" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">四个点各占四分之一；两组均值为 0 与 4，总体均值为 2</text><text x="45" y="254" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">组 A</text><line x1="128.0" y1="245" x2="1052.0" y2="245" stroke="#dce4e5" stroke-width="2"/><line x1="590" y1="185" x2="590" y2="414" stroke="#78878b" stroke-width="2" stroke-dasharray="6 6"/><line x1="310" y1="245" x2="170" y2="245" stroke="#256b82" stroke-width="6"/><circle cx="170" cy="245" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="170" y="285" font-size="25" fill="#256b82" text-anchor="middle" font-weight="400">−1</text><line x1="310" y1="245" x2="450" y2="245" stroke="#256b82" stroke-width="6"/><circle cx="450" cy="245" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="450" y="285" font-size="25" fill="#256b82" text-anchor="middle" font-weight="400">1</text><path d="M310.00,233.00 L320.00,245.00 L310.00,257.00 L300.00,245.00 Z" stroke="#c0643c" stroke-width="2" fill="#c0643c" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="217" font-size="25" fill="#c0643c" text-anchor="middle" font-weight="400">组均值 0</text><line x1="310" y1="188" x2="590" y2="188" stroke="#c0643c" stroke-width="4"/><text x="450.0" y="177" font-size="24" fill="#c0643c" text-anchor="middle" font-weight="400">距离 2</text><text x="45" y="374" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">组 B</text><line x1="128.0" y1="365" x2="1052.0" y2="365" stroke="#dce4e5" stroke-width="2"/><line x1="590" y1="185" x2="590" y2="414" stroke="#78878b" stroke-width="2" stroke-dasharray="6 6"/><line x1="870" y1="365" x2="730" y2="365" stroke="#256b82" stroke-width="6"/><circle cx="730" cy="365" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="730" y="405" font-size="25" fill="#256b82" text-anchor="middle" font-weight="400">3</text><line x1="870" y1="365" x2="1010" y2="365" stroke="#256b82" stroke-width="6"/><circle cx="1010" cy="365" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="1010" y="405" font-size="25" fill="#256b82" text-anchor="middle" font-weight="400">5</text><path d="M870.00,353.00 L880.00,365.00 L870.00,377.00 L860.00,365.00 Z" stroke="#c0643c" stroke-width="2" fill="#c0643c" stroke-linejoin="round" stroke-linecap="round"/><text x="870" y="337" font-size="25" fill="#c0643c" text-anchor="middle" font-weight="400">组均值 4</text><line x1="870" y1="308" x2="590" y2="308" stroke="#c0643c" stroke-width="4"/><text x="730.0" y="297" font-size="24" fill="#c0643c" text-anchor="middle" font-weight="400">距离 2</text><text x="590" y="451" font-size="25" fill="#78878b" text-anchor="middle" font-weight="400">总体均值 2</text><line x1="40" y1="479" x2="1160" y2="479" stroke="#dce4e5" stroke-width="2"/><text x="60" y="525" font-size="27" fill="#256b82" text-anchor="start" font-weight="700">组内平方偏差</text><text x="60" y="575" font-size="25" fill="#19333c" text-anchor="start" font-weight="400">每个点离组均值 1</text><rect x="390" y="535" width="66" height="66" fill="#dbecef" stroke="#256b82" stroke-width="2"/><text x="423" y="578" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">1</text><text x="496" y="580" font-size="34" fill="#78878b" text-anchor="start" font-weight="400">+</text><text x="575" y="525" font-size="27" fill="#c0643c" text-anchor="start" font-weight="700">组间平方偏差</text><rect x="750" y="535" width="132" height="132" fill="#f3ddd0" stroke="#c0643c" stroke-width="2"/><text x="816" y="611" font-size="32" fill="#c0643c" text-anchor="middle" font-weight="400">4</text><text x="965" y="607" font-size="40" fill="#19333c" text-anchor="start" font-weight="700">= 5</text><text x="40" y="724" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">先平方，再按概率平均；交叉项在每组内抵消，所以两种来源可以相加。</text></g></svg>
