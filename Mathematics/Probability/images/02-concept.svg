<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>均值相同，离中心有多远？</title><desc>等概率两点分布分别取正负1和正负2，均值均为0，方差分别为1和4；下方正方形面积编码平方偏差。</desc><rect width="1200" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#213547"><text x="48" y="57" font-size="36" font-weight="600" fill="#213547" text-anchor="start">均值相同，离中心有多远？</text><text x="48" y="102" font-size="26" font-weight="400" fill="#6c7b88" text-anchor="start">每个分布都各有一半概率落在左右两端</text><text x="300" y="165" font-size="28" font-weight="600" fill="#213547" text-anchor="middle">X：取 −1 或 +1</text><line x1="75.0" y1="345" x2="525.0" y2="345" stroke="#6c7b88" stroke-width="2"/><line x1="300" y1="207" x2="300" y2="360" stroke="#b6c1ca" stroke-width="2" stroke-dasharray="6 6"/><text x="120" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">−2</text><text x="210" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">−1</text><text x="300" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">0</text><text x="390" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">1</text><text x="480" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">2</text><line x1="210" y1="345" x2="210" y2="245" stroke="#2166ac" stroke-width="4"/><circle cx="210" cy="245" r="10" fill="#2166ac"/><text x="210" y="225" font-size="26" font-weight="400" fill="#2166ac" text-anchor="middle">0.5</text><line x1="390" y1="345" x2="390" y2="245" stroke="#2166ac" stroke-width="4"/><circle cx="390" cy="245" r="10" fill="#2166ac"/><text x="390" y="225" font-size="26" font-weight="400" fill="#2166ac" text-anchor="middle">0.5</text><text x="300" y="429" font-size="27" font-weight="400" fill="#213547" text-anchor="middle">均值 0</text><line x1="300" y1="310" x2="390" y2="310" stroke="#c56b35" stroke-width="3"/><text x="345.0" y="298" font-size="24" font-weight="400" fill="#c56b35" text-anchor="middle">距离 1</text><text x="900" y="165" font-size="28" font-weight="600" fill="#213547" text-anchor="middle">Y：取 −2 或 +2</text><line x1="675.0" y1="345" x2="1125.0" y2="345" stroke="#6c7b88" stroke-width="2"/><line x1="900" y1="207" x2="900" y2="360" stroke="#b6c1ca" stroke-width="2" stroke-dasharray="6 6"/><text x="720" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">−2</text><text x="810" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">−1</text><text x="900" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">0</text><text x="990" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">1</text><text x="1080" y="384" font-size="24" font-weight="400" fill="#6c7b88" text-anchor="middle">2</text><line x1="720" y1="345" x2="720" y2="245" stroke="#2166ac" stroke-width="4"/><circle cx="720" cy="245" r="10" fill="#2166ac"/><text x="720" y="225" font-size="26" font-weight="400" fill="#2166ac" text-anchor="middle">0.5</text><line x1="1080" y1="345" x2="1080" y2="245" stroke="#2166ac" stroke-width="4"/><circle cx="1080" cy="245" r="10" fill="#2166ac"/><text x="1080" y="225" font-size="26" font-weight="400" fill="#2166ac" text-anchor="middle">0.5</text><text x="900" y="429" font-size="27" font-weight="400" fill="#213547" text-anchor="middle">均值 0</text><line x1="900" y1="310" x2="1080" y2="310" stroke="#c56b35" stroke-width="3"/><text x="990.0" y="298" font-size="24" font-weight="400" fill="#c56b35" text-anchor="middle">距离 2</text><line x1="48" y1="464" x2="1152" y2="464" stroke="#e9eef2" stroke-width="2"/><text x="48" y="515" font-size="28" font-weight="600" fill="#213547" text-anchor="start">把距离平方，再按概率平均</text><rect x="260" y="622" width="80" height="80" fill="#e7ba9d" stroke="#c56b35"/><rect x="820" y="542" width="160" height="160" fill="#e7ba9d" stroke="#c56b35"/><text x="300" y="600" font-size="25" font-weight="400" fill="#c56b35" text-anchor="middle">边长 1</text><text x="1025" y="630" font-size="25" font-weight="400" fill="#c56b35" text-anchor="middle">边长 2</text><text x="300" y="749" font-size="30" font-weight="600" fill="#c56b35" text-anchor="middle">方差 1</text><text x="900" y="749" font-size="30" font-weight="600" fill="#c56b35" text-anchor="middle">方差 4</text></g></svg>
