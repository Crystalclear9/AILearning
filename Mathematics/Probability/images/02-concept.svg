<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>期望与方差衡量不同性质</title>
<desc>X 取 -1、1 各一半；E[X]=0；X² 恒为 1；Var(X)=1</desc>
<rect width="1200" height="850" fill="#f7fbfd" />
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">期望与方差衡量不同性质</text>
<rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="690.0" font-size="22" fill="#16344c">X 取 -1、1 各一半</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="690.0" font-size="22" fill="#16344c">E[X]=0</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="78" y="780.0" font-size="22" fill="#16344c">X² 恒为 1</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" />
<text x="643" y="780.0" font-size="22" fill="#16344c">Var(X)=1</text>
<text x="90" y="150.0" fill="#16344c" font-size="21">均值为零，但两个结果均不等于均值</text><rect x="130.0" y="222.5" width="140" height="304.5" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">结果 -1</text><text x="130.0" y="193.5" fill="#16344c" font-size="21">0.5</text><rect x="555.0" y="222.5" width="140" height="304.5" fill="#d86922" /><text x="555.0" y="563.25" fill="#16344c" font-size="21">结果 +1</text><text x="555.0" y="193.5" fill="#16344c" font-size="21">0.5</text></g></svg>
