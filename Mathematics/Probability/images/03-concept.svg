<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>联合概率如何汇成边缘概率</title><rect width="1200" height="850" fill="#f7fbfd" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">联合概率如何汇成边缘概率</text><rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="690.0" font-size="22" fill="#16344c">P(A,B)=0.2</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="690.0" font-size="22" fill="#16344c">P(A,非B)=0.3</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="780.0" font-size="22" fill="#16344c">P(A)=0.5</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="780.0" font-size="22" fill="#16344c">P(B 条件于 A)=0.4</text>
<text x="90" y="150.0" fill="#16344c" font-size="21">互斥部分相加得到边缘概率</text><rect x="130.0" y="405.2" width="140" height="121.8" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">A 且 B</text><text x="130.0" y="376.2" fill="#16344c" font-size="21">0.2</text><rect x="413.3" y="344.3" width="140" height="182.7" fill="#d86922" /><text x="413.3333333333333" y="563.25" fill="#16344c" font-size="21">A 且非 B</text><text x="413.3333333333333" y="315.3" fill="#16344c" font-size="21">0.3</text><rect x="696.7" y="222.5" width="140" height="304.5" fill="#12816c" /><text x="696.6666666666666" y="563.25" fill="#16344c" font-size="21">边缘 A</text><text x="696.6666666666666" y="193.5" fill="#16344c" font-size="21">0.5</text></g></svg>
