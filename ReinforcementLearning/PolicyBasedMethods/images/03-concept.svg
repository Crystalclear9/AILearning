<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img"><title>GAE：带符号加权，并在重置边界切断连接</title><rect width="1280" height="680" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">GAE：带符号加权，并在重置边界切断连接</text><text x="40" y="110" font-size="27" fill="#233943" text-anchor="start">固定残差 δ = (1, −0.5, 0.25)；γλ = 0.9 × 0.95 = 0.855</text><rect x="220" y="205" width="145" height="260" fill="#276884" stroke="#276884" stroke-width="2"/><text x="292" y="185" font-size="27" fill="#276884" text-anchor="middle">+1.000000</text><text x="292" y="510" font-size="26" fill="#233943" text-anchor="middle">δ0 × 1</text><line x1="365" y1="205" x2="480" y2="205" stroke="#697d87" stroke-width="2" stroke-dasharray="4 4"/><rect x="480" y="205" width="145" height="111.14999999999999" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="552" y="185" font-size="27" fill="#b25d2b" text-anchor="middle">-0.427500</text><text x="552" y="510" font-size="26" fill="#233943" text-anchor="middle">δ1 × 0.855</text><line x1="625" y1="316.15" x2="740" y2="316.15" stroke="#697d87" stroke-width="2" stroke-dasharray="4 4"/><rect x="740" y="268.633375" width="145" height="47.516625000000005" fill="#276884" stroke="#276884" stroke-width="2"/><text x="812" y="248.633375" font-size="27" fill="#276884" text-anchor="middle">+0.182756</text><text x="812" y="510" font-size="26" fill="#233943" text-anchor="middle">δ2 × 0.855²</text><line x1="160" y1="465" x2="935" y2="465" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><text x="1025" y="276.633375" font-size="29" fill="#276884" text-anchor="end">0.755256</text><line x1="1050" y1="180" x2="1050" y2="515" stroke="#b25d2b" stroke-width="3" stroke-dasharray="7 5"/><text x="1110" y="240" font-size="28" fill="#b25d2b" text-anchor="start">重置</text><text x="1110" y="310" font-size="26" fill="#233943" text-anchor="start">新回合</text><text x="1110" y="360" font-size="27" fill="#233943" text-anchor="start">δ = 100</text><line x1="40" y1="555" x2="1240" y2="555" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="40" y="605" font-size="27" fill="#b25d2b" text-anchor="start">正确：新回合不接入；错误：多加 0.855³ × 100 = 62.5026375</text><text x="40" y="650" font-size="28" fill="#233943" text-anchor="start">截断可补原回合尾值，但不能接入重置后的残差</text></g></svg>
