<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>复用同一批数据：每轮都对照采样时的旧概率</title><rect width="1280" height="650" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">复用同一批数据：每轮都对照采样时的旧概率</text><text x="40" y="110" font-size="28" fill="#233943" text-anchor="start">动作 1 的旧概率固定为 0.5；优势 +1；ε = 0.2</text><text x="40" y="170" font-size="25" fill="#233943" text-anchor="start">更新阶段</text><text x="360" y="170" font-size="25" fill="#233943" text-anchor="middle">动作 1（蓝）｜ 动作 0（橙）</text><text x="750" y="170" font-size="25" fill="#233943" text-anchor="start">正确比率</text><text x="950" y="170" font-size="25" fill="#233943" text-anchor="start">裁剪目标</text><text x="1120" y="170" font-size="25" fill="#233943" text-anchor="start">完整 KL</text><text x="80" y="246" font-size="28" fill="#233943" text-anchor="middle">0</text><rect x="180" y="210" width="230.0" height="55" fill="#276884" stroke="#276884" stroke-width="2"/><rect x="410.0" y="210" width="230.0" height="55" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="295.0" y="246" font-size="26" fill="white" text-anchor="middle">0.5</text><text x="525.0" y="246" font-size="26" fill="white" text-anchor="middle">0.5</text><text x="805" y="246" font-size="28" fill="#276884" text-anchor="middle">1.0</text><text x="1005" y="246" font-size="28" fill="#233943" text-anchor="middle">1.0</text><text x="1160" y="246" font-size="27" fill="#b25d2b" text-anchor="middle">0.0000</text><text x="80" y="331" font-size="28" fill="#233943" text-anchor="middle">1</text><rect x="180" y="295" width="276.0" height="55" fill="#276884" stroke="#276884" stroke-width="2"/><rect x="456.0" y="295" width="184.0" height="55" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="318.0" y="331" font-size="26" fill="white" text-anchor="middle">0.6</text><text x="548.0" y="331" font-size="26" fill="white" text-anchor="middle">0.4</text><text x="805" y="331" font-size="28" fill="#276884" text-anchor="middle">1.2</text><text x="1005" y="331" font-size="28" fill="#233943" text-anchor="middle">1.2</text><text x="1160" y="331" font-size="27" fill="#b25d2b" text-anchor="middle">0.0204</text><text x="80" y="416" font-size="28" fill="#233943" text-anchor="middle">2</text><rect x="180" y="380" width="322.0" height="55" fill="#276884" stroke="#276884" stroke-width="2"/><rect x="502.0" y="380" width="138.00000000000003" height="55" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="341.0" y="416" font-size="26" fill="white" text-anchor="middle">0.7</text><text x="571.0" y="416" font-size="26" fill="white" text-anchor="middle">0.3</text><text x="805" y="416" font-size="28" fill="#276884" text-anchor="middle">1.4</text><text x="1005" y="416" font-size="28" fill="#233943" text-anchor="middle">1.2</text><text x="1160" y="416" font-size="27" fill="#b25d2b" text-anchor="middle">0.0872</text><text x="80" y="501" font-size="28" fill="#233943" text-anchor="middle">3</text><rect x="180" y="465" width="368.0" height="55" fill="#276884" stroke="#276884" stroke-width="2"/><rect x="548.0" y="465" width="91.99999999999999" height="55" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="364.0" y="501" font-size="26" fill="white" text-anchor="middle">0.8</text><text x="594.0" y="501" font-size="26" fill="white" text-anchor="middle">0.2</text><text x="805" y="501" font-size="28" fill="#276884" text-anchor="middle">1.6</text><text x="1005" y="501" font-size="28" fill="#233943" text-anchor="middle">1.2</text><text x="1160" y="501" font-size="27" fill="#b25d2b" text-anchor="middle">0.2231</text><line x1="40" y1="565" x2="1240" y2="565" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="40" y="615" font-size="27" fill="#233943" text-anchor="start">分母若随新网络重算，比率错误地恒为 1；平台也不能约束完整 KL</text></g></svg>
