<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>PPO 裁剪的是样本激励，不是动作概率本身</title><rect width="1280" height="650" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">PPO 裁剪的是样本激励，不是动作概率本身</text><text x="40" y="110" font-size="27" fill="#233943" text-anchor="start">同一状态的两个动作；固定优势 A1=+1、A0=−1；ε = 0.2</text><text x="40" y="225" font-size="28" fill="#233943" text-anchor="start">采样旧策略</text><rect x="260" y="185" width="400.0" height="62" fill="#276884" stroke="#276884" stroke-width="2"/><rect x="660.0" y="185" width="400.0" height="62" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="460.0" y="226" font-size="28" fill="white" text-anchor="middle">动作 1：0.5</text><text x="860.0" y="226" font-size="28" fill="white" text-anchor="middle">0.5</text><text x="40" y="340" font-size="28" fill="#233943" text-anchor="start">更新新策略</text><rect x="260" y="300" width="640.0" height="62" fill="#276884" stroke="#276884" stroke-width="2"/><rect x="900.0" y="300" width="159.99999999999997" height="62" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="580.0" y="341" font-size="28" fill="white" text-anchor="middle">动作 1：0.8</text><text x="980.0" y="341" font-size="28" fill="white" text-anchor="middle">0.2</text><text x="660" y="165" font-size="24" fill="#697d87" text-anchor="middle">0.5</text><line x1="660" y1="180" x2="660" y2="380" stroke="#697d87" stroke-width="2" stroke-dasharray="5 5"/><text x="260" y="420" font-size="28" fill="#276884" text-anchor="start">动作 1：r = 1.6</text><text x="740" y="420" font-size="28" fill="#b25d2b" text-anchor="start">动作 0：r = 0.4</text><text x="260" y="475" font-size="28" fill="#276884" text-anchor="start">min(1.6, 1.2) = 1.2</text><text x="740" y="475" font-size="28" fill="#b25d2b" text-anchor="start">min(−0.4, −0.8) = −0.8</text><line x1="40" y1="520" x2="1240" y2="520" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="40" y="568" font-size="28" fill="#233943" text-anchor="start">按旧概率平均：裁剪目标 0.2；未裁剪目标 0.6</text><text x="40" y="615" font-size="28" fill="#233943" text-anchor="start">两个样本已处于平台，完整旧到新 KL 仍为 0.223144</text></g></svg>
