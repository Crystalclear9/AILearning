<text x="397.000" y="163.000" fill="#196f77" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="28" text-anchor="start" font-weight="400">1 + 0.9 × 2 = 2.8</text>
<path d="M145.000,246.000 L382.000,339.000" fill="none" stroke="#196f77" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M382.000,339.000 L374.335,331.158 L371.047,339.536 Z" fill="#196f77" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
