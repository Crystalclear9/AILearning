<text x="397.000" y="348.000" fill="#196f77" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="28" text-anchor="start" font-weight="400">1 + 0.9 × 4 = 4.6</text>
<text x="676.000" y="169.000" fill="#196f77" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="35" text-anchor="start" font-weight="400" transform="translate(785.8984375 159.5) scale(0.88095238) translate(-785.8984375 -159.5)">0.5 × 2.8 = 1.4</text>
<text x="676.000" y="248.000" fill="#196f77" font-family="Cambria Math, STIX Two Math, STIXGeneral, DejaVu Serif, serif" font-size="35" text-anchor="start" font-weight="400" transform="translate(785.8984375 238.5) scale(0.88095238) translate(-785.8984375 -238.5)">0.5 × 4.6 = 2.3</text>
