<title id="title">先对机会分支求期望，再比较动作</title><desc id="desc">动作 a 的两个分支路径价值为 2.8 和 4.6。各乘 0.5 后相加得到 3.7。动作 b 的确定价值是 3.9。</desc>
<rect width="1200" height="944" fill="#ffffff"/>
<text x="75.000" y="64.000" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="32" text-anchor="start" font-weight="400">A  动作 a 的机会分支</text>
<text x="674.000" y="64.000" fill="#202a37" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" font-size="32" text-anchor="start" font-weight="400">B  概率乘路径价值</text>
<circle cx="125.000" cy="246.000" r="12" fill="#ffffff" stroke="#196f77" stroke-width="2.3"/>
