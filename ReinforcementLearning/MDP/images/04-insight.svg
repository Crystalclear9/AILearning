<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>同一个信号，后验还取决于先验</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">同一个信号，后验还取决于先验</text><text x="60" y="115" font-size="26" fill="#71858b" text-anchor="start">信号似然：P(e | A) = 0.8，P(e | B) = 0.2；条长表示联合概率质量</text><text x="60" y="190" font-size="29" fill="#183944" text-anchor="start">先验 A 0.5，B 0.5</text><rect x="60" y="220" width="250.0" height="50" fill="#246b82"/><rect x="310.0" y="220" width="250.0" height="50" fill="#c0673e"/><text x="60" y="320" font-size="26" fill="#246b82" text-anchor="start">A 与信号同时发生</text><rect x="470" y="290" width="200.0" height="36" fill="#246b82"/><text x="60" y="370" font-size="26" fill="#c0673e" text-anchor="start">B 与信号同时发生</text><rect x="470" y="340" width="50.0" height="36" fill="#c0673e"/><text x="850" y="318" font-size="27" fill="#183944" text-anchor="start">信号概率 0.5</text><text x="850" y="370" font-size="32" fill="#246b82" text-anchor="start">后验 A = 0.8</text><text x="60" y="450" font-size="29" fill="#183944" text-anchor="start">先验 A 0.2，B 0.8</text><rect x="60" y="480" width="100.0" height="50" fill="#246b82"/><rect x="160.0" y="480" width="400.0" height="50" fill="#c0673e"/><text x="60" y="580" font-size="26" fill="#246b82" text-anchor="start">A 与信号同时发生</text><rect x="470" y="550" width="80.0" height="36" fill="#246b82"/><text x="60" y="630" font-size="26" fill="#c0673e" text-anchor="start">B 与信号同时发生</text><rect x="470" y="600" width="80.0" height="36" fill="#c0673e"/><text x="850" y="578" font-size="27" fill="#183944" text-anchor="start">信号概率 0.32</text><text x="850" y="630" font-size="32" fill="#246b82" text-anchor="start">后验 A = 0.5</text><line x1="60" y1="690" x2="1220" y2="690" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="738" font-size="27" fill="#183944" text-anchor="start">先按似然筛选联合质量，再除以信号总概率；不能只把 0.8 当成后验。</text></g></svg>
