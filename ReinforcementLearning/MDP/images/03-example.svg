<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>同一个导航模型：沿依赖次序传播终点收益</title><rect width="1280" height="760" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">同一个导航模型：沿依赖次序传播终点收益</text><text x="60" y="115" font-size="26" fill="#71858b" text-anchor="start">零 → 一奖励 −0.1；一 → 终点奖励 1；折扣 0.9；终点价值固定为 0</text><text x="60" y="190" font-size="30" fill="#246b82" text-anchor="start">同步：全程读旧表</text><text x="240" y="265" font-size="27" fill="#246b82" text-anchor="middle">旧表 (0, 0)</text><line x1="370" y1="250" x2="470" y2="250" stroke="#246b82" stroke-width="3" stroke-dasharray="" /><text x="650" y="265" font-size="27" fill="#246b82" text-anchor="middle">第一轮 (−0.1, 1)</text><line x1="810" y1="250" x2="910" y2="250" stroke="#246b82" stroke-width="3" stroke-dasharray="" /><text x="1070" y="265" font-size="27" fill="#246b82" text-anchor="middle">第二轮 (0.8, 1)</text><text x="60" y="350" font-size="30" fill="#c0673e" text-anchor="start">原地：先写状态一，再让状态零读取新值</text><text x="240" y="425" font-size="27" fill="#c0673e" text-anchor="middle">开始 (0, 0)</text><line x1="370" y1="410" x2="470" y2="410" stroke="#c0673e" stroke-width="3" stroke-dasharray="" /><text x="650" y="425" font-size="27" fill="#c0673e" text-anchor="middle">写一后 (0, 1)</text><line x1="810" y1="410" x2="910" y2="410" stroke="#c0673e" stroke-width="3" stroke-dasharray="" /><text x="1070" y="425" font-size="27" fill="#c0673e" text-anchor="middle">再写零 (0.8, 1)</text><line x1="60" y1="500" x2="1220" y2="500" stroke="#dce7e9" stroke-width="2" stroke-dasharray="" /><text x="60" y="560" font-size="29" fill="#183944" text-anchor="start">零的向右目标：−0.1 + 0.9 × 1 = 0.8</text><text x="60" y="615" font-size="29" fill="#183944" text-anchor="start">零的向左目标：−0.1 + 0.9 × 0 = −0.1</text><text x="60" y="680" font-size="26" fill="#71858b" text-anchor="start">同一轮扫描可以包含多次连续依赖；扫描次数不能直接当作同一步前瞻。</text><text x="60" y="730" font-size="25" fill="#71858b" text-anchor="start">括号只列两个非终止状态的值；一次状态备份仍同时比较左右两个合法动作。</text></g></svg>
