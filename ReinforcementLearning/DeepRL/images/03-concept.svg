<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>Double DQN：先选动作，再读取同一动作的估值</title><rect width="1280" height="650" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">Double DQN：先选动作，再读取同一动作的估值</text><text x="600" y="128" font-size="29" fill="#276884" text-anchor="middle">动作 A</text><text x="890" y="128" font-size="29" fill="#697d87" text-anchor="middle">动作 B</text><text x="70" y="218" font-size="28" fill="#233943" text-anchor="start">在线网络：选择</text><text x="70" y="382" font-size="28" fill="#233943" text-anchor="start">目标网络：评价</text><circle cx="600" cy="206" r="36" fill="#276884"/><text x="600" y="217" font-size="34" fill="white" text-anchor="middle">5</text><circle cx="890" cy="206" r="36" fill="#697d87"/><text x="890" y="217" font-size="34" fill="white" text-anchor="middle">4</text><circle cx="600" cy="369" r="36" fill="#276884"/><text x="600" y="381" font-size="34" fill="white" text-anchor="middle">2</text><circle cx="890" cy="369" r="36" fill="#b25d2b"/><text x="890" y="381" font-size="34" fill="white" text-anchor="middle">3</text><line x1="600" y1="248" x2="600" y2="318" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="600,318 595.3269798922962,306.94726807196537 604.6730201077038,306.94726807196537" fill="#276884"/><text x="630" y="293" font-size="26" fill="#276884" text-anchor="start">保持 A 身份</text><text x="970" y="378" font-size="26" fill="#b25d2b" text-anchor="start">DQN 取最大</text><line x1="70" y1="443" x2="1210" y2="443" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="70" y="500" font-size="26" fill="#697d87" text-anchor="start">奖励 1，折扣 0.9；非终止</text><text x="70" y="570" font-size="31" fill="#276884" text-anchor="start">Double：1 + 0.9 × 2 = 2.8</text><text x="700" y="570" font-size="31" fill="#b25d2b" text-anchor="start">DQN：1 + 0.9 × 3 = 3.7</text></g></svg>
