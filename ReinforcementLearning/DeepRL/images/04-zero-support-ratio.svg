 fill="#233a4b" font-weight="400" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">目标 π</text><rect x="170" y="277" width="215" height="70" rx="4" fill="#2e77a6"/><rect x="385" y="277" width="215" height="70" rx="4" fill="#be6f3e"/><text x="277" y="322" font-size="34.83px" fill="#ffffff" font-weight="400" text-anchor="middle">A：0.5</text><text x="492" y="322" font-size="34.83px" fill="#ffffff" font-weight="400" text-anchor="middle">B：0.5</text><text x="170" y="413" font-size="34.83px" fill="#a25e34" font-weight="600" text-anchor="start">日志中 B 的概率为 0</text><text x="170" y="458" font-size="34.83px" fill="#a25e34" font-weight="400" text-anchor="start">B 的重要性比无法定义</text><line x1="650" y1="105" x2="650" y2="540" stroke="#dde5eb" stroke-width="2"/><text x="710" y="112" font-size="34.83px" fill="#233a4b" font-weight="600" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">两种环境产生相同日志</text><text x="710" y="175" font-size="33.54px" fill="#2e77a6" font-weight="600" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">环境甲</text><text x="710" y="220" font-size="32.25px" fill="#233a4b" font-weight="400" text-anchor="start">A 奖励 0；B 奖励 1</text><text x="710" y="267" font-size="34.83px" fill="#2e77a6" font-weight="600" text-anchor="start">目标期望奖励 = 0.5</text><text x="710" y="365" font-size="33.54px" fill="#a25e34" font-weight="600" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">环境乙</text><text x="710" y="410" font-size="32.25px" fill="#233a4b" font-weight="400" text-anchor="start">A 奖励 0；B 奖励 -1</text><text x="710" y="457" font-size="34.83px" fill="#a25e34" font-weight="600" text-anchor="start">目标期望奖励 = -0.5</text></g></g></g></g></svg></svg>