<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="424" viewBox="0 47 960 424" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">日志缺失目标动作时重要性采样无法识别目标奖励</title><desc id="artwork-desc">离策略评价：目标动作必须有日志支持</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="373.1"/></clipPath></defs><rect width="960" height="471" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 24.199994) scale(0.758333)"><g><rect id="offline-white-background" x="0" y="68.307692" width="1200" height="492.000000" fill="#ffffff"/><title id="title">离策略评价：目标动作必须有日志支持</title><desc id="desc">离策略评价：目标动作必须有日志支持</desc><rect width="1200" height="600" fill="white"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cb7436"/></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5a758a"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="112" font-size="33.54px" fill="#1f3449" font-weight="600" text-anchor="start">单状态，两动作 A、B</text><text x="35" y="187" font-size="34.83px" fill="#1f3449" font-weight="400" text-anchor="start">行为 β</text><rect x="170" y="150" width="430" height="70" rx="4" fill="#2472b1"/><text x="385" y="194" font-size="34.83px" fill="white" font-weight="400" text-anchor="middle">A：概率 1</text><text x="35" y="315" font-size="34.83px" fill="#1f3449" font-weight="400" text-anchor="start">目标 π</text><rect x="170" y="277" width="215" height="70" rx="4" fill="#2472b1"/><rect x="385" y="277" width="215" height="70" rx="4" fill="#cb7436"/><text x="277" y="322" font-size="34.83px" fill="white" font-weight="400" text-anchor="middle">A：0.5</text><text x="492" y="322" font-size="34.83px" fill="white" font-weight="400" text-anchor="middle">B：0.5</text><text x="170" y="413" font-size="34.83px" fill="#ac612c" font-weight="600" text-anchor="start">日志中 B 的概率为 0</text><text x="170" y="458" font-size="34.83px" fill="#ac612c" font-weight="400" text-anchor="start">B 的重要性比无法定义</text><line x1="650" y1="105" x2="650" y2="540" stroke="#d9e1e8" stroke-width="2"/><text x="710" y="112" font-size="34.83px" fill="#1f3449" font-weight="600" text-anchor="start">两种环境产生相同日志</text><text x="710" y="175" font-size="33.54px" fill="#2472b1" font-weight="600" text-anchor="start">环境甲</text><text x="710" y="220" font-size="32.25px" fill="#1f3449" font-weight="400" text-anchor="start">A 奖励 0；B 奖励 1</text><text x="710" y="267" font-size="34.83px" fill="#2472b1" font-weight="600" text-anchor="start">目标期望奖励 = 0.5</text><text x="710" y="365" font-size="33.54px" fill="#ac612c" font-weight="600" text-anchor="start">环境乙</text><text x="710" y="410" font-size="32.25px" fill="#1f3449" font-weight="400" text-anchor="start">A 奖励 0；B 奖励 -1</text><text x="710" y="457" font-size="34.83px" fill="#ac612c" font-weight="600" text-anchor="start">目标期望奖励 = -0.5</text></g></g></g></g></svg>