<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>目标网络：先固定回归标签，再同步参数</title><rect width="1280" height="650" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">目标网络：先固定回归标签，再同步参数</text><text x="60" y="116" font-size="27" fill="#233943" text-anchor="start">同一下一状态、同一动作的构造预测</text><line x1="100" y1="450" x2="690" y2="450" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="78" y="458" font-size="24" fill="#697d87" text-anchor="end">0</text><line x1="100" y1="318.0" x2="690" y2="318.0" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="78" y="326.0" font-size="24" fill="#697d87" text-anchor="end">0.4</text><line x1="100" y1="186.0" x2="690" y2="186.0" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="78" y="194.0" font-size="24" fill="#697d87" text-anchor="end">0.8</text><line x1="100" y1="450" x2="690" y2="450" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><text x="100" y="489" font-size="24" fill="#697d87" text-anchor="middle">0</text><text x="215" y="489" font-size="24" fill="#697d87" text-anchor="middle">1</text><text x="330" y="489" font-size="24" fill="#697d87" text-anchor="middle">2</text><text x="445" y="489" font-size="24" fill="#697d87" text-anchor="middle">3</text><text x="560" y="489" font-size="24" fill="#697d87" text-anchor="middle">4</text><text x="675" y="489" font-size="24" fill="#697d87" text-anchor="middle">5</text><text x="395" y="530" font-size="25" fill="#697d87" text-anchor="middle">更新时刻</text><polyline fill="none" stroke="#276884" stroke-width="4" points="100.00,450.00 215.00,384.00 330.00,318.00 445.00,285.00 560.00,219.00 675.00,186.00"/><circle cx="100" cy="450" r="6" fill="#276884"/><circle cx="215" cy="384.0" r="6" fill="#276884"/><circle cx="330" cy="318.0" r="6" fill="#276884"/><circle cx="445" cy="285.0" r="6" fill="#276884"/><circle cx="560" cy="219.00000000000003" r="6" fill="#276884"/><circle cx="675" cy="186.0" r="6" fill="#276884"/><polyline fill="none" stroke="#b25d2b" stroke-width="4" points="100.00,450.00 445.00,450.00 445.00,285.00 675.00,285.00"/><line x1="445" y1="390" x2="445" y2="295.0" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray=""/><polygon points="445,295.0 449.6730201077038,306.05273192803463 440.3269798922962,306.05273192803463" fill="#b25d2b"/><text x="465" y="402" font-size="25" fill="#b25d2b" text-anchor="start">硬同步</text><text x="100" y="578" font-size="26" fill="#276884" text-anchor="start">蓝：在线预测</text><text x="380" y="578" font-size="26" fill="#b25d2b" text-anchor="start">橙：目标预测</text><text x="790" y="116" font-size="29" fill="#233943" text-anchor="start">同一条非终止经验</text><text x="790" y="164" font-size="26" fill="#697d87" text-anchor="start">奖励 = 1　折扣 = 0.9</text><text x="790" y="240" font-size="27" fill="#233943" text-anchor="start">时刻 2：同步前</text><text x="790" y="289" font-size="25" fill="#276884" text-anchor="start">读在线：1 + 0.9 × 0.4 = 1.36</text><text x="790" y="337" font-size="25" fill="#b25d2b" text-anchor="start">读目标：1 + 0.9 × 0 = 1</text><line x1="790" y1="375" x2="1210" y2="375" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="790" y="431" font-size="27" fill="#233943" text-anchor="start">时刻 3：同步后</text><text x="790" y="480" font-size="30" fill="#b25d2b" text-anchor="start">目标标签变成 1.45</text><text x="790" y="552" font-size="29" fill="#233943" text-anchor="start">冻结 ≠ 估值正确</text></g></svg>
