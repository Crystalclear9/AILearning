family="Segoe UI, DejaVu Sans, sans-serif" text-anchor="middle" font-weight="400" transform="translate(795 329.8999939) scale(0.86928105) translate(-795 -329.8999939)">1</text><line x1="879" y1="332" x2="996" y2="332" stroke="#655184" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-arrow-violet)"/><polygon points="1011,363 1132,363 1157,301 1036,301" stroke="#655184" fill="url(#a-wash-violet)" stroke-width="1.8" stroke-linejoin="round"/><text x="1084" y="343.9" fill="#655184" font-size="34" font-family="Segoe UI, DejaVu Sans, sans-serif" text-anchor="middle" font-weight="400" transform="translate(1084 329.8999939) scale(0.86928105) translate(-1084 -329.8999939)">0.5</text><text x="99" y="475" fill="#a84b3b" font-size="31" font-family="SimSun, Noto Serif CJK SC, Noto Serif SC, Songti SC, STSong, serif" text-anchor="start" font-weight="400">A 的替换迹</text><polygon points="439,498 560,498 585,436 464,436" stroke="#a84b3b" fill="url(#a-wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="512" y="478.9" fill="#a84b3b" font-size="34" font-family="Segoe UI, DejaVu Sans, sans-serif" text-anchor="middle" font-weight="400" transform="translate(512 464.8999939) scale(0.86928105) translate(-512 -464.8999939)">1</text><line x1="596" y1="467" x2="707" y2="467" stroke="#a84b3b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-arrow-coral)"/><polygon points="722,498 843,498 868,436 747,436" stroke="#a84b3b" fill="url(#a-wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="795" y="478.9" fill="#a84b3b" font-size="34" font-family="Segoe UI, DejaVu Sans, sans-serif" text-anchor="middle" font-weight="400" transform="translate(795 464.8999939) scale(0.86928105) translate(-795 -464.8999939)">0.5</text><line x1="879" y1="467" x2="996" y2="467" stroke="#a84b3b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-arrow-coral)"/><polygon points="1011,498 1132,498 1157,436 1036,436" stroke="#a84b3b" fill="url(#a-wash-coral)" stroke-wid