<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" role="img" aria-labelledby="title description" viewBox="0 0 1200 1449.57142857"><title id="title">资格迹的重复访问与价值更新</title><desc id="description">(a) 资格迹怎样保留近期访问。(b) 资格迹的实际对象：衰减、重复访问与散射更新。</desc><rect width="1200" fill="#fff" height="1449.57142857"/><text x="60" y="35" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="600" fill="#196f77">(a)</text><view id="a" viewBox="0 51 1200 548.571428571"/><view id="a-textbook-detail-1-1" viewBox="0 51 684 312.685714286"/><view id="a-textbook-detail-1-2" viewBox="516 51 684 312.685714286"/><view id="a-textbook-detail-2-1" viewBox="0 286.885714286 684 312.685714286"/><view id="a-textbook-detail-2-2" viewBox="516 286.885714286 684 312.685714286"/><svg width="1200" height="548.571428571" viewBox="0 0 1330 608" role="img" aria-labelledby="a-plate-title a-plate-desc" id="panel-a" x="0" y="51">
<title id="a-plate-title">资格迹怎样保留近期访问</title><desc id="a-plate-desc">访问顺序 A、B、A，迹先衰减为一半再更新。累积迹 A 第三步为 1.25，替换迹 A 为 1。</desc><defs><marker id="a-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="a-wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="a-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="a-wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="a-arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="a-wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="a-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="a-wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="a-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="a-wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%