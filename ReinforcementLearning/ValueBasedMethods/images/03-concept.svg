<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img"><title>资格迹：同一参数怎样承接多次访问的贡献</title><rect width="1280" height="700" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">资格迹：同一参数怎样承接多次访问的贡献</text><text x="40" y="110" font-size="27" fill="#233943" text-anchor="start">γλ = 0.72；上方是一段已发生访问；两次 A 对应同一个参数</text><text x="70" y="175" font-size="26" fill="#233943" text-anchor="start">访问时刻</text><text x="360" y="175" font-size="28" fill="#233943" text-anchor="middle">t − 2</text><text x="620" y="175" font-size="28" fill="#233943" text-anchor="middle">t − 1</text><text x="880" y="175" font-size="28" fill="#233943" text-anchor="middle">t</text><text x="70" y="250" font-size="26" fill="#233943" text-anchor="start">当前状态</text><circle cx="360" cy="240" r="30" fill="#276884"/><text x="360" y="249" font-size="26" fill="white" text-anchor="middle">A</text><circle cx="620" cy="240" r="30" fill="#276884"/><text x="620" y="249" font-size="26" fill="white" text-anchor="middle">B</text><circle cx="880" cy="240" r="30" fill="#276884"/><text x="880" y="249" font-size="26" fill="white" text-anchor="middle">A</text><line x1="398" y1="240" x2="582" y2="240" stroke="#697d87" stroke-width="2.5" stroke-dasharray=""/><polygon points="582,240 570.9472680719654,244.6730201077038 570.9472680719654,235.3269798922962" fill="#697d87"/><line x1="658" y1="240" x2="842" y2="240" stroke="#697d87" stroke-width="2.5" stroke-dasharray=""/><polygon points="842,240 830.9472680719654,244.6730201077038 830.9472680719654,235.3269798922962" fill="#697d87"/><text x="70" y="360" font-size="28" fill="#276884" text-anchor="start">A 的累积迹</text><text x="360" y="360" font-size="28" fill="#276884" text-anchor="middle">0.72² = 0.5184</text><text x="620" y="360" font-size="28" fill="#697d87" text-anchor="middle">0</text><text x="880" y="360" font-size="28" fill="#276884" text-anchor="middle">1</text><line x1="270" y1="390" x2="1000" y2="390" stroke="#276884" stroke-width="3" stroke-dasharray=""/><text x="1030" y="365" font-size="28" fill="#276884" text-anchor="start">= 1.5184</text><text x="70" y="455" font-size="28" fill="#b25d2b" text-anchor="start">A 的替换迹</text><text x="360" y="455" font-size="27" fill="#b25d2b" text-anchor="middle">旧贡献被替换</text><text x="880" y="455" font-size="28" fill="#b25d2b" text-anchor="middle">1</text><text x="1030" y="455" font-size="28" fill="#b25d2b" text-anchor="start">= 1</text><line x1="40" y1="500" x2="1240" y2="500" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="40" y="550" font-size="27" fill="#233943" text-anchor="start">连续访问 A → A 时：累积迹 1 + 0.72 = 1.72；替换迹仍为 1</text><text x="40" y="605" font-size="28" fill="#233943" text-anchor="start">若 α = 0.1、δ = 0.5：参数增量分别 0.086 与 0.05</text><text x="40" y="657" font-size="27" fill="#697d87" text-anchor="start">资格迹是衰减权重；简单计数 2 会错误地产生 0.1 的增量</text></g></svg>
