<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>同一条奖励链：MC 看完整回报，TD 读取后继估值</title><rect width="1280" height="650" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">同一条奖励链：MC 看完整回报，TD 读取后继估值</text><text x="40" y="110" font-size="28" fill="#233943" text-anchor="start">固定轨迹：s → u → 终止；奖励依次 1、2；γ = 0.9</text><text x="40" y="222" font-size="30" fill="#276884" text-anchor="start">一步 TD</text><circle cx="300" cy="210" r="36" fill="white" stroke="#276884" stroke-width="3"/><text x="300" y="220" font-size="26" fill="#276884" text-anchor="middle">s</text><circle cx="625" cy="210" r="36" fill="white" stroke="#276884" stroke-width="3"/><text x="625" y="220" font-size="26" fill="#276884" text-anchor="middle">u</text><circle cx="950" cy="210" r="36" fill="white" stroke="#dce5e8" stroke-width="3"/><text x="950" y="220" font-size="26" fill="#276884" text-anchor="middle">终止</text><line x1="340" y1="210" x2="585" y2="210" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="585,210 573.9472680719654,214.6730201077038 573.9472680719654,205.3269798922962" fill="#276884"/><text x="462" y="185" font-size="26" fill="#276884" text-anchor="middle">奖励 1</text><line x1="665" y1="210" x2="910" y2="210" stroke="#dce5e8" stroke-width="2.5" stroke-dasharray=""/><polygon points="910,210 898.9472680719654,214.6730201077038 898.9472680719654,205.3269798922962" fill="#dce5e8"/><text x="788" y="185" font-size="26" fill="#697d87" text-anchor="middle">奖励 2</text><text x="625" y="290" font-size="28" fill="#276884" text-anchor="middle">读取 V(u) = 1</text><text x="740" y="345" font-size="29" fill="#276884" text-anchor="middle">目标 = 1 + 0.9 × 1 = 1.9</text><line x1="625" y1="248" x2="625" y2="260" stroke="#276884" stroke-width="3" stroke-dasharray=""/><text x="40" y="412" font-size="30" fill="#b25d2b" text-anchor="start">完整 MC</text><circle cx="300" cy="400" r="36" fill="white" stroke="#b25d2b" stroke-width="3"/><text x="300" y="410" font-size="26" fill="#b25d2b" text-anchor="middle">s</text><circle cx="625" cy="400" r="36" fill="white" stroke="#b25d2b" stroke-width="3"/><text x="625" y="410" font-size="26" fill="#b25d2b" text-anchor="middle">u</text><circle cx="950" cy="400" r="36" fill="white" stroke="#b25d2b" stroke-width="3"/><text x="950" y="410" font-size="26" fill="#b25d2b" text-anchor="middle">终止</text><line x1="340" y1="400" x2="585" y2="400" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray=""/><polygon points="585,400 573.9472680719654,404.6730201077038 573.9472680719654,395.3269798922962" fill="#b25d2b"/><text x="462" y="375" font-size="26" fill="#b25d2b" text-anchor="middle">奖励 1</text><line x1="665" y1="400" x2="910" y2="400" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray=""/><polygon points="910,400 898.9472680719654,404.6730201077038 898.9472680719654,395.3269798922962" fill="#b25d2b"/><text x="788" y="375" font-size="26" fill="#b25d2b" text-anchor="middle">奖励 2</text><text x="625" y="480" font-size="28" fill="#b25d2b" text-anchor="middle">观察实际奖励 2</text><text x="740" y="535" font-size="29" fill="#b25d2b" text-anchor="middle">目标 = 1 + 0.9 × 2 = 2.8</text><line x1="40" y1="575" x2="1240" y2="575" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="40" y="620" font-size="27" fill="#233943" text-anchor="start">此链是确定性的：MC 目标无采样方差；TD 与它的差来自当前估值</text></g></svg>
