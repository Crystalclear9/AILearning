<svg xmlns="http://www.w3.org/2000/svg" width="1328.64" height="814.783" viewBox="-24.32 45.5979 1328.64 814.783" role="img" aria-labelledby="plate-title"><title id="plate-title">同一后继状态下 SARSA 与 Q 学习使用不同目标</title><rect id="edition-paper" x="-24.32" y="45.5979" width="1328.64" height="814.783" fill="#ffffff"/><svg id="edition-view" x="0" y="69.9179" width="1280" height="766.143" viewBox="0 69.9179 1280 766.143" overflow="hidden"><rect id="offline-white-background" x="0" y="69.917937" width="1280" height="766.143025" fill="#ffffff"/><rect width="1280" height="840" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="113" font-size="26" fill="#6d8b96" text-anchor="start">与第 9 节代码相同：γ = 1，ε = 0.2，探索时在两个动作中均匀抽取</text><circle cx="150" cy="340" r="47" fill="#f2f7f8" stroke="#29708b" stroke-width="3"/><text x="150" y="350" font-size="29" fill="#2a3644" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">起点</text><circle cx="530" cy="340" r="47" fill="#f2f7f8" stroke="#29708b" stroke-width="3"/><text x="530" y="350" font-size="29" fill="#2a3644" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">桥头</text><line x1="205" y1="340" x2="474" y2="340" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><line x1="474" y1="340" x2="460.49329346470984" y2="346.52448301166845" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><line x1="474" y1="340" x2="460.49329346470984" y2="333.47551698833155" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><text x="330" y="300" font-size="26" fill="#29708b" text-anchor="middle">冒险：奖励 0</text><line x1="150" y1="395" x2="150" y2="518" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><line x1="150" y1="518" x2="143.47551698833155" y2="504.49329346470984" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><line x1="150" y1="518" x2="156.52448301166845" y2="504.49329346470984" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><text x="180" y="460" font-size="26" fill="#29708b" text-anchor="start">安全：奖励 1</text><text x="150" y="568" font-size="28" fill="#2a3644" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">终止</text><line x1="579" y1="320" x2="955" y2="220" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><line x1="955" y1="220" x2="943.6239866008233" y2="229.77682561682224" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><line x1="955" y1="220" x2="940.2701060754989" y2="217.16623484160272" stroke="#29708b" stroke-width="4" stroke-dasharray=""/><text x="735" y="235" font-size="27" fill="#29708b" text-anchor="middle">好动作：概率 0.9</text><text x="1000" y="220" font-size="30" fill="#29708b" text-anchor="start">奖励 3</text><text x="1000" y="259" font-size="26" fill="#6d8b96" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">终止</text><line x1="579" y1="360" x2="955" y2="455" stroke="#b26a47" stroke-width="4" stroke-dasharray=""/><line x1="955" y1="455" x2="940.3065570357853" y2="458.01707372421873" stroke="#b26a47" stroke-width="4" stroke-dasharray=""/><line x1="955" y1="455" x2="943.5030543487172" y2="445.3656738330359" stroke="#b26a47" stroke-width="4" stroke-dasharray=""/><text x="735" y="441" font-size="27" fill="#b26a47" text-anchor="middle">坏动作：概率 0.1</text><text x="1000" y="470" font-size="30" fill="#b26a47" text-anchor="start">奖励 −30</text><text x="1000" y="509" font-size="26" fill="#6d8b96" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">终止</text><text x="530" y="397" font-size="24" fill="#6d8b96" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">好动作已为贪心动作</text><line x1="60" y1="605" x2="1220" y2="605" stroke="#e4e9ee" stroke-width="2" stroke-dasharray=""/><text x="60" y="658" font-size="28" fill="#29708b" text-anchor="start">SARSA：实际下一动作的采样目标为 3 或 −30</text><text x="60" y="705" font-size="28" fill="#29708b" text-anchor="start">条件均值 = 0.9 × 3 + 0.1 × (−30) = −0.3</text><text x="60" y="762" font-size="28" fill="#b26a47" text-anchor="start">Q-learning：贪心目标 = max{3, −30} = 3</text><text x="60" y="810" font-size="24" fill="#6d8b96" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">上述数值对应桥头动作价值已准确时；训练早期还会叠加估值误差。</text></g></svg></svg>