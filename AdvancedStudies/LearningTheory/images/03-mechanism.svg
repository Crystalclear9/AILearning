<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="542" viewBox="0 0 960 542" role="img" aria-labelledby="artwork-title artwork-desc"><title id="artwork-title">对称参数后验具有相同成员函数但参数平均函数退化</title><desc id="artwork-desc">若真实输出为 x：每个成员平方误差为 0，平均参数模型误差却为 x²。</desc><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="444.073246"/></clipPath></defs><rect width="960" height="542" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">对称参数后验具有相同成员函数但参数平均函数退化</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(25 24.868522) scale(0.710938)"><g><rect id="offline-white-background" x="0" y="71.921182" width="1280" height="624.630542" fill="#ffffff"/><title>平均参数可以破坏所有后验成员共同表示的函数</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="33.54px" fill="#47586b" text-anchor="start">参数化 f(w, x) = w²x；Q 在 w = −1 与 w = +1 各放一半质量</text><text x="80" y="190" font-size="37.274725px" fill="#1c2e40" text-anchor="start">参数空间</text><line x1="110" y1="360" x2="600" y2="360" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><line x1="170" y1="350" x2="170" y2="370" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="170" y="408" font-size="32.13px" fill="#1c2e40" text-anchor="middle">−1</text><line x1="355" y1="350" x2="355" y2="370" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="355" y="408" font-size="32.13px" fill="#1c2e40" text-anchor="middle">0</text><line x1="540" y1="350" x2="540" y2="370" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="540" y="408" font-size="32.13px" fill="#1c2e40" text-anchor="middle">+1</text><line x1="170" y1="360" x2="170" y2="250" stroke="#166383" stroke-width="7" stroke-dasharray=""/><line x1="540" y1="360" x2="540" y2="250" stroke="#166383" stroke-width="7" stroke-dasharray=""/><text x="170" y="230" font-size="32.25px" fill="#217292" text-anchor="middle">质量 0.5</text><text x="540" y="230" font-size="32.25px" fill="#217292" text-anchor="middle">质量 0.5</text><circle cx="355" cy="360" r="7" fill="#b06033"/><text x="355" y="470" font-size="33.54px" fill="#a8603a" text-anchor="middle">平均参数 E[w] = 0</text><text x="755" y="190" font-size="37.274725px" fill="#1c2e40" text-anchor="start">函数空间：同一测试输入 x</text><line x1="835" y1="579.0" x2="835" y2="231.0" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="550" x2="1154.0" y2="550" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><line x1="980" y1="579.0" x2="980" y2="231.0" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="405" x2="1154.0" y2="405" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><line x1="1125" y1="579.0" x2="1125" y2="231.0" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="260" x2="1154.0" y2="260" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="405" x2="1154.0" y2="405" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><line x1="980" y1="579.0" x2="980" y2="231.0" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><line fill="none" stroke="#166383" stroke-width="4" x1="820.5" y1="564.5" x2="1139.5" y2="245.5"/><line fill="none" stroke="#b06033" stroke-width="4" x1="820.5" y1="405" x2="1139.5" y2="405"/><text x="780" y="625" font-size="32.25px" fill="#217292" text-anchor="start">成员与平均函数：E[f(w,x)] = x</text><text x="780" y="670" font-size="32.25px" fill="#a8603a" text-anchor="start">平均参数函数：f(E[w],x) = 0</text></g><desc> 若真实输出为 x：每个成员平方误差为 0，平均参数模型误差却为 x²。</desc></g></g></g></svg>