<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>Gibbs 后验重新分配权重，风险证书还需付出代价</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="60" y="65" font-size="35" fill="#19333c" text-anchor="start">Gibbs 后验重新分配权重，风险证书还需付出代价</text><text x="60" y="112" font-size="27" fill="#74858a" text-anchor="start">两个固定候选，先验各半；经验风险 0.1 与 0.3；逆温度 λ = 20</text><text x="60" y="195" font-size="29" fill="#19333c" text-anchor="start">先验</text><text x="60" y="315" font-size="29" fill="#19333c" text-anchor="start">后验</text><rect x="190" y="160" width="210.0" height="60" fill="#256b82"/><rect x="400" y="160" width="210.0" height="60" fill="#bf653c"/><rect x="190" y="280" width="412.44579181592155" height="60" fill="#256b82"/><rect x="602.4457918159216" y="280" width="7.55420818407845" height="60" fill="#bf653c"/><text x="190" y="260" font-size="26" fill="#256b82" text-anchor="start">低经验风险候选</text><text x="630" y="200" font-size="27" fill="#19333c" text-anchor="start">0.5，0.5</text><text x="630" y="320" font-size="27" fill="#19333c" text-anchor="start">0.982014，0.017986</text><text x="60" y="430" font-size="30" fill="#19333c" text-anchor="start">n = 1000，δ = 0.05 的本章基本界</text><rect x="190" y="485" width="310.79172597725494" height="65" fill="#256b82"/><rect x="500.79172597725494" y="485" width="539.8177029" height="65" fill="#bf653c"/><rect x="1040.609428877255" y="485" width="7.5" height="65" fill="#74858a"/><text x="190" y="600" font-size="29" fill="#256b82" text-anchor="start">0.103597</text><text x="570" y="600" font-size="29" fill="#bf653c" text-anchor="start">+ 0.179939</text><text x="930" y="600" font-size="29" fill="#74858a" text-anchor="start">+ 0.002500</text><text x="190" y="650" font-size="25" fill="#256b82" text-anchor="start">经验风险</text><text x="570" y="650" font-size="25" fill="#bf653c" text-anchor="start">(KL + ln 20) ÷ 20</text><text x="930" y="650" font-size="25" fill="#74858a" text-anchor="start">20 ÷ 8000</text><text x="60" y="735" font-size="27" fill="#19333c" text-anchor="start">上界 ≈ 0.286036；优化权重得到 0.982，并不等于已知总体风险只有 0.1。</text></g></svg>
