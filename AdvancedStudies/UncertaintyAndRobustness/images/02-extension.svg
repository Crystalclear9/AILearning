<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="1091" viewBox="0 0 960 1091" role="img" aria-labelledby="artwork-title"><title id="artwork-title">标签变化需要可识别的混淆结构</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="993.637847"/></clipPath></defs><rect width="960" height="1091" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">标签变化需要可识别的混淆结构</text><line x1="25" x2="935" y1="59" y2="59" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e5"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>条件混淆矩阵的列区分能力决定标签先验是否可识别</title><svg width="1440" height="1122.35" viewBox="0 0 1360 1060" role="img"><title>条件混淆矩阵的列区分能力决定标签先验是否可识别</title><rect width="1360" height="1060" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#0b6690" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ce6521" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#137286" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="30" fill="#20354a" text-anchor="start" font-weight="400">条件行为固定：真实 0 中 20% 预测为 1；真实 1 中 80% 预测为 1</text><rect x="60" y="150" width="290" height="85" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="205" y="205" font-size="30" fill="#1672a0" text-anchor="middle" font-weight="400">真实 0：质量 0.3</text><line x1="365" y1="193" x2="495" y2="193" stroke="#0b6690" stroke-width="3" marker-end="url(#b)"/><text x="430" y="245" font-size="29" fill="#1672a0" text-anchor="middle" font-weight="400">× 0.2</text><rect x="515" y="150" width="320" height="85" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#0b6690" stroke-width="2"/><text x="675" y="205" font-size="30" fill="#1672a0" text-anchor="middle" font-weight="400">预测 1：质量 0.06</text><rect x="60" y="310" width="290" height="85" rx="4" fill="url(#book-wash-fff1e5)" stroke="#ce6521" stroke-width="2"/><text x="205" y="365" font-size="30" fill="#b15e27" text-anchor="middle" font-weight="400">真实 1：质量 0.7</text><line x1="365" y1="353" x2="495" y2="353" stroke="#ce6521" stroke-width="3" marker-end="url(#o)"/><text x="430" y="405" font-size="29" fill="#b15e27" text-anchor="middle" font-weight="400">× 0.8</text><rect x="515" y="310" width="320" height="85" rx="4" fill="url(#book-wash-fff1e5)" stroke="#ce6521" stroke-width="2"/><text x="675" y="365" font-size="30" fill="#b15e27" text-anchor="middle" font-weight="400">预测 1：质量 0.56</text><text x="950" y="165" font-size="32" fill="#b15e27" text-anchor="start" font-weight="400">π = 0.7</text><rect x="950" y="230" width="21.0" height="80" rx="4" fill="#1672a0" stroke="#0b6690" stroke-width="2"/><rect x="971.0" y="230" width="196.00000000000003" height="80" rx="4" fill="#d37537" stroke="#ce6521" stroke-width="2"/><text x="950" y="365" font-size="29" fill="#20354a" text-anchor="start" font-weight="400">q = 0.06 + 0.56 = 0.62</text><text x="60" y="500" font-size="31" fill="#1672a0" text-anchor="start" font-weight="400">两类条件行为不同：q = 0.2 + 0.6π，可以反解 π。</text><line x1="60" y1="550" x2="1300" y2="550" stroke="#d9e1e8" stroke-width="2"/><text x="60" y="625" font-size="31" fill="#20354a" text-anchor="start" font-weight="400">退化分类器：两类中都恰有一半预测为 1</text><text x="60" y="765" font-size="32" fill="#b15e27" text-anchor="start" font-weight="400">π = 0.1</text><text x="295" y="765" font-size="31" fill="#20354a" text-anchor="start" font-weight="400">0.45 + 0.05</text><rect x="610" y="720" width="315.0" height="70" rx="4" fill="#1672a0" stroke="#0b6690" stroke-width="2"/><rect x="925.0" y="720" width="35.0" height="70" rx="4" fill="#d37537" stroke="#ce6521" stroke-width="2"/><text x="1040" y="765" font-size="32" fill="#20354a" text-anchor="start" font-weight="400">q = 0.5</text><text x="60" y="925" font-size="32" fill="#b15e27" text-anchor="start" font-weight="400">π = 0.9</text><text x="295" y="925" font-size="31" fill="#20354a" text-anchor="start" font-weight="400">0.05 + 0.45</text><rect x="610" y="880" width="34.99999999999999" height="70" rx="4" fill="#1672a0" stroke="#0b6690" stroke-width="2"/><rect x="645.0" y="880" width="315.0" height="70" rx="4" fill="#d37537" stroke="#ce6521" stroke-width="2"/><text x="1040" y="925" font-size="32" fill="#20354a" text-anchor="start" font-weight="400">q = 0.5</text><text x="60" y="1020" font-size="28" fill="#47586b" text-anchor="start" font-weight="400">相同预测边缘可以来自完全不同的真实比例；增加无标签样本不能补回识别信息。</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1122.35) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#1d3145" text-anchor="start">混淆方向分得越不清，先验反演就越放大测量误差</text><text x="65" y="125" font-size="36.12px" fill="#1d3145" text-anchor="start">原分类器：P(预测1|Y=0)=0.2，P(预测1|Y=1)=0.8</text><rect x="65" y="195" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="276.0" y="234" font-size="36.12px" fill="#1e7499" text-anchor="middle">q = 0.2+0.6π</text><rect x="495" y="195" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="706.0" y="234" font-size="36.12px" fill="#1e7499" text-anchor="middle">q误差0.03</text><rect x="925" y="195" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#13668a"/><text x="1136.0" y="234" font-size="36.12px" fill="#1e7499" text-anchor="middle">π误差0.05</text><rect x="65" y="295" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="276.0" y="334" font-size="32.48px" fill="#af6033" text-anchor="middle">弱分类器：q=0.49+0.02π</text><rect x="495" y="295" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="706.0" y="334" font-size="36.12px" fill="#af6033" text-anchor="middle">q误差0.01</text><rect x="925" y="295" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#ba602b"/><text x="1136.0" y="334" font-size="36.12px" fill="#af6033" text-anchor="middle">π误差0.5</text><text x="65" y="414" font-size="34.83px" fill="#1d3145" text-anchor="start">反演除以两类条件预测率之差；差为0时，不再只是“误差大”，而是不可识别。</text></g></g></g></g></g></svg>