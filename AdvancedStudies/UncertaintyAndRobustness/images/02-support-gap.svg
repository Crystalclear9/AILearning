<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1270" height="510" viewBox="0 0 1270 510" role="img" aria-labelledby="title description"><title id="title">有效样本量无法揭示源域没有覆盖的区域</title><desc id="description">源域在 A 的概率为 1、在 B 为 0。目标域在 A 和 B 的概率分别为 0.7 与 0.3。源样本的已观测权重均为 0.7，权重诊断无法重建 B 的风险。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#202939"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#166d76"/></marker><marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#a54538"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2.2 5 Z" fill="#625281"/></marker><linearGradient id="water" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7acbd1" stop-opacity=".14"/><stop offset="100%" stop-color="#7acbd1" stop-opacity=".49"/></linearGradient><linearGradient id="peach" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ef9b8e" stop-opacity=".14"/><stop offset="100%" stop-color="#ef9b8e" stop-opacity=".49"/></linearGradient><linearGradient id="lilac" x1="0%" x2="85%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b3a1da" stop-opacity=".14"/><stop offset="100%" stop-color="#b3a1da" stop-opacity=".49"/></linearGradient></defs><rect x="0" y="0" width="1270" height="510" fill="white"/><text x="455" y="74" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="33" text-anchor="middle">区域 A</text><text x="897" y="74" fill="#a54538" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="33" text-anchor="middle">区域 B</text><line x1="676" y1="99" x2="676" y2="400" stroke="#8998a8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 7"/><text x="65" y="169" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="34" text-anchor="start">源域</text><rect x="252" y="118" width="406" height="82" rx="3" fill="url(#water)" stroke="#166d76" stroke-width="1.8"/><rect x="694" y="118" width="406" height="82" rx="3" fill="white" stroke="#8998a8" stroke-width="1.7" stroke-dasharray="8 8"/><text x="455" y="170" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">概率 1</text><text x="897" y="170" fill="#8998a8" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">概率 0</text><text x="65" y="318" fill="#202939" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="34" text-anchor="start">目标域</text><rect x="252" y="267" width="406" height="82" rx="3" fill="url(#water)" stroke="#166d76" stroke-width="1.8"/><rect x="694" y="267" width="406" height="82" rx="3" fill="url(#peach)" stroke="#a54538" stroke-width="1.8"/><text x="455" y="319" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">概率 0.7</text><text x="897" y="319" fill="#a54538" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">概率 0.3</text><line x1="455" y1="362" x2="455" y2="410" stroke="#166d76" stroke-width="1.9" stroke-linecap="round"/><line x1="897" y1="362" x2="897" y2="410" stroke="#a54538" stroke-width="1.9" stroke-linecap="round"/><text x="455" y="459" fill="#166d76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">已观测权重都是 0.7</text><text x="897" y="459" fill="#a54538" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="31" text-anchor="middle">这部分风险无法重建</text></svg>