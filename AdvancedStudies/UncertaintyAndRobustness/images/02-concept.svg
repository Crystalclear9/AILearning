<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>重要性加权修正哪一种变化</title><rect width="1200" height="850" fill="#f7fbfd" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">重要性加权修正哪一种变化</text><rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="690.0" font-size="22" fill="#16344c">训练输入密度 p(x)</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="690.0" font-size="22" fill="#16344c">目标输入密度 q(x)</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><g fill="#18374e"><text x="78" y="780.0" font-size="22">权重 w(x)=</text><text x="318" y="769.0" text-anchor="middle" font-size="20">q(x)</text><line x1="248" x2="388" y1="776.0" y2="776.0" stroke="#18374e" stroke-width="1.5" /><text x="318" y="800.0" text-anchor="middle" font-size="20">p(x)</text></g>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="780.0" font-size="22" fill="#16344c">要求条件标签机制保持</text>
<line x1="280.0" y1="315.0" x2="280.0" y2="435.0" stroke="#267ab0" stroke-width="3" marker-end="url(#semantic-arrow)" /><text x="275.0" y="349.5" font-size="18" fill="#173b51">分母：须有支持</text><line x1="705.3333333333334" y1="315.0" x2="396.0" y2="435.0" stroke="#267ab0" stroke-width="3" marker-end="url(#semantic-arrow)" /><text x="565.0" y="349.5" font-size="18" fill="#173b51">分子</text><line x1="490.0" y1="480.0" x2="690.0" y2="480.0" stroke="#267ab0" stroke-width="3" marker-end="url(#semantic-arrow)" /><text x="565.0" y="462.0" font-size="18" fill="#173b51">条件标签机制不变</text><rect x="110" y="210.0" width="380" height="105.0" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="128" y="274.5" font-size="22" fill="#173b51">训练输入密度 p(x)</text><rect x="690" y="210.0" width="380" height="105.0" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="708" y="274.5" font-size="22" fill="#173b51">目标输入密度 q(x)</text><rect x="110" y="435.0" width="380" height="105.0" rx="15" fill="#eaf3f8" stroke="#6893ae" /><g fill="#18374e"><text x="128" y="383" font-size="22">比值权重</text><text x="348" y="372" text-anchor="middle" font-size="20">q(x)</text><line x1="278" x2="418" y1="379" y2="379" stroke="#18374e" stroke-width="1.5" /><text x="348" y="403" text-anchor="middle" font-size="20">p(x)</text></g><rect x="690" y="435.0" width="380" height="105.0" rx="15" fill="#eaf3f8" stroke="#6893ae" /><text x="708" y="499.5" font-size="22" fill="#173b51">加权训练平均 ≈ 目标平均</text></g><defs><marker id="semantic-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#267ab0" /></marker></defs></svg>
