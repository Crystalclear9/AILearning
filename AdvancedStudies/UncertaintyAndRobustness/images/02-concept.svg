<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>重要性加权修正哪一种变化</title><rect width="1200" height="850" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#153652">重要性加权修正哪一种变化</text><text x="60" y="110" font-size="21" fill="#526878">具体算例 · 从条件到结果，逐项核对</text>
<rect x="60" y="470" width="530" height="112" rx="12" fill="#edf5fc" stroke="#bacbd8"/><text x="78" y="500" font-size="19" fill="#557086">01</text>
<text x="78" y="539" font-size="24" fill="#18374e">训练输入密度 p(x)</text>
<rect x="625" y="470" width="530" height="112" rx="12" fill="#eef8f2" stroke="#bacbd8"/><text x="643" y="500" font-size="19" fill="#557086">02</text>
<text x="643" y="539" font-size="24" fill="#18374e">目标输入密度 q(x)</text>
<rect x="60" y="610" width="530" height="112" rx="12" fill="#fff6e7" stroke="#bacbd8"/><text x="78" y="640" font-size="19" fill="#557086">03</text>
<g fill="#18374e"><text x="78" y="679" font-size="22">权重 w(x)=</text><text x="318" y="668" text-anchor="middle" font-size="20">q(x)</text><line x1="248" x2="388" y1="675" y2="675" stroke="#18374e" stroke-width="1.5"/><text x="318" y="699" text-anchor="middle" font-size="20">p(x)</text></g>
<rect x="625" y="610" width="530" height="112" rx="12" fill="#f3effb" stroke="#bacbd8"/><text x="643" y="640" font-size="19" fill="#557086">04</text>
<text x="643" y="679" font-size="24" fill="#18374e">要求条件标签机制保持</text>
<text x="60" y="785" font-size="20" fill="#526878">各框属于同一论证或算例；具体适用条件与读图方法见正文。</text><line x1="280" y1="220" x2="280" y2="370" stroke="#267ab0" stroke-width="3"/><text x="275.0" y="283.0" font-size="18" fill="#173b51">分母：须有支持</text><line x1="860" y1="220" x2="280" y2="370" stroke="#267ab0" stroke-width="3"/><text x="565.0" y="283.0" font-size="18" fill="#173b51">分子</text><line x1="280" y1="370" x2="860" y2="370" stroke="#267ab0" stroke-width="3"/><text x="565.0" y="358.0" font-size="18" fill="#173b51">条件标签机制不变</text><rect x="110" y="190" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae"/><text x="128" y="233" font-size="22" fill="#173b51">训练输入密度 p(x)</text><rect x="690" y="190" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae"/><text x="708" y="233" font-size="22" fill="#173b51">目标输入密度 q(x)</text><rect x="110" y="340" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae"/><g fill="#18374e"><text x="128" y="383" font-size="22">比值权重</text><text x="348" y="372" text-anchor="middle" font-size="20">q(x)</text><line x1="278" x2="418" y1="379" y2="379" stroke="#18374e" stroke-width="1.5"/><text x="348" y="403" text-anchor="middle" font-size="20">p(x)</text></g><rect x="690" y="340" width="380" height="70" rx="15" fill="#eaf3f8" stroke="#6893ae"/><text x="708" y="383" font-size="22" fill="#173b51">加权训练平均 ≈ 目标平均</text></g></svg>