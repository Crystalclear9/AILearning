<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>拒答阈值改变风险与覆盖</title><rect width="1200" height="850" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#153652">拒答阈值改变风险与覆盖</text><text x="60" y="110" font-size="21" fill="#526878">具体算例 · 从条件到结果，逐项核对</text>
<rect x="60" y="470" width="530" height="112" rx="12" fill="#edf5fc" stroke="#bacbd8"/><text x="78" y="500" font-size="19" fill="#557086">01</text>
<text x="78" y="539" font-size="24" fill="#18374e">模型对全部输入评分</text>
<rect x="625" y="470" width="530" height="112" rx="12" fill="#eef8f2" stroke="#bacbd8"/><text x="643" y="500" font-size="19" fill="#557086">02</text>
