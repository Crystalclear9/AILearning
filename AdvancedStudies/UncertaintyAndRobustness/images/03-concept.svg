 y="1203" font-size="35" fill="#a65b30" text-anchor="middle" font-weight="400">2</text><text x="1590" y="1175" font-size="34" fill="#a65b30" text-anchor="middle" font-weight="400">= 0.5</text><text x="900" y="1330" font-size="34" fill="#a65b30" text-anchor="middle" font-weight="400">同一份错误保留；接受分母从 10 缩成 2</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1370) scale(1.25)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dde5eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">平均接受风险约束，允许用低风险质量补贴少量高风险对象</text><text x="65" y="120" font-size="34.83px" fill="#213747" text-anchor="start">另一个已知风险世界：20%对象风险0.01，80%对象风险0.20；目标0.05</text><rect x="65" y="185" width="642" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="386.0" y="224" font-size="36.12px" fill="#277290" text-anchor="middle">接受全部低风险：质量0.2</text><rect x="715" y="185" width="642" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1036.0" y="224" font-size="36.12px" fill="#277290" text-anchor="middle">再接受高风险：质量x</text><g><text x="189.938" y="278" font-size="28.485px" fill="#213747" text-anchor="middle">(0.2×0.01 + 0.20x)</text><line x1="69.000" x2="310.875" y1="286" y2="286" stroke="#213747" stroke-width="1.845"/><text x="189.938" y="314" font-size="34.83px" fill="#213747" text-anchor="middle">(0.2+x)</text><text x="314.875" y="295" font-size="37.41px" fill="#213747"> ≤ 0.05 → x ≤ 0.053333</text></g><text x="65" y="370" font-size="36.12px" fill="#a55f3a" text-anchor="start">可达覆盖0.253333；只接受逐点风险≤0.05的对象，覆盖只有0.2。</text><text x="65" y="425" font-size="33.54px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">部分同风险组可事先随机接受；这里风险已知，只演示目标差异，不提供经验认证。</text></g></g></g></g></g></svg></svg>