<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img"><title>历史键没有梯度，仍能改变查询更新与后续队列</title><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#17324b"><text x="45" y="52" font-size="36" fill="#17324b" text-anchor="start">历史键不反传，仍然改变当前查询的梯度</text><text x="45" y="108" font-size="29" fill="#17324b" text-anchor="start">单个查询 q = (1, 0)；温度 τ = 1；先读取旧队列，再更新队列</text><text x="45" y="168" font-size="31" fill="#17324b" text-anchor="start">① 当前损失读取三个候选</text><rect x="45" y="195" width="315" height="225" rx="7" fill="white" stroke="#24679b" stroke-width="2"/><text x="202" y="239" font-size="27" fill="#24679b" text-anchor="middle">当前正键 k+</text><text x="202" y="286" font-size="32" fill="#17324b" text-anchor="middle">(1, 0)</text><text x="202" y="335" font-size="28" fill="#17324b" text-anchor="middle">logit = 1</text><text x="202" y="386" font-size="29" fill="#24679b" text-anchor="middle">p = 0.665241</text><rect x="395" y="195" width="315" height="225" rx="7" fill="white" stroke="#c96822" stroke-width="2"/><text x="552" y="239" font-size="27" fill="#c96822" text-anchor="middle">最旧历史键 kA</text><text x="552" y="286" font-size="32" fill="#17324b" text-anchor="middle">(−1, 0)</text><text x="552" y="335" font-size="28" fill="#17324b" text-anchor="middle">logit = −1</text><text x="552" y="386" font-size="29" fill="#c96822" text-anchor="middle">p = 0.090031</text><rect x="745" y="195" width="315" height="225" rx="7" fill="white" stroke="#24679b" stroke-width="2"/><text x="902" y="239" font-size="27" fill="#24679b" text-anchor="middle">较新历史键 kB</text><text x="902" y="286" font-size="32" fill="#17324b" text-anchor="middle">(0, 1)</text><text x="902" y="335" font-size="28" fill="#17324b" text-anchor="middle">logit = 0</text><text x="902" y="386" font-size="29" fill="#24679b" text-anchor="middle">p = 0.244728</text><text x="1135" y="250" font-size="30" fill="#17324b" text-anchor="start">键分支</text><text x="1135" y="300" font-size="29" fill="#c96822" text-anchor="start">全部停止梯度</text><text x="45" y="480" font-size="31" fill="#17324b" text-anchor="start">② 对查询输出求导</text><text x="45" y="537" font-size="32" fill="#24679b" text-anchor="start">gq = Σ p(j) k(j) − k+ = (−0.424790, 0.244728)</text><text x="45" y="587" font-size="28" fill="#17324b" text-anchor="start">历史键通过概率与加权键共同参与；键张量本身没有梯度</text><path d="M45 630 L1450 630" fill="none" stroke="#d4dfe6" stroke-width="2" stroke-dasharray=""/><text x="45" y="681" font-size="31" fill="#17324b" text-anchor="start">③ 本次损失读完旧快照，再按 FIFO 写入当前正键</text><rect x="45" y="712" width="330" height="123" rx="7" fill="white" stroke="#748894" stroke-width="2"/><text x="210" y="755" font-size="29" fill="#748894" text-anchor="middle">移出 kA</text><text x="210" y="807" font-size="30" fill="#17324b" text-anchor="middle">(−1, 0)</text><rect x="455" y="712" width="330" height="123" rx="7" fill="white" stroke="#24679b" stroke-width="2"/><text x="620" y="755" font-size="29" fill="#24679b" text-anchor="middle">保留 kB</text><text x="620" y="807" font-size="30" fill="#17324b" text-anchor="middle">(0, 1)</text><rect x="865" y="712" width="330" height="123" rx="7" fill="white" stroke="#24679b" stroke-width="2"/><text x="1030" y="755" font-size="29" fill="#24679b" text-anchor="middle">新入 k+</text><text x="1030" y="807" font-size="30" fill="#17324b" text-anchor="middle">(1, 0)</text><text x="1260" y="787" font-size="28" fill="#17324b" text-anchor="start">下次队列</text><text x="45" y="896" font-size="29" fill="#17324b" text-anchor="start">容量始终为 2；入队与移出是状态更新，不是反向传播</text></g></svg>
