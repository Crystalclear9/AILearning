<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img"><title>有限候选怎样把密度比变成正确索引概率</title><rect width="1280" height="830" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">有限候选怎样把密度比变成正确索引概率</text><text x="60" y="112" font-size="25" fill="#71858b" text-anchor="start">正文离散模型：固定锚点 X = 0；正样本 P(Y|X) = (0.8, 0.2)，负样本边缘各半</text><text x="60" y="160" font-size="25" fill="#183944" text-anchor="start">两个候选位置中，正样本索引 I 事先各半；隐藏 I 后得到下面四种候选集合。</text><text x="90" y="235" font-size="25" fill="#183944" text-anchor="start">候选 (Y1, Y2)</text><text x="330" y="235" font-size="25" fill="#183944" text-anchor="start">混合概率 Q</text><text x="610" y="235" font-size="25" fill="#183944" text-anchor="start">密度比 (r1, r2)</text><text x="910" y="235" font-size="25" fill="#183944" text-anchor="start">P(I=1 | 候选)</text><line x1="65" y1="333" x2="1210" y2="333" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="90" y="310" font-size="28" fill="#183944" text-anchor="start">(0, 0)</text><text x="330" y="310" font-size="28" fill="#183944" text-anchor="start">0.4</text><text x="610" y="310" font-size="28" fill="#183944" text-anchor="start">(1.6, 1.6)</text><text x="910" y="310" font-size="28" fill="#183944" text-anchor="start">0.5</text><line x1="65" y1="405" x2="1210" y2="405" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="90" y="382" font-size="28" fill="#183944" text-anchor="start">(0, 1)</text><text x="330" y="382" font-size="28" fill="#183944" text-anchor="start">0.25</text><text x="610" y="382" font-size="28" fill="#183944" text-anchor="start">(1.6, 0.4)</text><text x="910" y="382" font-size="28" fill="#183944" text-anchor="start">0.8</text><line x1="65" y1="477" x2="1210" y2="477" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="90" y="454" font-size="28" fill="#183944" text-anchor="start">(1, 0)</text><text x="330" y="454" font-size="28" fill="#183944" text-anchor="start">0.25</text><text x="610" y="454" font-size="28" fill="#183944" text-anchor="start">(0.4, 1.6)</text><text x="910" y="454" font-size="28" fill="#183944" text-anchor="start">0.2</text><line x1="65" y1="549" x2="1210" y2="549" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="90" y="526" font-size="28" fill="#183944" text-anchor="start">(1, 1)</text><text x="330" y="526" font-size="28" fill="#183944" text-anchor="start">0.1</text><text x="610" y="526" font-size="28" fill="#183944" text-anchor="start">(0.4, 0.4)</text><text x="910" y="526" font-size="28" fill="#183944" text-anchor="start">0.5</text><text x="60" y="635" font-size="28" fill="#183944" text-anchor="start">最优交叉熵 L* = 0.596775；InfoNCE 下界 ln 2 − L* = 0.096372。</text><rect x="70" y="685" width="550" height="35" fill="#246b82"/><rect x="620" y="685" width="550" height="35" fill="#c0673e"/><text x="70" y="760" font-size="26" fill="#246b82" text-anchor="start">下界 0.096372</text><text x="620" y="760" font-size="26" fill="#c0673e" text-anchor="start">有限候选混合 KL 间隙 0.096372</text><text x="60" y="810" font-size="25" fill="#183944" text-anchor="start">两段合计为真实互信息 0.192745 nat；不是训练损失越小，原始互信息就必然越大。</text></g></svg>
