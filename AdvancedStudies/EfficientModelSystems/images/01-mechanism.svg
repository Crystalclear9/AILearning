<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>重计算必须恢复同一掩码，前向损失相同仍可能梯度错误</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">重计算必须恢复同一掩码，前向损失相同仍可能梯度错误</text><text x="65" y="123" font-size="27" fill="#183944" text-anchor="start">标量例：z = θ m x；θ = 2，x = 1，y = 1；L = (z − y)² / 2。</text><text x="65" y="181" font-size="27" fill="#183944" text-anchor="start">Dropout 保留概率 1/2，倒置缩放掩码 m ∈ {0, 2}。</text><text x="65" y="300" font-size="28" fill="#183944" text-anchor="start">原前向</text><text x="365" y="300" font-size="29" fill="#183944" text-anchor="start">m = 2 → z = 4</text><text x="820" y="300" font-size="29" fill="#183944" text-anchor="start">L = 4.5</text><line x1="65" y1="340" x2="1190" y2="340" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="65" y="455" font-size="28" fill="#246b82" text-anchor="start">安全重演</text><text x="365" y="455" font-size="28" fill="#246b82" text-anchor="start">局部导数 ∂z/∂θ = 2</text><text x="820" y="455" font-size="28" fill="#246b82" text-anchor="start">参数梯度 = 3 × 2 = 6</text><line x1="65" y1="495" x2="1190" y2="495" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="65" y="610" font-size="28" fill="#c0673e" text-anchor="start">新掩码重演</text><text x="365" y="610" font-size="28" fill="#c0673e" text-anchor="start">局部导数 ∂z/∂θ = 0</text><text x="820" y="610" font-size="28" fill="#c0673e" text-anchor="start">参数梯度 = 3 × 0 = 0</text><line x1="65" y1="650" x2="1190" y2="650" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="65" y="722" font-size="28" fill="#183944" text-anchor="start">原损失传来的上游导数始终为 ∂L/∂z = 4 − 1 = 3。</text><text x="65" y="785" font-size="27" fill="#183944" text-anchor="start">改了掩码，就改了反向所用雅可比；原前向显示的 L 仍然是 4.5。</text></g></svg>
