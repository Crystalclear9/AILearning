<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>训练显存由多种状态相加</title><rect width="1200" height="850" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#153652">训练显存由多种状态相加</text><text x="60" y="110" font-size="21" fill="#526878">具体算例 · 从条件到结果，逐项核对</text>
<rect x="60" y="470" width="530" height="112" rx="12" fill="#edf5fc" stroke="#bacbd8"/><text x="78" y="500" font-size="19" fill="#557086">01</text>
<text x="78" y="539" font-size="24" fill="#18374e">P 个 FP32 参数：4P 字节</text>
<rect x="625" y="470" width="530" height="112" rx="12" fill="#eef8f2" stroke="#bacbd8"/><text x="643" y="500" font-size="19" fill="#557086">02</text>
<text x="643" y="539" font-size="24" fill="#18374e">FP32 梯度：4P 字节</text>
<rect x="60" y="610" width="530" height="112" rx="12" fill="#fff6e7" stroke="#bacbd8"/><text x="78" y="640" font-size="19" fill="#557086">03</text>
<text x="78" y="679" font-size="24" fill="#18374e">Adam 两个状态：8P 字节</text>
<rect x="625" y="610" width="530" height="112" rx="12" fill="#f3effb" stroke="#bacbd8"/><text x="643" y="640" font-size="19" fill="#557086">04</text>
<text x="643" y="679" font-size="24" fill="#18374e">仅这三项合计 16P 字节</text>
<text x="60" y="785" font-size="20" fill="#526878">各框属于同一论证或算例；具体适用条件与读图方法见正文。</text><text x="90" y="150" fill="#1b3b50" font-size="21">每参数存储字节数：此图仅含 FP32 例子的三项</text><rect x="130.0" y="305.0" width="140" height="105.0" fill="#1976b5"/><text x="130.0" y="435" fill="#1b3b50" font-size="21">权重</text><text x="130.0" y="285.0" fill="#1b3b50" font-size="21">4</text><rect x="413.3" y="305.0" width="140" height="105.0" fill="#d86922"/><text x="413.3333333333333" y="435" fill="#1b3b50" font-size="21">梯度</text><text x="413.3333333333333" y="285.0" fill="#1b3b50" font-size="21">4</text><rect x="696.7" y="200.0" width="140" height="210.0" fill="#12816c"/><text x="696.6666666666666" y="435" fill="#1b3b50" font-size="21">两个状态</text><text x="696.6666666666666" y="180.0" fill="#1b3b50" font-size="21">8</text></g></svg>