<text x="90" y="150.0" fill="#16344c" font-size="21">每参数存储字节数：此图仅含 FP32 例子的三项</text><rect x="130.0" y="374.75" width="140" height="152.25" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">权重</text><text x="130.0" y="345.75" fill="#16344c" font-size="21">4</text><rect x="413.3" y="374.75" width="140" height="152.25" fill="#d86922" /><text x="413.3333333333333" y="563.25" fill="#16344c" font-size="21">梯度</text><text x="413.3333333333333" y="345.75" fill="#16344c" font-size="21">4</text><rect x="696.7" y="222.5" width="140" height="304.5" fill="#12816c" /><text x="696.6666666666666" y="563.25" fill="#16344c" font-size="21">两个状态</text><text x="696.6666666666666" y="193.5" fill="#16344c" font-size="21">8</text></g></svg>
