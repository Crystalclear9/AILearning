<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1640" viewBox="0 0 1100 1640" role="img"><title>训练显存由多种状态相加</title><desc>A将同一参数的权重、梯度与两个Adam状态按所有权分开；B复算仅这几项就需16字节每参数。C再区分激活：检查点重计算减少内部激活驻留，却不直接删除参数或优化器状态。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#118779" /></marker></defs><rect width="1100" height="1640" fill="#f3f6f8" /><rect x="24" y="88" width="1052" height="996" rx="16" fill="#ffffff" stroke="#dbe4e9" /><rect x="24" y="1104" width="516" height="510" rx="16" fill="#ffffff" stroke="#dbe4e9" /><rect x="560" y="1104" width="516" height="510" rx="16" fill="#ffffff" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">训练显存由多种状态相加</text><rect x="40" y="106" width="4" height="26" rx="2" fill="#118779" /><text x="52" y="130" font-size="25" font-weight="650" fill="#15364c">A  机制与几何</text><rect x="36" y="1123" width="4" height="26" rx="2" fill="#118779" /><text x="48" y="1147" font-size="25" font-weight="650" fill="#15364c">B  数值算例</text><rect x="572" y="1123" width="4" height="26" rx="2" fill="#118779" /><text x="584" y="1147" font-size="25" font-weight="650" fill="#15364c">C  对照与边界</text><g transform="scale(1.08)"><text x="102.00" y="236.00" font-size="26" fill="#15364c" text-anchor="start">同一参数的状态分解</text><rect x="110.40" y="388.00" width="168.00" height="288.80" rx="5" fill="#d6eae3" stroke="#a5bdc8" /><text x="123.00" y="524.80" font-size="24" fill="#15364c" text-anchor="start">权重4字节</text><rect x="299.40" y="388.00" width="168.00" height="288.80" rx="5" fill="#dfeaf3" stroke="#a5bdc8" /><text x="312.00" y="524.80" font-size="24" fill="#15364c" text-anchor="start">梯度4字节</text><rect x="488.40" y="388.00" width="336.00" height="288.80" rx="5" fill="#f1ddcb" stroke="#a5bdc8" /><text x="501.00" y="524.80" font-size="24" fill="#15364c" text-anchor="start">Adam状态8字节</text><text x="110.40" y="798.40" font-size="26" fill="#15364c" text-anchor="start">仅这些状态：16字节每参数</text><text x="110.40" y="874.40" font-size="22" fill="#15364c" text-anchor="start">激活与临时缓冲尚未计入</text></g><g transform="translate(-998.8,1021) scale(1.06)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="310.0000" y2="310.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="185.00" font-size="20" fill="#15364c" text-anchor="start">FP32：每参数字节</text><rect x="1066.95" y="329.00" width="74.43" height="76.00" fill="#118779" /><text x="1104.17" y="320.00" font-size="21" fill="#15364c" text-anchor="middle">4</text><text x="1104.17" y="437.00" font-size="18" fill="#15364c" text-anchor="middle">参数</text><rect x="1195.28" y="329.00" width="74.43" height="76.00" fill="#cb702a" /><text x="1232.50" y="320.00" font-size="21" fill="#15364c" text-anchor="middle">4</text><text x="1232.50" y="437.00" font-size="18" fill="#15364c" text-anchor="middle">梯度</text><rect x="1323.62" y="253.00" width="74.43" height="152.00" fill="#497da4" /><text x="1360.83" y="244.00" font-size="21" fill="#15364c" text-anchor="middle">8</text><text x="1360.83" y="437.00" font-size="18" fill="#15364c" text-anchor="middle">Adam两状态</text><text x="1032" y="411" text-anchor="end" font-size="18" fill="#15364c">0</text><text x="1032" y="316" text-anchor="end" font-size="18" fill="#15364c">5</text><text x="1032" y="221" text-anchor="end" font-size="18" fill="#15364c">10</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-458.8,554.6) scale(1.06)"><rect x="1003.00" y="699.00" width="87.40" height="115.50" rx="5" fill="#d9eee5" stroke="#a5bdc8" /><text x="1014.50" y="755.10" font-size="25" fill="#15364c" text-anchor="start">1</text><text x="1007.60" y="831.00" font-size="21" fill="#15364c" text-anchor="start">保存</text><path d="M1092.70,751.80 L1108.80,751.80" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1111.10" y="699.00" width="87.40" height="115.50" rx="5" fill="#f7eadc" stroke="#a5bdc8" /><text x="1122.60" y="755.10" font-size="25" fill="#15364c" text-anchor="start">2</text><text x="1115.70" y="831.00" font-size="21" fill="#15364c" text-anchor="start">重算</text><path d="M1200.80,751.80 L1216.90,751.80" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1219.20" y="699.00" width="87.40" height="115.50" rx="5" fill="#f7eadc" stroke="#a5bdc8" /><text x="1230.70" y="755.10" font-size="25" fill="#15364c" text-anchor="start">3</text><text x="1223.80" y="831.00" font-size="21" fill="#15364c" text-anchor="start">重算</text><path d="M1308.90,751.80 L1325.00,751.80" stroke="#118779" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1327.30" y="699.00" width="87.40" height="115.50" rx="5" fill="#d9eee5" stroke="#a5bdc8" /><text x="1338.80" y="755.10" font-size="25" fill="#15364c" text-anchor="start">4</text><text x="1331.90" y="831.00" font-size="21" fill="#15364c" text-anchor="start">保存</text><text x="1003.00" y="639.60" font-size="22" fill="#15364c" text-anchor="start">边界检查点与内部重计算</text><text x="1003.00" y="903.60" font-size="21" fill="#15364c" text-anchor="start">减少激活驻留，不消除优化器状态</text></g></g></svg>
