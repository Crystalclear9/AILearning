<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>MCMC 自相关怎样降低有效信息</title><rect width="1200" height="850" fill="#f7fbfd" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">MCMC 自相关怎样降低有效信息</text><rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="690.0" font-size="22" fill="#16344c">运行 1000 次迭代</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="690.0" font-size="22" fill="#16344c">相邻状态可能相关</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="780.0" font-size="22" fill="#16344c">正自相关累积时</text>
