8)"/><rect x="252" y="489" width="47" height="47" fill="rgb(147,177,186)"/><rect x="301" y="489" width="47" height="47" fill="rgb(123,159,170)"/><rect x="350" y="489" width="47" height="47" fill="rgb(93,137,150)"/><rect x="399" y="489" width="47" height="47" fill="rgb(55,109,125)"/><rect x="448" y="489" width="47" height="47" fill="rgb(93,137,150)"/><rect x="105" y="538" width="47" height="47" fill="rgb(205,219,223)"/><rect x="154" y="538" width="47" height="47" fill="rgb(195,212,217)"/><rect x="203" y="538" width="47" height="47" fill="rgb(182,203,209)"/><rect x="252" y="538" width="47" height="47" fill="rgb(167,191,198)"/><rect x="301" y="538" width="47" height="47" fill="rgb(147,177,186)"/><rect x="350" y="538" width="47" height="47" fill="rgb(123,159,170)"/><rect x="399" y="538" width="47" height="47" fill="rgb(93,137,150)"/><rect x="448" y="538" width="47" height="47" fill="rgb(55,109,125)"/><text x="128" y="625" font-size="24" fill="#74858a" text-anchor="middle">1</text><text x="88" y="226" font-size="24" fill="#74858a" text-anchor="end">1</text><text x="177" y="625" font-size="24" fill="#74858a" text-anchor="middle">2</text><text x="88" y="275" font-size="24" fill="#74858a" text-anchor="end">2</text><text x="226" y="625" font-size="24" fill="#74858a" text-anchor="middle">3</text><text x="88" y="324" font-size="24" fill="#74858a" text-anchor="end">3</text><text x="275" y="625" font-size="24" fill="#74858a" text-anchor="middle">4</text><text x="88" y="373" font-size="24" fill="#74858a" text-anchor="end">4</text><text x="324" y="625" font-size="24" fill="#74858a" text-anchor="middle">5</text><text x="88" y="422" font-size="24" fill="#74858a" text-anchor="end">5</text><text x="373" y="625" font-size="24" fill="#74858a" text-anchor="middle">6</text><text x="88" y="471" font-size="24" fill="#74858a" text-anchor="end">6</text><text x="422" y="625" font-size="24" fill="#74858a" text-anchor="middle">7</text><text x="88" y="520" font-size="24" fill="#74858a" text-anchor="end">7</text><text x="471" y="625" font-size="24" fill="#74858a" text-anchor="middle">8</text><text x="88" y="569" font-size="24" fill="#74858a" text-anchor="end">8</text><text x="630" y="205" font-size="27" fill="#19333c" text-anchor="start">均值方差 = 所有格子的总和 ÷ 64</text><text x="630" y="285" font-size="27" fill="#256b82" text-anchor="start">独立时只有 8 个对角格：0.125</text><text x="630" y="365" font-size="27" fill="#c0643c" text-anchor="start">相关时全部格子有贡献：0.604858</text><text x="630" y="445" font-size="30" fill="#19333c" text-anchor="start">精确方差比 ESS = 1.6533</text><text x="630" y="525" font-size="26" fill="#74858a" text-anchor="start">不是渐近公式给出的 8 ÷ 9。</text><text x="60" y="695" font-size="27" fill="#19333c" text-anchor="start">非对角格表示共享波动；相邻值看起来不同，也未必提供独立的均值信息。</text><text x="60" y="740" font-size="26" fill="#74858a" text-anchor="start">理论值要求平稳初始化；它不能证明实际 MCMC 已经探索所有模式。</text></g></svg>
