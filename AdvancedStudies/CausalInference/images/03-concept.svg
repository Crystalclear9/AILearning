<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>轨迹重要性权重的连乘</title><rect width="1200" height="850" fill="#f7fbfd" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="65" font-size="31" font-weight="bold" fill="#16344c">轨迹重要性权重的连乘</text><rect x="60" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="690.0" font-size="22" fill="#16344c">第 1 步策略比=2</text>
<rect x="625" y="640" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="690.0" font-size="22" fill="#16344c">第 2 步策略比=3</text>
<rect x="60" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="78" y="780.0" font-size="22" fill="#16344c">整条轨迹比=6</text>
<rect x="625" y="730" width="530" height="80" rx="12" fill="#eaf5f3" stroke="#b2cec9" /><text x="643" y="780.0" font-size="22" fill="#16344c">再用权重乘以相应回报</text>
<text x="90" y="150.0" fill="#16344c" font-size="21">轨迹密度比由时间步概率比相乘</text><rect x="130.0" y="425.5" width="140" height="101.5" fill="#118779" /><text x="130.0" y="563.25" fill="#16344c" font-size="21">第 1 步比值</text><text x="130.0" y="396.5" fill="#16344c" font-size="21">2</text><rect x="413.3" y="374.75" width="140" height="152.25" fill="#d86922" /><text x="413.3333333333333" y="563.25" fill="#16344c" font-size="21">第 2 步比值</text><text x="413.3333333333333" y="345.75" fill="#16344c" font-size="21">3</text><rect x="696.7" y="222.5" width="140" height="304.5" fill="#12816c" /><text x="696.6666666666666" y="563.25" fill="#16344c" font-size="21">乘积</text><text x="696.6666666666666" y="193.5" fill="#16344c" font-size="21">6</text></g></svg>
