<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img"><title>相同四条路径：轨迹权重与前缀权重怎样分工</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">相同四条路径：轨迹权重与前缀权重怎样分工</text><text x="60" y="123" font-size="27" fill="#183944" text-anchor="start">行为选 1 概率 0.2；目标选 1 概率 0.7；γ = 0.9。</text><text x="60" y="181" font-size="27" fill="#183944" text-anchor="start">两步奖励：R0 = A0，R1 = 2A1；动作 0、1 的概率比为 0.375、3.5。</text><text x="60" y="240" font-size="28" fill="#246b82" text-anchor="start">轨迹 IS = W1 (A0 + 1.8 A1)</text><text x="650" y="240" font-size="28" fill="#c0673e" text-anchor="start">PDIS = W0 A0 + 1.8 W1 A1</text><text x="95" y="319" font-size="26" fill="#183944" text-anchor="middle">A0A1</text><text x="275" y="319" font-size="26" fill="#183944" text-anchor="middle">行为概率</text><text x="480" y="319" font-size="26" fill="#183944" text-anchor="middle">W0</text><text x="665" y="319" font-size="26" fill="#183944" text-anchor="middle">W1</text><text x="875" y="319" font-size="26" fill="#183944" text-anchor="middle">轨迹 IS</text><text x="1100" y="319" font-size="26" fill="#183944" text-anchor="middle">PDIS</text><line x1="60" y1="407" x2="1200" y2="407" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="95" y="384" font-size="27" fill="#183944" text-anchor="middle">00</text><text x="275" y="384" font-size="27" fill="#183944" text-anchor="middle">0.64</text><text x="480" y="384" font-size="27" fill="#183944" text-anchor="middle">0.375</text><text x="665" y="384" font-size="27" fill="#183944" text-anchor="middle">0.140625</text><text x="875" y="384" font-size="27" fill="#246b82" text-anchor="middle">0</text><text x="1100" y="384" font-size="27" fill="#c0673e" text-anchor="middle">0</text><line x1="60" y1="482" x2="1200" y2="482" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="95" y="459" font-size="27" fill="#183944" text-anchor="middle">01</text><text x="275" y="459" font-size="27" fill="#183944" text-anchor="middle">0.16</text><text x="480" y="459" font-size="27" fill="#183944" text-anchor="middle">0.375</text><text x="665" y="459" font-size="27" fill="#183944" text-anchor="middle">1.3125</text><text x="875" y="459" font-size="27" fill="#246b82" text-anchor="middle">2.3625</text><text x="1100" y="459" font-size="27" fill="#c0673e" text-anchor="middle">2.3625</text><line x1="60" y1="557" x2="1200" y2="557" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="95" y="534" font-size="27" fill="#183944" text-anchor="middle">10</text><text x="275" y="534" font-size="27" fill="#183944" text-anchor="middle">0.16</text><text x="480" y="534" font-size="27" fill="#183944" text-anchor="middle">3.5</text><text x="665" y="534" font-size="27" fill="#183944" text-anchor="middle">1.3125</text><text x="875" y="534" font-size="27" fill="#246b82" text-anchor="middle">1.3125</text><text x="1100" y="534" font-size="27" fill="#c0673e" text-anchor="middle">3.5</text><line x1="60" y1="632" x2="1200" y2="632" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="95" y="609" font-size="27" fill="#183944" text-anchor="middle">11</text><text x="275" y="609" font-size="27" fill="#183944" text-anchor="middle">0.04</text><text x="480" y="609" font-size="27" fill="#183944" text-anchor="middle">3.5</text><text x="665" y="609" font-size="27" fill="#183944" text-anchor="middle">12.25</text><text x="875" y="609" font-size="27" fill="#246b82" text-anchor="middle">34.3</text><text x="1100" y="609" font-size="27" fill="#c0673e" text-anchor="middle">25.55</text><text x="60" y="721" font-size="28" fill="#183944" text-anchor="start">按行为概率平均：两者期望都为 1.96；不能把四行等权平均。</text><text x="60" y="781" font-size="27" fill="#183944" text-anchor="start">第一步奖励不需要未来比率；第二步奖励仍须保留两步累计比率。</text></g></svg>
