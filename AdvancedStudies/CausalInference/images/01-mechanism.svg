"770" y2="220" stroke="#d9e1e8" stroke-width="2" stroke-dasharray=""/><text x="135" y="228" font-size="28.56px" fill="#47586b" text-anchor="end">1</text><text x="75" y="190" font-size="34.83px" fill="#1c2e40" text-anchor="start">成功率</text><text x="250" y="800" font-size="36.12px" fill="#1c2e40" text-anchor="middle">对照</text><text x="700" y="800" font-size="36.12px" fill="#1c2e40" text-anchor="middle">处理</text><line x1="250" y1="636.0" x2="700" y2="584.0" stroke="#166383" stroke-width="3" stroke-dasharray=""/><circle cx="250" cy="636.0" r="10.73312629199899" fill="#166383" fill-opacity=".18" stroke="#166383" stroke-width="3"/><circle cx="250" cy="636.0" r="7" fill="#166383"/><circle cx="700" cy="584.0" r="32.19937887599697" fill="#166383" fill-opacity=".18" stroke="#166383" stroke-width="3"/><circle cx="700" cy="584.0" r="7" fill="#166383"/><line x1="250" y1="324.0" x2="700" y2="272.0" stroke="#b06033" stroke-width="3" stroke-dasharray=""/><circle cx="250" cy="324.0" r="32.19937887599697" fill="#b06033" fill-opacity=".18" stroke="#b06033" stroke-width="3"/><circle cx="250" cy="324.0" r="7" fill="#b06033"/><circle cx="700" cy="272.0" r="10.73312629199899" fill="#b06033" fill-opacity=".18" stroke="#b06033" stroke-width="3"/><circle cx="700" cy="272.0" r="7" fill="#b06033"/><line fill="none" stroke="#1c2e40" stroke-width="4" x1="250" y1="355.2" x2="700" y2="552.8"/><circle cx="250" cy="355.2" r="7" fill="#1c2e40"/><circle cx="700" cy="552.8" r="7" fill="#1c2e40"/><line x1="250" y1="480.0" x2="700" y2="428.0" stroke="#398076" stroke-width="4" stroke-dasharray="10 8"/><circle cx="250" cy="480.0" r="7" fill="#398076"/><circle cx="700" cy="428.0" r="7" fill="#398076"/><text x="820" y="270" font-size="36.12px" fill="#217292" text-anchor="start">低成功率层</text><text x="820" y="315" font-size="33.54px" fill="#217292" text-anchor="start">0.2 → 0.3，增加 0.1</text><text x="820" y="390" font-size="36.12px" fill="#a8603a" text-anchor="start">高成功率层</text><text x="820" y="435" font-size="