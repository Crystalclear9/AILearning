<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>同层处理成功率更高，总体却因组成不同而反向</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19333c" text-anchor="start">同层处理成功率更高，总体却因组成不同而反向</text><text x="60" y="115" font-size="26" fill="#74858a" text-anchor="start">每组 200 人；蓝色为成功，浅色为未成功；条形总长表示该层人数</text><text x="300" y="185" font-size="30" fill="#256b82" text-anchor="start">处理组</text><text x="60" y="285" font-size="27" fill="#19333c" text-anchor="start">低成功率层</text><rect x="300" y="250" width="360" height="65" fill="#e8eff0"/><rect x="300" y="250" width="108" height="65" fill="#256b82"/><text x="300" y="360" font-size="27" fill="#19333c" text-anchor="start">54 成功，共 180 人；成功率 0.3</text><text x="60" y="445" font-size="27" fill="#19333c" text-anchor="start">高成功率层</text><rect x="300" y="410" width="40" height="65" fill="#e8eff0"/><rect x="300" y="410" width="36" height="65" fill="#256b82"/><text x="300" y="520" font-size="27" fill="#19333c" text-anchor="start">18 成功，共 20 人；成功率 0.9</text><text x="800" y="185" font-size="30" fill="#c0643c" text-anchor="start">对照组</text><text x="60" y="285" font-size="27" fill="#19333c" text-anchor="start">低成功率层</text><rect x="800" y="250" width="40" height="65" fill="#e8eff0"/><rect x="800" y="250" width="8" height="65" fill="#256b82"/><text x="800" y="360" font-size="27" fill="#19333c" text-anchor="start">4 成功，共 20 人；成功率 0.2</text><text x="60" y="445" font-size="27" fill="#19333c" text-anchor="start">高成功率层</text><rect x="800" y="410" width="360" height="65" fill="#e8eff0"/><rect x="800" y="410" width="288" height="65" fill="#256b82"/><text x="800" y="520" font-size="27" fill="#19333c" text-anchor="start">144 成功，共 180 人；成功率 0.8</text><line x1="60" y1="590" x2="1220" y2="590" stroke="#dce4e5" stroke-width="2"/><text x="60" y="645" font-size="27" fill="#19333c" text-anchor="start">粗比较：处理成功率 0.36，对照成功率 0.74，差 −0.38。</text><text x="60" y="695" font-size="27" fill="#256b82" text-anchor="start">统一到两层各半：处理 0.60，对照 0.50，标准化差 0.10。</text><text x="60" y="740" font-size="25" fill="#74858a" text-anchor="start">人数与成功数为相容的教学构造；因果解释仍要求相应识别假设。</text></g></svg>
