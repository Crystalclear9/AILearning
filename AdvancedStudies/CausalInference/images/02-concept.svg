<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>稀有处理：无偏均值与一份典型数据可以相差很大</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19333c" text-anchor="start">稀有处理：无偏均值与一份典型数据可以相差很大</text><text x="60" y="115" font-size="26" fill="#74858a" text-anchor="start">n = 200，真实倾向 e = 0.01；处理结果恒为 5，K 为被处理人数</text><rect x="125" y="404.41829262783443" width="70" height="120.58170737216555" fill="#c0643c"/><text x="160" y="389.41829262783443" font-size="25" fill="#c0643c" text-anchor="middle">0.134</text><text x="160" y="568" font-size="25" fill="#74858a" text-anchor="middle">0</text><rect x="240" y="281.4005911673423" width="70" height="243.59940883265767" fill="#256b82"/><text x="275" y="266.4005911673423" font-size="25" fill="#256b82" text-anchor="middle">0.271</text><text x="275" y="568" font-size="25" fill="#74858a" text-anchor="middle">1</text><rect x="355" y="280.1702911227329" width="70" height="244.82970887726705" fill="#256b82"/><text x="390" y="265.1702911227329" font-size="25" fill="#256b82" text-anchor="middle">0.272</text><text x="390" y="568" font-size="25" fill="#74858a" text-anchor="middle">2</text><rect x="470" y="361.78019408182195" width="70" height="163.21980591817805" fill="#256b82"/><text x="505" y="346.78019408182195" font-size="25" fill="#256b82" text-anchor="middle">0.181</text><text x="505" y="568" font-size="25" fill="#74858a" text-anchor="middle">3</text><rect x="585" y="443.80226826797707" width="70" height="81.1977317320229" fill="#256b82"/><text x="620" y="428.80226826797707" font-size="25" fill="#256b82" text-anchor="middle">0.090</text><text x="620" y="568" font-size="25" fill="#74858a" text-anchor="middle">4</text><rect x="700" y="492.8489789505525" width="70" height="32.151021049447465" fill="#256b82"/><text x="735" y="477.8489789505525" font-size="25" fill="#256b82" text-anchor="middle">0.036</text><text x="735" y="568" font-size="25" fill="#74858a" text-anchor="middle">5</text><rect x="815" y="514.4453718777066" width="70" height="10.554628122293359" fill="#256b82"/><text x="850" y="499.44537187770663" font-size="25" fill="#256b82" text-anchor="middle">0.012</text><text x="850" y="568" font-size="25" fill="#74858a" text-anchor="middle">6</text><rect x="930" y="522.0453133395023" width="70" height="2.954686660497708" fill="#256b82"/><text x="965" y="507.0453133395023" font-size="25" fill="#256b82" text-anchor="middle">0.003</text><text x="965" y="568" font-size="25" fill="#74858a" text-anchor="middle">7</text><text x="80" y="185" font-size="28" fill="#19333c" text-anchor="start">K 的精确二项概率</text><text x="1050" y="570" font-size="27" fill="#19333c" text-anchor="start">K</text><text x="60" y="630" font-size="27" fill="#19333c" text-anchor="start">处理均值的 HT 估计 = 2.5 K；E[K] = 2，所以重复抽样均值为 5。</text><text x="60" y="685" font-size="27" fill="#c0643c" text-anchor="start">但 K = 0 的概率约 0.134：这些数据集给出估计 0，而不是 5。</text><text x="60" y="735" font-size="26" fill="#74858a" text-anchor="start">总体上满足正性，并不保证每一份有限数据都含有处理样本。</text></g></svg>
