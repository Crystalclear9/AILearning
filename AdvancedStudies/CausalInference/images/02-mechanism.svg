<text x="1190" y="531" font-size="27" fill="#a45e39" text-anchor="start">→ 本折得分</text>
<text x="340" y="630" font-size="27" fill="#277290" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">蓝：训练输入</text>
<text x="780" y="630" font-size="27" fill="#a45e39" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">橙：只预测与评分</text>
<line x1="60" y1="670" x2="1380" y2="670" stroke="#e0e7ed" stroke-width="2" stroke-dasharray=""/>
<text x="60" y="725" font-size="30" fill="#213747" text-anchor="start">展开第 3 折中的一条记录：</text>
<text x="60" y="775" font-size="29" fill="#213747" text-anchor="start">观察 A=1，Y=3</text>
<text x="60" y="825" font-size="29" fill="#213747" text-anchor="start">折外预测 m1=2，m0=1，e=0.25</text>
<text x="740" y="720" font-size="29" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">该条增广得分</text>
<rect x="745" y="755" width="105" height="64" rx="3" fill="url(#book-wash-edf5f8)" stroke="#277290" stroke-dasharray=""/>
<text x="797" y="796" font-size="30" fill="#277290" text-anchor="middle">1</text>
<rect x="850" y="755" width="420" height="64" rx="3" fill="url(#book-wash-fff1e7)" stroke="#ba6b41" stroke-dasharray=""/>
<text x="1060" y="796" font-size="30" fill="#9f5b38" text-anchor="middle">+ 4</text>
<text x="745" y="860" font-size="27" fill="#277290" text-anchor="start">回归差 2−1</text>
<text x="1120" y="860" font-size="26" fill="#a45e39" text-anchor="middle">残差修正 (3−2)÷0.25</text>
<text x="1290" y="797" font-size="30" fill="#213747" text-anchor="start">= 5</text>
<text x="60" y="930" font-size="28" fill="#213747" text-anchor="start">每条记录只计一次 → 平均 6000 条得分；训练集重叠仍会带来共享随机性。</text>
