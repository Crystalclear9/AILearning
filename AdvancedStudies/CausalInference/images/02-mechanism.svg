<svg xmlns="http://www.w3.org/2000/svg" width="1494.72" height="1054.72" viewBox="-27.36 -27.36 1494.72 1054.72" role="img" aria-labelledby="plate-title"><defs><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="plate-title">交叉拟合让打分使用未参与拟合的样本</title><rect id="edition-paper" x="-27.36" y="-27.36" width="1494.72" height="1054.72" fill="#ffffff"/><svg id="edition-view" x="0" y="0" width="1440" height="1000" viewBox="0 0 1440 1000" overflow="hidden"><rect width="1440" height="1000" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif">
<text x="55" y="65" font-size="38" fill="#213747" text-anchor="start">交叉拟合：每条得分只接收“没有用过自己”的那轮预测</text>
<text x="60" y="125" font-size="29" fill="#213747" text-anchor="start">6000 个独立单位；5 折各 1200；每轮其余 4800 拟合全部辅助函数</text>
<text x="400" y="190" font-size="28" fill="#213747" text-anchor="middle">折 1</text>
