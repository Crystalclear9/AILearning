<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="918" viewBox="0 0 960 918" role="img" aria-labelledby="artwork-title"><title id="artwork-title">零散度旋转场在显式Euler下产生体积膨胀，隐式中点保体积但仍有相位误差</title><defs><clipPath id="artwork-view"><rect x="25" y="114" width="910" height="782.960208"/></clipPath></defs><rect width="960" height="918" fill="#ffffff"/><text x="25" y="41" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">零散度旋转场在显式Euler下产生体积膨胀，隐式中点保体积但</text><text x="25" y="79" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#182c43">仍有相位误差</text><line x1="25" x2="935" y1="97" y2="97" stroke="#cbd9e5" stroke-width="1.4"/><g clip-path="url(#artwork-view)"><g transform="translate(25 114) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>连续零散度旋转场与Euler离散映射的体积和密度差异</title><svg width="1440" height="788.973" viewBox="0 68.333333 1200 657.477478" role="img"><rect id="offline-white-background" x="0" y="68.333333" width="1200" height="657.477478" fill="#ffffff"/><title>连续零散度旋转场与Euler离散映射的体积和密度差异</title><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="28" fill="#4d7595" text-anchor="start" font-weight="normal">旋转场 v(x,y) = (−y,x)；总时间 1，四步更新，步长 0.25</text><circle cx="320" cy="390" r="203.203125" fill="none" stroke="#b75f27" stroke-width="4"/><circle cx="320" cy="390" r="180" fill="none" stroke="#1571a8" stroke-width="4"/><line x1="95" y1="390" x2="545" y2="390" stroke="#d9e1e8" stroke-width="2"/><line