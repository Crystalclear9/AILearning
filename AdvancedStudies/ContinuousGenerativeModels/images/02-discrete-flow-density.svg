="#af6033" text-anchor="middle">1.000000</text><text x="65" y="442" font-size="36.12px" fill="#1d3145" text-anchor="start">显式Euler：总角0.979915，体积1.274429；同为4步、步长0.25。</text></g></g></g></g></g></svg>