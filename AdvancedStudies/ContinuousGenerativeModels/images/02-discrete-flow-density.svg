777,243.638 423.293,242.587 421.799,241.551 420.294,240.531 418.779,239.525 417.254,238.535"/><circle cx="417.25441505626515" cy="238.53522273457864" r="7" fill="#1571a8"/><text x="320" y="658" font-size="28" fill="#20364c" text-anchor="middle" font-weight="bold">同一个单位圆的终点像</text><text x="700" y="212" font-size="30" fill="#2273b6" text-anchor="start" font-weight="bold">精确流 / 隐式中点</text><text x="700" y="259" font-size="27" fill="#2273b6" text-anchor="start" font-weight="normal">圆半径 1；协方差保持 I</text><text x="700" y="337" font-size="30" fill="#aa602e" text-anchor="start" font-weight="bold">显式 Euler</text><text x="700" y="384" font-size="27" fill="#aa602e" text-anchor="start" font-weight="normal">圆半径 1.12890625</text><text x="700" y="428" font-size="27" fill="#aa602e" text-anchor="start" font-weight="normal">协方差变为 1.274429 I</text><text x="700" y="502" font-size="28" fill="#20364c" text-anchor="start" font-weight="normal">连续散度积分：0</text><text x="700" y="548" font-size="26" fill="#20364c" text-anchor="start" font-weight="normal">Euler 的 log |det J|：0.242498</text><text x="700" y="611" font-size="26" fill="#aa602e" text-anchor="start" font-weight="normal">实际推送密度须扣除此项</text><line x1="60" y1="704" x2="1140" y2="704" stroke="#d9e1e8" stroke-width="2"/></g><desc> 隐式中点在此保持半径与体积，但旋转角度仍有误差，粒子并非精确轨迹。 蓝圈：精确流与中点的终点集合；橙圈与折线：Euler 的膨胀与四步轨迹。</desc></svg>
